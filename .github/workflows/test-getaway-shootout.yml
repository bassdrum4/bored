name: Verify Getaway Shootout Unity boot
on:
  push:
    branches: [main]
    paths:
      - tests/getaway-shootout.test.cjs
      - tests/getaway-scene-boot.cjs
      - src/games/content/getaway-shootout.html
      - src/prototypes/getaway-shootout/patch-menu.py
      - .github/workflows/test-getaway-shootout.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet Pillow
      - name: Verify original Unity loading and code integrity
        run: node --test tests/getaway-shootout.test.cjs
      - name: Verify title stays visible and Play transitions away from title
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tests/getaway-scene-boot.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: getaway-playthrough-screenshots
          path: _build/getaway-shootout/*.png
          if-no-files-found: ignore
          retention-days: 2
