name: Verify Getaway Shootout Unity boot
on:
  push:
    branches: [main]
    paths:
      - tests/getaway-shootout.test.cjs
      - .github/workflows/test-getaway-shootout.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify code and boot the original Unity build in Chromium
        run: node --test tests/getaway-shootout.test.cjs
