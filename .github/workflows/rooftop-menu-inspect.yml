name: Verify Rooftop Snipers clean menu
on:
  push:
    branches: [fix/rooftop-menu-cleanup]
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'UnityPy==1.25.4'
      - name: Disable unwanted Unity UI objects
        run: python scripts/rooftop-hide-menu-buttons.py
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Test Unity boot and Bored controls
        run: npm run test:rooftop
      - name: Test random-only gameplay patch
        run: node --test tests/rooftop-random-only.test.cjs
      - name: Commit only verified Unity asset and pin
        run: |
          if ! git diff --quiet -- src/games/content/rooftop-snipers.html tests/rooftop-snipers.test.cjs; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/games/content/rooftop-snipers.html tests/rooftop-snipers.test.cjs
            git commit -m "fix: hide Rooftop Snipers title-screen promotion buttons"
            git push origin HEAD:refs/heads/fix/rooftop-menu-cleanup
          fi
