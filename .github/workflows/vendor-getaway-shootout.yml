name: Vendor Getaway Shootout runtime

# One-time self-hosting import. Delete this workflow after the asset commit.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/vendor-getaway-shootout.yml

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Download and verify the pinned original Unity WebGL export
        shell: bash
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/mamayaya1/game/f3a882424a8f28d07bdf456b251d889725c4c1e4/projects/getaway-shootout"
          dest="src/games/content/getaway-shootout"
          mkdir -p "$dest/unity" "$dest/Build"
          while read -r sha rel; do
            [ -n "$sha" ] || continue
            mkdir -p "$dest/$(dirname "$rel")"
            curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
              "$base/$rel" -o "$dest/$rel.tmp"
            actual="$(git hash-object "$dest/$rel.tmp")"
            if [ "$actual" != "$sha" ]; then
              echo "::error::$rel failed integrity check: $actual"
              exit 1
            fi
            mv "$dest/$rel.tmp" "$dest/$rel"
          done <<'ASSETS'
          6627aaea00b3233a7f3536bb0394eef0f552e5af unity/GetawayShootout.asm.framework.unityweb
          14e285882fb6eab2838a32528198f40cefa8d390 unity/GetawayShootout.asm.memory.unityweb
          905c4b732d31a7acfa408dd88b726d42fee79026 unity/GetawayShootout.asm.code.unityweb
          33abea31f9c7cb806058eed40c105ce7462dbb93 unity/GetawayShootout.data.unityweb
          7f2f57d64b1bf183b3727a8a73512e6deb78e6f2 Build/UnityLoader.js
          ASSETS
          git add "$dest"
          if git diff --cached --quiet; then
            echo "Unity assets already present and verified."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: self-host pinned Getaway Shootout Unity game files"
          git push origin HEAD:main
