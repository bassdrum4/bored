name: Patch Getaway Shootout original Unity menus
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-getaway-menu.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Disable non-game branding in Unity scene and verify gameplay menus
        run: |
          python -m pip install --quiet UnityPy==1.25.4
          python src/prototypes/getaway-shootout/patch-menu.py
          python src/prototypes/getaway-shootout/inspect-game.py
          python - <<'PY'
          from pathlib import Path
          p=Path('src/prototypes/getaway-shootout/scene-gameobjects.tsv')
          rows={s.split('\t')[2]:s.split('\t')[3] for s in p.read_text().splitlines()[1:] if len(s.split('\t'))==4}
          for name in ('Branding_TwoPlayerGamesOrg','NewEichGames','two_logo'):
              assert rows.get(name)=='0', f'{name} is still active'
          assert rows.get('Play')=='1'
          assert rows.get('OnePlayer')=='1'
          assert rows.get('Two Player')=='1'
          print('Verified: branding disabled; gameplay menu active')
          PY
      - name: Publish verified scene patch for review
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/games/content/getaway-shootout/unity/GetawayShootout.data.unityweb src/prototypes/getaway-shootout/scene-gameobjects.tsv
          git commit -m "fix: remove embedded Getaway Shootout title branding in Unity scene"
          git push origin HEAD:refs/heads/agent/getaway-shootout-clean-menu
