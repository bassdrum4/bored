name: Verify and deploy Bored

# The site is the src/ folder, served as written: index.html, main.js, the hub
# and game modules, the game documents and the preview images. There is no build
# step and nothing is committed back to the branch.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # A hung job would otherwise hold the `pages` group and delay every later
    # push, so both jobs are bounded.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run browser and logic tests
        run: npm test

  deploy:
    # Every push to main deploys; a pull request only runs the tests above.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # The hub asks for game documents with this stamp in the query string, so
      # every push to main publishes new URLs instead of Pages' ten-minute cache.
      - name: Stamp the deploy with its commit
        run: |
          printf '{"commit":"%s","published":"%s"}\n' \
            "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > src/version.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: src
      - id: deployment
        uses: actions/deploy-pages@v4
