name: Publish Bored

# Deploy every push to main. Browser regression checks run separately and
# cannot hold a newer publish hostage if Chrome fails to start.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only one Pages deployment at a time. A burst of pushes eventually ships the
# newest main, without cancelling an active Pages upload halfway through.
concurrency:
  group: bored-pages
  cancel-in-progress: false

jobs:
  deploy:
    # Publish the main source tree after refreshing the generated changelog.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The changelog generator needs complete history, not a shallow clone.
          fetch-depth: 0
      - uses: actions/configure-pages@v5
      - name: Regenerate changelog from main history
        run: node scripts/changelog.mjs
      # The hub asks for game documents with this stamp in the query string, so
      # every push to main publishes new URLs instead of Pages' ten-minute cache.
      - name: Stamp the deploy with its commit
        run: |
          printf '{"commit":"%s","published":"%s"}\n' \
            "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > src/version.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: src
      - id: deployment
        uses: actions/deploy-pages@v4
