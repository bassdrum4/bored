name: Publish Bored

# Deploy every push to main. Browser regression checks run separately and
# cannot hold a newer publish hostage if Chrome fails to start.
on:
  push:
    branches: [main]
  schedule:
    # The upstream reveal is available after midnight Eastern.
    - cron: '25 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Only one Pages deployment at a time. A burst of pushes eventually ships the
# newest main, without cancelling an active Pages upload halfway through.
concurrency:
  group: bored-pages
  cancel-in-progress: false

jobs:
  # Only the scheduled/manual build can write generated data. A normal push
  # has no write token and never contacts the upstream Krillion API.
  krillion:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Build and persist verified daily assets
        run: bash scripts/krillion-publish.sh build

  build:
    needs: krillion
    # Publish the main source tree after refreshing the generated changelog.
    # A failed scheduled build must not replace the live site. Push builds
    # proceed when the daily job was intentionally skipped.
    if: always() && !cancelled() && github.ref == 'refs/heads/main' && (needs.krillion.result == 'success' || needs.krillion.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    outputs:
      artifact: ${{ steps.artifact-name.outputs.name }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The changelog generator needs complete history, not a shallow clone.
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/configure-pages@v5
      - name: Restore validated Krillion assets (read-only)
        run: bash scripts/krillion-publish.sh restore
      - name: Regenerate changelog from main history
        run: node scripts/changelog.mjs
      # The hub asks for game documents with this stamp in the query string, so
      # every push to main publishes new URLs instead of Pages' ten-minute cache.
      - name: Stamp the deploy with its commit
        run: |
          printf '{"commit":"%s","published":"%s"}\n' \
            "$(git rev-parse HEAD)" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > src/version.json
      # A unique name also avoids duplicate artifacts on full workflow re-runs.
      - name: Name artifact for this build attempt
        id: artifact-name
        run: echo "name=github-pages-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: src
          name: ${{ steps.artifact-name.outputs.name }}

  deploy:
    needs: build
    # A push intentionally skips the Krillion job. Its skipped result must
    # not propagate through a successful build and suppress deployment.
    if: always() && !cancelled() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      actions: read
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url || steps.retry1.outputs.page_url || steps.retry2.outputs.page_url || steps.retry3.outputs.page_url }}
    steps:
      # Upload completion and the REST artifact list do not guarantee that
      # deploy-pages' artifact service can see the archive yet. Keep upload
      # and deployment in separate jobs and retry the actual deployment
      # without re-uploading or duplicating the artifact.
      - name: Publish Pages
        id: publish
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.build.outputs.artifact }}
      - name: Wait for artifact propagation (15s)
        if: steps.publish.outcome == 'failure'
        run: sleep 15
      - name: Retry Pages deployment
        id: retry1
        if: steps.publish.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.build.outputs.artifact }}
      - name: Wait for artifact propagation (30s)
        if: steps.retry1.outcome == 'failure'
        run: sleep 30
      - name: Retry Pages deployment again
        id: retry2
        if: steps.retry1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.build.outputs.artifact }}
      - name: Wait for artifact propagation (60s)
        if: steps.retry2.outcome == 'failure'
        run: sleep 60
      - name: Final Pages deployment attempt
        id: retry3
        if: steps.retry2.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.build.outputs.artifact }}
