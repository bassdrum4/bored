name: Publish Bored

# Deploy every push to main. Browser regression checks run separately and
# cannot hold a newer publish hostage if Chrome fails to start.
on:
  push:
    branches: [main]
  schedule:
    # The upstream reveal is available after midnight Eastern.
    - cron: '25 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Only one Pages deployment at a time. A burst of pushes eventually ships the
# newest main, without cancelling an active Pages upload halfway through.
concurrency:
  group: bored-pages
  cancel-in-progress: false

jobs:
  # Only the scheduled/manual build can write generated data. A normal push
  # has no write token and never contacts the upstream Krillion API.
  krillion:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Build and persist verified daily assets
        run: bash scripts/krillion-publish.sh build

  deploy:
    needs: krillion
    # Publish the main source tree after refreshing the generated changelog.
    # A failed scheduled build must not replace the live site. Push builds
    # proceed when the daily job was intentionally skipped.
    if: always() && !cancelled() && github.ref == 'refs/heads/main' && (needs.krillion.result == 'success' || needs.krillion.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      actions: read
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The changelog generator needs complete history, not a shallow clone.
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/configure-pages@v5
      - name: Restore validated Krillion assets (read-only)
        run: bash scripts/krillion-publish.sh restore
      - name: Regenerate changelog from main history
        run: node scripts/changelog.mjs
      # The hub asks for game documents with this stamp in the query string, so
      # every push to main publishes new URLs instead of Pages' ten-minute cache.
      - name: Stamp the deploy with its commit
        run: |
          printf '{"commit":"%s","published":"%s"}\n' \
            "$(git rev-parse HEAD)" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > src/version.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: src
      # Artifact metadata can lag behind a successful upload. Pages' deploy
      # action fails immediately if the artifact is not yet listed by the API.
      - name: Wait for Pages artifact registration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            if count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length') && [ "$count" = 1 ]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Pages artifact did not become visible after upload"
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
