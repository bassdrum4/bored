name: Strip remaining Getaway Shootout branding
on:
  push:
    branches: [main]
    paths: [.github/workflows/strip-getaway-branding.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  strip:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: python -m pip install --quiet UnityPy==1.25.4 Pillow
      - name: Remove logo pixels but preserve live splash scene and transitions
        shell: bash
        run: |
          set -euo pipefail
          python src/prototypes/getaway-shootout/strip-branding.py
          python src/prototypes/getaway-shootout/inspect-game.py
          python - <<'PY'
          from pathlib import Path
          rows=[s.split('\t') for s in Path('src/prototypes/getaway-shootout/scene-gameobjects.tsv').read_text().splitlines()[1:]]
          d={}
          for f in rows:
              if len(f)==4:d.setdefault(f[2],[]).append(f[3])
          assert d['two_logo']==['1'], 'Required startup object deactivated'
          for name in ('Play','OnePlayer','Two Player','Settings'):
              assert '1' in d[name], (name,d.get(name))
          for name in ('Branding_TwoPlayerGamesOrg','Branding_CrazyGames','Branding_Silvergames','NewEichGames','Mobile'):
              assert '0' in d[name] and '1' not in d[name], (name,d.get(name))
          print('UI scene objects validated')
          PY
      - name: Test gameplay and scene transition after removing splash graphics
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          node tests/getaway-scene-boot.cjs
          node --test tests/getaway-shootout.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: getaway-branding-strip-screenshots
          path: _build/getaway-shootout/*.png
          if-no-files-found: ignore
          retention-days: 2
      - name: Submit changed Unity binary through a PR
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/games/content/getaway-shootout/unity/GetawayShootout.data.unityweb
          git commit -m "fix: remove remaining outside logos in actual Getaway Shootout assets"
          git push origin HEAD:refs/heads/agent/getaway-remove-all-branding
