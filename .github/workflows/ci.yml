name: Check Bored

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    permissions:
      contents: write # temporary, for the Rooftop Snipers regeneration branch
    # Pinned to the current LTS image: `ubuntu-latest` is mid-rollout to 26.04
    # (Oct 19 – Nov 19, 2026), and browser runs flip between images otherwise.
    runs-on: ubuntu-24.04
    # Headless Chrome startup can occasionally fail; fail rather than hang.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Rebuild and test original Rooftop Snipers with random-only rounds
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/rooftop-random-only'
        run: |
          git fetch origin refs/heads/fix/rooftop-random-only
          git checkout -B fix/rooftop-random-only FETCH_HEAD
          node scripts/rooftop-apply-and-build.mjs
          git config user.name "bored-automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/prototypes/rooftop-snipers/source/rooftop-snipers.code.js src/games/content/rooftop-snipers.html tests/rooftop-snipers.test.cjs
          if ! git diff --cached --quiet; then
            git commit -m "Make all Rooftop Snipers rounds randomized"
            git push origin HEAD:fix/rooftop-random-only
          fi
      - name: Run browser and logic tests
        run: npm test

  together-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: bored_test_only
          POSTGRES_DB: bored_together_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Exercise concurrent transactions in an empty disposable database
        env:
          BT_TEST_DATABASE_URL: postgres://postgres:bored_test_only@localhost:5432/bored_together_test
        run: node --test tests/together-postgres.test.cjs
      - name: Live games - the room's SQL and room codes, then browsers playing against it
        env:
          BT_TEST_DATABASE_URL: postgres://postgres:bored_test_only@localhost:5432/bored_together_test
        run: node --test tests/together-live.test.cjs tests/room-codes.test.cjs tests/live-browser.test.cjs
      - name: Civ Lite cloud saves - the SQL, then several browsers on one account
        env:
          BT_TEST_DATABASE_URL: postgres://postgres:bored_test_only@localhost:5432/bored_together_test
        run: node --test tests/game-saves.test.cjs tests/saves-browser.test.cjs
