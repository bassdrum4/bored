name: Check Bored

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 10 * * *'

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      full: ${{ steps.scope.outputs.full }}
      games: ${{ steps.scope.outputs.games }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          sparse-checkout: scripts
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci-scope.mjs

  test:
    # Always run a required test job; if classification fails, run everything.
    needs: scope
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify CI policy, shared hub smoke and Relic Song score contract
        run: node --test tests/ci-scope.test.cjs tests/ci-browser-smoke.test.cjs
      - name: Full browser and logic suite
        if: needs.scope.result != 'success' || needs.scope.outputs.full != 'false'
        run: |
          npm test
          node --test tests/relic-song.test.cjs
      - name: Game-scoped tests plus shared contracts
        if: needs.scope.result == 'success' && needs.scope.outputs.full == 'false'
        env:
          CHANGED_GAMES: ${{ needs.scope.outputs.games }}
        run: |
          npm run games:check
          node scripts/gacha-dex.mjs --check
          node --test tests/backend-safety.test.cjs tests/player-state.test.cjs tests/saves-bridge.test.cjs
          for game in $CHANGED_GAMES; do
            case "$game" in
              poke-idle|relic-song|shotgun-roulette) node --test "tests/$game.test.cjs" || exit $? ;;
              *) echo "Unknown scope; refusing to skip tests"; exit 1 ;;
            esac
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-diagnostics
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 5

  together-postgres:
    needs: scope
    if: ${{ always() && !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.full != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: bored_test_only
          POSTGRES_DB: bored_together_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Exercise concurrent transactions in an empty disposable database
        env:
          BT_TEST_DATABASE_URL: postgres://postgres:bored_test_only@localhost:5432/bored_together_test
        run: node --test tests/together-postgres.test.cjs
      - name: Live games - the room's SQL and room codes, then browsers playing against it
        env:
          BT_TEST_DATABASE_URL: postgres://postgres:bored_test_only@localhost:5432/bored_together_test
        run: node --test tests/together-live.test.cjs tests/room-codes.test.cjs tests/live-browser.test.cjs
      - name: Civ Lite cloud saves - the SQL, then several browsers on one account
        env:
          BT_TEST_DATABASE_URL: postgres://postgres:bored_test_only@localhost:5432/bored_together_test
        run: node --test tests/game-saves.test.cjs tests/saves-browser.test.cjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: postgres-browser-diagnostics
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 5
