name: Warm Krillion daily
on:
  schedule:
    # 12:45 AM Eastern in winter, 1:45 AM in summer: the reveal lands at 00:10 and
    # the bank fills one prompt every couple of minutes after that.
    - cron: '45 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: krillion-daily-warm
  cancel-in-progress: false
jobs:
  warm:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Populate and verify today's server-side book
        env:
          KRILLION_URL: https://djdpttltfmwkofdrvkem.supabase.co/functions/v1/krillion/today
          KRILLION_PUBLIC_KEY: sb_publishable_Ayx7pzjm55vlzQ4u8se9KA_O97WK-QZ
        run: |
          set -euo pipefail
          expected="$(TZ=America/New_York date +%F)"
          for attempt in 1 2 3 4; do
            if curl -fsS --connect-timeout 8 --max-time 40 -H "apikey: $KRILLION_PUBLIC_KEY" "$KRILLION_URL" -o "$RUNNER_TEMP/krillion.json" &&
              jq -e --arg date "$expected" '.date == $date and .stale == false and (.prompts | length) == 7' "$RUNNER_TEMP/krillion.json" >/dev/null; then
              echo "Daily book cached for $expected"
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then sleep 45; fi
          done
          echo "Daily book unavailable for $expected" >&2
          exit 1
