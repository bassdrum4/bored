name: Audit Getaway external branding renderers
on:
  push:
    branches: [main]
    paths: [.github/workflows/audit-getaway-branding.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet UnityPy==1.25.4
      - run: python src/prototypes/getaway-shootout/audit-outside-branding.py
