name: Recover Getaway Shootout source
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/recover-getaway-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extract complete asm.js program and IL2CPP metadata
        run: |
          node src/prototypes/getaway-shootout/decompile.mjs
          node src/prototypes/getaway-shootout/decompile.mjs --check
          node --check src/prototypes/getaway-shootout/source/getaway-shootout.code.js
      - name: Inspect original Unity scene assets and actual UI controls
        run: |
          python -m pip install --quiet UnityPy==1.25.4
          python src/prototypes/getaway-shootout/inspect-game.py
      - name: Commit recovered source to separate branch for review
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/prototypes/getaway-shootout/
          git commit -m "feat: recover editable Getaway Shootout asm.js and scene index"
          git push origin HEAD:refs/heads/agent/getaway-shootout-source
