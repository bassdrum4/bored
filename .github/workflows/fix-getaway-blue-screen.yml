name: Fix Getaway Shootout blue-screen startup
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-getaway-blue-screen.yml
      - src/prototypes/getaway-shootout/patch-menu.py
      - tests/getaway-scene-boot.cjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - name: Install Unity editor parser and screenshot inspector
        run: python -m pip install --quiet UnityPy==1.25.4 Pillow
      - name: Recover pristine original Unity data and patch only external labels
        shell: bash
        run: |
          set -euo pipefail
          git show df8434e484ab8aa470b8df127c7e663c94c29a21:src/games/content/getaway-shootout/unity/GetawayShootout.data.unityweb > /tmp/getaway-original.unityweb
          GETAWAY_ORIGINAL_DATA=/tmp/getaway-original.unityweb python src/prototypes/getaway-shootout/patch-menu.py
          python src/prototypes/getaway-shootout/inspect-game.py
          python - <<'PY'
          from pathlib import Path
          names={}
          for row in Path('src/prototypes/getaway-shootout/scene-gameobjects.tsv').read_text().splitlines()[1:]:
              fields=row.split('\t')
              if len(fields)==4: names.setdefault(fields[2],[]).append(fields[3])
          for name in ('Branding_TwoPlayerGamesOrg','NewEichGames'):
              assert names[name]==['0'], (name,names[name])
          assert names['two_logo']==['1'], 'Splash scene object required by LoadSplash must remain active'
          print('Branding disabled, startup object preserved')
          PY
      - name: Reproduce initial menu / blue screen in real Chromium against original
        env:
          GETAWAY_ORIGINAL_DATA: /tmp/getaway-original.unityweb
          CHROME_PATH: /usr/bin/google-chrome
        run: node tests/getaway-scene-boot.cjs
      - name: Upload diagnostic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: getaway-blue-screen-debug
          path: _build/getaway-shootout/*.png
          if-no-files-found: ignore
          retention-days: 2
      - name: Push verified fix through review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/games/content/getaway-shootout/unity/GetawayShootout.data.unityweb src/prototypes/getaway-shootout/scene-gameobjects.tsv
          git commit -m "fix: restore Getaway Shootout splash scene while hiding portal branding"
          git push origin HEAD:refs/heads/agent/getaway-shootout-blue-screen-fix
