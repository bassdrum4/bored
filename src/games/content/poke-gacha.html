<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Poké Gacha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap">
<style>
/* Poké Gacha screens. One fixed internal resolution (640×384: a 40px tab bar
   and a 640×344 stage), scaled by the biggest quarter step that fits, pixelated. 384 high so 2x (1280×768)
   fits the ~790px game area of the Google Sites embed. Rules every screen keeps:
   - one panel style (.panel), one list style (.rows) with one ▶ cursor
   - spacing on a 4px grid, 8px margins and gaps everywhere
   - one pixel font for all text, Jersey 10 (OFL, in the spirit of PokéRogue's
     text, not a copy of it): body at 20px and headers at 30px, 2x and 3x its
     10px grid so it stays sharp; Bored's mono stack is the fallback. Numbers
     right-aligned
   - the eight colors below and nothing else; egg tiers are fixed colors
   - every sprite at 1x, centered in a 96px cell (the largest sprite is 96px) */
:root {
  --ink: #1c1b2c; --panel: #2c2a44; --red: #c8372f; --paper: #f4f1ff;
  --dim: #807c9a; --gold: #e3ad2b; --teal: #3f9e8a; --sky: #8fd3e8;
  --body: 20px; --title: 30px;
  --mono: ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace;
  --pixel: "Jersey 10", var(--mono);
}
* { margin: 0; padding: 0; box-sizing: border-box }
/* The frame is scaled by the biggest whole number that fits and centered; the
   scene canvas (#sky) covers the whole window at the same scale behind it, so
   the backdrop and the neighbouring machines run on past the frame's edges. */
html, body { height: 100% }
body { background: var(--ink); overflow: hidden }
#sky { position: fixed; left: 0; top: 0; transform-origin: 0 0 }
#wrap { position: fixed; left: 0; top: 0; overflow: hidden; outline: none; touch-action: manipulation; user-select: none }
#frame { position: absolute; left: 0; top: 0; width: 640px; height: 384px; transform-origin: 0 0;
         font: 400 var(--body)/20px var(--pixel); color: var(--paper);
         font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0 }
canvas, img { image-rendering: pixelated; display: block }
#stage { position: absolute; left: 0; top: 40px; width: 640px; height: 344px; overflow: hidden }

.panel { position: absolute; background: var(--panel); border: 2px solid var(--red); outline: 2px solid var(--ink); padding: 8px }
.title { font: 400 var(--title)/32px var(--pixel); margin-bottom: 4px }
.head { margin-bottom: 4px }
.num { color: var(--gold) }
.title .count { font: 400 var(--body)/32px var(--pixel) }
/* If the pixel font cannot load, the mono fallback goes back to its own sizes (it is wider). */
#frame.no-pixel { --body: 16px; --title: 24px; font-weight: 600 }
/* Menu rows in columns: how many vouchers, then the number of pulls right-aligned. */
.rows .c1 { display: inline-block; width: 36px }
.rows .c2 { display: inline-block; width: 22px; text-align: right; margin-right: 6px }
.dim { color: var(--dim) }
.gold { color: var(--gold) }
/* Lists scroll by whole 24px rows and never stop on a half-cut one. */
.scroll { overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--red) var(--panel); scroll-snap-type: y mandatory }
.scroll > * { scroll-snap-align: start }
.rows > div { display: flex; align-items: center; gap: 8px; height: 24px; padding-left: 16px; position: relative; white-space: nowrap; cursor: pointer }
.rows > div.off { color: var(--dim) }
.rows > div.at::before { content: ""; position: absolute; left: 0; top: 6px; border-style: solid; border-width: 6px 0 6px 8px;
                          border-color: transparent transparent transparent var(--paper) }
.rows .grow { flex: 1; overflow: hidden; text-overflow: ellipsis }
/* Icons sit in one 40px slot so labels line up whatever the icon. */
.rows .ico { width: 40px; display: grid; place-items: center; flex: none }
.rows .right { display: flex; align-items: center; gap: 4px; padding-right: 4px }
.stars { display: inline-flex; gap: 2px; vertical-align: middle }
.rows p { padding: 4px 0 }
.cell { display: grid; place-items: center; overflow: hidden }
.unseen { filter: brightness(0) }
[hidden] { display: none !important }

#tabs { position: absolute; left: 8px; right: 8px; top: 4px; height: 32px; display: flex; gap: 6px }
#tabs .panel { position: static; height: 32px; padding: 4px 9px; cursor: pointer }
#tabs .panel.on { background: var(--red) }
#tabs .purse { margin-left: auto; display: flex; align-items: center; gap: 8px; cursor: default }
#tabs .help { cursor: pointer; padding: 4px 7px; display: flex; align-items: center; gap: 7px }
#tabs .help .speaker { cursor: pointer }
/* The fallback font is wider: tighter tabs keep a five-digit purse on the bar. */
#frame.no-pixel #tabs .panel { padding: 4px 6px }
#frame.no-pixel #tabs { gap: 4px }
/* The tutorial: the whole frame dims except one gold-framed box, and its words sit
   in a message box (at the bottom, or the top when the box is down there). Clicks
   pass through, so the player does the real thing. */
#tutor { position: absolute; inset: 0; pointer-events: none; z-index: 50 }
#tutor-hole { position: absolute; box-shadow: 0 0 0 1000px rgba(28, 27, 44, .62); outline: 2px solid var(--gold); outline-offset: 1px }
#tutor-hole.none { outline: none }
/* The scene canvas runs past the frame's edges, so it dims with the tip as well. */
#sky.dim { filter: brightness(.38) }
#tutor-box { left: 8px; right: 8px; min-height: 56px; padding: 6px 12px; pointer-events: auto; line-height: 20px; white-space: normal }
#tutor-box .foot { display: flex; justify-content: space-between; color: var(--dim); margin-top: 2px }
#tutor-box .skip { cursor: pointer; text-decoration: underline }
#frame.no-pixel #tutor-box { font-size: 14px; font-family: Arial, Helvetica, sans-serif }
#msg { left: 8px; right: 8px; bottom: 8px; height: 56px; padding: 6px 12px; display: flex; gap: 8px; align-items: flex-start }
#msg.with-eggs { align-items: center; padding-top: 0; padding-bottom: 0 }
#msg.with-eggs > div { display: flex; gap: 12px; align-items: center }
#msg .eggs { display: flex; gap: 12px; align-items: center }
#msg .eggs span { display: flex; gap: 4px; align-items: center }
/* Art PNGs, always at a whole-number scale. */
.art { image-rendering: pixelated; display: block; flex: none }
.mini { display: block; flex: none; image-rendering: pixelated; background-repeat: no-repeat }

/* Pull: an arrow in its own column (32-48), the machine (56-268), the vouchers
   and the menu in their own column (276-492), the other arrow (500-516), the next
   machine from 524, and the message box under all of them. Machines end at
   y 272 with a closed base, above the message box (280). */
#counts { position: absolute; left: 276px; top: 8px; width: 216px; display: grid; grid-template-columns: 104px 104px; gap: 8px }
#counts .panel { position: static; height: 32px; display: flex; align-items: center; justify-content: space-between; padding: 4px 8px }
/* The banner: the 40x30 mini sprite at 1x, inside the plate. */
#banner { position: absolute; width: 40px; height: 30px; pointer-events: none }

/* Rates and pity: over the machine and the menu while it is open. */
#rates { left: 8px; top: 8px; width: 484px; height: 264px; padding: 6px 12px; cursor: pointer }
#rates .grid { display: grid; grid-template-columns: 1fr auto; column-gap: 16px; max-width: 300px }
#msg .more { margin-left: auto; cursor: pointer; text-decoration: underline; color: var(--dim); white-space: nowrap; align-self: flex-end }
#tabs .alert { display: inline-block; vertical-align: middle; margin-left: 4px }
#menu { left: 276px; top: 88px; width: 216px; padding: 4px 8px }
.hit { position: absolute; cursor: pointer }

/* Eggs */
/* Eggs: the selected egg on the left, every egg in a grid on the right. */
#egg-pic { left: 8px; top: 8px; width: 232px; height: 112px; padding: 4px; display: grid; place-items: center }
#egg-name { left: 8px; top: 128px; width: 232px; height: 48px; padding: 4px 12px }
#egg-day { left: 8px; top: 184px; width: 232px; height: 40px }
#egg-from { left: 8px; top: 232px; width: 232px; height: 40px }
#eggs-tray { left: 248px; top: 8px; width: 384px; height: 264px }
/* 10 columns of 36x40 cells: the 31x33 egg at 1x over its wave bar. Six rows show; the tray scrolls by whole rows. */
#eggs-grid { display: grid; grid-template-columns: repeat(10, 36px); grid-auto-rows: 40px; height: 240px; overflow-y: auto;
             scrollbar-width: thin; scrollbar-color: var(--red) var(--panel); scroll-snap-type: y mandatory }
#eggs-grid > * { scroll-snap-align: start }
#eggs-grid .egg { display: grid; place-items: start center; padding-top: 2px; position: relative; cursor: pointer }
#eggs-grid .egg i { position: absolute; left: 2px; bottom: 2px; height: 2px; background: var(--gold) }
#eggs-grid .bracket { position: absolute; inset: 0; pointer-events: none }
#eggs-grid .bracket b { position: absolute; width: 8px; height: 8px; border: 0 solid var(--red) }
#eggs-grid .bracket b:nth-child(1) { left: 0; top: 0; border-width: 2px 0 0 2px }
#eggs-grid .bracket b:nth-child(2) { right: 0; top: 0; border-width: 2px 2px 0 0 }
#eggs-grid .bracket b:nth-child(3) { left: 0; bottom: 0; border-width: 0 0 2px 2px }
#eggs-grid .bracket b:nth-child(4) { right: 0; bottom: 0; border-width: 0 2px 2px 0 }
#hatch { left: 8px; top: 8px; width: 624px; height: 264px; padding: 4px 8px; display: grid; grid-template-columns: 96px 1fr; grid-template-rows: 36px 1fr; gap: 0 12px }
#hatch .title, #hatch .head { grid-column: 1 / -1 }
#hatch.sum { grid-template-rows: 24px 1fr }
#hatch .cell { width: 96px; height: 96px; background: var(--ink) }
#hatch .cell.egg-phase { background: var(--panel) }
#hatch-text div { min-height: 20px }
#hatch .grid { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(6, 96px); gap: 4px 4px; overflow: hidden }
#hatch .grid .tag { height: 16px; line-height: 16px; text-align: center }

/* Dex */
#dex-list { left: 8px; top: 8px; width: 248px; height: 264px; display: flex; flex-direction: column }
#dex-rows { height: 192px }
/* Dex rows hold the 40x30 mini sprite at 1x, so they are 32px tall: 6 whole rows. */
#dex-rows > div { height: 32px }
#dex-detail { left: 264px; top: 8px; width: 368px; height: 264px; display: grid; grid-template-columns: 96px 1fr; grid-template-rows: 96px 1fr; gap: 8px 12px }
#dex-detail .cell { width: 96px; height: 96px; background: var(--ink) }
#dex-acts { grid-column: 1 / -1; height: 120px }
#dex-info .egg-line { display: flex; align-items: center; gap: 4px; height: 36px; white-space: nowrap }
#dex-info > div:last-child { white-space: nowrap }
#dex-pic .silhouette { display: block }

/* Starter pick: the Dex layout, with the three gifts under the starter. */
#starter-list { left: 8px; top: 8px; width: 248px; height: 264px; display: flex; flex-direction: column }
/* 32px rows, 6 whole rows under the title, like the Dex. */
#starter-rows { height: 192px }
#starter-rows > div { height: 32px }
#starter-detail { left: 264px; top: 8px; width: 368px; height: 264px; display: grid; grid-template-columns: 96px 1fr; grid-template-rows: 96px 1fr; gap: 8px 12px }
#starter-detail .cell { width: 96px; height: 96px; background: var(--ink) }
#starter-gifts { grid-column: 1 / -1; height: 144px }
#starter-gifts > div { height: 32px }

/* Shop and quests share one layout */
.left-panel { left: 8px; top: 8px; width: 400px; height: 264px; display: flex; flex-direction: column }
/* Quests: four sub-tabs with their reset clocks, then one list. A row is the mission (it
   wraps, never cut), its progress (n/m over a bar) and its reward in real icons. Done rows
   sink to the bottom, dimmed, with a check. Trophies come in groups, one per game. */
#quest-tabs { left: 8px; top: 8px; width: 624px; height: 36px; padding: 2px 6px; display: flex; gap: 6px; align-items: center }
#quest-tabs > span { padding: 0 8px; border: 1px solid var(--dim); line-height: 26px; cursor: pointer; white-space: nowrap }
#quest-tabs > span.on { border-color: var(--gold); color: var(--gold) }
#quest-tabs .clock { color: var(--dim); margin-left: 6px }
#quest-tabs > span.on .clock { color: var(--paper) }
#quest-box { left: 8px; top: 52px; width: 624px; height: 220px; padding: 4px 6px 4px 4px }
#quest-list { height: 100%; scroll-snap-type: none }
#quest-list .q { display: grid; grid-template-columns: 16px 1fr 128px 112px; column-gap: 8px; align-items: center; min-height: 34px; padding: 2px 4px 2px 0; position: relative; cursor: pointer }
#quest-list .q.at::before { content: ""; position: absolute; left: 2px; top: calc(50% - 6px); border-style: solid; border-width: 6px 0 6px 8px; border-color: transparent transparent transparent var(--paper) }
#quest-list .q .label { white-space: normal; line-height: 18px; padding: 2px 0 }
#quest-list .q .prog { display: flex; flex-direction: column; gap: 2px }
#quest-list .q .prog .n { line-height: 18px }
#quest-list .q .bar { height: 6px; border: 1px solid var(--dim); background: var(--ink) }
#quest-list .q .bar i { display: block; height: 100%; background: var(--gold) }
#quest-list .q .reward { display: flex; align-items: center; justify-content: flex-end; gap: 3px; white-space: nowrap }
#quest-list .q .ck { justify-self: end }
#quest-list .q.done { color: var(--dim) }
#quest-list .q.done .bar i { background: var(--dim) }
#quest-list .q.done img, #quest-list .q.locked img { opacity: .5 }
#quest-list .q.locked { color: var(--dim) }
#quest-list .group { display: flex; justify-content: space-between; color: var(--gold); line-height: 24px; padding: 4px 4px 0 24px; border-bottom: 1px solid var(--dim); margin-bottom: 2px }
/* A star inside text is drawn at the text's own size (the pixel font has no star). */
.st { font-family: Arial, Helvetica, sans-serif; font-size: .8em; line-height: 1; vertical-align: .05em }
#frame.no-pixel #quest-list, #frame.no-pixel #quest-tabs { font-size: 13px; font-family: Arial, Helvetica, sans-serif }
.right-panel { left: 416px; top: 8px; width: 216px; height: 264px; display: flex; flex-direction: column; gap: 8px }
.right-panel .cell { width: 96px; height: 96px; background: var(--ink); align-self: center }
/* Scrolling lists hold whole rows only: 8 × 24px. */
.left-panel .rows, .right-panel .rows { height: 192px }
#off { position: absolute; left: 8px; right: 8px; top: 48px; padding: 12px }
/* Story: the stage list needs less width than the stage panel, which lists up to
   eight lines (name, waves, enemies, flying, exploding, armored, rewards), so the
   split is 304 + 312 and the panel's lines sit without the 8px gaps. */
#scr-story .left-panel { width: 304px }
#scr-story .right-panel { left: 320px; width: 312px }
#story-info { gap: 0 }
/* Weekly milestones: two rows of two, a check, the risk and the reward's icon. */
#story-info .milestones { display: grid; grid-template-columns: 1fr 1fr; gap: 0 8px; margin-top: 4px }
#story-info .milestones span { display: flex; align-items: center; gap: 4px; white-space: nowrap; height: 24px }

/* Squad, Arknights-style, over the whole stage (the message box is hidden here):
   the 8 slots on top and the roster grid under them on the left; the stage, the
   teams and Start top right, the detail under them. */
#squad-slots { left: 8px; top: 8px; width: 406px; height: 64px; padding: 2px 4px; display: grid; grid-template-columns: repeat(8, 49px) }
#squad-roster { left: 8px; top: 80px; width: 406px; height: 256px; padding: 4px 6px }
#squad-filters { display: flex; gap: 10px; height: 20px; margin-bottom: 4px; white-space: nowrap }
#squad-filters span { cursor: pointer }
#squad-filters span.on { color: var(--gold) }
/* 7 columns of 56x55 cells; four rows show and the grid scrolls by whole rows. */
#squad-grid { display: grid; grid-template-columns: repeat(7, 54px); grid-auto-rows: 53px; gap: 2px; height: 218px; overflow-y: auto;
              scrollbar-width: thin; scrollbar-color: var(--red) var(--panel); scroll-snap-type: y mandatory }
#squad-grid > * { scroll-snap-align: start }
#squad-stage { left: 422px; top: 8px; width: 210px; height: 104px; padding: 4px 6px }
#squad-stage .line { display: flex; gap: 8px; white-space: nowrap }
#squad-stage .teams { display: flex; gap: 6px; align-items: center; margin-top: 2px }
#squad-stage .teams span { padding: 0 4px; border: 1px solid var(--dim); cursor: pointer; line-height: 18px }
#squad-stage .teams span.on { border-color: var(--gold); color: var(--gold) }
/* Four or five saved teams (from the coin shop): a little tighter, so Start still fits. */
#squad-stage .teams.many { gap: 3px }
#squad-stage .teams.many span { padding: 0 2px }
#squad-stage .teams span.at { outline: 2px solid var(--paper); outline-offset: 1px }
#squad-stage .teams .start { margin-left: auto; background: var(--red); border-color: var(--red); color: var(--paper) }
#squad-stage .teams .start.off { background: none; border-color: var(--dim); color: var(--dim) }
#squad-detail { left: 422px; top: 120px; width: 210px; height: 216px; padding: 4px 6px }
#squad-detail .stats { display: grid; grid-template-columns: repeat(3, 1fr) }
/* Skills flow two to a line, and a long pair wraps onto a third line rather than being cut. */
#squad-detail .skills { display: flex; flex-wrap: wrap; column-gap: 10px }
#squad-detail .skills span, #squad-detail .stats span { white-space: nowrap }
#squad-detail .skills span[data-skill] { cursor: pointer }
/* The skill in use: underlined in the text's colour. */
#squad-detail .skills .use { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 2px }
#squad-detail .line { display: flex; align-items: center; gap: 4px; white-space: nowrap }
/* A card: the mini sprite at 1x with its class icon top left and a check top right
   when it is in the squad; level bottom left, deploy cost bottom right. */
#squad .card { position: relative; display: flex; flex-direction: column; align-items: center; cursor: pointer }
#squad .card .mini { margin-top: 3px }
#squad .card .ci { position: absolute; left: 1px; top: 1px }
#squad .card .ck { position: absolute; right: 2px; bottom: 4px }
/* Roster cells sit on their own ink tiles; the deploy cost is a gold badge top right,
   and a squad member has a gold outline as well as its check. */
#squad-grid .card { background: var(--ink) }
#squad-grid .card.in { box-shadow: inset 0 0 0 2px var(--gold) }
#squad .card .cost { position: absolute; right: 2px; top: 1px; color: var(--gold); line-height: 18px }
#squad .card .low { display: flex; align-items: center; width: 100%; padding: 0 3px; height: 20px; white-space: nowrap }
#squad .card .low span { display: flex; align-items: center; gap: 1px }
#squad .card.empty { color: var(--dim) }
/* Role markers: a bar under the card, teal for a tank that resists this stage's attacks,
   red for damage its foes are weak to; the stage box and the preview use the same colours. */
#squad .card .fit { position: absolute; left: 4px; right: 4px; bottom: 0; height: 3px; background: var(--teal) }
#squad .card.fit-damage .fit { background: var(--red) }
.roles .tank { color: var(--teal) }
.roles .dmg { color: var(--red) }
.roles .part { white-space: nowrap }
/* The preview's role line: "Tanks: Rock, Steel · Damage: Fighting", and when the two do
   not fit on one line, Damage starts the next one without the dot. */
#story-info .roles { display: flex; flex-wrap: wrap; column-gap: 8px }
#story-info .roles .part + .part::before { content: "· "; color: var(--paper) }
#story-info .roles.wrapped .part + .part::before { content: none }
#squad-stage .roles .part { display: block; line-height: 18px }
#squad-stage .gold { line-height: 18px; white-space: normal; overflow: hidden }
#squad .card.empty .slot { width: 40px; height: 30px; margin-top: 3px; border: 1px dashed var(--dim) }
/* The mono fallback is much wider than the pixel font, so the squad's dense panels
   use a narrow sans at 13px when the pixel font cannot load. */
#frame.no-pixel #squad-detail, #frame.no-pixel #squad-stage, #frame.no-pixel #squad-filters, #frame.no-pixel #squad .card .low, #frame.no-pixel #squad .card .cost { font-size: 13px; font-family: Arial, Helvetica, sans-serif }
#frame.no-pixel #squad-detail .title { font-size: 20px }
/* The message box too: the wide fallback runs three lines where the pixel font needs two. */
#frame.no-pixel #msg { font-size: 13px; font-family: Arial, Helvetica, sans-serif; line-height: 20px }
#squad .bracket { position: absolute; inset: 0; pointer-events: none }
#squad .bracket b { position: absolute; width: 8px; height: 8px; border: 0 solid var(--paper) }
#squad .bracket b:nth-child(1) { left: 0; top: 0; border-width: 2px 0 0 2px }
#squad .bracket b:nth-child(2) { right: 0; top: 0; border-width: 2px 2px 0 0 }
#squad .bracket b:nth-child(3) { left: 0; bottom: 0; border-width: 0 0 2px 2px }
#squad .bracket b:nth-child(4) { right: 0; bottom: 0; border-width: 0 2px 2px 0 }

/* Battles: the field canvas covers the whole 640x344 stage in a 3/4 view; the
   HUD sits over it top centre (kills and lives), pause top right, the deploy
   cards bottom right with energy and units left above them, and a tip bottom left. */
#tabs.locked .panel[data-tab] { color: var(--dim); cursor: default }
/* A battle takes the whole frame: the locked tab bar goes, and the HUD sits where it was. */
#frame.battling #tabs { display: none }
#frame.battling #stage { top: 0; height: 384px }
#field { position: absolute; left: 0; top: 0; width: 640px; height: 384px; cursor: pointer }
#battle-hud { left: 200px; top: 4px; width: 240px; height: 32px; padding: 4px 10px; display: flex; gap: 12px; align-items: center; justify-content: center; white-space: nowrap }
#battle-hud span { display: flex; align-items: center; gap: 4px }
#battle-pause { right: 8px; top: 4px; width: 104px; height: 32px; padding: 4px 8px; text-align: center; cursor: pointer; white-space: nowrap }
#deploy-info { right: 8px; bottom: 74px; height: 24px; padding: 0 8px; line-height: 20px; white-space: nowrap; display: flex; gap: 10px; align-items: center }
#deploy { right: 8px; bottom: 8px; height: 62px; display: flex; gap: 2px; padding: 2px 4px }
#deploy .card { position: relative; width: 49px; height: 54px; background: var(--ink); cursor: pointer; display: flex; flex-direction: column; align-items: center }
#deploy .card .mini { margin-top: 2px }
#deploy .card .low { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 0 3px; height: 20px }
#deploy .card.on { box-shadow: inset 0 0 0 2px var(--paper) }
#deploy .card.off .mini, #deploy .card.off .low { opacity: .4 }
#deploy .card .cool { position: absolute; inset: 0; background: rgba(28, 27, 44, .75); display: grid; place-items: center; color: var(--paper) }
/* The tip grows upward to fit its text (it is anchored at the bottom). */
#battle-tip { left: 8px; bottom: 8px; width: 176px; min-height: 62px; padding: 3px 8px; line-height: 18px; color: var(--dim); white-space: normal }
#frame.no-pixel #battle-tip, #frame.no-pixel #deploy .card .low, #frame.no-pixel #deploy-info { font-size: 13px; font-family: Arial, Helvetica, sans-serif }

}
function startHatch() {

}

const HATCH_TIME = 2.1;
// Each shard's direction out of the shell: x, y per second in internal px, then spin offset.
const SHARD_PATHS = [[-70, -90, 0], [70, -95, 1], [-55, -20, 2], [60, -25, 3], [-95, -55, 1], [95, -50, 2]];
function hatchFrame(tier, t) {
  const c = document.createElement("canvas");
  c.width = c.height = 96; c.style.width = c.style.height = "96px";
  const g = c.getContext("2d");
  g.imageSmoothingEnabled = false;
  if (!HATCH_SHEET.complete || !HATCH_SHEET.naturalWidth) return c;
  const row = Math.min(tier, 3);
  // The egg at 2x stands on the cell floor; it wobbles by whole art pixels.
  const ex = 16, ey = 22;
  const rays = t >= 1.2 && t < 2.1 ? Math.min(3, Math.floor((t - 1.2) / 0.1)) : -1;
  if (rays >= 0) g.drawImage(HATCH_SHEET, rays * 96, 136, 96, 96, 0, 0, 96, 96);
  if (t < 1.6) {
    const shake = Math.min(3, Math.floor(t / 0.3)), inShake = t - shake * 0.3;
    const wobble = t < 1.2 && inShake < 0.18 ? Math.round(Math.sin(inShake / 0.18 * Math.PI * 3)) * 2 : 0;
    const crack = t < 1.2 ? shake : 4;
    g.fillStyle = C.ink; g.fillRect(ex + 8, 90, 48, 4);
    g.drawImage(HATCH_SHEET, crack * 32, row * 34, 32, 34, ex + wobble, ey, 64, 68);
  } else {
    const s = t - 1.6;
    // The flash: the cell goes to paper for a beat, then the shards fly out.
    if (s < 0.08) { g.fillStyle = C.paper; g.fillRect(0, 0, 96, 96); }
    for (const [vx, vy, spin] of SHARD_PATHS) {
      const x = 48 + vx * s, y = 56 + vy * s + 260 * s * s, f = (spin + Math.floor(s / 0.06)) % 4;
      g.drawImage(HATCH_SHEET, 160 + f * 8, row * 8, 8, 8, Math.round(x) - 8, Math.round(y) - 8, 16, 16);
    }
  }
  return c;
}

  const c = document.createElement("canvas");
  c.width = c.height = 96; c.style.width = c.style.height = "96px";
  const g = c.getContext("2d");
  g.imageSmoothingEnabled = false;
  const x = 17 + wobble * 2, y = 20;
  g.fillStyle = C.ink; g.fillRect(x + 6, 86, 50, 4); g.fillRect(x + 12, 90, 38, 2);
  const pic = EGG_PICS[EGG_ART[tier]];

  if (crack) { g.fillStyle = C.ink; for (let i = -12; i <= 12; i += 4) g.fillRect(x + 31 + i, 50 + (i % 8 ? 2 : -2), 4, 2); }

function starterKey(e) {
  const p = picking, n = G.starters.length;

/* ── Tutorial: short, skippable, each tip once ─────────────────────────────
   A tip is a list of steps. Each step frames one thing (at: a box in screen
   pixels, or nothing), says what it is in the tutorial's message box, and
   either waits for Enter or for the player to do it (done: a check run every
   120ms). Steps marked run let a paused battle play on until done. Seen tips

function tutorPoll() {

  else if (login) { if (tab === "pull") { message = { text: "Daily login: +3 Regular vouchers." }; updateScene(); } else say("Daily login: +3 Regular vouchers."); }
}

// The hub reads this. Poké Gacha itself is unscored; weeklyRisk (this week's
// best risk won) feeds its second board, poke-gacha-weekly.
window.__boredSnapshot = () => {
  let weeklyRisk = 0;
  try { weeklyRisk = T && T.state ? Number(T.state().challengeBest) || 0 : 0; } catch {}
  try { const s = S || (G && G.state()); return { slug: "poke-gacha", caught: s ? s.owned.length : 0, pulls: s ? s.pulls : 0, weeklyRisk, finished: false }; }
  catch { return { slug: "poke-gacha", caught: 0, pulls: 0, weeklyRisk, finished: false }; }
};
