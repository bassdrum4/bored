<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Poké Gacha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Workbench&display=swap">
<style>
/* Poké Gacha screens. One fixed internal resolution (640×408: a 48px tab bar
   and a 640×360 stage), scaled by a whole number. Rules every screen keeps:
   - one panel style (.panel), one list style (.rows) with one ▶ cursor
   - spacing on a 4px grid, 8px margins and gaps everywhere
   - one pixel font (Workbench) at its native 16px and exactly 2x (32px), no
     ligatures; numbers in the same font, right-aligned in columns
   - the eight colors below and nothing else; egg tiers are fixed colors
   - every sprite at 1x, centered in a 96px cell (the largest sprite is 96px) */
:root {
  --ink: #1c1b2c; --panel: #2c2a44; --red: #c8372f; --paper: #f4f1ff;
  --dim: #807c9a; --gold: #e3ad2b; --teal: #3f9e8a; --sky: #8fd3e8;
  --body: 16px; --title: 32px;
}
* { margin: 0; padding: 0; box-sizing: border-box }
body { background: var(--ink); display: grid; place-items: start center; min-height: 100vh; padding-top: 4px; overflow: hidden }
#wrap { position: relative; overflow: hidden; outline: none; touch-action: manipulation; user-select: none }
#frame { position: absolute; left: 0; top: 0; width: 640px; height: 408px; transform-origin: 0 0; background: var(--ink);
         font: var(--body)/20px Workbench, ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--paper);
         letter-spacing: 1px; font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0, "zero" 1; font-synthesis: none }
canvas, img { image-rendering: pixelated; display: block }
#stage { position: absolute; left: 0; top: 48px; width: 640px; height: 360px; overflow: hidden }
#scene { position: absolute; inset: 0; width: 640px; height: 360px }

.panel { position: absolute; background: var(--panel); border: 2px solid var(--red); outline: 2px solid var(--ink); padding: 8px }
.title { font-size: var(--title); line-height: 36px; margin-bottom: 4px }
.head { margin-bottom: 4px }
.num { color: var(--gold) }
.dim { color: var(--dim) }
.gold { color: var(--gold) }
/* Lists scroll by whole 24px rows and never stop on a half-cut one. */
.scroll { overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--red) var(--panel); scroll-snap-type: y mandatory }
.scroll > * { scroll-snap-align: start }
.rows > div { display: flex; align-items: center; gap: 8px; height: 24px; padding-left: 16px; position: relative; white-space: nowrap; cursor: pointer }
.rows > div.off { color: var(--dim) }
.rows > div.at::before { content: ""; position: absolute; left: 0; top: 6px; border-style: solid; border-width: 6px 0 6px 8px;
                          border-color: transparent transparent transparent var(--paper) }
.rows .grow { flex: 1; overflow: hidden; text-overflow: ellipsis }
.rows .right { display: flex; align-items: center; gap: 4px; padding-right: 4px }
.rows p { padding: 4px 0 }
.cell { display: grid; place-items: center; overflow: hidden }
.unseen { filter: brightness(0) }
[hidden] { display: none !important }

#tabs { position: absolute; left: 8px; right: 8px; top: 8px; height: 32px; display: flex; gap: 8px }
#tabs .panel { position: static; height: 32px; padding: 4px 12px; cursor: pointer }
#tabs .panel.on { background: var(--red) }
#tabs .purse { margin-left: auto; display: flex; align-items: center; gap: 8px; cursor: default }
#msg { left: 8px; right: 8px; bottom: 8px; height: 56px; padding: 6px 12px; display: flex; gap: 8px; align-items: flex-start }
#msg .eggs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px }

/* Pull */
#counts { position: absolute; right: 8px; top: 8px; display: flex; gap: 8px }
#counts .panel { position: static; width: 100px; height: 36px; display: flex; align-items: center; justify-content: space-between; padding: 4px 8px }
#plate { position: absolute; display: flex; align-items: center; justify-content: center; font-size: var(--title); line-height: 36px;
         color: var(--ink); pointer-events: none }
#banner { position: absolute; width: 96px; height: 96px; pointer-events: none }
#clock { position: absolute; color: var(--ink); background: var(--paper); border: 2px solid var(--ink); padding: 0 4px; pointer-events: none }
#menu { right: 8px; top: 96px; width: 216px; padding: 8px }
.hit { position: absolute; cursor: pointer }

/* Eggs */
#eggs-tray { left: 8px; top: 8px; width: 400px; height: 280px }
#eggs-grid { display: grid; grid-template-columns: repeat(15, 24px) }
#eggs-grid .egg { width: 24px; height: 28px; display: grid; place-items: center; position: relative; cursor: pointer }
#eggs-grid .egg i { position: absolute; left: 4px; bottom: 0; height: 2px; background: var(--gold) }
#eggs-grid .egg.at { outline: 2px solid var(--paper); outline-offset: -2px }
#eggs-side { left: 416px; top: 8px; width: 216px; height: 280px }
#hatch { left: 8px; top: 8px; width: 624px; height: 280px; display: grid; grid-template-columns: 96px 1fr; grid-template-rows: 40px 1fr; gap: 0 12px }
#hatch .title, #hatch .head { grid-column: 1 / -1 }
#hatch.sum { grid-template-rows: 24px 1fr }
#hatch .cell { width: 96px; height: 96px; background: var(--ink) }
#hatch-text div { min-height: 20px }
#hatch .grid { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(6, 96px); gap: 4px 4px; overflow: hidden }
#hatch .grid .tag { height: 20px; text-align: center }

/* Dex */
#dex-list { left: 8px; top: 8px; width: 248px; height: 280px; display: flex; flex-direction: column }
#dex-rows { height: 216px }
#dex-detail { left: 264px; top: 8px; width: 368px; height: 280px; display: grid; grid-template-columns: 96px 1fr; grid-template-rows: 96px 1fr; gap: 8px 12px }
#dex-detail .cell { width: 96px; height: 96px; background: var(--ink) }
#dex-acts { grid-column: 1 / -1; height: 144px }

/* Shop and quests share one layout */
.left-panel { left: 8px; top: 8px; width: 400px; height: 280px; display: flex; flex-direction: column }
.right-panel { left: 416px; top: 8px; width: 216px; height: 280px; display: flex; flex-direction: column; gap: 8px }
.right-panel .cell { width: 96px; height: 96px; background: var(--ink); align-self: center }
/* Scrolling lists hold whole rows only: 9 × 24px. */
.left-panel .rows, .right-panel .rows { height: 216px }
#off { position: absolute; left: 8px; right: 8px; top: 56px; padding: 12px }
</style>
</head>
<body>
<div id="wrap" tabindex="0" aria-label="Poké Gacha. Arrow keys move, Enter picks, Backspace goes back, 1 to 5 switch screens.">
  <div id="frame">
    <div id="tabs"></div>
    <div id="stage">
      <canvas id="scene" width="640" height="360"></canvas>
      <section id="scr-pull" class="screen">
        <div id="counts"></div>
        <img id="banner" alt="" hidden>
        <div id="plate"></div>
        <div id="clock" class="num" hidden></div>
        <div class="hit" id="hit-left" style="left:0;top:80px;width:80px;height:200px" title="Previous machine"></div>
        <div class="hit" id="hit-right" style="left:432px;top:44px;width:208px;height:48px" title="Next machine"></div>
        <div class="hit" id="hit-machine" style="left:208px;top:80px;width:176px;height:200px" title="Open the voucher menu"></div>
        <div class="panel rows" id="menu" role="listbox"></div>
      </section>
      <section id="scr-eggs" class="screen" hidden>
        <div class="panel" id="eggs-tray"><div class="title" id="eggs-title">EGGS</div><div id="eggs-grid"></div></div>
        <div class="panel" id="eggs-side"><div class="title">HATCH</div><div class="rows" id="eggs-menu"></div><div class="rows" id="eggs-legend"></div></div>
        <div class="panel" id="hatch" hidden></div>
      </section>
      <section id="scr-dex" class="screen" hidden>
        <div class="panel" id="dex-list"><div class="title" id="dex-title">DEX</div><div class="rows scroll" id="dex-rows"></div></div>
        <div class="panel" id="dex-detail"><div class="cell" id="dex-pic"></div><div id="dex-info"></div><div class="rows scroll" id="dex-acts"></div></div>
      </section>
      <section id="scr-shop" class="screen" hidden>
        <div class="panel left-panel"><div class="title" id="shop-title">SHOP</div><div class="rows scroll" id="shop-list"></div></div>
        <div class="panel right-panel" id="shop-preview"></div>
      </section>
      <section id="scr-quests" class="screen" hidden>
        <div class="panel left-panel"><div class="title">MISSIONS</div><div class="rows scroll" id="quest-list"></div></div>
        <div class="panel right-panel"><div class="title" id="trophy-title">TROPHIES</div><div class="rows scroll" id="trophy-list"></div></div>
      </section>
      <div class="panel" id="msg" role="status"></div>
      <div class="panel" id="off" hidden>Open Poké Gacha from the Bored arcade: your wallet, eggs and dex live on your Bored profile.</div>
    </div>
  </div>
</div>
<script>
/* Poké Gacha. The engine and the wallet live in the hub (src/hub/gacha.js,
   src/hub/rewards.js) and this page calls them through parent.__boredGacha,
   so every pull and hatch lands in the one ledger that syncs to the account.
   Pulls are cosmetic outside Poké Gacha's own tower defense (coming later). */
const $ = s => document.querySelector(s);
const SPRITE_DIR = /\/games\/content\/[^/]+\.html([?#].*)?$/.test(document.baseURI) ? "pokedoku/sprites/" : "games/content/pokedoku/sprites/";
const G = (() => { try { return parent !== window && parent.__boredGacha ? parent.__boredGacha : null; } catch { return null; } })();
const PREF = "bored.poke-gacha.ui";
const pref = (() => { try { return JSON.parse(localStorage.getItem(PREF) || "null") || {}; } catch { return {}; } })();
const keep = () => { try { localStorage.setItem(PREF, JSON.stringify(pref)); } catch {} };
let tab = pref.tab || "pull", machine = pref.machine || "move", S = null;
const name = num => G.dex[num - 1][0];
const REASONS = { vouchers: "Not enough vouchers.", full: "Egg storage is full (99). Hatch some first.", inactive: "Your wallet is not open yet.",
  candy: "Not enough candy.", shards: "Not enough shards.", owned: "Already done.", order: "Cut the cost by 1 first.", locked: "That look is not unlocked.",
  "not-owned": "You do not have that one yet." };

/* ── The palette, and pixel art drawn at 2x from it ────────────────────── */
const C = { ink: "#1c1b2c", panel: "#2c2a44", red: "#c8372f", paper: "#f4f1ff", dim: "#807c9a", gold: "#e3ad2b", teal: "#3f9e8a", sky: "#8fd3e8" };
// Fixed egg tier colors everywhere: Common, Rare, Epic, Legendary (and the banner, a legendary).
const TIER_COLOR = [C.paper, C.sky, C.gold, C.red, C.red];
const TIER_NAME = ["Common", "Rare", "Epic", "Legendary", "Banner"];
const ART = 2;
// A canvas of w×h art pixels, each ART internal pixels across.
function pixelCanvas(w, h, draw) {
  const c = document.createElement("canvas");
  c.width = w * ART; c.height = h * ART;
  c.style.width = w * ART + "px"; c.style.height = h * ART + "px";
  const g = c.getContext("2d");
  g.scale(ART, ART);
  draw(g);
  return c;
}
function ellipse(g, cx, cy, rx, ry, color) {
  g.fillStyle = color;
  for (let y = -ry; y <= ry; y++) {
    const half = Math.round(rx * Math.sqrt(Math.max(0, 1 - (y * y) / (ry * ry))));
    g.fillRect(cx - half, cy + y, half * 2 + 1, 1);
  }
}
function box(g, x, y, w, h, color, cut = 1) {
  g.fillStyle = color;
  g.fillRect(x + cut, y, w - cut * 2, h);
  g.fillRect(x, y + cut, w, h - cut * 2);
}
const TICKET = { regular: C.red, plus: C.sky, premium: C.teal, gold: C.gold };
function ticket(kind) {
  return pixelCanvas(16, 9, g => {
    box(g, 0, 0, 16, 9, C.ink);
    g.fillStyle = TICKET[kind]; g.fillRect(1, 1, 14, 7);
    g.fillStyle = C.paper; g.fillRect(4, 1, 2, 7); g.fillRect(8, 3, 5, 1); g.fillRect(8, 5, 4, 1);
  });
}
function coin() { return pixelCanvas(8, 8, g => { ellipse(g, 3, 3, 3, 3, C.ink); ellipse(g, 3, 3, 2, 2, C.gold); g.fillStyle = C.paper; g.fillRect(3, 2, 1, 3); }); }
function shardIcon() { return pixelCanvas(8, 8, g => { g.fillStyle = C.ink; g.fillRect(2, 0, 4, 8); g.fillRect(0, 2, 8, 4); g.fillStyle = C.sky; g.fillRect(3, 1, 2, 6); g.fillRect(1, 3, 6, 2); g.fillStyle = C.paper; g.fillRect(3, 2, 1, 2); }); }
function candyIcon() { return pixelCanvas(8, 8, g => { g.fillStyle = C.ink; g.fillRect(2, 1, 4, 6); g.fillRect(0, 2, 8, 4); g.fillStyle = C.red; g.fillRect(3, 2, 2, 4); g.fillRect(1, 3, 6, 2); g.fillStyle = C.paper; g.fillRect(3, 2, 1, 1); }); }
function eggIcon(tier) {
  return pixelCanvas(8, 10, g => {
    ellipse(g, 3, 5, 3, 4, C.ink); ellipse(g, 3, 5, 2, 3, TIER_COLOR[tier]);
    g.fillStyle = tier === 0 ? C.dim : C.ink; g.fillRect(2, 3, 1, 1); g.fillRect(4, 6, 1, 1);
  });
}
function check(done) { return pixelCanvas(8, 8, g => { g.fillStyle = done ? C.gold : C.dim; if (done) { g.fillRect(1, 4, 2, 2); g.fillRect(3, 5, 1, 2); g.fillRect(4, 3, 1, 3); g.fillRect(5, 1, 1, 3); g.fillRect(6, 0, 1, 2); } else g.fillRect(3, 3, 2, 2); }); }

/* ── Shared pieces: elements, sprites in fixed cells, lists, messages ──── */
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; };
// SP skins: hand-made art listed in poke-gacha/sp/skins.json. Hidden until the list has one.
const SKIN_DIR = SPRITE_DIR.replace("pokedoku/sprites/", "poke-gacha/sp/");
const skins = () => (G ? G.skins() : []);
const skinOf = id => skins().find(skin => skin.id === id) || null;
const isSkin = look => look !== "normal" && look !== "shiny";
const spriteUrl = (num, look) => isSkin(look) ? SKIN_DIR + look + ".png" : SPRITE_DIR + (look === "shiny" ? "shiny/" : "") + num + ".png";
const lookName = look => look === "normal" ? "Normal" : look === "shiny" ? "Shiny" : "SP " + (skinOf(look)?.name || "skin");
// Every Pokémon sprite at 1x, never scaled or cropped: cells are 96px, the largest sprite.
const CELL = 96;
function sprite(num, look = "normal", dark = false) {
  const img = new Image();
  img.alt = name(num);
  img.draggable = false;
  if (dark) img.className = "unseen";
  img.src = spriteUrl(num, look);
  return img;
}
function cellWith(node, size = CELL, cls = "") { const c = el("div", "cell " + cls); c.style.width = c.style.height = size + "px"; c.append(node); return c; }
function rows(container, list, at, onPick) {
  container.replaceChildren(...list.map((row, i) => {
    const r = el("div", (i === at ? "at " : "") + (row.off ? "off" : ""));
    r.dataset.row = i;
    if (row.icon) r.append(row.icon);
    r.append(el("span", "grow", row.label));
    if (row.right !== undefined && row.right !== "") {
      const right = el("span", "right");
      for (const part of [].concat(row.right)) right.append(typeof part === "object" ? part : el("span", typeof part === "number" ? "num" : "", String(part)));
      r.append(right);
    }
    return r;
  }));
  container.onclick = e => { const r = e.target.closest("[data-row]"); if (r) onPick(Number(r.dataset.row), true); };
  const row = container.children[at];
  if (row && row.scrollIntoView) row.scrollIntoView({ block: "nearest" });
}
function say(text, extra) {
  const col = el("div");
  col.append(el("span", "", text));
  if (extra) col.append(extra);
  $("#msg").replaceChildren(col);
}
const HINT = "Arrows move · Enter picks · Backspace goes back · 1–5 switch screens.";
function drawBackdrop() {
  const g = $("#scene").getContext("2d");
  g.setTransform(ART, 0, 0, ART, 0, 0);
  g.imageSmoothingEnabled = false;
  g.fillStyle = C.paper; g.fillRect(0, 0, 320, 180);
  g.fillStyle = C.sky; for (let y = 4; y < 180; y += 6) g.fillRect(0, y, 320, 2);
  g.fillRect(0, 0, 320, 2);
}

/* ── The pull screen ──────────────────────────────────────────────────────
   One machine in the middle, its neighbours at the edges. Left and right
   switch machines, up and down move the cursor, Enter pulls. The art is in
   320×180 art pixels, drawn at 2x. */
const ORDER_M = ["move", "legend", "shiny"];
const LOOK = {
  move: { body: C.teal, label: "Move UP!", about: "Move UP: rare skills roll twice as often." },
  legend: { body: C.red, label: "UP!", about: "Legendary UP: today's banner legendary, 1 in 256. Eggs count double toward Legendary pity." },
  shiny: { body: C.gold, label: "Shiny UP!", about: "Shiny UP: shiny 1 in 64 instead of 1 in 128." }
};
const OPTIONS = [
  { voucher: "regular", count: 1, times: "x1", label: "1 Pull", about: "1 Regular: 1 egg." },
  { voucher: "regular", count: 10, times: "x10", label: "10 Pulls", about: "10 Regular: 10 eggs, 1 Rare or better." },
  { voucher: "plus", count: 1, times: "x1", label: "5 Pulls", about: "1 Plus: 5 eggs." },
  { voucher: "premium", count: 1, times: "x1", label: "10 Pulls", about: "1 Premium: 10 eggs, 1 Rare or better." },
  { voucher: "gold", count: 1, times: "x1", label: "25 Pulls", about: "1 Gold: 25 eggs, 1 Epic or better." },
  { buy: true, times: "100", label: "Buy 1", about: "Buy 1 Regular voucher for 100 coins." },
  { cancel: true, times: "", label: "Cancel", about: "" }
];
let cursor = 0, menuOpen = true, slide = 0, crank = 0, message = null;

// A fixed handful of eggs in each dome, so a machine always looks the same.
function domeEggs(seed) {
  let s = seed;
  const rand = () => (s = (s * 1103515245 + 12345) >>> 0) / 4294967296;
  const eggs = [];
  for (let row = 0; row < 4; row++) for (let i = 0; i < 6; i++)
    eggs.push({ x: 8 + i * 18 + (row % 2) * 9 + Math.floor(rand() * 4), y: 18 + row * 12 + Math.floor(rand() * 3), tier: [0, 0, 0, 1, 1, 2, 3][Math.floor(rand() * 7)], r: 8 + Math.floor(rand() * 3) });
  return eggs;
}
const DOMES = { move: domeEggs(3), legend: domeEggs(11), shiny: domeEggs(29) };
function drawMachine(g, cx, id, front) {
  const body = LOOK[id].body, x = cx - 56;
  // Cap and rim.
  box(g, x + 4, 22, 104, 16, C.ink); g.fillStyle = body; g.fillRect(x + 5, 23, 102, 14);
  g.fillStyle = C.paper; g.fillRect(x + 7, 24, 98, 2);
  g.fillStyle = C.ink; g.fillRect(x + 6, 34, 100, 1);
  box(g, x - 1, 37, 114, 9, C.ink); g.fillStyle = C.paper; g.fillRect(x, 38, 112, 7); g.fillStyle = C.dim; g.fillRect(x + 1, 43, 110, 1);
  // Dome of eggs behind glass.
  g.fillStyle = C.ink; g.fillRect(x + 5, 45, 102, 58);
  g.save(); g.beginPath(); g.rect(x + 6, 45, 100, 57); g.clip();
  g.fillStyle = C.sky; g.fillRect(x + 6, 45, 100, 57);
  for (const egg of DOMES[id]) {
    ellipse(g, x + egg.x, 45 + egg.y, egg.r, egg.r + 2, C.ink);
    ellipse(g, x + egg.x, 45 + egg.y, egg.r - 1, egg.r + 1, TIER_COLOR[egg.tier]);
    g.fillStyle = C.paper; g.fillRect(x + egg.x - 3, 45 + egg.y - egg.r + 1, 2, 2);
  }
  g.fillStyle = C.paper; g.fillRect(x + 12, 47, 2, 50);
  g.restore();
  // Name plate in front of the dome.
  box(g, x + 16, 70, 80, 26, C.ink, 2); box(g, x + 17, 71, 78, 24, C.paper, 2);
  g.fillStyle = C.dim; g.fillRect(x + 18, 93, 76, 1);
  // Lower rim and body.
  box(g, x - 1, 101, 114, 9, C.ink); g.fillStyle = C.paper; g.fillRect(x, 102, 112, 7); g.fillStyle = C.dim; g.fillRect(x + 1, 107, 110, 1);
  g.fillStyle = C.ink; g.fillRect(x + 4, 110, 104, 70);
  g.fillStyle = body; g.fillRect(x + 5, 110, 102, 70);
  g.fillStyle = C.ink; g.fillRect(x + 5, 110, 102, 1);
  g.fillStyle = C.paper; g.fillRect(x + 102, 113, 2, 60);
  // Chute, where the egg comes out.
  box(g, x + 13, 118, 30, 26, C.ink, 3); box(g, x + 15, 120, 26, 22, C.panel, 3); g.fillStyle = C.dim; g.fillRect(x + 19, 122, 10, 2);
  // Coin slot.
  g.fillStyle = C.ink; g.fillRect(x + 50, 122, 26, 4);
  // Crank: a wheel with a grip that turns after a pull.
  ellipse(g, x + 93, 120, 11, 11, C.ink); ellipse(g, x + 93, 120, 10, 10, C.paper); ellipse(g, x + 93, 120, 6, 6, C.dim); ellipse(g, x + 93, 120, 5, 5, C.paper);
  if (front) {
    const a = crank * Math.PI;
    g.fillStyle = C.ink;
    for (const off of [0, Math.PI]) g.fillRect(Math.round(x + 93 + Math.cos(a + off) * 7) - 1, Math.round(120 + Math.sin(a + off) * 7) - 1, 3, 3);
    g.fillRect(x + 92, 119, 3, 3);
  }
}
function drawScene() {
  drawBackdrop();
  const g = $("#scene").getContext("2d");
  const at = ORDER_M.indexOf(machine), cx = 148 + slide;
  drawMachine(g, cx - 180, ORDER_M[(at + 2) % 3], false);
  drawMachine(g, cx + 180, ORDER_M[(at + 1) % 3], false);
  drawMachine(g, cx, machine, true);
  // Arrows to the neighbours.
  g.fillStyle = C.ink;
  for (let i = 0; i < 6; i++) { g.fillRect(30 + i, 72 - i, 1, i * 2 + 1); g.fillRect(250 - i, 32 - i, 1, i * 2 + 1); }
  // The words and the banner follow the machine as it slides (art px × 2).
  const left = (cx - 56) * ART;
  Object.assign($("#plate").style, { left: left + 34 + "px", top: "142px", width: "156px", height: "42px" });
  Object.assign($("#banner").style, { left: left + 64 + "px", top: "44px" });
  Object.assign($("#clock").style, { left: left + 104 + "px", top: "264px" });
}
function untilMidnight() {
  // The banner changes at midnight in Detroit, with the daily seed.
  const parts = Object.fromEntries(new Intl.DateTimeFormat("en-US", { timeZone: "America/Detroit", hour12: false, hour: "2-digit", minute: "2-digit", second: "2-digit" })
    .formatToParts(new Date()).map(p => [p.type, Number(p.value)]));
  const left = Math.max(0, 86400 - ((parts.hour % 24) * 3600 + parts.minute * 60 + parts.second));
  const two = n => String(n).padStart(2, "0");

// The big egg: 24×24 art pixels at 4x fills the 96px cell.
function bigEgg(tier, wobble, crack) {

  g.fillStyle = tier === 0 ? C.dim : C.ink;
  for (const [x, y, w, h] of [[-4, -6, 3, 2], [2, -7, 2, 2], [3, 0, 2, 2], [-5, 3, 2, 2], [-1, 6, 3, 2]]) g.fillRect(cx + x, 12 + y, w, h);
  g.fillStyle = C.paper; g.fillRect(cx - 4, 5, 2, 3);

const hatchLook = x => x.sp ? x.sp : x.shiny ? "shiny" : "normal";

      el("div", "", TIER_NAME[x.tier] + " " + G.stars[x.tier] + "★ · " + G.dex[x.species - 1][1].replace("/", " / ")), candy,
      el("div", x.skill === 3 ? "gold" : "", "Skill: " + G.skillsOf(x.species)[x.skill] + (x.skill === 3 ? " (rare)" : "")),
      ...(x.shiny ? [el("div", "gold", "Shiny!")] : []), ...(x.sp ? [el("div", "gold", "SP skin: " + (skinOf(x.sp)?.name || x.sp) + "!")] : []));

function hatchKey(e) {

/* ── Dex: every line an egg can hatch, and what candy does ─────────────── */
const BASES = G ? G.dex.map((row, i) => row[9] > 0 ? i + 1 : 0).filter(Boolean) : [];
let dexAt = 0, dexFocus = "list", actAt = 0;
const lineForms = line => S.owned.filter(num => G.lineOf(num) === line);
const tipOf = line => lineForms(line).sort((a, b) => G.stageOf(b) - G.stageOf(a) || a - b)[0] || line;
function dexActions(line) {
  const l = S.lines[line];

  const list = [];
  for (const from of lineForms(line)) for (const to of G.evolutionsOf(from)) {
    if (S.owned.includes(to)) continue;
    const cost = G.costs.evolve[Math.min(G.stageOf(from), 2) - 1];
    list.push({ label: "Evolve: " + name(to), right: [cost, candyIcon()], off: l.candy < cost,
      about: "Evolve " + name(from) + " into " + name(to) + " for " + cost + " candy. Both stay in your dex.", run: () => G.evolve({ from, to }) });
  }
  const up = (kind, label, done, cost, about, blocked) => list.push({ label, right: done ? [check(true)] : [cost, candyIcon()],
    off: done || blocked || l.candy < cost, about, run: () => G.upgrade({ line, kind }) });
  up("passive", "Passive", l.passive, G.costs.passive, "Unlock this line's passive for tower defense.");
  up("cost1", "Cost -1", l.cost >= 1, G.costs.cost1, "Deploy this line for 1 less energy in tower defense.");
  up("cost2", "Cost -2", l.cost >= 2, G.costs.cost2, "Deploy for 2 less energy. Needs Cost -1 first.", l.cost < 1);
  const looks = G.looksOf(l);
  list.push({ label: "Look: " + lookName(l.look), off: looks.length < 2,
    about: looks.length > 1 ? "Change the look this line wears here, in Pokédoku and as your buddy." : "Hatch it shiny to unlock another look.",
    run: () => G.setLook({ line, look: looks[(looks.indexOf(l.look) + 1) % looks.length] }) });
  // A skin belongs to one species, so the buddy is that species when the line wears one.
  const skin = isSkin(l.look) ? skinOf(l.look) : null;
  const who = skin ? skin.species : tipOf(line);
  const isBuddy = S.buddy && S.buddy.species === who && S.buddy.shiny === (l.look === "shiny") && (S.buddy.skin || null) === (skin ? skin.id : null);
  list.push({ label: isBuddy ? "Your buddy" : "Make buddy", right: isBuddy ? [check(true)] : "", off: isBuddy,
    about: "Show " + name(who) + " next to your name on Bored and the leaderboard.",
    run: () => G.setBuddy({ species: who, shiny: l.look === "shiny", skin: skin ? skin.id : null }) });

}
function dexUpdate() {
  drawBackdrop();
  const owned = new Set(Object.keys(S.lines).map(Number));
  $("#dex-title").textContent = "DEX " + owned.size + "/" + BASES.length;
  rows($("#dex-rows"), BASES.map(num => ({ label: String(num).padStart(4, "0") + " " + name(num), right: owned.has(num) ? [check(true)] : "", off: !owned.has(num) })),
    dexAt, i => { dexAt = i; actAt = 0; dexFocus = "list"; dexUpdate(); });
  const line = BASES[dexAt], l = S.lines[line], tip = l ? tipOf(line) : line;
  const shown = l && isSkin(l.look) && skinOf(l.look) ? skinOf(l.look).species : tip;
  $("#dex-pic").replaceChildren(sprite(shown, l ? G.lookFor(shown) : "normal", !l));
  const info = $("#dex-info");
  info.replaceChildren(el("div", "title", l ? name(tip) : "???"),
    el("div", "", "#" + String(tip).padStart(4, "0") + " · " + G.dex[line - 1][9] + "★ line"),
    el("div", "dim", l ? G.dex[tip - 1][1].replace("/", " / ") : "Not caught yet"));
  if (l) { const c = el("div"); c.append(el("span", "num", l.candy), " candy · hatched ", el("span", "num", l.hatches)); info.append(c); }
  const acts = dexActions(line);

  if (!acts.length) dexFocus = "list";
  rows($("#dex-acts"), acts, dexFocus === "acts" ? actAt : -1, (i, click) => { actAt = i; dexFocus = "acts"; if (click) runDex(acts[i]); else dexUpdate(); });
  if (!l) $("#dex-acts").replaceChildren(el("p", "dim", "Hatches from " + TIER_NAME[G.dex[line - 1][9] - 3] + " eggs."));
  const skills = G.skillsOf(line).map((skill, i) => (l && l.skills[i] ? skill : "(" + skill + ")") + (i === 3 ? "*" : ""));

function dexKey(e) {

  }
}

/* ── Frame, tabs and switching screens ─────────────────────────────────── */
const TABS = [["pull", "Pull"], ["eggs", "Eggs"], ["dex", "Dex"], ["shop", "Shop"], ["quests", "Quests"]];
const SCREENS = { pull: [updateScene, pullKey], eggs: [eggsUpdate, eggsKey], dex: [dexUpdate, dexKey], shop: [shopUpdate, shopKey], quests: [questsUpdate, questsKey] };
function refreshTop() {
  S = G.state();
  const ready = S.eggs.filter(e => e.ready).length;
  $("#tabs").replaceChildren(...TABS.map(([id, label], i) => {
    const t = el("div", "panel" + (tab === id ? " on" : ""));
    t.append(el("span", "", label));
    if (id === "eggs" && ready) t.append(" ", el("span", "num", ready));
    t.dataset.tab = id;
    t.title = label + " (" + (i + 1) + ")";
    return t;
  }));
  const purse = el("div", "panel purse");
  purse.append(el("span", "num", S.balance.coins), coin(), el("span", "num", S.balance.shards), shardIcon());
  purse.title = "Coins and shards";
  $("#tabs").append(purse);
}
function go(id) {
  if (!SCREENS[id] || hatching) return;
  tab = pref.tab = id; keep();
  message = null;
  for (const [sid] of TABS) $("#scr-" + sid).hidden = sid !== id;
  refreshTop();
  SCREENS[id][0]();
  $("#wrap").focus({ preventScroll: true });
}
// Whole-number scaling only. Below 640px wide (a phone) the frame shrinks to fit instead.
function placeFrame() {
  const w = document.documentElement.clientWidth - 8, h = window.innerHeight - 8;
  const fit = Math.min(w / 640, h / 408);
  const k = fit >= 1 ? Math.floor(fit) : fit;
  $("#wrap").style.width = Math.floor(640 * k) + "px";
  $("#wrap").style.height = Math.floor(408 * k) + "px";
  $("#frame").style.transform = "scale(" + k + ")";
}

window.addEventListener("resize", placeFrame);
placeFrame();
if (!G) {
  drawBackdrop();
  for (const [sid] of TABS) $("#scr-" + sid).hidden = true;
  $("#msg").hidden = true; $("#off").hidden = false;
} else {
  document.addEventListener("keydown", e => {
    if (/^[1-5]$/.test(e.key) && !hatching) { e.preventDefault(); return go(TABS[Number(e.key) - 1][0]); }
    if (hatching) return hatchKey(e);
    SCREENS[tab][1](e);
  });
  $("#tabs").onclick = e => { const t = e.target.closest("[data-tab]"); if (t) go(t.dataset.tab); };
  $("#menu").onmousemove = e => { const r = e.target.closest("[data-row]"); if (r && Number(r.dataset.row) !== cursor && !message) { cursor = Number(r.dataset.row); updateScene(); } };
  $("#hit-left").onclick = () => switchMachine(-1);
  $("#hit-right").onclick = () => switchMachine(1);
  $("#hit-machine").onclick = () => { menuOpen = true; message = null; updateScene(); };
  $("#hatch").onclick = () => hatching && hatchKey({ key: "Enter", preventDefault() {} });
  setInterval(() => { if (tab === "pull" && machine === "legend" && !$("#clock").hidden) $("#clock").textContent = untilMidnight(); }, 1000);
  // Waves earned in another game, or a sync from another device, show up here.
  let seen = "";
  setInterval(() => {
    if (document.hidden || hatching) return;
    const now = JSON.stringify(G.state());
    if (now !== seen) { seen = now; refreshTop(); SCREENS[tab][0](); }
  }, 3000);
  const login = G.claimLogin().ok;
  go(SCREENS[tab] ? tab : "pull");
  if (login) { if (tab === "pull") { message = { text: "Daily login: +3 Regular vouchers." }; updateScene(); } else say("Daily login: +3 Regular vouchers."); }
}

// The hub reads this. Unscored for now; the planned score is unique species caught.
window.__boredSnapshot = () => {
  try { const s = S || (G && G.state()); return { slug: "poke-gacha", caught: s ? s.owned.length : 0, pulls: s ? s.pulls : 0, finished: false }; }
  catch { return { slug: "poke-gacha", caught: 0, pulls: 0, finished: false }; }
};
