<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Poké Gacha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap">
<style>
/* Poké Gacha screens. One fixed internal resolution (640×384: a 40px tab bar
   and a 640×344 stage), scaled by the biggest quarter step that fits, pixelated. 384 high so 2x (1280×768)
   fits the ~790px game area of the Google Sites embed. Rules every screen keeps:
   - one panel style (.panel), one list style (.rows) with one ▶ cursor
   - spacing on a 4px grid, 8px margins and gaps everywhere
   - one pixel font for all text, Jersey 10 (OFL, in the spirit of PokéRogue's
     text, not a copy of it): body at 20px and headers at 30px, 2x and 3x its
     10px grid so it stays sharp; Bored's mono stack is the fallback. Numbers
     right-aligned
   - the eight colors below and nothing else; egg tiers are fixed colors
   - every sprite at 1x, centered in a 96px cell (the largest sprite is 96px) */
:root {
  --ink: #1c1b2c; --panel: #2c2a44; --red: #c8372f; --paper: #f4f1ff;
  --dim: #807c9a; --gold: #e3ad2b; --teal: #3f9e8a; --sky: #8fd3e8;
  --body: 20px; --title: 30px;
  --mono: ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace;
  --pixel: "Jersey 10", var(--mono);
}
* { margin: 0; padding: 0; box-sizing: border-box }
/* The frame is scaled by the biggest whole number that fits and centered; the
   scene canvas (#sky) covers the whole window at the same scale behind it, so
   the backdrop and the neighbouring machines run on past the frame's edges. */
html, body { height: 100% }
body { background: var(--ink); overflow: hidden }
#sky { position: fixed; left: 0; top: 0; transform-origin: 0 0 }
#wrap { position: fixed; left: 0; top: 0; overflow: hidden; outline: none; touch-action: manipulation; user-select: none }
#frame { position: absolute; left: 0; top: 0; width: 640px; height: 384px; transform-origin: 0 0;
         font: 400 var(--body)/20px var(--pixel); color: var(--paper);
         font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0 }
canvas, img { image-rendering: pixelated; display: block }
#stage { position: absolute; left: 0; top: 40px; width: 640px; height: 344px; overflow: hidden }

.panel { position: absolute; background: var(--panel); border: 2px solid var(--red); outline: 2px solid var(--ink); padding: 8px }
.title { font: 400 var(--title)/32px var(--pixel); margin-bottom: 4px }
.head { margin-bottom: 4px }
.num { color: var(--gold) }
.title .count { font: 400 var(--body)/32px var(--pixel) }
/* If the pixel font cannot load, the mono fallback goes back to its own sizes (it is wider). */
#frame.no-pixel { --body: 16px; --title: 24px; font-weight: 600 }
/* Menu rows in columns: how many vouchers, then the number of pulls right-aligned. */
.rows .c1 { display: inline-block; width: 36px }
.rows .c2 { display: inline-block; width: 22px; text-align: right; margin-right: 6px }
.dim { color: var(--dim) }
.gold { color: var(--gold) }
/* Lists scroll by whole 24px rows and never stop on a half-cut one. */
.scroll { overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--red) var(--panel); scroll-snap-type: y mandatory }
.scroll > * { scroll-snap-align: start }
.rows > div { display: flex; align-items: center; gap: 8px; height: 24px; padding-left: 16px; position: relative; white-space: nowrap; cursor: pointer }
.rows > div.off { color: var(--dim) }
.rows > div.at::before { content: ""; position: absolute; left: 0; top: 6px; border-style: solid; border-width: 6px 0 6px 8px;
                          border-color: transparent transparent transparent var(--paper) }
.rows .grow { flex: 1; overflow: hidden; text-overflow: ellipsis }
/* Icons sit in one 40px slot so labels line up whatever the icon. */
.rows .ico { width: 40px; display: grid; place-items: center; flex: none }
.rows .right { display: flex; align-items: center; gap: 4px; padding-right: 4px }
.stars { display: inline-flex; gap: 2px; vertical-align: middle }
.rows p { padding: 4px 0 }
.cell { display: grid; place-items: center; overflow: hidden }
.unseen { filter: brightness(0) }
[hidden] { display: none !important }

#tabs { position: absolute; left: 8px; right: 8px; top: 4px; height: 32px; display: flex; gap: 8px }
#tabs .panel { position: static; height: 32px; padding: 4px 12px; cursor: pointer }
#tabs .panel.on { background: var(--red) }
#tabs .purse { margin-left: auto; display: flex; align-items: center; gap: 8px; cursor: default }
#msg { left: 8px; right: 8px; bottom: 8px; height: 56px; padding: 6px 12px; display: flex; gap: 8px; align-items: flex-start }
#msg.with-eggs { align-items: center; padding-top: 0; padding-bottom: 0 }
#msg.with-eggs > div { display: flex; gap: 12px; align-items: center }
#msg .eggs { display: flex; gap: 12px; align-items: center }
#msg .eggs span { display: flex; gap: 4px; align-items: center }
/* Art PNGs, always at a whole-number scale. */
.art { image-rendering: pixelated; display: block; flex: none }
.mini { display: block; flex: none; image-rendering: pixelated; background-repeat: no-repeat }

/* Pull: an arrow in its own column (32-48), the machine (56-268), the vouchers
   and the menu in their own column (276-492), the other arrow (500-516), the next
   machine from 524, and the message box under all of them. Machines end at
   y 272 with a closed base, above the message box (280). */
#counts { position: absolute; left: 276px; top: 8px; width: 216px; display: grid; grid-template-columns: 104px 104px; gap: 8px }
#counts .panel { position: static; height: 32px; display: flex; align-items: center; justify-content: space-between; padding: 4px 8px }
/* The banner: the 40x30 mini sprite at 1x, inside the plate. */
#banner { position: absolute; width: 40px; height: 30px; pointer-events: none }

#menu { left: 276px; top: 88px; width: 216px; padding: 4px 8px }
.hit { position: absolute; cursor: pointer }

/* Eggs */
/* Eggs: the selected egg on the left, every egg in a grid on the right. */
#egg-pic { left: 8px; top: 8px; width: 232px; height: 112px; padding: 4px; display: grid; place-items: center }
#egg-name { left: 8px; top: 128px; width: 232px; height: 48px; padding: 4px 12px }
#egg-day { left: 8px; top: 184px; width: 232px; height: 40px }
#egg-from { left: 8px; top: 232px; width: 232px; height: 40px }
#eggs-tray { left: 248px; top: 8px; width: 384px; height: 264px }
/* 10 columns of 36x40 cells: the 31x33 egg at 1x over its wave bar. Six rows show; the tray scrolls by whole rows. */
#eggs-grid { display: grid; grid-template-columns: repeat(10, 36px); grid-auto-rows: 40px; height: 240px; overflow-y: auto;
             scrollbar-width: thin; scrollbar-color: var(--red) var(--panel); scroll-snap-type: y mandatory }
#eggs-grid > * { scroll-snap-align: start }
#eggs-grid .egg { display: grid; place-items: start center; padding-top: 2px; position: relative; cursor: pointer }
#eggs-grid .egg i { position: absolute; left: 2px; bottom: 2px; height: 2px; background: var(--gold) }
#eggs-grid .bracket { position: absolute; inset: 0; pointer-events: none }
#eggs-grid .bracket b { position: absolute; width: 8px; height: 8px; border: 0 solid var(--red) }
#eggs-grid .bracket b:nth-child(1) { left: 0; top: 0; border-width: 2px 0 0 2px }
#eggs-grid .bracket b:nth-child(2) { right: 0; top: 0; border-width: 2px 2px 0 0 }
#eggs-grid .bracket b:nth-child(3) { left: 0; bottom: 0; border-width: 0 0 2px 2px }
#eggs-grid .bracket b:nth-child(4) { right: 0; bottom: 0; border-width: 0 2px 2px 0 }
#hatch { left: 8px; top: 8px; width: 624px; height: 264px; padding: 4px 8px; display: grid; grid-template-columns: 96px 1fr; grid-template-rows: 36px 1fr; gap: 0 12px }
#hatch .title, #hatch .head { grid-column: 1 / -1 }
#hatch.sum { grid-template-rows: 24px 1fr }
#hatch .cell { width: 96px; height: 96px; background: var(--ink) }
#hatch .cell.egg-phase { background: var(--panel) }
#hatch-text div { min-height: 20px }
#hatch .grid { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(6, 96px); gap: 4px 4px; overflow: hidden }
#hatch .grid .tag { height: 16px; line-height: 16px; text-align: center }

/* Dex */
#dex-list { left: 8px; top: 8px; width: 248px; height: 264px; display: flex; flex-direction: column }
#dex-rows { height: 192px }
/* Dex rows hold the 40x30 mini sprite at 1x, so they are 32px tall: 6 whole rows. */
#dex-rows > div { height: 32px }
#dex-detail { left: 264px; top: 8px; width: 368px; height: 264px; display: grid; grid-template-columns: 96px 1fr; grid-template-rows: 96px 1fr; gap: 8px 12px }
#dex-detail .cell { width: 96px; height: 96px; background: var(--ink) }
#dex-acts { grid-column: 1 / -1; height: 120px }

/* Starter pick: the Dex layout, with the three gifts under the starter. */
#starter-list { left: 8px; top: 8px; width: 248px; height: 264px; display: flex; flex-direction: column }
/* 32px rows, 6 whole rows under the title, like the Dex. */
#starter-rows { height: 192px }
#starter-rows > div { height: 32px }
#starter-detail { left: 264px; top: 8px; width: 368px; height: 264px; display: grid; grid-template-columns: 96px 1fr; grid-template-rows: 96px 1fr; gap: 8px 12px }
#starter-detail .cell { width: 96px; height: 96px; background: var(--ink) }
#starter-gifts { grid-column: 1 / -1; height: 144px }
#starter-gifts > div { height: 32px }

/* Shop and quests share one layout */
.left-panel { left: 8px; top: 8px; width: 400px; height: 264px; display: flex; flex-direction: column }
.right-panel { left: 416px; top: 8px; width: 216px; height: 264px; display: flex; flex-direction: column; gap: 8px }
.right-panel .cell { width: 96px; height: 96px; background: var(--ink); align-self: center }
/* Scrolling lists hold whole rows only: 8 × 24px. */
.left-panel .rows, .right-panel .rows { height: 192px }
#off { position: absolute; left: 8px; right: 8px; top: 48px; padding: 12px }
/* Story: the stage list needs less width than the stage panel, which lists up to
   eight lines (name, waves, enemies, flying, exploding, armored, rewards), so the
   split is 304 + 312 and the panel's lines sit without the 8px gaps. */
#scr-story .left-panel { width: 304px }
#scr-story .right-panel { left: 320px; width: 312px }
#story-info { gap: 0 }
/* Weekly milestones: two rows of two, a check, the risk and the reward's icon. */
#story-info .milestones { display: grid; grid-template-columns: 1fr 1fr; gap: 0 8px; margin-top: 4px }
#story-info .milestones span { display: flex; align-items: center; gap: 4px; white-space: nowrap; height: 24px }

/* Story and battles, on the 344px stage: HUD 4-36, field 40-280, deploy cards 284-336. */
#tabs.locked .panel[data-tab] { color: var(--dim); cursor: default }
#battle-hud { left: 8px; top: 4px; width: 624px; height: 32px; padding: 4px 12px; display: flex; gap: 16px; align-items: center; white-space: nowrap }
#battle-hud .right { margin-left: auto }
#field { position: absolute; left: 80px; top: 40px; width: 480px; height: 240px; outline: 2px solid var(--ink); cursor: pointer }
#deploy { left: 8px; bottom: 8px; width: 624px; height: 52px; display: grid; grid-template-columns: repeat(8, 72px); gap: 4px; padding: 4px 8px }
#deploy .card { height: 40px; background: var(--ink); padding: 0 4px; line-height: 20px; cursor: pointer; white-space: nowrap; overflow: hidden }
#deploy .card.on { outline: 2px solid var(--paper); outline-offset: -2px }
#deploy .card.off { color: var(--dim) }
#battle-talk { left: 8px; bottom: 8px; width: 624px; height: 52px; padding: 4px 12px; cursor: pointer }
#battle-result { left: 160px; top: 56px; width: 320px; height: 200px; padding: 8px 16px; cursor: pointer }
#battle-result .reward-icons { display: flex; align-items: center; gap: 2px; white-space: nowrap }
</style>
</head>
<body>
<canvas id="sky" width="640" height="384"></canvas>
<div id="wrap" tabindex="0" aria-label="Poké Gacha. Arrow keys move, Enter picks, Backspace goes back, number keys switch screens.">
  <div id="frame">
    <div id="tabs"></div>
    <div id="stage">
      <section id="scr-story" class="screen" hidden>
        <div class="panel left-panel" id="story-list-panel"><div class="title" id="story-title">CHAPTER</div><div class="rows scroll" id="story-list"></div></div>
        <div class="panel right-panel" id="story-info"></div>
        <div class="panel left-panel" id="squad-list-panel" hidden><div class="title" id="squad-title">SQUAD</div><div class="rows scroll" id="squad-list"></div></div>
        <div class="panel right-panel" id="squad-info" hidden></div>
      </section>
      <section id="scr-battle" class="screen" hidden>
        <div class="panel" id="battle-hud"></div>
        <canvas id="field" width="480" height="240"></canvas>
        <div class="panel" id="deploy"></div>
        <div class="panel" id="battle-talk" hidden></div>
        <div class="panel" id="battle-result" hidden></div>
      </section>
      <section id="scr-pull" class="screen">
        <div id="counts"></div>
        <div id="banner" class="mini" hidden></div>
        <div class="hit" id="hit-left" style="left:0;top:6px;width:52px;height:266px" title="Previous machine"></div>
        <div class="hit" id="hit-right" style="left:496px;top:6px;width:144px;height:266px" title="Next machine"></div>
        <div class="hit" id="hit-machine" style="left:56px;top:6px;width:212px;height:266px" title="Open the voucher menu"></div>
        <div class="panel rows" id="menu" role="listbox"></div>
      </section>
      <section id="scr-eggs" class="screen" hidden>
        <div class="panel" id="egg-pic"></div>
        <div class="panel title" id="egg-name"></div>
        <div class="panel" id="egg-day"></div>
        <div class="panel" id="egg-from"></div>
        <div class="panel" id="eggs-tray"><div id="eggs-grid"></div></div>
        <div class="panel" id="hatch" hidden></div>
      </section>
      <section id="scr-dex" class="screen" hidden>
        <div class="panel" id="dex-list"><div class="title" id="dex-title">DEX</div><div class="rows scroll" id="dex-rows"></div></div>
        <div class="panel" id="dex-detail"><div class="cell" id="dex-pic"></div><div id="dex-info"></div><div class="rows scroll" id="dex-acts"></div></div>
      </section>
      <section id="scr-shop" class="screen" hidden>
        <div class="panel left-panel"><div class="title" id="shop-title">SHOP</div><div class="rows scroll" id="shop-list"></div></div>
        <div class="panel right-panel" id="shop-preview"></div>
      </section>
      <section id="scr-quests" class="screen" hidden>
        <div class="panel left-panel"><div class="title">MISSIONS</div><div class="rows scroll" id="quest-list"></div></div>
        <div class="panel right-panel"><div class="title" id="trophy-title">TROPHIES</div><div class="rows scroll" id="trophy-list"></div></div>
      </section>
      <section id="scr-starter" class="screen" hidden>
        <div class="panel" id="starter-list"><div class="title" id="starter-title">STARTER</div><div class="rows scroll" id="starter-rows"></div></div>
        <div class="panel" id="starter-detail"><div class="cell" id="starter-pic"></div><div id="starter-info"></div><div class="rows" id="starter-gifts"></div></div>
      </section>
      <div class="panel" id="msg" role="status"></div>
      <div class="panel" id="off" hidden>Open Poké Gacha from the Bored arcade: your wallet, eggs and dex live on your Bored profile.</div>
    </div>
  </div>
</div>
<script>
/* Poké Gacha. The engine and the wallet live in the hub (src/hub/gacha.js,
   src/hub/rewards.js) and this page calls them through parent.__boredGacha,
   so every pull and hatch lands in the one ledger that syncs to the account.
   Pulls are cosmetic outside Poké Gacha's own tower defense (coming later). */
const $ = s => document.querySelector(s);
const SPRITE_DIR = /\/games\/content\/[^/]+\.html([?#].*)?$/.test(document.baseURI) ? "pokedoku/sprites/" : "games/content/pokedoku/sprites/";
const G = (() => { try { return parent !== window && parent.__boredGacha ? parent.__boredGacha : null; } catch { return null; } })();
const PREF = "bored.poke-gacha.ui";
const pref = (() => { try { return JSON.parse(localStorage.getItem(PREF) || "null") || {}; } catch { return {}; } })();
const keep = () => { try { localStorage.setItem(PREF, JSON.stringify(pref)); } catch {} };
let tab = pref.tab || "pull", machine = pref.machine || "move", S = null;
const name = num => G.dex[num - 1][0];
const REASONS = { vouchers: "Not enough vouchers.", full: "Egg storage is full (99). Hatch some first.", inactive: "Your wallet is not open yet.",
  candy: "Not enough candy.", shards: "Not enough shards.", owned: "Already done.", order: "Cut the cost by 1 first.", locked: "That look is not unlocked.",
  "not-owned": "You do not have that one yet." };

/* ── The palette, and pixel art drawn at 2x from it ────────────────────── */
const C = { ink: "#1c1b2c", panel: "#2c2a44", red: "#c8372f", paper: "#f4f1ff", dim: "#807c9a", gold: "#e3ad2b", teal: "#3f9e8a", sky: "#8fd3e8" };
const TIER_NAME = ["Common", "Rare", "Epic", "Legendary", "Banner"];
const ART = 2;
// Darker and lighter shades of the eight colors, for the art only ([dark, base, light]).
// Panels and text keep to the eight.
const SHADE = {
  paper: ["#c9c4dc", C.paper, "#ffffff"], sky: ["#4f93b8", C.sky, "#d4f1f8"], gold: ["#a07514", C.gold, "#f6d77a"],
  red: ["#8f2621", C.red, "#f0857a"], teal: ["#256656", C.teal, "#7fcdb7"]
};
// A canvas of w×h art pixels, each ART internal pixels across.
function pixelCanvas(w, h, draw, scale = ART) {
  const c = document.createElement("canvas");
  c.width = w * scale; c.height = h * scale;
  c.style.width = w * scale + "px"; c.style.height = h * scale + "px";
  const g = c.getContext("2d");
  g.scale(scale, scale);
  draw(g);
  return c;
}
/* The owner's art: eggs per tier (white Common, blue Rare, black Epic, purple
   Legendary and the banner), the vouchers, the coin and the shard. Each PNG is
   shown at a whole-number scale (scripts/gacha-art.py brings stretched uploads
   back to their native size). */
const ART_DIR = SPRITE_DIR.replace("pokedoku/sprites/", "poke-gacha/art/");
const EGG_SIZE = [31, 33], COIN_SIZE = [17, 18], SHARD_SIZE = [17, 18], TICKET_SIZE = [21, 17];
const EGG_ART = [0, 1, 2, 3, 3];
function artImg(file, [w, h], scale = 1, alt = "") {
  const img = new Image(w * scale, h * scale);
  img.className = "art"; img.alt = alt; img.draggable = false;
  img.src = ART_DIR + file;
  return img;
}
const eggImg = (tier, scale = 1) => artImg("egg-" + EGG_ART[tier] + ".png", EGG_SIZE, scale, TIER_NAME[tier] + " egg");
// The coin and the shard are the same size, both at 1x.
const coin = () => artImg("coin.png", COIN_SIZE, 1, "coins");
const shardIcon = () => artImg("shard.png", SHARD_SIZE, 1, "shards");
// Vouchers, worst to best: green Regular, blue Plus, purple Premium, gold Gold.
const ticket = (kind, scale = 1) => artImg("ticket-" + kind + ".png", TICKET_SIZE, scale, kind[0].toUpperCase() + kind.slice(1) + " voucher");
// The same eggs for canvas drawing, redrawn once they arrive.
const EGG_PICS = [0, 1, 2, 3].map(i => { const img = new Image(); img.src = ART_DIR + "egg-" + i + ".png"; return img; });
/* Mini sprites: 40x30 icons in two atlases (scripts/gacha-art.py), 32 a row. */
const MINI = [40, 30], MINI_COLS = 32, MINI_SHEET = [1280, 990];
function miniStyle(node, num, look = "normal", scale = 1) {
  const n = isSkin(look) ? (skinOf(look)?.species || num) : num;
  const i = n - 1;
  Object.assign(node.style, {
    width: MINI[0] * scale + "px", height: MINI[1] * scale + "px",
    backgroundImage: "url(" + ART_DIR + (look === "shiny" ? "icons-shiny.webp" : "icons.webp") + ")",
    backgroundSize: MINI_SHEET[0] * scale + "px " + MINI_SHEET[1] * scale + "px",
    backgroundPosition: -(i % MINI_COLS) * MINI[0] * scale + "px " + -Math.floor(i / MINI_COLS) * MINI[1] * scale + "px"
  });
  return node;
}
const mini = (num, look, dark = false) => { const d = miniStyle(el("span", "mini" + (dark ? " unseen" : "")), num, look); d.title = name(num); return d; };
/* PIXEL_MAPS:BEGIN — hand-placed icons, one char per pixel. tests/poke-gacha.test.cjs checks the outlines. */
const PIXEL_MAPS = {
 "candy": ["..kkkk..", ".k2211k.", "k22w110k", "k2w1w10k", "k21w110k", "k111100k", ".k1000k.", "..kkkk.."],
 "check": ["......kk", ".....k1k", "kk..k1k.", "k1kk1k..", ".k11k...", "..kk...."],
 "dot": ["kkkk", "k11k", "k11k", "kkkk"],
 "star": ["........k........", ".......k3k.......", ".......k3k.......", "......k321k......", "......k321k......", ".kkkkk32221kkkkk.", "k333332222211111k", ".k3222222222221k.", "..k32222222221k..", "...k322222221k...", "....k3222221k....", "....k3222221k....", "...k322222221k...", "...k3211k2221k...", "..k321kk.kk221k..", "..k31k.....k21k..", "...kk.......kk..."],
 "shield": ["kkkkk", "k121k", "k111k", "k111k", ".k1k.", "..k.."]
};
/* PIXEL_MAPS:END */
// Draw a pixel map: '.' is transparent, every other char looks its color up in `pal`.
function mapCanvas(key, pal, scale = ART) {
  const map = PIXEL_MAPS[key];
  return pixelCanvas(map[0].length, map.length, g => map.forEach((row, y) => { for (let x = 0; x < row.length; x++) if (row[x] !== ".") { g.fillStyle = pal[row[x]]; g.fillRect(x, y, 1, 1); } }), scale);
}
const candyIcon = () => mapCanvas("candy", { k: C.ink, 0: SHADE.red[0], 1: C.red, 2: SHADE.red[2], w: C.paper });
const check = done => done ? mapCanvas("check", { k: C.ink, 1: C.gold }) : mapCanvas("dot", { k: C.ink, 1: C.dim });
// Stage stars: the owner's 17x17 star at 1x, like the coin and the shard. Earned
// stars keep its yellows (3 light, 2 base, 1 shade); the rest are the same star
// in grays, ending on the page's dim. Three in a row.
const STAR_GOLD = { k: C.ink, 3: "#faec91", 2: "#f6d923", 1: "#f7ad25" };
const STAR_GRAY = { k: C.ink, 3: "#d6d4e0", 2: "#a9a6bb", 1: C.dim };
function starIcons(n) {
  const row = document.createElement("span");
  row.className = "stars"; row.title = n + " of 3 stars";
  for (let i = 0; i < 3; i++) row.append(mapCanvas("star", i < n ? STAR_GOLD : STAR_GRAY, 1));
  return row;
}

/* ── Shared pieces: elements, sprites in fixed cells, lists, messages ──── */
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; };
// SP skins: hand-made art listed in poke-gacha/sp/skins.json. Hidden until the list has one.

function drawScene() {

  h: ["#...", "#...", "###.", "#..#", "#..#", "#..#", "#..#", "#..#"],
  i: ["#", ".", "#", "#", "#", "#", "#", "#"],
  n: ["....", "....", "###.", "#..#", "#..#", "#..#", "#..#", "#..#"],

const PLATE_EMBLEM = {

// The mini sprite sheet, for the banner on a Legendary UP machine at the side.

  if (emblem) emblem.map.forEach((row, r) => { for (let c = 0; c < 7; c++) if (row[c] !== ".") { g.fillStyle = emblem.colors[row[c]]; g.fillRect((50 + c) * ART, (35 + r) * ART, ART, ART); } });

function untilMidnight() {

  line.append(el("span", "c1", o.times), counted ? el("span", "c2", n) : "", counted ? rest.join(" ") : o.label);

function haveFor(option) {
  if (option.buy) return S.balance.coins >= 100;
  if (option.cancel) return true;
  return (S.balance[option.voucher] || 0) >= (option.voucher === "regular" ? option.count : 1);
}
function updateScene() {

    const b = el("div", "panel");
    b.append(el("span", "num", S.balance[kind]), ticket(kind));
    b.title = kind[0].toUpperCase() + kind.slice(1) + " vouchers";
    return b;
  }));
  const legend = machine === "legend";

  if (legend) { miniStyle($("#banner"), S.banner, "normal", 1); $("#banner").title = name(S.banner); }

function switchMachine(step) {
  machine = pref.machine = ORDER_M[(ORDER_M.indexOf(machine) + step + 3) % 3];
  keep();
  message = null;
  const from = step * 120, start = performance.now();
  const tick = now => {
    const t = Math.min(1, (now - start) / 160);
    slide = Math.round(from * (1 - t));
    drawScene();
    if (t < 1) requestAnimationFrame(tick);
  };
  slide = from;
  updateScene();
  requestAnimationFrame(tick);
}
function turnCrank() {

    const t = Math.min(1, (now - start) / 420);
    shake = t;
    if (tab === "pull") drawScene();
    if (t < 1) requestAnimationFrame(tick); else shake = 0;
  };

}
function choose(i) {
  const option = OPTIONS[i];
  cursor = i;
  if (option.cancel) { menuOpen = false; message = null; return updateScene(); }
  if (!haveFor(option)) { message = { text: option.buy ? "Not enough coins: a Regular costs 100." : "You don't have enough vouchers for that." }; return updateScene(); }
  if (option.buy) {
    const r = G.buyRegular({ count: 1 });
    message = { text: r.ok ? "Bought 1 Regular for 100 coins." : REASONS[r.reason] || "Not now." };
  } else {
    const r = G.pull({ voucher: option.voucher, count: option.count, machine });
    if (r.ok) { turnCrank(); message = { text: r.eggs.length + (r.eggs.length === 1 ? " egg:" : " eggs:"), eggs: r.eggs }; }
    else message = { text: REASONS[r.reason] || "Not now." };
  }

}
function pullKey(e) {
  const k = e.key;
  if (k === "ArrowLeft" || k === "ArrowRight") { e.preventDefault(); switchMachine(k === "ArrowLeft" ? -1 : 1); }
  else if (k === "ArrowUp" || k === "ArrowDown") {
    e.preventDefault();
    if (!menuOpen) { menuOpen = true; message = null; return updateScene(); }
    cursor = (cursor + (k === "ArrowUp" ? -1 : 1) + OPTIONS.length) % OPTIONS.length;
    message = null; updateScene();
  } else if (k === "Enter" || k === " ") {
    e.preventDefault();
    if (!menuOpen) { menuOpen = true; message = null; return updateScene(); }
    choose(cursor);
  } else if (k === "Backspace") { e.preventDefault(); menuOpen = false; message = null; updateScene(); }
}

/* ── Eggs: the tray, and hatching ──────────────────────────────────────── */
let eggAt = 0, hatching = null;

function eggWords(egg) {
  const part = egg.need ? egg.progress / egg.need : 1;
  if (egg.free) return "One of your first " + (G.freeHatches || 10) + " eggs: it hatches right away!";
  if (egg.ready) return "Something is moving inside. It's ready to hatch!";
  if (part >= 0.66) return "It's starting to move. It will hatch soon.";
  if (part >= 0.33) return "It makes small sounds now and then. Not long now.";

function eggsUpdate() {
  drawBackdrop();

  if (eggAt >= S.eggs.length) eggAt = Math.max(0, S.eggs.length - 1);
  $("#eggs-grid").replaceChildren(...S.eggs.map((egg, i) => {
    const cell = el("div", "egg");
    cell.dataset.egg = i;
    cell.append(eggImg(egg.tier));
    const bar = el("i"); bar.style.width = (egg.need ? Math.round(16 * egg.progress / egg.need) : 16) * 2 + "px";
    cell.append(bar);
    if (i === eggAt) { const br = el("div", "bracket"); br.append(el("b"), el("b"), el("b"), el("b")); cell.append(br); }
    return cell;
  }));
  if (!S.eggs.length) $("#eggs-grid").append(el("p", "dim", "No eggs yet."));
  const at = $("#eggs-grid").children[eggAt];
  if (at && S.eggs.length) at.scrollIntoView({ block: "nearest" });
  $("#eggs-grid").onclick = e => { const c = e.target.closest("[data-egg]"); if (!c) return; if (Number(c.dataset.egg) === eggAt) startHatch(); else { eggAt = Number(c.dataset.egg); eggsUpdate(); } };

  $("#egg-pic").replaceChildren(egg ? eggImg(egg.tier, 3) : el("span", "dim", "No eggs"));
  titled($("#egg-name"), egg ? TIER_NAME[egg.tier].toUpperCase() + " EGG" : "EGGS", egg ? undefined : "0/" + G.maxEggs);
  $("#egg-day").replaceChildren(el("span", "", egg && egg.day ? egg.day + " " + weekday(egg.day) : "—"));
  const from = egg ? G.machines[egg.machine] + (egg.banner ? ": " + name(egg.banner) : "") : "Pull some on the Pull tab";
  $("#egg-from").replaceChildren(el("span", egg ? "" : "dim", from));
  const progress = egg ? el("span", "num", egg.progress + "/" + egg.need) : null;
  if (egg) say(eggWords(egg) + " ", (() => { const d = el("div"); if (egg.free) d.append("No waves needed · "); else d.append(progress, " waves · ");
    d.append( ready ? "Enter hatches " + ready + " ready." : "Waves come from Poké Idle, Pokédoku and battles."); return d; })());

}
function eggsKey(e) {
  const k = e.key, n = S.eggs.length;

  if (step) { e.preventDefault(); if (n) { eggAt = Math.max(0, Math.min(n - 1, eggAt + step)); eggsUpdate(); } }

// The hatching egg: the owner's egg at 2x (62x66) standing in the 96px cell,

function bigEgg(tier, wobble, crack) {

  c.width = c.height = 96; c.style.width = c.style.height = "96px";
  const g = c.getContext("2d");

  const pic = EGG_PICS[EGG_ART[tier]];

  if (crack) { g.fillStyle = C.ink; for (let i = -12; i <= 12; i += 4) g.fillRect(x + 31 + i, 50 + (i % 8 ? 2 : -2), 4, 2); }

  const list = G.starters, p = picking, num = list[p.at];
  titled($("#starter-title"), "STARTER", list.length);
  rows($("#starter-rows"), list.map(n => ({ icon: mini(n), label: String(n).padStart(4, "0") + " " + name(n) })), p.at,
    (i, click) => { if (click && i === p.at) return starterEnter(); p.at = i; p.sure = false; starterUpdate(); });
  $("#starter-pic").replaceChildren(sprite(num));
  const role = roleOf(num);
  $("#starter-info").replaceChildren(el("div", "title", name(num)),
    el("div", "", "#" + String(num).padStart(4, "0") + " · " + G.dex[num - 1][1].replace("/", " / ")),
    el("div", "dim", role ? role.name + ": " + role.about : "First stage."));
  const gifts = G.starterGifts.map(n => ({ icon: mini(n), label: name(n), right: roleOf(n) ? roleOf(n).name : "" }));
  gifts.push({ label: p.sure ? "Yes, take " + name(num) : "Choose " + name(num), right: p.sure ? "Enter" : "" });
  rows($("#starter-gifts"), gifts, p.sure ? gifts.length - 1 : -1, (i, click) => { if (click && i === gifts.length - 1) starterEnter(); });
  say(p.sure ? "Take " + name(num) + " for good? Enter: yes. Backspace: no."
    : "Pick your first Pokémon. It comes with " + giftNames() + ", so your squad is four.");
}
function starterEnter() {
  const p = picking, num = G.starters[p.at];
  if (!p.sure) { p.sure = true; return starterUpdate(); }
  const r = G.pickStarter({ species: num });
  if (!r.ok && r.reason !== "picked") { p.sure = false; starterUpdate(); return say(REASONS[r.reason] || "Not now."); }
  picking = null;
  $("#scr-starter").hidden = true;
  $("#tabs").classList.remove("locked");
  // A squad of the four, the blocker first, for the first stage.
  if (r.ok) { pref.squad = [...G.starterGifts, num]; keep(); }
  go(T ? "story" : "pull");
  if (r.ok) say(name(num) + " joins you, with " + giftNames() + "." + (T ? " Play 1-1 here." : "") + " Your first " + (G.freeHatches || 10) + " eggs hatch at once.");
}
function starterKey(e) {
  const p = picking, n = G.starters.length;
  const step = { ArrowUp: -1, ArrowDown: 1, ArrowLeft: -7, ArrowRight: 7 }[e.key];
  if (step) { e.preventDefault(); p.at = Math.max(0, Math.min(n - 1, p.at + step)); p.sure = false; return starterUpdate(); }
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); return starterEnter(); }
  if (e.key === "Backspace" && p.sure) { e.preventDefault(); p.sure = false; starterUpdate(); }
}

/* ── Frame, tabs and switching screens ─────────────────────────────────── */
const TABS = [["story", "Story"], ["pull", "Pull"], ["eggs", "Eggs"], ["dex", "Dex"], ["shop", "Shop"], ["quests", "Quests"]];
// The tabs shown: Story only once the hub has the tower defense engine.
const shownTabs = () => TABS.filter(([id]) => id !== "story" || T);
const SCREENS = { story: [storyUpdate, storyKey], pull: [updateScene, pullKey], eggs: [eggsUpdate, eggsKey], dex: [dexUpdate, dexKey], shop: [shopUpdate, shopKey], quests: [questsUpdate, questsKey] };
function refreshTop() {
  S = G.state();
  const ready = S.eggs.filter(e => e.ready).length;
  $("#tabs").replaceChildren(...shownTabs().map(([id, label], i) => {
    const t = el("div", "panel" + (tab === id && !picking ? " on" : ""));
    t.append(el("span", "", label));
    if (id === "eggs" && ready) t.append(" ", el("span", "num", ready));
    t.dataset.tab = id;
    t.title = label + " (" + (i + 1) + ")";
    return t;
  }));
  const purse = el("div", "panel purse");
  purse.append(el("span", "num", S.balance.coins), coin(), el("span", "num", S.balance.shards), shardIcon());
  purse.title = "Coins and shards";
  $("#tabs").append(purse);
}
function go(id) {
  if (!SCREENS[id] || hatching || battle || picking || !shownTabs().some(([shown]) => shown === id)) return;
  tab = pref.tab = id; keep();
  message = null;
  for (const [sid] of TABS) $("#scr-" + sid).hidden = sid !== id;
  refreshTop();
  SCREENS[id][0]();
  $("#wrap").focus({ preventScroll: true });
}
// The biggest scale that fits the window, in quarter steps (1, 1.25, 1.5 ... 2,
// 2.25 ...), rendered pixelated, so a 1900x800 or larger embed fills its height
// instead of stopping at a whole number. Below 640x384 (a phone) it shrinks to
// fit exactly. The scene canvas covers the whole window at the same scale.
function placeFrame() {
  const W = document.documentElement.clientWidth, H = document.documentElement.clientHeight;
  const fit = Math.min(W / FRAME_W, H / FRAME_H);
  const k = fit >= 1 ? Math.floor(fit * 4) / 4 : fit;
  // The canvas in internal pixels, and the frame's corner on it.
  VIEW.w = Math.max(FRAME_W, Math.ceil(W / k)); VIEW.h = Math.max(FRAME_H, Math.ceil(H / k));
  VIEW.x = Math.floor((VIEW.w - FRAME_W) / 2); VIEW.y = Math.floor((VIEW.h - FRAME_H) / 2);
  const sky = $("#sky");
  if (sky.width !== VIEW.w || sky.height !== VIEW.h) { sky.width = VIEW.w; sky.height = VIEW.h; }
  sky.style.width = VIEW.w + "px"; sky.style.height = VIEW.h + "px";
  sky.style.transform = "scale(" + k + ")";
  const wrap = $("#wrap");
  Object.assign(wrap.style, { left: VIEW.x * k + "px", top: VIEW.y * k + "px", width: Math.floor(FRAME_W * k) + "px", height: Math.floor(FRAME_H * k) + "px" });
  $("#frame").style.transform = "scale(" + k + ")";
  if (S && tab === "pull" && !hatching && !picking) drawScene(); else drawBackdrop();
}
window.addEventListener("resize", placeFrame);
try { document.fonts.load('20px "Jersey 10"').then(found => { if (!found.length) $("#frame").classList.add("no-pixel"); }, () => $("#frame").classList.add("no-pixel")); }
catch { $("#frame").classList.add("no-pixel"); }
placeFrame();
// The eggs in the domes and in the hatching egg are drawn once their art arrives.
machinesLoaded.then(() => { if (S && tab === "pull" && !picking) drawScene(); });
if (!G) {
  drawBackdrop();
  for (const [sid] of TABS) $("#scr-" + sid).hidden = true;
  $("#msg").hidden = true; $("#off").hidden = false;
} else {
  document.addEventListener("keydown", e => {
    if (battle) return battleKey(e);
    if (picking) return starterKey(e);
    if (/^[1-9]$/.test(e.key) && !hatching && shownTabs()[Number(e.key) - 1]) { e.preventDefault(); return go(shownTabs()[Number(e.key) - 1][0]); }
    if (hatching) return hatchKey(e);
    SCREENS[tab][1](e);
  });
  $("#tabs").onclick = e => { const t = e.target.closest("[data-tab]"); if (t) go(t.dataset.tab); };
  $("#field").onclick = e => {
    if (!battle || battle.talk.length || battle.done) return;
    const box = $("#field").getBoundingClientRect(), k = box.width / 480;
    const x = Math.floor((e.clientX - box.left) / k / TILE), y = Math.floor((e.clientY - box.top) / k / TILE);
    battle.cur = [x, y]; tileAction(x, y);
  };
  $("#deploy").onclick = e => { const c = e.target.closest("[data-slot]"); if (c && battle) { battle.slot = Number(c.dataset.slot); battle.selected = null; } };
  $("#battle-talk").onclick = () => battle && battleKey({ key: "Enter", preventDefault() {} });
  $("#battle-result").onclick = () => battle && battle.done && !battle.talk.length && leaveBattle();
  $("#menu").onmousemove = e => { const r = e.target.closest("[data-row]"); if (r && Number(r.dataset.row) !== cursor && !message) { cursor = Number(r.dataset.row); updateScene(); } };
  $("#hit-left").onclick = () => switchMachine(-1);
  $("#hit-right").onclick = () => switchMachine(1);
  $("#hit-machine").onclick = () => { menuOpen = true; message = null; updateScene(); };
  $("#hatch").onclick = () => hatching && hatchKey({ key: "Enter", preventDefault() {} });
  // The Legendary UP timer is on screen whichever machine is in front.
  setInterval(() => { if (tab === "pull" && !hatching && !picking && !document.hidden) drawScene(); }, 1000);
  // Waves earned in another game, or a sync from another device, show up here.
  let seen = "";
  setInterval(() => {
    if (document.hidden || hatching || picking) return;
    const now = JSON.stringify(G.state());
    if (now !== seen) { seen = now; refreshTop(); SCREENS[tab][0](); }
  }, 3000);
  const login = G.claimLogin().ok;
  go(shownTabs().some(([id]) => id === tab) ? tab : "pull");
  // The starter pick comes first, for a new player and once for an old one.
  if (needsStarter()) openStarter();
  else if (login) { if (tab === "pull") { message = { text: "Daily login: +3 Regular vouchers." }; updateScene(); } else say("Daily login: +3 Regular vouchers."); }
}

// The hub reads this. Poké Gacha itself is unscored; weeklyRisk (this week's
// best risk won) feeds its second board, poke-gacha-weekly.
window.__boredSnapshot = () => {
  let weeklyRisk = 0;
  try { weeklyRisk = T && T.state ? Number(T.state().challengeBest) || 0 : 0; } catch {}
  try { const s = S || (G && G.state()); return { slug: "poke-gacha", caught: s ? s.owned.length : 0, pulls: s ? s.pulls : 0, weeklyRisk, finished: false }; }
  catch { return { slug: "poke-gacha", caught: 0, pulls: 0, weeklyRisk, finished: false }; }
};
</script>
