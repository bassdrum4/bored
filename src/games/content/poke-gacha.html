<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Poké Gacha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box }
  body { display: grid; place-items: start center; min-height: 100vh; padding: 14px 0 28px; background: #f5f2ea; color: #191713;
         font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace }
  main { width: min(360px, 94vw) }
  #hud { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; border-bottom: 1px solid #191713; padding-bottom: 6px }
  #waves { font-size: 11px; color: #6b6558; margin-top: 2px }
  nav { display: flex; gap: 4px; margin: 10px 0 }
  button { font: inherit; font-size: 12px; border: 1px solid #191713; background: none; color: inherit; padding: 6px 9px;
           border-radius: 2px; cursor: pointer; touch-action: manipulation }
  button:disabled { color: #a49d8d; border-color: #d8d2c4; cursor: default }
  button.on { background: #191713; color: #f5f2ea }
  nav button { flex: 1; padding: 6px 4px }
  h2 { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; margin: 14px 0 6px }
  p, li { font-size: 12px }
  .quiet { color: #6b6558 }
  .row { display: flex; flex-wrap: wrap; gap: 4px; align-items: center }
  .col { display: grid; gap: 4px }
  .col button { text-align: left; display: flex; justify-content: space-between; gap: 8px }
  .box { border: 1px solid #d8d2c4; background: #fffdf7; padding: 8px; margin-top: 6px }
  .banner { display: flex; gap: 8px; align-items: center }
  img.spr { image-rendering: pixelated; object-fit: contain }
  img.sp { filter: hue-rotate(150deg) saturate(1.3) }
  .eggs { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 6px }
  .egg { border: 1px solid #d8d2c4; padding: 1px 4px; font-size: 11px; background: #fffdf7 }
  .egg.t1 { border-color: #191713 } .egg.t2, .egg.t3, .egg.t4 { border-color: #b3412e; color: #b3412e }
  ul { list-style: none; display: grid; gap: 3px }
  .meter { height: 4px; background: #e6e0d2; margin-top: 2px } .meter i { display: block; height: 100%; background: #191713 }
  #grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; margin-top: 6px }
  #grid button { padding: 0; border-color: #d8d2c4; background: #fffdf7 }
  #grid button.on { border-color: #191713; background: #fffdf7 }
  #grid img { display: block; width: 100%; height: auto; aspect-ratio: 1 }
  .detail { display: grid; grid-template-columns: 72px 1fr; gap: 8px; align-items: start }
  .detail img { width: 72px; height: 72px; border: 1px solid #d8d2c4; background: #fffdf7 }
  .done { text-decoration: line-through; color: #6b6558 }
  #note { min-height: 18px; margin-top: 8px; color: #b3412e }
  #off { margin-top: 12px }

  /* The pull screen: a 320×180 pixel scene, scaled to the frame. The art is a
     canvas drawn here in code; the words sit on top as text so they stay sharp. */
  #pullwrap { width: min(640px, 96vw); position: relative; left: 50%; transform: translateX(-50%); margin-top: 2px; overflow: hidden;
              outline: none; touch-action: manipulation; user-select: none }
  #stage { position: absolute; left: 0; top: 0; width: 320px; height: 180px; transform-origin: 0 0;
           font-family: "Pixelify Sans", ui-monospace, SFMono-Regular, Menlo, monospace; color: #f4f1ff }
  #scene { position: absolute; inset: 0; width: 320px; height: 180px; image-rendering: pixelated }
  .win { position: absolute; background: #2c2a44; border: 2px solid #c8372f; box-shadow: 0 0 0 1px #5a1712, inset 0 0 0 1px #5a1712 }
  .win canvas { image-rendering: pixelated }
  #counts { position: absolute; right: 2px; top: 2px; display: flex; gap: 2px }
  #counts .win { position: static; width: 54px; height: 17px; display: flex; align-items: center; justify-content: space-between; padding: 0 3px 0 4px;
                 font-size: 11px; line-height: 1 }
  #plate { position: absolute; display: flex; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 600;
           color: #2c2a44; line-height: 1; pointer-events: none }
  #plate img { width: 22px; height: 22px; image-rendering: pixelated }
  #clock { position: absolute; font-size: 8px; color: #2c2a44; background: #f2f0ea; border: 1px solid #8d8a80; border-radius: 3px;
           padding: 1px 3px; line-height: 1.1; pointer-events: none }
  #menu { right: 3px; top: 50px; width: 104px; padding: 4px 2px 3px 4px }
  #menu div { display: flex; align-items: center; gap: 4px; height: 12px; font-size: 9px; line-height: 1; cursor: pointer; padding-left: 8px; position: relative; white-space: nowrap }
  #menu div.off { color: #807c9a }
  #menu div.at::before { content: ""; position: absolute; left: 1px; top: 2px; border: 4px solid transparent; border-left: 5px solid #f4f1ff; border-right: 0 }
  #menu .times { width: 18px }
  #menu[hidden] { display: none }
  #msg { left: 3px; right: 3px; bottom: 3px; height: 30px; padding: 4px 6px; font-size: 9px; line-height: 1.25; display: flex; gap: 6px; align-items: flex-start }
  #msg .eggs { display: flex; flex-wrap: wrap; gap: 1px; margin: 2px 0 0; max-height: 11px; overflow: hidden }
  .hit { position: absolute; cursor: pointer }
</style>
</head>
<body>
<main>
  <div id="hud">Poké Gacha</div>
  <div id="waves"></div>
  <nav id="tabs">
    <button type="button" data-tab="pull" class="on">Pull</button>
    <button type="button" data-tab="eggs">Eggs</button>
    <button type="button" data-tab="dex">Dex</button>
    <button type="button" data-tab="missions">Missions</button>
  </nav>
  <div id="pullwrap" tabindex="0" aria-label="Egg machines. Left and right switch machines, up and down pick a voucher, Enter pulls." hidden>
    <div id="stage">
      <canvas id="scene" width="320" height="180"></canvas>
      <div id="counts"></div>
      <div id="plate"></div>
      <div id="clock" hidden></div>
      <div class="hit" id="hit-left" style="left:0;top:40px;width:40px;height:100px" title="Previous machine"></div>
      <div class="hit" id="hit-machine" style="left:110px;top:40px;width:100px;height:100px" title="Open the voucher menu"></div>
      <div class="hit" id="hit-right" style="left:212px;top:150px;width:0;height:0"></div>
      <div class="win" id="menu" role="listbox"></div>
      <div class="win" id="msg" role="status"></div>
    </div>
  </div>
  <section id="view"></section>
  <p id="note" role="status"></p>
  <p id="off" class="quiet" hidden>Open Poké Gacha from the Bored arcade: the wallet, eggs and dex live on your Bored profile.</p>
</main>
<script>
/* Poké Gacha. The engine and the wallet live in the hub (src/hub/gacha.js,
   src/hub/rewards.js) and this page calls them through parent.__boredGacha,
   so every pull and hatch lands in the one ledger that syncs to the account.
   Pulls are cosmetic outside Poké Gacha's own tower defense (coming later). */
const $ = s => document.querySelector(s);
const SPRITE_DIR = /\/games\/content\/[^/]+\.html([?#].*)?$/.test(document.baseURI) ? "pokedoku/sprites/" : "games/content/pokedoku/sprites/";
const G = (() => { try { return parent !== window && parent.__boredGacha ? parent.__boredGacha : null; } catch { return null; } })();
const PREF = "bored.poke-gacha.ui";
const pref = (() => { try { return JSON.parse(localStorage.getItem(PREF) || "null") || {}; } catch { return {}; } })();
const keep = () => { try { localStorage.setItem(PREF, JSON.stringify(pref)); } catch {} };
let tab = "pull", machine = pref.machine || "move", picked = 0, look = "normal", lastPull = null, lastHatch = null, S = null;

const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const stars = n => n + "★";
const name = num => G.dex[num - 1][0];
const types = num => G.dex[num - 1][1].replace("/", " / ");
const sprite = (num, shiny, sp, size = 40) =>
  `<img class="spr${sp ? " sp" : ""}" src="${SPRITE_DIR}${shiny ? "shiny/" : ""}${num}.png" alt="${esc(name(num))}" width="${size}" height="${size}">`;
const note = text => { $("#note").textContent = text || ""; };
const REASONS = { vouchers: "Not enough vouchers.", full: "Egg storage is full (99). Hatch some first.", inactive: "Your wallet is not open yet.",
  candy: "Not enough candy.", shards: "Not enough shards.", owned: "Already done.", order: "Cut the cost by 1 first.", locked: "That look is not unlocked.",
  "not-owned": "You do not have that one yet." };
const said = result => { if (!result.ok) note(REASONS[result.reason] || "Not now."); return result.ok; };

function hud() {
  const b = S.balance;
  const ready = S.eggs.filter(e => e.ready).length;
  $("#hud").textContent = `Coins ${b.coins} · Shards ${b.shards} · Eggs ${S.eggs.length}/${G.maxEggs} · Dex ${S.owned.length}`;
  $("#waves").textContent = `Vouchers: ${b.regular} Regular, ${b.plus} Plus, ${b.premium} Premium, ${b.gold} Gold` + (ready ? ` · ${ready} eggs ready` : "");
  for (const button of document.querySelectorAll("#tabs button")) {
    button.classList.toggle("on", button.dataset.tab === tab);
    if (button.dataset.tab === "eggs") button.textContent = "Eggs" + (ready ? " (" + ready + ")" : "");
  }
}

function eggRow(eggs) {
  return `<div class="eggs">${eggs.map(e => `<span class="egg t${e.tier}">${e.tier === 4 ? "Banner" : stars(G.stars[e.tier])}</span>`).join("")}</div>`;
}

function eggsView() {
  const ready = S.eggs.filter(e => e.ready).length;
  const tiers = [0, 1, 2, 3, 4].map(t => S.eggs.filter(e => e.tier === t)).filter(list => list.length);
  const rows = tiers.map(list => {
    const e = list[0], label = e.tier === 4 ? "Banner " + name(e.banner) : G.tiers[e.tier] + " " + stars(G.stars[e.tier]);
    const done = list.filter(x => x.ready).length;
    return `<li>${esc(label)} ×${list.length} <span class="quiet">${done ? done + " ready" : e.progress + " of " + e.need + " waves"}</span>
      <div class="meter"><i style="width:${100 * e.progress / e.need}%"></i></div></li>`;
  }).join("");
  const hatched = lastHatch ? `<h2>Hatched</h2><ul>${lastHatch.map(h => `<li class="row">${sprite(h.species, h.shiny, h.sp, 32)}
      <span>${esc(name(h.species))} ${stars(G.stars[h.tier])}${h.fresh ? " · new" : " · dupe, +" + h.shards + " shards"}${h.shiny ? " · shiny" : ""}${h.sp ? " · SP" : ""}
      <br><span class="quiet">+${h.candy} candy · ${esc(G.skillsOf(h.species)[h.skill])}${h.skill === 3 ? " (rare)" : ""}</span></span></li>`).join("")}</ul>` : "";
  return `<h2>Waiting</h2>${rows ? `<ul>${rows}</ul>` : `<p class="quiet">No eggs. Pull some.</p>`}
    <p class="quiet" style="margin-top:6px">All eggs count down together. Nothing hatches from waiting: waves come from catching in Poké Idle, finishing Pokédoku boards and, later, tower defense waves.</p>
    <div class="row" style="margin-top:8px"><button type="button" id="hatch" ${ready ? "" : "disabled"}>Hatch ${ready || ""}</button></div>${hatched}`;
}

function dexView() {
  if (!S.owned.length) return `<p class="quiet" style="margin-top:8px">Your dex is empty. Hatch an egg.</p>`;
  if (!S.owned.includes(picked)) picked = S.owned[0];
  const grid = S.owned.map(num => {
    return `<button type="button" data-pick="${num}" class="${num === picked ? "on" : ""}" title="${esc(name(num))}">${sprite(num, false, false)}</button>`; }).join("");
  const num = picked, lineNum = G.lineOf(num), l = S.lines[lineNum], star = G.dex[lineNum - 1][9];
  const looks = ["normal"].concat(l.shiny ? ["shiny"] : [], l.sp ? ["sp"] : []);
  if (!looks.includes(look)) look = "normal";
  const skills = G.skillsOf(num).map((skill, i) => `<li class="${l.skills[i] ? "" : "quiet"}">${l.skills[i] ? "" : "locked · "}${esc(skill)}${i === 3 ? " (rare)" : ""}</li>`).join("");
  const evos = G.evolutionsOf(num).map(to => { const cost = G.costs.evolve[Math.min(G.stageOf(num), 2) - 1];
    return S.owned.includes(to) ? `<span class="quiet">${esc(name(to))} owned</span>`
      : `<button type="button" data-evolve="${to}" ${l.candy >= cost ? "" : "disabled"}>Evolve: ${esc(name(to))} · ${cost} candy</button>`; }).join("");
  const isBuddy = S.buddy && S.buddy.species === num && S.buddy.shiny === (look === "shiny") && S.buddy.sp === (look === "sp");
  return `<div id="grid">${grid}</div>
    <div class="box"><div class="detail">${sprite(num, look === "shiny", look === "sp", 72)}<div>
      <b>${esc(name(num))}</b> <span class="quiet">#${num}</span><br>${esc(types(num))} · ${stars(star)} line · stage ${G.stageOf(num)}<br>
      ${l.candy} candy · hatched ${l.hatches}×</div></div>
      <div class="row" style="margin-top:6px">${looks.map(k => `<button type="button" data-look="${k}" class="${look === k ? "on" : ""}">${{ normal: "Normal", shiny: "Shiny", sp: "SP" }[k]}</button>`).join("")}
        <button type="button" id="buddy" ${isBuddy ? "disabled" : ""}>${isBuddy ? "Your buddy" : "Make buddy"}</button></div>
      <h2>Skills</h2><ul>${skills}</ul>
      ${evos ? `<h2>Evolve</h2><div class="row">${evos}</div>` : ""}
      <h2>Upgrades</h2><div class="col">
        <button type="button" data-up="passive" ${l.passive || l.candy < G.costs.passive ? "disabled" : ""}><span>${l.passive ? "Passive unlocked" : "Unlock passive"}</span><span>${l.passive ? "" : G.costs.passive + " candy"}</span></button>
        <button type="button" data-up="cost1" ${l.cost >= 1 || l.candy < G.costs.cost1 ? "disabled" : ""}><span>Deploy cost −1${l.cost >= 1 ? " (done)" : ""}</span><span>${l.cost >= 1 ? "" : G.costs.cost1 + " candy"}</span></button>
        <button type="button" data-up="cost2" ${l.cost !== 1 || l.candy < G.costs.cost2 ? "disabled" : ""}><span>Deploy cost −2${l.cost >= 2 ? " (done)" : ""}</span><span>${l.cost >= 2 ? "" : G.costs.cost2 + " candy"}</span></button>
        <button type="button" id="sp" ${l.sp || S.balance.shards < G.costs.sp ? "disabled" : ""}><span>${l.sp ? "SP skin owned" : "SP skin"}</span><span>${l.sp ? "" : G.costs.sp + " shards"}</span></button>
      </div>
      <p class="quiet" style="margin-top:6px">Upgrades and skills are for tower defense. Shiny and SP are looks only.</p>
    </div>`;
}

function missionsView() {
  const trophies = G.trophies();
  return `<h2>Daily</h2><ul><li class="${S.login ? "done" : ""}">Log in: 3 Regular</li></ul>
    <h2>Starter missions · 2 Regular each</h2><ul>${G.missions.map(m => `<li class="${S.missions[m.id] ? "done" : ""}">${esc(m.label)}</li>`).join("")}</ul>
    <h2>Trophies · ${trophies.length}</h2>${trophies.length ? `<ul>${trophies.map(t => `<li>${esc(t.name)} <span class="quiet">${t.tier}</span></li>`).join("")}</ul>`
      : `<p class="quiet">From Poké Idle and Pokédoku: catch, collect badges, climb the tower, finish dailies.</p>`}`;
}

/* ── The pull screen ──────────────────────────────────────────────────────
   One machine in the middle, its neighbours at the edges. Left and right
   switch machines, up and down move the cursor, Enter pulls. All art is drawn
   here from rectangles; nothing is loaded but the Pokémon sprites. */
const ORDER_M = ["move", "legend", "shiny"];
const LOOK = {
  move: { body: "#3f9e8a", dark: "#256656", light: "#77c9b2", label: "Move UP!", about: "Move UP: rare skills roll twice as often." },
  legend: { body: "#d6463c", dark: "#8f2621", light: "#f0857a", label: "UP!", about: "Legendary UP: today's banner legendary, 1 in 256. Eggs count double toward Legendary pity." },
  shiny: { body: "#e3ad2b", dark: "#a07514", light: "#f6d77a", label: "Shiny UP!", about: "Shiny UP: shiny 1 in 64, and the only machine with SP skins (1 in 200)." }
};
const TICKET = { regular: ["#e4587a", "#fbe7ee"], plus: ["#3a5bb5", "#a8c4ff"], premium: ["#8f4fd0", "#e0c6ff"], gold: ["#eebd2c", "#fff1b8"] };
const EGG_LOOK = [["#e6ecd8", "#7fb36a"], ["#9fd0f0", "#3d7fc0"], ["#f3d36a", "#c0852a"], ["#f08cb4", "#a8326a"], ["#d6463c", "#f6d77a"]];
const OPTIONS = [
  { voucher: "regular", count: 1, times: "x1", label: "1 Pull", about: "1 Regular: 1 egg." },
  { voucher: "regular", count: 10, times: "x10", label: "10 Pulls", about: "10 Regular: 10 eggs, 1 Rare or better." },
  { voucher: "plus", count: 1, times: "x1", label: "5 Pulls", about: "1 Plus: 5 eggs." },
  { voucher: "premium", count: 1, times: "x1", label: "10 Pulls", about: "1 Premium: 10 eggs, 1 Rare or better." },
  { voucher: "gold", count: 1, times: "x1", label: "25 Pulls", about: "1 Gold: 25 eggs, 1 Epic or better." },
  { buy: true, times: "100", label: "Buy 1", about: "Buy 1 Regular voucher for 100 coins." },
  { cancel: true, times: "", label: "Cancel", about: "" }
];
let cursor = 0, menuOpen = true, slide = 0, slideFrom = 0, crank = 0, message = null;

function pixelCanvas(w, h, draw) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h; c.style.width = w + "px"; c.style.height = h + "px";
  draw(c.getContext("2d"));
  return c;
}
function ellipse(g, cx, cy, rx, ry, color) {
  g.fillStyle = color;
  for (let y = -ry; y <= ry; y++) {
    const half = Math.round(rx * Math.sqrt(Math.max(0, 1 - (y * y) / (ry * ry))));
    g.fillRect(cx - half, cy + y, half * 2 + 1, 1);
  }
}
function box(g, x, y, w, h, color, cut = 2) {
  g.fillStyle = color;
  g.fillRect(x + cut, y, w - cut * 2, h);
  g.fillRect(x, y + cut, w, h - cut * 2);
  if (cut > 1) { g.fillRect(x + 1, y + 1, w - 2, h - 2); }
}
function ticket(kind) {
  const [base, stripe] = TICKET[kind] || ["#f0c230", "#fff1b8"];
  return pixelCanvas(16, 9, g => {
    g.fillStyle = "#1c1b2c"; g.fillRect(1, 0, 14, 9); g.fillRect(0, 1, 16, 7);
    g.fillStyle = base; g.fillRect(1, 1, 14, 7);
    g.fillStyle = stripe; g.fillRect(4, 1, 2, 7); g.fillRect(8, 3, 5, 1); g.fillRect(8, 5, 4, 1);
    g.fillStyle = "#1c1b2c"; g.fillRect(6, 1, 1, 7);
  });
}
function coin() {
  return pixelCanvas(16, 9, g => { ellipse(g, 7, 4, 4, 4, "#7a5410"); ellipse(g, 7, 4, 3, 3, "#eebd2c"); g.fillStyle = "#fff1b8"; g.fillRect(6, 2, 1, 4); });
}
function eggIcon(tier) {
  const [shell, spot] = EGG_LOOK[tier];
  return pixelCanvas(8, 10, g => {
    ellipse(g, 3, 5, 3, 4, "#1c1b2c"); ellipse(g, 3, 5, 2, 3, shell);
    g.fillStyle = spot; g.fillRect(2, 3, 2, 1); g.fillRect(4, 6, 1, 2); g.fillRect(1, 6, 1, 1);
  });
}

// A fixed handful of eggs in each dome, so a machine always looks the same.
function domeEggs(seed) {
  let s = seed;
  const rand = () => (s = (s * 1103515245 + 12345) >>> 0) / 4294967296;
  const colors = ["#79c6a8", "#8fd3e8", "#9b8fe0", "#5aa0d6", "#e08fb0", "#6fbf6f", "#7fd0c0"];
  const eggs = [];
  for (let row = 0; row < 4; row++) for (let i = 0; i < 6; i++)
    eggs.push({ x: 8 + i * 18 + (row % 2) * 9 + Math.floor(rand() * 4), y: 18 + row * 12 + Math.floor(rand() * 3), c: colors[Math.floor(rand() * colors.length)], r: 8 + Math.floor(rand() * 3) });
  return eggs;
}
const DOMES = { move: domeEggs(3), legend: domeEggs(11), shiny: domeEggs(29) };

function drawMachine(g, cx, id, front) {
  const L = LOOK[id], x = cx - 56;
  const ink = "#1c1b2c";
  // Cap and rim.
  box(g, x + 4, 22, 104, 16, ink); box(g, x + 5, 23, 102, 14, L.body);
  g.fillStyle = L.light; g.fillRect(x + 7, 24, 98, 3);
  g.fillStyle = L.dark; g.fillRect(x + 6, 33, 100, 3);
  box(g, x - 1, 37, 114, 9, ink); box(g, x, 38, 112, 7, "#e2e0dc"); g.fillStyle = "#aaa79f"; g.fillRect(x + 1, 43, 110, 1);
  // Dome of eggs behind glass.
  g.fillStyle = ink; g.fillRect(x + 5, 45, 102, 58);
  g.save(); g.beginPath(); g.rect(x + 6, 45, 100, 57); g.clip();
  g.fillStyle = "#c9ecf2"; g.fillRect(x + 6, 45, 100, 57);
  for (const egg of DOMES[id]) {
    ellipse(g, x + egg.x, 45 + egg.y, egg.r, egg.r + 2, "#2e4a52");
    ellipse(g, x + egg.x, 45 + egg.y, egg.r - 1, egg.r + 1, egg.c);
    g.fillStyle = "rgba(255,255,255,.35)"; g.fillRect(x + egg.x - 3, 45 + egg.y - egg.r + 1, 2, 3);
    g.fillStyle = "rgba(0,0,0,.18)"; g.fillRect(x + egg.x + 1, 45 + egg.y + 1, 3, 2);
  }
  g.fillStyle = "rgba(255,255,255,.4)"; g.fillRect(x + 12, 47, 3, 50); g.fillRect(x + 17, 47, 1, 50);
  g.restore();
  // Name plate in front of the dome.
  box(g, x + 16, 70, 80, 26, ink, 4); box(g, x + 17, 71, 78, 24, "#f2f0ea", 3);
  g.fillStyle = "#c7c3b8"; g.fillRect(x + 18, 92, 76, 2);
  // Lower rim and body.
  box(g, x - 1, 101, 114, 9, ink); box(g, x, 102, 112, 7, "#e2e0dc"); g.fillStyle = "#aaa79f"; g.fillRect(x + 1, 107, 110, 1);
  g.fillStyle = ink; g.fillRect(x + 4, 110, 104, 70);
  g.fillStyle = L.body; g.fillRect(x + 5, 110, 102, 70);
  g.fillStyle = L.dark; g.fillRect(x + 5, 110, 102, 3); g.fillRect(x + 5, 110, 4, 70);
  g.fillStyle = L.light; g.fillRect(x + 101, 113, 3, 60);
  // Chute, where the egg comes out.
  box(g, x + 13, 118, 30, 26, ink, 5); box(g, x + 15, 120, 26, 22, "#3b3a45", 4); g.fillStyle = "#56555f"; g.fillRect(x + 19, 122, 10, 3);
  // Coin slot.
  g.fillStyle = ink; g.fillRect(x + 50, 122, 26, 4); g.fillStyle = L.dark; g.fillRect(x + 51, 126, 24, 1);
  // Crank: a white wheel with a grip that turns after a pull.
  ellipse(g, x + 93, 120, 11, 11, ink); ellipse(g, x + 93, 120, 10, 10, "#f2f0ea"); ellipse(g, x + 93, 120, 6, 6, "#c7c3b8"); ellipse(g, x + 93, 120, 5, 5, "#f2f0ea");
  if (front) {
    const a = crank * Math.PI;
    g.fillStyle = ink;
    for (const off of [0, Math.PI]) g.fillRect(Math.round(x + 93 + Math.cos(a + off) * 7) - 1, Math.round(120 + Math.sin(a + off) * 7) - 1, 3, 3);
    g.fillRect(x + 92, 119, 3, 3);
  }
}

function drawScene() {
  const g = $("#scene").getContext("2d");
  g.imageSmoothingEnabled = false;
  g.fillStyle = "#d9efc4"; g.fillRect(0, 0, 320, 180);
  g.fillStyle = "#eef8e4"; for (let y = 2; y < 180; y += 6) g.fillRect(0, y, 320, 3);
  g.fillStyle = "#b7e0f0"; g.fillRect(0, 0, 320, 3);
  const at = ORDER_M.indexOf(machine), cx = 148 + slide;
  const prev = ORDER_M[(at + 2) % 3], next = ORDER_M[(at + 1) % 3];
  drawMachine(g, cx - 180, prev, false);
  drawMachine(g, cx + 180, next, false);
  drawMachine(g, cx, machine, true);
  // Arrows to the neighbours.
  g.fillStyle = "#1c1b2c";
  for (let i = 0; i < 6; i++) { g.fillRect(30 + i, 72 - i, 1, i * 2 + 1); g.fillRect(250 - i, 32 - i, 1, i * 2 + 1); }
  // The plate's words follow the machine as it slides.
  const plate = $("#plate");
  plate.style.left = (cx - 56 + 17) + "px"; plate.style.top = "71px"; plate.style.width = "78px"; plate.style.height = "21px";
  const clock = $("#clock");
  clock.style.left = (cx - 56 + 52) + "px"; clock.style.top = "133px";
}

function placeStage() {
  const wrap = $("#pullwrap"), stage = $("#stage");
  const k = wrap.clientWidth / 320;
  stage.style.transform = "scale(" + k + ")";
  wrap.style.height = Math.round(180 * k) + "px";
}

function untilMidnight() {
  // The banner changes at midnight in Detroit, with the daily seed.
  const parts = Object.fromEntries(new Intl.DateTimeFormat("en-US", { timeZone: "America/Detroit", hour12: false, hour: "2-digit", minute: "2-digit", second: "2-digit" })
    .formatToParts(new Date()).map(p => [p.type, Number(p.value)]));
  const left = Math.max(0, 86400 - ((parts.hour % 24) * 3600 + parts.minute * 60 + parts.second));
  const two = n => String(n).padStart(2, "0");
  return two(Math.floor(left / 3600)) + ":" + two(Math.floor(left / 60) % 60) + ":" + two(left % 60);
}

function haveFor(option) {
  if (option.buy) return S.balance.coins >= 100;
  if (option.cancel) return true;
  return (S.balance[option.voucher] || 0) >= (option.voucher === "regular" ? option.count : 1);
}

function updateScene() {
  if (!S) return;
  const b = S.balance;
  $("#counts").replaceChildren(...["gold", "premium", "plus", "regular"].map(kind => {
    const win = document.createElement("div");
    win.className = "win";
    const n = document.createElement("span");
    n.textContent = b[kind];
    win.append(n, ticket(kind));
    win.title = kind[0].toUpperCase() + kind.slice(1) + " vouchers";
    return win;
  }));
  const plate = $("#plate");
  if (machine === "legend") {
    const img = new Image(22, 22);
    img.src = SPRITE_DIR + S.banner + ".png"; img.alt = name(S.banner);
    const span = document.createElement("span"); span.textContent = LOOK.legend.label;
    plate.replaceChildren(img, span);
    $("#clock").hidden = false; $("#clock").textContent = untilMidnight();
    $("#clock").title = "Until the banner changes";
  } else {
    plate.textContent = LOOK[machine].label;
    $("#clock").hidden = true;
  }
  const menu = $("#menu");
  menu.hidden = !menuOpen;
  menu.replaceChildren(...OPTIONS.map((option, i) => {
    const row = document.createElement("div");
    row.setAttribute("role", "option");
    row.dataset.option = i;
    row.className = (i === cursor ? "at " : "") + (haveFor(option) ? "" : "off");
    row.setAttribute("aria-selected", i === cursor);
    if (!option.cancel) row.append(option.buy ? coin() : ticket(option.voucher));
    const times = document.createElement("span"); times.className = "times"; times.textContent = option.times;
    const label = document.createElement("span"); label.textContent = option.label;
    if (!option.cancel) row.append(times);
    row.append(label);
    return row;
  }));
  const msg = $("#msg");
  if (message && message.eggs) {
    const eggs = document.createElement("div"); eggs.className = "eggs";
    eggs.append(...message.eggs.map(e => eggIcon(e.tier)));
    const text = document.createElement("span"); text.textContent = message.text;
    const col = document.createElement("div"); col.append(text, eggs);
    msg.replaceChildren(col);
  } else {
    const option = OPTIONS[cursor];
    msg.textContent = message ? message.text
      : !menuOpen ? "Select a machine." : (option.cancel ? LOOK[machine].about : option.about + (haveFor(option) ? "" : " You don't have enough."));
  }
  drawScene();
}

function tierSummary(eggs) {
  const names = ["Common", "Rare", "Epic", "Legendary", "banner"];
  const counts = [0, 0, 0, 0, 0];
  for (const e of eggs) counts[e.tier]++;
  return counts.map((n, t) => n ? n + " " + names[t] : "").filter(Boolean).reverse().join(", ");
}

function switchMachine(step) {
  const at = ORDER_M.indexOf(machine);
  machine = pref.machine = ORDER_M[(at + step + 3) % 3];
  keep();
  message = null;
  slideFrom = step * 60; slide = slideFrom;
  const start = performance.now();
  const tick = now => {
    const t = Math.min(1, (now - start) / 160);
    slide = Math.round(slideFrom * (1 - t));
    drawScene();
    if (t < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
  updateScene();
}

function turnCrank() {
  const start = performance.now();
  const tick = now => {
    const t = Math.min(1, (now - start) / 420);
    crank = t * 2;
    drawScene();
    if (t < 1) requestAnimationFrame(tick); else crank = 0;
  };
  requestAnimationFrame(tick);
}

function choose(i) {
  const option = OPTIONS[i];
  cursor = i;
  if (option.cancel) { menuOpen = false; message = null; return updateScene(); }
  if (!haveFor(option)) { message = { text: option.buy ? "Not enough coins: a Regular costs 100." : "You don't have enough vouchers for that." }; return updateScene(); }
  if (option.buy) {
    const r = G.buyRegular({ count: 1 });
    message = { text: r.ok ? "Bought 1 Regular for 100 coins." : REASONS[r.reason] || "Not now." };
  } else {
    const r = G.pull({ voucher: option.voucher, count: option.count, machine });
    if (r.ok) {
      lastPull = r.eggs;
      turnCrank();
      message = { text: r.eggs.length + (r.eggs.length === 1 ? " egg: " : " eggs: ") + tierSummary(r.eggs) + ".", eggs: r.eggs };
    } else message = { text: REASONS[r.reason] || "Not now." };
  }
  S = G.state(); hud(); updateScene();
}

function sceneKey(e) {
  if (tab !== "pull" || $("#pullwrap").hidden) return;
  const k = e.key;
  if (k === "ArrowLeft" || k === "ArrowRight") { e.preventDefault(); switchMachine(k === "ArrowLeft" ? -1 : 1); }
  else if (k === "ArrowUp" || k === "ArrowDown") {
    e.preventDefault();
    if (!menuOpen) { menuOpen = true; message = null; return updateScene(); }
    cursor = (cursor + (k === "ArrowUp" ? -1 : 1) + OPTIONS.length) % OPTIONS.length;
    message = null; updateScene();
  } else if (k === "Enter" || k === " ") {
    e.preventDefault();
    if (!menuOpen) { menuOpen = true; message = null; return updateScene(); }
    choose(cursor);
  } else if (k === "Backspace") { e.preventDefault(); menuOpen = false; message = null; updateScene(); }
}

function buildScene() {
  $("#pullwrap").hidden = true;
  document.addEventListener("keydown", sceneKey);
  $("#menu").onclick = e => { const row = e.target.closest("[data-option]"); if (row) choose(Number(row.dataset.option)); };
  $("#menu").onmousemove = e => { const row = e.target.closest("[data-option]"); if (row && Number(row.dataset.option) !== cursor && !message) { cursor = Number(row.dataset.option); updateScene(); } };
  $("#hit-left").onclick = () => switchMachine(-1);
  $("#hit-right").onclick = () => switchMachine(1);
  $("#hit-machine").onclick = () => { menuOpen = true; message = null; updateScene(); };
  new ResizeObserver(placeStage).observe($("#pullwrap"));
  setInterval(() => { if (tab === "pull" && machine === "legend" && !$("#clock").hidden) $("#clock").textContent = untilMidnight(); }, 1000);
}

function render() {
  S = G.state();
  hud();
  const pulling = tab === "pull";
  $("#pullwrap").hidden = !pulling;
  if (pulling) { $("#view").replaceChildren(); placeStage(); updateScene(); }
  else $("#view").innerHTML = { eggs: eggsView, dex: dexView, missions: missionsView }[tab]();
}

$("#tabs").onclick = e => { const b = e.target.closest("button"); if (!b) return; tab = b.dataset.tab; note(""); render(); if (tab === "pull") $("#pullwrap").focus({ preventScroll: true }); };
$("#view").onclick = e => {
  const b = e.target.closest("button");
  if (!b || b.disabled) return;
  note("");
  const d = b.dataset;
  if (b.id === "hatch") { const r = G.hatch(); if (said(r)) lastHatch = r.hatched; }
  else if (d.pick) { picked = Number(d.pick); look = "normal"; }
  else if (d.look) look = d.look;
  else if (b.id === "buddy") { if (said(G.setBuddy({ species: picked, shiny: look === "shiny", sp: look === "sp" }))) note("Buddy set. It shows next to your name on Bored."); }
  else if (d.evolve) { const to = Number(d.evolve); if (said(G.evolve({ from: picked, to }))) picked = to; }
  else if (d.up) said(G.upgrade({ line: G.lineOf(picked), kind: d.up }));
  else if (b.id === "sp") said(G.buySp({ line: G.lineOf(picked) }));
  render();
};

if (!G) {
  $("#tabs").hidden = true; $("#off").hidden = false;
} else {
  buildScene();
  if (G.claimLogin().ok) message = { text: "Daily login: +3 Regular vouchers." };
  render();
  $("#pullwrap").focus({ preventScroll: true });
  // Waves earned in another game, or a sync from another device, show up here.
  setInterval(() => { if (!document.hidden) { const was = JSON.stringify(S); const now = G.state(); if (JSON.stringify(now) !== was) render(); } }, 3000);
}

// The hub reads this. Unscored for now; the planned score is unique species caught.
window.__boredSnapshot = () => {
  try { const s = S || (G && G.state()); return { slug: "poke-gacha", caught: s ? s.owned.length : 0, pulls: s ? s.pulls : 0, finished: false }; }
  catch { return { slug: "poke-gacha", caught: 0, pulls: 0, finished: false }; }
};
</script>
