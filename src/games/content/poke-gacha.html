<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Poké Gacha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap">
<style>
/* Poké Gacha screens. One fixed internal resolution (640×408: a 48px tab bar
   and a 640×360 stage), scaled by a whole number. Rules every screen keeps:
   - one panel style (.panel), one list style (.rows) with one ▶ cursor
   - spacing on a 4px grid, 8px margins and gaps everywhere
   - body text in Bored's own mono stack, 16px weight 600, numbers right-aligned;
     headers in Silkscreen at exactly 24px (3x its 8px pixel grid)
   - the eight colors below and nothing else; egg tiers are fixed colors
   - every sprite at 1x, centered in a 96px cell (the largest sprite is 96px) */
:root {
  --ink: #1c1b2c; --panel: #2c2a44; --red: #c8372f; --paper: #f4f1ff;
  --dim: #807c9a; --gold: #e3ad2b; --teal: #3f9e8a; --sky: #8fd3e8;
  --body: 16px; --title: 24px;
  --mono: ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box }
body { background: var(--ink); display: grid; place-items: start center; min-height: 100vh; padding-top: 4px; overflow: hidden }
#wrap { position: relative; overflow: hidden; outline: none; touch-action: manipulation; user-select: none }
#frame { position: absolute; left: 0; top: 0; width: 640px; height: 408px; transform-origin: 0 0; background: var(--ink);
         font: 600 var(--body)/20px var(--mono); color: var(--paper);
         font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0 }
canvas, img { image-rendering: pixelated; display: block }
#stage { position: absolute; left: 0; top: 48px; width: 640px; height: 360px; overflow: hidden }
#scene { position: absolute; inset: 0; width: 640px; height: 360px }

.panel { position: absolute; background: var(--panel); border: 2px solid var(--red); outline: 2px solid var(--ink); padding: 8px }
.title { font: 400 var(--title)/32px Silkscreen, var(--mono); margin-bottom: 4px }
.head { margin-bottom: 4px }
.num { color: var(--gold) }
.title .count { font: 600 var(--body)/32px var(--mono) }
.dim { color: var(--dim) }
.gold { color: var(--gold) }
/* Lists scroll by whole 24px rows and never stop on a half-cut one. */
.scroll { overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--red) var(--panel); scroll-snap-type: y mandatory }
.scroll > * { scroll-snap-align: start }
.rows > div { display: flex; align-items: center; gap: 8px; height: 24px; padding-left: 16px; position: relative; white-space: nowrap; cursor: pointer }
.rows > div.off { color: var(--dim) }
.rows > div.at::before { content: ""; position: absolute; left: 0; top: 6px; border-style: solid; border-width: 6px 0 6px 8px;
                          border-color: transparent transparent transparent var(--paper) }
.rows .grow { flex: 1; overflow: hidden; text-overflow: ellipsis }
/* Icons sit in one 40px slot so labels line up whatever the icon. */
.rows .ico { width: 40px; display: grid; place-items: center; flex: none }
.rows .right { display: flex; align-items: center; gap: 4px; padding-right: 4px }
.stars { display: inline-flex; gap: 2px; vertical-align: middle }
.rows p { padding: 4px 0 }
.cell { display: grid; place-items: center; overflow: hidden }
.unseen { filter: brightness(0) }
[hidden] { display: none !important }

#tabs { position: absolute; left: 8px; right: 8px; top: 8px; height: 32px; display: flex; gap: 8px }
#tabs .panel { position: static; height: 32px; padding: 4px 12px; cursor: pointer }
#tabs .panel.on { background: var(--red) }
#tabs .purse { margin-left: auto; display: flex; align-items: center; gap: 8px; cursor: default }
#msg { left: 8px; right: 8px; bottom: 8px; height: 56px; padding: 6px 12px; display: flex; gap: 8px; align-items: flex-start }
#msg .eggs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px }

/* Pull */
#counts { position: absolute; right: 8px; top: 8px; display: flex; gap: 8px }
#counts .panel { position: static; width: 100px; height: 36px; display: flex; align-items: center; justify-content: space-between; padding: 4px 8px }
#plate { position: absolute; display: flex; align-items: center; justify-content: center; font: 400 var(--title)/32px Silkscreen, var(--mono);
         color: var(--ink); pointer-events: none }
#banner { position: absolute; width: 96px; height: 96px; pointer-events: none }
#clock { position: absolute; color: var(--ink); background: var(--paper); border: 2px solid var(--ink); padding: 0 4px; pointer-events: none }
#menu { right: 8px; top: 96px; width: 216px; padding: 8px }
.hit { position: absolute; cursor: pointer }

/* Eggs */
/* Eggs: the selected egg on the left, every egg in a grid on the right. */
#egg-pic { left: 8px; top: 8px; width: 232px; height: 120px; display: grid; place-items: center }
#egg-name { left: 8px; top: 136px; width: 232px; height: 48px; padding: 4px 12px }
#egg-day { left: 8px; top: 192px; width: 232px; height: 44px }
#egg-from { left: 8px; top: 244px; width: 232px; height: 44px }
#eggs-tray { left: 248px; top: 8px; width: 384px; height: 280px }
#eggs-grid { display: grid; grid-template-columns: repeat(11, 32px); grid-auto-rows: 28px }
#eggs-grid .egg { display: grid; place-items: center; position: relative; cursor: pointer }
#eggs-grid .egg i { position: absolute; left: 8px; bottom: 0; height: 2px; background: var(--gold) }
#eggs-grid .bracket { position: absolute; inset: 0; pointer-events: none }
#eggs-grid .bracket b { position: absolute; width: 8px; height: 8px; border: 0 solid var(--red) }
#eggs-grid .bracket b:nth-child(1) { left: 0; top: 0; border-width: 2px 0 0 2px }
#eggs-grid .bracket b:nth-child(2) { right: 0; top: 0; border-width: 2px 2px 0 0 }
#eggs-grid .bracket b:nth-child(3) { left: 0; bottom: 0; border-width: 0 0 2px 2px }
#eggs-grid .bracket b:nth-child(4) { right: 0; bottom: 0; border-width: 0 2px 2px 0 }
#hatch { left: 8px; top: 8px; width: 624px; height: 280px; display: grid; grid-template-columns: 96px 1fr; grid-template-rows: 36px 1fr; gap: 0 12px }
#hatch .title, #hatch .head { grid-column: 1 / -1 }
#hatch.sum { grid-template-rows: 24px 1fr }
#hatch .cell { width: 96px; height: 96px; background: var(--ink) }
#hatch .cell.egg-phase { background: var(--panel) }
#hatch-text div { min-height: 20px }
#hatch .grid { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(6, 96px); gap: 4px 4px; overflow: hidden }
#hatch .grid .tag { height: 20px; text-align: center }

/* Dex */
#dex-list { left: 8px; top: 8px; width: 248px; height: 280px; display: flex; flex-direction: column }
#dex-rows { height: 216px }
#dex-detail { left: 264px; top: 8px; width: 368px; height: 280px; display: grid; grid-template-columns: 96px 1fr; grid-template-rows: 96px 1fr; gap: 8px 12px }
#dex-detail .cell { width: 96px; height: 96px; background: var(--ink) }
#dex-acts { grid-column: 1 / -1; height: 144px }

/* Shop and quests share one layout */
.left-panel { left: 8px; top: 8px; width: 400px; height: 280px; display: flex; flex-direction: column }
.right-panel { left: 416px; top: 8px; width: 216px; height: 280px; display: flex; flex-direction: column; gap: 8px }
.right-panel .cell { width: 96px; height: 96px; background: var(--ink); align-self: center }
/* Scrolling lists hold whole rows only: 9 × 24px. */
.left-panel .rows, .right-panel .rows { height: 216px }
#off { position: absolute; left: 8px; right: 8px; top: 56px; padding: 12px }

/* Story and battles */
#tabs.locked .panel[data-tab] { color: var(--dim); cursor: default }
#battle-hud { left: 8px; top: 4px; width: 624px; height: 36px; padding: 6px 12px; display: flex; gap: 16px; align-items: center; white-space: nowrap }
#battle-hud .right { margin-left: auto }
#field { position: absolute; left: 80px; top: 48px; width: 480px; height: 240px; outline: 2px solid var(--ink); cursor: pointer }
#deploy { left: 8px; bottom: 8px; width: 624px; height: 56px; display: grid; grid-template-columns: repeat(8, 72px); gap: 4px; padding: 6px 8px }
#deploy .card { height: 40px; background: var(--ink); padding: 0 4px; line-height: 20px; cursor: pointer; white-space: nowrap; overflow: hidden }
#deploy .card.on { outline: 2px solid var(--paper); outline-offset: -2px }
#deploy .card.off { color: var(--dim) }
#battle-talk { left: 8px; bottom: 8px; width: 624px; height: 56px; padding: 6px 12px; cursor: pointer }
#battle-result { left: 160px; top: 64px; width: 320px; height: 200px; padding: 8px 16px; cursor: pointer }
</style>
</head>
<body>
<div id="wrap" tabindex="0" aria-label="Poké Gacha. Arrow keys move, Enter picks, Backspace goes back, number keys switch screens.">
  <div id="frame">
    <div id="tabs"></div>
    <div id="stage">
      <canvas id="scene" width="640" height="360"></canvas>
      <section id="scr-story" class="screen" hidden>
        <div class="panel left-panel" id="story-list-panel"><div class="title" id="story-title">CHAPTER</div><div class="rows scroll" id="story-list"></div></div>
        <div class="panel right-panel" id="story-info"></div>
        <div class="panel left-panel" id="squad-list-panel" hidden><div class="title" id="squad-title">SQUAD</div><div class="rows scroll" id="squad-list"></div></div>
        <div class="panel right-panel" id="squad-info" hidden></div>
      </section>
      <section id="scr-battle" class="screen" hidden>
        <div class="panel" id="battle-hud"></div>
        <canvas id="field" width="480" height="240"></canvas>
        <div class="panel" id="deploy"></div>
        <div class="panel" id="battle-talk" hidden></div>
        <div class="panel" id="battle-result" hidden></div>
      </section>
      <section id="scr-pull" class="screen">
        <div id="counts"></div>
        <img id="banner" alt="" hidden>
        <div id="plate"></div>
        <div id="clock" class="num" hidden></div>
        <div class="hit" id="hit-left" style="left:0;top:80px;width:80px;height:200px" title="Previous machine"></div>
        <div class="hit" id="hit-right" style="left:432px;top:44px;width:208px;height:48px" title="Next machine"></div>
        <div class="hit" id="hit-machine" style="left:208px;top:80px;width:176px;height:200px" title="Open the voucher menu"></div>
        <div class="panel rows" id="menu" role="listbox"></div>
      </section>
      <section id="scr-eggs" class="screen" hidden>
        <div class="panel" id="egg-pic"></div>
        <div class="panel title" id="egg-name"></div>
        <div class="panel" id="egg-day"></div>
        <div class="panel" id="egg-from"></div>
        <div class="panel" id="eggs-tray"><div id="eggs-grid"></div></div>
        <div class="panel" id="hatch" hidden></div>
      </section>
      <section id="scr-dex" class="screen" hidden>
        <div class="panel" id="dex-list"><div class="title" id="dex-title">DEX</div><div class="rows scroll" id="dex-rows"></div></div>
        <div class="panel" id="dex-detail"><div class="cell" id="dex-pic"></div><div id="dex-info"></div><div class="rows scroll" id="dex-acts"></div></div>
      </section>
      <section id="scr-shop" class="screen" hidden>
        <div class="panel left-panel"><div class="title" id="shop-title">SHOP</div><div class="rows scroll" id="shop-list"></div></div>
        <div class="panel right-panel" id="shop-preview"></div>
      </section>
      <section id="scr-quests" class="screen" hidden>
        <div class="panel left-panel"><div class="title">MISSIONS</div><div class="rows scroll" id="quest-list"></div></div>
        <div class="panel right-panel"><div class="title" id="trophy-title">TROPHIES</div><div class="rows scroll" id="trophy-list"></div></div>
      </section>
      <div class="panel" id="msg" role="status"></div>
      <div class="panel" id="off" hidden>Open Poké Gacha from the Bored arcade: your wallet, eggs and dex live on your Bored profile.</div>
    </div>
  </div>
</div>
<script>
/* Poké Gacha. The engine and the wallet live in the hub (src/hub/gacha.js,
   src/hub/rewards.js) and this page calls them through parent.__boredGacha,
   so every pull and hatch lands in the one ledger that syncs to the account.
   Pulls are cosmetic outside Poké Gacha's own tower defense (coming later). */
const $ = s => document.querySelector(s);
const SPRITE_DIR = /\/games\/content\/[^/]+\.html([?#].*)?$/.test(document.baseURI) ? "pokedoku/sprites/" : "games/content/pokedoku/sprites/";
const G = (() => { try { return parent !== window && parent.__boredGacha ? parent.__boredGacha : null; } catch { return null; } })();
const PREF = "bored.poke-gacha.ui";
const pref = (() => { try { return JSON.parse(localStorage.getItem(PREF) || "null") || {}; } catch { return {}; } })();
const keep = () => { try { localStorage.setItem(PREF, JSON.stringify(pref)); } catch {} };
let tab = pref.tab || "pull", machine = pref.machine || "move", S = null;
const name = num => G.dex[num - 1][0];
const REASONS = { vouchers: "Not enough vouchers.", full: "Egg storage is full (99). Hatch some first.", inactive: "Your wallet is not open yet.",
  candy: "Not enough candy.", shards: "Not enough shards.", owned: "Already done.", order: "Cut the cost by 1 first.", locked: "That look is not unlocked.",
  "not-owned": "You do not have that one yet." };

/* ── The palette, and pixel art drawn at 2x from it ────────────────────── */
const C = { ink: "#1c1b2c", panel: "#2c2a44", red: "#c8372f", paper: "#f4f1ff", dim: "#807c9a", gold: "#e3ad2b", teal: "#3f9e8a", sky: "#8fd3e8" };
// Fixed egg tier colors everywhere: Common, Rare, Epic, Legendary (and the banner, a legendary).
const TIER_COLOR = [C.paper, C.sky, C.gold, C.red, C.red];
const TIER_NAME = ["Common", "Rare", "Epic", "Legendary", "Banner"];
const ART = 2;
// Darker and lighter shades of the eight colors, for the art only ([dark, base, light]).
// Panels and text keep to the eight.
const SHADE = {
  paper: ["#c9c4dc", C.paper, "#ffffff"], sky: ["#4f93b8", C.sky, "#d4f1f8"], gold: ["#a07514", C.gold, "#f6d77a"],
  red: ["#8f2621", C.red, "#f0857a"], teal: ["#256656", C.teal, "#7fcdb7"]
};
const TIER_SHADE = [SHADE.paper, SHADE.sky, SHADE.gold, SHADE.red, SHADE.red];
const TIER_SPOT = [C.dim, SHADE.sky[0], SHADE.gold[0], SHADE.gold[2], SHADE.gold[2]];
// A canvas of w×h art pixels, each ART internal pixels across.
function pixelCanvas(w, h, draw) {
  const c = document.createElement("canvas");
  c.width = w * ART; c.height = h * ART;
  c.style.width = w * ART + "px"; c.style.height = h * ART + "px";
  const g = c.getContext("2d");
  g.scale(ART, ART);
  draw(g);
  return c;
}
function ellipse(g, cx, cy, rx, ry, color) {
  g.fillStyle = color;
  for (let y = -ry; y <= ry; y++) {
    const half = Math.round(rx * Math.sqrt(Math.max(0, 1 - (y * y) / (ry * ry))));
    g.fillRect(cx - half, cy + y, half * 2 + 1, 1);
  }
}
function box(g, x, y, w, h, color, cut = 1) {
  g.fillStyle = color;
  g.fillRect(x + cut, y, w - cut * 2, h);
  g.fillRect(x, y + cut, w, h - cut * 2);
}
// One egg drawing for everything: the dome, the icons and the big egg. Shadow
// side bottom right, a highlight top left, and spots placed from `seed`.
function shadedEgg(g, cx, cy, rx, ry, tier, seed = 1, outline = true) {
  const [dark, base, light] = TIER_SHADE[tier];
  if (outline) ellipse(g, cx, cy, rx + 1, ry + 1, C.ink);
  const inside = (x, y) => (x * x) / ((rx + 0.5) * (rx + 0.5)) + (y * y) / ((ry + 0.5) * (ry + 0.5)) <= 1;
  for (let y = -ry; y <= ry; y++) for (let x = -rx; x <= rx; x++) {
    if (!inside(x, y)) continue;
    g.fillStyle = (x / rx) * 0.6 + (y / ry) * 0.8 > 0.55 ? dark : base;
    g.fillRect(cx + x, cy + y, 1, 1);
  }
  let s = seed * 7919 + 13;
  const rand = () => (s = (Math.imul(s, 1103515245) + 12345) >>> 0) / 4294967296;
  const count = rx >= 6 ? 5 : rx >= 3 ? 2 : 1;
  for (let i = 0; i < count; i++) {
    const a = rand() * Math.PI * 2, d = 0.3 + rand() * 0.35;
    const sx = Math.round(Math.cos(a) * rx * d), sy = Math.round(Math.sin(a) * ry * d);
    const sr = Math.max(0, Math.round(rx * (0.1 + rand() * 0.1)));
    g.fillStyle = TIER_SPOT[tier];
    for (let y = -sr; y <= sr; y++) for (let x = -sr; x <= sr; x++)
      if (x * x + y * y <= sr * sr + sr && inside(sx + x, sy + y)) g.fillRect(cx + sx + x, cy + sy + y, 1, 1);
  }
  const hx = Math.round(cx - rx * 0.4), hy = Math.round(cy - ry * 0.45);
  g.fillStyle = light;
  g.fillRect(hx, hy, Math.max(1, Math.round(rx * 0.3)), Math.max(1, Math.round(ry * 0.3)));
}
// Vouchers: a ticket tilted up to the right, with a tear-off stub and an emblem per kind.
const TICKET = { regular: SHADE.red, plus: SHADE.sky, premium: SHADE.teal, gold: SHADE.gold };
const EMBLEM = {
  regular: [[10, 5], [11, 5], [10, 6], [11, 6], [9, 5], [12, 6]],
  plus: [[10, 4], [9, 5], [10, 5], [11, 5], [10, 6], [10, 7], [8, 5], [12, 5]],
  premium: [[10, 3], [9, 4], [11, 4], [8, 5], [12, 5], [9, 6], [11, 6], [10, 7], [10, 5]],
  gold: [[10, 3], [10, 4], [8, 5], [9, 5], [10, 5], [11, 5], [12, 5], [9, 6], [11, 6], [8, 7], [12, 7], [10, 6]]
};
function ticket(kind) {
  const [dark, base, light] = TICKET[kind];
  const off = row => Math.floor((11 - row) / 4);
  return pixelCanvas(20, 12, g => {
    g.fillStyle = C.ink;
    for (let row = 0; row < 12; row++) g.fillRect(off(row) + (row === 0 || row === 11 ? 1 : 0), row, row === 0 || row === 11 ? 15 : 17, 1);
    for (let row = 1; row < 11; row++) {
      g.fillStyle = row <= 2 ? light : row >= 9 ? dark : base;
      g.fillRect(off(row) + 1, row, 15, 1);
      // The stub, lighter, behind a dashed tear line.
      g.fillStyle = row <= 2 ? "#ffffff" : light;
      g.fillRect(off(row) + 1, row, 3, 1);
      if (row % 2) { g.fillStyle = C.ink; g.fillRect(off(row) + 4, row, 1, 1); }
    }
    g.fillStyle = C.paper;
    for (const [x, row] of EMBLEM[kind]) g.fillRect(off(row) + x, row, 1, 1);
  });
}
function coin() { return pixelCanvas(8, 8, g => { ellipse(g, 3, 3, 3, 3, C.ink); ellipse(g, 3, 3, 2, 2, C.gold); g.fillStyle = C.paper; g.fillRect(3, 2, 1, 3); }); }
function shardIcon() { return pixelCanvas(8, 8, g => { g.fillStyle = C.ink; g.fillRect(2, 0, 4, 8); g.fillRect(0, 2, 8, 4); g.fillStyle = C.sky; g.fillRect(3, 1, 2, 6); g.fillRect(1, 3, 6, 2); g.fillStyle = C.paper; g.fillRect(3, 2, 1, 2); }); }
/* PIXEL_MAPS:BEGIN — hand-placed icons, one char per pixel. tests/poke-gacha.test.cjs checks the outlines. */
const PIXEL_MAPS = {
 "candy": ["..kkkk..", ".k2211k.", "k22w110k", "k2w1w10k", "k21w110k", "k111100k", ".k1000k.", "..kkkk.."],
 "check": ["......kk", ".....k1k", "kk..k1k.", "k1kk1k..", ".k11k...", "..kk...."],
 "dot": ["kkkk", "k11k", "k11k", "kkkk"],
 "star": ["...k...", "..k1k..", "kkk1kkk", "k11111k", ".k111k.", "k1kkk1k", "kk...kk"]
};
/* PIXEL_MAPS:END */
// Draw a pixel map: '.' is transparent, every other char looks its color up in `pal`.
function mapCanvas(key, pal) {
  const map = PIXEL_MAPS[key];
  return pixelCanvas(map[0].length, map.length, g => map.forEach((row, y) => { for (let x = 0; x < row.length; x++) if (row[x] !== ".") { g.fillStyle = pal[row[x]]; g.fillRect(x, y, 1, 1); } }));
}
const candyIcon = () => mapCanvas("candy", { k: C.ink, 0: SHADE.red[0], 1: C.red, 2: SHADE.red[2], w: C.paper });
function eggIcon(tier) {
  return pixelCanvas(10, 12, g => shadedEgg(g, 5, 6, 3, 4, tier, tier + 1));
}
const check = done => done ? mapCanvas("check", { k: C.ink, 1: C.gold }) : mapCanvas("dot", { k: C.ink, 1: C.dim });
// Stage stars: gold when earned, dim when not, three in a row.
function starIcons(n) {
  const row = document.createElement("span");
  row.className = "stars"; row.title = n + " of 3 stars";
  for (let i = 0; i < 3; i++) row.append(mapCanvas("star", { k: C.ink, 1: i < n ? C.gold : C.dim }));
  return row;
}

/* ── Shared pieces: elements, sprites in fixed cells, lists, messages ──── */
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; };
// SP skins: hand-made art listed in poke-gacha/sp/skins.json. Hidden until the list has one.
const SKIN_DIR = SPRITE_DIR.replace("pokedoku/sprites/", "poke-gacha/sp/");
const skins = () => (G ? G.skins() : []);
const skinOf = id => skins().find(skin => skin.id === id) || null;
const isSkin = look => look !== "normal" && look !== "shiny";
const spriteUrl = (num, look) => isSkin(look) ? SKIN_DIR + look + ".png" : SPRITE_DIR + (look === "shiny" ? "shiny/" : "") + num + ".png";
const lookName = look => look === "normal" ? "Normal" : look === "shiny" ? "Shiny" : "SP " + (skinOf(look)?.name || "skin");
// Every Pokémon sprite at 1x, never scaled or cropped: cells are 96px, the largest sprite.
const CELL = 96;
function sprite(num, look = "normal", dark = false) {
  const img = new Image();
  img.alt = name(num);
  img.draggable = false;
  if (dark) img.className = "unseen";
  img.src = spriteUrl(num, look);
  return img;
}
function cellWith(node, size = CELL, cls = "") { const c = el("div", "cell " + cls); c.style.width = c.style.height = size + "px"; c.append(node); return c; }
function rows(container, list, at, onPick) {
  container.replaceChildren(...list.map((row, i) => {
    const r = el("div", (i === at ? "at " : "") + (row.off ? "off" : ""));
    r.dataset.row = i;
    if (row.icon) { const ico = el("span", "ico"); ico.append(row.icon); r.append(ico); }
    r.append(el("span", "grow", row.label));
    if (row.right !== undefined && row.right !== "") {

  battle = { b: T.newBattle(stage, squad), stage, slot: 0, cur: [0, 0], paused: true, talk: stage.before.slice(), last: performance.now(), acc: 0, done: false, selected: null };
  const ground = T.pathsOf(stage)[0];

  if (t.length) $("#battle-talk").replaceChildren(el("div", "", t[0]), el("div", "dim", "Enter to continue"));
}
function battleFrame(now) {
  if (!battle) return;
  const bt = battle, b = bt.b;
  const dt = Math.min(0.25, (now - bt.last) / 1000); bt.last = now;
  if (!bt.paused && !bt.talk.length && !document.hidden && !b.over) {

  const path = new Set(b.paths.flat().map(([x, y]) => x + "," + y));
  for (let y = 0; y < T.H; y++) for (let x = 0; x < T.W; x++) {
    const c = bt.stage.map[y][x], px = x * TILE, py = y * TILE;
    if (c === "#") { g.fillStyle = C.panel; g.fillRect(px, py, TILE, TILE); continue; }
    if (c === "H") { g.fillStyle = SHADE.sky[0]; g.fillRect(px, py, TILE, TILE); g.fillStyle = C.sky; g.fillRect(px + 2, py + 2, TILE - 4, TILE - 8); continue; }
    g.fillStyle = path.has(x + "," + y) ? SHADE.paper[0] : C.dim; g.fillRect(px + 1, py + 1, TILE - 2, TILE - 2);
    if (c === "S") { g.fillStyle = C.red; g.fillRect(px + 4, py + 4, TILE - 8, TILE - 8); g.fillStyle = SHADE.paper[0]; g.fillRect(px + 8, py + 8, TILE - 16, TILE - 16); }
    if (c === "G") { g.fillStyle = C.teal; g.fillRect(px + 4, py + 4, TILE - 8, TILE - 8); g.fillStyle = SHADE.teal[2]; g.fillRect(px + 10, py + 10, TILE - 20, TILE - 20); }
  }
  // Where the selected card can go.
  const u = b.squad[bt.slot];
  if (u && !bt.selected) for (let y = 0; y < T.H; y++) for (let x = 0; x < T.W; x++) if (!T.canDeploy(b, bt.slot, x, y) || T.canDeploy(b, bt.slot, x, y) === "energy") {
    if (T.canDeploy(b, bt.slot, x, y) === "energy" && (u.ground ? bt.stage.map[y][x] !== "." : bt.stage.map[y][x] !== "H")) continue;
    if (b.units.some(o => o.x === x && o.y === y)) continue;
    g.fillStyle = C.gold; g.fillRect(x * TILE + 2, y * TILE + 2, TILE - 4, 2); g.fillRect(x * TILE + 2, y * TILE + TILE - 4, TILE - 4, 2);
  }
  const drawMon = (img, cx, by) => { if (img.complete && img.naturalWidth) g.drawImage(img, Math.round(cx - img.naturalWidth / 2), Math.round(by - img.naturalHeight)); };
  const bar = (cx, top, part, color) => { g.fillStyle = C.ink; g.fillRect(cx - 17, top, 34, 4); g.fillStyle = color; g.fillRect(cx - 16, top + 1, Math.max(0, Math.round(32 * part)), 2); };
  const things = [...b.units.map(o => ({ o, unit: true })), ...b.enemies.map(o => ({ o, unit: false }))].sort((a, c) => a.o.y - c.o.y);
  for (const { o, unit } of things) {
    const cx = o.x * TILE + TILE / 2, by = o.y * TILE + TILE - 4;
    // A lit fuse: the tile blinks a red box, and a red bar under the HP bar burns down.
    if (!unit && o.fuse !== null && o.fuse !== undefined) {
      const left = Math.max(0, o.fuse / (T.FUSE || 2.5));
      if (Math.floor(performance.now() / 150) % 2) { g.fillStyle = C.red; const px = o.x * TILE, py = o.y * TILE; g.fillRect(px, py, TILE, 2); g.fillRect(px, py + TILE - 2, TILE, 2); g.fillRect(px, py, 2, TILE); g.fillRect(px + TILE - 2, py, 2, TILE); }
      g.fillStyle = C.ink; g.fillRect(cx - 17, o.y * TILE + 6, 34, 3); g.fillStyle = C.red; g.fillRect(cx - 16, o.y * TILE + 7, Math.round(32 * left), 1);
    }
    // A flyer floats 12px above a small ink shadow on the ground.
    if (!unit && o.flying) { g.fillStyle = C.ink; g.fillRect(cx - 10, by - 2, 20, 2); g.fillRect(cx - 7, by, 14, 2); }
    drawMon(spriteFor(o.num, unit ? o.look : "normal"), cx, by - (!unit && o.flying ? 12 : 0));
    bar(cx, o.y * TILE + 2, o.hp / o.maxHp, unit ? C.teal : C.red);
    if (unit) { g.fillStyle = C.ink; g.fillRect(cx - 17, o.y * TILE + 6, 34, 3); g.fillStyle = C.gold; g.fillRect(cx - 16, o.y * TILE + 7, Math.round(32 * o.sp / o.spMax), 1); }
    if (!unit && o.boss) { g.fillStyle = C.gold; g.fillRect(cx - 4, o.y * TILE - 6, 8, 4); }
  }
  // The tile cursor: a corner bracket, like the egg list.
  const [x, y] = bt.cur, px = x * TILE, py = y * TILE;
  g.fillStyle = bt.selected ? C.red : C.paper;
  for (const [ax, ay, w, h] of [[0, 0, 10, 2], [0, 0, 2, 10], [TILE - 10, 0, 10, 2], [TILE - 2, 0, 2, 10], [0, TILE - 2, 10, 2], [0, TILE - 10, 2, 10], [TILE - 10, TILE - 2, 10, 2], [TILE - 2, TILE - 10, 2, 10]])
    g.fillRect(px + ax, py + ay, w, h);
}
function battleHud() {
  const bt = battle, b = bt.b;
  const hud = $("#battle-hud");
  const parts = [["", bt.stage.id], ["Energy ", Math.floor(b.energy)], ["Lives ", b.life], ["Wave ", Math.min(b.stage.waves.length, b.wavesDone + 1) + "/" + b.stage.waves.length]];
  hud.replaceChildren(...parts.map(([label, value]) => { const s = el("span"); s.append(label, typeof value === "number" || /\d/.test(String(value)) && label ? el("span", "num", value) : value); return s; }),
    el("span", "dim right", bt.done ? "" : bt.paused ? "Paused: Space" : bt.selected ? "Enter retreats" : "Space pauses"));
  $("#deploy").replaceChildren(...b.squad.map((u, i) => {
    const on = b.units.find(o => o.slot === i), cool = Math.max(0, Math.ceil((b.cooldown[i] || 0) - b.t));
    const card = el("div", "card" + (i === bt.slot ? " on" : "") + (on || cool || b.energy < u.cost ? " off" : ""));
    card.dataset.slot = i;
    const top = el("div", "", (i + 1) + " " + name(u.num).slice(0, 5));
    const low = el("div"); low.append(CLASS_SHORT[u.cls] + " ", el("span", "num", on ? "out" : cool ? cool + "s" : u.cost));
    card.append(top, low);
    return card;
  }));
}
function endBattle() {
  const bt = battle, b = bt.b;
  bt.done = true;
  const stars = T.starsFor(b);
  const before = S.balance;
  const r = T.finish({ stage: bt.stage.id, stars, team: [...b.deployed], waves: b.wavesDone });
  refreshTop();
  const gained = ["coins", "regular", "plus", "gold"].map(k => [k, S.balance[k] - before[k]]).filter(([, n]) => n > 0);
  if (stars) bt.talk = bt.stage.after.slice();
  bt.result = { stars, waves: r.waves || 0, gained };
  battleTalk();
  showResult();
}
function showResult() {
  const bt = battle, res = bt.result;
  if (bt.talk.length) { $("#battle-result").hidden = true; return; }
  const box = $("#battle-result");
  box.hidden = false;
  const lines = [el("div", "title", res.stars ? "CLEARED" : "DEFEATED"), res.stars ? (() => { const d = el("div"); d.append(stageStars(res.stars)); return d; })() : el("div", "num", "Try another squad or placement")];
  const waves = el("div"); waves.append("+", el("span", "num", res.waves), " hatch waves");
  lines.push(waves);
  const NAMES = { coins: ["coin", "coins"], regular: ["Regular voucher", "Regular vouchers"], plus: ["Plus voucher", "Plus vouchers"], gold: ["Gold voucher", "Gold vouchers"] };
  for (const [k, n] of res.gained) { const d = el("div"); d.append("+", el("span", "num", n), " " + NAMES[k][n === 1 ? 0 : 1]); lines.push(d); }
  lines.push(el("div", "dim", "Enter: back to the chapter"));
  box.replaceChildren(...lines);
}
function leaveBattle() {
  battle = null;
  $("#scr-battle").hidden = true; $("#battle-result").hidden = true; $("#msg").hidden = false; $("#tabs").classList.remove("locked");
  storyMode = "stages"; go("story");
}
function battleKey(e) {
  const bt = battle, b = bt.b, k = e.key;
  if (bt.talk.length) {
    if (k === "Enter" || k === " ") { e.preventDefault(); bt.talk.shift(); battleTalk(); if (!bt.talk.length) { if (bt.done) showResult(); else bt.paused = false; } }
    return;
  }
  if (bt.done) { if (k === "Enter" || k === " ") { e.preventDefault(); leaveBattle(); } return; }
  if (k === " ") { e.preventDefault(); bt.paused = !bt.paused; return; }
  const move = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[k];
  if (move) { e.preventDefault(); bt.cur = [Math.max(0, Math.min(T.W - 1, bt.cur[0] + move[0])), Math.max(0, Math.min(T.H - 1, bt.cur[1] + move[1]))]; bt.selected = b.units.find(o => o.x === bt.cur[0] && o.y === bt.cur[1]) ? bt.selected : null; return; }
  if (/^[1-8]$/.test(k)) { e.preventDefault(); bt.slot = Number(k) - 1; bt.selected = null; return; }
  if (k === "Enter") { e.preventDefault(); tileAction(bt.cur[0], bt.cur[1]); return; }
  if (k === "Backspace") { e.preventDefault(); bt.selected = null; }
}
function tileAction(x, y) {
  const bt = battle, b = bt.b;
  const here = b.units.find(o => o.x === x && o.y === y);
  if (here) {
    if (bt.selected === here.id) { T.retreat(b, here.id); bt.selected = null; }
    else bt.selected = here.id;
    return;
  }
  const why = T.deploy(b, bt.slot, x, y);
  bt.note = why;
  if (!why) { const next = b.squad.findIndex((u, i) => !b.units.some(o => o.slot === i)); if (next >= 0) bt.slot = next; }
}

/* ── Frame, tabs and switching screens ─────────────────────────────────── */
const TABS = [["story", "Story"], ["pull", "Pull"], ["eggs", "Eggs"], ["dex", "Dex"], ["shop", "Shop"], ["quests", "Quests"]];
// The tabs shown: Story only once the hub has the tower defense engine.
const shownTabs = () => TABS.filter(([id]) => id !== "story" || T);
const SCREENS = { story: [storyUpdate, storyKey], pull: [updateScene, pullKey], eggs: [eggsUpdate, eggsKey], dex: [dexUpdate, dexKey], shop: [shopUpdate, shopKey], quests: [questsUpdate, questsKey] };
function refreshTop() {
  S = G.state();
  const ready = S.eggs.filter(e => e.ready).length;
  $("#tabs").replaceChildren(...shownTabs().map(([id, label], i) => {
    const t = el("div", "panel" + (tab === id ? " on" : ""));
    t.append(el("span", "", label));
    if (id === "eggs" && ready) t.append(" ", el("span", "num", ready));
    t.dataset.tab = id;
    t.title = label + " (" + (i + 1) + ")";
    return t;
  }));
  const purse = el("div", "panel purse");
  purse.append(el("span", "num", S.balance.coins), coin(), el("span", "num", S.balance.shards), shardIcon());
  purse.title = "Coins and shards";
  $("#tabs").append(purse);
}
function go(id) {
  if (!SCREENS[id] || hatching || battle || !shownTabs().some(([shown]) => shown === id)) return;
  tab = pref.tab = id; keep();
  message = null;
  for (const [sid] of TABS) $("#scr-" + sid).hidden = sid !== id;
  refreshTop();
  SCREENS[id][0]();
  $("#wrap").focus({ preventScroll: true });
}
// Whole-number scaling only. Below 640px wide (a phone) the frame shrinks to fit instead.
function placeFrame() {
  const w = document.documentElement.clientWidth - 8, h = window.innerHeight - 8;
  const fit = Math.min(w / 640, h / 408);
  const k = fit >= 1 ? Math.floor(fit) : fit;
  $("#wrap").style.width = Math.floor(640 * k) + "px";
  $("#wrap").style.height = Math.floor(408 * k) + "px";
  $("#frame").style.transform = "scale(" + k + ")";
}

window.addEventListener("resize", placeFrame);
placeFrame();
if (!G) {
  drawBackdrop();
  for (const [sid] of TABS) $("#scr-" + sid).hidden = true;
  $("#msg").hidden = true; $("#off").hidden = false;
} else {
  document.addEventListener("keydown", e => {
    if (battle) return battleKey(e);
    if (/^[1-9]$/.test(e.key) && !hatching && shownTabs()[Number(e.key) - 1]) { e.preventDefault(); return go(shownTabs()[Number(e.key) - 1][0]); }
    if (hatching) return hatchKey(e);
    SCREENS[tab][1](e);
  });
  $("#tabs").onclick = e => { const t = e.target.closest("[data-tab]"); if (t) go(t.dataset.tab); };
  $("#field").onclick = e => {
    if (!battle || battle.talk.length || battle.done) return;
    const box = $("#field").getBoundingClientRect(), k = box.width / 480;
    const x = Math.floor((e.clientX - box.left) / k / TILE), y = Math.floor((e.clientY - box.top) / k / TILE);
    battle.cur = [x, y]; tileAction(x, y);
  };
  $("#deploy").onclick = e => { const c = e.target.closest("[data-slot]"); if (c && battle) { battle.slot = Number(c.dataset.slot); battle.selected = null; } };
  $("#battle-talk").onclick = () => battle && battleKey({ key: "Enter", preventDefault() {} });
  $("#battle-result").onclick = () => battle && battle.done && !battle.talk.length && leaveBattle();
  $("#menu").onmousemove = e => { const r = e.target.closest("[data-row]"); if (r && Number(r.dataset.row) !== cursor && !message) { cursor = Number(r.dataset.row); updateScene(); } };
  $("#hit-left").onclick = () => switchMachine(-1);
  $("#hit-right").onclick = () => switchMachine(1);
  $("#hit-machine").onclick = () => { menuOpen = true; message = null; updateScene(); };
  $("#hatch").onclick = () => hatching && hatchKey({ key: "Enter", preventDefault() {} });
  setInterval(() => { if (tab === "pull" && machine === "legend" && !$("#clock").hidden) $("#clock").textContent = untilMidnight(); }, 1000);
  // Waves earned in another game, or a sync from another device, show up here.
  let seen = "";
  setInterval(() => {
    if (document.hidden || hatching) return;
    const now = JSON.stringify(G.state());
    if (now !== seen) { seen = now; refreshTop(); SCREENS[tab][0](); }
  }, 3000);
  const login = G.claimLogin().ok;
  go(shownTabs().some(([id]) => id === tab) ? tab : "pull");
  if (login) { if (tab === "pull") { message = { text: "Daily login: +3 Regular vouchers." }; updateScene(); } else say("Daily login: +3 Regular vouchers."); }
}

// The hub reads this. Unscored for now; the planned score is unique species caught.
window.__boredSnapshot = () => {
  try { const s = S || (G && G.state()); return { slug: "poke-gacha", caught: s ? s.owned.length : 0, pulls: s ? s.pulls : 0, finished: false }; }
  catch { return { slug: "poke-gacha", caught: 0, pulls: 0, finished: false }; }
};
