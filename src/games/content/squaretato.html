for(const d of drops){if(d.kind==='material'){ctx.fillStyle='#a9df77';ctx.strokeStyle='#38592b';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(d.x,d.y-6);ctx.lineTo(d.x+5,d.y);ctx.lineTo(d.x,d.y+6);ctx.lineTo(d.x-5,d.y);ctx.closePath();ctx.fill();ctx.stroke()}else{circle(d.x,d.y,8,d.kind==='heal'?'#eb8582':d.kind==='legendary'?'#f18d76':'#e5c17b','#4b3a31');ctx.fillStyle='#3f3229';ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillText(d.kind==='heal'?'+':'□',d.x,d.y+4)}}
for(const e of enemies){if(e.tele>0){ctx.strokeStyle='#bf6257';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(e.x-8,e.y-8);ctx.lineTo(e.x+8,e.y+8);ctx.moveTo(e.x+8,e.y-8);ctx.lineTo(e.x-8,e.y+8);ctx.stroke();continue}ctx.fillStyle='#4c413755';ctx.beginPath();ctx.ellipse(e.x,e.y+e.r*.65,e.r*1.1,e.r*.48,0,0,Math.PI*2);ctx.fill();circle(e.x,e.y,e.r,e.flash>0?'#fff0d4':e.color,'#3d2e39');let ex=Math.cos(e.angle)*3,ey=Math.sin(e.angle)*3;circle(e.x-4+ex,e.y-3+ey,2.2,'#342a30');circle(e.x+4+ex,e.y-3+ey,2.2,'#342a30');if(e.kind==='tree'){ctx.fillStyle='#77583d';ctx.fillRect(e.x-4,e.y,8,23);circle(e.x-11,e.y-7,15,'#77905a','#465a3d');circle(e.x+11,e.y-7,15,'#8ca16a','#465a3d');circle(e.x,e.y-17,17,'#97ae71','#465a3d')}if(e.max>50){ctx.fillStyle='#3e3537';ctx.fillRect(e.x-e.r,e.y-e.r-9,e.r*2,4);ctx.fillStyle='#d67d70';ctx.fillRect(e.x-e.r,e.y-e.r-9,e.r*2*clamp(e.hp/e.max,0,1),4)}}
for(const b of shots)circle(b.x,b.y,b.r,b.color,b.enemy?'#9b544c':null);
ctx.globalAlpha=player.inv>0&&Math.floor(player.inv*18)%2===0?.45:1;ctx.fillStyle='#4c413755';ctx.beginPath();ctx.ellipse(player.x,player.y+10,19,8,0,0,Math.PI*2);ctx.fill();circle(player.x,player.y,player.r,'#dbc093','#493c32');circle(player.x-5+Math.cos(player.angle)*2,player.y-3,2.2,'#312b28');circle(player.x+5+Math.cos(player.angle)*2,player.y-3,2.2,'#312b28');ctx.globalAlpha=1;run.gear.forEach((g,i)=>{let p=weaponPos(i),a=Math.atan2(p.y-player.y,p.x-player.x),target=null,best=weaponStats(g,getStats(run)).range;for(const e of enemies){if(e.dead||e.tele>0)continue;let d=dist(p,e);if(d<best){best=d;target=e}}if(target)a=Math.atan2(target.y-p.y,target.x-p.x);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(a);ctx.fillStyle=COLORS[g.tier-1];ctx.strokeStyle='#39332e';ctx.lineWidth=2;let w=weapons[g.id],melee=w.kind==='melee';if(melee){ctx.fillStyle='#8b6545';ctx.fillRect(-8,-3,14,6);ctx.fillStyle=COLORS[g.tier-1];ctx.beginPath();ctx.moveTo(3,-5);ctx.lineTo(w.name==='Spear'?30:21,0);ctx.lineTo(3,5);ctx.closePath();ctx.fill();ctx.stroke()}else if(w.kind==='element'){ctx.fillRect(-8,-3,19,6);circle(13,0,5,'#e9b26d','#48352c')}else{ctx.fillRect(-6,-5,w.name==='SMG'?24:19,10);ctx.strokeRect(-6,-5,w.name==='SMG'?24:19,10);ctx.fillStyle='#594c43';ctx.fillRect(-2,4,6,7);ctx.fillRect(12,-2,10,4)}ctx.restore()});
for(const e of effects){ctx.globalAlpha=clamp(e.life*(e.type==='slash'?7:3),0,1);if(e.type==='text'){ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.strokeStyle='#39302b';ctx.lineWidth=2;ctx.strokeText(e.text,e.x,e.y-(.46-e.life)*25);ctx.fillStyle=e.color;ctx.fillText(e.text,e.x,e.y-(.46-e.life)*25)}else if(e.type==='slash'){ctx.strokeStyle=e.color;ctx.lineWidth=8;ctx.beginPath();ctx.arc(e.x,e.y,e.r*.8,e.a-.65,e.a+.65);ctx.stroke()}else circle(e.x,e.y,e.r*(1.4-e.life),null,e.color);ctx.globalAlpha=1}ctx.restore();if(joy){circle(joy.ox,joy.oy,48,'#1c202644','#eee6cf88');let x=joy.x-joy.ox,y=joy.y-joy.oy,l=Math.max(48,Math.hypot(x,y));circle(joy.ox+x/l*42,joy.oy+y/l*42,18,'#eee6cf88')}}
function suspendSquaretato(){keys.clear();joy=null;if(screen==='playing'&&!paused&&run?.phase==='playing')pause()}
function pause(){if(screen!=='playing'||paused)return;paused=true;keys.clear();joy=null;overlay.hidden=false;pauseButton.hidden=true;panel.replaceChildren();heading('Paused','Wave '+run.wave+' · '+Math.ceil(time)+' seconds remaining');append(panel,row(button('Resume',resume,'primary'),button('Quit to menu',()=>{if(resumeCheckpoint){run=JSON.parse(resumeCheckpoint);save()}menu()}),button(muted?'Sound: off':'Sound: on',()=>{muted=!muted;paused=false;pause()})),el('p','muted','Quitting restarts this wave from its saved starting build.'))}
function resume(){paused=false;overlay.hidden=true;pauseButton.hidden=false;last=performance.now()}
window.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(screen==='playing'&&k==='escape'){e.preventDefault();paused?resume():pause();return}if(screen==='playing'&&['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)){e.preventDefault();if(!paused)keys.add(k)}});window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));window.addEventListener('blur',suspendSquaretato);document.addEventListener('visibilitychange',()=>{if(document.hidden)suspendSquaretato()});window.addEventListener('pagehide',save);pauseButton.onclick=pause;
canvas.addEventListener('pointerdown',e=>{if(screen!=='playing'||paused||e.pointerType==='mouse')return;joy={id:e.pointerId,ox:e.clientX,oy:e.clientY,x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(joy?.id===e.pointerId){joy.x=e.clientX;joy.y=e.clientY}});function release(e){if(joy?.id===e.pointerId)joy=null}canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);canvas.addEventListener('lostpointercapture',release);canvas.addEventListener('touchcancel',()=>joy=null);
window.__boredSnapshot=()=>({slug:'squaretato',wave:run?.wave||0,kills:run?.kills||0,level:run?.level||0,remaining:Math.max(0,Math.ceil(time)),materials:run?.money||0,hp:player?Math.ceil(player.hp):0,playing:run?.phase==='playing'&&!paused,finished:run?.phase==='dead'||run?.phase==='victory',won:!!run?.won});
window.addEventListener('resize',resize);resize();menu();function frame(now){const dt=clamp((now-last)/1000,0,.05);last=now;tick(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
