<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Squaretato</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font:14px system-ui}iframe{display:block;width:100%;height:100%;border:0}#status{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}#status[hidden]{display:none}</style></head>
<body><iframe id="game" title="Squaretato" allow="autoplay" scrolling="no"></iframe><div id="status" role="status">Loading Squaretato…</div>
<script>
const frame=document.getElementById('game'),status=document.getElementById('status');
const base=document.baseURI;
const standalone=new URL(base).pathname.endsWith('/squaretato.html');
const url=new URL((standalone?'squaretato/':'games/content/squaretato/')+'index.html',base);
frame.addEventListener('load',()=>{try{if(frame.contentWindow.location.href==='about:blank')return;status.hidden=true;frame.contentWindow.focus()}catch{status.textContent='Could not load Squaretato.'}});
frame.src=url.href;
setTimeout(()=>{if(!status.hidden)status.textContent='Still loading Squaretato… Try reopening the game if this persists.'},10000);
</script></body></html>
