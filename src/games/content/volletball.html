setItem:function(x,v){m[x]=String(v)},removeItem:function(x){delete m[x]},
clear:function(){m={}},key:k};

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunset Volley</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #08060e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'DM Mono', monospace;
    color: #e8e6e0;
    overflow: hidden;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 900px;
    padding: 8px 0;
  }
  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 30px;
    letter-spacing: 8px;
    background: linear-gradient(90deg, #f39c12, #e67e22, #f39c12);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .scores { display: flex; gap: 16px; align-items: center; }
  .score {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 44px; letter-spacing: 2px;
    min-width: 45px; text-align: center;
    transition: transform 0.15s;
  }
  .score.p1 { color: #00e5ff; text-shadow: 0 0 18px rgba(0,229,255,0.4); }
  .score.p2 { color: #ff4757; text-shadow: 0 0 18px rgba(255,71,87,0.4); }
  .score.bump { transform: scale(1.3); }
  .sep { color: #444; font-size: 30px; font-family: 'Bebas Neue', sans-serif; }
  canvas { display: block; border-radius: 8px; box-shadow: 0 4px 60px rgba(0,0,0,0.7); }
  .controls {
    display: flex; justify-content: space-between;
    width: 900px; padding: 10px 0;
    font-size: 11px; color: #555; letter-spacing: 0.5px;
  }
  .controls span {
    display: inline-block; padding: 2px 7px;
    background: #131320; border-radius: 3px;
    margin: 0 2px; color: #888;
  }
  .p1c span { border: 1px solid rgba(0,229,255,0.15); }
  .p2c span { border: 1px solid rgba(255,71,87,0.15); }
  .p2c { text-align: right; }
  .mode {
    background: none; border: 1px solid #1b1b28; border-radius: 3px;
    color: #777; cursor: pointer; font: 11px/1 'DM Mono', monospace;
    letter-spacing: 1px; padding: 4px 8px;
  }
  .mode:hover { border-color: #444; color: #ccc; }
  .start {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: rgba(8,6,14,0.82); z-index: 20;
  }
  .start[hidden] { display: none; }
  .start .panel {
    border: 1px solid #23233a; background: #0d0b16; border-radius: 6px;
    padding: 22px 26px; text-align: center;
  }
  .start h2 {
    font-family: 'Bebas Neue', sans-serif; font-size: 26px;
    letter-spacing: 6px; margin-bottom: 4px;
  }
  .start p { font-size: 11px; color: #777; letter-spacing: 1px; margin-bottom: 16px; }
  .start .choices { display: flex; gap: 10px; }
  .start button {
    display: grid; gap: 6px; background: none; color: #ddd; cursor: pointer;
    border: 1px solid #2c2c44; border-radius: 4px;
    font: 12px/1.2 'DM Mono', monospace; padding: 12px 16px;
  }
  .start button:hover, .start button:focus-visible { border-color: #e67e22; color: #fff; outline: none; }
  .start button small { color: #6a6a80; font-size: 9px; letter-spacing: .5px; }
  .msg {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 60px; letter-spacing: 10px;
    pointer-events: none; opacity: 0;
    transition: opacity 0.3s ease;
    text-shadow: 0 0 50px currentColor; z-index: 10;
  }
  .msg.show { opacity: 1; }
</style>

<body>
<div class="header">
  <h1>SUNSET VOLLEY</h1>
  <div class="scores">
    <div class="score p1" id="s1">0</div>
    <div class="sep">-</div>
    <div class="score p2" id="s2">0</div>
  </div>
</div>
<canvas id="c" width="900" height="500"></canvas>
<div class="controls">
  <div class="p1c"><span>W</span> jump &nbsp; <span>A</span> <span>D</span> move</div>
  <button type="button" class="mode" id="mode">vs CPU</button>
  <div class="p2c" id="p2hint"><span>CPU</span> covers the far side</div>
</div>
<div class="msg" id="msg"></div>
<div class="start" id="start">
  <div class="panel">
    <h2>SUNSET VOLLEY</h2>
    <p>Who takes the far side?</p>
    <div class="choices">
      <button type="button" data-cpu="1"><b>1 player</b><small>the computer returns serve</small></button>
      <button type="button" data-cpu="0"><b>2 players</b><small>someone sits on the far side</small></button>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 900, H = 500;
const s1El = document.getElementById('s1');
const s2El = document.getElementById('s2');
const msgEl = document.getElementById('msg');

const GROUND = 420;
const NET_X = 450, NET_TOP = 310, NET_W = 10;
const WALL_L = 15, WALL_R = W - 15, CEIL = 10;
const GRAV_PLAYER = 0.17;
const GRAV_BALL = 0.07;
const BALL_R = 12, PL_R = 19;
const JUMP = -10;
const P_ACC = 0.92, P_FRIC = 0.82, P_MAX = 4.4;  // friction drags toward a 4.19 px/frame top speed
const B_MAX = 8, B_E = 1.05, B_DRAG = 0.996;  // a slower ball: the cap and the live bounce both drop
const WIN = 7;

let sc = [0, 0], serv = 0;
let ball, p1, p2;
let cpuMode = true, aiDir = 0, aiJump = false, aiTick = 0, aiTargetX = 0;
let parts = [], trail = [];
let st = 'choose', stT = 55, lastHit = -1;

const keys = {};
onkeydown = e => {
  keys[e.code] = true;
  if ('ArrowUp ArrowDown ArrowLeft ArrowRight Space Enter'.includes(e.code)) e.preventDefault();
  if (st === 'choose') {
    if (e.code === 'Digit1' || e.code === 'Enter') startMatch(true);
    else if (e.code === 'Digit2') startMatch(false);
  }
};
onkeyup = e => { keys[e.code] = false; };
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden) for(const k in keys)keys[k]=false });

const mkP = (x, c) => ({ x, y: GROUND - PL_R, vx: 0, vy: 0, r: PL_R, c, gnd: true, jh: false });
const mkB = (x, y) => ({ x, y, vx: 0, vy: 0, r: BALL_R });

function spark(x, y, c, n, spd) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, s = Math.random() * spd + 0.5;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1, life: 1, c, r: Math.random() * 3 + 1 });
  }
}

function msg(txt, c) {
  msgEl.textContent = txt;
  msgEl.style.color = c || '#ffd700';
  msgEl.classList.add('show');
  clearTimeout(msg._t);
  msg._t = setTimeout(() => msgEl.classList.remove('show'), 1400);
}

function bump(el) {
  el.classList.add('bump');
  setTimeout(() => el.classList.remove('bump'), 150);
}

function reset() {
  p1 = mkP(180, '#00e5ff');
  p2 = mkP(720, '#ff4757');
  ball = mkB(serv === 0 ? 200 : 700, 180);
  ball.vy = 0.3;
  parts = []; trail = [];
  st = 'serve'; stT = 55; lastHit = -1;
}

// The CPU reads the ball like a player would: work out where it will come
// down on its side, walk there, and jump when the ball is overhead.
function driveCpu() {
  if (st !== 'play' && st !== 'serve') { aiTargetX = NET_X + 150; aiDir = 0; aiJump = false; return; }
  if (aiTick-- <= 0) {
    aiTick = 4;
    let tx = NET_X + 160, ty = GROUND - PL_R;
    if (ball.x > NET_X || ball.vx > 0.4) {
      let x = ball.x, y = ball.y, vx = ball.vx, vy = ball.vy, t = 0;
      while (t < 200 && y < GROUND - PL_R) {
        vy += GRAV_BALL; x += vx; y += vy; vx *= B_DRAG; t++;
        if (x - BALL_R < WALL_L) { x = WALL_L + BALL_R; vx = Math.abs(vx) * 0.7; }
        if (x + BALL_R > WALL_R) { x = WALL_R - BALL_R; vx = -Math.abs(vx) * 0.7; }
        if (x > NET_X - 40 && y > NET_TOP && y < NET_TOP + 20) x = Math.max(x, NET_X + 20);
      }
      tx = x; ty = y;
      // A little slop so clean angles still beat it.
      if (ball.vx !== 0) tx += (Math.random() - 0.5) * 18;
    }
    aiTargetX = Math.max(NET_X + 50, Math.min(WALL_R - 30, tx));
    aiDir = aiTargetX - p2.x > 12 ? 1 : aiTargetX - p2.x < -12 ? -1 : 0;
    aiJump = p2.gnd && ball.x > NET_X - 60 && ball.y < p2.y - 10 && ty < GROUND - PL_R - 8 && Math.abs(ball.x - p2.x) < 90;
  }
}

function moveP(p, up, l, r, side) {
  if (keys[l]) p.vx -= P_ACC;
  if (keys[r]) p.vx += P_ACC;
  p.vx *= P_FRIC;
  p.vx = Math.max(-P_MAX, Math.min(P_MAX, p.vx));

  if (keys[up] && p.gnd && !p.jh) {
    p.vy = JUMP; p.gnd = false; p.jh = true;
    spark(p.x, GROUND, '#c4956a', 5, 2);
  }
  if (!keys[up]) p.jh = false;

  p.vy += GRAV_PLAYER;
  p.x += p.vx; p.y += p.vy;

  if (p.y + p.r > GROUND) { p.y = GROUND - p.r; p.vy = 0; p.gnd = true; }

  if (side === 0) {
    if (p.x - p.r < WALL_L) { p.x = WALL_L + p.r; p.vx = 0; }
    if (p.x + p.r > NET_X - NET_W / 2 - 2) { p.x = NET_X - NET_W / 2 - 2 - p.r; p.vx = 0; }
  } else {
    if (p.x - p.r < NET_X + NET_W / 2 + 2) { p.x = NET_X + NET_W / 2 + 2 + p.r; p.vx = 0; }
    if (p.x + p.r > WALL_R) { p.x = WALL_R - p.r; p.vx = 0; }
  }
}

function hitP(pl, idx) {
  const dx = ball.x - pl.x, dy = ball.y - pl.y;
  const d = Math.hypot(dx, dy), mn = ball.r + pl.r;
  if (d < mn && d > 0.01) {
    const nx = dx / d, ny = dy / d;
    ball.x += nx * (mn - d + 1);
    ball.y += ny * (mn - d + 1);
    const dvn = (ball.vx - pl.vx) * nx + (ball.vy - pl.vy) * ny;
    if (dvn < 0) {
      // Bias upward so ball naturally goes over net
      const e = B_E;
      const upBoost = -0.8;
      ball.vx -= (1 + e) * dvn * nx;
      ball.vy -= (1 + e) * dvn * ny;
      ball.vy += upBoost;
      ball.vx += pl.vx * 0.35;
      ball.vy += pl.vy * 0.15;
      const sp = Math.hypot(ball.vx, ball.vy);
      if (sp > B_MAX) { ball.vx = ball.vx / sp * B_MAX; ball.vy = ball.vy / sp * B_MAX; }
      lastHit = idx;
      spark(ball.x, ball.y, pl.c, 10, 3.5);
    }
  }
}

function bounceWalls() {
  if (ball.x - ball.r < WALL_L) { ball.x = WALL_L + ball.r; ball.vx = Math.abs(ball.vx) * 0.7; spark(WALL_L, ball.y, '#888', 3, 2); }
  if (ball.x + ball.r > WALL_R) { ball.x = WALL_R - ball.r; ball.vx = -Math.abs(ball.vx) * 0.7; spark(WALL_R, ball.y, '#888', 3, 2); }
  if (ball.y - ball.r < CEIL) { ball.y = CEIL + ball.r; ball.vy = Math.abs(ball.vy) * 0.6; }
}

function bounceNet() {
  if (ball.y + ball.r > NET_TOP) {
    const nl = NET_X - NET_W / 2, nr = NET_X + NET_W / 2;
    if (ball.x + ball.r > nl && ball.x - ball.r < nr) {
      const px = ball.x - ball.vx;
      if (px < NET_X) { ball.x = nl - ball.r; ball.vx = -Math.abs(ball.vx) * 0.5; }
      else { ball.x = nr + ball.r; ball.vx = Math.abs(ball.vx) * 0.5; }
      ball.vy *= 0.8;
      spark(ball.x, ball.y, '#fff', 4, 2);
    }
  }
}

function tickParts() {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.06; p.life -= 0.025;
    if (p.life <= 0) parts.splice(i, 1);
  }
}

function update() {
  if (st === 'choose') { tickParts(); return; }
  if (st === 'over') {
    tickParts();
    if (keys['KeyR'] || keys['Space'] || keys['Enter']) {
      sc = [0, 0]; s1El.textContent = '0'; s2El.textContent = '0'; serv = 0; reset();
    }
    return;
  }
  if (st === 'scored') {
    tickParts(); stT--;
    if (stT <= 0) reset();
    return;
  }

  moveP(p1, 'KeyW', 'KeyA', 'KeyD', 0);
  driveCpu();
  if (cpuMode) {
    keys['ArrowLeft'] = aiDir < 0;
    keys['ArrowRight'] = aiDir > 0;
    keys['ArrowUp'] = aiJump;
  }
  moveP(p2, 'ArrowUp', 'ArrowLeft', 'ArrowRight', 1);

  ball.vy += (st === 'serve' ? GRAV_BALL * 0.3 : GRAV_BALL);
  ball.vx *= B_DRAG;
  ball.x += ball.vx; ball.y += ball.vy;
  bounceWalls();
  bounceNet();
  hitP(p1, 0); hitP(p2, 1);

  if (ball.y + ball.r > GROUND) {
    ball.y = GROUND - ball.r;
    if (st === 'serve') {
      ball.vy = -Math.abs(ball.vy) * 0.5; ball.vx *= 0.8;
    } else {
      if (ball.x < NET_X) { sc[1]++; serv = 0; } else { sc[0]++; serv = 1; }
      s1El.textContent = sc[0]; s2El.textContent = sc[1];
      bump(sc[0] > sc[1] || (ball.x >= NET_X) ? s1El : s2El);
      spark(ball.x, GROUND, '#c4956a', 18, 4);
      spark(ball.x, GROUND, lastHit === 0 ? '#00e5ff' : '#ff4757', 12, 3);
      // Seven takes the local match. Against the CPU the rally never stops
      // asking for a winner, so the score just keeps climbing.
      if (!cpuMode && (sc[0] >= WIN || sc[1] >= WIN)) {
        st = 'over';
        msg(sc[0] >= WIN ? 'PLAYER 1 WINS!' : 'PLAYER 2 WINS!', sc[0] >= WIN ? '#00e5ff' : '#ff4757');
      } else {
        st = 'scored'; stT = 70;
        msg('POINT!', ball.x < NET_X ? '#ff4757' : '#00e5ff');
      }
      ball.vx = 0; ball.vy = 0;
    }
  }

  if (st === 'serve') { stT--; if (stT <= 0) { st = 'play'; msg('PLAY!', '#ffd700'); } }

  trail.push({ x: ball.x, y: ball.y });
  if (trail.length > 16) trail.shift();
  tickParts();
}

function draw() {
  ctx.save();

  const sky = ctx.createLinearGradient(0, 0, 0, GROUND);
  sky.addColorStop(0, '#0d0221');
  sky.addColorStop(0.25, '#1a0a3e');
  sky.addColorStop(0.5, '#5c2d82');
  sky.addColorStop(0.72, '#b5351a');
  sky.addColorStop(0.88, '#e67e22');
  sky.addColorStop(1, '#f5b041');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, GROUND);

  const sg = ctx.createRadialGradient(W / 2, GROUND + 5, 0, W / 2, GROUND + 5, 140);
  sg.addColorStop(0, 'rgba(255,220,100,0.55)');
  sg.addColorStop(0.35, 'rgba(255,150,50,0.18)');
  sg.addColorStop(1, 'transparent');
  ctx.fillStyle = sg;
  ctx.beginPath(); ctx.arc(W / 2, GROUND + 5, 140, 0, 6.283); ctx.fill();

  ctx.fillStyle = 'rgba(255,255,255,0.035)';
  [[120, 85, 110, 16], [380, 55, 85, 13], [680, 80, 95, 14]].forEach(([x, y, w, h]) => {
    ctx.beginPath(); ctx.ellipse(x, y, w, h, 0, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x - w * .25, y + h * .3, w * .5, h * .7, 0, 0, 6.283); ctx.fill();
  });

  const sandG = ctx.createLinearGradient(0, GROUND, 0, H);
  sandG.addColorStop(0, '#c4956a'); sandG.addColorStop(1, '#9a7048');
  ctx.fillStyle = sandG; ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.strokeStyle = '#b08060'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(0, GROUND); ctx.lineTo(W, GROUND); ctx.stroke();

  ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 1.5;
  ctx.setLineDash([6, 6]);
  ctx.beginPath(); ctx.moveTo(NET_X, GROUND + 5); ctx.lineTo(NET_X, H); ctx.stroke();
  ctx.setLineDash([]);

  drawNet();

  [p1, p2].forEach(p => {
    const s = Math.max(0.3, 1 - (GROUND - p.y) / 280);
    ctx.beginPath(); ctx.ellipse(p.x, GROUND + 2, p.r * s * 1.2, p.r * s * 0.3, 0, 0, 6.283);
    ctx.fillStyle = `rgba(0,0,0,${.22 * s})`; ctx.fill();
  });
  const bs = Math.max(0.3, 1 - (GROUND - ball.y) / 350);
  ctx.beginPath(); ctx.ellipse(ball.x, GROUND + 2, ball.r * bs * 1.5, ball.r * bs * 0.35, 0, 0, 6.283);
  ctx.fillStyle = `rgba(0,0,0,${.2 * bs})`; ctx.fill();

  for (let i = 0; i < trail.length; i++) {
    const t = trail[i], a = i / trail.length * .12, r = BALL_R * i / trail.length * .5;
    ctx.beginPath(); ctx.arc(t.x, t.y, r, 0, 6.283);
    ctx.fillStyle = `rgba(255,240,200,${a})`; ctx.fill();
  }

  drawP(p1); drawP(p2);

  const bg = ctx.createRadialGradient(ball.x, ball.y, 0, ball.x, ball.y, ball.r * 3);
  bg.addColorStop(0, 'rgba(255,255,220,0.12)'); bg.addColorStop(1, 'transparent');
  ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r * 3, 0, 6.283); ctx.fill();

  ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, 6.283);
  const bgr = ctx.createRadialGradient(ball.x - 2, ball.y - 2, 0, ball.x, ball.y, ball.r);
  bgr.addColorStop(0, '#fff'); bgr.addColorStop(.6, '#f5ead5'); bgr.addColorStop(1, '#d4b896');
  ctx.fillStyle = bgr; ctx.fill();
  ctx.strokeStyle = 'rgba(180,160,130,0.5)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.strokeStyle = 'rgba(200,180,150,0.3)'; ctx.lineWidth = .7;
  ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r * .55, 0, 6.283); ctx.stroke();
  ctx.beginPath(); ctx.arc(ball.x + ball.r * .2, ball.y - ball.r * .1, ball.r * .7, -1, .8); ctx.stroke();

  for (const p of parts) {
    ctx.globalAlpha = p.life;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283);
    ctx.fillStyle = p.c; ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.font = '90px "Bebas Neue", sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(0,229,255,0.07)';
  ctx.fillText(sc[0], 225, GROUND - 60);
  ctx.fillStyle = 'rgba(255,71,87,0.07)';
  ctx.fillText(sc[1], 675, GROUND - 60);

  ctx.restore();
}

function drawNet() {
  const nl = NET_X - NET_W / 2, nr = NET_X + NET_W / 2;
  ctx.fillStyle = '#666';
  ctx.fillRect(nl + 1, NET_TOP - 18, 3, GROUND - NET_TOP + 18);
  ctx.fillRect(nr - 4, NET_TOP - 18, 3, GROUND - NET_TOP + 18);
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  ctx.fillRect(nl, NET_TOP, NET_W, GROUND - NET_TOP);
  ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = .5;
  for (let y = NET_TOP + 8; y < GROUND; y += 10) {
    ctx.beginPath(); ctx.moveTo(nl, y); ctx.lineTo(nr, y); ctx.stroke();
  }
  ctx.beginPath(); ctx.moveTo(NET_X, NET_TOP); ctx.lineTo(NET_X, GROUND); ctx.stroke();
  ctx.fillStyle = '#ddd';
  ctx.fillRect(nl - 3, NET_TOP - 5, NET_W + 6, 8);
  ctx.strokeStyle = '#999'; ctx.lineWidth = .5;
  ctx.strokeRect(nl - 3, NET_TOP - 5, NET_W + 6, 8);
}

function drawP(p) {
  const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 2.5);
  g.addColorStop(0, p.c + '15'); g.addColorStop(1, 'transparent');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 2.5, 0, 6.283); ctx.fill();

  ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283);
  const bg = ctx.createRadialGradient(p.x - 3, p.y - 3, 0, p.x, p.y, p.r);
  bg.addColorStop(0, '#fff'); bg.addColorStop(.3, p.c); bg.addColorStop(1, p.c + '99');
  ctx.fillStyle = bg; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1.5; ctx.stroke();

  const dir = p === p1 ? 1 : -1;
  const eo = 5 * dir;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(p.x + eo - 2.5, p.y - 3, 2.5, 0, 6.283); ctx.fill();
  ctx.beginPath(); ctx.arc(p.x + eo + 2.5, p.y - 3, 2.5, 0, 6.283); ctx.fill();
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.arc(p.x + eo - 2.5 + dir * .8, p.y - 3, 1.2, 0, 6.283); ctx.fill();
  ctx.beginPath(); ctx.arc(p.x + eo + 2.5 + dir * .8, p.y - 3, 1.2, 0, 6.283); ctx.fill();
}

function loop() { update(); draw(); requestAnimationFrame(loop); }

const modeBtn = document.getElementById('mode');
const p2hint = document.getElementById('p2hint');
function setMode(cpu) {
  cpuMode = cpu;
  modeBtn.textContent = cpu ? '1 player' : '2 players';
  p2hint.innerHTML = cpu
    ? '<span>CPU</span> covers the far side'
    : '<span>↑</span> jump &nbsp; <span>←</span> <span>→</span> move';
  keys['ArrowLeft'] = keys['ArrowRight'] = keys['ArrowUp'] = false;
  aiDir = 0; aiJump = false; aiTick = 0;
}
modeBtn.onclick = () => setMode(!cpuMode);

const startEl = document.getElementById('start');
function startMatch(cpu) {
  setMode(cpu);
  sc = [0, 0];
  s1El.textContent = '0'; s2El.textContent = '0';
  serv = 0;
  reset();
  startEl.hidden = true;
}
for (const button of document.querySelectorAll('#start [data-cpu]')) {
  button.onclick = () => startMatch(button.dataset.cpu === '1');
}

window.__test = {
  pads: () => [p1, p2].map(p => ({ x: +p.x.toFixed(1), y: +p.y.toFixed(1) })),
  ball: () => ({ x: +ball.x.toFixed(1), y: +ball.y.toFixed(1), vx: +ball.vx.toFixed(2) }),
  cpu: () => cpuMode,
  scores: () => sc.slice(),
  state: () => st
};

reset();
setMode(cpuMode);
st = 'choose';
loop();
</script>
</body>
</html>
