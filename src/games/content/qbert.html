})();</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
    <title>Q*BERT</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center
        }

        canvas {
            display: block;
            touch-action: none;
            -webkit-tap-highlight-color: transparent
        }
    </style>
</head>

<body>
    <canvas id="c"></canvas>
    <script>
        // ═══════════════════ SETUP ═══════════════════
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        const W = 600, H = 700;
        canvas.width = W; canvas.height = H;

        function resize() {
            const r = W / H;
            let w = innerWidth, h = innerHeight;
            if (w / h > r) w = h * r; else h = w / r;
            canvas.style.width = w + 'px';
            canvas.style.height = h + 'px';
        }
        addEventListener('resize', resize); resize();

        // ═══════════════════ AUDIO ═══════════════════
        let audioCtx;
        function snd(freq, dur, type = 'square', vol = 0.05, to) {
            if (!audioCtx) return;
            try {
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                const t = audioCtx.currentTime;
                o.type = type; o.frequency.setValueAtTime(freq, t);
                if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
                g.gain.value = vol;
                g.gain.exponentialRampToValueAtTime(0.001, t + dur);
                o.connect(g).connect(audioCtx.destination);
                o.start(t); o.stop(t + dur);
            } catch (e) { }
        }
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        // ═══════════════════ BOARD GEOMETRY ═══════════════════
        const CW = 28, CH = 14, CD = 20;      // cube half-width, face height, depth
        const SPX = CW * 2, SPY = CH + CD;    // spacing between cube centres
        const PX = 300;
        const JDUR = 0.2, JH = 48;
        const PR = 12, ER = 10;

        let ROWS = 7, PY = 146;

        // A taller pyramid sits higher so every level is centred on the same band.
        function setBoard(rows) {
            ROWS = Math.max(4, Math.min(7, rows));
            PY = 146 + (7 - ROWS) * (SPY / 2);
        }

        const gp = (r, c) => ({ x: PX + (c - r / 2) * SPX, y: PY + r * SPY });

        // ═══════════════════ PALETTES ═══════════════════
        const P = {
            blue: { t: '#2858a8', l: '#1a3870', r: '#3878d0' },
            yellow: { t: '#eebb00', l: '#aa8800', r: '#ffdd44' },
            purple: { t: '#7733bb', l: '#4a1f77', r: '#9955dd' },
            green: { t: '#1e8e3e', l: '#145528', r: '#30b058' },
            orange: { t: '#dd6611', l: '#994408', r: '#ff8833' },
            teal: { t: '#0f8a8a', l: '#075656', r: '#1fb8b8' }
        };

        // ═══════════════════ LEVELS ═══════════════════
        // Each level changes the board size, the number of colour passes and the
        // enemies that show up, so the run is a real climb rather than one board
        // with a bigger number in the corner. After the authored levels the
        // generator keeps going with faster hops and fewer discs.
        const ALL_TYPES = ['red', 'egg', 'slick', 'sam'];

        const LEVELS = [
            { name: 'First Steps', rows: 5, paint: [P.blue, P.yellow], discs: 4, spawn: 3.4, speed: 1.00, types: ['red'] },
            { name: 'Two-Way Traffic', rows: 6, paint: [P.blue, P.yellow], discs: 4, spawn: 3.0, speed: 1.00, types: ['red', 'egg'] },
            { name: 'Double Dip', rows: 6, paint: [P.blue, P.purple, P.yellow], discs: 4, spawn: 2.7, speed: 1.05, types: ['red', 'egg'] },
            { name: 'Slick Work', rows: 7, paint: [P.green, P.orange], discs: 4, spawn: 2.4, speed: 1.05, types: ['red', 'slick', 'sam'] },
            { name: 'Coily Nest', rows: 7, paint: [P.blue, P.yellow], discs: 3, spawn: 2.1, speed: 1.10, types: ['red', 'egg', 'slick'] },
            { name: 'Triple Play', rows: 7, paint: [P.blue, P.yellow, P.purple, P.green], discs: 3, spawn: 1.9, speed: 1.15, types: ALL_TYPES },
            { name: 'The Gauntlet', rows: 7, paint: [P.orange, P.teal], discs: 2, spawn: 1.5, speed: 1.25, types: ALL_TYPES },
            { name: 'Last Hop', rows: 7, paint: [P.purple, P.yellow, P.blue], discs: 2, spawn: 1.25, speed: 1.35, types: ALL_TYPES }
        ];

        const ENDLESS_PAINTS = [
            [P.blue, P.yellow], [P.yellow, P.purple], [P.green, P.orange],
            [P.blue, P.purple, P.yellow], [P.teal, P.orange],
            [P.purple, P.green, P.blue, P.yellow]
        ];

        function levelDefFor(n) {
            if (LEVELS[n - 1]) return LEVELS[n - 1];
            const i = n - LEVELS.length - 1;
            const paint = ENDLESS_PAINTS[i % ENDLESS_PAINTS.length];
            return {
                name: 'Endless ' + n,
                rows: 7,
                paint,
                discs: 2,
                spawn: Math.max(0.9, 1.3 - i * 0.02),
                speed: Math.min(1.8, 1.4 + i * 0.04),
                types: ALL_TYPES
            };
        }

        // Background stars
        const STARS = Array.from({ length: 80 }, () => ({
            x: Math.random() * W, y: Math.random() * H,
            s: Math.random() * 1.5 + 0.5, a: Math.random() * 0.3 + 0.1, f: Math.random() * 2 + 0.5
        }));

        // ═══════════════════ STATE ═══════════════════
        let state, tmr, grid, pl, jmp, dth, enemies, discs, ride;
        let score, lives, gameLvl, paint, curRound, maxRounds, streak;
        let eTmr, lastT = 0, nextExtraLife = 8000, paused = false, banner = '';
        let spawnEvery = 3, enemySpeed = 1, spawnTypes = ['red'];
        let particles = [], pops = [];

        // ═══════════════════ SMALL HELPERS ═══════════════════
        const lp = (a, b, t) => a + (b - a) * t;

        function emitParticles(x, y, col) {
            for (let i = 0; i < 6; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 80,
                    vy: -Math.random() * 100 - 30,
                    life: 0.4 + Math.random() * 0.3,
                    maxLife: 0.7,
                    col, sz: 1.5 + Math.random() * 2
                });
            }
        }

        function addPop(x, y, text, col) {
            pops.push({ x, y, text, col, life: 0.9, max: 0.9 });
        }

        function countLeft() {
            let n = 0;
            for (let r = 0; r < ROWS; r++)
                for (let c = 0; c <= r; c++)
                    if (grid[r][c] < curRound) n++;
            return n;
        }

        function maxEnemies() {
            return Math.min(5, 1 + Math.floor(gameLvl / 2) + (curRound - 1));
        }

        // ═══════════════════ INITIALISATION ═══════════════════
        function init() {
            state = 'title'; tmr = 0; paused = false;
            score = 0; lives = 3; gameLvl = 1; nextExtraLife = 8000; streak = 0;
            setBoard(7);
            paint = [P.blue, P.yellow];
            maxRounds = 1; curRound = 1; banner = '';
            grid = Array.from({ length: ROWS }, (_, r) => Array(r + 1).fill(0));
            pl = null; enemies = []; discs = [];
            jmp = null; dth = null; ride = null;
            particles = []; pops = [];
        }

        function newGame() {
            score = 0; lives = 3; gameLvl = 1; nextExtraLife = 8000;
            startLevel();
        }

        function startLevel() {
            const def = levelDefFor(gameLvl);
            setBoard(def.rows);
            paint = def.paint;
            maxRounds = Math.min(3, paint.length - 1);
            curRound = 1;
            spawnEvery = def.spawn;
            enemySpeed = def.speed;
            spawnTypes = def.types;
            grid = Array.from({ length: ROWS }, (_, r) => Array(r + 1).fill(0));
            pl = { r: 0, c: 0, x: 0, y: 0 };
            jmp = null; dth = null; ride = null;
            enemies = []; particles = []; pops = [];
            streak = 0; paused = false;
            initDiscs(def.discs);
            eTmr = 0.8;
            setPPos();
            state = 'ready'; tmr = 1.8;
            banner = def.name;
        }

        // Discs sit on the sides of the pyramid and ferry Q*bert back to the top.
        function initDiscs(count) {
            const last = ROWS - 2;
            let rows;
            if (count >= 4) rows = [1, Math.max(2, Math.round(last * 0.45)), Math.max(3, Math.round(last * 0.75)), last];
            else if (count === 3) rows = [1, Math.max(2, Math.round(last * 0.55)), last];
            else rows = [Math.max(1, Math.round(last * 0.4)), last];
            rows = [...new Set(rows)].sort((a, b) => a - b);
            discs = rows.map((row, i) => ({
                side: i % 2 === 0 ? 'left' : 'right',
                row,
                active: true,
                respawnTmr: 0
            }));
        }

        function discVisualPos(d) {
            return d.side === 'left' ? gp(d.row - 1, -1) : gp(d.row - 1, d.row);
        }

        function setPPos() {
            if (jmp) {
                const f = gp(jmp.fr, jmp.fc), t = gp(jmp.tr, jmp.tc);
                pl.x = lp(f.x, t.x, jmp.t);
                pl.y = lp(f.y, t.y, jmp.t) - Math.sin(jmp.t * Math.PI) * JH - PR;
            } else {
                const p = gp(pl.r, pl.c);
                pl.x = p.x; pl.y = p.y - PR;
            }
        }

        // ═══════════════════ MOVEMENT ═══════════════════
        function tryMove(dr, dc) {
            if (state !== 'playing' || paused || jmp || dth || ride) return;
            const nr = pl.r + dr, nc = pl.c + dc;

            if (nr < 0 || nr >= ROWS || nc < 0 || nc > nr) {
                // Off the pyramid: is there a disc on this side of this row?
                if (dr === -1) {
                    let ds = null;
                    if (dc === -1 && nc < 0) {
                        ds = discs.find(d => d.side === 'left' && d.row === pl.r && d.active);
                    } else if (dc === 0 && nc > nr) {
                        ds = discs.find(d => d.side === 'right' && d.row === pl.r && d.active);
                    }
                    if (ds) { startRide(ds); return; }
                }
                doDie(dr, dc); return;
            }

            jmp = { fr: pl.r, fc: pl.c, tr: nr, tc: nc, t: 0 };
            snd(350, 0.05);
        }

        function land() {
            const p = gp(pl.r, pl.c);
            pl.x = p.x; pl.y = p.y - PR;

            if (grid[pl.r][pl.c] < curRound) {
                grid[pl.r][pl.c]++;
                streak++;
                const mult = 1 + Math.min(3, Math.floor(streak / 6));
                const pts = 25 * mult;
                score += pts;
                addPop(p.x, p.y + 2, '+' + pts, mult > 1 ? '#ffcc00' : '#dfe4ff');
                const col = paint[Math.min(grid[pl.r][pl.c], paint.length - 1)];
                emitParticles(p.x, p.y + CH, col.t);
                snd(480 + Math.min(streak, 14) * 20, 0.06);
            } else {
                snd(330, 0.04);
            }

            // Landing on a cube an enemy occupies
            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                if (e.r !== pl.r || e.c !== pl.c) continue;
                if (e.type === 'slick' || e.type === 'sam') {
                    enemies.splice(i, 1);
                    score += 300;
                    addPop(p.x, p.y - 18, '+300', '#88ffaa');
                    emitParticles(e.x, e.y, '#c8ffd8');
                    snd(780, 0.09);
                    // This landing still painted the cube, so it can still clear the board.
                    checkClear();
                    return;
                }
                doDie(); return;
            }

            checkClear();
        }

        function resetToTop() {
            pl.r = 0; pl.c = 0;
            jmp = null; dth = null; ride = null;
            enemies = [];
            setPPos();
        }

        function checkClear() {
            if (countLeft() > 0) return;

            if (curRound < maxRounds) {
                curRound++;
                streak = 0;
                score += 1000;
                addPop(PX, PY + 110, 'ROUND CLEAR +1000', '#7dffa0');
                snd(700, 0.09);
                setTimeout(() => snd(900, 0.1), 100);
                resetToTop();
                eTmr = 1.2;
                state = 'ready'; tmr = 1.3;
                banner = 'ROUND ' + curRound;
                return;
            }

            const bonus = 1000 + gameLvl * 250;
            score += bonus;
            addPop(PX, PY + 110, 'LEVEL CLEAR +' + bonus, '#7dffa0');
            snd(700, 0.1);
            setTimeout(() => snd(920, 0.1), 110);
            setTimeout(() => snd(1180, 0.14), 220);
            state = 'win'; tmr = 2.2;
        }

        // ═══════════════════ DEATH ═══════════════════
        function doDie(fdr, fdc) {
            state = 'dying';
            streak = 0;
            const p = gp(pl.r, pl.c);
            const isFall = fdr !== undefined;
            dth = {
                x: p.x, y: p.y - PR,
                vx: isFall ? (fdc || 0) * 60 : (Math.random() - 0.5) * 80,
                vy: isFall ? -100 : -200,
                rot: 0, rs: (Math.random() - 0.5) * 10, t: 0
            };
            snd(220, 0.32, 'sawtooth', 0.07, 60);
        }

        // ═══════════════════ DISC RIDE ═══════════════════
        function startRide(disc) {
            disc.active = false;
            disc.respawnTmr = 11 + Math.random() * 5;
            const dp = discVisualPos(disc);
            const tp = gp(0, 0);
            ride = {
                phase: 0, t: 0,
                sx: pl.x, sy: pl.y,
                dx: dp.x, dy: dp.y - PR,
                ex: tp.x, ey: tp.y - PR
            };
            snd(520, 0.09, 'triangle', 0.05, 900);
        }

        function updateRide(dt) {
            ride.t += dt;
            if (ride.phase === 0) {
                const dur = 0.25, t = Math.min(ride.t / dur, 1);
                pl.x = lp(ride.sx, ride.dx, t);
                pl.y = lp(ride.sy, ride.dy, t) - Math.sin(t * Math.PI) * 25;
                if (t >= 1) { ride.phase = 1; ride.t = 0; }
            } else {
                const dur = 0.7, t = Math.min(ride.t / dur, 1);
                const et = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
                pl.x = lp(ride.dx, ride.ex, et);
                pl.y = lp(ride.dy, ride.ey, et) - Math.sin(et * Math.PI) * 50;
                if (t >= 1) {
                    pl.r = 0; pl.c = 0;
                    pl.x = ride.ex; pl.y = ride.ey;
                    ride = null;
                    enemies = enemies.filter(e => e.type !== 'coily' && e.type !== 'egg');
                    score += 100;
                    addPop(pl.x, pl.y - 22, '+100', '#ff9ce6');
                    snd(420, 0.07);
                }
            }
        }

        // ═══════════════════ ENEMIES ═══════════════════
        function spawnEnemy() {
            if (enemies.length >= maxEnemies()) return;
            const hasCoily = enemies.some(e => e.type === 'egg' || e.type === 'coily');
            const pool = [];
            for (const t of spawnTypes) {
                if (t === 'egg' && hasCoily) continue;
                const weight = t === 'red' ? 3 : t === 'egg' ? 2 : 1;
                for (let i = 0; i < weight; i++) pool.push(t);
            }
            if (!pool.length) return;

            const type = pool[Math.floor(Math.random() * pool.length)];
            const c = Math.random() < 0.5 ? 0 : 1;
            const p = gp(1, c);
            enemies.push({
                type, r: 1, c,
                dir: Math.random() < 0.5 ? 0 : 1,
                mt: 0, mi: enemyInterval(type),
                x: p.x, y: p.y - ER
            });
        }

        function enemyInterval(type) {
            const base = type === 'egg' ? 0.9
                : type === 'coily' ? 0.85
                    : (type === 'slick' || type === 'sam') ? 0.72 : 0.8;
            return base / enemySpeed;
        }

        function updateEnemies(dt) {
            eTmr -= dt;
            if (eTmr <= 0) {
                spawnEnemy();
                eTmr = spawnEvery * (0.85 + Math.random() * 0.4);
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                e.mt += dt;
                if (e.mt >= e.mi) {
                    e.mt -= e.mi;
                    let nr, nc;

                    if (e.type === 'coily') {
                        const m = coilyMove(e);
                        if (!m) { enemies.splice(i, 1); continue; }
                        nr = m.r; nc = m.c;
                    } else {
                        nr = e.r + 1;
                        nc = e.c + e.dir;
                        if (nr >= ROWS || nc < 0 || nc > nr) {
                            // An egg that runs out of room at the bottom hatches there
                            // and starts hunting instead of falling away.
                            if (e.type === 'egg' && e.r >= ROWS - 1) { hatch(e); continue; }
                            enemies.splice(i, 1); continue;
                        }
                    }

                    // Slick and Sam turn a cube back one colour.
                    if ((e.type === 'slick' || e.type === 'sam') && grid[nr] && grid[nr][nc] !== undefined) {
                        if (grid[nr][nc] > 0) {
                            grid[nr][nc]--;
                            const t = gp(nr, nc);
                            emitParticles(t.x, t.y + CH, '#9cffb4');
                        }
                    }

                    e.r = nr; e.c = nc;
                    if (Math.random() < 0.25) e.dir = 1 - e.dir;

                    // An egg that reaches the bottom row hatches into Coily.
                    if (e.type === 'egg' && e.r >= ROWS - 1) hatch(e);
                }

                const tp = gp(e.r, e.c);
                const ey = e.type === 'coily' ? tp.y - ER * 1.8 : tp.y - ER;
                e.x = lp(e.x, tp.x, 0.15);
                e.y = lp(e.y, ey, 0.15);
            }
        }

        function hatch(e) {
            e.type = 'coily';
            e.mi = enemyInterval('coily');
            snd(300, 0.12, 'sawtooth', 0.06, 140);
        }

        function coilyMove(e) {
            const moves = [
                { r: e.r - 1, c: e.c - 1 }, { r: e.r - 1, c: e.c },
                { r: e.r + 1, c: e.c }, { r: e.r + 1, c: e.c + 1 }
            ];
            const valid = moves.filter(m => m.r >= 0 && m.r < ROWS && m.c >= 0 && m.c <= m.r);
            if (!valid.length) return null;
            if (Math.random() < 0.12) return valid[Math.floor(Math.random() * valid.length)];
            let best = null, bd = Infinity;
            for (const m of valid) {
                const d = (m.r - pl.r) ** 2 + (m.c - pl.c) ** 2;
                if (d < bd) { bd = d; best = m; }
            }
            return best;
        }

        function checkHit() {
            if (jmp || dth || ride || state !== 'playing') return;
            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                if (e.r !== pl.r || e.c !== pl.c) continue;
                if (e.type === 'slick' || e.type === 'sam') {
                    enemies.splice(i, 1);
                    score += 300;
                    addPop(e.x, e.y - 18, '+300', '#88ffaa');
                    snd(780, 0.09);
                    continue;
                }
                doDie(); return;
            }
        }

        // ═══════════════════ UPDATE ═══════════════════
        function update(dt) {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.vy += 250 * dt;
                p.x += p.vx * dt; p.y += p.vy * dt;
                p.life -= dt;
                if (p.life <= 0) particles.splice(i, 1);
            }
            for (let i = pops.length - 1; i >= 0; i--) {
                const p = pops[i];
                p.y -= 26 * dt;
                p.life -= dt;
                if (p.life <= 0) pops.splice(i, 1);
            }

            if (state === 'title' || state === 'gameover') {
                tmr -= dt;
                return;
            }
            if (paused) return;

            tmr -= dt;

            if (score >= nextExtraLife) {
                lives = Math.min(9, lives + 1);
                nextExtraLife += 12000;
                addPop(PX, 90, 'EXTRA LIFE', '#ffcc00');
                snd(1000, 0.1);
                setTimeout(() => snd(1300, 0.1), 100);
            }

            for (const d of discs) {
                if (!d.active) {
                    d.respawnTmr -= dt;
                    if (d.respawnTmr <= 0) d.active = true;
                }
            }

            switch (state) {
                case 'ready':
                    if (tmr <= 0) { state = 'playing'; banner = ''; }
                    break;

                case 'playing':
                    if (ride) updateRide(dt);
                    else if (jmp) {
                        jmp.t += dt / JDUR;
                        if (jmp.t >= 1) {
                            jmp.t = 1; pl.r = jmp.tr; pl.c = jmp.tc;
                            jmp = null; land();
                        }
                        if (pl) setPPos();
                    }
                    updateEnemies(dt);
                    checkHit();
                    break;

                case 'dying':
                    if (dth) {
                        dth.vy += 450 * dt;
                        dth.x += dth.vx * dt;
                        dth.y += dth.vy * dt;
                        dth.rot += dth.rs * dt;
                        dth.t += dt;
                        if (dth.y > H + 60) {
                            lives--;
                            dth = null;
                            if (lives <= 0) {
                                state = 'gameover'; tmr = 1.5;
                            } else {
                                resetToTop();
                                eTmr = 1.4;
                                state = 'ready'; tmr = 1.0;
                                banner = '';
                            }
                        }
                    }
                    break;

                case 'win':
                    if (tmr <= 0) { gameLvl++; startLevel(); }
                    break;
            }
        }

        // ═══════════════════ DRAWING ═══════════════════
        function drawBg() {
            const g = ctx.createLinearGradient(0, 0, 0, H);
            g.addColorStop(0, '#060614');
            g.addColorStop(0.5, '#0a0a22');
            g.addColorStop(1, '#050510');
            ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
            const now = Date.now() / 1000;
            for (const s of STARS) {
                ctx.fillStyle = 'rgba(170,180,240,' + Math.max(0, s.a + Math.sin(now * s.f) * 0.12) + ')';
                ctx.fillRect(s.x, s.y, s.s, s.s);
            }
            const gl = ctx.createRadialGradient(PX, PY + 130, 40, PX, PY + 130, 280);
            gl.addColorStop(0, 'rgba(25,40,90,0.12)');
            gl.addColorStop(1, 'transparent');
            ctx.fillStyle = gl; ctx.fillRect(0, 0, W, H);
        }

        function drawCube(cx, cy, tc, lc, rc) {
            ctx.beginPath();
            ctx.moveTo(cx, cy); ctx.lineTo(cx + CW, cy + CH);
            ctx.lineTo(cx, cy + CH * 2); ctx.lineTo(cx - CW, cy + CH);
            ctx.closePath(); ctx.fillStyle = tc; ctx.fill();
            ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 1; ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(cx - CW, cy + CH); ctx.lineTo(cx, cy + CH * 2);
            ctx.lineTo(cx, cy + CH * 2 + CD); ctx.lineTo(cx - CW, cy + CH + CD);
            ctx.closePath(); ctx.fillStyle = lc; ctx.fill(); ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(cx + CW, cy + CH); ctx.lineTo(cx, cy + CH * 2);
            ctx.lineTo(cx, cy + CH * 2 + CD); ctx.lineTo(cx + CW, cy + CH + CD);
            ctx.closePath(); ctx.fillStyle = rc; ctx.fill(); ctx.stroke();
        }

        function drawGrid() {
            if (!grid) return;
            for (let r = 0; r < ROWS; r++)
                for (let c = 0; c <= r; c++) {
                    const p = gp(r, c);
                    const col = paint[Math.min(grid[r][c], paint.length - 1)];
                    drawCube(p.x, p.y, col.t, col.l, col.r);
                }
        }

        function drawDiscs() {
            const now = Date.now() / 500;
            for (const d of discs) {
                if (!d.active) continue;
                const p = discVisualPos(d);
                const wb = Math.sin(now + d.row) * 2;

                ctx.save();
                ctx.translate(p.x, p.y + wb);

                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.beginPath(); ctx.ellipse(0, 5, 13, 4, 0, 0, Math.PI * 2); ctx.fill();

                const spin = Math.sin(now * 2.5 + d.row) * 0.4;
                const dg = ctx.createLinearGradient(-12, -3, 12, 3);
                dg.addColorStop(0, '#ff44ff'); dg.addColorStop(0.5, '#ff99ff'); dg.addColorStop(1, '#cc22cc');
                ctx.fillStyle = dg;
                ctx.beginPath(); ctx.ellipse(0, 0, 13, 5, spin, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#aa00aa'; ctx.lineWidth = 1; ctx.stroke();

                ctx.fillStyle = 'rgba(255,255,255,0.6)';
                ctx.beginPath(); ctx.arc(0, 0, 2.5, 0, Math.PI * 2); ctx.fill();

                ctx.restore();
            }
        }

        // ─── Character sprites ───
        function drawQbertSprite(x, y) {
            ctx.beginPath(); ctx.arc(x, y, PR, 0, Math.PI * 2);
            const bg = ctx.createRadialGradient(x - 3, y - 3, 1, x, y, PR);
            bg.addColorStop(0, '#ffaa33'); bg.addColorStop(1, '#dd6600');
            ctx.fillStyle = bg; ctx.fill();
            ctx.strokeStyle = '#aa4400'; ctx.lineWidth = 1.5; ctx.stroke();

            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(x - 4, y - 3, 4, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(x + 4, y - 3, 4, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#111';
            ctx.beginPath(); ctx.arc(x - 3, y - 2, 2, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(x + 5, y - 2, 2, 0, Math.PI * 2); ctx.fill();

            ctx.beginPath();
            ctx.moveTo(x - 3, y + 2); ctx.lineTo(x + 3, y + 2);
            ctx.quadraticCurveTo(x + 4, y + 8, x, y + 10);
            ctx.quadraticCurveTo(x - 4, y + 8, x - 3, y + 2);
            ctx.fillStyle = '#ee6600'; ctx.fill();
            ctx.fillStyle = '#773300';
            ctx.beginPath(); ctx.arc(x - 1, y + 8, 1, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(x + 1, y + 8, 1, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = '#ff8800';
            ctx.beginPath(); ctx.ellipse(x - 5, y + PR + 1, 4, 3, -0.2, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(x + 5, y + PR + 1, 4, 3, 0.2, 0, Math.PI * 2); ctx.fill();
        }

        function drawRedBall(x, y) {
            const gl = ctx.createRadialGradient(x - 3, y - 3, 1, x, y, ER);
            gl.addColorStop(0, '#ff6666'); gl.addColorStop(1, '#bb0020');
            ctx.beginPath(); ctx.arc(x, y, ER, 0, Math.PI * 2);
            ctx.fillStyle = gl; ctx.fill();
            ctx.strokeStyle = '#880015'; ctx.lineWidth = 1; ctx.stroke();
            ctx.beginPath(); ctx.arc(x - 2, y - 3, 2.5, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.fill();
        }

        function drawEgg(x, y) {
            const gl = ctx.createRadialGradient(x - 2, y - 2, 1, x, y, ER);
            gl.addColorStop(0, '#cc88ff'); gl.addColorStop(1, '#6622aa');
            ctx.beginPath(); ctx.arc(x, y, ER, 0, Math.PI * 2);
            ctx.fillStyle = gl; ctx.fill();
            ctx.strokeStyle = '#441177'; ctx.lineWidth = 1; ctx.stroke();
            ctx.beginPath(); ctx.arc(x - 2, y - 3, 3, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.fill();
            ctx.strokeStyle = 'rgba(100,50,150,0.4)'; ctx.lineWidth = 0.7;
            ctx.beginPath(); ctx.moveTo(x - 3, y - 1); ctx.lineTo(x, y + 1); ctx.lineTo(x + 2, y - 2); ctx.stroke();
        }

        function drawCoilySnake(x, y) {
            ctx.beginPath(); ctx.arc(x, y + 4, ER * 1.2, 0, Math.PI * 2);
            const bg = ctx.createRadialGradient(x - 2, y + 2, 1, x, y + 4, ER * 1.2);
            bg.addColorStop(0, '#9944cc'); bg.addColorStop(1, '#551188');
            ctx.fillStyle = bg; ctx.fill();
            ctx.strokeStyle = '#330055'; ctx.lineWidth = 1.5; ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(x - 4, y + 1); ctx.quadraticCurveTo(x - 5, y - 5, x, y - 8);
            ctx.quadraticCurveTo(x + 5, y - 5, x + 4, y + 1);
            ctx.fillStyle = '#7733aa'; ctx.fill();

            ctx.beginPath(); ctx.arc(x, y - 10, 7, 0, Math.PI * 2);
            const hg = ctx.createRadialGradient(x - 1, y - 11, 1, x, y - 10, 7);
            hg.addColorStop(0, '#bb66ee'); hg.addColorStop(1, '#7733aa');
            ctx.fillStyle = hg; ctx.fill();
            ctx.strokeStyle = '#551188'; ctx.lineWidth = 1; ctx.stroke();

            ctx.fillStyle = '#ffff00';
            ctx.beginPath(); ctx.arc(x - 3, y - 12, 2.5, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(x + 3, y - 12, 2.5, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#111';
            ctx.beginPath(); ctx.ellipse(x - 2.5, y - 12, 1, 1.8, 0.2, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(x + 3.5, y - 12, 1, 1.8, -0.2, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.moveTo(x - 2, y - 5); ctx.lineTo(x - 1, y - 2); ctx.lineTo(x - 3, y - 4); ctx.fill();
            ctx.beginPath(); ctx.moveTo(x + 2, y - 5); ctx.lineTo(x + 1, y - 2); ctx.lineTo(x + 3, y - 4); ctx.fill();
        }

        function drawSlickChar(x, y, base, dark) {
            const gl = ctx.createRadialGradient(x - 2, y - 2, 1, x, y, ER);
            gl.addColorStop(0, base); gl.addColorStop(1, dark);
            ctx.beginPath(); ctx.arc(x, y, ER, 0, Math.PI * 2);
            ctx.fillStyle = gl; ctx.fill();
            ctx.strokeStyle = dark; ctx.lineWidth = 1; ctx.stroke();
            ctx.fillStyle = '#111';
            ctx.fillRect(x - 7, y - 4, 5, 3.5); ctx.fillRect(x + 2, y - 4, 5, 3.5);
            ctx.fillRect(x - 2, y - 3, 4, 1);
            ctx.beginPath(); ctx.arc(x - 4.5, y - 2, 2, 0, Math.PI * 2); ctx.fillStyle = '#335'; ctx.fill();
            ctx.beginPath(); ctx.arc(x + 4.5, y - 2, 2, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = dark;
            ctx.beginPath(); ctx.ellipse(x, y + 3, 3, 2, 0, 0, Math.PI * 2); ctx.fill();
        }

        function drawEnemy(e) {
            switch (e.type) {
                case 'red': drawRedBall(e.x, e.y); break;
                case 'egg': drawEgg(e.x, e.y); break;
                case 'coily': drawCoilySnake(e.x, e.y); break;
                case 'slick': drawSlickChar(e.x, e.y, '#66ff88', '#118833'); break;
                case 'sam': drawSlickChar(e.x, e.y, '#dd88ff', '#6622aa'); break;
            }
        }

        function drawPlayer() {
            if (!pl) return;
            if (dth) {
                ctx.save();
                ctx.translate(dth.x, dth.y);
                ctx.rotate(dth.rot);
                drawQbertSprite(0, 0);
                ctx.restore();
                if (dth.t < 2.0) drawBubble(dth.x, dth.y);
            } else {
                drawQbertSprite(pl.x, pl.y);
            }
        }

        function drawBubble(x, y) {
            const txt = '@!#?@!';
            ctx.font = '7px ui-monospace, SFMono-Regular, Menlo, monospace';
            const tw = ctx.measureText(txt).width;
            const bw = tw + 12, bh = 18;
            const bx = x - bw / 2, by = y - 36;

            ctx.fillStyle = '#fff';
            ctx.fillRect(bx, by, bw, bh);
            ctx.strokeStyle = '#333'; ctx.lineWidth = 1; ctx.strokeRect(bx, by, bw, bh);

            ctx.beginPath();
            ctx.moveTo(x - 3, by + bh); ctx.lineTo(x, by + bh + 6); ctx.lineTo(x + 3, by + bh);
            ctx.closePath(); ctx.fillStyle = '#fff'; ctx.fill();
            ctx.beginPath(); ctx.moveTo(x - 3, by + bh); ctx.lineTo(x, by + bh + 6);
            ctx.strokeStyle = '#333'; ctx.stroke();
            ctx.beginPath(); ctx.moveTo(x + 3, by + bh); ctx.lineTo(x, by + bh + 6); ctx.stroke();

            ctx.fillStyle = '#d00';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(txt, x + 1, by + bh / 2 + 1);
            ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
        }

        function drawParticles() {
            for (const p of particles) {
                ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
                ctx.fillStyle = p.col;
                ctx.fillRect(p.x - p.sz / 2, p.y - p.sz / 2, p.sz, p.sz);
            }
            ctx.globalAlpha = 1;
        }

        function drawPops() {
            ctx.textAlign = 'center';
            ctx.font = '8px ui-monospace, SFMono-Regular, Menlo, monospace';
            for (const p of pops) {
                ctx.globalAlpha = Math.max(0, Math.min(1, p.life / p.max));
                ctx.fillStyle = '#000';
                ctx.fillText(p.text, p.x + 1, p.y + 1);
                ctx.fillStyle = p.col;
                ctx.fillText(p.text, p.x, p.y);
            }
            ctx.globalAlpha = 1;
            ctx.textAlign = 'left';
        }

        function drawHUD() {
            if (state === 'title' || !grid) return;

            ctx.textAlign = 'left';
            ctx.font = '13px ui-monospace, SFMono-Regular, Menlo, monospace';
            ctx.fillStyle = '#e6e8f6';
            ctx.fillText('SCORE ' + score, 18, 30);

            if (streak >= 6) {
                ctx.font = '9px ui-monospace, SFMono-Regular, Menlo, monospace';
                ctx.fillStyle = '#ffcc00';
                ctx.fillText('COMBO x' + (1 + Math.min(3, Math.floor(streak / 6))), 18, 48);
            }

            ctx.textAlign = 'right';
            ctx.font = '13px ui-monospace, SFMono-Regular, Menlo, monospace';
            ctx.fillStyle = '#e6e8f6';
            ctx.fillText('LEVEL ' + gameLvl, W - 18, 30);
            ctx.font = '9px ui-monospace, SFMono-Regular, Menlo, monospace';
            ctx.fillStyle = '#8a8ab2';
            ctx.fillText('ROUND ' + curRound + '/' + maxRounds, W - 18, 48);

            ctx.textAlign = 'center';
            ctx.font = '9px ui-monospace, SFMono-Regular, Menlo, monospace';
            ctx.fillStyle = '#9a9ac2';
            ctx.fillText(countLeft() + ' CUBES LEFT', PX, 30);

            // The colour this round has to reach
            const sw = paint[Math.min(curRound, paint.length - 1)];
            ctx.beginPath();
            ctx.moveTo(PX, 40); ctx.lineTo(PX + 10, 45); ctx.lineTo(PX, 50); ctx.lineTo(PX - 10, 45);
            ctx.closePath();
            ctx.fillStyle = sw.t; ctx.fill();
            ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 1; ctx.stroke();

            // Lives, bottom-left
            for (let i = 0; i < lives; i++) {
                const bx = 26 + i * 26, by = H - 24;
                ctx.beginPath(); ctx.arc(bx, by, 8, 0, Math.PI * 2);
                const bg = ctx.createRadialGradient(bx - 2, by - 2, 1, bx, by, 8);
                bg.addColorStop(0, '#ffaa33'); bg.addColorStop(1, '#dd6600');
                ctx.fillStyle = bg; ctx.fill();
                ctx.strokeStyle = '#aa4400'; ctx.lineWidth = 1; ctx.stroke();
                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(bx - 2, by - 2, 2, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(bx + 2, by - 2, 2, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#111';
                ctx.beginPath(); ctx.arc(bx - 1.5, by - 1.5, 1, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(bx + 2.5, by - 1.5, 1, 0, Math.PI * 2); ctx.fill();
            }

            ctx.textAlign = 'right';
            ctx.font = '9px ui-monospace, SFMono-Regular, Menlo, monospace';
            ctx.fillStyle = '#4c4c6e';
            ctx.fillText('P PAUSE', W - 18, H - 20);
            ctx.textAlign = 'left';
        }

        function drawMsg(txt, col, yo, sz = 20) {
            ctx.textAlign = 'center';
            ctx.font = 'bold ' + sz + 'px ui-monospace, SFMono-Regular, Menlo, monospace';
            ctx.fillStyle = '#000';
            ctx.fillText(txt, PX + 2, PY + yo + 2);
            ctx.fillStyle = col;
            ctx.fillText(txt, PX, PY + yo);
            ctx.textAlign = 'left';
        }

        function drawTitle() {
            ctx.fillStyle = 'rgba(0,0,0,0.42)';
            ctx.fillRect(0, 0, W, H);

            ctx.textAlign = 'center';
            ctx.font = 'bold 42px ui-monospace, SFMono-Regular, Menlo, monospace';
            ctx.fillStyle = '#1a1a2a';
            ctx.fillText('Q*BERT', PX + 3, 213);
            const tg = ctx.createLinearGradient(PX - 130, 190, PX + 130, 220);
            tg.addColorStop(0, '#ff8800'); tg.addColorStop(0.5, '#ffcc00'); tg.addColorStop(1, '#ff8800');
            ctx.fillStyle = tg;
            ctx.fillText('Q*BERT', PX, 210);

            ctx.font = '10px ui-monospace, SFMono-Regular, Menlo, monospace';
            ctx.fillStyle = '#9d9dc6';
            ctx.fillText('HOP EVERY CUBE ONTO THE TARGET COLOUR', PX, 258);

            const lines = [
                ['ARROWS / WASD', 'hop'],
                ['SWIPE', 'hop on touch'],
                ['DISC', 'ride back to the top'],
                ['SLICK & SAM', 'land on them for 300'],
                ['P', 'pause']
            ];
            let y = 306;
            for (const [key, what] of lines) {
                ctx.textAlign = 'right';
                ctx.fillStyle = '#ffcc00';
                ctx.font = '9px ui-monospace, SFMono-Regular, Menlo, monospace';
                ctx.fillText(key, PX - 18, y);
                ctx.textAlign = 'left';
                ctx.fillStyle = '#7f7fa8';
                ctx.fillText(what, PX + 18, y);
                y += 26;
            }

            if (Math.sin(Date.now() / 300) > 0) {
                ctx.textAlign = 'center';
                ctx.fillStyle = '#ffcc00';
                ctx.font = '13px ui-monospace, SFMono-Regular, Menlo, monospace';
                ctx.fillText('PRESS ANY KEY', PX, 476);
            }
            ctx.textAlign = 'left';
        }

        // ═══════════════════ MAIN LOOP ═══════════════════
        function frame(t) {
            const dt = Math.min((t - lastT) / 1000, 0.05);
            lastT = t;
            update(dt);

            drawBg();
            drawGrid();
            drawDiscs();

            const drawList = [];
            for (const e of enemies) drawList.push({ t: 'e', d: e, y: e.y, r: e.r });
            if (pl) {
                const pr = jmp ? (jmp.t > 0.5 ? jmp.tr : jmp.fr) : pl.r;
                drawList.push({ t: 'p', y: dth ? dth.y : pl.y, r: pr });
            }
            drawList.sort((a, b) => a.r - b.r || a.y - b.y);

            for (const item of drawList) {
                if (item.t === 'e') drawEnemy(item.d);
                else drawPlayer();
            }

            drawParticles();
            drawPops();
            drawHUD();

            if (state === 'title') drawTitle();
            if (state === 'ready') {
                drawMsg(banner || ('LEVEL ' + gameLvl), '#ffcc00', 250, curRound > 1 ? 18 : 22);
                if (curRound === 1) drawMsg('HOP THE ' + ROWS + '-ROW PYRAMID', '#8f8fb8', 282, 9);
            }
            if (state === 'win') drawMsg('LEVEL CLEAR!', '#7dffa0', 250, 22);
            if (state === 'gameover') {
                drawMsg('GAME OVER', '#ff6a6a', 236, 24);
                drawMsg('SCORE ' + score, '#b9bde0', 274, 14);
                drawMsg('LEVEL ' + gameLvl + ' REACHED', '#8f8fb8', 302, 9);
                if (tmr <= 0 && Math.sin(Date.now() / 300) > 0)
                    drawMsg('PRESS ANY KEY', '#ffcc00', 344, 13);
            }
            if (paused) {
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(0, 0, W, H);
                drawMsg('PAUSED', '#ffcc00', 250, 22);
                drawMsg('PRESS P TO RESUME', '#8f8fb8', 282, 9);
            }

            requestAnimationFrame(frame);
        }

        // ═══════════════════ INPUT ═══════════════════
        const MOVES = {
            ArrowUp: [-1, 0], ArrowLeft: [-1, -1], ArrowDown: [1, 0], ArrowRight: [1, 1],
            w: [-1, 0], W: [-1, 0], a: [-1, -1], A: [-1, -1],
            s: [1, 0], S: [1, 0], d: [1, 1], D: [1, 1]
        };

        function pauseKey() {
            if (state === 'playing' || state === 'ready') {
                paused = !paused;
                return true;
            }
            return false;
        }

        addEventListener('keydown', e => {
            initAudio();
            if (state === 'title') { newGame(); e.preventDefault(); return; }
            if (state === 'gameover' && tmr <= 0) { newGame(); e.preventDefault(); return; }
            if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
                if (pauseKey()) e.preventDefault();
                return;
            }
            if (paused) return;
            const m = MOVES[e.key];
            if (m) { tryMove(m[0], m[1]); e.preventDefault(); }
        });

        let tStart = null;
        canvas.addEventListener('touchstart', e => {
            initAudio();
            if (state === 'title') { newGame(); e.preventDefault(); return; }
            if (state === 'gameover' && tmr <= 0) { newGame(); e.preventDefault(); return; }
            if (paused) { paused = false; e.preventDefault(); return; }
            tStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            e.preventDefault();
        }, { passive: false });

        canvas.addEventListener('touchend', e => {
            if (!tStart) return;
            const dx = e.changedTouches[0].clientX - tStart.x;
            const dy = e.changedTouches[0].clientY - tStart.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 20) tryMove(-1, 0);
            else {
                const a = Math.atan2(dy, dx);
                if (a > -Math.PI / 2 && a <= 0) tryMove(-1, 0);
                else if (a > 0 && a <= Math.PI / 2) tryMove(1, 1);
                else if (a > Math.PI / 2) tryMove(1, 0);
                else tryMove(-1, -1);
            }
            tStart = null; e.preventDefault();
        }, { passive: false });

        // ═══════════════════ GO ═══════════════════
        init();
        requestAnimationFrame(frame);
    </script>
</body>

</html>
