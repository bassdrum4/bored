<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pokédoku</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box }
  [hidden] { display: none !important }
  html, body { height: 100% }
  body { background: #f5f2ea; color: #191713; font: 14px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; display: flex; flex-direction: column }
  #bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px 8px 72px; min-height: 56px; border-bottom: 1px solid #d8d2c4; font-size: 12px; flex: none }
  #bar b { letter-spacing: .06em; text-transform: uppercase }
  button.lbl { font: inherit; font-size: 12px; padding: 6px 10px; border: 1px solid #191713; background: none; color: inherit; cursor: pointer; border-radius: 2px }
  button.lbl:hover { background: #ece7da }
  button.lbl.big { font-size: 14px; padding: 9px 14px; font-weight: 600 }
  #landing { flex: 1; overflow-y: auto; display: flex; justify-content: center; padding: 16px 12px 28px }
  #landing > div { width: min(420px, 100%); display: flex; flex-direction: column; gap: 10px }
  h1 { font-size: 24px; font-weight: 700; letter-spacing: .02em }
  .muted { color: #6b6558 }
  .small { font-size: 12px }
  .today { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em }
  .today b { font-size: 20px; letter-spacing: 0; font-variant-numeric: tabular-nums }
  .card { border: 1px solid #d8d2c4; background: #fffdf7; padding: 12px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; border-radius: 2px }
  .card h2 { font-size: 15px; font-weight: 700 }
  .card p { font-size: 12px; color: #6b6558; grid-column: 1 }
  .card .st { font-size: 12px; grid-column: 1 }
  .card .st b { font-variant-numeric: tabular-nums }
  .card button { grid-column: 2; grid-row: 1 / span 3 }
  .done { color: #3d7a35 }
  #frames { flex: 1; position: relative; min-height: 0 }
  #frames iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #f5f2ea }
  @media (prefers-color-scheme: dark) {
    body, #frames iframe { background: #1b1a17; color: #ece7da }
    #bar { border-color: #3a372f }
    .muted, .card p { color: #a49d8e }
    .card { background: #24221e; border-color: #3a372f }
    button.lbl { border-color: #ece7da }
    button.lbl:hover { background: #2f2c26 }
    .done { color: #7cc46f }
  }
</style>
</head>
<body>
<!-- The arcade floats its own menu button over the top-left corner, so the bar keeps clear of it. -->
<div id="bar" hidden><b id="title"></b><button class="lbl" id="back" type="button">All games</button></div>

<section id="landing">
  <div>
    <div>
      <h1>Pokédoku</h1>
      <div class="muted small">Three Pokémon puzzles with new daily boards. Your daily scores add up to one total on the Bored leaderboard.</div>
    </div>
    <div class="today"><span>Today · <span id="date"></span></span><span><b id="total">0</b> / 2650</span></div>
    <div id="cards"></div>
  </div>
</section>

<div id="frames" hidden></div>

<script type="application/json" id="doc-doku">"\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\n\u003ctitle>Pokédoku\u003c/title>\n\u003cstyle>\n  * { margin: 0; padding: 0; box-sizing: border-box }\n  [hidden] { display: none !important }\n  body { background: #f5f2ea; color: #191713; font: 14px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;\n         display: flex; justify-content: center; padding: 16px 12px 28px }\n  main { width: min(420px, 100%); display: flex; flex-direction: column; gap: 10px }\n  .view { display: flex; flex-direction: column; gap: 10px }\n  .box { border: 1px solid #d8d2c4; background: #fffdf7; padding: 10px; display: flex; flex-direction: column; gap: 8px; border-radius: 2px }\n  h1 { font-size: 22px; font-weight: 700; letter-spacing: .02em }\n  h2 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600 }\n  .muted { color: #6b6558 }\n  .small { font-size: 12px }\n  .ball { vertical-align: -2px; flex: none }\n  #hud { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap }\n  #hud b { font-weight: 600 }\n  #grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px }\n  .hd { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-size: 11px; line-height: 1.2;\n        padding: 4px 2px; min-height: 48px; word-break: break-word; gap: 2px }\n  .hd small { font-size: 10px; color: #6b6558 }\n  .ty { display: inline-block; padding: 3px 5px; color: #fff; font-size: 11px; font-weight: 600; letter-spacing: .04em; border-radius: 2px }\n  .cell { aspect-ratio: 1; min-width: 0; border: 1px solid #d8d2c4; background: #fffdf7; color: inherit; font: inherit;\n          display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;\n          padding: 3px; cursor: pointer; position: relative; touch-action: manipulation; border-radius: 2px }\n  .cell:hover:not(:disabled), .cell.sel { border-color: #191713 }\n  .cell.sel { outline: 1px solid #191713 }\n  .cell:focus-visible { outline: 2px solid #b8402a }\n  .cell:disabled { cursor: default }\n  .cell .nm { font-size: 11px; font-weight: 600; line-height: 1.15; word-break: break-word }\n  .cell.got { color: #fff; border-color: transparent; padding: 0; overflow: hidden }\n  .cell.got .nm { position: absolute; left: 0; right: 0; bottom: 5px; padding: 2px 3px; z-index: 2; background: rgba(0,0,0,.32); font-size: 10px; text-shadow: 0 1px 1px rgba(0,0,0,.5) }\n  .cell.got .tier { position: absolute; top: 3px; right: 3px; z-index: 2; line-height: 0 }\n  .cell.got img { position: absolute; top: 6%; left: 8%; width: 84%; height: 66%; object-fit: contain; image-rendering: pixelated; filter: drop-shadow(0 1px 1px rgba(0,0,0,.3)) }\n  .cell .t2 { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; z-index: 1 }\n  .cell.miss { border-color: #b8402a }\n  .cell.open .nm { color: #6b6558; font-weight: 400 }\n  #ask { font-size: 12px }\n  #ask b { font-weight: 600 }\n  #guess { font: inherit; font-size: 16px; padding: 7px 8px; border: 1px solid #191713; background: #fff; color: #191713; width: 100%; border-radius: 2px }\n  #opts { list-style: none; display: flex; flex-direction: column }\n  #opts button { width: 100%; text-align: left; font: inherit; font-size: 13px; padding: 6px; border: 0; background: none; color: inherit;\n                 cursor: pointer; display: flex; align-items: center; gap: 6px; border-radius: 2px }\n  #opts button.on, #opts button:hover { background: #ece7da }\n  #opts button:disabled { color: #a49d8e; cursor: not-allowed }\n  #opts img { width: 24px; height: 24px; object-fit: contain; image-rendering: pixelated }\n  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center }\n  button.lbl { font: inherit; font-size: 12px; padding: 7px 10px; border: 1px solid #191713; background: none; color: inherit; cursor: pointer; border-radius: 2px }\n  button.lbl:hover { background: #ece7da }\n  button.lbl:disabled { opacity: .4; cursor: not-allowed }\n  button.lbl.big { font-size: 14px; padding: 10px 14px; font-weight: 600 }\n  #code { font: inherit; font-size: 14px; padding: 6px 8px; border: 1px solid #d8d2c4; background: #fffdf7; color: inherit; flex: 1 1 120px; min-width: 0; border-radius: 2px; text-transform: uppercase }\n  #msg, #homemsg { font-size: 12px; min-height: 1.4em }\n  .bad { color: #b8402a }\n  pre { font: inherit; font-size: 13px; white-space: pre-wrap; user-select: all }\n  #ans { display: flex; flex-direction: column; gap: 4px; font-size: 12px; max-height: 220px; overflow-y: auto }\n  #ans p { display: flex; gap: 6px; align-items: flex-start }\n  .legend { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 8px; font-size: 12px; align-items: center }\n  .legend .pts { text-align: right; font-variant-numeric: tabular-nums }\n  #dstat { font-size: 12px }\n  #mkgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; align-items: center }\n  #mkgrid select { width: 100%; min-width: 0; font: inherit; font-size: 11px; padding: 4px 2px; border: 1px solid #191713; background: #fff; color: #191713; border-radius: 2px }\n  .mkc { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 11px; border: 1px dashed #d8d2c4; border-radius: 2px; color: #6b6558 }\n  .mkc.zero { border: 1px solid #b8402a; color: #b8402a }\n  #mkcode { font-size: 22px; font-weight: 600; letter-spacing: .18em; user-select: all }\n  details { font-size: 12px; color: #6b6558 }\n  details summary { cursor: pointer; color: #191713 }\n  details ul { padding-left: 16px; margin-top: 6px }\n  @media (prefers-color-scheme: dark) {\n    body { background: #1b1a17; color: #ece7da }\n    .muted, details, .hd small { color: #a49d8e }\n    details summary { color: #ece7da }\n    .cell, .box, #code { background: #24221e; border-color: #3a372f }\n    .mkc { border-color: #3a372f; color: #a49d8e }\n    #mkgrid select { background: #1b1a17; color: #ece7da; border-color: #ece7da }\n    .cell:hover:not(:disabled), .cell.sel { border-color: #ece7da }\n    .cell.sel { outline-color: #ece7da }\n    #guess { background: #1b1a17; color: #ece7da; border-color: #ece7da }\n    button.lbl { border-color: #ece7da }\n    button.lbl:hover, #opts button.on, #opts button:hover { background: #2f2c26 }\n  }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cmain>\n  \u003c!-- Start screen -->\n  \u003csection class=\"view\" id=\"home\">\n    \u003cdiv>\n      \u003ch1>Pokédoku\u003c/h1>\n      \u003cdiv class=\"muted small\">A 3x3 grid. Name a Pokémon that fits each row and column. Rarer picks score more.\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"box\">\n      \u003ch2>Daily board · \u003cspan id=\"ddate\">\u003c/span>\u003c/h2>\n      \u003cdiv id=\"dstat\">\u003c/div>\n      \u003cdiv class=\"row\">\u003cbutton class=\"lbl big\" id=\"hdaily\" type=\"button\">Play daily\u003c/button>\u003c/div>\n      \u003cdiv class=\"muted small\">Same board for everyone today. Only the daily counts on the Bored leaderboard.\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"row\">\n      \u003cbutton class=\"lbl\" id=\"hrandom\" type=\"button\">Random board\u003c/button>\n      \u003cbutton class=\"lbl\" id=\"hmake\" type=\"button\">Make a board\u003c/button>\n    \u003c/div>\n    \u003cform class=\"row\" id=\"codeform\">\n      \u003cinput id=\"code\" autocomplete=\"off\" autocapitalize=\"characters\" spellcheck=\"false\" placeholder=\"board code\" aria-label=\"Board code\">\n      \u003cbutton class=\"lbl\" type=\"submit\">Play code\u003c/button>\n    \u003c/form>\n    \u003cdiv id=\"homemsg\" role=\"status\">\u003c/div>\n    \u003cdiv class=\"box\">\n      \u003ch2>Scoring\u003c/h2>\n      \u003cdiv class=\"small\">Every correct square is worth 50, plus a bonus for how rare your pick is. Wrong guesses still use one of your 9.\u003c/div>\n      \u003cdiv class=\"legend\" id=\"legend\">\u003c/div>\n    \u003c/div>\n    \u003cdetails>\n      \u003csummary>how to play\u003c/summary>\n      \u003cul>\n        \u003cli>Pick a square, then name a Pokémon that fits its row and its column.\u003c/li>\n        \u003cli>9 guesses. Wrong ones still cost a guess. No Pokémon twice.\u003c/li>\n        \u003cli>Rarity compares your pick with every other Pokémon that fits that square, using how well known each one is (the 2019 r/pokemon favourite poll, plus estimates for Gens VIII and IX).\u003c/li>\n        \u003cli>\"Evolved with a stone\" / \"by trade\" means that Pokémon itself evolved that way (Gengar yes, Haunter no).\u003c/li>\n        \u003cli>Legendary includes sub-legendaries. Mythical is separate.\u003c/li>\n        \u003cli>Regional forms, Megas and Gigantamax forms count as their own Pokémon with their own types. Their generation is the original Pokémon's (Alolan Raichu is Gen I).\u003c/li>\n        \u003cli>\"Has a Mega\" means the regular Pokémon (Charizard). \"Mega form\" means the Mega itself (Mega Charizard X).\u003c/li>\n        \u003cli>Make a board to pick the categories yourself. You get a 7-letter code; anyone who types it in gets your board.\u003c/li>\n      \u003c/ul>\n    \u003c/details>\n  \u003c/section>\n\n  \u003c!-- Game -->\n  \u003csection class=\"view\" id=\"play\" hidden>\n    \u003cdiv id=\"hud\">\u003cspan id=\"hudl\">\u003c/span>\u003cspan id=\"hudr\">\u003c/span>\u003c/div>\n    \u003cdiv id=\"grid\" aria-label=\"Pokédoku board\">\u003c/div>\n    \u003csection class=\"box\">\n      \u003cdiv id=\"ask\">\u003c/div>\n      \u003cinput id=\"guess\" type=\"text\" placeholder=\"type a Pokémon\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"Pokémon name\">\n      \u003cul id=\"opts\">\u003c/ul>\n      \u003cdiv id=\"msg\" role=\"status\">\u003c/div>\n      \u003cpre id=\"share\" hidden>\u003c/pre>\n      \u003cdiv id=\"ans\" hidden>\u003c/div>\n    \u003c/section>\n    \u003cdiv class=\"row\">\n      \u003cbutton class=\"lbl\" id=\"menu\" type=\"button\">Menu\u003c/button>\n      \u003cbutton class=\"lbl\" id=\"again\" type=\"button\">New random board\u003c/button>\n      \u003cbutton class=\"lbl\" id=\"giveup\" type=\"button\">Give up\u003c/button>\n      \u003cbutton class=\"lbl\" id=\"copy\" type=\"button\">Copy result\u003c/button>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- Board maker -->\n  \u003csection class=\"view box\" id=\"maker\" hidden>\n    \u003ch2>Make a board\u003c/h2>\n    \u003cdiv class=\"muted small\">Pick 3 rows and 3 columns. Each square shows how many Pokémon fit.\u003c/div>\n    \u003cdiv id=\"mkgrid\">\u003c/div>\n    \u003cdiv id=\"mkmsg\" role=\"status\" class=\"small\">\u003c/div>\n    \u003cdiv class=\"row\">\n      \u003cbutton class=\"lbl\" id=\"mkmake\" type=\"button\">Get code\u003c/button>\n      \u003cbutton class=\"lbl\" id=\"mkcancel\" type=\"button\">Menu\u003c/button>\n    \u003c/div>\n    \u003cdiv id=\"mkout\" hidden>\n      \u003cdiv class=\"muted small\">Your code. Friends type it in the board code box.\u003c/div>\n      \u003cdiv id=\"mkcode\">\u003c/div>\n      \u003cdiv class=\"row\">\n        \u003cbutton class=\"lbl\" id=\"mkcopy\" type=\"button\">Copy code\u003c/button>\n        \u003cbutton class=\"lbl\" id=\"mkplay\" type=\"button\">Play it\u003c/button>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\u003c/main>\n\u003cscript>\n// ── Shared Pokémon core (Pokédoku + Shiny Hunt). Generated into both game files by build.mjs. ──\nconst RAW = [[\"Bulbasaur\",1,\"Grass/Poison\",\"first starter\",1,\"\",998,4,69],[\"Ivysaur\",2,\"Grass/Poison\",\"starter\",2,\"\",912,4,130],[\"Venusaur\",3,\"Grass/Poison\",\"mega final starter\",3,\"\",944,4,1000],[\"Charmander\",4,\"Fire\",\"first   const take = (i, seen) => { for (const m of cells[i]) { if (seen.has(m.name)) continue; seen.add(m.name); if (!owner.has(m.name) || take(owner.get(m.name), seen)) { owner.set(m.name, i); return true; } } return false; };\n  return cells.every((_, i) => take(i, new Set()));\n}\nfunction checkCustom(rows, cols) {\n  const all = [...rows, ...cols];\n  if (all.some(c => !CATS[c])) return \"Pick all 6 categories.\";\n  if (new Set(all).size \u003c 6) return \"Each category can only be used once.\";\n  const ans = answers(rows, cols);\n  for (let r = 0; r \u003c 3; r++) for (let c = 0; c \u003c 3; c++)\n    if (!ans[r][c].length) return `No Pokémon is ${CATS[rows[r]].label} and ${CATS[cols[c]].label}.`;\n  if (!solvable(ans)) return \"Some squares share their only answers, so nobody could fill all 9.\";\n  return \"\";\n}\n\nlet B, S, sel = -1, opts = [], hi = 0;\nconst fresh = () => ({ cells: Array(9).fill(null), left: 9, over: false, gaveUp: false });\nconst show = id => [\"home\", \"play\", \"maker\"].forEach(v => $(\"#\" + v).hidden = v !== id);\nfunction note(text, bad) { $(\"#msg\").textContent = text; $(\"#msg\").className = bad ? \"bad\" : \"\"; }\nfunction homeNote(text, bad) { $(\"#homemsg\").textContent = text; $(\"#homemsg\").className = bad ? \"bad\" : \"\"; }\n\n// id is a seed number (daily/random boards) or a 7-letter custom code.\nfunction boardFor(id) {\n  if (typeof id === \"string\") {\n    const d = decode(id);\n    if (!d || checkCustom(d.rows, d.cols)) return null;\n    return { code: id, id, rows: d.rows, cols: d.cols, ans: answers(d.rows, d.cols) };\n  }\n  const b = makeBoard(Number(id) >>> 0, oldDaily(Number(id) >>> 0)); b.id = b.seed; return b;\n}\nfunction load(id) {\n  const b = boardFor(id);\n  if (!b) { show(\"home\"); homeNote(\"That code doesn't match a board. Check the letters.\", true); return false; }\n  B = b;\n  S = read(\"v2s\" + B.id) || fresh();\n  write(\"last\", B.id);\n  sel = -1; note(\"\");\n  show(\"play\"); render();\n  return true;\n}\nconst save = () => { write(\"v2s\" + B.id, S); if (isDaily()) report(\"doku\", points(), S.over); };\nconst isDaily = () => !B.code && B.seed === TODAY.seed;\nconst boardName = () => B.code ? \"custom \" + B.code : isDaily() ? \"daily \" + TODAY.date : \"board \" + B.seed;\nconst filled = (st = S) => st.cells.filter(Boolean).length;\nconst monOf = name => MONS.find(x => x.name === name);\nconst cellTier = (b, st, i) => st.cells[i] ? tierFor(monOf(st.cells[i]), b.ans[Math.floor(i/3)][i%3]) : null;\nconst points = (b = B, st = S) => st.cells.reduce((s, n, i) => n ? s + 50 + cellTier(b, st, i).pts : s, 0);\n\nfunction head(id) {\n  const c = CATS[id];\n  if (c.kind === \"type\") return `\u003cspan class=\"ty\" style=\"background:${TC[c.label]}\">${c.label.toUpperCase()}\u003c/span>`;\n  return c.range ? `${c.label}\u003csmall>${c.range}\u003c/small>` : c.label;\n}\nfunction render() {\n  $(\"#hudl\").textContent = boardName();\n  $(\"#hudr\").innerHTML = `score \u003cb>${points()}\u003c/b> · ${filled()}/9 · guesses \u003cb>${S.left}\u003c/b>`;\n  const g = $(\"#grid\"); g.innerHTML = \"\u003cdiv>\u003c/div>\";\n  B.cols.forEach(c => g.insertAdjacentHTML(\"beforeend\", `\u003cdiv class=\"hd\">${head(c)}\u003c/div>`));\n  for (let r = 0; r \u003c 3; r++) {\n    g.insertAdjacentHTML(\"beforeend\", `\u003cdiv class=\"hd\">${head(B.rows[r])}\u003c/div>`);\n    for (let c = 0; c \u003c 3; c++) {\n      const i = r*3 + c, b = document.createElement(\"button\"), m = S.cells[i] && monOf(S.cells[i]), n = B.ans[r][c].length;\n      b.type = \"button\"; b.className = \"cell\"; b.id = \"c\" + i;\n      if (m) {\n        const t = cellTier(B, S, i);\n        b.classList.add(\"got\"); b.style.background = TC[m.types[0]];\n        b.innerHTML = `\u003cimg src=\"${sprite(m.img)}\" alt=\"\" loading=\"lazy\">\u003cspan class=\"tier\" title=\"${t.name}\">${ball(t, 15)}\u003c/span>\u003cspan class=\"nm\">${esc(m.name)}\u003c/span>` + (m.types[1] ? `\u003cspan class=\"t2\" style=\"background:${TC[m.types[1]]}\">\u003c/span>` : \"\");\n        b.setAttribute(\"aria-label\", `${m.name}, ${t.name}`);\n      } else if (S.over) {\n        b.classList.add(\"open\"); b.innerHTML = `\u003cspan class=\"nm\">${n} fit\u003c/span>`;\n      } else {\n        b.innerHTML = `\u003cspan class=\"nm muted\">+\u003c/span>`;\n        b.setAttribute(\"aria-label\", catText(B.rows[r]) + \" and \" + catText(B.cols[c]));\n      }\n      if (i === sel) b.classList.add(\"sel\");\n      b.onclick = () => choose(i);\n      if (!S.over && m) b.disabled = true;\n      g.appendChild(b);\n    }\n  }\n  const playing = !S.over;\n  $(\"#guess\").hidden = !playing; $(\"#opts\").hidden = !playing;\n  $(\"#giveup\").hidden = !playing;\n  $(\"#share\").hidden = playing; $(\"#copy\").hidden = playing;\n  $(\"#again\").hidden = playing || !!B.code || isDaily();\n  if (playing) {\n    $(\"#ask\").innerHTML = sel \u003c 0 ? \"Pick a square.\" : `\u003cb>${esc(catText(B.rows[Math.floor(sel/3)]))}\u003c/b> + \u003cb>${esc(catText(B.cols[sel%3]))}\u003c/b>`;\n    $(\"#guess\").disabled = sel \u003c 0;\n  } else {\n    $(\"#ask\").innerHTML = `\u003cb>${points()} points.\u003c/b> ` + (filled() === 9 ? \"Full board.\" : S.gaveUp ? \"Gave up.\" : \"Out of guesses.\") + \" Tap a square to see what fit.\";\n    $(\"#share\").textContent = shareText();\n    if (sel \u003c 0) $(\"#ans\").hidden = true;\n  }\n}\nfunction choose(i) {\n  sel = i;\n  if (S.over) { showAnswers(i); render(); return; }\n  render();\n  $(\"#guess\").value = \"\"; opts = []; $(\"#opts\").innerHTML = \"\";\n  $(\"#guess\").focus();\n}\nfunction showAnswers(i) {\n  const list = B.ans[Math.floor(i/3)][i%3];\n  const groups = TIERS.map(t => [t, byFame(list).filter(m => tierFor(m, list) === t)]).filter(([, l]) => l.length);\n  $(\"#ans\").hidden = false;\n  $(\"#ans\").innerHTML = `\u003cb>${list.length} fit\u003c/b>` + groups.map(([t, l]) => `\u003cp>${ball(t)}\u003cspan>\u003cb>${t.name}:\u003c/b> ${l.map(m => esc(m.name)).join(\", \")}\u003c/span>\u003c/p>`).join(\"\");\n}\nfunction paint() {\n  const ul = $(\"#opts\"); ul.innerHTML = \"\";\n  opts.forEach((m, i) => {\n    const used = S.cells.includes(m.name), li = document.createElement(\"li\"), b = document.createElement(\"button\");\n    b.type = \"button\"; b.disabled = used;\n    b.innerHTML = `\u003cimg src=\"${sprite(m.img)}\" alt=\"\" loading=\"lazy\">\u003cspan>${esc(m.name)}${used ? \" (used)\" : \"\"}\u003c/span>`;\n    if (i === hi) b.classList.add(\"on\");\n    b.onclick = () => submit(m);\n    li.appendChild(b); ul.appendChild(li);\n  });\n  if ($(\"#guess\").value.trim() && !opts.length) ul.innerHTML = `\u003cli class=\"muted\" style=\"padding:6px\">no Pokémon by that name\u003c/li>`;\n}\nfunction submit(m) {\n  if (sel \u003c 0 || S.over || S.cells.includes(m.name)) return;\n  const i = sel, r = Math.floor(i/3), c = i % 3, ok = CATS[B.rows[r]].test(m) && CATS[B.cols[c]].test(m);\n  S.left--;\n  if (ok) { S.cells[i] = m.name; sel = -1; }\n  if (S.left \u003c= 0 || filled() === 9) S.over = true;\n  save();\n  if (ok) { const t = tierFor(m, B.ans[r][c]); note(`${m.name} fits. ${t.name}, +${50 + t.pts}.`); }\n  else note(m.name + \" doesn't fit there.\", true);\n  $(\"#guess\").value = \"\"; opts = []; $(\"#opts\").innerHTML = \"\";\n  if (S.over) sel = -1;\n  render();\n  if (!ok && !S.over) { $(\"#c\" + i).classList.add(\"miss\"); $(\"#guess\").focus(); }\n}\nfunction shareText() {\n  const L = { poke: \"P\", great: \"G\", ultra: \"U\", master: \"M\", shiny: \"S\" };\n  let grid = \"\";\n  for (let r = 0; r \u003c 3; r++) { for (let c = 0; c \u003c 3; c++) { const t = cellTier(B, S, r*3+c); grid += t ? L[t.id] : \"·\"; } grid += \"\\n\"; }\n  const head = B.code ? `Pokédoku custom · code ${B.code}` : `Pokédoku ${isDaily() ? \"daily \" + TODAY.date : \"board\"} · code ${B.seed}`;\n  return `${head}\\n${points()} points · ${filled()}/9\\n${grid}P Poké  G Great  U Ultra  M Master  S Shiny`;\n}\n\n// Start screen\nfunction renderHome() {\n  $(\"#ddate\").textContent = TODAY.date;\n  const st = read(\"v2s\" + TODAY.seed);\n  if (!st || (!filled(st) && st.left === 9)) { $(\"#dstat\").textContent = \"Not played yet.\"; $(\"#hdaily\").textContent = \"Play daily\"; }\n  else {\n    const b = boardFor(TODAY.seed), pts = points(b, st);\n    $(\"#dstat\").innerHTML = st.over ? `Done: \u003cb>${pts} points\u003c/b>, ${filled(st)}/9.` : `In progress: ${pts} points, ${filled(st)}/9, ${st.left} guesses left.`;\n    $(\"#hdaily\").textContent = st.over ? \"See daily board\" : \"Continue daily\";\n  }\n  $(\"#legend\").innerHTML = TIERS.map(t => `${ball(t, 16)}\u003cspan>${t.name}\u003c/span>\u003cspan class=\"pts\">+${t.pts}\u003c/span>`).join(\"\");\n  show(\"home\");\n}\n$(\"#hdaily\").onclick = () => load(TODAY.seed);\n$(\"#hrandom\").onclick = () => load(Math.floor(Math.random() * 4294967295) + 1);\n$(\"#again\").onclick = () => load(Math.floor(Math.random() * 4294967295) + 1);\n$(\"#menu\").onclick = renderHome;\n$(\"#giveup\").onclick = () => { S.over = true; S.gaveUp = true; sel = -1; save(); note(\"\"); $(\"#opts\").innerHTML = \"\"; render(); };\n$(\"#copy\").onclick = async () => {\n  try { await navigator.clipboard.writeText(shareText()); note(\"Copied.\"); }\n  catch { note(\"Copy blocked here. Select the text above and copy it.\"); }\n};\n$(\"#codeform\").onsubmit = e => {\n  e.preventDefault();\n  const raw = $(\"#code\").value.toUpperCase().replace(/[^A-Z0-9]/g, \"\");\n  homeNote(\"\");\n  if (/^[A-Z]{7}$/.test(raw)) { if (load(raw)) $(\"#code\").value = \"\"; }\n  else if (/^\\d+$/.test(raw) && +raw > 0 && +raw \u003c= 4294967295) { $(\"#code\").value = \"\"; load(+raw); }\n  else homeNote(\"Codes are 7 letters (made boards) or a number (random boards).\", true);\n};\n$(\"#guess\").addEventListener(\"input\", e => { hi = 0; opts = suggestions(e.target.value); paint(); });\n$(\"#guess\").addEventListener(\"keydown\", e => {\n  if (e.key === \"ArrowDown\") { hi = Math.min(hi + 1, opts.length - 1); paint(); e.preventDefault(); }\n  else if (e.key === \"ArrowUp\") { hi = Math.max(hi - 1, 0); paint(); e.preventDefault(); }\n  else if (e.key === \"Enter\") { e.preventDefault(); if (opts[hi]) submit(opts[hi]); }\n});\n\n// Board maker: header selects in the same 4x4 shape as the game, live counts per square.\nconst GROUPS = [[\"Type\", IDS.filter(c => CATS[c].fam === \"type\")], [\"Generation\", IDS.filter(c => CATS[c].fam === \"gen\")], [\"Other\", IDS.filter(c => ![\"type\", \"gen\"].includes(CATS[c].fam))]];\nconst pickHtml = (id, label) => `\u003cselect id=\"${id}\" aria-label=\"${label}\">\u003coption value=\"\">pick\u003c/option>${GROUPS.map(([g, ids]) => `\u003coptgroup label=\"${g}\">${ids.map(c => `\u003coption value=\"${c}\">${esc(catText(c))}\u003c/option>`).join(\"\")}\u003c/optgroup>`).join(\"\")}\u003c/select>`;\n(() => {\n  let h = \"\u003cdiv>\u003c/div>\";\n  for (let c = 0; c \u003c 3; c++) h += pickHtml(\"mkc\" + c, \"Column \" + (c + 1));\n  for (let r = 0; r \u003c 3; r++) { h += pickHtml(\"mkr\" + r, \"Row \" + (r + 1)); for (let c = 0; c \u003c 3; c++) h += `\u003cdiv class=\"mkc\" id=\"mkn${r}${c}\">\u003c/div>`; }\n  $(\"#mkgrid\").innerHTML = h;\n  $(\"#mkgrid\").addEventListener(\"change\", mkUpdate);\n})();\nconst mkPicks = () => ({ rows: [0, 1, 2].map(r => $(\"#mkr\" + r).value), cols: [0, 1, 2].map(c => $(\"#mkc\" + c).value) });\nfunction mkUpdate() {\n  const { rows, cols } = mkPicks();\n  for (let r = 0; r \u003c 3; r++) for (let c = 0; c \u003c 3; c++) {\n    const el = $(`#mkn${r}${c}`), n = rows[r] && cols[c] && rows[r] !== cols[c] ? fits(rows[r], cols[c]).length : null;\n    el.textContent = n === null ? \"\" : n + \" fit\"; el.classList.toggle(\"zero\", n === 0);\n  }\n  const err = checkCustom(rows, cols);\n  $(\"#mkmsg\").textContent = err; $(\"#mkmsg\").className = \"small\" + (err ? \" bad\" : \"\");\n  $(\"#mkmake\").disabled = !!err;\n  $(\"#mkout\").hidden = true;\n}\nfunction openMaker() {\n }\n  details summary { cursor: pointer; color: #191713 }\n  details ul { padding-left: 16px; margin-top: 6px }\n  @media (prefers-color-scheme: dark) {\n    body { background: #1b1a17; color: #ece7da }\n    .muted, details, .slot small, .group h3 { color: #a49d8e }\n    details summary { color: #ece7da }\n    .box, .tile { background: #24221e; border-color: #3a372f }\n    .tile.lit { border-color: #ece7da }\n    .slot, .chip:not(.type), button.lbl { border-color: #ece7da }\n    .slot.sel { outline-color: #ece7da }\n    .slot:hover:not(:disabled), .chip:hover:not(:disabled), button.lbl:hover { background: #2f2c26 }\n  }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cmain>\n  \u003csection class=\"view\" id=\"home\">\n    \u003cdiv>\n      \u003ch1>Inverse Doku\u003c/h1>\n      \u003cdiv class=\"muted small\">Pokédoku backwards. The 9 Pokémon are already on the board. Work out the 3 row and 3 column categories they share.\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"box\">\n      \u003ch2>Daily board · \u003cspan id=\"ddate\">\u003c/span>\u003c/h2>\n      \u003cdiv id=\"dstat\" class=\"small\">\u003c/div>\n      \u003cdiv class=\"row\">\u003cbutton class=\"lbl big\" id=\"hdaily\" type=\"button\">Play daily\u003c/button>\u003c/div>\n      \u003cdiv class=\"muted small\">Same board for everyone today. Only the daily counts on the Bored leaderboard.\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"row\">\u003cbutton class=\"lbl\" id=\"hrandom\" type=\"button\">Random board\u003c/button>\u003c/div>\n    \u003cdiv class=\"box\">\n      \u003ch2>Scoring\u003c/h2>\n      \u003cdiv class=\"small\">You get 6 guesses, one per header, so every miss costs you a category. 100 for each category you find.\u003c/div>\n    \u003c/div>\n    \u003cdetails>\n      \u003csummary>how to play\u003c/summary>\n      \u003cul>\n        \u003cli>Tap a \"?\" header, then tap a category. It's right if all three Pokémon in that row or column fit it.\u003c/li>\n        \u003cli>Any category all three share counts, even if it isn't the one the board was built from.\u003c/li>\n        \u003cli>Every guess uses one of your 6. A wrong one tells you a Pokémon that doesn't fit.\u003c/li>\n        \u003cli>Categories work like Pokédoku: forms count with their own types, and \"Evolved with a stone\" means that Pokémon itself evolved that way.\u003c/li>\n      \u003c/ul>\n    \u003c/details>\n  \u003c/section>\n\n  \u003csection class=\"view\" id=\"play\" hidden>\n    \u003cdiv id=\"hud\">\u003cspan id=\"hudl\">\u003c/span>\u003cspan id=\"hudr\">\u003c/span>\u003c/div>\n    \u003cdiv id=\"grid\" aria-label=\"Inverse Doku board\">\u003c/div>\n    \u003csection class=\"box\">\n      \u003cdiv id=\"ask\">\u003c/div>\n      \u003cdiv id=\"msg\" role=\"status\">\u003c/div>\n      \u003cdiv id=\"picker\">\u003c/div>\n      \u003cpre id=\"share\" hidden>\u003c/pre>\n    \u003c/section>\n    \u003cdiv class=\"row\">\n      \u003cbutton class=\"lbl\" id=\"menu\" type=\"button\">Menu\u003c/button>\n      \u003cbutton class=\"lbl\" id=\"again\" type=\"button\">New random board\u003c/button>\n      \u003cbutton class=\"lbl\" id=\"giveup\" type=\"button\">Give up\u003c/button>\n      \u003cbutton class=\"lbl\" id=\"copy\" type=\"button\">Copy result\u003c/button>\n    \u003c/div>\n  \u003c/section>\n\u003c/main>\n\u003cscript>\n// ── Shared Pokémon core (Pokédoku + Shiny Hunt). Generated into both game files by build.mjs. ──\nconst RAW = [[\"Bulbasaur\",1,\"Grass/Poison\",\"first starter\",1,\"\",998,4,69],[\"Ivysaur\",2,\"Grass/Poison\",\"starter\",2,\"\",912,4,130],[\"Venusaur\",3,\"Grass/Poison\",\"mega final starter\",3,\"\",944,4,1000],[\"Charmander\",4,\"Fire\",\"first starter\",4,\"\",987,7,85],[\"Charmeleon\",5,\"Fire\",\"starter\",5,\"\",898,7,190],[\"Charizard\",6,\"Fire/Flying\",\"mega final starter\",6,\"\",1000,7,905],[\"Squirtle\",7,\"Water\",\"first starter\",7,\"\",995,1,90],[\"Wartortle\",8,\"Water\",\"starter\",8,\"\",946,1,225],[\"Blastoise\",9,\"Water inverse-doku.\";\nconst read = k => { try { return JSON.parse(localStorage.getItem(STORE + k)); } catch { return null; } };\nconst write = (k, v) => { try { localStorage.setItem(STORE + k, JSON.stringify(v)); } catch {} };\nconst GUESSES = 6, SLOTS = [\"c0\", \"c1\", \"c2\", \"r0\", \"r1\", \"r2\"];\n\n// A normal Pokédoku board from a different seed, then one well-known Pokémon per square.\nfunction inverseBoard(seed) {\n  const b = makeBoard((seed ^ 0x5bd1e995) >>> 0, oldDaily(seed)), r = rng(seed + 17), used = new Set();\n  b.seed = seed;\n  b.mons = b.ans.map(row => row.map(list => {\n    const open = byFame(list).filter(m => !used.has(m.num));\n    const pool = open.slice(0, Math.max(1, Math.ceil(open.length / 2)));\n    const m = pool[Math.floor(r() * pool.length)] || byFame(list)[0];\n    used.add(m.num); return m;\n  }));\n  return b;\n}\nconst trio = slot => slot[0] === \"r\" ? B.mons[+slot[1]] : B.mons.map(row => row[+slot[1]]);\nconst intended = slot => slot[0] === \"r\" ? B.rows[+slot[1]] : B.cols[+slot[1]];\nconst slotName = slot => (slot[0] === \"r\" ? \"row \" : \"column \") + (+slot[1] + 1);\n\nlet B, S, sel = null;\nconst fresh = () => ({ found: {}, tried: {}, left: GUESSES, over: false, gaveUp: false });\nconst show = id => [\"home\", \"play\"].forEach(v => $(\"#\" + v).hidden = v !== id);\nconst isDaily = () => B.seed === TODAY.seed;\nconst nFound = (st = S) => Object.keys(st.found).length;\nconst points = (st = S) => nFound(st) * 100;\nconst save = () => { write(\"s\" + B.seed, S); if (isDaily()) report(\"inverse\", points(), S.over); };\nfunction note(t, bad) { $(\"#msg\").textContent = t; $(\"#msg\").className = bad ? \"bad\" : \"\"; }\n\nfunction load(seed) {\n  B = inverseBoard(seed);\n  S = read(\"s\" + seed) || fresh();\n  sel = S.over ? null : SLOTS.find(s => !S.found[s]);\n  note(\"\"); show(\"play\"); render();\n}\nfunction label(id) {\n  const c = CATS[id];\n  if (c.kind === \"type\") return `\u003cspan class=\"ty\" style=\"background:${TC[c.label]}\">${c.label.toUpperCase()}\u003c/span>`;\n  return c.range ? `${c.label}\u003csmall>${c.range}\u003c/small>` : esc(c.label);\n}\nfunction slotHtml(slot) {\n  const f = S.found[slot];\n  const b = document.createElement(\"button\");\n  b.type = \"button\"; b.className = \"slot\"; b.id = \"s\" + slot;\n  if (f) { b.classList.add(\"found\"); b.innerHTML = label(f); b.disabled = true; }\n  else if (S.over) { b.classList.add(\"missed\"); b.innerHTML = label(intended(slot)); b.disabled = true; }\n  else { b.innerHTML = `\u003cspan class=\"q\">?\u003c/span>\u003csmall>${slotName(slot)}\u003c/small>`; b.onclick = () => { sel = slot; note(\"\"); render(); }; }\n  if (slot === sel) b.classList.add(\"sel\");\n  b.setAttribute(\"aria-label\", f ? `${slotName(slot)}: ${CATS[f].label}` : `Guess ${slotName(slot)}`);\n  return b;\n}\nfunction render() {\n  $(\"#hudl\").textContent = isDaily() ? \"daily \" + TODAY.date : \"board \" + B.seed;\n  $(\"#hudr\").innerHTML = `score \u003cb>${points()}\u003c/b> · ${nFound()}/6 · guesses \u003cb>${S.left}\u003c/b>`;\n  const g = $(\"#grid\"); g.innerHTML = \"\u003cdiv>\u003c/div>\";\n  [\"c0\", \"c1\", \"c2\"].forEach(s => g.appendChild(slotHtml(s)));\n  for (let r = 0; r \u003c 3; r++) {\n    g.appendChild(slotHtml(\"r\" + r));\n    for (let c = 0; c \u003c 3; c++) {\n      const m = B.mons[r][c], d = document.createElement(\"div\");\n      d.className = \"tile\" + (sel && (sel === \"r\" + r || sel === \"c\" + c) ? \" lit\" : \"\");\n      d.innerHTML = `\u003cimg src=\"${sprite(m.img)}\" alt=\"\">\u003cspan>${esc(m.name)}\u003c/span>`;\n      g.appendChild(d);\n    }\n  }\n  $(\"#giveup\").hidden = S.over; $(\"#copy\").hidden = !S.over; $(\"#share\").hidden = !S.over;\n  $(\"#again\").hidden = !S.over || isDaily();\n  if (S.over) {\n    $(\"#ask\").innerHTML = `\u003cb>${points()} points.\u003c/b> ` + (nFound() === 6 ? \"Solved.\" : S.gaveUp ? \"Gave up.\" : \"Out of guesses.\") + \" Red headers show what the board was built from.\";\n    $(\"#picker\").innerHTML = \"\"; $(\"#share\").textContent = shareText();\n    return;\n  }\n  $(\"#ask\").innerHTML = sel ? `What do the 3 Pokémon in \u003cb>${slotName(sel)}\u003c/b> share?` : \"Tap a ? header.\";\n  picker();\n}\nfunction picker() {\n  const usedCats = new Set(Object.values(S.found)), tried = new Set(S.tried[sel] || []);\n  const groups = [[\"Type\", IDS.filter(c => CATS[c].fam === \"type\")], [\"Generation\", IDS.filter(c => CATS[c].fam === \"gen\")], [\"Other\", IDS.filter(c => ![\"type\", \"gen\"].includes(CATS[c].fam))]];\n  $(\"#picker\").innerHTML = sel ? groups.map(([name, ids]) => `\u003cdiv class=\"group\">\u003ch3>${name}\u003c/h3>\u003cdiv class=\"chips\">${ids.map(c => {\n    const t = CATS[c].kind === \"type\", off = usedCats.has(c) || tried.has(c);\n    return `\u003cbutton type=\"button\" class=\"chip${t ? \" type\" : \"\"}${usedCats.has(c) ? \" used\" : \"\"}\" data-c=\"${c}\"${t ? ` style=\"background:${TC[CATS[c].label]}\"` : \"\"}${off ? \" disabled\" : \"\"}>${esc(catText(c))}\u003c/button>`;\n  }).join(\"\")}\u003c/div>\u003c/div>`).join(\"\") : \"\";\n  $(\"#picker\").querySelectorAll(\".chip\").forEach(b => b.onclick = () => guess(b.dataset.c));\n}\nfunction guess(c) {\n  if (!sel || S.over || S.found[sel]) return;\n  const three = trio(sel), miss = three.find(m => !CATS[c].test(m));\n  S.left--;\n  if (!miss) {\n    S.found[sel] = c;\n    note(`Yes: ${slotName(sel)} is ${catText(c)}.`);\n    sel = SLOTS.find(s => !S.found[s]) || null;\n  } else {\n    (S.tried[sel] = S.tried[sel] || []).push(c);\n    note(`No: ${miss.name} isn't ${catText(c)}.`, true);\n  }\n  if (nFound() === 6 || S.left \u003c= 0) { S.over = true; sel = null; }\n  save(); render();\n}\nfunction shareText() {\n  const mark = s => S.found[s] ? \"■\" : \"□\";\n  return `Inverse Doku ${isDaily() ? \"daily \" + TODAY.date : \"board \" + B.seed}\\n${points()} points · ${nFound()}/6 · ${GUESSES - S.left}/6 guesses\\ncols ${[\"c0\",\"c1\",\"c2\"].map(mark).join(\"\")}  rows ${[\"r0\",\"r1\",\"r2\"].map(mark).join(\"\")}`;\n}\nfunction renderHome() {\n  $(\"#ddate\").textContent = TODAY.date;\n  const st = read(\"s\" + TODAY.seed);\n  if (!st || (!nFound(st) && st.left === GUESSES)) { $(\"#dstat\").textContent = \"Not played yet.\"; $(\"#hdaily\").textContent = \"Play daily\"; }\n  else if (st.over) { $(\"#dstat\").innerHTML = `Done: \u003cb>${points(st)} points\u003c/b>, ${nFound(st)}/6.`; $(\"#hdaily\").textContent = \"See daily board\"; }\n  else { $(\"#dstat\").textContent = `In progress: ${nFound(st)}/6, ${st.left} guesses left.`; $(\"#hdaily\").textContent = \"Continue daily\"; }\n  show(\"home\");\n}\n$(\"#hdaily\").onclick = () => load(TODAY.seed);\n$(\"#hrandom\").onclick = () => load(Math.floor(Math.random() * 4294967295) + 1);\n$(\"#again\").onclick = () => load(Math.floor(Math.random() * 4294967295) + 1);\n$(\"#menu\").onclick = renderHome;\n$(\"#giveup\").onclick = () => { S.over = true; S.gaveUp = true; sel = null; save(); note(\"\"); render(); };\n$(\"#copy\").onclick = async () => {\n  try { await navigator.clipboard.writeText(shareText()); note(\"Copied.\"); }\n  catch { note(\"Copy blocked here. Select the text above and copy it.\"); }\n};\nrenderHome();\n\n// The hub reads this: integer metrics, the current run, never null. Only the daily scores.\nwindow.__boredSnapshot = () => ({ slug: 'inverse-doku', points: S ? points() : 0, found: S ? nFound() : 0, finished: !!(S && S.over), daily: !!(B && isDaily()) });\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"</script>
<script type="application/json" id="doc-shiny">"\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\n\u003ctitle>Shiny Hunt\u003c/title>\n\u003cstyle>\n  * { margin: 0; padding: 0; box-sizing: border-box }\n  [hidden] { display: none !important }\n  body { background: #f5f2ea; color: #191713; font: 14px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;\n         display: flex; justify-content: center; padding: 16px 12px 28px }\n  main { width: min(420px, 100%); display: flex; flex-direction: column; gap: 10px }\n  .view { display: flex; flex-direction: column; gap: 10px }\n  .box { border: 1px solid #d8d2c4; background: #fffdf7; padding: 12px; display: flex; flex-direction: column; gap: 8px; border-radius: 2px }\n  h1 { font-size: 22px; font-weight: 700; letter-spacing: .02em }\n  h2 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600 }\n  .muted { color: #6b6558 }\n  .small { font-size: 12px }\n  .bad { color: #b8402a }\n  .ball { vertical-align: -2px; flex: none }\n  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center }\n  button.lbl { font: inherit; font-size: 12px; padding: 7px 10px; border: 1px solid #191713; background: none; color: inherit; cursor: pointer; border-radius: 2px }\n  button.lbl:hover { background: #ece7da }\n  button.lbl.big { font-size: 14px; padding: 10px 14px; font-weight: 600 }\n  .hud { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; display: flex; justify-content: space-between; gap: 8px }\n  .hud b { font-weight: 600 }\n  #prompt { font-size: 18px; font-weight: 600; line-height: 1.3; text-wrap: balance }\n  #timer { height: 6px; background: #ece7da; border-radius: 2px; overflow: hidden }\n  #timer i { display: block; height: 100%; width: 100%; background: #191713; transform-origin: left; }\n  #timer.low i { background: #b8402a }\n  #secs { font-variant-numeric: tabular-nums }\n  #guess { font: inherit; font-size: 16px; padding: 9px 10px; border: 1px solid #191713; background: #fff; color: #191713; width: 100%; border-radius: 2px }\n  #reads { font-size: 12px; min-height: 1.4em; color: #6b6558 }\n  .pick { display: flex; gap: 12px; align-items: center }\n  .pick img { width: 80px; height: 80px; object-fit: contain; image-rendering: pixelated; flex: none }\n  .pick .none { width: 80px; height: 80px; display: grid; place-items: center; border: 1px dashed #d8d2c4; color: #6b6558; flex: none; font-size: 12px }\n  .pick b { font-size: 16px }\n  .tierline { display: flex; gap: 6px; align-items: center; font-weight: 600 }\n  .list { font-size: 12px }\n  .list p { display: flex; gap: 6px; align-items: flex-start; padding: 2px 0 }\n  .res { display: grid; grid-template-columns: auto 1fr auto; gap: 6px 8px; align-items: center; font-size: 12px }\n  .res .pts { text-align: right; font-variant-numeric: tabular-nums }\n  .res .q { color: #6b6558; font-size: 11px }\n  #total { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums }\n  pre { font: inherit; font-size: 13px; white-space: pre-wrap; user-select: all }\n  .legend { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 8px; font-size: 12px; align-items: center }\n  .legend .pts { text-align: right; font-variant-numeric: tabular-nums }\n  details { font-size: 12px; color: #6b6558 }\n  details summary { cursor: pointer; color: #191713 }\n  details ul { padding-left: 16px; margin-top: 6px }\n  @media (prefers-reduced-motion: reduce) { #timer i { transition: none !important } }\n  @media (prefers-color-scheme: dark) {\n    body { background: #1b1a17; color: #ece7da }\n    .muted, details, #reads, .res .q { color: #a49d8e }\n    details summary { color: #ece7da }\n    .box { background: #24221e; border-color: #3a372f }\n    .pick .none { border-color: #3a372f; color: #a49d8e }\n    #timer { background: #3a372f } #timer i { background: #ece7da }\n    #guess { background: #1b1a17; color: #ece7da; border-color: #ece7da }\n    button.lbl { border-color: #ece7da }\n    button.lbl:hover { background: #2f2c26 }\n  }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cmain>\n  \u003csection class=\"view\" id=\"home\">\n    \u003cdiv>\n      \u003ch1>Shiny Hunt\u003c/h1>\n      \u003cdiv class=\"muted small\">Seven prompts. Twenty-five seconds each. Name one Pokémon that fits. The fewer people who'd think of it, the shinier your ball.\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"box\">\n      \u003ch2>Today's hunt · \u003cspan id=\"ddate\">\u003c/span>\u003c/h2>\n      \u003cdiv id=\"dstat\" class=\"small\">\u003c/div>\n      \u003cdiv class=\"row\">\u003cbutton class=\"lbl big\" id=\"hdaily\" type=\"button\">Start today's hunt\u003c/button>\u003c/div>\n      \u003cdiv class=\"muted small\">Same 7 prompts for everyone today. One try. Only the daily counts on the Bored leaderboard.\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"row\">\u003cbutton class=\"lbl\" id=\"hpractice\" type=\"button\">Practice run\u003c/button>\u003c/div>\n    \u003cdiv class=\"box\">\n      \u003ch2>Rarity\u003c/h2>\n      \u003cdiv class=\"legend\" id=\"legend\">\u003c/div>\n      \u003cdiv class=\"muted small\">Wrong answers cost nothing; keep guessing until the timer runs out. Running out scores 0.\u003c/div>\n    \u003c/div>\n    \u003cdetails>\n      \u003csummary>how to play\u003c/summary>\n      \u003cul>\n        \u003cli>Type one Pokémon and press Enter. Small typos are fine; it shows who it thinks you mean.\u003c/li>\n        \u003cli>Guess as many times as you like before the 25 seconds are up. A Pokémon that doesn't fit just gets crossed off; only your first one that fits counts.\u003c/li>\n        \u003cli>Rarity compares your answer with every Pokémon that fits, using how well known each one is (the 2019 r/pokemon favourite poll, plus estimates for Gens VIII and IX).\u003c/li>\n        \u003cli>Regional forms, Megas and Gigantamax forms count as their own Pokémon with their own types. Their generation is the original Pokémon's.\u003c/li>\n        \u003cli>Leaving or refreshing during a daily prompt counts as running out of time.\u003c/li>\n        \u003cli>\"Pokédex color\" is the official color each species is filed under (Pikachu is Yellow). Moves count if the Pokémon can learn them in any game.\u003c/li>\n        \u003cli>VGC winners: any species that was on a Masters world champion's team from 2009 to 2026. Its other forms count too.\u003c/li>\n      \u003c/ul>\n    \u003c/details>\n  \u003c/section>\n\n  \u003csection class=\"view\" id=\"ask\" hidden>\n    \u003cdiv class=\"hud\">\u003cspan id=\"step\">\u003c/span>\u003cspan>score \u003cb id=\"score\">0\u003c/b>\u003c/span>\u003c/div>\n    \u003cdiv class=\"box\">\n      \u003cdiv id=\"prompt\">\u003c/div>\n      \u003cdiv id=\"timer\">\u003ci>\u003c/i>\u003c/div>\n      \u003cdiv class=\"row small muted\">\u003cspan id=\"secs\">\u003c/span>\u003c/div>\n      \u003cform id=\"form\" autocomplete=\"off\">\n        \u003cinput id=\"guess\" type=\"text\" placeholder=\"type a Pokémon, then Enter\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"Your answer\">\n      \u003c/form>\n      \u003cdiv id=\"reads\" role=\"status\">\u003c/div>\n      \u003cdiv id=\"tries\" class=\"small muted\">\u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"view\" id=\"reveal\" hidden>\n    \u003cdiv class=\"hud\">\u003cspan id=\"rstep\">\u003c/span>\u003cspan>score \u003cb id=\"rscore\">0\u003c/b>\u003c/span>\u003c/div>\n    \u003cdiv class=\"box\">\n      \u003cdiv class=\"small muted\" id=\"rprompt\">\u003c/div>\n      \u003cdiv class=\"pick\" id=\"rpick\">\u003c/div>\n      \u003cdiv class=\"list\" id=\"rlist\">\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"row\">\u003cbutton class=\"lbl big\" id=\"next\" type=\"button\">Next prompt\u003c/button>\u003c/div>\n  \u003c/section>\n\n  \u003csection c  trade: \"Name a Pokémon you get by trading.\",\n  single: \"Name a Pokémon that doesn't evolve.\", mega: \"Name a Pokémon that can Mega Evolve.\", reg: \"Name a Pokémon that has a regional form.\"\n};\nconst TYPE_SPECIAL = {\n  lg: T => `Name a Legendary ${T}-type Pokémon.`, megaf: T => `Name ${an(T)}-type Mega Evolution.`,\n  single: T => `Name ${an(T)}-type Pokémon that doesn't evolve.`, final: T => `Name a fully evolved ${T}-type Pokémon.`,\n  first: T => `Name ${an(T)}-type Pokémon that evolves but has no pre-evolution.`\n};\nconst an = w => (/^[AEIOU]/.test(w) ? \"an \" : \"a \") + w;\nconst has = f => m => m.flags.has(f);\nconst EXTRA = {\n  baby: [\"Name a baby Pokémon (like Pichu or Togepi).\", has(\"baby\")],\n  paradox: [\"Name a Paradox Pokémon.\", has(\"paradox\")],\n  ub: [\"Name an Ultra Beast.\", has(\"ub\")],\n  fossil: [\"Name a fossil Pokémon or one of its evolutions.\", has(\"fossil\")],\n  starter: [\"Name a starter Pokémon or one of its evolutions.\", has(\"starter\")],\n  pseudo: [\"Name a member of a pseudo-legendary family (like Dratini, Dragonair or Dragonite).\", has(\"pseudo\")],\n  vgc: [\"Name a Pokémon whose species was on a VGC World Championships winning team (Masters, 2009–2026).\", has(\"vgc\")],\n  nolvl: [\"Name a Pokémon that evolved without leveling up (stone, trade or another method).\", has(\"nolvl\")],\n  heavy: [\"Name a Pokémon that weighs 200 kg or more.\", m => m.kg >= 200],\n  light: [\"Name a Pokémon that weighs under 1 kg.\", m => m.kg \u003c 1]\n};\nconst genText = g => `Gen ${ROMAN[g]} (#${GEN_END[g-1]+1}–${GEN_END[g]})`;\nconst LETTERS = [...\"ABCDEFGHIJKLMNOPQRSTUVWXYZ\"].filter(L => MONS.filter(m => !m.form && m.name[0] === L).length >= 15);\nconst oneOf = (r, a) => a[Math.floor(r() * a.length)];\nfunction build(kind, r) {\n  const T = oneOf(r, TYPES), g = 1 + Math.floor(r() * 9);\n  const isT = t => m => m.types.includes(t), inGen = m => m.gen === g;\n  switch (kind) {\n    case \"type\": return { key: \"t\" + T, type: T, text: `Name ${an(T)}-type Pokémon.`, test: isT(T) };\n    case \"typegen\": return { key: \"tg\" + T + g, type: T, text: `Name ${an(T)}-type Pokémon from ${genText(g)}.`, test: m => isT(T)(m) && inGen(m) };\n    case \"typetype\": { const U = oneOf(r, TYPES); if (U === T) return null; const [a, b] = [T, U].sort();\n      return { key: \"tt\" + a + b, type: T, text: `Name a Pokémon that is both ${a} and ${b} type.`, test: m => isT(a)(m) && isT(b)(m) }; }\n    case \"gen\": return { key: \"g\" + g, text: `Name a Pokémon from ${genText(g)}.`, test: inGen };\n    case \"letter\": { const L = oneOf(r, LETTERS); return { key: \"l\" + L, text: `Name a Pokémon whose name starts with ${L} (not counting forms).`, test: m => !m.form && m.name[0] === L }; }\n    case \"special\": { const f = oneOf(r, Object.keys(SPECIAL)); return { key: \"s\" + f, text: SPECIAL[f], test: m => CATS[f].test(m) }; }\n    case \"color\": { const c = Math.floor(r() * COLORS.length); return { key: \"c\" + c, text: `Name a Pokémon whose Pokédex color is ${COLORS[c]} (not counting forms).`, test: m => m.color === c }; }\n    case \"move\": { const mv = oneOf(r, Object.keys(MOVE_BITS)); return { key: \"m\" + mv, text: `Name a Pokémon that can learn ${mv} (in any game).`, test: m => !!canLearn(mv, m) }; }\n    case \"extra\": { const f = oneOf(r, Object.keys(EXTRA)); return { key: \"x\" + f, text: EXTRA[f][0], test: EXTRA[f][1] }; }\n    case \"typespecial\": { const f = oneOf(r, Object.keys(TYPE_SPECIAL)); return { key: \"ts\" + T + f, type: T, text: TYPE_SPECIAL[f](T), test: m => isT(T)(m) && CATS[f].test(m) }; }\n  }\n}\n// The bigger prompt pool starts on 2026-11-13 so a daily already played keeps the same prompts.\nconst KINDS_V1 = [[\"type\", 4], [\"typegen\", 3], [\"typetype\", 2], [\"gen\", 1], [\"letter\", 2], [\"special\", 2], [\"typespecial\", 2]];\n// A type within one generation is the hardest prompt, so it is the rarest; a whole generation is easier.\nconst KINDS = [[\"type\", 3], [\"typegen\", 0.4], [\"typetype\", 2], [\"gen\", 1], [\"letter\", 1], [\"special\", 2], [\"typespecial\", 2], [\"color\", 2], [\"move\", 3], [\"extra\", 3]];\nfunction promptsFor(seed, date) {\n  const KS = date && date \u003c \"2026-11-13\" ? KINDS_V1 : KINDS;\n  const r = rng(seed), out = [], keys = new Set();\n  for (let guard = 0; out.length \u003c COUNT && guard \u003c 5000; guard++) {\n    let x = r() * KS.reduce((s, k) => s + k[1], 0), kind = KS[0][0];\n    for (const [k, w] of KS) { x -= w; if (x \u003c= 0) { kind = k; break; } }\n    if (out.filter(p => p.kind === kind).length >= 2) continue;\n    const p = build(kind, r);\n    if (!p || keys.has(p.key) || (p.type && out.some(q => q.type === p.type))) continue;\n    const list = MONS.filter(p.test);\n    if (list.length \u003c 6 || list.length > 450) continue;\n    keys.add(p.key); out.push({ ...p, kind, list });\n  }\n  return out;\n}\n\n// ── Reading what was typed: exact name first, then the closest name within a typo or two.\nfunction lev(a, b) {\n  if (Math.abs(a.length - b.length) > 2) return 9;\n  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);\n  for (let i = 1; i \u003c= a.length; i++) {\n    const cur = [i];\n    for (let j = 1; j \u003c= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));\n    prev = cur;\n  }\n  return prev[b.length];\n}\nfunction resolve(text) {\n  const k = squash(text);\n  if (k.length \u003c 3) return null;\n  const exact = MONS.find(m => m.keys.includes(k));\n  if (exact) return exact;\n  const allow = k.length >= 8 ? 2 : k.length >= 5 ? 1 : 0;\n  if (!allow) return null;\n  let best = null, bestD = 9, tie = false;\n  for (const m of MONS) for (const key of m.keys) {\n    const d = lev(k, key);\n    if (d \u003c bestD) { best = m; bestD = d; tie = false; } else if (d === bestD && best !== m) tie = true;\n  }\n  return bestD \u003c= allow && !tie ? best : null;\n}\n\n// ── Run state. The daily is saved after every step so it can't be replayed.\nlet run = null, timer = 0, deadline = 0, tries = [];\nconst show = id => [\"home\", \"ask\", \"reveal\", \"results\"].forEach(v => $(\"#\" + v).hidden = v !== id);\nconst total = (rn = run) => rn.picks.reduce((s, p) => s + (p ? p.pts : 0), 0);\nfunction newRun(seed, daily) { return { seed, daily, date: TODAY.date, i: 0, picks: [], started: null, over: false }; }\nfunction saveRun() { if (run.daily) { write(\"day-\" + run.date, { ...run, prompts: undefined }); report(\"shiny\", total(), run.over); } }\nfunction hydrate(saved) { const rn = { ...saved }; rn.prompts = promptsFor(rn.seed, rn.daily ? rn.date : null); return rn; }\n\nfunction startPrompt() {\n  const p = run.prompts[run.i];\n  run.started = run.started || Date.now();\n  saveRun();\n  deadline = run.started + SECONDS * 1000;\n  $(\"#step\").textContent = `prompt ${run.i + 1}/${COUNT}`;\n  $(\"#score\").textContent = total();\n  $(\"#prompt\").textContent = p.text;\n  $(\"#guess\").value = \"\"; $(\"#reads\").textContent = \"\"; $(\"#tries\").textContent = \"\"; tries = [];\n  show(\"ask\");\n  $(\"#guess\").focus();\n  clearInterval(timer);\n  tick(); timer = setInterval(tick, 100);\n}\nfunction tick() {\n  const left = Math.max(0, deadline - Date.now());\n  $(\"#timer i\").style.transform = `scaleX(${left / (SECONDS * 1000)})`;\n  $(\"#timer\").classList.toggle(\"low\", left \u003c 6000);\n  $(\"#secs\").textContent = Math.ceil(left / 1000) + \"s left\";\n  if (!left) answer(null, \"time\");\n}\nfunction answer(m, why) {\n  if (run.over || run.picks.length > run.i) return;\n  clearInterval(timer);\n  const p = run.prompts[run.i], ok = !!m && p.test(m), t = ok ? tierFor(m, p.list) : null;\n  run.picks.push({ name: m ? m.name : null, ok, tier: t ? t.id : null, pts: t ? t.pts : 0, why: ok ? \"\" : (m ? \"wrong\" : why) });\n  run.started = null;\n  if (run.picks.length === COUNT) run.over = true;\n  saveRun();\n  reveal(run.i);\n}\nfunction reveal(i) {\n  const p = run.prompts[i], pk = run.picks[i], m = pk.name && MONS.find(x => x.name === pk.name), t = TIERS.find(x => x.id === pk.tier);\n  $(\"#rstep\").textContent = `prompt ${i + 1}/${COUNT}`;\n  $(\"#rscore\").textContent = total();\n  $(\"#rprompt\").textContent = p.text;\n  $(\"#rpick\").innerHTML = (m ? `\u003cimg src=\"${sprite(m.img)}\" alt=\"\">` : `\u003cdiv class=\"none\">time\u003c/div>`) + \"\u003cdiv>\" +\n    (pk.ok ? `\u003cb>${esc(m.name)}\u003c/b>\u003cdiv class=\"tierline\">${ball(t, 18)} ${t.name} · +${t.pts}\u003c/div>`\n      : m ? `\u003cb>${esc(m.name)}\u003c/b>\u003cdiv class=\"bad\">doesn't fit · +0\u003c/div>` : `\u003cb>Time's up\u003c/b>\u003cdiv class=\"bad\">+0\u003c/div>`) + \"\u003c/div>\";\n  const fame = byFame(p.list), shinies = fame.filter(x => tierFor(x, p.list).id === \"shiny\").reverse();\n  $(\"#rlist\").innerHTML = `\u003cp class=\"muted\">${p.list.length} Pokémon fit.\u003c/p>` +\n    `\u003cp>${ball(TIERS[0])}\u003cspan>\u003cb>Most common:\u003c/b> ${fame.slice(0, 4).map(x => esc(x.name)).join(\", \")}\u003c/span>\u003c/p>` +\n    (shinies.length ? `\u003cp>${ball(TIERS[4])}\u003cspan>\u003cb>Shiny picks:\u003c/b> ${shinies.slice(0, 4).map(x => esc(x.name)).join(\", \")}\u003c/span>\u003c/p>` : \"\");\n  $(\"#next\").textContent = run.over ? \"See results\" : \"Next prompt\";\n  show(\"reveal\");\n  $(\"#next\").focus();\n}\nfunction next() {\n  if (run.over) return results();\n  run.i++; saveRun(); startPrompt();\n}\nfunction shareText() {\n  const L = { poke: \"P\", great: \"G\", ultra: \"U\", master: \"M\", shiny: \"S\" };\n  return `Shiny Hunt ${run.daily ? run.date : \"practice\"} · ${total()} points\\n` +\n    run.picks.map(p => p.ok ? L[p.tier] : \"·\").join(\"\") + \"\\nP Poké  G Great  U Ultra  M Master  S Shiny\";\n}\nfunction results() {\n  const t = total();\n  $(\"#rtitle\").textContent = run.daily ? `Today's hunt · ${run.date}` : \"Practice run\";\n  $(\"#total\").textContent = t + \" points\";\n  $(\"#rows\").innerHTML = run.picks.map((pk, i) => {\n    const tr = TIERS.find(x => x.id === pk.tier);\n    return `${tr ? ball(tr, 16) : '\u003cspan class=\"muted\">–\u003c/span>'}\u003cspan>${pk.name ? esc(pk.name) : \"time\"}\u003cbr>\u003cspan class=\"q\">${esc(run.prompts[i].text)}\u003c/span>\u003c/span>\u003cspan class=\"pts\">+${pk.pts}\u003c/span>`;\n  }).join(\"\");\n  $(\"#share\").textContent = shareText();\n  $(\"#msg\").textContent = \"\";\n  show(\"results\");\n}\nfunction renderHome() {\n  clearInterval(timer);\n  $(\"#ddate\").textContent = TODAY.date;\n  const d = read(\"day-\" + TODAY.date);\n  if (!d) { $(\"#dstat\").textContent = \"Not played yet.\"; $(\"#hdaily\").textContent = \"Start today's hunt\"; }\n  else if (d.over) { $(\"#dstat\").innerHTML = `Done: \u003cb>${total(d)} points\u003c/b>.`; $(\"#hdaily\").textContent = \"See today's results\"; }\n  else { $(\"#dstat\").textContent = `In progress: prompt ${Math.min(d.picks.length + 1, COUNT)} of ${COUNT}, ${total(d)} points.`; $(\"#hdaily\").textContent = \"Keep going\"; }\n  $(\"#legend\").innerHTML = TIERS.map(t => `${ball(t, 16)}\u003cspan>${t.name}\u003c/span>\u003cspan class=\"pts\">+${t.pts}\u003c/span>`).join(\"\");\n  show(\"home\");\n}\nfunction playDaily() {\n  const d = read(\"day-\" + TODAY.date);\n  run = d ? hydrate(d) : (() => { const rn = newRun(TODAY.seed, true); rn.prompts = promptsFor(rn.seed, rn.date); return rn; })();\n  if (run.over) return results();\n  // A prompt that was open when the page closed has run out of time.\n  if (run.started && run.picks.length === run.i) { if (Date.now() >= run.started + SECONDS * 1000) { answer(null, \"time\"); return; } }\n  if (run.picks.length > run.i) return reveal(run.i);\n  startPrompt();\n}\nfunction practice() { run = newRun(Math.floor(Math.random() * 4294967295) + 1, false); run.prompts = promptsFor(run.seed); startPrompt(); }\n\n$(\"#guess\").addEventListener(\"input\", e => {\n  const m = resolve(e.target.value);\n  $(\"#reads\").textContent = m ? (squash(e.target.value) === m.keys[0] ? \"\" : \"reads as \" + m.name) : \"\";\n});\n$(\"#form\").onsubmit = e => {\n  e.preventDefault();\n  const m = resolve($(\"#guess\").value);\n  if (!m) { $(\"#reads\").textContent = $(\"#guess\").value.trim() ? \"Not a Pokémon name. Keep typing.\" : \"\"; return; }\n  // Like Krillion: a wrong answer costs nothing but time.\n  if (!run.prompts[run.i].test(m)) {\n    if (!tries.includes(m.name)) tries.push(m.name);\n    $(\"#guess\").value = \"\";\n    $(\"#reads\").innerHTML = `\u003cspan class=\"bad\">${esc(m.name)} doesn't fit. Try again.\u003c/span>`;\n    $(\"#tries\").textContent = \"Not it: \" + tries.join(\", \");\n    return;\n  }\n  answer(m);\n};\n$(\"#next\").onclick = next;\n$(\"#hdaily\").onclick = playDaily;\n$(\"#hpractice\").onclick = practice;\n$(\"#practice\").onclick = practice;\n$(\"#menu\").onclick = renderHome;\n$(\"#copy\").onclick = async () => {\n  try { await navigator.clipboard.writeText(shareText()); $(\"#msg\").textContent = \"Copied.\"; }\n  catch { $(\"#msg\").textContent = \"Copy blocked here. Select the text above and copy it.\"; }\n};\nrenderHome();\n\n// The hub reads this: integer metrics, the current run, never null. Only the daily scores.\nwindow.__boredSnapshot = () => ({ slug: 'shiny-hunt', points: run ? total() : 0, prompts: run ? run.picks.length : 0, finished: !!(run && run.over), daily: !!(run && run.daily) });\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"</script>
<script>
const $ = s => document.querySelector(s);
const MODES = [
  { id: "doku", name: "Pokédoku", max: 1350, blurb: "Fill a 3x3 grid with Pokémon that fit each row and column. Rarer picks score more." },
  { id: "inverse", name: "Inverse Doku", max: 600, blurb: "The 9 Pokémon are already there. Guess the 6 categories they share in 6 tries." },
  { id: "shiny", name: "Shiny Hunt", max: 700, blurb: "Seven prompts, 25 seconds each. Name the Pokémon nobody else would." }
];
function today() {
  const s = window.__boredSeed;
  if (s && s.date) return s.date;
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
const DATE = today();
const sum = id => { try { return JSON.parse(localStorage.getItem(`bored.pokedoku.sum-${DATE}-${id}`)) || null; } catch { return null; } };
const totals = () => {
  const s = MODES.map(m => sum(m.id));
  return { points: s.reduce((t, x) => t + (x && x.finished ? x.points : 0), 0), finished: s.some(x => x && x.finished) };
};

function landing() {
  $("#frames").hidden = true; $("#bar").hidden = true; $("#landing").hidden = false;
  $("#date").textContent = DATE;
  $("#total").textContent = totals().points;
  $("#cards").innerHTML = "";
  for (const m of MODES) {
    const s = sum(m.id), card = document.createElement("div");
    card.className = "card";
    const st = !s ? "Today: not played" : s.finished ? `<span class="done">Today: done</span> · <b>${s.points}</b> / ${m.max}` : `Today: in progress · ${s.points} so far`;
    card.innerHTML = `<h2>${m.name}</h2><p>${m.blurb}</p><div class="st">${st}</div><button class="lbl big" type="button">${s && !s.finished ? "Continue" : "Play"}</button>`;
    card.querySelector("button").onclick = () => open(m);
    $("#cards").appendChild(card);
  }
  document.querySelector("#cards").style.cssText = "display:flex;flex-direction:column;gap:8px";
}
// Each mode is its own document in a frame, kept alive so switching back keeps its place.
const frames = {};
function open(m) {
  if (!frames[m.id]) {
    const f = document.createElement("iframe");
    f.title = m.name;
    f.srcdoc = JSON.parse($("#doc-" + m.id).textContent);
    $("#frames").appendChild(f);
    frames[m.id] = f;
  }
  for (const [id, f] of Object.entries(frames)) f.hidden = id !== m.id;
  $("#title").textContent = m.name;
  $("#landing").hidden = true; $("#bar").hidden = false; $("#frames").hidden = false;
  frames[m.id].focus();
}
$("#back").onclick = landing;
landing();

// The hub reads this: today's finished dailies added up, never null.
window.__boredSnapshot = () => { const t = totals(); return { slug: 'pokedoku', points: t.points, finished: t.finished, daily: true }; };
</script>
