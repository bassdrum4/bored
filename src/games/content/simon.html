<!DOCTYPE html>
<html lang="en">
<head><script>(function(){try{localStorage.getItem('__probe');return}catch(e){}
var m={};
function k(i){return Object.keys(m)[i]||null}
var s={getItem:function(x){return Object.prototype.hasOwnProperty.call(m,x)?m[x]:null},
setItem:function(x,v){m[x]=String(v)},removeItem:function(x){delete m[x]},
clear:function(){m={}},key:k};
Object.defineProperty(s,'length',{get:function(){return Object.keys(m).length}});
try{Object.defineProperty(window,'localStorage',{value:s,configurable:true});}catch(e){}
try{Object.defineProperty(window,'sessionStorage',{value:s,configurable:true});}catch(e){}
})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIMON</title>
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

:root {
  --bg: #080810;
  --surface: #16162a;
  --surface-lt: #1e1e38;
  --border: #252545;
  --text: #e0ddd5;
  --muted: #5a586a;
  --accent: #e8c547;
  --ok: #00ff88;
  --err: #ff2244;
  --green-idle: #1a6b3c;
  --green-on: #00ff88;
  --red-idle: #8b1a1a;
  --red-on: #ff2244;
  --yellow-idle: #8b7a1a;
  --yellow-on: #ffe644;
  --blue-idle: #1a3d8b;
  --blue-on: #4488ff;
}

html, body { height:100%; }

body {
  font-family: 'Share Tech Mono', monospace;
  color: var(--text);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 25% 15%, rgba(26,61,139,.07) 0%, transparent 50%),
    radial-gradient(ellipse at 75% 85%, rgba(139,26,26,.05) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(139,122,26,.03) 0%, transparent 40%),
    var(--bg);
}

body::before {
  content:'';
  position:fixed; inset:0;
  opacity:.025;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  pointer-events:none;
  z-index:9999;
}

.game-container {
  display:flex; flex-direction:column; align-items:center;
  gap:18px; padding:20px; max-width:420px;
  animation: fadeUp .7s ease both;
}

@keyframes fadeUp {
  from { opacity:0; transform:translateY(18px); }
  to   { opacity:1; transform:translateY(0); }
}

/* ── Title ── */
.title {
  font-family:'Orbitron',sans-serif; font-weight:900;
  font-size:44px; letter-spacing:.25em;
  text-indent:.25em;
  color:var(--text);
  text-shadow:0 0 40px rgba(232,197,71,.1);
  user-select:none;
}

/* ── Status bar ── */
.status-bar {
  display:flex; gap:36px;
  font-size:13px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--muted);
}
.status-bar .v { color:var(--accent); font-weight:700; }

/* ── Game status ── */
.game-status {
  font-size:13px; letter-spacing:.15em;
  text-transform:uppercase; color:var(--muted);
  height:18px; transition:color .3s;
}
.game-status.watch   { color:var(--accent); animation:pulse 1s ease-in-out infinite; }
.game-status.turn    { color:var(--ok); }
.game-status.success { color:var(--ok); }
.game-status.error   { color:var(--err); }

@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

/* ── Progress dots ── */
.progress {
  display:flex; gap:5px; justify-content:center;
  height:10px; align-items:center;
}
.progress .d {
  width:6px; height:6px; border-radius:50%;
  background:var(--border); transition:background .15s, transform .15s;
}
.progress .d.filled { background:var(--accent); transform:scale(1.2); }
.progress.hidden { visibility:hidden; }

/* ── Board ── */
.board-wrap {
  position:relative; width:340px; height:340px;
}

.board {
  width:100%; height:100%;
  border-radius:50%;
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr;
  gap:10px; padding:18px;
  background:var(--surface);
  overflow:hidden;
  box-shadow:
    0 0 0 5px var(--surface-lt),
    0 0 0 9px #0c0c18,
    0 30px 80px rgba(0,0,0,.5),
    inset 0 1px 2px rgba(255,255,255,.04);
  transition:box-shadow .5s;
}
.board.glow {
  box-shadow:
    0 0 0 5px var(--surface-lt),
    0 0 0 9px #0c0c18,
    0 30px 80px rgba(0,0,0,.5),
    0 0 60px rgba(232,197,71,.06),
    inset 0 1px 2px rgba(255,255,255,.04);
}

/* ── Quadrants ── */
.quad {
  border:none; cursor:pointer; position:relative;
  -webkit-tap-highlight-color:transparent;
  outline:none;
  transition:filter .08s, transform .08s;
  box-shadow:
    inset 3px 3px 10px rgba(0,0,0,.35),
    inset -1px -1px 4px rgba(255,255,255,.03);
}

.quad:nth-child(1) { border-top-left-radius:100%;     background:var(--green-idle); }
.quad:nth-child(2) { border-top-right-radius:100%;    background:var(--red-idle);   }
.quad:nth-child(3) { border-bottom-left-radius:100%;  background:var(--yellow-idle);}
.quad:nth-child(4) { border-bottom-right-radius:100%; background:var(--blue-idle);  }

.quad:not(.off):hover  { filter:brightness(1.15); }
.quad:not(.off):active { transform:scale(.97); filter:brightness(1.3); }

.quad:nth-child(1).on { background:var(--green-on);
  box-shadow:0 0 28px rgba(0,255,136,.55),0 0 56px rgba(0,255,136,.18),inset 0 0 28px rgba(0,255,136,.12); }
.quad:nth-child(2).on { background:var(--red-on);
  box-shadow:0 0 28px rgba(255,34,68,.55),0 0 56px rgba(255,34,68,.18),inset 0 0 28px rgba(255,34,68,.12); }
.quad:nth-child(3).on { background:var(--yellow-on);
  box-shadow:0 0 28px rgba(255,230,68,.55),0 0 56px rgba(255,230,68,.18),inset 0 0 28px rgba(255,230,68,.12); }
.quad:nth-child(4).on { background:var(--blue-on);
  box-shadow:0 0 28px rgba(68,136,255,.55),0 0 56px rgba(68,136,255,.18),inset 0 0 28px rgba(68,136,255,.12); }

.quad.err {
  background:var(--err) !important;
  box-shadow:0 0 35px rgba(255,34,68,.45) !important;
}
.quad.off { cursor:default; }
.quad.off:not(.on):not(.err) { filter:brightness(.7); }

/* ── Center hub ── */
.center {
  position:absolute;
  width:108px; height:108px;
  border-radius:50%;
  background:linear-gradient(145deg,#1a1a32,#10101e);
  top:50%; left:50%; transform:translate(-50%,-50%);
  z-index:10;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:5px;
  box-shadow:
    0 0 0 3px var(--border),
    inset 0 1px 3px rgba(255,255,255,.04),
    0 4px 14px rgba(0,0,0,.35);
}
.round-lbl {
  font-size:9px; color:var(--muted);
  letter-spacing:.2em; text-transform:uppercase;
}
.round-num {
  font-family:'Orbitron',sans-serif; font-weight:700;
  font-size:28px; color:var(--accent); line-height:1;
}
.round-num.pop { animation:numPop .25s ease; }

@keyframes numPop {
  0%  { transform:scale(1); }
  40% { transform:scale(1.4); }
  100%{ transform:scale(1); }
}

.btn {
  font-family:'Orbitron',sans-serif; font-weight:700;
  font-size:10px; letter-spacing:.15em;
  background:transparent; color:var(--accent);
  border:1px solid rgba(232,197,71,.4);
  padding:5px 14px; border-radius:3px;
  cursor:pointer; transition:all .2s;
  text-transform:uppercase;
  animation:btnGlow 2.5s ease-in-out infinite;
}
.btn:hover {
  background:var(--accent); color:var(--bg);
  border-color:var(--accent); animation:none;
}
.btn.hidden { display:none; }

@keyframes btnGlow {
  0%,100% { border-color:rgba(232,197,71,.35); }
  50%     { border-color:rgba(232,197,71,.85); }
}

/* ── Game-over overlay ── */
.go-overlay {
  position:absolute; inset:0;
  border-radius:50%;
  background:rgba(8,8,16,.88);
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  z-index:20;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:10px;
  opacity:0; pointer-events:none;
  transition:opacity .4s ease;
}
.go-overlay.show { opacity:1; pointer-events:all; }

.go-title {
  font-family:'Orbitron',sans-serif; font-weight:900;
  font-size:22px; color:var(--err);
  letter-spacing:.12em; text-align:center; line-height:1.3;
  text-shadow:0 0 25px rgba(255,34,68,.35);
}
.go-score { font-size:13px; color:var(--muted); }
.go-score .v { color:var(--accent); font-family:'Orbitron',sans-serif; font-weight:700; }

/* ── Board error flash ── */
.board.flash-err::after {
  content:'';
  position:absolute; inset:0; border-radius:50%;
  background:radial-gradient(circle,rgba(255,34,68,.28) 0%,transparent 70%);
  animation:errPulse .55s ease-out forwards;
  z-index:5; pointer-events:none;
}
@keyframes errPulse { 0%{opacity:1} 100%{opacity:0} }

/* ── Speed indicator ── */
.speed-indicator {
  font-size:11px; color:var(--muted);
  letter-spacing:.1em; height:14px;
  opacity:0; transition:opacity .4s;
}
.speed-indicator.visible { opacity:1; }
.speed-indicator .v { color:var(--accent); }

/* ── Instructions ── */
.info {
  text-align:center; font-size:12px;
  color:var(--muted); line-height:2;
}
.info kbd {
  display:inline-block;
  background:var(--surface); border:1px solid var(--border);
  border-radius:3px; padding:1px 6px;
  font-family:'Share Tech Mono',monospace;
  font-size:11px; color:var(--accent);
  margin:0 1px; vertical-align:middle;
}
.legend {
  display:flex; gap:14px; justify-content:center;
  margin-top:6px; flex-wrap:wrap;
}
.legend-i {
  display:flex; align-items:center; gap:5px; font-size:11px;
}
.legend-dot {
  width:8px; height:8px; border-radius:50%;
  display:inline-block;
}

@media (max-width:380px) {
  .board-wrap { transform:scale(.82); margin:-24px 0; }
  .title { font-size:32px; }
}
</style>
</head>
<body>

<div class="game-container">
  <h1 class="title">SIMON</h1>

  <div class="status-bar">
    <span>Round: <span class="v" id="sRound">0</span></span>
    <span>Best: <span class="v" id="sBest">0</span></span>
  </div>

  <div class="game-status" id="sStatus">Press START to play</div>

  <div class="progress hidden" id="sProg"></div>

  <div class="speed-indicator" id="sSpeed">Speed: <span class="v" id="sSpeedV">1.0×</span></div>

  <div class="board-wrap">
    <div class="board" id="board">
      <button class="quad off" data-i="0" aria-label="Green – key 1"></button>
      <button class="quad off" data-i="1" aria-label="Red – key 2"></button>
      <button class="quad off" data-i="2" aria-label="Yellow – key 3"></button>
      <button class="quad off" data-i="3" aria-label="Blue – key 4"></button>
    </div>

    <div class="center">
      <span class="round-lbl">ROUND</span>
      <span class="round-num" id="sRNum">&mdash;</span>
      <button class="btn" id="btnStart">START</button>
    </div>

    <div class="go-overlay" id="overlay">
      <div class="go-title">GAME<br>OVER</div>
      <div class="go-score">Round <span class="v" id="sFinal">0</span></div>
      <button class="btn btn-retry" id="btnRetry">RETRY</button>
    </div>
  </div>

  <div class="info">
    <p>Watch the sequence, then repeat it.</p>
    <p>Use <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> <kbd>4</kbd> or click the panels.</p>
    <div class="legend">
      <span class="legend-i"><span class="legend-dot" style="background:var(--green-on)"></span>1 = Green</span>
      <span class="legend-i"><span class="legend-dot" style="background:var(--red-on)"></span>2 = Red</span>
      <span class="legend-i"><span class="legend-dot" style="background:var(--yellow-on)"></span>3 = Yellow</span>
      <span class="legend-i"><span class="legend-dot" style="background:var(--blue-on)"></span>4 = Blue</span>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ─── Constants ─── */
  var FREQ   = [415, 310, 252, 209];
  var BASE_L = 420;   // light-on ms
  var BASE_P = 180;   // pause ms
  var MIN_SP = 0.35;  // min speed factor
  var PFLASH = 180;   // player flash ms
  var RDELAY = 720;   // delay before next round ms

  /* ─── DOM ─── */
  var board     = document.getElementById("board");
  var qs        = [].slice.call(document.querySelectorAll(".quad"));
  var btnStart  = document.getElementById("btnStart");
  var btnRetry  = document.getElementById("btnRetry");
  var sRound    = document.getElementById("sRound");
  var sRNum     = document.getElementById("sRNum");
  var sBest     = document.getElementById("sBest");
  var sStatus   = document.getElementById("sStatus");
  var sProg     = document.getElementById("sProg");
  var sSpeed    = document.getElementById("sSpeed");
  var sSpeedV   = document.getElementById("sSpeedV");
  var overlay   = document.getElementById("overlay");
  var sFinal    = document.getElementById("sFinal");

  /* ─── Audio ─── */
  var ctx = null;

  function ensureAudio(){
    if(!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if(ctx.state === "suspended") ctx.resume();
  }

  function tone(freq, dur){
    if(!ctx) return;
    var t = ctx.currentTime;
    var o1 = ctx.createOscillator();
    var o2 = ctx.createOscillator();
    var g1 = ctx.createGain();
    var g2 = ctx.createGain();
    var master = ctx.createGain();

    o1.type="sine"; o1.frequency.value=freq;
    g1.gain.value=0.5;
    o2.type="triangle"; o2.frequency.value=freq*2.01;
    g2.gain.value=0.12;

    o1.connect(g1); o2.connect(g2);
    g1.connect(master); g2.connect(master);
    master.connect(ctx.destination);

    master.gain.setValueAtTime(0.35, t);
    master.gain.exponentialRampToValueAtTime(0.001, t + dur);

    o1.start(t); o1.stop(t+dur+.05);
    o2.start(t); o2.stop(t+dur+.05);
  }

  function errSound(){
    if(!ctx) return;
    var t=ctx.currentTime;
    var o=ctx.createOscillator(), g=ctx.createGain();
    o.type="sawtooth";
    o.frequency.setValueAtTime(150,t);
    o.frequency.exponentialRampToValueAtTime(75,t+.5);
    o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.18,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+.6);
    o.start(t); o.stop(t+.65);
  }

  function chime(){
    if(!ctx) return;
    var t=ctx.currentTime;
    [523.25,659.25,783.99].forEach(function(f,i){
      var o=ctx.createOscillator(), g=ctx.createGain();
      o.type="sine"; o.frequency.value=f;
      o.connect(g); g.connect(ctx.destination);
      var s=t+i*.07;
      g.gain.setValueAtTime(0,s);
      g.gain.linearRampToValueAtTime(0.14,s+.02);
      g.gain.exponentialRampToValueAtTime(0.001,s+.22);
      o.start(s); o.stop(s+.28);
    });
  }

  /* ─── State ─── */
  var seq=[], pIdx=0, round=0, best=0, state="idle", tid=0;
  try{ best=parseInt(localStorage.getItem("simonBest"),10)||0; }catch(e){}

  /* ─── Speed ─── */
  function spdF(){
    return Math.max(MIN_SP, 1 - Math.floor((round-1)/5)*0.1);
  }

  /* ─── UI helpers ─── */
  function setRound(n){
    sRound.textContent=n;
    sRNum.textContent=n||"\u2014";
    if(n>0){ sRNum.classList.remove("pop"); void sRNum.offsetWidth; sRNum.classList.add("pop"); }
  }
  function setBest(n){ sBest.textContent=n; }
  function setStatus(t,c){
    sStatus.textContent=t;
    sStatus.className="game-status"+(c?" "+c:"");
  }
  function onQ(i){ qs[i].classList.add("on"); }
  function offQ(i){ qs[i].classList.remove("on"); }
  function offAll(){ qs.forEach(function(q){ q.classList.remove("on","err"); }); }
  function disAll(v){ qs.forEach(function(q){ q.classList.toggle("off",v); }); }

  function showProg(n){
    sProg.classList.remove("hidden");
    sProg.innerHTML="";
    for(var i=0;i<n;i++){ var d=document.createElement("span"); d.className="d"; sProg.appendChild(d); }
  }
  function updProg(filled){
    var dots=sProg.querySelectorAll(".d");
    for(var i=0;i<dots.length;i++) dots[i].classList.toggle("filled",i<filled);
  }
  function hideProg(){ sProg.classList.add("hidden"); sProg.innerHTML=""; }

  function showSpeed(){
    var f=spdF();
    sSpeedV.textContent=f.toFixed(2)+"\u00d7";
    sSpeed.classList.add("visible");
  }
  function hideSpeed(){ sSpeed.classList.remove("visible"); }

  function saveBest(){
    if(round>best){
      best=round; setBest(best);
      try{ localStorage.setItem("simonBest",""+best); }catch(e){}
    }
  }

  /* ─── Game flow ─── */
  function startGame(){
    ensureAudio();
    tid++;
    seq=[]; pIdx=0; round=0; state="idle";
    offAll(); disAll(true);
    overlay.classList.remove("show");
    btnStart.classList.add("hidden");
    board.classList.remove("glow","flash-err");
    hideProg(); hideSpeed();
    setRound(0);
    setStatus("GET READY\u2026","");
    var myTid=tid;
    setTimeout(function(){ if(tid===myTid) nextRound(); },600);
  }

  function nextRound(){
    var myTid=tid;
    round++;
    seq.push(Math.floor(Math.random()*4));
    pIdx=0;
    setRound(round);
    showProg(seq.length);
    updProg(0);
    showSpeed();
    setStatus("WATCH\u2026","watch");
    disAll(true);
    board.classList.add("glow");
    state="showing";
    setTimeout(function(){ if(tid===myTid) showSeq(myTid); },350);
  }

  function showSeq(myTid){
    var sf=spdF();
    var ld=Math.round(BASE_L*sf);
    var pd=Math.round(BASE_P*sf);
    var i=0;

    function step(){
      if(tid!==myTid) return;
      if(i>=seq.length){
        state="playing";
        disAll(false);
        setStatus("YOUR TURN","turn");
        return;
      }
      var idx=seq[i];
      onQ(idx);
      tone(FREQ[idx], ld/1000);
      setTimeout(function(){
        if(tid!==myTid) return;
        offQ(idx);
        i++;
        setTimeout(step, pd);
      }, ld);
    }
    step();
  }

  function handleInput(idx){
    if(state!=="playing") return;

    onQ(idx);
    tone(FREQ[idx], PFLASH/1000);
    setTimeout(function(){ offQ(idx); }, PFLASH);

    if(idx!==seq[pIdx]){
      gameOver();
      return;
    }

    pIdx++;
    updProg(pIdx);

    if(pIdx===seq.length){
      state="paused";
      disAll(true);
      setStatus("NICE!","success");
      chime();
      saveBest();
      var myTid=tid;
      setTimeout(function(){ if(tid===myTid) nextRound(); }, RDELAY);
    }
  }

  function gameOver(){
    state="gameover";
    disAll(true);
    errSound();

    qs.forEach(function(q){ q.classList.add("err"); });
    board.classList.add("flash-err");

    saveBest();

    var myTid=tid;
    setTimeout(function(){
      if(tid!==myTid) return;
      qs.forEach(function(q){ q.classList.remove("err"); });
      board.classList.remove("flash-err");
      sFinal.textContent=round;
      overlay.classList.add("show");
      setStatus("GAME OVER","error");
      hideProg();
    },700);
  }

  /* ─── Events ─── */
  btnStart.addEventListener("click", startGame);
  btnRetry.addEventListener("click", startGame);

  qs.forEach(function(q,i){
    q.addEventListener("click", function(){ handleInput(i); });
  });

  var keyMap={"1":0,"2":1,"3":2,"4":3};
  document.addEventListener("keydown", function(e){
    if(keyMap.hasOwnProperty(e.key)){
      e.preventDefault();
      handleInput(keyMap[e.key]);
    }
    if(e.key===" "||e.key==="Enter"){
      e.preventDefault();
      if(state==="idle"||state==="gameover") startGame();
    }
  });

  /* ─── Init ─── */
  setBest(best);
  setStatus("Press START to play","");

})();
</script>
</body>
</html>
