<!DOCTYPE html>
<html lang="en">
<head><script>(function(){try{localStorage.getItem('__probe');return}catch(e){}
var m={};
function k(i){return Object.keys(m)[i]||null}
var s={getItem:function(x){return Object.prototype.hasOwnProperty.call(m,x)?m[x]:null},
setItem:function(x,v){m[x]=String(v)},removeItem:function(x){delete m[x]},
clear:function(){m={}},key:k};
Object.defineProperty(s,'length',{get:function(){return Object.keys(m).length}});
try{Object.defineProperty(window,'localStorage',{value:s,configurable:true});}catch(e){}
try{Object.defineProperty(window,'sessionStorage',{value:s,configurable:true});}catch(e){}
})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ASTEROIDS</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#000}
  canvas{display:block;touch-action:none;-webkit-user-select:none;user-select:none}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
'use strict';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// Mutable: a window resize changes the playfield, so nothing may cache the old size.
let W = 0, H = 0;
function resizeCanvas() {
  W = canvas.width = innerWidth;
  H = canvas.height = innerHeight;
}
resizeCanvas();
addEventListener('resize', resizeCanvas);

// ── AUDIO ───────────────────────────────────────────────────────────────────
let ac = null, muted = false;
function initAudio() {
  if (!ac) {
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  }
  if (ac.state === 'suspended') ac.resume();
}
function tone(f, dur, type, vol, slideTo) {
  if (!ac || muted) return;
  try {
    const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(f, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t + dur);
    g.gain.setValueAtTime(vol || 0.05, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(ac.destination);
    o.start(t); o.stop(t + dur);
  } catch (e) { }
}
function noise(dur, vol) {
  if (!ac || muted) return;
  try {
    const n = Math.floor(ac.sampleRate * dur);
    const buf = ac.createBuffer(1, n, ac.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = ac.createBufferSource(), g = ac.createGain();
    src.buffer = buf; g.gain.value = vol;
    src.connect(g).connect(ac.destination);
    src.start();
  } catch (e) { }
}
const SFX = {
  shoot: () => tone(1250, 0.07, 'square', 0.035, 320),
  rock: () => { noise(0.22, 0.1); tone(150, 0.18, 'sawtooth', 0.05, 40); },
  ship: () => { noise(0.5, 0.14); tone(260, 0.7, 'sawtooth', 0.06, 30); },
  saucer: () => { tone(520, 0.06, 'triangle', 0.03); },
  saucerShot: () => tone(700, 0.08, 'square', 0.03, 260),
  hyper: () => tone(180, 0.24, 'triangle', 0.05, 1500),
  extra: () => { tone(880, 0.08, 'square', 0.05); setTimeout(() => tone(1320, 0.12, 'square', 0.05), 90); }
};

// ── INPUT ───────────────────────────────────────────────────────────────────
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  initAudio();
  if (e.code === 'KeyP' && gameStarted && !gameOver) paused = !paused;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ShiftLeft', 'ShiftRight'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden) for (const k in keys) keys[k] = false; });

// ── STATE ───────────────────────────────────────────────────────────────────
// `level` stays at the top of this script: the daily adapter reads it.
let ship, bullets, asteroids, particles, pops, saucer, saucerBullets;
let score, lives, gameOver, respawnTimer, level, gameStarted;
let shake = 0, banner = '', bannerLife = 0, waveDelay = 0, paused = false;
let extraLifeAt = 10000, shootCooldown = 0, hyperCd = 0, saucerTimer = 0, saucerBeep = 0;

function init() {
  ship = {
    x: W / 2, y: H / 2, angle: -Math.PI / 2,
    dx: 0, dy: 0, radius: 15,
    dead: false, invulnerable: 0, thrusting: false
  };
  bullets = []; asteroids = []; particles = []; pops = [];
  saucer = null; saucerBullets = [];
  score = 0; lives = 3; gameOver = false; respawnTimer = 0;
  level = 0; gameStarted = false;
  shake = 0; banner = ''; bannerLife = 0; waveDelay = 0;
  paused = false; extraLifeAt = 10000; shootCooldown = 0; hyperCd = 0;
  saucerTimer = 600 + Math.random() * 300;
  spawnAsteroids();
  // The opening wave is already on screen behind the title: no banner for it.
  banner = '';
  bannerLife = 0;
}

const dist = (x1, y1, x2, y2) => Math.hypot(x1 - x2, y1 - y2);

function wrap(o) {
  if (o.x < -50) o.x += W + 100;
  if (o.x > W + 50) o.x -= W + 100;
  if (o.y < -50) o.y += H + 100;
  if (o.y > H + 50) o.y -= H + 100;
}

// ── ASTEROIDS ───────────────────────────────────────────────────────────────
function spawnAsteroids() {
  level++;
  waveDelay = 0;
  banner = 'WAVE ' + level;
  bannerLife = 100;
  const count = 3 + level;
  for (let i = 0; i < count; i++) {
    let x, y;
    do {
      x = Math.random() * W;
      y = Math.random() * H;
    } while (dist(x, y, ship.x, ship.y) < 150);
    asteroids.push(createAsteroid(x, y, 3));
  }
  // Each wave gets its own saucer window; it never overlaps the previous one.
  saucerTimer = Math.max(240, 620 - level * 35);
}

function createAsteroid(x, y, size) {
  const speed = (0.5 + Math.random() * 1.5) * (4 - size) * 0.5 + level * 0.03;
  const angle = Math.random() * Math.PI * 2;
  const vertCount = 8 + Math.floor(Math.random() * 5);
  const verts = [];
  for (let i = 0; i < vertCount; i++) {
    const a = (i / vertCount) * Math.PI * 2;
    const r = (size === 3 ? 40 : size === 2 ? 20 : 10) * (0.7 + Math.random() * 0.6);
    verts.push({ a, r });
  }
  return {
    x, y, dx: Math.cos(angle) * speed, dy: Math.sin(angle) * speed,
    size, verts, radius: size === 3 ? 40 : size === 2 ? 20 : 10, rot: angle
  };
}

// ── EFFECTS ─────────────────────────────────────────────────────────────────
function burst(x, y, n, speed) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = Math.random() * speed;
    particles.push({
      x, y, dx: Math.cos(a) * s, dy: Math.sin(a) * s,
      life: 24 + Math.random() * 24, max: 48
    });
  }
}
function popup(x, y, text) {
  pops.push({ x, y, text, life: 60 });
}

// ── SHIP ────────────────────────────────────────────────────────────────────
function updateShip() {
  if (ship.invulnerable > 0) ship.invulnerable--;
  if (hyperCd > 0) hyperCd--;
  if (shootCooldown > 0) shootCooldown--;

  if (ship.dead) {
    respawnTimer--;
    if (respawnTimer <= 0 && lives > 0) {
      ship.dead = false;
      ship.x = W / 2; ship.y = H / 2;
      ship.dx = 0; ship.dy = 0;
      ship.angle = -Math.PI / 2;
      ship.invulnerable = 130;
    }
    return;
  }

  ship.thrusting = false;
  if (keys.ArrowLeft || keys.KeyA) ship.angle -= 0.075;
  if (keys.ArrowRight || keys.KeyD) ship.angle += 0.075;
  if (keys.ArrowUp || keys.KeyW) {
    ship.thrusting = true;
    ship.dx += Math.cos(ship.angle) * 0.12;
    ship.dy += Math.sin(ship.angle) * 0.12;
    if (Math.random() < 0.5) {
      particles.push({
        x: ship.x - Math.cos(ship.angle) * 15,
        y: ship.y - Math.sin(ship.angle) * 15,
        dx: -Math.cos(ship.angle) * (2 + Math.random() * 2),
        dy: -Math.sin(ship.angle) * (2 + Math.random() * 2),
        life: 14 + Math.random() * 10, max: 24
      });
    }
  }

  // A little more drag than the arcade original: it keeps the screen readable.
  ship.dx *= 0.992;
  ship.dy *= 0.992;
  const sp = Math.hypot(ship.dx, ship.dy);
  if (sp > 7) { ship.dx = ship.dx / sp * 7; ship.dy = ship.dy / sp * 7; }
  ship.x += ship.dx;
  ship.y += ship.dy;
  wrap(ship);

  // Hyperspace: a way out of a bad corner, with a short cool-down.
  if ((keys.ShiftLeft || keys.ShiftRight) && hyperCd <= 0) {
    hyperCd = 90;
    burst(ship.x, ship.y, 18, 3);
    ship.x = 80 + Math.random() * (W - 160);
    ship.y = 80 + Math.random() * (H - 160);
    ship.dx = ship.dy = 0;
    ship.invulnerable = 70;
    burst(ship.x, ship.y, 18, 3);
    SFX.hyper();
  }

  if ((keys.Space || keys.KeyJ) && shootCooldown <= 0 && bullets.length < 5) {
    bullets.push({
      x: ship.x + Math.cos(ship.angle) * 18,
      y: ship.y + Math.sin(ship.angle) * 18,
      dx: Math.cos(ship.angle) * 7 + ship.dx * 0.3,
      dy: Math.sin(ship.angle) * 7 + ship.dy * 0.3,
      life: 55
    });
    shootCooldown = 9;
    SFX.shoot();
  }
}

function killShip() {
  if (ship.invulnerable > 0 || ship.dead) return;
  burst(ship.x, ship.y, 30, 4.5);
  ship.dead = true;
  ship.thrusting = false;
  shake = 18;
  SFX.ship();
  lives--;
  if (lives <= 0) {
    gameOver = true;
    saucer = null;
    saucerBullets = [];
  } else {
    respawnTimer = 110;
  }
}

// ── BULLETS ─────────────────────────────────────────────────────────────────
function updateBullets() {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.dx; b.y += b.dy; b.life--;
    wrap(b);
    if (b.life <= 0) bullets.splice(i, 1);
  }
  for (let i = saucerBullets.length - 1; i >= 0; i--) {
    const b = saucerBullets[i];
    b.x += b.dx; b.y += b.dy;
    if (b.x < -30 || b.x > W + 30 || b.y < -30 || b.y > H + 30) saucerBullets.splice(i, 1);
  }
}

// ── SAUCER ──────────────────────────────────────────────────────────────────
function spawnSaucer() {
  const small = level >= 3 && Math.random() < 0.4;
  const fromLeft = Math.random() < 0.5;
  saucer = {
    x: fromLeft ? -40 : W + 40,
    y: 70 + Math.random() * Math.min(240, H * 0.35),
    dx: (fromLeft ? 1 : -1) * (small ? 2.8 : 1.9),
    r: small ? 15 : 23,
    small,
    fire: 70 + Math.random() * 50,
    sound: 0
  };
}

function updateSaucer() {
  if (!saucer) {
    if (!gameOver && !ship.dead) {
      saucerTimer--;
      if (saucerTimer <= 0) spawnSaucer();
    }
    return;
  }
  const s = saucer;
  s.x += s.dx;
  s.y += Math.sin(s.x / 90) * 0.25;
  s.fire--;
  s.sound--;

  if (s.sound <= 0) { SFX.saucer(); s.sound = 34; }

  if (s.fire <= 0) {
    s.fire = (s.small ? 60 : 95) + Math.random() * 45;
    // The small saucer leads its shots; the big one is sloppy.
    const aim = Math.atan2(ship.y - s.y, ship.x - s.x);
    const jitter = s.small ? 0.06 : 0.34;
    const a = aim + (Math.random() - 0.5) * jitter;
    const speed = s.small ? 4.2 : 3.4;
    saucerBullets.push({ x: s.x, y: s.y + s.r * 0.4, dx: Math.cos(a) * speed, dy: Math.sin(a) * speed });
    SFX.saucerShot();
  }

  if (s.x < -60 || s.x > W + 60) {
    saucer = null;
    saucerTimer = 520 + Math.random() * 480;
  }
}

function hitSaucer() {
  const s = saucer;
  burst(s.x, s.y, 20, 3.5);
  score += s.small ? 1000 : 200;
  popup(s.x, s.y - 24, '+' + (s.small ? 1000 : 200));
  shake = 8;
  SFX.rock();
  saucer = null;
  saucerTimer = 560 + Math.random() * 420;
}

// ── COLLISIONS ──────────────────────────────────────────────────────────────
function collide() {
  for (let i = asteroids.length - 1; i >= 0; i--) {
    const a = asteroids[i];
    for (let j = bullets.length - 1; j >= 0; j--) {
      const b = bullets[j];
      if (dist(a.x, a.y, b.x, b.y) >= a.radius + 3) continue;

      score += a.size === 3 ? 20 : a.size === 2 ? 50 : 100;
      if (a.size > 1) {
        asteroids.push(createAsteroid(a.x, a.y, a.size - 1));
        asteroids.push(createAsteroid(a.x, a.y, a.size - 1));
      }
      burst(a.x, a.y, a.size === 3 ? 14 : 8, 3);
      if (a.size === 3) { shake = Math.max(shake, 5); SFX.rock(); }
      else SFX.rock();
      asteroids.splice(i, 1);
      bullets.splice(j, 1);
      break;
    }
  }

  if (saucer) {
    for (let j = bullets.length - 1; j >= 0; j--) {
      const b = bullets[j];
      if (dist(saucer.x, saucer.y, b.x, b.y) < saucer.r + 3) {
        bullets.splice(j, 1);
        hitSaucer();
        break;
      }
    }
  }

  if (ship.dead) return;

  if (ship.invulnerable <= 0) {
    for (const a of asteroids) {
      if (dist(a.x, a.y, ship.x, ship.y) < a.radius + ship.radius * 0.6) {
        killShip();
        break;
      }
    }
  }

  if (!ship.dead && ship.invulnerable <= 0 && saucer &&
      dist(saucer.x, saucer.y, ship.x, ship.y) < saucer.r + ship.radius * 0.7) {
    killShip();
  }

  for (let i = saucerBullets.length - 1; i >= 0; i--) {
    const b = saucerBullets[i];
    if (dist(b.x, b.y, ship.x, ship.y) < ship.radius * 0.8) {
      saucerBullets.splice(i, 1);
      killShip();
      break;
    }
  }
}

// ── UPDATE ──────────────────────────────────────────────────────────────────
function update() {
  if (shake > 0) { shake *= 0.88; if (shake < 0.3) shake = 0; }
  if (bannerLife > 0) bannerLife--;

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.dx; p.y += p.dy;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = pops.length - 1; i >= 0; i--) {
    const p = pops[i];
    p.y -= 0.8; p.life--;
    if (p.life <= 0) pops.splice(i, 1);
  }

  if (!gameStarted) {
    if (keys.Space) { gameStarted = true; initAudio(); }
    // The title still shows drifting rocks.
    for (const a of asteroids) { a.x += a.dx * 0.4; a.y += a.dy * 0.4; a.rot += 0.002; wrap(a); }
    return;
  }
  if (gameOver) {
    if (keys.KeyR) { init(); gameStarted = true; }
    return;
  }
  if (paused) return;

  updateShip();
  updateBullets();
  updateSaucer();

  for (const a of asteroids) {
    a.x += a.dx; a.y += a.dy; a.rot += 0.004;
    wrap(a);
  }

  collide();

  if (!asteroids.length && waveDelay <= 0) {
    waveDelay = 100;
    banner = 'WAVE CLEAR';
    bannerLife = 100;
    saucer = null;
    saucerBullets = [];
  }
  if (waveDelay > 0) {
    waveDelay--;
    if (waveDelay === 0) spawnAsteroids();
  }

  if (score >= extraLifeAt && lives < 5) {
    lives++;
    extraLifeAt += 15000;
    popup(W / 2, H * 0.32, 'EXTRA SHIP');
    SFX.extra();
  }
}

// ── DRAW ────────────────────────────────────────────────────────────────────
function drawShip() {
  if (!ship || ship.dead || !gameStarted) return;
  if (ship.invulnerable > 0 && Math.floor(ship.invulnerable / 4) % 2 === 0) return;

  ctx.save();
  ctx.translate(ship.x, ship.y);
  ctx.rotate(ship.angle);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(18, 0);
  ctx.lineTo(-12, -10);
  ctx.lineTo(-7, 0);
  ctx.lineTo(-12, 10);
  ctx.closePath();
  ctx.stroke();
  if (ship.thrusting) {
    ctx.beginPath();
    ctx.moveTo(-8, -5);
    ctx.lineTo(-15 - Math.random() * 8, 0);
    ctx.lineTo(-8, 5);
    ctx.strokeStyle = '#7fd6ff';
    ctx.stroke();
  }
  ctx.restore();
}

function drawAsteroid(a) {
  ctx.save();
  ctx.translate(a.x, a.y);
  ctx.rotate(a.rot);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let i = 0; i < a.verts.length; i++) {
    const v = a.verts[i];
    const x = Math.cos(v.a) * v.r;
    const y = Math.sin(v.a) * v.r;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.stroke();
  ctx.restore();
}

function drawSaucer() {
  if (!saucer) return;
  const s = saucer;
  ctx.strokeStyle = '#7fd6ff';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.ellipse(s.x, s.y, s.r, s.r * 0.34, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(s.x - s.r * 0.55, s.y - 1);
  ctx.quadraticCurveTo(s.x, s.y - s.r * 0.95, s.x + s.r * 0.55, s.y - 1);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(s.x - s.r, s.y + 2);
  ctx.lineTo(s.x + s.r, s.y + 2);
  ctx.stroke();
}

function drawHUD() {
  if (!gameStarted) return;
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'left';
  ctx.font = '22px ui-monospace, SFMono-Regular, Menlo, monospace';
  ctx.fillText(String(score).padStart(5, '0'), 20, 40);

  for (let i = 0; i < lives; i++) {
    ctx.save();
    ctx.translate(32 + i * 24, 64);
    ctx.rotate(-Math.PI / 2);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(9, 0);
    ctx.lineTo(-6, -5);
    ctx.lineTo(-3, 0);
    ctx.lineTo(-6, 5);
    ctx.closePath();
    ctx.stroke();
    ctx.restore();
  }

  ctx.textAlign = 'right';
  ctx.font = '14px ui-monospace, SFMono-Regular, Menlo, monospace';
  ctx.fillStyle = '#7fd6ff';
  ctx.fillText('WAVE ' + level, W - 20, 38);
  ctx.fillStyle = '#5b7f8c';
  ctx.font = '10px ui-monospace, SFMono-Regular, Menlo, monospace';
  ctx.fillText('SHIFT HYPERSPACE', W - 20, 58);
  ctx.textAlign = 'left';
}

function drawTitle() {
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.font = '52px ui-monospace, SFMono-Regular, Menlo, monospace';
  ctx.fillText('ASTEROIDS', W / 2, H / 2 - 90);

  ctx.fillStyle = '#7fd6ff';
  ctx.font = '13px ui-monospace, SFMono-Regular, Menlo, monospace';
  ctx.fillText('TURN  ARROWS / A D', W / 2, H / 2 - 20);
  ctx.fillText('THRUST  UP / W', W / 2, H / 2 + 2);
  ctx.fillText('FIRE  SPACE', W / 2, H / 2 + 24);
  ctx.fillText('HYPERSPACE  SHIFT', W / 2, H / 2 + 46);

  ctx.fillStyle = '#555';
  ctx.font = '12px ui-monospace, SFMono-Regular, Menlo, monospace';
  ctx.fillText('SAUCER 200  ·  SMALL SAUCER 1000  ·  EXTRA SHIP EVERY 10000', W / 2, H / 2 + 90);

  if ((Date.now() / 600 | 0) % 2 === 0) {
    ctx.fillStyle = '#fff';
    ctx.font = '16px ui-monospace, SFMono-Regular, Menlo, monospace';
    ctx.fillText('PRESS SPACE TO START', W / 2, H / 2 + 140);
  }
  ctx.textAlign = 'left';
}

function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  if (shake > 0.5) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

  for (const a of asteroids) drawAsteroid(a);
  for (const b of bullets) {
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(b.x, b.y, 2, 0, Math.PI * 2); ctx.fill();
  }
  for (const b of saucerBullets) {
    ctx.fillStyle = '#7fd6ff';
    ctx.beginPath(); ctx.arc(b.x, b.y, 3, 0, Math.PI * 2); ctx.fill();
  }
  drawSaucer();
  drawShip();

  for (const p of particles) {
    ctx.fillStyle = 'rgba(255,255,255,' + Math.max(0, p.life / p.max) + ')';
    ctx.fillRect(p.x - 1, p.y - 1, 2, 2);
  }

  ctx.font = '12px ui-monospace, SFMono-Regular, Menlo, monospace';
  ctx.textAlign = 'center';
  for (const p of pops) {
    ctx.fillStyle = 'rgba(127,214,255,' + Math.min(1, p.life / 30) + ')';
    ctx.fillText(p.text, p.x, p.y);
  }
  ctx.textAlign = 'left';
  ctx.restore();

  if (bannerLife > 0) {
    ctx.textAlign = 'center';
    ctx.globalAlpha = Math.min(1, bannerLife / 40);
    ctx.fillStyle = '#7fd6ff';
    ctx.font = '20px ui-monospace, SFMono-Regular, Menlo, monospace';
    ctx.fillText(banner, W / 2, H * 0.44);
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  }

  drawHUD();

  if (!gameStarted) {
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    ctx.fillRect(0, 0, W, H);
    drawTitle();
    return;
  }

  if (paused) {
    ctx.fillStyle = 'rgba(0,0,0,.6)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.font = '24px ui-monospace, SFMono-Regular, Menlo, monospace';
    ctx.fillText('PAUSED', W / 2, H / 2 - 6);
    ctx.fillStyle = '#7fd6ff';
    ctx.font = '12px ui-monospace, SFMono-Regular, Menlo, monospace';
    ctx.fillText('P TO RESUME', W / 2, H / 2 + 26);
    ctx.textAlign = 'left';
  }

  if (gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,.65)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.font = '44px ui-monospace, SFMono-Regular, Menlo, monospace';
    ctx.fillText('GAME OVER', W / 2, H / 2 - 30);
    ctx.fillStyle = '#7fd6ff';
    ctx.font = '18px ui-monospace, SFMono-Regular, Menlo, monospace';
    ctx.fillText('SCORE ' + score, W / 2, H / 2 + 14);
    ctx.fillStyle = '#555';
    ctx.font = '13px ui-monospace, SFMono-Regular, Menlo, monospace';
    ctx.fillText('REACHED WAVE ' + level, W / 2, H / 2 + 42);
    if ((Date.now() / 500 | 0) % 2 === 0) {
      ctx.fillStyle = '#fff';
      ctx.font = '14px ui-monospace, SFMono-Regular, Menlo, monospace';
      ctx.fillText('PRESS R TO PLAY AGAIN', W / 2, H / 2 + 86);
    }
    ctx.textAlign = 'left';
  }
}

// ── LOOP ────────────────────────────────────────────────────────────────────
init();
(function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
