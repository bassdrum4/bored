<!DOCTYPE html>
<html lang="en">
<head><script>(function(){try{localStorage.getItem('__probe');return}catch(e){}
var m={};
function k(i){return Object.keys(m)[i]||null}
var s={getItem:function(x){return Object.prototype.hasOwnProperty.call(m,x)?m[x]:null},
setItem:function(x,v){m[x]=String(v)},removeItem:function(x){delete m[x]},
clear:function(){m={}},key:k};
Object.defineProperty(s,'length',{get:function(){return Object.keys(m).length}});
try{Object.defineProperty(window,'localStorage',{value:s,configurable:true});}catch(e){}
try{Object.defineProperty(window,'sessionStorage',{value:s,configurable:true});}catch(e){}
})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asteroids</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const W = canvas.width;
const H = canvas.height;

const keys = {};
window.addEventListener('keydown', e => { keys[e.code] = true; e.preventDefault(); });
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden) for(const k in keys)keys[k]=false });

// Game state
let ship, bullets, asteroids, particles, score, lives, gameOver, respawnTimer, level, gameStarted;

function init() {
  ship = { x: W/2, y: H/2, angle: -Math.PI/2, dx: 0, dy: 0, radius: 15, dead: false, blinkTimer: 0, invulnerable: 0 };
  bullets = [];
  asteroids = [];
  particles = [];
  score = 0;
  lives = 3;
  gameOver = false;
  respawnTimer = 0;
  level = 0;
  gameStarted = false;
  spawnAsteroids();
}

function spawnAsteroids() {
  level++;
  const count = 3 + level;
  for (let i = 0; i < count; i++) {
    let x, y;
    do {
      x = Math.random() * W;
      y = Math.random() * H;
    } while (dist(x, y, ship.x, ship.y) < 150);
    asteroids.push(createAsteroid(x, y, 3));
  }
}

function createAsteroid(x, y, size) {
  const speed = (0.5 + Math.random() * 1.5) * (4 - size) * 0.5;
  const angle = Math.random() * Math.PI * 2;
  const vertCount = 8 + Math.floor(Math.random() * 5);
  const verts = [];
  for (let i = 0; i < vertCount; i++) {
    const a = (i / vertCount) * Math.PI * 2;
    const r = (size === 3 ? 40 : size === 2 ? 20 : 10) * (0.7 + Math.random() * 0.6);
    verts.push({ a, r });
  }
  return { x, y, dx: Math.cos(angle) * speed, dy: Math.sin(angle) * speed, size, verts, radius: size === 3 ? 40 : size === 2 ? 20 : 10 };
}

function dist(x1, y1, x2, y2) {
  return Math.hypot(x1 - x2, y1 - y2);
}

function wrap(obj) {
  if (obj.x < -50) obj.x += W + 100;
  if (obj.x > W + 50) obj.x -= W + 100;
  if (obj.y < -50) obj.y += H + 100;
  if (obj.y > H + 50) obj.y -= H + 100;
}

let shootCooldown = 0;

function update() {
  if (gameOver) {
    if (keys['KeyR']) { init(); }
    return;
  }

  if (!gameStarted) {
    if (keys['Space']) { gameStarted = true; }
    return;
  }

  // Ship controls
  if (!ship.dead) {
    if (keys['ArrowLeft'] || keys['KeyA']) ship.angle -= 0.07;
    if (keys['ArrowRight'] || keys['KeyD']) ship.angle += 0.07;
    if (keys['ArrowUp'] || keys['KeyW']) {
      ship.dx += Math.cos(ship.angle) * 0.12;
      ship.dy += Math.sin(ship.angle) * 0.12;
      // Thrust particles
      for (let i = 0; i < 2; i++) {
        particles.push({
          x: ship.x - Math.cos(ship.angle) * 15 + (Math.random()-0.5)*6,
          y: ship.y - Math.sin(ship.angle) * 15 + (Math.random()-0.5)*6,
          dx: -Math.cos(ship.angle) * (2+Math.random()*2) + (Math.random()-0.5),
          dy: -Math.sin(ship.angle) * (2+Math.random()*2) + (Math.random()-0.5),
          life: 20 + Math.random()*15
        });
      }
    }
    ship.dx *= 0.99;
    ship.dy *= 0.99;
    ship.x += ship.dx;
    ship.y += ship.dy;
    wrap(ship);

    if (ship.invulnerable > 0) ship.invulnerable--;

    // Shoot
    shootCooldown--;
    if ((keys['Space'] || keys['KeyJ']) && shootCooldown <= 0) {
      bullets.push({
        x: ship.x + Math.cos(ship.angle) * 18,
        y: ship.y + Math.sin(ship.angle) * 18,
        dx: Math.cos(ship.angle) * 7 + ship.dx * 0.3,
        dy: Math.sin(ship.angle) * 7 + ship.dy * 0.3,
        life: 55
      });
      shootCooldown = 8;
    }
  } else {
    respawnTimer--;
    if (respawnTimer <= 0) {
      ship.dead = false;
      ship.x = W/2;
      ship.y = H/2;
      ship.dx = 0;
      ship.dy = 0;
      ship.angle = -Math.PI/2;
      ship.invulnerable = 120;
    }
  }

  // Bullets
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.dx;
    b.y += b.dy;
    b.life--;
    wrap(b);
    if (b.life <= 0) bullets.splice(i, 1);
  }

  // Asteroids
  for (const a of asteroids) {
    a.x += a.dx;
    a.y += a.dy;
    wrap(a);
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.dx;
    p.y += p.dy;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Bullet-asteroid collisions
  for (let i = asteroids.length - 1; i >= 0; i--) {
    const a = asteroids[i];
    for (let j = bullets.length - 1; j >= 0; j--) {
      const b = bullets[j];
      if (dist(a.x, a.y, b.x, b.y) < a.radius + 3) {
        // Score
        score += a.size === 3 ? 20 : a.size === 2 ? 50 : 100;
        // Split
        if (a.size > 1) {
          asteroids.push(createAsteroid(a.x, a.y, a.size - 1));
          asteroids.push(createAsteroid(a.x, a.y, a.size - 1));
        }
        // Explosion particles
        for (let k = 0; k < (a.size === 3 ? 12 : 8); k++) {
          const angle = Math.random() * Math.PI * 2;
          const spd = Math.random() * 3;
          particles.push({
            x: a.x, y: a.y,
            dx: Math.cos(angle) * spd, dy: Math.sin(angle) * spd,
            life: 20 + Math.random() * 20
          });
        }
        asteroids.splice(i, 1);
        bullets.splice(j, 1);
        break;
      }
    }
  }

  // Ship-asteroid collision
  if (!ship.dead && ship.invulnerable <= 0) {
    for (const a of asteroids) {
      if (dist(a.x, a.y, ship.x, ship.y) < a.radius + ship.radius * 0.6) {
        // Ship destroyed
        for (let k = 0; k < 20; k++) {
          const angle = Math.random() * Math.PI * 2;
          const spd = Math.random() * 4;
          particles.push({
            x: ship.x, y: ship.y,
            dx: Math.cos(angle) * spd, dy: Math.sin(angle) * spd,
            life: 30 + Math.random() * 30
          });
        }
        ship.dead = true;
        lives--;
        respawnTimer = 120;
        if (lives <= 0) {
          gameOver = true;
        }
        break;
      }
    }
  }

  // Next wave
  if (asteroids.length === 0) {
    spawnAsteroids();
  }
}

function drawShip() {
  if (ship.dead) return;
  if (ship.invulnerable > 0 && Math.floor(ship.invulnerable / 4) % 2 === 0) return;

  ctx.save();
  ctx.translate(ship.x, ship.y);
  ctx.rotate(ship.angle);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(18, 0);
  ctx.lineTo(-12, -10);
  ctx.lineTo(-7, 0);
  ctx.lineTo(-12, 10);
  ctx.closePath();
  ctx.stroke();
  ctx.restore();
}

function drawAsteroid(a) {
  ctx.save();
  ctx.translate(a.x, a.y);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let i = 0; i < a.verts.length; i++) {
    const v = a.verts[i];
    const x = Math.cos(v.a) * v.r;
    const y = Math.sin(v.a) * v.r;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.stroke();
  ctx.restore();
}

function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  if (!gameStarted) {
    ctx.fillStyle = '#fff';
    ctx.font = '48px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('ASTEROIDS', W/2, H/2 - 40);
    ctx.font = '18px "Courier New", monospace';
    ctx.fillText('PRESS SPACE TO START', W/2, H/2 + 20);
    ctx.font = '14px "Courier New", monospace';
    ctx.fillText('ARROWS / WASD to move   SPACE to shoot', W/2, H/2 + 60);
    return;
  }

  // Draw everything
  for (const a of asteroids) drawAsteroid(a);

  for (const b of bullets) {
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(b.x, b.y, 2, 0, Math.PI * 2);
    ctx.fill();
  }

  drawShip();

  // Particles
  for (const p of particles) {
    ctx.fillStyle = `rgba(255,255,255,${p.life / 40})`;
    ctx.fillRect(p.x - 1, p.y - 1, 2, 2);
  }

  // HUD
  ctx.fillStyle = '#fff';
  ctx.font = '24px "Courier New", monospace';
  ctx.textAlign = 'left';
  ctx.fillText(String(score).padStart(6, '0'), 20, 35);

  // Lives - draw small ships
  for (let i = 0; i < lives; i++) {
    ctx.save();
    ctx.translate(30 + i * 25, 55);
    ctx.rotate(-Math.PI/2);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(10, 0);
    ctx.lineTo(-6, -5);
    ctx.lineTo(-3, 0);
    ctx.lineTo(-6, 5);
    ctx.closePath();
    ctx.stroke();
    ctx.restore();
  }

  if (gameOver) {
    ctx.fillStyle = '#fff';
    ctx.font = '48px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', W/2, H/2 - 20);
    ctx.font = '18px "Courier New", monospace';
    ctx.fillText('PRESS R TO RESTART', W/2, H/2 + 30);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

init();
loop();

window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});
</script>
</body>
</html>
