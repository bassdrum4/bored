<script>
/* Bored wrapper for -ezbreez- and mrVoo's Ballistic Chickens.
   The game itself is the original JavaScript (see src/prototypes/ballistic-chickens),
   inlined by build.mjs. This block only adds the two things the arcade needs:
   a save key under this site's own namespace and the snapshot the hub reads. */
(function () {
  // The artwork and fonts are served from this site beside the game. A srcdoc
  // frame inherits the hub's URL, so resolve against it; a direct load of this
  // document resolves against itself. (They have to be same-origin anyway:
  // kaboom uploads them as WebGL textures and the original CDN sends no CORS.)
  var docPath = new URL(document.baseURI).pathname;
  window.BC_ASSETS = /games\/content\/ballistic-chickens\.html$/.test(docPath)
    ? new URL('../../games/assets/ballistic-chickens/', document.baseURI).href
    : new URL('games/assets/ballistic-chickens/', document.baseURI).href;
  var SAVE_KEY = 'bored.ballistic-chickens.save';

  window.bcLoadSave = function (fallback) {
    try {
      var raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return fallback;
      var saved = JSON.parse(raw);
      if (!saved || typeof saved !== 'object') return fallback;
      saved.upgrades = Array.isArray(saved.upgrades) ? saved.upgrades.slice(0, 6) : [0, 0, 0, 0, 0, 0];
      while (saved.upgrades.length < 6) saved.upgrades.push(0);
      saved.achievements = Array.isArray(saved.achievements) ? saved.achievements : [];
      saved.money = Math.max(0, Number(saved.money) || 0);
      saved.best = Math.max(0, Number(saved.best) || 0);
      return saved;
    } catch (error) { return fallback; }
  }

  // The game's save record goes through this instead of kaboom's own getData
  // and setData (which write the bare key "save" into this origin), so it
  // lives beside the arcade's other saves.
  window.bcStoreSave = function (value) {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(value)); return true; }
    catch (error) { return false; }
  };

  // The run's live numbers, filled in by game.js, and the score the hub reads.
  window.__bcRun = { distance: 0, altitude: 0, maxAltitude: 0, score: 0, ended: false };
  window.__boredSnapshot = function () {
    var run = window.__bcRun || {};
    var metres = Math.max(0, Math.floor(Number(run.distance) || 0));
    return {
      slug: 'ballistic-chickens',
      meters: metres,
      height: Math.max(0, Math.floor(Number(run.maxAltitude) || 0)),
      score: Math.max(0, Math.floor(Number(run.score) || 0)),
      finished: run.ended === true
    };
  };

  if (!window.kaboom) document.getElementById('fail').classList.add('on');
})();
</script>

function shortNum(x) {
  x = Math.floor(x);
  let letters = ['M', 'B', 'T', 'QA', 'QI', 'SX', 'SP', 'O', 'N', 'D'];
  let len = letters.length;
  for (let i = 0; i < len; i++) {
    let pow = (len-i)*3 + 3;
    if (x >= 10**pow) {
      return `${(x/10**pow).toFixed(1)}${letters[len-1-i]}`;
    };
  };
  return x.toLocaleString('en-US')
};

    color(BLACK),
    fixed(),
    z(Z.ui),
  ]);

  add([
    pos(SCALE/7, SCALE*(1 + 1/7)),
    rect(SCALE*0.5, SCALE*0.5),
    color(BLACK),
    fixed(),
    z(Z.ui),
    'fuelLabel',
  ]);

  add([
    pos(SCALE*(0.04 + 1/7), SCALE*(1.04 + 1/7)),
    rect(SCALE*1.92, SCALE*0.22),
    color(rgb(80,80,80)),
    fixed(),
    z(Z.ui),
  ]);

  const fuelValue = add([
    pos(SCALE*(0.04 + 1/7), SCALE*(1.04 + 1/7)),
    rect(SCALE*1.92, SCALE*0.22),
    color(rgb(255,255,0)),
    fixed(),
    z(Z.ui),
  ]);

  add([
    text('FUEL', { font: 'rubik', size: SCALE*0.13 }),
    pos(SCALE*(0.09 + 1/7), SCALE*(1.33 + 1/7)),
    color(WHITE),
    z(Z.ui),
    fixed(),
  ]);

  const groundFix = add([
    rect(width()*2, SCALE*2),
    pos(-width()/2, height()-SCALE*0.9),
    color(rgb(100,60,0)),
    z(Z.bg),
  ]);

  for (let i = 0; i < 12; i++) {
    add([
      sprite('ground'),
      pos(SCALE * i, height()),
      origin('botright'),
      scale(TILE),
      z(Z.game),
      'ground',
    ]);
  };

  onClick(() => {
    if (!chickenShot) {
      chickenShot = true;
      chicken.pos = cannon.pos.add(SCALE/2, -SCALE/2);
      
      let launchVel = 10 + upgradeMod(0);
      chicken.xv = launchVel;
      chicken.yv = launchVel;

      cannon.frame++;
      wait(0.2, () => { cannon.frame++; });
    };
  });

  onKeyPress('space', () => {
    if (!chickenShot) {
      chickenShot = true;
      chicken.pos = cannon.pos.add(SCALE/2, -SCALE/2);
      
      let launchVel = 10 + upgradeMod(0);
      chicken.xv = launchVel;
      chicken.yv = launchVel;

      cannon.frame++;
      wait(0.2, () => { cannon.frame++; });
    };
  });

  onCollide('chicken', 'star', (c,s) => {
    score += s.value;
    destroy(s);
  });

  onCollide('chicken', 'trampoline', (c, t) => {
    if (!rolling && !t.used) {
      t.used = true;
      score += 5;
      chicken.yv = Math.abs(0.9 * chicken.yv);
      add([
        text('+5', {
          size: SCALE*0.6,
          font: 'rubik',
          align: 'center',
        }),
        pos(toScreen(c.pos)),
        color(rgb(255,255,100)),
        lifespan(0.5, { fade: 0.5 }),
        origin('center'),
        fixed(),
      ]);
    };
  });

  every('fuelLabel', (f) => { f.radius = SCALE/10; });

  onKeyPress('e', () => {
    showEndMenu();
  });

  function upgradeMod(x) {
    return STUFF.upgrades[x] * OFFERS[x].gain;
  };

  function getScore(x) {
    return (Math.log(x) / Math.log(1.5) /5) + 1 + x/30;
  };

  var collectableSizes = [
    0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 
    0.9, 0.9, 0.9, 0.9,
    1.3, 1.3, 1.3, 1.3,
  ];


  onUpdate(() => {
    if (chickenShot && !stopped) {
      chicken.pos = chicken.pos.add(
        chicken.xv *SCALE *dt(),
        -chicken.yv *SCALE *dt()
      );

      velocity = Math.sqrt(chicken.xv**2 + chicken.yv**2);
      velocityMach = (Math.sqrt(chicken.xv**2 + chicken.yv**2) / 343).toLocaleString('en-US');

      if (chicken.pos.y >= height()-SCALE*1.1) {
        chicken.pos.y = height()-SCALE*1.1;
        chicken.yv *= -(-50/(upgradeMod(3)+50) + 1.3);
        if (!rolling) chicken.xv *= -50/(upgradeMod(3)+50) + 1.5;

        if (Math.abs(chicken.yv) <= 0.5) {
          chicken.yv = 0;
          rolling = true;
          if (Math.abs(chicken.xv) <= 0.5) {
            chicken.xv = 0;
          };
        };

        if (!groundHit) {
          groundHit = true;
          fuel = 0
          chicken.frame++;
          detatchAnim();
        };  
      };
      
      chicken.yv -= (50 * 16*dt()) / (upgradeMod(1) + 50);
      if (rolling) {
        if (chicken.xv != 0) {
          chicken.xv -= (30 * dt()*1.3) / (upgradeMod(1) + 30);
        };
      } else {
        chicken.xv -= (30 * dt()) / (upgradeMod(1) + 30);
      };

      if (chicken.xv > 0) {
        if (groundHit && !rolling) {
          chicken.angle += dt()*500;
        } else if (!rolling) {
          chicken.angle = Math.atan2(-chicken.yv, chicken.xv)*57;
        };
        if (rolling) {
          chicken.angle += dt() * chicken.xv*120;
        };
      }; 
    
      if (chicken.xv == 0 && !stopped) {
        stopped = true;
        wait(0.1, () => { 
          chicken.angle = 0;
          setTimeout(showEndMenu, 300);
        });
      };

      if (Math.abs(chicken.xv) <= 0.2)
        chicken.xv = 0;

      distanceF = (chicken.pos.x / SCALE);
      every('distanceText', (d) => { d.text = `${shortNum(distanceF)}m travelled`; });
      distance = Math.floor(distanceF);

      altitude = ((height()-SCALE*1.1-chicken.pos.y) / SCALE);
      every('altitudeText', (a) => { a.text = `Altitude: ${shortNum(altitude)}m`; });
      
      maxAltitude = Math.max(maxAltitude, altitude);
      window.__bcRun = { distance: distanceF, altitude, maxAltitude, score, ended: endMenuShown };
      every('maxAltitudeText', (m) => { m.text = `Top Altitude: ${shortNum(maxAltitude)}m`; });

      every('velocityText', (v) => { 
        let val = (velocityMach >= 0.8 ? `Mach ${parseFloat(velocityMach).toFixed(1)}` : `${shortNum(velocity)} m/s`);
        v.text = `Velocity: ${val}`;
      });

      every('scoreText', (s) => { s.text = score; });
      fuel = Math.max(0, fuel);
      
      camPos(vec2(
        Math.max(center().x, chicken.pos.x),
        Math.min(center().y, chicken.pos.y),
      ));

      
     // if (distance >=)


      // STARS (and more) SPAWNING MESS
      
      if (distance % 2 == 0 && lastStar != distance) {
        lastStar = distance;
        starsRendered = 0;
        starsPossible = 0;
        for (let s = 0; s < STAR_TYPES.length; s++) {
          let current = STAR_TYPES[s];
          for (let i = 0; i < current.count; i++) {
            starsPossible++;
            let starHeight = rand(current.range[0], current.range[1]);
            if (Math.max(Math.abs(chicken.yv), 10) 
              > 
            Math.abs(starHeight - altitude - chicken.yv)) {
              starsRendered++;
              if (current.frame == 'not a star lol') {
                add([
                  sprite('cloud'),
                  scale(TILE * rand(5,14)),
                  origin('center'),
                  area(),
                  pos((distance+10+i)*SCALE, height()- SCALE*starHeight),
                  opacity(0.3),
                  z(Z.game -1),
                  'skyObject',
                ]);
              } else {
                add([
                  sprite('collectables', { frame: current.frame }),
                  scale(TILE * collectableSizes[current.frame]),
                  origin('center'),
                  area(),
                  pos((distance+10+i)*SCALE, height()- SCALE*starHeight),
                  z(Z.game),
                  'star',
                  'skyObject',
                  { value: current.value },
                ]);
              };
            };
          };
        };

        if (rand(0,100) < 15) {
          add([
            sprite('flora', { 
              frame: randi(0,3),
              flipX: rand(0,100) < 50 ? true : false,
            }),
            scale(TILE * rand(0.7, 1)),
            origin('botleft'),
            pos((distance+10)*SCALE, height() - SCALE * rand(0.8, 0.9)),
            z(Z.game),
          ]);
        };
        
        if (rand(0,100) < 4 + upgradeMod(4)) {
          add([
            sprite('trampoline'),
            scale(TILE*1.9),
            origin('botleft'),
            area({ height: 160 }),
            pos((distance+10)*SCALE, height()-SCALE*0.75),
            z(Z.game +1),
            "trampoline",
            {
              used: false,
            }
          ]);
        };
      };

      // end of spawning

      if (isMouseDown() || isKeyDown('space')) {
        if (fuel > 0) {
          shake(SCALE/12);
          chicken.yv += 0.8 * (1+upgradeMod(5));
          chicken.xv += 0.3 * (1+upgradeMod(5));
          fuel -= 60*dt();
          rocket.frame = 1;
          add([
            circle(SCALE*0.1),
            color(rgb(100,100,100)),
            lifespan(0.2, { fade: 0.2 }),
            pos(chicken.pos.add(
              SCALE*rand(-0.1, 0.1),
              SCALE*rand(-0.1, 0.1),
            )),
          ]);
        } else {
          detatchAnim();
          rocket.frame = 0;
        };
      } else {
        rocket.frame = 0;
      };

    };

    // end of chicken motion thingy idk

    every('ground', (g) => {
      if (camPos().sub(center()).x >= g.pos.x+SCALE) {
        g.pos.x += SCALE*12;
      };
    });

    let flooredTime = Math.floor(time()*3);
    if (flooredTime != lastCleanup) {
      lastCleanup = flooredTime;
      every('skyObject', (s) => {
        if (s.pos.x <= chicken.pos.x - SCALE*7) {
          destroy(s);
        };
      });
    };

    let n = -0.28;
    rocket.pos = chicken.pos.add(
      Math.sin((chicken.angle+90) /57)*SCALE*n,
      -Math.cos((chicken.angle+90) /57)*SCALE*n,
    );
    rocket.angle = chicken.angle;

    vaporCone.pos = chicken.pos;
    vaporCone.angle = chicken.angle;
    vaporCone.opacity = Math.max(0, -0.16 * Math.abs(velocity - 343) + 1);

    groundFix.pos.x = -width() + camPos().x;

    let blackSky1 = 30000;
    let blackSky2 = blackSky1 * 0.6;
    bgRect.color = rgb(
      Math.max(0, (blackSky2 - altitude) / blackSky2 * 100),
      Math.max(0, (blackSky2 - altitude) / blackSky2 * 200),
      Math.max(0, (blackSky1 - altitude) / blackSky1 * 255),
    );

    every('btnOutline', (o) => {
      o.color = o.isHovering() ? WHITE : BLACK;
    });

    fuelValue.width = SCALE*1.92 * (fuel / maxFuel);

    if (fuel <= maxFuel/5) {
      fuelValue.color = Math.floor(time()*10) % 2 == 0 ? YELLOW : RED;
    } else {
      fuelValue.color = YELLOW;
    };

    if (debugMode) {
      if (isKeyDown('z')) {
        debugZoomNum += 1*dt();
        debugZoom = Math.cos(debugZoomNum)/2.5 +0.6;
        camScale(debugZoom);
      };
    } else {
      camScale(Math.max(Math.min(
        (-1/3000) * altitude + 1 + (20/3000) 
      , 1), 0.35));
    };


    if (debugMode) 
      debug.log(` add: ${starsRendered} / ${starsPossible} \n obj: ${debug.objCount()}\n fps: ${debug.fps()} ( -${60-debug.fps()} ) \nzoom: ${debugZoom.toFixed(1)}`)
  });


  /////////////////////////
  /////////////////////////
  /////////////////////////
  /////////////////////////
  /////////////////////////
  /////////////////////////
  /////////////////////////
  

  function showEndMenu() {
    stopped = true;
    if (!endMenuShown) {
      endMenuShown = true;
      add([
        rect(width(), height()),
        pos(0,0),
        fixed(),
        color(BLACK),
        opacity(0.4),
        z(Z.shade),
      ]);
  
      const endBack = add([
        rect(width()*0.8, height()*0.8),
        pos(center()),
        fixed(),
        color(BLACK),
        opacity(0.75),
        origin('center'),
        scale(0),
        z(Z.shade),
      ]);
      endBack.radius = SCALE/3;
      
      for (let i = 0; i < 20; i++) {
        setTimeout(() => {
          endBack.scale = endBack.scale.add(0.05, 0.05);
        }, i*10);
      };

      setTimeout(() => {
        add([
          text('Flight complete!', {
            align: 'center',
            size: SCALE*0.75,
            font: 'rubik',
          }),
          pos(width()/2, SCALE*1.5),
          origin('center'),
          z(Z.endBtns),
          fixed(),
          scale(vec2(1.11, 1)),
          opacity(0),
          'endUI',
        ]);

        add([
          rect(SCALE*3.25, SCALE*0.75),
          pos(SCALE*4.725, SCALE*4.175),
          origin('topright'),
          color(BLACK),
          z(Z.endBtns-1),
          fixed(),
          opacity(0),
          area(),
          'endUI',
          'endBtn',
          'btnOutline',
        ]);
        
        const retryBtn = add([
          rect(SCALE*3.2, SCALE*0.7),
          pos(SCALE*4.7, SCALE*4.2),
          origin('topright'),
          color(rgb(0,160,0)),
          z(Z.endBtns),
          fixed(),
          opacity(0),
          area(),
          'endUI',
          'endBtn',
          'retry'
        ]);

        add([
          rect(SCALE*3.0, SCALE*0.5),
          pos(SCALE*4.6, SCALE*4.3),
          origin('topright'),
          color(rgb(0,200,0)),
          z(Z.endBtns),
          fixed(),
          opacity(0),
          'endUI',
          'endBtn',
        ]);

        add([
          text('RETRY', {
            align: 'center',
            width: SCALE*3,
            size: SCALE*0.4,
            font: 'manrope',
            letterSpacing: SCALE*0.03,
          }),
          pos(SCALE*4.6, SCALE*4.38),
          origin('topright'),
          fixed(),
          opacity(0),
          z(Z.endBtns),
          'endUI'
        ]);

        const shopBtn = add([
          rect(SCALE*3.2, SCALE*0.7),
          pos(SCALE*5.3, SCALE*4.2),
          origin('topleft'),
          color(rgb(80,80,80)),
          z(Z.endBtns),
          fixed(),
          opacity(0),
          area(),
          'endUI',
          'endBtn',
          'shop'
        ]);

        add([
          rect(SCALE*3.25, SCALE*0.75),
          pos(SCALE*5.275, SCALE*4.175),
          origin('topleft'),
          color(BLACK),
          z(Z.endBtns-1),
          fixed(),
          opacity(0),
          area(),
          'endUI',
          'endBtn',
          'btnOutline',
        ]);

        add([
          rect(SCALE*3.0, SCALE*0.5),
          pos(SCALE*5.4, SCALE*4.3),
          origin('topleft'),
          color(rgb(100,100,100)),
          z(Z.endBtns),
          fixed(),
          opacity(0),
          'endUI',
          'endBtn',
        ]);

        add([
          text('SHOP', {
            align: 'center',
            width: SCALE*3,
            size: SCALE*0.4,
            font: 'manrope',
            letterSpacing: SCALE*0.03,
          }),
          pos(SCALE*5.4, SCALE*4.38),
          origin('topleft'),
          fixed(),
          opacity(0),
          z(Z.endBtns),
          'endUI'
        ]);

        every('endBtn', (b) => {
          b.radius = SCALE/5;
        });

        let moneyGain = Math.floor(
          score/2 +
          getScore(distanceF -16) +
          getScore(maxAltitude -3)
        );
        if (moneyGain.toString() == 'NaN') moneyGain = 0;
        
        STUFF.money += moneyGain;

        let somethingAffordable = false;

        for (let i = 0; i < OFFERS.length; i++) {
          somethingAffordable = (truePrice(i) <= STUFF.money);
          if (somethingAffordable) break;
        };
        
        if (somethingAffordable) {
          add([
            sprite('attention'),
            pos(SCALE*8.435, SCALE*4.275),
            origin('center'),
            scale(TILE/4),
            z(Z.endBtns +3),
            fixed(),
            opacity(0),
            'endUI',
          ]);
        };
  
        add([
          text(`Distance: \nApogee: \nPoints: \nMoney Gained: \n\nBalance:`, {
            size: SCALE*0.27,
            align: 'left',
            width: SCALE*2.5,
            font: 'ubuntu',
            lineSpacing: SCALE*0.05,
            letterSpacing: SCALE*0.01,
          }),
          pos(center().sub(2*SCALE, 0)),
          origin('center'),
          z(Z.endBtns),
          fixed(),
          opacity(0),
          'endUI',
        ]);
        
        add([
          text(`${shortNum(parseFloat(parseFloat(distanceF).toFixed(1)))}m\n ${shortNum(parseFloat(parseFloat(maxAltitude).toFixed(1)))}m\n ${shortNum(score)}\n +$${shortNum(moneyGain)}\n\n $${shortNum(STUFF.money)}`, {
            size: SCALE*0.27,
            align: 'right',
            width: SCALE*5,
            font: 'ubuntu',
            lineSpacing: SCALE*0.05,
            letterSpacing: SCALE*0.01,
          }),
          pos(center().add(0.75*SCALE, 0)),
          origin('center'),
          z(Z.endBtns),
          color(rgb(0,255,0)),
          fixed(),
          opacity(0),
          'endUI',
        ]);

        for (let i = 0; i < 10; i++) {
          setTimeout(() => {
            every('endUI', (e) => {
              e.opacity += 0.1;
            });
          }, i*15);
        };

        STUFF.best = Math.max(STUFF.best || 0, Math.floor(distanceF));
        window.__bcRun = { distance: distanceF, altitude, maxAltitude, score, ended: true };
        bcStoreSave(STUFF);

        onClick('retry', (r) => {
          fadeOut();
          setTimeout(() => { go('retry'); }, FADE_TIME);
        });

        onClick('shop', (r) => {
          fadeOut();
          setTimeout(() => { go('shop'); }, FADE_TIME);
        });
      }, 200);
    };

  };
  
});
</script>
<script>
/* code/shop.js */
scene('retry', () => {
  add([
    rect(width(), height()),
    pos(0,0),
    color(BLACK),
  ])
  go('game');
});

function truePrice(x) {
  let ox = OFFERS[x];
  return Math.floor(ox.cost * ox.expo ** STUFF.upgrades[x]);
};

// Actual shop:

scene('shop', () => {
  const Z = {
    bg:      0,
    shop:  100,
    top:   200,
    black: 300,
  };

  var selectedOffer = 0;

  add([
    rect(width(), height()),
    pos(0,0),
    z(Z.bg),
    opacity(1),
    color(rgb(110,65,30)),
    fixed(),
  ]);


  const black = add([
    rect(width(), height()),
    pos(0,0),
    z(Z.black),
    opacity(1),
    color(BLACK),
    fixed(),
  ]);

  for (let f = 0; f < 20; f++) {
    setTimeout(() => {
      black.opacity -= 0.05;

  let fadingOut = false;

      fadingOut = true;
      for (let f = 0; f < 20; f++) {

          black.opacity += 0.05;
        }, f * FADE_TIME / 20);

    add([
      text('SHOP', {
        size: SCALE*1.3,
        align: 'center',
        font: 'rubik',
      }),
      pos(width()/2 +xOff, SCALE/3 +yOff),
      origin('top'),
      z(Z.top +(i == 0 ? 2:1)),
      color(i == 0 ? WHITE:BLACK),

  };
    
  for (let i = 0; i < 5; i++) {
    add([
      sprite('shopRoof', { frame:1 }),
      scale(2*TILE),
      pos(i*2*SCALE, SCALE*0.2),
      z(Z.top),
      opacity(0.2),
    ]);
    add([
      sprite('shopRoof'),
      scale(2*TILE),
      pos(i*2*SCALE, 0),
      z(Z.top),
    ]);
  };

  add([
    sprite('shopNav'),
    scale(TILE * 2/3),
    pos(SCALE/10, SCALE/10),
    z(Z.top),
    area(),
    "menu",
    "navButton",
  ]);
  add([
    sprite('shopNav', { frame:1 }),
    scale(TILE * 2/3),
    pos(SCALE*0.8, SCALE/10),
    z(Z.top),
    area(),
    "retry",
    "navButton",
  ]);


  for (let i = 0; i < 9; i++) {
    let border = SCALE*0.02;
    let xOff = Math.sin( (Math.PI * i) /4 ) *border;
    let yOff = Math.cos( (Math.PI * i) /4 ) *border;
    if (i == 0) { xOff = 0; yOff = 0; };
    add([
      text(`Balance: $${STUFF.money}`, {
        size: SCALE*0.3,
        font: 'ubuntu',
      }),
      pos(SCALE*0.8 +xOff, SCALE*2.6 +yOff),
      origin('botleft'),
      z(Z.top +(i == 0 ? 2:1)),
      color(i == 0 ? WHITE:BLACK),
      "balance",
    ]);
  };

  let yCenter = (height() - SCALE*2)/2 + SCALE*2.2;
  let xCount = 3;
  let yCount = 2;
  for (let y = 0; y < yCount; y++) {
    for (let x = 0; x < xCount; x++) {
      let index = y*3 + x;
      let itemPos = vec2(
        width()/2 + (-xCount/2 +x-0.88)*SCALE*1.5,
        yCenter + (-yCount/2 +y+0.5)*SCALE*1.5, 
      );
      
      add([
        sprite('box', { frame:1 }),
        scale(TILE*1.3),
        pos(itemPos),
        origin('center'),
        z(Z.shop),
        area(),
        "shopButton",
        {
          btn: index,
        }
      ]);
      add([
        sprite('outline'),
        scale(TILE*1.3),
        pos(itemPos),
        origin('center'),
        z(Z.shop),
        area(),
        opacity(0),
        "outline"
      ]);

      add([
        sprite('upgrades', { frame: index }),
        scale(TILE*1.1),
        pos(itemPos),
        origin('center'),
        z(Z.shop),
      ]);

      add([
        text('0', {
          font: 'ubuntu',
          size: SCALE*0.25,
          align: 'right',
        }),
        pos(itemPos.add(SCALE*0.55, SCALE*0.55)),
        origin('botright'),
        z(Z.shop),
        "counter",
        {
          forOffer: index,
        }
      ]);
    };
  };

  for (let i = 0; i < 4; i++) {
    add([
      sprite('shopGroove'),
      pos(SCALE*5, SCALE*1.5 + SCALE*i),
      scale(TILE*2),
      z(Z.bg),
    ]);
  };

  const buyBtn = add([
    rect(SCALE*3.2, SCALE*0.7),
    pos(SCALE*8.1, SCALE*5.3),
    origin('center'),
    color(rgb(80,80,80)),
    z(Z.shop),
    area(),
    'buyBtn',
    'buyRect',
  ]);

  const buyBtnInner = add([
    rect(SCALE*3.0, SCALE*0.5),
    pos(buyBtn.pos),
    origin('center'),
    color(rgb(100,100,100)),
    z(Z.shop),
    'buyRect',
  ]);

  add([
    rect(SCALE*3.25, SCALE*0.75),
    pos(buyBtn.pos),
    origin('center'),
    color(BLACK),
    z(Z.shop -1),
    area(),
    'buyRect',
    'btnOutline',
  ]);

  const price = add([
    text(' ', {
      align: 'center',
      width: SCALE*3,
      size: SCALE*0.4,
      font: 'manrope',
      letterSpacing: SCALE*0.03,
    }),
    pos(buyBtn.pos.add(0, SCALE*0.03)),
    origin('center'),
    z(Z.shop),
  ]);

  const selectedBox = add([
    sprite('box'),
    origin('center'),
    pos(SCALE*8.07, SCALE*3),
    scale(TILE*1.5),
    z(Z.shop),
  ]);
    
  const largeIcon = add([
    sprite('upgrades'),
    origin('center'),
    pos(SCALE*8.07, SCALE*3),
    scale(TILE*1.26),
    z(Z.shop),
  ]);
  
  add([
    rect(SCALE*3.5, SCALE*0.5),
    pos(largeIcon.pos.add(0, SCALE*0.7)),
    origin('center'),
    z(Z.shop),
    color(BLACK),
    opacity(0.5),
    'buyRect',
  ]);

  const label = add([
    text(' ', {
      size: SCALE*0.3,
      align: 'center',
      width: SCALE*3.5,
      font: 'rubik',
    }),
    pos(largeIcon.pos.add(0, SCALE*0.7)),
    origin('center'),
    z(Z.shop),
  ]);

  const description = add([
    text(' ', {
      size: SCALE*0.2,
      align: 'left',
      width: SCALE*3,
      font: 'ubuntu',
    }),
    pos(label.pos.add(0, SCALE*0.71)),
    origin('center'),
    z(Z.shop)
  ]);

  every('buyRect', (b) => {
    b.radius = SCALE/5;
  });

  function updateShop() {
    let item = OFFERS[selectedOffer];
    
    largeIcon.frame = selectedOffer;
    price.text = `$${shortNum(truePrice(selectedOffer))}`;
    label.text = item.name;
    description.text = item.desc;

    every('balance', (b) => {
      b.text = `Balance: $${STUFF.money.toLocaleString('en-US')}`;
    });

    every('shopButton', (b) => {
      let affordable = truePrice(b.btn) <= STUFF.money;
      let boxColor = affordable ? 0:1;
      b.frame = boxColor;

      if (selectedOffer == b.btn) {
        selectedBox.frame = boxColor;
        let c1 = affordable ? 160 : 80;
        let c2 = affordable ? 200 : 100;
        buyBtn.color = affordable ? 
          rgb(0,c1,0) : rgb(c1,c1,c1);
        buyBtnInner.color = affordable ? 
          rgb(0,c2,0) : rgb(c2,c2,c2);
      };
    });

    every('counter', (c) => {
      c.text = STUFF.upgrades[c.forOffer];
    });
  };
  updateShop();

  onClick('shopButton', (b) => {
    selectedOffer = b.btn;
    updateShop();
  });

  onClick('buyBtn', (b) => {
    if (truePrice(selectedOffer) <= STUFF.money) {
      STUFF.money -= truePrice(selectedOffer);
      STUFF.upgrades[selectedOffer]++;
      bcStoreSave(STUFF);
      updateShop();
    };
  });

  onClick('menu', (m) => {
    fadeOut();
    setTimeout(() => { go('menu'); }, FADE_TIME);
  });
  onClick('retry', (m) => {
    fadeOut();
    setTimeout(() => { go('retry'); }, FADE_TIME);
  });

  onUpdate(() => {
    every('btnOutline', (o) => {
      o.color = o.isHovering() ? WHITE : BLACK;
    });
    every('outline', (o) => {
      o.opacity = o.isHovering() ? 1 : 0;
    });
    every('navButton', (o) => {
      o.scale = o.isHovering() ? vec2(TILE*0.73) : vec2(TILE*2/3);
    });
  });
});
</script>
<script>
/* code/menu.js */
scene('menu', () => {
  const Z = {
    bg:      0,
    ui:    100,
    black: 200,
  };
  
  add([
    rect(width(), height()),
    pos(0,0),
    color(rgb(100,200,250)),
  ]);

  const black = add([
    rect(width(), height()),
    pos(0,0),
    z(Z.black),
    opacity(1),
    color(BLACK),
    fixed(),
  ]);

  for (let f = 0; f < 20; f++) {
    setTimeout(() => {
      black.opacity -= 0.05;
    }, f*15);
  };

  let fadingOut = false;
  function fadeOut() {
    if (!fadingOut) {
      fadingOut = true;
      for (let f = 0; f < 20; f++) {
        setTimeout(() => {
          black.opacity += 0.05;
        }, f * FADE_TIME / 20);
      };
    };
  };

  add([
    sprite('logo'),
    pos(center().sub(0, SCALE*0.9)),
    origin('center'),
    scale(TILE*7),
    z(Z.ui),
  ]);

  for (let i = 0; i < 1; i++) {
    let btnPos = vec2(center().add(0, SCALE*(0.9 + i)));

    add([
      text(['PLAY', 'HELP'][i], {
        align: 'center',
        size: SCALE*0.4,
        font: 'manrope',
      }),
      pos(btnPos.add(0, SCALE*0.03)),
      origin('center'),
      color(WHITE),
      z(Z.ui +1),
    ])

    add([
      rect(SCALE*3.25, SCALE*0.75),
      pos(btnPos),
      origin('center'),
      color(BLACK),
      z(Z.ui),
      area(),
      'button',
      'btnOutline',
    ]);

    add([
      rect(SCALE*3.2, SCALE*0.7),
      pos(btnPos),
      origin('center'),
      color(rgb(80,80,80)),
      z(Z.ui),
      area(),
      'button',
      'clickable',
      {
        goTo: ['game', 'help'][i],
      }
    ]);
  
    add([
      rect(SCALE*3.0, SCALE*0.5),
      pos(btnPos),
      origin('center'),
      color(rgb(100,100,100)),
      z(Z.ui),
      'button',
    ]);
  };

  every('button', (r) => {
    r.radius = SCALE/5;
  });

  onClick('clickable', (b) => {
    fadeOut();
    setTimeout(() => {
      go(b.goTo);
    }, FADE_TIME);
  });

  function newCloud(p) {
    add([
      sprite('cloud'),
      pos(p),
      scale(TILE*rand(2, 4)),
      move(180, SCALE),
      z(Z.bg),
      opacity(0.3),
    ]);
  };

  for (let i = 0; i < 6; i++) {
    newCloud(vec2(
      rand(0, width()),
      rand(0, height()),
    ));
  };

  onUpdate(() => {
    if (rand(0,100) < 6) {
      let speed = rand(15,22);
      let angle = randi(45, 80);
      add([
        sprite('chicken'),
        pos(rand(-2,9)*SCALE, -SCALE),
        origin('center'),
        move(angle, SCALE*speed),
        scale(TILE*1.5),
        rotate(angle),
        z(Z.bg +1),
      ]);
    };

    every('btnOutline', (o) => {
      o.color = o.isHovering() ? WHITE : BLACK;
    });

    if (rand(0,400) < 2) {
      newCloud(vec2(
        width()+10, 
        rand(-1,7)*SCALE
      ));
    };

    onKeyPress('a', () => {
      go('achievements');
    });
    
  });
});

go('menu');
</script>
<script>
/* code/achieve.js */
scene('achievements', () => {
  const Z = {
    bg:    0,
    main:  100,
    top:   200,
    black: 300,
  };

  var mainScroll = 0;

  const black = add([
    rect(width(), height()),
    pos(0,0),
    z(Z.black),
    opacity(1),
    color(BLACK),
    fixed(),
  ]);

  for (let f = 0; f < 20; f++) {
    setTimeout(() => {
      black.opacity -= 0.05;
    }, f*15);
  };

  let fadingOut = false;
  function fadeOut() {
    if (!fadingOut) {
      fadingOut = true;
      for (let f = 0; f < 20; f++) {
        setTimeout(() => {
          black.opacity += 0.05;
        }, f * FADE_TIME / 15);
      };
    };
  };

  for (let j = 0; j < 2; j++) {
    for (let i = 0; i < [1,6][j]; i++) {
      let border = SCALE*0.01;
      let xOff = Math.sin( (Math.PI * i) /2 ) *border;
      let yOff = Math.cos( (Math.PI * i) /2 ) *border;
      if (i == 0) { xOff = 0; yOff = 0; };

      add([
        text('ACHIEVEMENTS', {
          size: SCALE*0.87,
          align: 'center',
          font: 'burned',
          letterSpacing: SCALE*0.04,
        }),
        pos(width()/2 +xOff, SCALE*0.37 +yOff),
        origin('top'),
        z(Z.top +1),
        color(BLACK),
        rotate(-1.5),
      ]);
    };
  };

  add([
    rect(width(), SCALE*1.6),
    pos(0,0),
    color(rgb(240,240,240)),
    z(Z.top),
  ]);

  for (let i = 0; i < 2; i++) {
    add([
      rect(width(), SCALE*0.1),
      pos(0, SCALE*(1.6 + (i*0.1))),
      color(BLACK),
      opacity((2-i)*0.1),
      z(Z.top),
    ]);
  };

  for (let i = 0; i < 2; i++) {
    add([
      rect(width(), SCALE/15),
      pos(0, SCALE*(0.7*(i+1) -0.3)),
      color(rgb(140,170,245)),
      z(Z.top),
    ])
  };

  for (let i = 0; i < 4; i++) {
    for (let j = 0; j < 2; j++) {
      add([
        sprite('cork'),
        pos(center().add(0, j*SCALE*10)),
        scale(TILE*5),
        origin(['topleft', 'botleft', 'topright', 'botright'][i]),
        z(Z.bg),
        "scrollable",
        {
          startY: center().y + j*SCALE*10,
        }
      ]);
    };
  };

  add([
    sprite('markerHouse'),
    scale(TILE * 2/3),
    pos(SCALE/10, SCALE/10),
    z(Z.top),
    area(),
    rotate(3),
    "menu",
    "navButton",
  ]);


  /*
  EEEEEE
  EEEEEEEEEEE

  Main Content
  (grammar mode enabled)

  EEEEEEEEEEE
  EEEEEE
  */

  let achKeys = Object.keys(ACHIEVEMENTS);
  let achLength = achKeys.length;

  for (let i = 0; i < achLength; i++) {
    let rowMod = 8;
    let sy = SCALE*(2.7 + 1.1*Math.floor(i / rowMod));
    if (STUFF.achievements.includes(achKeys[i])) {
      for (let l = 0; l < 2; l++) {
        if (!(ACHIEVEMENTS[achKeys[i]].icon[1] == -1 && l == 0)) {
          add([
            sprite(['banner', 'achievements'][l], { frame: (ACHIEVEMENTS[achKeys[i]].icon[1-l]) }),
            pos(SCALE*(1.15 + 1.1*(i % rowMod)), sy),
            origin('center'),
            scale(TILE*0.8),
            z(Z.main + l),
            "scrollable",
            {
              startY: sy,
            }
          ]);
        };
      };
    } else {
      add([
        circle(SCALE*0.2),
        pos(SCALE*(1.15 + 1.1*(i % rowMod)), sy),
        origin('center'),
        color(BLACK),
        opacity(0.15),
        z(Z.main),
        "scrollable",
        {
          startY: sy,
        }
      ]);
    };
  };


  



  onClick('menu', (m) => {
    fadeOut();
    setTimeout(() => { go('menu'); }, FADE_TIME);
  });

  let startHold = 0;
  let startScroll = 0;
  let scrollDiff = 0;
  let holdWait = true;

  onUpdate(() => {
    if (isMouseDown()) {
      if (holdWait) {
        holdWait = false;
        startHold = mousePos().y / SCALE;
        scrollDiff = 0;
        startScroll = mainScroll;
      };

      scrollDiff = startHold - mousePos().y / SCALE;
      mainScroll = Math.max(0, Math.min(2, startScroll + scrollDiff));
      
    } else {
      holdWait = true;
    };
    
    every('navButton', (o) => {
      o.scale = o.isHovering() ? vec2(TILE*0.73) : vec2(TILE*2/3);
    });
    every('scrollable', (s) => {
      s.pos.y = s.startY - mainScroll*SCALE;
    });
  });
  
});
</script>
