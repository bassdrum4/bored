<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>8 Ball</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#14161a;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
  canvas{display:block;touch-action:none;cursor:crosshair}
  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(10,14,11,.88);backdrop-filter:blur(3px);z-index:10;user-select:none}
  .overlay.hidden{display:none}
  .title{font-size:clamp(44px,9vw,84px);font-weight:800;letter-spacing:6px;color:#f4f0e6;
    text-shadow:0 4px 0 #0a3b1e,0 8px 24px rgba(0,0,0,.6)}
  /* the 8 is the ball itself: black sphere, white number patch, dark numeral */
  .title .b8{position:relative;display:inline-block;width:.82em;height:.82em;border-radius:50%;vertical-align:-.07em;
    background:radial-gradient(circle at 34% 28%,#5b5b64 0%,#26262c 36%,#0a0a0d 100%);
    box-shadow:inset 0 -.02em .06em rgba(0,0,0,.75),0 .05em .12em rgba(0,0,0,.55)}
  .title .b8 b{position:absolute;inset:25%;display:flex;align-items:center;justify-content:center;
    border-radius:50%;background:#f6f3ea;color:#15151a;letter-spacing:0;text-shadow:none;
    font:800 .30em/1 system-ui,sans-serif;box-shadow:inset 0 0 .02em rgba(0,0,0,.28)}
  .sub{margin-top:10px;font-size:13px;letter-spacing:2px;color:#9fb3a6}
  .btn{margin-top:14px;width:min(300px,78vw);padding:14px 20px;font:600 17px/1 system-ui,sans-serif;letter-spacing:1px;
    color:#0c3d21;background:linear-gradient(#49d17a,#2aa858);border:0;border-radius:12px;cursor:pointer;
    box-shadow:0 3px 0 #1c7a3d,0 8px 20px rgba(0,0,0,.45)}
  .btn:active{transform:translateY(2px);box-shadow:0 1px 0 #1c7a3d}
  .btn.ghost{background:linear-gradient(#5a6d60,#3e524a);color:#e7efe9;box-shadow:0 3px 0 #24312b,0 8px 20px rgba(0,0,0,.45)}
  .btn small{display:block;margin-top:5px;font:500 10.5px/1 system-ui,sans-serif;letter-spacing:.5px;opacity:.72}
  .btn.tight{margin-top:8px;padding:11px 18px}
  .hint{margin-top:26px;font-size:12.5px;color:#77887d;line-height:2;text-align:center}
  .result{font-size:clamp(34px,7vw,60px);font-weight:800;letter-spacing:3px}
  #resColor.win{color:#49d17a}#resColor.lose{color:#e0574f}#resColor.tie{color:#e8c95c}
  #toasts{position:fixed;top:52px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:5}
  .toast{background:rgba(12,20,15,.88);color:#e7efe9;font:600 13px/1 system-ui,sans-serif;letter-spacing:.6px;
    padding:9px 18px;border-radius:20px;border:1px solid rgba(255,255,255,.12);box-shadow:0 4px 14px rgba(0,0,0,.4);
    animation:tin .18s ease-out}
  .toast.warn{background:rgba(60,17,14,.9);color:#ffb9b3;border-color:rgba(255,120,110,.35)}
  .toast.good{background:rgba(14,44,26,.9);color:#9ff0b6;border-color:rgba(90,220,140,.35)}
  .toast.out{opacity:0;transform:translateY(-8px);transition:all .3s}
  @keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="toasts"></div>

<div class="overlay" id="menu">
  <div class="title"><span class="b8"><b>8</b></span> BALL</div>
  <div class="sub">CLASSIC POOL &middot; FIRST TO POT THE 8</div>
  <button class="btn" id="btn2p">TWO PLAYERS</button>
  <button class="btn ghost" id="btnCpu">PLAY VS COMPUTER</button>
  <div class="hint">
    Click the felt to aim, click again to set the angle. Power, english<br>
    and the shoot button live in the rail beside the table.<br>
    Pot your group, then the 8. Foul and your opponent shoots.
  </div>
</div>

<div class="overlay hidden" id="diff">
  <div class="title" style="font-size:clamp(28px,5.6vw,46px);letter-spacing:4px">VS COMPUTER</div>
  <div class="sub">PICK ITS BRAIN</div>
  <button class="btn tight" data-diff="easy">EASY<small>loose aim, sloppy safeties</small></button>
  <button class="btn tight" data-diff="normal">NORMAL<small>reads the table, plays position</small></button>
  <button class="btn tight" data-diff="hard">HARD<small>deeper search, better leaves</small></button>
  <button class="btn ghost tight" id="btnDiffBack">BACK</button>
</div>

<div class="overlay hidden" id="over">
  <div class="result" id="resColor">YOU WIN</div>
  <div class="sub" id="resSub">Nice rack.</div>
  <button class="btn" id="btnRematch">REMATCH</button>
  <button class="btn ghost" id="btnMenu">MAIN MENU</button>
</div>

<script>
'use strict';
(() => {

/* ================= canvas / fit ================= */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let SW=0, SH=0, DPR=1;
let VERT = false;              // portrait layout: table rotated 90°, rack at top
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  SW = window.innerWidth; SH = window.innerHeight;
  VERT = SH > SW;
  cv.width = Math.round(SW*DPR); cv.height = Math.round(SH*DPR);
  cv.style.width = SW+'px'; cv.style.height = SH+'px';
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', resize);
if(window.visualViewport) window.visualViewport.addEventListener('resize', resize);
cv.addEventListener('contextmenu', e => e.preventDefault());
resize();

/* ================= world constants ================= */
const PW = 220, PH = 110;          // playfield size
const R  = 3.05;                   // ball radius
const RAIL = 8;                    // rail thickness
const CORNER_PR = 5.6, SIDE_PR = 5.1;
const JAW = 4.7;                   // corner gap from corner along rail
const SIDEGAP = 3.9;               // half-gap of side pockets
const FRICTION = 1.0;              // per-second exponential: slower cloth, longer rolls
const CUSH = 0.72;                 // cushion restitution
const BB_E = 0.94;                 // ball-ball restitution
const STOPV = 9;                   // snapshot stop speed
const MAXPOWER = 780;              // px/s at a full slider: a break, not a nudge
const SPIN_CURVE = 0.55;           // side spin bends the cue ball's line
const SPIN_THROW = 0.38;           // side spin throws the object ball off line
const SPIN_FOLLOW = 0.90;          // top/bottom spin carries the cue through contact
const SPIN_DECAY = 1.8;            // how fast english dies on the cloth
const D2R = Math.PI/180;

const POCKETS = [
  {x:0,   y:0,   r:CORNER_PR},
  {x:PW,  y:0,   r:CORNER_PR},
  {x:0,   y:PH,  r:CORNER_PR},
  {x:PW,  y:PH,  r:CORNER_PR},
  {x:PW/2,y:-1.1,r:SIDE_PR},
  {x:PW/2,y:PH+1.1,r:SIDE_PR},
];

const BALL_COLORS = {
  0:'#f6f2ea',
  1:'#f2c114',2:'#1753c4',3:'#d3312d',4:'#5b2d8e',5:'#e07a1f',
  6:'#0f7a3d',7:'#7a2026',8:'#15151a',
  9:'#f2c114',10:'#1753c4',11:'#d3312d',12:'#5b2d8e',13:'#e07a1f',
  14:'#0f7a3d',15:'#7a2026'
};
const groupOf = id => id===8 ? 'eight' : (id===0 ? 'cue' : (id<8 ? 'solid' : 'stripe'));

/* ================= audio ================= */
/* All synthesised: band-passed noise for the clack of ball on ball, a low thump
   for the rails, and a pentatonic ping that climbs as a run builds. */
let AC=null, MASTER=null, NOISE_BUF=null, lastClack=0, lastCush=0;
let PREVIEW = false;               // rolling the aim line must not make a sound or pot a ball
function audio(){
  if(!AC){
    try{
      AC = new (window.AudioContext||window.webkitAudioContext)();
      MASTER = AC.createGain(); MASTER.gain.value = .55; MASTER.connect(AC.destination);
      const n = Math.floor(AC.sampleRate*.5);
      NOISE_BUF = AC.createBuffer(1, n, AC.sampleRate);
      const d = NOISE_BUF.getChannelData(0);
      for(let i=0;i<n;i++) d[i] = Math.random()*2 - 1;
    }catch(e){ AC = null; }
  }
  if(AC && AC.state==='suspended') AC.resume();
  return AC;
}
function tone(freq, dur, vol, type, opts){
  const ac = audio(); if(!ac || !MASTER) return;
  const t = ac.currentTime + ((opts && opts.delay) || 0);
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t);
  if(opts && opts.to) o.frequency.exponentialRampToValueAtTime(Math.max(30, opts.to), t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(.0002, vol), t + .005);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(MASTER);
  o.start(t); o.stop(t + dur + .03);
}
function burst(dur, vol, freq, q, delay){
  const ac = audio(); if(!ac || !NOISE_BUF) return;
  const t = ac.currentTime + (delay || 0);
  const src = ac.createBufferSource(); src.buffer = NOISE_BUF;
  src.playbackRate.value = .8 + Math.random()*.5;
  const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = q || 1;
  const g = ac.createGain();
  g.gain.setValueAtTime(Math.max(.0002, vol), t);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  src.connect(bp); bp.connect(g); g.connect(MASTER);
  src.start(t); src.stop(t + dur + .03);
}
const level = v => Math.max(.04, Math.min(1, v));
const sndClick = v => {
  if(PREVIEW) return;
  const ac = audio(); if(!ac) return;
  if(ac.currentTime - lastClack < .009) return;
  lastClack = ac.currentTime;
  const k = level(v);
  burst(.03, .10*k + .025, 2100 + Math.random()*1100, 1.1);
  tone(680 + 420*k, .045, .045*k + .006, 'triangle', {to: 380});
};
const sndCush = v => {
  if(PREVIEW) return;
  const ac = audio(); if(!ac) return;
  if(ac.currentTime - lastCush < .03) return;
  lastCush = ac.currentTime;
  const k = level(v);
  burst(.07, .07*k + .02, 340, .7);
  tone(140, .1, .05*k + .012, 'sine', {to: 62});
};
const sndCue = p => {
  burst(.028, .10 + .05*p, 2700, 1.4);
  tone(300, .09, .035 + .05*p, 'sine', {to: 110});
};
const PENT = [0, 2, 4, 7, 9, 12, 14, 16];
const sndPot = n => {
  tone(560, .10, .10, 'sine', {to: 210});
  burst(.14, .06, 260, .6);
  const st = PENT[Math.min(PENT.length - 1, n || 0)];
  tone(523.25*Math.pow(2, st/12), .18, .055, 'triangle', {delay: .055});
};
const sndScratch = () => {
  tone(330, .16, .065, 'sine', {to: 190});
  tone(250, .24, .055, 'sine', {to: 110, delay: .11});
};
const sndFoul = () => tone(170, .22, .05, 'sawtooth', {to: 110});
const sndSpin = () => tone(880, .03, .018, 'square');
const sndWin  = () => [0,4,7,12].forEach((s,i)=> tone(523.25*Math.pow(2,s/12), .22, .05, 'triangle', {delay:i*.09}));
const sndLose = () => [10,6,2].forEach((s,i)=> tone(392*Math.pow(2,s/12), .3, .05, 'sine', {delay:i*.13}));

/* ================= state ================= */
let balls = [];
let state = 'menu';           // menu|aim|hand|run|cpu|over
let mode = null;              // '2p'|'cpu'
let turn = 0;
let groups = [null, null];    // 'solid'|'stripe'
let openTable = true;
let breakShot = true;
let firstHit = null;
let pottedThisShot = [];
let aimMode = false;          // the pointer is steering the line
let aimLocked = false;        // the angle is set and the pointer no longer moves it
let dragSlider = false, dragSpin = false;
let power = 0.55;             // the power slider, 0..1 — no longer the drag distance
let spin = {x:0, y:0};        // cue-ball contact point, in ball radii, ±0.8
let difficulty = 'normal';
let aimAngle = 0;
let handX = PW*0.28, handY = PH/2, handOK = true;
let cpuTimer = 0;
let eightSafeties = 0;        // consecutive safeties played when only the 8 is left
let flashPocket = null;       // {x,y,t}
let guide = null;             // predicted path, computed for render
let nameOf = p => mode==='2p' ? (p?'P2':'P1') : (p ? 'CPU' : 'YOU');
const isCpu = () => mode==='cpu' && turn===1;

function ball(id){ return {id, x:0, y:0, vx:0, vy:0, alive:true}; }
const cue = () => balls[0];

function layout(){
  balls = [ball(0)];
  // legal-ish triangle, 8 in the centre, corners mixed
  const rows = [[1],[2,15],[9,8,3],[11,4,12,5],[10,13,6,14,7]];
  const apexX = PW*0.72, cy = PH/2, gapY = R*2.02, rowX = R*1.74;
  rows.forEach((row,ri)=>{
    row.forEach((id,ci)=>{
      const b = ball(id);
      b.x = apexX + ri*rowX;
      b.y = cy + (ci - (row.length-1)/2)*gapY;
      balls.push(b);
    });
  });
  const cb = balls[0]; cb.x = PW*0.24; cb.y = PH/2;
}

function startGame(m, keepTurn){
  mode = m;
  layout();
  groups = [null,null]; openTable = true; breakShot = true;
  firstHit = null; pottedThisShot = []; flashPocket = null; eightSafeties = 0;
  turn = keepTurn!==undefined ? keepTurn : (Math.random()<0.5 ? 0 : 1);
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('over').classList.add('hidden');
  aimAngle = 0; power = 0.55; spin.x = 0; spin.y = 0;
  aimMode = aimLocked = false; dragSlider = dragSpin = false;
  document.getElementById('diff').classList.add('hidden');
  if(isCpu()) beginCpu(true);
  else state = 'aim';
  hud(true);
}
function hud(){ /* render draws everything */ }

/* ================= toasts ================= */
const toastsEl = document.getElementById('toasts');
function toast(text, kind, ms){
  const t = document.createElement('div');
  t.className = 'toast' + (kind?' '+kind:'');
  t.textContent = text;
  toastsEl.appendChild(t);
  setTimeout(()=>{ t.classList.add('out'); }, (ms||1400));
  setTimeout(()=>{ t.remove(); }, (ms||1400)+400);
}

/* ================= physics ================= */
function potBall(b){
  b.alive = false; b.vx = b.vy = 0;
  if(PREVIEW) return;
  let np = POCKETS[0], nd = 1e9;
  for(const p of POCKETS){ const d=Math.hypot(b.x-p.x,b.y-p.y); if(d<nd){nd=d;np=p;} }
  flashPocket = {x:Math.max(0,Math.min(PW,np.x)), y:Math.max(0,Math.min(PH,np.y)), t:1};
  b.sw = b.fb = 0;
  sndPot(pottedThisShot.length);
  pottedThisShot.push(b.id);
}

function inCornerTL(x){ return x < JAW; }
function inCornerTR(x){ return x > PW-JAW; }
function inSideT(x){ return Math.abs(x-PW/2) < SIDEGAP; }
function inCornerBL(x){ return x < JAW; }
function inCornerBR(x){ return x > PW-JAW; }
function inSideB(x){ return Math.abs(x-PW/2) < SIDEGAP; }
function inLeft(y){ return y < JAW || y > PH-JAW; }
function inRight(y){ return y < JAW || y > PH-JAW; }

function potByGeometry(b){
  for(const p of POCKETS){
    if(Math.hypot(b.x-p.x, b.y-p.y) < p.r*0.94){ return p; }
  }
  return null;
}

function stepBall(b, h){
  // integrate
  b.x += b.vx*h; b.y += b.vy*h;
  const s = Math.hypot(b.vx, b.vy);
  // side spin bends the line: the ball is still spinning on its vertical axis
  if(s > 0 && b.sw){
    const px = -b.vy/s, py = b.vx/s;
    const acc = b.sw * s * SPIN_CURVE;
    b.vx += px*acc*h; b.vy += py*acc*h;
  }
  // friction
  if(s > 0){
    const ns = s * Math.max(0, 1 - FRICTION*h);
    b.vx *= ns/s; b.vy *= ns/s;
  }
  // english bleeds off as the ball rolls
  if(b.sw) b.sw *= Math.max(0, 1 - SPIN_DECAY*h);
  if(b.fb) b.fb *= Math.max(0, 1 - SPIN_DECAY*h);
  // direct pocket capture
  const pc = potByGeometry(b);
  if(pc){ potBall(b); return; }
  // top rail
  if(b.y < R){
    if(b.y <= -0.5 && (inCornerTL(b.x)||inCornerTR(b.x)||inSideT(b.x))){ potBall(b); return; }
    if(!(inCornerTL(b.x)||inCornerTR(b.x)||inSideT(b.x))){
      b.y = R;
      if(b.vy < 0){
        sndCush(Math.abs(b.vy)/420);
        b.vy = -b.vy*CUSH; b.vx = b.vx*0.96 + (b.sw||0)*Math.abs(b.vy)*0.30; b.sw *= 0.65;
      }
    }
  }
  // bottom rail
  if(b.y > PH-R){
    if(b.y >= PH+0.5 && (inCornerBL(b.x)||inCornerBR(b.x)||inSideB(b.x))){ potBall(b); return; }
    if(!(inCornerBL(b.x)||inCornerBR(b.x)||inSideB(b.x))){
      b.y = PH-R;
      if(b.vy > 0){
        sndCush(Math.abs(b.vy)/420);
        b.vy = -b.vy*CUSH; b.vx = b.vx*0.96 - (b.sw||0)*Math.abs(b.vy)*0.30; b.sw *= 0.65;
      }
    }
  }
  // left rail
  if(b.x < R){
    if(b.x <= -0.5 && inLeft(b.y)){ potBall(b); return; }
    if(!inLeft(b.y)){
      b.x = R;
      if(b.vx < 0){
        sndCush(Math.abs(b.vx)/420);
        b.vx = -b.vx*CUSH; b.vy = b.vy*0.96 - (b.sw||0)*Math.abs(b.vx)*0.30; b.sw *= 0.65;
      }
    }
  }
  // right rail
  if(b.x > PW-R){
    if(b.x >= PW+0.5 && inRight(b.y)){ potBall(b); return; }
    if(!inRight(b.y)){
      b.x = PW-R;
      if(b.vx > 0){
        sndCush(Math.abs(b.vx)/420);
        b.vx = -b.vx*CUSH; b.vy = b.vy*0.96 + (b.sw||0)*Math.abs(b.vx)*0.30; b.sw *= 0.65;
      }
    }
  }
}

function collisions(){
  for(let i=0;i<balls.length;i++){
    const a = balls[i]; if(!a.alive) continue;
    for(let j=i+1;j<balls.length;j++){
      const b = balls[j]; if(!b.alive) continue;
      let dx = b.x-a.x, dy = b.y-a.y;
      let d = Math.hypot(dx,dy);
      if(d >= R*2 || d===0) continue;
      if(d < 0.0001){ dx = 1; dy = 0; d = 1; }
      const nx = dx/d, ny = dy/d;
      const overlap = R*2 - d;
      a.x -= nx*overlap/2; a.y -= ny*overlap/2;
      b.x += nx*overlap/2; b.y += ny*overlap/2;
      const rel = (a.vx-b.vx)*nx + (a.vy-b.vy)*ny;
      if(rel > 0){
        const imp = rel*(1+BB_E)/2;
        const cueB = a.id===0 ? a : (b.id===0 ? b : null);
        const obj  = cueB===a ? b : a;
        const cvx = cueB ? cueB.vx : 0, cvy = cueB ? cueB.vy : 0;
        a.vx -= nx*imp; a.vy -= ny*imp;
        b.vx += nx*imp; b.vy += ny*imp;
        // follow and draw carry the cue through the contact; english throws the object
        if(cueB){
          const cs = Math.hypot(cvx, cvy) || 1;
          if(cueB.fb){
            cueB.vx += (cvx/cs)*cueB.fb*imp*SPIN_FOLLOW;
            cueB.vy += (cvy/cs)*cueB.fb*imp*SPIN_FOLLOW;
          }
          if(cueB.sw){
            const px = -cvy/cs, py = cvx/cs;
            obj.vx += px*cueB.sw*imp*SPIN_THROW;
            obj.vy += py*cueB.sw*imp*SPIN_THROW;
            cueB.vx -= px*cueB.sw*imp*0.12;
            cueB.vy -= py*cueB.sw*imp*0.12;
            obj.sw = cueB.sw*0.45; obj.fb = 0;
          }
        }
        if(firstHit === null && (a.id===0 || b.id===0)){
          firstHit = (a.id===0 ? b.id : a.id);
        }
        sndClick(imp/330);
      }
    }
  }
}

const anyMoving = () => balls.some(b => b.alive && (b.vx||b.vy) && Math.hypot(b.vx,b.vy) > STOPV);

function strike(pow){
  const c = cue();
  if(!c || !c.alive) return;
  const v = MAXPOWER*pow;
  c.vx = Math.cos(aimAngle)*v;
  c.vy = Math.sin(aimAngle)*v;
  const bite = Math.min(1, pow*1.35);      // a soft tap spins less than a full stroke
  c.sw = (spin.x||0)*0.90*bite;
  c.fb = (spin.y||0)*0.90*bite;
  state = 'run';
  firstHit = null;
  pottedThisShot = [];
  aimMode = aimLocked = false;
  sndCue(pow);
}

/* ================= aim preview ================= */
/* The guide is the shot: the cue ball is rolled forward on a throwaway copy with
   the same integrator, so the line is exactly as long as the ball will travel and
   bends exactly as far as the english takes it. It stops where the cue ball runs
   out of pace, meets another ball, or drops. */
function guideShot(){
  const cpu = (state==='cpu' || state==='cpu-wait');
  if(cpu) return {pw: cpuShot !== null ? cpuShot : 0.4, sw:0, fb:0};
  const bite = Math.min(1, power*1.35);
  return {pw: power, sw:(spin.x||0)*0.90*bite, fb:(spin.y||0)*0.90*bite};
}

function previewPath(){
  const c = cue();
  if(!c || !c.alive) return null;
  const g = guideShot();
  const probe = {x:c.x, y:c.y,
    vx: Math.cos(aimAngle)*MAXPOWER*g.pw, vy: Math.sin(aimAngle)*MAXPOWER*g.pw,
    sw:g.sw, fb:g.fb, alive:true};
  const dt = 1/240, pts = [{x:probe.x, y:probe.y}];
  let hit = null, contact = null, dropped = false;
  PREVIEW = true;
  try{
    for(let n=0; n<1600 && probe.alive; n++){
      stepBall(probe, dt);
      if(!probe.alive){ dropped = true; break; }
      for(const o of balls){
        if(!o.alive || o.id===0) continue;
        if(Math.hypot(o.x-probe.x, o.y-probe.y) < R*2){
          hit = o; contact = {x:probe.x, y:probe.y};
          break;
        }
      }
      if(hit) break;
      if(Math.hypot(probe.vx, probe.vy) <= STOPV) break;
      if(n % 3 === 0) pts.push({x:probe.x, y:probe.y});
    }
  } finally { PREVIEW = false; }
  let end = {x:probe.x, y:probe.y};
  if(dropped){
    // the ball crossed a mouth: finish the line at the pocket it fell into
    let np = POCKETS[0], nd = 1e9;
    for(const p of POCKETS){ const d = Math.hypot(p.x-end.x, p.y-end.y); if(d < nd){ nd = d; np = p; } }
    end = {x: Math.max(0, Math.min(PW, np.x)), y: Math.max(0, Math.min(PH, np.y))};
  }
  pts.push(end);
  return {pts, hit, contact, dropped, end};
}

function computeGuide(){
  guide = null;
  if(state!=='aim' && state!=='cpu' && state!=='cpu-wait') return;
  guide = previewPath();
}

/* ================= shot evaluation ================= */
const remainingOwn = p => {
  const g = groups[p];
  if(!g) return balls.filter(b=>b.alive && b.id!==0 && b.id!==8).length;
  return balls.filter(b=>b.alive && groupOf(b.id)===g).length;
};

function endShot(){
  const shooter = turn, opp = 1-turn;
  const pot8 = pottedThisShot.includes(8);
  const scratch = pottedThisShot.includes(0);
  const objPots = pottedThisShot.filter(x=>x!==0 && x!==8);
  let foul = false, reason = '';

  if(scratch){ foul = true; reason = 'Scratch'; }
  if(!firstHit){ foul = true; reason = 'No ball contacted'; }
  else if(openTable){
    if(firstHit === 8){ foul = true; reason = 'Hit the 8 first'; }
  } else {
    const g = groups[shooter];
    if(firstHit === 8){
      if(remainingOwn(shooter) > 0){ foul = true; reason = 'Hit the 8 first'; }
    } else if(groupOf(firstHit) !== g){ foul = true; reason = 'Wrong ball first'; }
  }

  if(pot8){
    if(breakShot){
      // 8 on the break — re-rack, breaker shoots again
      const breaker = turn;
      toast('8 on the break — re-rack', 'warn', 2200);
      setTimeout(()=>{ startGame(mode, breaker); }, 1200);
      breakShot = true; state = 'cpu'; // park state during reset
      return;
    }
    if(groups[shooter] && remainingOwn(shooter)===0 && !foul){
      return gameOver(shooter);
    }
    return gameOver(opp);
  }

  if(openTable && !foul && objPots.length){
    const first = objPots[0];
    const g = groupOf(first);
    groups[shooter] = g;
    groups[opp] = g==='solid' ? 'stripe' : 'solid';
    openTable = false;
    toast(nameOf(shooter)+' is '+(g==='solid'?'SOLIDS':'STRIPES'), 'good', 1800);
  }
  breakShot = false;
  if(objPots.length) eightSafeties = 0;

  // keep turn?
  let keep = false;
  if(!foul && objPots.length){
    const g = groups[shooter];
    keep = openTable ? true : objPots.some(id => groupOf(id)===g);
  }

  if(scratch){
    cue().alive = false;
    sndScratch();
  } else if(foul){
    sndFoul();
  }

  if(foul){
    turn = opp;
    toast('Foul — '+reason+'. Ball in hand.', 'warn', 2200);
    beginHand();
    return;
  }
  if(keep){
    if(isCpu()) beginCpu(false);
    else toast('Nice, shoot again', 'good', 1100), state = 'aim';
    return;
  }
  turn = opp;
  nextTurn();
}

function nextTurn(){
  const c = cue();
  aimMode = aimLocked = false;
  if(!c.alive) state = 'hand', handOK=true;
  else {
    state = 'aim';
    aimAngle = Math.atan2(PH/2-c.y, PW/2-c.x);
    if(isCpu()) beginCpu(false);
  }
}

function beginHand(){
  const c = cue();
  if(isCpu()){
    if(!c.alive){ const best = findHandSpotCpu(); c.x=best.x; c.y=best.y; c.vx=c.vy=0; }
    c.alive = true;
    beginCpu(false);
    return;
  }
  // human: ghost placement starts at the ball's current spot (or a default) and follows the pointer
  if(c.alive){ handX = c.x; handY = c.y; }
  else { handX = PW*0.28; handY = PH/2; }
  if(!handValid(handX, handY)){ const b = findHandSpot(); handX = b.x; handY = b.y; }
  c.alive = false; c.vx = c.vy = 0;
  aimMode = aimLocked = false;
  state = 'hand';
}
function handValid(x, y){
  if(x < R+0.4 || x > PW-R-0.4 || y < R+0.4 || y > PH-R-0.4) return false;
  for(const b of balls){
    if(!b.alive || b.id===0) continue;
    if(Math.hypot(b.x-x, b.y-y) < R*2.05) return false;
  }
  return true;
}
function findHandSpot(){
  for(let r=0;r<80;r++){
    const x = PW*0.25 + r*0.05;
    if(handValid(Math.min(x, PW*0.6), PH/2)) return {x:Math.min(x,PW*0.6), y:PH/2};
    if(handValid(PW*0.25, PH/2 + r*0.5)) return {x:PW*0.25, y:PH/2 + r*0.5};
    if(handValid(PW*0.25, PH/2 - r*0.5)) return {x:PW*0.25, y:PH/2 - r*0.5};
  }
  return {x:PW/2, y:PH/2};
}

function gameOver(winner){
  state = 'over';
  const win = winner;
  const humanWon = mode==='2p' ? true : (win===0);
  document.getElementById('resColor').textContent =
    mode==='2p' ? (win===0 ? 'PLAYER 1 WINS' : 'PLAYER 2 WINS') : (win===0 ? 'YOU WIN' : 'CPU WINS');
  document.getElementById('resColor').className = 'result ' + (humanWon?'win':'lose');
  document.getElementById('resSub').textContent = humanWon ? 'Clean pot. Rack them again?' : 'The 8 waits.';
  document.getElementById('over').classList.remove('hidden');
  if(humanWon) sndWin(); else sndLose();
}

/* ================= CPU ================= */
/* The CPU plans by simulating the real physics: it clones the table, rolls a
   candidate shot forward with the same integrator, and keeps only shots that
   actually drop the ball, never scratch, and leave something good behind. */
const SIM_STEP = 1/300;

/* The three brains. Search depth is the real difference: easy checks a couple of
   lines and hopes, hard hunts through every pot on the table and takes the one
   that leaves the next shot. `noise` is the sloppiness added once it is over the
   cue — the plan can be perfect and the hand still shaky. */
const DIFFS = {
  easy:   { name:'EASY',   think:[0.45,0.75], noise:0.042, cand:3,  landed:1, tries:1,
            safeReach:2, safeOff:[-0.5,0,0.5],                       safeTries:5,  handGrid:[6,3],  eightAfter:4 },
  normal: { name:'NORMAL', think:[0.80,1.20], noise:0,     cand:8,  landed:3, tries:5,
            safeReach:4, safeOff:[-0.65,-0.3,0,0.3,0.65],           safeTries:15, handGrid:[10,5], eightAfter:2 },
  hard:   { name:'HARD',   think:[1.00,1.45], noise:0,     cand:13, landed:5, tries:8,
            safeReach:6, safeOff:[-0.8,-0.5,-0.25,0,0.25,0.5,0.8], safeTries:26, handGrid:[13,6], eightAfter:2 }
};
const diffParams = () => DIFFS[difficulty] || DIFFS.normal;

function clearPath(layout, ax, ay, bx, by, exList, clearance){
  for(const b of layout){
    if(exList.includes(b.id)) continue;
    const abx = bx-ax, aby = by-ay;
    const len2 = abx*abx + aby*aby;
    if(len2 < 1e-6) continue;
    let t = ((b.x-ax)*abx + (b.y-ay)*aby)/len2;
    t = Math.max(0, Math.min(1, t));
    const px = ax + abx*t, py = ay + aby*t;
    if(Math.hypot(b.x-px, b.y-py) < clearance) return false;
  }
  return true;
}
function segClear(ax, ay, bx, by, exList, clearance){
  return clearPath(balls.filter(b=>b.alive), ax, ay, bx, by, exList, clearance);
}

/* ---- sandboxed copy of the physics: no sound, no scoring side effects ---- */
function simPotGeo(b){
  for(const p of POCKETS){ if(Math.hypot(b.x-p.x, b.y-p.y) < p.r*0.94) return p; }
  return null;
}
function simStep(b, h, potted, cueState, isCue){
  b.x += b.vx*h; b.y += b.vy*h;
  const s = Math.hypot(b.vx, b.vy);
  if(s > 0){
    const ns = s * Math.max(0, 1 - FRICTION*h);
    b.vx *= ns/s; b.vy *= ns/s;
  }
  if(simPotGeo(b)){ b.alive = false; b.vx = b.vy = 0; potted.push(b.id); return; }
  if(b.y < R){
    if(b.y <= -0.5 && (inCornerTL(b.x)||inCornerTR(b.x)||inSideT(b.x))){ b.alive=false; b.vx=b.vy=0; potted.push(b.id); return; }
    if(!(inCornerTL(b.x)||inCornerTR(b.x)||inSideT(b.x))){
      b.y = R;
      if(b.vy < 0){ if(isCue) cueState.rail = true; b.vy = -b.vy*CUSH; b.vx *= 0.96; }
    }
  }
  if(b.y > PH-R){
    if(b.y >= PH+0.5 && (inCornerBL(b.x)||inCornerBR(b.x)||inSideB(b.x))){ b.alive=false; b.vx=b.vy=0; potted.push(b.id); return; }
    if(!(inCornerBL(b.x)||inCornerBR(b.x)||inSideB(b.x))){
      b.y = PH-R;
      if(b.vy > 0){ if(isCue) cueState.rail = true; b.vy = -b.vy*CUSH; b.vx *= 0.96; }
    }
  }
  if(b.x < R){
    if(b.x <= -0.5 && inLeft(b.y)){ b.alive=false; b.vx=b.vy=0; potted.push(b.id); return; }
    if(!inLeft(b.y)){
      b.x = R;
      if(b.vx < 0){ if(isCue) cueState.rail = true; b.vx = -b.vx*CUSH; b.vy *= 0.96; }
    }
  }
  if(b.x > PW-R){
    if(b.x >= PW+0.5 && inRight(b.y)){ b.alive=false; b.vx=b.vy=0; potted.push(b.id); return; }
    if(!inRight(b.y)){
      b.x = PW-R;
      if(b.vx > 0){ if(isCue) cueState.rail = true; b.vx = -b.vx*CUSH; b.vy *= 0.96; }
    }
  }
}

const POT_GHOST = R*2;             // centre-to-centre gap at contact (exact, or the cut drifts)

/* A ball rolled at the corner point itself clips the jaw and rebounds, so each
   pocket also offers an aiming point just inside the mouth. Both are tried and
   the simulation decides which line actually drops. */
const POCKET_IN = POCKETS.map(p => {
  const dx = p.x - PW/2, dy = p.y - PH/2, d = Math.hypot(dx, dy) || 1;
  return {x: p.x - dx/d*2.2, y: p.y - dy/d*2.2};
});
const POCKET_AIMS = POCKETS.map((p, i) => [p, POCKET_IN[i]]);

/* Roll one shot forward and report everything the planner cares about. */
function simulateShot(layout, angle, power){
  const bs = layout.map(b => ({id:b.id, x:b.x, y:b.y, vx:0, vy:0, alive:true}));
  const cueB = bs[0];
  cueB.vx = Math.cos(angle)*MAXPOWER*power;
  cueB.vy = Math.sin(angle)*MAXPOWER*power;
  const potted = [], cueState = {rail:false};
  let firstHit = null;
  for(let n=0; n<2600; n++){
    let moving = false;
    for(const b of bs){
      if(!b.alive) continue;
      simStep(b, SIM_STEP, potted, cueState, b.id===0);
      if(Math.hypot(b.vx, b.vy) > STOPV) moving = true;
    }
    for(let i=0;i<bs.length;i++){
      const a = bs[i]; if(!a.alive) continue;
      for(let j=i+1;j<bs.length;j++){
        const b = bs[j]; if(!b.alive) continue;
        let dx = b.x-a.x, dy = b.y-a.y;
        let d = Math.hypot(dx,dy);
        if(d >= R*2) continue;
        if(d < 0.0001){ dx = 1; dy = 0; d = 1; }
        const nx = dx/d, ny = dy/d;
        const overlap = R*2 - d;
        a.x -= nx*overlap/2; a.y -= ny*overlap/2;
        b.x += nx*overlap/2; b.y += ny*overlap/2;
        const rel = (a.vx-b.vx)*nx + (a.vy-b.vy)*ny;
        if(rel > 0){
          const imp = rel*(1+BB_E)/2;
          a.vx -= nx*imp; a.vy -= ny*imp;
          b.vx += nx*imp; b.vy += ny*imp;
          if(firstHit === null && (a.id===0 || b.id===0)) firstHit = (a.id===0 ? b.id : a.id);
        }
      }
    }
    if(!moving) break;
  }
  const after = bs.filter(b=>b.alive).map(b=>({id:b.id, x:b.x, y:b.y}));
  const settled = bs.find(b=>b.id===0);
  return {potted, firstHit, after, cueRail: cueState.rail,
    cue: settled && settled.alive ? {x:settled.x, y:settled.y} : null};
}

/* ---- line-of-sight helpers used to find a legal contact ---- */
function firstBallHit(ox, oy, dx, dy){
  let bestT = 1e9, hit = null;
  for(const b of balls){
    if(!b.alive || b.id===0) continue;
    const cx = b.x-ox, cy = b.y-oy;
    const proj = cx*dx + cy*dy;
    if(proj <= 0) continue;
    const d2 = cx*cx + cy*cy - proj*proj;
    if(d2 > (R*2)*(R*2)) continue;
    const t = proj - Math.sqrt((R*2)*(R*2) - d2);
    if(t > 0 && t < bestT){ bestT = t; hit = b; }
  }
  let railT = 1e9;
  if(dx < -1e-9) railT = Math.min(railT, (R-ox)/dx);
  if(dx >  1e-9) railT = Math.min(railT, (PW-R-ox)/dx);
  if(dy < -1e-9) railT = Math.min(railT, (R-oy)/dy);
  if(dy >  1e-9) railT = Math.min(railT, (PH-R-oy)/dy);
  if(railT < bestT) return null;
  return hit;
}
/* the colour of ball a shot would touch first, allowing one cushion */
function firstBallAfterRail(ox, oy, dx, dy){
  const direct = firstBallHit(ox, oy, dx, dy);
  if(direct) return {hit:direct, dist: Math.hypot(direct.x-ox, direct.y-oy)};
  let t = 1e9, axis = null;
  const sides = [
    [dx < -1e-9, (R-ox)/dx, 'x'], [dx > 1e-9, (PW-R-ox)/dx, 'x'],
    [dy < -1e-9, (R-oy)/dy, 'y'], [dy > 1e-9, (PH-R-oy)/dy, 'y']
  ];
  for(const [okay, tt, which] of sides){ if(okay && tt > 0 && tt < t){ t = tt; axis = which; } }
  if(!t || !isFinite(t) || t === 1e9) return null;
  let px = ox + dx*t, py = oy + dy*t;
  let rx = dx, ry = dy;
  if(axis === 'x') rx = -rx; else ry = -ry;
  px = Math.max(R+0.05, Math.min(PW-R-0.05, px));
  py = Math.max(R+0.05, Math.min(PH-R-0.05, py));
  const second = firstBallHit(px + rx*0.05, py + ry*0.05, rx, ry);
  if(!second) return null;
  return {hit:second, dist: t + Math.hypot(second.x-px, second.y-py)};
}
/* centre of the widest fan of directions that legally reach a target */
function legalFanAngle(targetIds){
  const c = cue();
  const N = 240;
  const ok = new Array(N);
  for(let i=0;i<N;i++){
    const a = (i/N)*Math.PI*2;
    const hit = firstBallHit(c.x, c.y, Math.cos(a), Math.sin(a));
    ok[i] = !!hit && targetIds.includes(hit.id);
  }
  let bestLen = 0, bestStart = 0;
  for(let i=0;i<N;i++){
    if(!ok[i]) continue;
    let len = 0;
    while(len < N && ok[(i+len)%N]) len++;
    if(len > bestLen){ bestLen = len; bestStart = i; }
  }
  if(!bestLen) return null;
  return ((bestStart + bestLen/2)/N)*Math.PI*2;
}
/* cheapest one-cushion route to a legal first contact */
function escapeAngle(targetIds){
  const c = cue();
  let best = null;
  for(let i=0;i<360;i++){
    const a = (i/360)*Math.PI*2;
    const route = firstBallAfterRail(c.x, c.y, Math.cos(a), Math.sin(a));
    if(!route || !targetIds.includes(route.hit.id)) continue;
    if(!best || route.dist < best.dist) best = {angle:a, dist:route.dist};
  }
  return best;
}

/* ---- what may the CPU hit first, and what may it pot? ---- */
function shotTargets(){
  const live = balls.filter(b=>b.alive && b.id!==0);
  if(openTable){
    const open = live.filter(b=>b.id!==8);
    return open.length ? open : live.filter(b=>b.id===8);
  }
  const own = live.filter(b=>groupOf(b.id)===groups[turn]);
  return own.length ? own : live.filter(b=>b.id===8);
}
const eightIsLegal = () => !openTable && !!groups[turn] && remainingOwn(turn)===0;

/* ---- every pot a shooter could attempt from a given cue spot (analytic) ---- */
function potCandidates(layout, targets, from){
  const ids = targets.map(t=>t.id);
  const list = [];
  for(const b of layout){
    if(b.id===0 || !ids.includes(b.id)) continue;
    for(let pi=0; pi<POCKETS.length; pi++){
      const p = POCKETS[pi];
      for(const aim of POCKET_AIMS[pi]){
        const dx = aim.x-b.x, dy = aim.y-b.y, d2 = Math.hypot(dx,dy);
        if(d2 < R*2.6) continue;
        const ux = dx/d2, uy = dy/d2;
        const gx = b.x - ux*POT_GHOST, gy = b.y - uy*POT_GHOST;
        if(gx < R*0.7 || gx > PW-R*0.7 || gy < R*0.7 || gy > PH-R*0.7) continue;
        const cgx = gx-from.x, cgy = gy-from.y, d1 = Math.hypot(cgx,cgy);
        if(d1 < R*1.3) continue;
        const cut = (cgx/d1)*ux + (cgy/d1)*uy;
        if(cut < 0.12) continue;
        if(!clearPath(layout, from.x, from.y, gx, gy, [0,b.id], R*1.9)) continue;
        if(!clearPath(layout, b.x, b.y, p.x, p.y, [0,b.id], R*1.9)) continue;
        list.push({ball:b, pocket:p, cut, d1, d2, angle: Math.atan2(cgy,cgx),
          score: cut*cut*cut/(1 + d1 + d2*0.9)});
      }
    }
  }
  return list.sort((a,b)=>b.score-a.score);
}
function bestPotOn(layout, targets, from){
  const list = potCandidates(layout, targets, from);
  return {score: list.length ? list[0].score : 0, pick: list.length ? list[0] : null};
}

function potPower(cut, d1, d2){
  // friction, not a magic number, sets how far a given pace rolls
  const speed = FRICTION*1.0143*(d1 + d2/Math.max(cut, 0.3));
  return Math.max(0.05, Math.min(1, (speed*1.06 + 14)/MAXPOWER));
}
const pwFor = speed => Math.max(0.04, Math.min(1, speed/MAXPOWER));

function breakPlan(){
  const c = cue();
  const live = balls.filter(b=>b.alive && b.id!==0);
  let apex = null, bd = 1e9;
  for(const b of live){ const d = Math.hypot(b.x-c.x, b.y-c.y); if(d < bd){ bd = d; apex = b; } }
  if(!apex) return {angle: aimAngle, power: 0.6, label: null};
  // square contact with a touch of spread, struck hard enough to open the rack
  const base = Math.atan2(apex.y-c.y, apex.x-c.x);
  return {angle: base + (Math.random()-0.5)*0.02, power: 0.9 + Math.random()*0.1, label: 'breaking'};
}

function aiPlan(){
  const c = cue();
  if(!c || !c.alive) return {angle: aimAngle, power: pwFor(260), label: null};
  if(breakShot) return breakPlan();

  const layout = balls.filter(b=>b.alive).map(b=>({id:b.id, x:b.x, y:b.y}));
  const targets = shotTargets();
  if(!targets.length) return {angle: aimAngle, power: pwFor(200), label: null};
  const targetIds = targets.map(b=>b.id);
  const legalEight = eightIsLegal();
  const onlyTheEight = legalEight && targets.length === 1 && targets[0].id === 8;

  /* ---- 1. shots that actually drop a ball ---- */
  const cand = potCandidates(layout, targets, c);

  const D = diffParams();
  let best = null, tried = 0, landed = 0;
  for(const k of cand.slice(0, D.cand)){
    if(landed >= D.landed || tried > D.tries*D.cand) break;
    const base = potPower(k.cut, k.d1, k.d2);
    // the ideal line often rattles: adjust pace first, then the line by a hair
    const tries = [
      [base, 0], [Math.min(1, base*1.3), 0], [base*0.78, 0], [base, 0.008], [base, -0.008],
      [Math.min(1, base*1.15), -0.012], [Math.max(0.05, base*0.85), 0.016], [Math.min(1, base*1.05), -0.02]
    ].slice(0, D.tries);
    let verified = false;
    for(const [pw, off] of tries){
      if(tried++ > D.tries*D.cand) break;
      const angle = k.angle + off;
      const r = simulateShot(layout, angle, pw);
      if(!r.cue || r.potted.includes(0)) continue;
      if(!r.potted.includes(k.ball.id)) continue;
      if(r.firstHit !== k.ball.id) continue;
      if(r.potted.includes(8) && !legalEight) continue;
      if(r.potted.includes(8)) return {angle, power:pw, score:1e6, label:'going for the 8'};
      // what is left to shoot at after this one? that is what makes it a good shot
      const pottedGroup = openTable ? groupOf(k.ball.id) : groups[turn];
      const nextTargets = r.after.filter(b=>b.id!==0 && b.id!==8 && groupOf(b.id)===pottedGroup);
      const next = nextTargets.length ? bestPotOn(r.after, nextTargets, r.cue).score : 1;
      const value = 200 + next*260 - (pw > 0.94 ? 3 : 0);
      if(!best || value > best.score) best = {angle, power:pw, score:value, label:'potting'};
      verified = true;
      break;
    }
    if(verified) landed++;
  }
  if(best) return best;

  /* ---- 2. no pot: pick the safety that leaves the worst table behind ---- */
  const theirGroup = groups[1-turn];
  const theirBalls = theirGroup
    ? balls.filter(b=>b.alive && b.id!==0 && groupOf(b.id)===theirGroup)
    : [];
  // mid-rack the 8 is not a legal target for them, so it is not a leave they can take
  const oppTargets = openTable
    ? balls.filter(b=>b.alive && b.id!==0 && b.id!==8)
    : (theirBalls.length ? theirBalls : balls.filter(b=>b.alive && b.id===8));
  // nearest legal balls first: they are the ones a safety can actually control
  const reach = targets
    .filter(t => clearPath(layout, c.x, c.y, t.x, t.y, [0,t.id], R*1.9))
    .sort((a,b) => Math.hypot(a.x-c.x, a.y-c.y) - Math.hypot(b.x-c.x, b.y-c.y))
    .slice(0, D.safeReach);
  let safety = null, safeTried = 0;
  for(const t of reach){
    if(safeTried > D.safeTries) break;
    const base = Math.atan2(t.y-c.y, t.x-c.x);
    const d = Math.hypot(t.x-c.x, t.y-c.y);
    for(const off of D.safeOff){
      if(safeTried > D.safeTries) break;
      for(const pw of [pwFor(Math.max(120, d*FRICTION*1.9)), pwFor(360)]){
        if(safeTried++ > D.safeTries) break;
        const tx = t.x - Math.sin(base)*R*off;
        const ty = t.y + Math.cos(base)*R*off;
        const angle = Math.atan2(ty-c.y, tx-c.x);
        const r = simulateShot(layout, angle, pw);
        if(!r.cue || r.potted.includes(0)) continue;
        if(r.firstHit !== t.id) continue;
        if(r.potted.includes(8)) continue;
        const opp = oppTargets.length ? bestPotOn(r.after, oppTargets, r.cue).score : 0;
        const dist = oppTargets.length
          ? Math.min(...oppTargets.map(b=>Math.hypot(b.x-r.cue.x, b.y-r.cue.y)))
          : 60;
        // a potted own ball keeps the turn, so it counts, but not above a locked-up leave
        const bonus = r.potted.some(id=>id!==0 && (openTable || groupOf(id)===groups[turn])) ? 90 : 0;
        const value = bonus - opp*900 + Math.min(dist, 70)*0.35 + (r.cueRail ? 4 : 0);
        if(!safety || value > safety.score) safety = {angle, power:pw, score:value, label:'playing safe', opp};
      }
    }
  }
  if(safety){
    if(onlyTheEight) eightSafeties++;
    return safety;
  }

  /* ---- 2b. on the black: after a couple of safeties, go at the pocket ---- */
  if(onlyTheEight && eightSafeties >= D.eightAfter){
    let nudge = null;
    for(const k of cand.slice(0, 10)){
      for(const pw of [potPower(k.cut, k.d1, k.d2), 0.55]){
        const r = simulateShot(layout, k.angle, pw);
        if(!r.cue || r.potted.includes(0) || r.firstHit !== 8) continue;
        if(r.potted.includes(8)) return {angle:k.angle, power:pw, score:1e6, label:'going for the 8'};
        const eight = r.after.find(b=>b.id===8);
        if(!eight) continue;
        let pd = 1e9;
        for(const p of POCKETS) pd = Math.min(pd, Math.hypot(eight.x-p.x, eight.y-p.y));
        const opp = bestPotOn(r.after, [eight], r.cue).score;
        if(!nudge || pd - opp*8 < nudge.score) nudge = {angle:k.angle, power:pw, score:pd - opp*8, label:'going for the 8'};
      }
    }
    if(nudge) return nudge;
  }

  /* ---- 3. snookered: find the cheapest cushion route to a legal ball ---- */
  const esc = escapeAngle(targetIds);
  if(esc){
    const need = Math.min(1, Math.max(0.05, (esc.dist*FRICTION*1.15)/MAXPOWER));
    for(const pw of [need, Math.min(1, need*1.6), 1]){
      for(const off of [0, 0.05, -0.05]){
        const angle = esc.angle + off;
        const r = simulateShot(layout, angle, pw);
        if(!r.cue || r.potted.includes(0)) continue;
        if(r.firstHit === null || !targetIds.includes(r.firstHit)) continue;
        if(r.potted.includes(8) && !legalEight) continue;
        if(onlyTheEight) eightSafeties++;
        return {angle, power:pw, label:'playing out'};
      }
    }
  }
  // nothing legal is reachable: aim at a legal ball rather than gift a foul on the 8
  const legalFan = legalFanAngle(targetIds);
  const any = targets[0];
  const angle = legalFan !== null ? legalFan : (any ? Math.atan2(any.y-c.y, any.x-c.x) : aimAngle);
  return {angle, power: pwFor(200), label: null};
}

/* CPU ball in hand: look for the spot that unlocks the best pot. */
function findHandSpotCpu(){
  const layout = balls.filter(b=>b.alive && b.id!==0).map(b=>({id:b.id, x:b.x, y:b.y}));
  const targets = shotTargets();
  const D = diffParams(), nx = D.handGrid[0], ny = D.handGrid[1];
  let best = null;
  for(let ix=0; ix<nx; ix++){
    for(let iy=0; iy<ny; iy++){
      const x = PW*(0.10 + ix*(0.80/Math.max(1, nx-1)));
      const y = PH*(0.15 + iy*(0.70/Math.max(1, ny-1)));
      if(!handValid(x, y)) continue;
      const pot = targets.length ? bestPotOn(layout, targets, {x, y}).score : 0;
      // a legal first contact matters more than a hard pot: placing into a dead
      // corner leaves nothing to hit at all, which turns into a foul loop
      const contact = targets.some(t => clearPath(layout, x, y, t.x, t.y, [0,t.id], R*1.9)) ? 1 : 0;
      let scratch = 0;
      for(const p of POCKETS){ if(Math.hypot(x-p.x, y-p.y) < R*3.5) scratch += 1; }
      const centre = Math.hypot(x-PW/2, y-PH/2)/(PW/2);
      const value = contact + pot*4 - scratch*0.3 - centre*0.05;
      if(!best || value > best.value) best = {value, x, y};
    }
  }
  return best || findHandSpot();
}

function beginCpu(breaking){
  state = 'cpu';
  const t = diffParams().think;
  cpuTimer = (breaking ? t[1]*1.2 : t[0]*1.1) + Math.random()*0.35;
}
let cpuShot = null, cpuShotT = 0;
function cpuTick(dt){
  if(cpuTimer > 0){ cpuTimer -= dt; return; }
  const D = diffParams();
  const plan = aiPlan();
  aimAngle = plan.angle + (D.noise ? (Math.random()*2 - 1)*D.noise : 0);
  toast(nameOf(1) + (plan.label ? ' \u2014 ' + plan.label : ' is shooting'), null, 1200);
  cpuShotT = 0.45; cpuShot = plan.power;
  state = 'cpu-wait';
}

/* ================= input ================= */
let ptr = {x:0, y:0, down:false};

function toWorld(sx, sy){
  const {ox, oy, scale} = viewParams();
  if(VERT){
    // screen -> world inverse of the rotated draw transform
    return {x: PW - (sy-oy)/scale, y: (sx-ox)/scale};
  }
  return {x:(sx-ox)/scale, y:(sy-oy)/scale};
}
const HUD_H = 46;
const railW = () => (SW < 620 ? 66 : 92);
/* The side rail holds the whole shot: english at the top, the power meter down the
   middle, shoot at the bottom. Putting it beside the table leaves the felt the full
   height of the screen. */
function ctrlLayout(){
  const compact = SW < 620;
  const w = railW(), x0 = SW - w, pad = compact ? 8 : 12;
  const spinR = compact ? 18 : 23;
  const spinLabelY = HUD_H + (compact ? 13 : 16);
  const spin = {x: x0 + w/2, y: spinLabelY + (compact ? 9 : 11) + spinR, r: spinR};
  const shootH = compact ? 36 : 40;
  const shoot = {x: x0 + pad, y: SH - pad - shootH, w: w - pad*2, h: shootH};
  const powerLabelY = spin.y + spinR + (compact ? 24 : 30);
  const track = {x: x0 + w/2, y0: powerLabelY + (compact ? 26 : 30),
                 y1: Math.max(powerLabelY + 110, shoot.y - (compact ? 26 : 32)), w: compact ? 5 : 6};
  return {compact, w, x0, pad, spin, shoot, track, spinLabelY, powerLabelY};
}

function viewParams(){
  const tableX = SW - railW();
  const availW = tableX - 18, availH = SH - HUD_H - 18;
  if(VERT){
    // table rotated: playfield is PH wide x PW tall on screen; reserve room for rails
    const scale = Math.min(availW/(PH + 2*RAIL), availH/(PW + 2*RAIL));
    return {
      scale,
      ox: (tableX - PH*scale)/2,              // screen x of playfield left edge (world y=0)
      oy: HUD_H + availH/2 - PW/2*scale       // screen y of playfield bottom edge (world x=0)
    };
  }
  const tableW = PW + 2*RAIL, tableH = PH + 2*RAIL;
  const scale = Math.min(availW/tableW, availH/tableH);
  return {
    scale, ox:(tableX - PW*scale)/2, oy: HUD_H + (availH - tableH*scale)/2 + RAIL*scale
  };
}

let CTRL = ctrlLayout();

cv.addEventListener('pointerdown', e => {
  audio();
  CTRL = ctrlLayout();
  const x = e.clientX, y = e.clientY;
  if(x >= CTRL.x0 && (state==='aim' || state==='hand')){
    if(state==='aim'){
      if(hitRect(CTRL.shoot, x, y)) shootNow();
      else if(hitCircle(CTRL.spin, x, y)){ dragSpin = true; setSpinFromPoint(x, y); sndSpin(); }
      else if(hitTrack(x, y)){ dragSlider = true; setPowerFromY(y); }
    }
    e.preventDefault();
    return;
  }
  if(state==='aim'){
    // first click takes the line, the second click sets it, the third picks it up again
    if(aimLocked){
      aimLocked = false; aimMode = true;
      ptr.x = x; ptr.y = y; updateAimFromPointer();
    } else if(aimMode){
      aimMode = false; aimLocked = true;
    } else {
      aimMode = true;
      ptr.x = x; ptr.y = y; updateAimFromPointer();
    }
    ptr.down = true;
    e.preventDefault();
  } else if(state==='hand'){
    ptr.down = true;
    moveHand(x, y);
    e.preventDefault();
  }
});
cv.addEventListener('pointermove', e => {
  const x = e.clientX, y = e.clientY;
  if(dragSlider){ setPowerFromY(y); return; }
  if(dragSpin){ setSpinFromPoint(x, y); return; }
  if(state==='aim' && aimMode && x < CTRL.x0){
    ptr.x = x; ptr.y = y;
    updateAimFromPointer();
  } else if(state==='hand' && ptr.down){
    moveHand(x, y);
  }
});
window.addEventListener('pointerup', e => {
  if(dragSlider || dragSpin){ dragSlider = dragSpin = false; return; }
  if(!ptr.down) return;
  ptr.down = false;
  if(state==='hand'){
    if(handOK && handValid(handX, handY)){
      const c = cue(); c.x = handX; c.y = handY; c.alive = true; c.vx=c.vy=0; c.sw=c.fb=0;
      state = 'aim';
      aimAngle = Math.atan2(PH/2-c.y, PW/2-c.x);
      toast('Cue ball placed — aim and shoot', 'good', 1200);
    } else {
      toast('Can\'t place there — overlapping or off the table', 'warn', 1400);
      handOK = false;
    }
  }
});
window.addEventListener('pointercancel', () => {
  dragSlider = dragSpin = false; ptr.down = false;
});

function shootNow(){ if(state==='aim' && power > 0.03) strike(power); }
function hitCircle(c, x, y){ return Math.hypot(x-c.x, y-c.y) <= c.r + 14; }
function hitRect(r, x, y){ return x >= r.x-8 && x <= r.x+r.w+8 && y >= r.y-8 && y <= r.y+r.h+8; }
function hitTrack(x, y){
  return x >= CTRL.x0 && y >= CTRL.track.y0-16 && y <= CTRL.track.y1+16;
}
function setPowerFromY(y){
  const t = (CTRL.track.y1 - y)/Math.max(1, CTRL.track.y1 - CTRL.track.y0);
  power = Math.max(0.05, Math.min(1, t));   // never a dead slider
}
function setSpinFromPoint(x, y){
  const s = CTRL.spin;
  let ox = (x - s.x)/(s.r*0.86), oy = (s.y - y)/(s.r*0.86);
  const d = Math.hypot(ox, oy);
  if(d > 0.80){ ox = ox/d*0.80; oy = oy/d*0.80; }
  spin.x = ox; spin.y = oy;
}

function updateAimFromPointer(){
  const c = cue(); if(!c || !c.alive) return;
  const w = toWorld(ptr.x, ptr.y);
  const dx = w.x-c.x, dy = w.y-c.y;
  if(Math.hypot(dx,dy) > R*1.7) aimAngle = Math.atan2(dy, dx);
}

/* Arrows set the pace, WASD walks the contact point around the cue ball. */
const SPIN_KEY = {w:[0,1], s:[0,-1], a:[-1,0], d:[1,0]};
window.addEventListener('keydown', e => {
  if(state!=='aim') return;
  const k = e.key;
  if(k===' ' || k==='Enter'){ shootNow(); e.preventDefault(); return; }
  if(k==='ArrowUp' || k==='ArrowDown'){
    power = Math.max(0.05, Math.min(1, power + (k==='ArrowUp' ? 0.05 : -0.05)));
    e.preventDefault(); return;
  }
  if(k==='ArrowLeft' || k==='ArrowRight'){
    aimAngle += k==='ArrowLeft' ? -0.006 : 0.006;
    e.preventDefault(); return;
  }
  const nudge = SPIN_KEY[k.toLowerCase()];
  if(nudge){
    spin.x = Math.max(-0.8, Math.min(0.8, spin.x + nudge[0]*0.16));
    spin.y = Math.max(-0.8, Math.min(0.8, spin.y + nudge[1]*0.16));
    e.preventDefault();
  }
});

function moveHand(sx, sy){
  const w = toWorld(sx, sy);
  handX = Math.max(R+0.4, Math.min(PW-R-0.4, w.x));
  handY = Math.max(R+0.4, Math.min(PH-R-0.4, w.y));
  handOK = handValid(handX, handY);
}

/* debug hooks */
window.__test = {
  set: (a, p)=>{ if(state!=='run'){ aimAngle=a; if(p) strike(p); } },
  state: () => state,
  mode: () => mode,
  diff: () => difficulty,
  power: () => power,
  spin: () => ({x:spin.x, y:spin.y}),
  aim: () => aimAngle,
  aiming: () => aimMode,
  locked: () => aimLocked,
  setPower: p => { power = Math.max(0, Math.min(1, p)); },
  setSpin: (x, y) => { spin.x = Math.max(-.8, Math.min(.8, x)); spin.y = Math.max(-.8, Math.min(.8, y)); },
  shoot: () => shootNow(),
  frame: (n)=>{ for(let i=0;i<(n||1);i++){ tick(1/60); } },
  balls: () => balls.map(b=>({id:b.id, alive:b.alive, x:+b.x.toFixed(1), y:+b.y.toFixed(1), vx:+b.vx.toFixed(2), vy:+b.vy.toFixed(2)})),
  pb: (id,p)=>{ const b=balls.find(b=>b.id===id); if(b&&state!=='run'){ b.x=p.x; b.y=p.y; } }
};
window.__8ball = {
  layout: () => balls.filter(b=>b.alive).map(b=>({id:b.id, x:b.x, y:b.y})),
  guide: () => {
    computeGuide();
    if(!guide) return null;
    let len = 0;
    for(let i=1;i<guide.pts.length;i++) len += Math.hypot(guide.pts[i].x-guide.pts[i-1].x, guide.pts[i].y-guide.pts[i-1].y);
    return {len:+len.toFixed(1), hit: guide.hit ? guide.hit.id : null, dropped: !!guide.dropped,
      end:{x:+guide.end.x.toFixed(1), y:+guide.end.y.toFixed(1)},
      pts: guide.pts.map(p=>({x:+p.x.toFixed(1), y:+p.y.toFixed(1)}))};
  },
  plan: () => aiPlan(),
  targets: () => shotTargets().map(b=>b.id),
  turn: () => turn,
  state: () => state,
  diff: () => difficulty,
  setDiff: d => { difficulty = DIFFS[d] ? d : 'normal'; return difficulty; },
  pottedThisShot: () => pottedThisShot.slice(),
  groups: () => groups.slice(),
  start: m => startGame(m || 'cpu'),
  autoPlay: () => {
    turn = 1;
    const c = cue();
    if(state === 'hand'){ const s = findHandSpotCpu(); c.x = s.x; c.y = s.y; c.alive = true; c.vx = c.vy = 0; }
    beginCpu(false);
  },
  frame: n => { for(let i=0;i<(n||1);i++) tick(1/60); },
  escape: () => escapeAngle(shotTargets().map(b=>b.id)),
  fan: () => legalFanAngle(shotTargets().map(b=>b.id)),
  simulate: (angle, power) => simulateShot(balls.filter(b=>b.alive).map(b=>({id:b.id, x:b.x, y:b.y})), angle, power),
  setup: cfg => {
    mode = 'cpu'; turn = 1; state = 'cpu'; cpuTimer = 1e9; cpuShot = null;
    if(cfg.groups !== undefined) groups = cfg.groups.slice();
    if(cfg.openTable !== undefined) openTable = !!cfg.openTable;
    breakShot = !!cfg.breakShot;
    firstHit = null; pottedThisShot = [];
    for(const b of balls){ b.alive = false; b.vx = b.vy = 0; }
    for(const spec of cfg.balls){
      let b = balls.find(x=>x.id===spec.id);
      if(!b){ b = ball(spec.id); balls.push(b); }
      b.alive = true; b.x = spec.x; b.y = spec.y; b.vx = b.vy = 0;
    }
    return true;
  },
  handSpot: () => findHandSpotCpu(),
  reach: (x, y) => shotTargets().some(t => clearPath(balls.filter(b=>b.alive), x, y, t.x, t.y, [0,t.id], R*1.9))
};

/* ================= rendering ================= */
function hex2rgb(h){ return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
function mix(c1, c2, t){
  const a = hex2rgb(c1), b = hex2rgb(c2);
  return 'rgb('+[0,1,2].map(i=>Math.round(a[i]+(b[i]-a[i])*t)).join(',')+')';
}
function shade(h, t){ return mix(h, '#000000', t); }
function tint(h, t){ return mix(h, '#ffffff', t); }

function draw(){
  const {ox, oy, scale} = viewParams();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  // room
  const g0 = ctx.createRadialGradient(SW/2, SH/2, 60, SW/2, SH/2, Math.max(SW,SH)*0.8);
  g0.addColorStop(0, '#232830'); g0.addColorStop(1, '#0d0f13');
  ctx.fillStyle = g0; ctx.fillRect(0,0,SW,SH);

  ctx.save();
  if(VERT){
    // rotate -90°: world +x points up (rack at top), world +y points right (cue at bottom)
    ctx.translate(ox, oy);
    ctx.scale(scale, scale);
    ctx.rotate(-Math.PI/2);
    ctx.translate(-PW, 0);
  } else {
    ctx.translate(ox, oy); ctx.scale(scale, scale);
  }

  // ---- rails (wood)
  const wgrad = ctx.createLinearGradient(0, -RAIL, 0, PH+RAIL);
  wgrad.addColorStop(0, '#8a5a2b'); wgrad.addColorStop(0.5, '#6e441f'); wgrad.addColorStop(1, '#542f13');
  ctx.fillStyle = wgrad;
  roundRect(ctx, -RAIL, -RAIL, PW+2*RAIL, PH+2*RAIL, 6);
  ctx.fill();
  // wood grain hint
  ctx.globalAlpha = 0.08; ctx.fillStyle = '#2c1a08';
  for(let x=-RAIL; x<PW+RAIL; x+=7){ ctx.fillRect(x, -RAIL+2, 1.6, PH+2*RAIL-4); }
  ctx.globalAlpha = 1;
  // inner cushion lip (darker edge around playfield)
  ctx.lineWidth = 1.1; ctx.strokeStyle = '#231507';
  roundRect(ctx, -RAIL+0.4, -RAIL+0.4, PW+2*RAIL-0.8, PH+2*RAIL-0.8, 6); ctx.stroke();
  // cushion strips (felt-coloured bumpers)
  const cush = 2.4;
  ctx.fillStyle = '#12703c';
  ctx.fillRect(-cush, -cush, PW+2*cush, cush);                         // top
  ctx.fillRect(-cush, PH, PW+2*cush, cush);                            // bottom
  ctx.fillRect(-cush, 0, cush, PH);                                    // left
  ctx.fillRect(PW, 0, cush, PH);                                       // right
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  ctx.fillRect(-0.4, -0.4, PW+0.8, 0.8); ctx.fillRect(-0.4, PH-0.4, PW+0.8, 0.8);
  ctx.fillRect(-0.4, 0, 0.8, PH); ctx.fillRect(PW-0.4, 0, 0.8, PH);

  // diamonds
  ctx.fillStyle = 'rgba(245,238,210,.75)';
  for(let i=1;i<=3;i++){ const x = PW*i/8; dotRail(x, -RAIL/2); dotRail(x, PH+RAIL/2);
    const y = PH*i/8; dotRail(-RAIL/2, y); dotRail(PW+RAIL/2, y); }
  for(let i=5;i<=7;i++){ const x = PW*i/8; dotRail(x, -RAIL/2); dotRail(x, PH+RAIL/2);
    const y = PH*i/8; dotRail(-RAIL/2, y); dotRail(PW+RAIL/2, y); }

  // ---- felt
  const fg = ctx.createRadialGradient(PW/2, PH/2, 10, PW/2, PH/2, PW*0.62);
  fg.addColorStop(0, '#128a4d'); fg.addColorStop(0.7, '#0e7040'); fg.addColorStop(1, '#0a5330');
  ctx.fillStyle = fg; ctx.fillRect(0, 0, PW, PH);
  // subtle carpet noise
  ctx.globalAlpha = 0.05; ctx.fillStyle = '#000';
  for(let x=4;x<PW;x+=6) for(let y=4;y<PH;y+=6) if((x+y)%12===0) ctx.fillRect(x, y, 1.2, 1.2);
  ctx.globalAlpha = 1;
  // head string + spots
  ctx.strokeStyle='rgba(255,255,255,.09)'; ctx.lineWidth=0.5;
  ctx.beginPath(); ctx.moveTo(PW*0.25, 0); ctx.lineTo(PW*0.25, PH); ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.25)';
  [[PW*0.25, PH/2],[PW*0.5, PH/2],[PW*0.75, PH/2]].forEach(([x,y])=>{
    ctx.beginPath(); ctx.arc(x, y, 0.7, 0, Math.PI*2); ctx.fill();
  });

  // ---- pockets (over felt, drawn after felt so felt covers nothing weird)
  for(const p of POCKETS){
    const pr = p.r*1.12;
    // metal ring
    ctx.beginPath(); ctx.arc(p.x, p.y, pr, 0, Math.PI*2);
    const rg = ctx.createRadialGradient(p.x, p.y-1, pr*0.4, p.x, p.y, pr);
    rg.addColorStop(0, '#101014'); rg.addColorStop(0.85, '#08080c'); rg.addColorStop(1, '#141419');
    ctx.fillStyle = rg; ctx.fill();
    ctx.lineWidth = 0.9; ctx.strokeStyle = 'rgba(255,255,255,.14)'; ctx.stroke();
  }

  // pocket flash
  if(flashPocket && flashPocket.t>0){
    const f = flashPocket;
    ctx.globalAlpha = f.t*0.8;
    ctx.beginPath(); ctx.arc(f.x, f.y, (1.4-f.t)*pocketPr(f), 0, Math.PI*2);
    ctx.strokeStyle = '#8dedb4'; ctx.lineWidth = 1.4; ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // ---- balls
  for(const b of balls){
    if(!b.alive) continue;
    drawBall(b);
  }

  // ball in hand ghost
  if(state==='hand'){
    ctx.globalAlpha = .55;
    drawBall({id:0, x:handX, y:handY, alive:true});
    ctx.globalAlpha = 1;
    if(handOK){
      ctx.strokeStyle='rgba(140,235,175,.9)'; ctx.lineWidth=0.6;
      ctx.beginPath(); ctx.arc(handX, handY, R*1.5, 0, Math.PI*2); ctx.stroke();
    } else {
      ctx.strokeStyle='rgba(235,120,110,.9)'; ctx.lineWidth=0.8;
      ctx.beginPath(); ctx.arc(handX, handY, R*1.5, 0, Math.PI*2); ctx.stroke();
    }
  }

  // ---- aim guide + cue
  if((state==='aim' || state==='cpu' || state==='cpu-wait') && cue().alive){
    computeGuide();
    drawGuide();
    drawCueStick();
  }

  ctx.restore();

  drawHUD(ox, oy, scale);
  drawControls();
}

function pocketPr(p){ return p.r*1.12; }
function dotRail(x, y){ ctx.beginPath(); ctx.arc(x, y, 0.55, 0, Math.PI*2); ctx.fill(); }

function roundRect(c, x, y, w, h, r){
  c.beginPath();
  c.moveTo(x+r, y);
  c.arcTo(x+w, y, x+w, y+h, r);
  c.arcTo(x+w, y+h, x, y+h, r);
  c.arcTo(x, y+h, x, y, r);
  c.arcTo(x, y, x+w, y, r);
  c.closePath();
}

function drawBall(b){
  const color = BALL_COLORS[b.id];
  const x = b.x, y = b.y;
  // shadow
  ctx.globalAlpha = 0.35;
  ctx.beginPath(); ctx.ellipse(x+R*0.28, y+R*0.38, R*1.02, R*0.92, 0, 0, Math.PI*2);
  ctx.fillStyle = '#000'; ctx.fill();
  ctx.globalAlpha = 1;

  if(b.id === 0){
    const g = ctx.createRadialGradient(x-R*0.35, y-R*0.4, R*0.1, x, y, R);
    g.addColorStop(0, '#ffffff'); g.addColorStop(0.55, '#efece2'); g.addColorStop(1, '#b8b2a2');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI*2); ctx.fill();
    return;
  }

  if(b.id <= 8){
    const g = ctx.createRadialGradient(x-R*0.35, y-R*0.4, R*0.1, x, y, R);
    g.addColorStop(0, tint(color, .5)); g.addColorStop(0.55, color); g.addColorStop(1, shade(color, .38));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI*2); ctx.fill();
  } else if(b.id < 16){
    // stripe: white ball with a colour band
    const g = ctx.createRadialGradient(x-R*0.35, y-R*0.4, R*0.1, x, y, R);
    g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#cfc9bc');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI*2); ctx.fill();
    ctx.save();
    ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI*2); ctx.clip();
    const bandH = R*0.62;
    const bg = ctx.createLinearGradient(x, y-bandH, x, y+bandH);
    bg.addColorStop(0, tint(BALL_COLORS[b.id], .25)); bg.addColorStop(0.5, BALL_COLORS[b.id]); bg.addColorStop(1, shade(BALL_COLORS[b.id], .3));
    ctx.fillStyle = bg;
    ctx.fillRect(x-R, y-bandH, R*2, bandH*2);
    ctx.restore();
    // round the ball edge again
    ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI*2);
    const eg = ctx.createRadialGradient(x, y, R*0.55, x, y, R);
    eg.addColorStop(0, 'rgba(0,0,0,0)'); eg.addColorStop(1, 'rgba(0,0,0,.28)');
    ctx.fillStyle = eg; ctx.fill();
  }
  // number tag
  ctx.save();
  if(VERT){
    // counter-rotate so numbers read upright on the rotated table
    ctx.translate(x, y); ctx.rotate(Math.PI/2); ctx.translate(-x, -y);
  }
  ctx.beginPath(); ctx.arc(x, y, R*0.52, 0, Math.PI*2); ctx.clip();
  ctx.fillStyle = '#f8f6ef';
  ctx.beginPath(); ctx.arc(x, y, R*0.52, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#15151a';
  ctx.font = 'bold '+(R*0.72)+'px system-ui, sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(String(b.id), x, y+R*0.06);
  ctx.restore();
  // gloss
  ctx.beginPath(); ctx.ellipse(x-R*0.35, y-R*0.42, R*0.4, R*0.28, -0.6, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.fill();
}

function drawGuide(){
  const c = cue();
  if(!guide || !guide.pts || guide.pts.length < 2) return;
  // start at the edge of the cue ball rather than under it
  let first = 0;
  while(first < guide.pts.length - 1 &&
        Math.hypot(guide.pts[first].x-c.x, guide.pts[first].y-c.y) < R*1.15) first++;

  ctx.save();
  ctx.globalAlpha = .85;
  ctx.setLineDash(aimLocked ? [] : [1.6, 2.2]);   // solid once the angle is set
  ctx.lineWidth = 0.55;
  ctx.strokeStyle = 'rgba(240,248,242,.9)';
  ctx.beginPath();
  ctx.moveTo(guide.pts[first].x, guide.pts[first].y);
  for(let i=first+1; i<guide.pts.length; i++) ctx.lineTo(guide.pts[i].x, guide.pts[i].y);
  ctx.stroke();

  const e = guide.end;
  if(guide.hit){
    const b = guide.hit;
    // ghost ball where the cue ball would arrive
    ctx.setLineDash([]);
    ctx.globalAlpha = .5;
    ctx.beginPath(); ctx.arc(e.x, e.y, R, 0, Math.PI*2);
    ctx.lineWidth = 0.55; ctx.strokeStyle = 'rgba(235,250,240,.9)'; ctx.stroke();
    // where the object ball goes
    const nx = b.x-e.x, ny = b.y-e.y;
    const nl = Math.hypot(nx, ny) || 1;
    const ux = nx/nl, uy = ny/nl;
    const gl = Math.min(38, Math.hypot(b.x-e.x, b.y-e.y)*3);
    ctx.globalAlpha = .6;
    ctx.setLineDash([1.4, 2.2]);
    ctx.strokeStyle = 'rgba(235,245,238,.65)';
    ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x+ux*gl, b.y+uy*gl); ctx.stroke();
  } else {
    // a dot where the cue ball will stop, or a ring if the line ends in a pocket
    ctx.setLineDash([]);
    ctx.globalAlpha = .55;
    ctx.beginPath();
    if(guide.dropped){ ctx.arc(e.x, e.y, R*1.15, 0, Math.PI*2); ctx.strokeStyle='rgba(140,235,175,.8)'; ctx.lineWidth=0.6; ctx.stroke(); }
    else { ctx.arc(e.x, e.y, 0.65, 0, Math.PI*2); ctx.fillStyle='rgba(240,248,242,.8)'; ctx.fill(); }
  }
  ctx.setLineDash([]);
  ctx.restore();
}

function drawCueStick(){
  const c = cue();
  const back = aimAngle + Math.PI;
  const swing = (state==='cpu' || state==='cpu-wait') ? (cpuShot !== null ? cpuShot : 0.4) : power;
  const pull = 2 + swing*16;
  const len = 72;
  // the tip meets the ball at the contact point, so english sits the stick off-centre
  const rx = -Math.sin(aimAngle), ry = Math.cos(aimAngle);
  const side = (spin.x||0)*R*0.85;
  const bx = c.x + Math.cos(back)*(R*1.2 + pull) + rx*side;
  const by = c.y + Math.sin(back)*(R*1.2 + pull) + ry*side;
  const ex = bx + Math.cos(back)*len;
  const ey = by + Math.sin(back)*len;
  // tappered shaft: draw as polygon
  const w1 = 0.9, w2 = 2.3;
  const ux = Math.cos(back), uy = Math.sin(back);
  const pxn = -uy, pyn = ux;
  const grad = ctx.createLinearGradient(bx, by, ex, ey);
  grad.addColorStop(0, '#d9c39a'); grad.addColorStop(0.25, '#b98d54'); grad.addColorStop(1, '#3d2a16');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(bx+pxn*w1, by+pyn*w1);
  ctx.lineTo(ex+pxn*w2, ey+pyn*w2);
  ctx.lineTo(ex-pxn*w2, ey-pyn*w2);
  ctx.lineTo(bx-pxn*w1, by-pyn*w1);
  ctx.closePath(); ctx.fill();
  // wrap section (dark) near back
  const wx = bx+ux*len*0.72, wy = by+uy*len*0.72;
  ctx.strokeStyle = '#241812'; ctx.lineWidth = 2.1; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(wx, wy); ctx.lineTo(bx+ux*len*0.88, by+uy*len*0.88); ctx.stroke();
  // tip (light blue)
  const tx = bx-ux*1.0, ty = by-uy*1.0;
  ctx.beginPath(); ctx.arc(tx + ux*0.6, ty + uy*0.6, w1*0.95, 0, Math.PI*2);
  ctx.fillStyle = '#6fa8d8'; ctx.fill();
  ctx.beginPath(); ctx.arc(bx, by, w1*0.55, 0, Math.PI*2); ctx.fillStyle='#0c0c0d'; ctx.fill();
  // contact point on the ball, so the english you picked is visible at the table
  if(hasSpin()){
    const ax = Math.cos(aimAngle), ay = Math.sin(aimAngle);
    const mx = c.x + rx*side*0.72 + ax*(spin.y||0)*R*0.72;
    const my = c.y + ry*side*0.72 + ay*(spin.y||0)*R*0.72;
    ctx.beginPath(); ctx.arc(mx, my, R*0.3, 0, Math.PI*2);
    ctx.fillStyle = '#cf4a42'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 0.5; ctx.stroke();
  }
  ctx.lineCap='butt';
}

function drawHUD(ox, oy, scale){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const hudH = 46;
  const compact = SW < 560;          // phone / narrow: tighter chips & shorter status
  // top bar
  ctx.fillStyle = 'rgba(13,17,15,.92)';
  ctx.fillRect(0, 0, SW, hudH);
  ctx.fillStyle = 'rgba(255,255,255,.08)';
  ctx.fillRect(0, hudH-1, SW, 1);

  const chips = [
    {p:0, x:16},
    {p:1, x:SW-16, right:true}
  ];
  const dotGap = compact ? 11 : 13, dotR = compact ? 3.9 : 4.5, chipR = compact ? 11.5 : 13;
  for(const ch of chips){
    const p = ch.p;
    const active = turn===p && state!=='menu' && state!=='over';
    const label = nameOf(p);
    ctx.font = (compact?'700 13px':'700 15px') + ' system-ui, sans-serif';
    ctx.textAlign = ch.right ? 'right' : 'left';
    ctx.textBaseline = 'middle';
    const tx = ch.right ? ch.x-30 : ch.x+30;
    if(active){
      ctx.fillStyle = 'rgba(120,220,160,.95)';
      ctx.beginPath(); ctx.arc(ch.x, hudH/2, chipR, 0, Math.PI*2); ctx.fill();
      ctx.font = '700 13px system-ui, sans-serif';
      ctx.fillStyle = '#0c231a';
      ctx.fillText('≫', ch.x, hudH/2 + 1);
      ctx.font = (compact?'700 13px':'700 15px') + ' system-ui, sans-serif';
      ctx.fillStyle = '#eef4ee';
    } else {
      ctx.beginPath(); ctx.arc(ch.x, hudH/2, chipR, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(255,255,255,.09)'; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.14)'; ctx.lineWidth=1.5; ctx.stroke();
      ctx.font = '700 13px system-ui, sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,.45)';
      ctx.fillText(p===0?'1':(mode==='cpu'?'C':'2'), ch.x, hudH/2+1);
      ctx.font = (compact?'700 13px':'700 15px') + ' system-ui, sans-serif';
      ctx.fillStyle = '#aab6ac';
    }
    ctx.fillText(label, tx, hudH/2-6);
    // group dots
    const g = groups[p];
    ctx.font = '600 10px system-ui, sans-serif';
    if(g){
      const grp = balls.filter(b=>b.alive && groupOf(b.id)===g);
      const startX = ch.right ? tx - grp.length*dotGap : tx;
      ctx.textAlign = 'left';
      [...grp].sort((a,b)=>a.id-b.id).forEach((b, i)=>{
        const cx = ch.right ? tx - (grp.length-i)*dotGap : startX + i*dotGap;
        ctx.beginPath(); ctx.arc(cx+dotR, hudH/2+8, dotR, 0, Math.PI*2);
        ctx.fillStyle = BALL_COLORS[b.id]; ctx.fill();
        if(b.id>8){
          ctx.beginPath(); ctx.arc(cx+dotR, hudH/2+8, compact?2.2:2.6, 0, Math.PI*2);
          ctx.fillStyle = '#f2efe7'; ctx.fill();
        }
      });
      if(grp.length===0 && (!openTable)){
        ctx.fillStyle='#8dedb4'; ctx.textAlign = ch.right?'right':'left';
        ctx.font='600 9px system-ui, sans-serif';
        ctx.fillText('8 BALL SHOT', tx, hudH/2+10);
      }
    } else {
      ctx.fillStyle = 'rgba(255,255,255,.35)';
      ctx.textAlign = ch.right?'right':'left';
      ctx.fillText('OPEN', tx, hudH/2+10);
    }
  }

  // centre status
  ctx.font=(compact?'600 10.5px':'600 12px') + ' system-ui, sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  let status='';
  if(state==='hand') status= compact ? 'BALL IN HAND' : 'BALL IN HAND — TAP & DRAG TO PLACE';
  else if(state==='run') status='...';
  else if(breakShot && state==='aim') status='BREAK';
  else if(openTable && state!=='cpu') status='OPEN TABLE';
  else if(groups[turn]) status=(groups[turn]==='solid'?'SOLIDS':'STRIPES') + (isCpu()?'':' — SHOOT');
  if(isCpu() && state==='cpu') status= compact ? 'CPU...' : 'CPU THINKING...';
  ctx.fillStyle='rgba(255,255,255,.5)';
  ctx.fillText(status, SW/2, hudH/2);

  // aiming hint, under the felt
  if(!compact){
    let hint = '';
    if(state==='aim'){
      hint = aimLocked ? 'angle set \u2014 shoot when ready \u00b7 arrows power \u00b7 wasd english'
           : aimMode   ? 'move to aim \u2014 click again to set the angle'
           :             'click the felt to aim \u00b7 arrows power \u00b7 wasd english';
    }
    if(hint){
      ctx.font='500 11px system-ui, sans-serif';
      ctx.fillStyle='rgba(255,255,255,.26)';
      ctx.textAlign='center'; ctx.textBaseline='alphabetic';
      ctx.fillText(hint, (SW - railW())/2, SH - 12);
    }
  }
}

const hasSpin = () => Math.abs(spin.x) > 0.02 || Math.abs(spin.y) > 0.02;

function drawControls(){
  const L = ctrlLayout();
  CTRL = L;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  // the rail beside the table
  ctx.fillStyle='rgba(13,17,15,.95)';
  ctx.fillRect(L.x0, HUD_H, L.w, SH - HUD_H);
  ctx.fillStyle='rgba(255,255,255,.08)';
  ctx.fillRect(L.x0, HUD_H, 1, SH - HUD_H);

  const live = state==='aim';
  ctx.globalAlpha = live ? 1 : .42;
  ctx.textBaseline = 'middle';
  const cx = L.spin.x;

  // ---- english
  const s = L.spin;
  ctx.font='600 9.5px system-ui, sans-serif';
  ctx.textAlign='center'; ctx.fillStyle='rgba(255,255,255,.42)';
  ctx.fillText('SPIN', cx, L.spinLabelY);
  ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
  ctx.fillStyle = '#efece2'; ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.3)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.strokeStyle = 'rgba(0,0,0,.16)'; ctx.lineWidth = .8;
  ctx.beginPath();
  ctx.moveTo(s.x - s.r*.82, s.y); ctx.lineTo(s.x + s.r*.82, s.y);
  ctx.moveTo(s.x, s.y - s.r*.82); ctx.lineTo(s.x, s.y + s.r*.82);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(s.x, s.y, s.r*.34, 0, Math.PI*2); ctx.strokeStyle = 'rgba(0,0,0,.12)'; ctx.stroke();
  const dx = s.x + spin.x*s.r*.72, dy = s.y - spin.y*s.r*.72;
  ctx.beginPath(); ctx.arc(dx, dy, s.r*.24, 0, Math.PI*2);
  ctx.fillStyle = '#cf4a42'; ctx.fill();

  // ---- power, filled from the bottom up
  ctx.font='600 9.5px system-ui, sans-serif';
  ctx.textAlign='center'; ctx.fillStyle='rgba(255,255,255,.42)';
  ctx.fillText('POWER', cx, L.powerLabelY);
  ctx.font='700 11px ui-monospace, SFMono-Regular, Menlo, monospace';
  ctx.fillStyle='rgba(255,255,255,.55)';
  ctx.fillText(Math.round(power*100)+'%', cx, L.powerLabelY + (L.compact ? 12 : 14));

  const t = L.track, tw = t.w, top = t.y0, bot = t.y1;
  ctx.fillStyle='rgba(255,255,255,.12)';
  roundRect(ctx, t.x-tw/2, top, tw, bot-top, tw/2); ctx.fill();
  const ky = bot - (bot-top)*power;
  if(power > 0.005){
    const pg = ctx.createLinearGradient(0, bot, 0, top);
    pg.addColorStop(0, '#59bd83'); pg.addColorStop(.55, '#d6c85d'); pg.addColorStop(1, '#df564e');
    ctx.fillStyle = pg;
    roundRect(ctx, t.x-tw/2, ky, tw, Math.max(tw, bot-ky), tw/2); ctx.fill();
  }
  ctx.beginPath(); ctx.arc(t.x, ky, tw*1.6, 0, Math.PI*2);
  ctx.fillStyle = '#eef4ee'; ctx.fill();

  // ---- shoot
  const b = L.shoot;
  ctx.beginPath();
  roundRect(ctx, b.x, b.y, b.w, b.h, 6);
  ctx.fillStyle = live ? 'rgba(73,209,122,.95)' : 'rgba(255,255,255,.10)';
  ctx.fill();
  ctx.fillStyle = live ? '#0c3d21' : 'rgba(255,255,255,.5)';
  ctx.font = '700 ' + (L.compact ? 12 : 13) + 'px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('SHOOT', b.x + b.w/2, b.y + b.h/2 + .5);
  ctx.globalAlpha = 1;
}

/* ================= loop ================= */
function tick(dt){
  if(state==='run'){
    // a full-power break moves 13px a frame: subdivide by speed or it tunnels through balls
    let fast = 0;
    for(const b of balls) if(b.alive) fast = Math.max(fast, Math.hypot(b.vx, b.vy));
    const SUB = Math.max(5, Math.min(26, Math.ceil(fast*dt/(R*0.45)))), h = dt/SUB;
    for(let s=0;s<SUB && state==='run';s++){
      for(const b of balls){ if(b.alive) stepBall(b, h); }
      collisions();
    }
    if(!anyMoving()){
      // settle
      for(const b of balls){ b.vx = b.vy = 0; }
      endShot();
    }
  } else if(state==='cpu-wait'){
    cpuShotT -= dt;
    if(cpuShotT <= 0 && cpuShot !== null){ const p = cpuShot; cpuShot = null; strike(p); }
  } else if(state==='cpu'){
    cpuTick(dt);
  }
  if(flashPocket){ flashPocket.t -= dt*2.4; if(flashPocket.t<=0) flashPocket = null; }
}

let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now-last)/1000);
  last = now;
  tick(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

})();
</script>
</body>
