<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Circuit</title>
<style>
:root{--paper:#f5f2ea;--ink:#191713;--dim:#6b6558;--red:#b3261e;--rule:#d8d2c4;--tar:#fffdf7}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:100vh;padding:12px;user-select:none;-webkit-user-select:none}
header,footer{width:min(100%,760px);display:flex;align-items:baseline;justify-content:space-between;gap:10px}
h1{margin:0;font-size:13px;font-weight:600;letter-spacing:.14em}
h1 span{color:var(--red)}
#hud{font-size:12px;letter-spacing:.05em;color:var(--dim);font-variant-numeric:tabular-nums}
#hud b{color:var(--ink);font-weight:600}
canvas{display:block;width:min(100%,760px);height:auto;aspect-ratio:760/520;border:1px solid var(--ink);background:var(--tar);touch-action:none}
footer{align-items:center;font-size:11px;color:var(--dim)}
footer p{margin:0}
#acts{display:flex;gap:6px}
button{font:600 11px ui-monospace,monospace;letter-spacing:.06em;border:1px solid var(--ink);background:none;color:inherit;border-radius:3px;padding:7px 10px;cursor:pointer}
button:active{background:var(--ink);color:var(--paper)}
#pad{display:none;gap:6px}
#pad button{width:42px;height:38px;padding:0;font-size:13px}
@media(max-width:649px){#pad{display:flex}footer p{display:none}}
</style></head><body>
<header><h1>CIRCUIT<span>.</span></h1>
<div id="hud"><span id="tag1"></span><b id="lap1">1/3</b> <span id="time1">0.00</span><span id="duel" hidden> · <span id="tag2">P2</span><b id="lap2">1/3</b> <span id="time2">0.00</span></span></div></header>
<canvas id="game" width="760" height="520" aria-label="Top-down circuit over three timed laps"></canvas>
<footer>
<p id="hint">Arrows or WASD to drive · R restarts · three laps</p>
<div id="pad">
<button type="button" data-key="left" aria-label="Steer left">←</button>
<button type="button" data-key="up" aria-label="Accelerate">▲</button>
<button type="button" data-key="down" aria-label="Brake">▼</button>
<button type="button" data-key="right" aria-label="Steer right">→</button>
</div>
<div id="acts">
<button id="mode" type="button">Two players</button>
<button id="track" type="button">Oval</button>
</div>
</footer>
<script>
"use strict";
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
const hint=document.getElementById("hint"),modeButton=document.getElementById("mode"),trackButton=document.getElementById("track");
const hudTag1=document.getElementById("tag1"),hudLap1=document.getElementById("lap1"),hudTime1=document.getElementById("time1");
const hudDuel=document.getElementById("duel"),hudLap2=document.getElementById("lap2"),hudTime2=document.getElementById("time2");
const W=760,H=520,CX=W/2,CY=H/2,POINTS=720,HALF=26,LAPS=3;
const fmt=seconds=>seconds.toFixed(2);

// Four drawn circuits rather than one wobbling ellipse. Each is smoothed
// through its control points and then scaled to the same length, so a race time
// means the same thing on any of them: what changes is where the corners are.
const TRACKS=[
  {name:"Oval",controls:[[150,180],[300,115],[520,110],[650,175],[665,285],[560,370],[360,390],[190,340],[125,255]]},
  {name:"Rounded",controls:[[165,120],[500,120],[630,160],[665,235],[640,315],[545,370],[400,395],[255,392],[155,340],[122,255],[128,170]]},
  {name:"Saddle",controls:[[150,150],[350,115],[560,130],[665,205],[655,310],[560,375],[470,320],[390,355],[300,405],[190,380],[130,290],[135,205]]},
  {name:"Chicane",controls:[[150,175],[300,125],[370,160],[455,112],[600,130],[668,205],[655,305],[560,380],[395,405],[235,388],[140,325],[118,235]]}
];
const TRACK_LENGTH=1420;

// Catmull-Rom through the drawn points, so the loop is the shape that was drawn
// and not a soft approximation of it.
function spline(controls){
  const n=controls.length,out=[];
  for(let i=0;i<n;i++){
    const p0=controls[(i-1+n)%n],p1=controls[i],p2=controls[(i+1)%n],p3=controls[(i+2)%n];
    for(let s=0;s<24;s++){
      const t=s/24,t2=t*t,t3=t2*t;
      out.push({
        x:0.5*(2*p1[0]+(p2[0]-p0[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(3*p1[0]-p0[0]-3*p2[0]+p3[0])*t3),
        y:0.5*(2*p1[1]+(p2[1]-p0[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(3*p1[1]-p0[1]-3*p2[1]+p3[1])*t3)
      });
    }
  }
  return out;
}
// Lap progress is counted in samples, so they have to be evenly spaced: on a
// stretched curve a long corner would otherwise tick round faster than a
// straight of the same length.
function resample(raw,count){
  const step=[],cum=[0];
  for(let i=0;i<raw.length;i++){
    const a=raw[i],b=raw[(i+1)%raw.length];
    step.push(Math.hypot(b.x-a.x,b.y-a.y));
    cum.push(cum[i]+step[i]);
  }
  const total=cum[cum.length-1],out=[];
  let j=0;
  for(let i=0;i<count;i++){
    const target=total*i/count;
    while(j<step.length-1&&cum[j+1]<target)j++;
    const t=step[j]?(target-cum[j])/step[j]:0;
    const a=raw[j],b=raw[(j+1)%raw.length];
    out.push({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t});
  }
  return out;
}
function buildTrack(track){
  const pts=resample(spline(track.controls),POINTS);
  let total=0,cx=0,cy=0;
  for(let i=0;i<pts.length;i++){
    const a=pts[i],b=pts[(i+1)%pts.length];
    total+=Math.hypot(b.x-a.x,b.y-a.y);
    cx+=a.x;cy+=a.y;
  }
  const k=TRACK_LENGTH/total;
  cx/=pts.length;cy/=pts.length;
  return pts.map(p=>({x:CX+(p.x-cx)*k,y:CY+(p.y-cy)*k}));
}
// The day's seed picks which circuit everyone opens on, so the daily board is
// still one comparison; the button below then changes it for practice.
function startTrack(){
  const seed=Number(window.__boredSeed&&window.__boredSeed.seed);
  return Number.isFinite(seed)&&seed>0?seed%TRACKS.length:0;
}

// One car is a time trial. Two cars is the same clock twice: they never touch,
// so a friend can race alongside without changing what a lap costs. The board
// ranks the whole three laps either way, so the second car is a rival, not a
// different score.
const blank=()=>({up:false,down:false,left:false,right:false});
const keys={p1:blank(),p2:blank()};
const ARROWS={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right"};
const WASD={w:"up",a:"left",s:"down",d:"right"};
let trackIndex=startTrack(),path=buildTrack(TRACKS[trackIndex]),twoPlayer=false,cars=[];

function racer(){
  const p0=path[0],p1=path[1];
  // time is the running race clock in seconds; total freezes it at the line, so
  // the score is all three laps together and not the best one of them.
  return {x:p0.x,y:p0.y,a:Math.atan2(p1.y-p0.y,p1.x-p0.x),v:0,
    progress:0,lastIndex:0,laps:0,time:0,total:0,started:false,finished:false,off:false};
}
function place(){
  cars=[racer()];
  if(twoPlayer)cars.push(racer());
  keys.p1=blank();keys.p2=blank();
  hint.textContent=hintText();
  paintHud();
}
// Nearest point on the centreline: distance decides grass, the index decides
// how far around the lap the car is, which is what stops a corner being cut.
function nearest(x,y){
  let best2=Infinity,index=0;
  for(let i=0;i<POINTS;i+=2){
    const dx=path[i].x-x,dy=path[i].y-y,d=dx*dx+dy*dy;
    if(d<best2){best2=d;index=i}
  }
  return {index,distance:Math.sqrt(best2)};
}
function idleHint(){
  return twoPlayer?"P1 arrows · P2 W A S D · R restarts · three laps":"Arrows or WASD to drive · R restarts · three laps";
}
function hintText(){
  const one=cars[0],two=cars[1];
  if(one&&one.finished){
    if(two&&!two.finished)return "P1 "+fmt(one.total)+" · P2 still driving";
    if(two)return "P1 "+fmt(one.total)+" · P2 "+fmt(two.total)+" · R to race again";
    return "Race time "+fmt(one.total)+" · R to run it again";
  }
  if(two&&two.finished)return "P2 "+fmt(two.total)+" · P1 still driving";
  if(one&&one.off)return "Off track — the grass is slow.";
  return idleHint();
}
function paintHud(){
  const one=cars[0],two=cars[1];
  hudTag1.textContent=twoPlayer?"P1 ":"";
  hudLap1.textContent=Math.min(one.laps+1,LAPS)+"/"+LAPS;
  hudTime1.textContent=fmt(one.finished?one.total:one.time);
  hudDuel.hidden=!twoPlayer;
  if(two){
    hudLap2.textContent=Math.min(two.laps+1,LAPS)+"/"+LAPS;
    hudTime2.textContent=fmt(two.finished?two.total:two.time);
  }
}
function drive(car,input,dt){
  if(car.finished)return;
  const gas=input.up,slow=input.down,left=input.left,right=input.right;
  if(!car.started){
    if(!(gas||slow||left||right))return;
    car.started=true;
  }
  car.time+=dt;
  const near=nearest(car.x,car.y);
  car.off=near.distance>HALF;
  if(gas)car.v+=(car.off?140:250)*dt;
  if(slow)car.v-=360*dt;
  if(!gas&&!slow)car.v-=car.v*1.1*dt;
  if(car.off)car.v-=car.v*1.9*dt;
  car.v=Math.max(-70,Math.min(car.off?95:220,car.v));
  const grip=Math.min(1,Math.abs(car.v)/70);
  const steer=(left?-1:0)+(right?1:0);
  car.a+=steer*2.9*dt*grip*(car.v<0?-1:1);
  car.x+=Math.cos(car.a)*car.v*dt;
  car.y+=Math.sin(car.a)*car.v*dt;
  let delta=near.index-car.lastIndex;
  if(delta>POINTS/2)delta-=POINTS;else if(delta<-POINTS/2)delta+=POINTS;
  if(Math.abs(delta)<80)car.progress+=delta;
  car.lastIndex=near.index;
  while(car.laps<LAPS&&car.progress>=POINTS*(car.laps+1)){
    car.laps++;
    // Crossing the line on the last lap is the only thing that banks a score:
    // the clock has been running since the first keypress, so total is every
    // lap put together.
    if(car.laps>=LAPS){car.finished=true;car.total=car.time;car.v=0}
  }
}
function step(dt){
  if(!cars.length)return;
  drive(cars[0],keys.p1,dt);
  if(cars[1])drive(cars[1],keys.p2,dt);
  const text=hintText();
  if(text!==hint.textContent)hint.textContent=text;
  paintHud();
}
function trace(){
  ctx.beginPath();
  ctx.moveTo(path[0].x,path[0].y);
  for(let i=1;i<POINTS;i++)ctx.lineTo(path[i].x,path[i].y);
  ctx.closePath();
}
function drawCar(car,body,stripe){
  ctx.save();ctx.translate(car.x,car.y);ctx.rotate(car.a);
  ctx.fillStyle=body;ctx.fillRect(-7,-4.5,14,9);
  ctx.fillStyle=stripe;ctx.fillRect(4,-3,3,6);
  ctx.fillStyle="#f5f2ea";ctx.fillRect(-2,-2.5,3.5,5);
  ctx.restore();
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.lineJoin="round";ctx.lineCap="round";
  trace();ctx.strokeStyle="#e8e2d4";ctx.lineWidth=HALF*2+9;ctx.stroke();
  trace();ctx.strokeStyle="#fffdf7";ctx.lineWidth=HALF*2;ctx.stroke();
  trace();ctx.strokeStyle="#d8d2c4";ctx.lineWidth=1;ctx.setLineDash([7,11]);ctx.stroke();ctx.setLineDash([]);
  // Start and finish: a plain line across the road, painted once per lap.
  const p0=path[0],p1=path[2],ang=Math.atan2(p1.y-p0.y,p1.x-p0.x)+Math.PI/2;
  ctx.strokeStyle="#191713";ctx.lineWidth=2;ctx.beginPath();
  ctx.moveTo(p0.x+Math.cos(ang)*HALF,p0.y+Math.sin(ang)*HALF);
  ctx.lineTo(p0.x-Math.cos(ang)*HALF,p0.y-Math.sin(ang)*HALF);ctx.stroke();
  // The second car is ink and the first is red, so a shared start line reads.
  if(cars[1])drawCar(cars[1],"#191713","#fffdf7");
  if(cars[0])drawCar(cars[0],"#b3261e","#191713");
}
let last=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000||0);
  last=now;
  step(dt);draw();
  requestAnimationFrame(frame);
}

function steer(event,down){
  const key=event.key&&event.key.length===1?event.key.toLowerCase():event.key;
  if(ARROWS[key]){keys.p1[ARROWS[key]]=down;return true}
  if(WASD[key]){(twoPlayer?keys.p2:keys.p1)[WASD[key]]=down;return true}
  return false;
}
addEventListener("keydown",event=>{
  if(steer(event,true)){event.preventDefault();return}
  if(event.key==="r"||event.key==="R"){event.preventDefault();place()}
});
addEventListener("keyup",event=>{
  const key=event.key&&event.key.length===1?event.key.toLowerCase():event.key;
  if(ARROWS[key]){keys.p1[ARROWS[key]]=false;return}
  // Clear both sides: a key held through a mode switch must not stick.
  if(WASD[key]){keys.p1[WASD[key]]=false;keys.p2[WASD[key]]=false}
});
addEventListener("blur",()=>{keys.p1=blank();keys.p2=blank()});
for(const pad of document.querySelectorAll("#pad button")){
  const key=pad.dataset.key;
  const down=event=>{event.preventDefault();keys.p1[key]=true};
  const up=event=>{event.preventDefault();keys.p1[key]=false};
  pad.addEventListener("pointerdown",down);
  pad.addEventListener("pointerup",up);
  pad.addEventListener("pointercancel",up);
  pad.addEventListener("pointerleave",up);
}
modeButton.addEventListener("click",()=>{
  twoPlayer=!twoPlayer;
  modeButton.textContent=twoPlayer?"Solo":"Two players";
  place();
});
trackButton.addEventListener("click",()=>{
  trackIndex=(trackIndex+1)%TRACKS.length;
  path=buildTrack(TRACKS[trackIndex]);
  trackButton.textContent=TRACKS[trackIndex].name;
  place();
});

// The hub reads this after a run: integer metrics for the first car's finished
// three-lap race. Nothing scores until all three laps are in, because a clock
// stopped after one lap says nothing about the race.
window.__boredSnapshot=()=>({
  slug:"circuit",
  seconds:cars[0]?Math.round(cars[0].total||0):0,
  centiseconds:cars[0]?Math.round((cars[0].total||0)*100):0,
  laps:cars[0]?cars[0].laps:0,
  lapDone:!!(cars[0]&&cars[0].laps>=LAPS),
  finished:!!(cars[0]&&cars[0].finished),
  twoPlayer,
  offTrack:false
});

// The contract test drives the real step function along the real centreline
// rather than a copy of the lap maths, so a broken counter fails there.
window.__test={
  path:()=>path,cars:()=>cars,step,place,
  duel:()=>twoPlayer,setDuel:value=>{twoPlayer=!!value;place()},
  trackName:()=>TRACKS[trackIndex].name,
  shapes:()=>TRACKS.map(track=>({name:track.name,points:buildTrack(track)}))
};

trackButton.textContent=TRACKS[trackIndex].name;
place();
requestAnimationFrame(frame);
</script>
</body></html>
