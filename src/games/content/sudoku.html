<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sudoku</title>
<meta name="description" content="Nine by nine, three levels: fill every row, column and box without a repeat.">
<style>
  :root {
    --bg: #f6f5f0;
    --ink: #22221e;
    --muted: #7b7669;
    --hair: #d9d5c9;
    --cell: #fffdf7;
    --accent: #2f5d7a;
    --warn: #b0453a;
    --sans: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --board: min(92vw, 54vh, 372px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 13px/1.45 var(--sans);
    display: flex;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
  }
  #app {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 440px;
    min-height: 100vh;
    padding: 14px 16px 18px;
    gap: 12px;
  }
  header {
    width: var(--board);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    padding-bottom: 9px;
    border-bottom: 1px solid var(--hair);
  }
  h1 {
    font: 600 12px/1 var(--sans);
    letter-spacing: .14em;
    text-transform: uppercase;
  }
  #hud {
    display: flex;
    gap: 12px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
  }
  #hud b { font-weight: 400; color: var(--ink); font-variant-numeric: tabular-nums; }
  #levels {
    width: var(--board);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
  }
  #levels button, #tools button {
    font: 12px/1 var(--sans);
    letter-spacing: .04em;
    color: var(--muted);
    background: none;
    border: 1px solid var(--hair);
    border-radius: 3px;
    padding: 7px 4px;
    cursor: pointer;
  }
  #levels button:hover, #tools button:hover { color: var(--ink); border-color: var(--ink); }
  #levels button[aria-pressed="true"], #tools button[aria-pressed="true"] {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--bg);
  }
  #board {
    width: var(--board);
    height: var(--board);
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    grid-template-rows: repeat(9, 1fr);
    border: 1.5px solid var(--ink);
    background: var(--cell);
    touch-action: manipulation;
  }
  .cell {
    position: relative;
    display: grid;
    place-items: center;
    border: 0;
    border-right: 1px solid var(--hair);
    border-bottom: 1px solid var(--hair);
    border-radius: 0;
    background: none;
    color: var(--accent);
    font: 400 calc(var(--board) / 17) / 1 var(--mono);
    cursor: pointer;
    overflow: hidden;
  }
  .cell.edge-right { border-right-color: var(--ink); }
  .cell.edge-bottom { border-bottom-color: var(--ink); }
  .cell.last-col { border-right: 0; }
  .cell.last-row { border-bottom: 0; }
  .cell.given { color: var(--ink); font-weight: 600; }
  .cell.peer { background: #efece1; }
  .cell.same { background: #dde7ec; }
  .cell.sel { background: #cfdde5; box-shadow: inset 0 0 0 2px var(--accent); }
  .cell.clash { background: #f0dcd8; color: var(--warn); }
  .cell.clash.given { color: var(--warn); }
  .val { line-height: 1; }
  .marks {
    position: absolute;
    inset: 2px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    font: 400 calc(var(--board) / 46) / 1 var(--mono);
    color: var(--muted);
  }
  .marks[hidden] { display: none; }
  .marks i { font-style: normal; display: grid; place-items: center; }
  #pad {
    width: var(--board);
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    gap: 3px;
  }
  #pad button {
    aspect-ratio: 1;
    font: 400 calc(var(--board) / 17) / 1 var(--mono);
    color: var(--ink);
    background: var(--cell);
    border: 1px solid var(--hair);
    border-radius: 3px;
    cursor: pointer;
  }
  #pad button:hover { border-color: var(--ink); }
  #pad button:active { background: #e6e2d6; }
  #tools {
    width: var(--board);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
    margin-top: -4px;
  }
  #status {
    width: var(--board);
    min-height: 18px;
    text-align: center;
    font-size: 11.5px;
    color: var(--muted);
  }
  #status.done { color: var(--ink); }
</style>
</head>
<body>
<main id="app">
  <header>
    <h1>Sudoku</h1>
    <div id="hud" aria-live="off">
      <span>time <b id="clock">0:00</b></span>
      <span id="level">easy</span>
    </div>
  </header>

  <div id="levels" role="group" aria-label="Difficulty">
    <button type="button" data-level="easy" aria-pressed="true">Easy</button>
    <button type="button" data-level="medium" aria-pressed="false">Medium</button>
    <button type="button" data-level="hard" aria-pressed="false">Hard</button>
  </div>

  <div id="board" role="grid" aria-label="Sudoku board"></div>
  <div id="pad" role="group" aria-label="Numbers"></div>
  <div id="tools">
    <button type="button" id="notes" aria-pressed="false">Notes</button>
    <button type="button" id="erase">Erase</button>
    <button type="button" id="new">New</button>
  </div>
  <p id="status" role="status">Fill every row, column and box with 1–9.</p>
</main>

<script>
/* ── puzzle generation ────────────────────────────────────────────────────── */
/* A full grid is filled by randomised backtracking, then cells are taken out
   one at a time for as long as the puzzle still has exactly one solution. The
   clue target only sets how far the carving aims, so a hard board that runs out
   of removable cells simply keeps the extra ones. */

const LEVELS = { easy: 42, medium: 32, hard: 26 };

function hash(text) {
  let h = 2166136261;
  for (let i = 0; i < text.length; i++) {
    h ^= text.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

function rngFrom(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function shuffled(list, rand) {
  const out = list.slice();
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    const swap = out[i]; out[i] = out[j]; out[j] = swap;
  }
  return out;
}

function bitCount(mask) {
  let n = 0;
  while (mask) { n += mask & 1; mask >>= 1; }
  return n;
}

/* Counts solutions, giving up once `limit` have been found. Picking the cell
   with the fewest candidates keeps this quick even on a nearly empty grid. */
function countSolutions(grid, limit) {
  const work = Int8Array.from(grid);
  const rows = new Int16Array(9), cols = new Int16Array(9), boxes = new Int16Array(9);
  for (let i = 0; i < 81; i++) {
    const v = work[i];
    if (!v) continue;
    const bit = 1 << (v - 1), r = (i / 9) | 0, c = i % 9;
    rows[r] |= bit; cols[c] |= bit;
    boxes[(((r / 3) | 0) * 3) + ((c / 3) | 0)] |= bit;
  }
  let found = 0, stop = false;
  const search = () => {
    if (stop) return;
    let best = -1, bestMask = 0, bestCount = 10;
    for (let i = 0; i < 81; i++) {
      if (work[i]) continue;
      const r = (i / 9) | 0, c = i % 9, b = (((r / 3) | 0) * 3) + ((c / 3) | 0);
      const mask = ~(rows[r] | cols[c] | boxes[b]) & 511;
      if (!mask) return;
      const n = bitCount(mask);
      if (n < bestCount) {
        bestCount = n; best = i; bestMask = mask;
        if (n === 1) break;
      }
    }
    if (best < 0) {
      if (++found >= limit) stop = true;
      return;
    }
    const r = (best / 9) | 0, c = best % 9, b = (((r / 3) | 0) * 3) + ((c / 3) | 0);
    for (let v = 1; v <= 9 && !stop; v++) {
      const bit = 1 << (v - 1);
      if (!(bestMask & bit)) continue;
      work[best] = v; rows[r] |= bit; cols[c] |= bit; boxes[b] |= bit;
      search();
      work[best] = 0; rows[r] ^= bit; cols[c] ^= bit; boxes[b] ^= bit;
    }
  };
  search();
  return found;
}

function carve(target, rand) {
  const solution = new Int8Array(81);
  const rows = new Int16Array(9), cols = new Int16Array(9), boxes = new Int16Array(9);
  (function fill(i) {
    if (i === 81) return true;
    const r = (i / 9) | 0, c = i % 9, b = (((r / 3) | 0) * 3) + ((c / 3) | 0);
    for (const v of shuffled([1, 2, 3, 4, 5, 6, 7, 8, 9], rand)) {
      const bit = 1 << (v - 1);
      if ((rows[r] | cols[c] | boxes[b]) & bit) continue;
      rows[r] |= bit; cols[c] |= bit; boxes[b] |= bit; solution[i] = v;
      if (fill(i + 1)) return true;
      rows[r] ^= bit; cols[c] ^= bit; boxes[b] ^= bit; solution[i] = 0;
    }
    return false;
  })(0);

  const puzzle = Int8Array.from(solution);
  let clues = 81;
  for (const i of shuffled([...Array(81).keys()], rand)) {
    if (clues <= target) break;
    const kept = puzzle[i];
    puzzle[i] = 0;
    if (countSolutions(puzzle, 2) === 1) clues--;
    else puzzle[i] = kept;
  }
  return { solution, puzzle, clues };
}

/* Carving is greedy, so every so often a hard grid runs out of removable cells
   two clues early. Deal a fresh one rather than pass off a softer board. */
function generate(level, rand) {
  const target = LEVELS[level] || 32;
  let board = carve(target, rand);
  for (let attempt = 0; attempt < 3 && board.clues > target; attempt++) {
    board = carve(target, rand);
  }
  return board;
}
/* ── end puzzle generation ────────────────────────────────────────────────── */

const boardEl = document.getElementById('board');
const padEl = document.getElementById('pad');
const clockEl = document.getElementById('clock');
const levelEl = document.getElementById('level');
const statusEl = document.getElementById('status');
const notesButton = document.getElementById('notes');
const levelButtons = [...document.querySelectorAll('#levels button')];
const SEED_KEY = 'bored.sudoku.daily';

let solution = new Int8Array(81);
let puzzle = new Int8Array(81);
let values = new Int8Array(81);
let notes = [];
let level = 'easy';
let givens = 0;
let selected = 40;
let notesMode = false;
let won = false;
let startedAt = 0;
let elapsed = 0;
let dailyDeal = false;

const cells = [];
for (let i = 0; i < 81; i++) {
  const r = (i / 9) | 0, c = i % 9;
  const cell = document.createElement('button');
  cell.type = 'button';
  cell.className = 'cell';
  cell.setAttribute('role', 'gridcell');
  if (c === 2 || c === 5) cell.classList.add('edge-right');
  if (r === 2 || r === 5) cell.classList.add('edge-bottom');
  if (c === 8) cell.classList.add('last-col');
  if (r === 8) cell.classList.add('last-row');
  const val = document.createElement('span');
  val.className = 'val';
  const marks = document.createElement('span');
  marks.className = 'marks';
  for (let n = 0; n < 9; n++) marks.appendChild(document.createElement('i'));
  cell.append(val, marks);
  cell.addEventListener('click', () => { select(i); });
  boardEl.appendChild(cell);
  cells.push({ cell, val, marks });
}

for (let n = 1; n <= 9; n++) {
  const button = document.createElement('button');
  button.type = 'button';
  button.textContent = String(n);
  button.setAttribute('aria-label', 'Place ' + n);
  button.addEventListener('click', () => place(n));
  padEl.appendChild(button);
}

function clockText(seconds) {
  const total = Math.max(0, Math.round(seconds));
  return Math.floor(total / 60) + ':' + String(total % 60).padStart(2, '0');
}

function secondsNow() {
  if (won) return elapsed;
  return startedAt ? Math.floor((Date.now() - startedAt) / 1000) : 0;
}

/* The first board of the day uses the hub's shared seed, so everybody opening
   Sudoku that morning gets the same grid; later boards are random. */
function takeDailySeed(which) {
  const seed = window.__boredSeed;
  if (!seed || !seed.date) return null;
  let seen = '';
  try { seen = localStorage.getItem(SEED_KEY) || ''; } catch (e) {}
  if (seen === seed.date) return null;
  dailyDeal = true;
  try { localStorage.setItem(SEED_KEY, seed.date); } catch (e) {}
  return seed.date + ':' + seed.seed + ':' + which;
}

function conflicts() {
  const bad = new Set();
  const groups = [];
  for (let i = 0; i < 9; i++) {
    const row = [], col = [], box = [];
    const r0 = ((i / 3) | 0) * 3, c0 = (i % 3) * 3;
    for (let k = 0; k < 9; k++) {
      row.push(i * 9 + k);
      col.push(k * 9 + i);
      box.push((r0 + ((k / 3) | 0)) * 9 + c0 + (k % 3));
    }
    groups.push(row, col, box);
  }
  for (const group of groups) {
    const seen = new Map();
    for (const index of group) {
      const value = values[index];
      if (!value) continue;
      if (seen.has(value)) { bad.add(index); bad.add(seen.get(value)); }
      else seen.set(value, index);
    }
  }
  return bad;
}

function render() {
  const bad = conflicts();
  const selRow = (selected / 9) | 0, selCol = selected % 9;
  const selBox = (((selRow / 3) | 0) * 3) + ((selCol / 3) | 0);
  const selValue = values[selected];
  for (let i = 0; i < 81; i++) {
    const { cell, val, marks } = cells[i];
    const r = (i / 9) | 0, c = i % 9;
    const box = (((r / 3) | 0) * 3) + ((c / 3) | 0);
    const value = values[i];
    cell.classList.toggle('given', puzzle[i] !== 0);
    cell.classList.toggle('peer', i !== selected && (r === selRow || c === selCol || box === selBox));
    cell.classList.toggle('sel', i === selected);
    cell.classList.toggle('same', i !== selected && value !== 0 && value === selValue);
    cell.classList.toggle('clash', bad.has(i));
    const label = 'Row ' + (r + 1) + ' column ' + (c + 1) + (value ? ', ' + value : ', empty');
    if (cell.getAttribute('aria-label') !== label) cell.setAttribute('aria-label', label);
    val.textContent = value ? String(value) : '';
    for (let n = 1; n <= 9; n++) marks.children[n - 1].textContent = notes[i].has(n) ? String(n) : '';
    marks.hidden = value !== 0 || notes[i].size === 0;
  }
  clockEl.textContent = clockText(secondsNow());
  levelEl.textContent = level;
  notesButton.setAttribute('aria-pressed', String(notesMode));
}

function select(index) {
  selected = index;
  render();
}

function clearPeerNotes(index, value) {
  const r = (index / 9) | 0, c = index % 9;
  const r0 = ((r / 3) | 0) * 3, c0 = ((c / 3) | 0) * 3;
  for (let k = 0; k < 9; k++) {
    notes[r * 9 + k].delete(value);
    notes[k * 9 + c].delete(value);
    notes[(r0 + ((k / 3) | 0)) * 9 + c0 + (k % 3)].delete(value);
  }
}

function solved() {
  for (let i = 0; i < 81; i++) if (values[i] !== solution[i]) return false;
  return true;
}

function finish() {
  const seconds = secondsNow();
  won = true;
  elapsed = seconds;
  statusEl.textContent = 'Solved in ' + clockText(seconds) + ' on ' + level + '.';
  statusEl.classList.add('done');
}

function place(value) {
  if (won || puzzle[selected]) return;
  if (!startedAt) startedAt = Date.now();
  if (notesMode) {
    if (values[selected]) return;
    if (notes[selected].has(value)) notes[selected].delete(value);
    else notes[selected].add(value);
  } else {
    if (values[selected] === value) {
      values[selected] = 0;
    } else {
      values[selected] = value;
      notes[selected].clear();
      clearPeerNotes(selected, value);
      if (solved()) finish();
    }
  }
  render();
}

function erase() {
  if (won || puzzle[selected]) return;
  values[selected] = 0;
  notes[selected].clear();
  render();
}

function deal(nextLevel) {
  level = nextLevel;
  dailyDeal = false;
  for (const button of levelButtons) {
    button.setAttribute('aria-pressed', String(button.dataset.level === level));
  }
  const seed = takeDailySeed(level);
  const rand = rngFrom(seed ? hash(seed) : (Math.random() * 4294967296) >>> 0);
  const board = generate(level, rand);
  solution = board.solution;
  puzzle = board.puzzle;
  givens = board.clues;
  values = Int8Array.from(puzzle);
  notes = Array.from({ length: 81 }, () => new Set());
  selected = 40;
  for (let i = 0; i < 81; i++) if (!puzzle[i]) { selected = i; break; }
  won = false;
  startedAt = 0;
  elapsed = 0;
  notesMode = false;
  statusEl.classList.remove('done');
  statusEl.textContent = level[0].toUpperCase() + level.slice(1) + ' puzzle, ' + givens + ' givens.';
  render();
}

levelButtons.forEach(button => {
  button.addEventListener('click', () => deal(button.dataset.level));
});

notesButton.addEventListener('click', () => {
  notesMode = !notesMode;
  render();
});
document.getElementById('erase').addEventListener('click', erase);
document.getElementById('new').addEventListener('click', () => deal(level));

document.addEventListener('keydown', event => {
  const key = event.key;
  if (/^[1-9]$/.test(key)) { place(Number(key)); event.preventDefault(); return; }
  if (key === 'Backspace' || key === 'Delete' || key === '0') { erase(); event.preventDefault(); return; }
  if (key === 'n' || key === 'N') { notesMode = !notesMode; render(); event.preventDefault(); return; }
  const moves = { ArrowUp: -9, ArrowDown: 9, ArrowLeft: -1, ArrowRight: 1 };
  if (!(key in moves)) return;
  event.preventDefault();
  const row = (selected / 9) | 0, col = selected % 9;
  if (key === 'ArrowLeft' && col === 0) return;
  if (key === 'ArrowRight' && col === 8) return;
  if (key === 'ArrowUp' && row === 0) return;
  if (key === 'ArrowDown' && row === 8) return;
  select(selected + moves[key]);
});

setInterval(() => {
  if (!won) clockEl.textContent = clockText(secondsNow());
}, 250);

/* The hub reads this: the current board, never null, integers only. */
window.__boredSnapshot = () => {
  let filled = 0;
  for (let i = 0; i < 81; i++) if (values[i]) filled++;
  return {
    slug: 'sudoku',
    difficulty: level,
    seconds: secondsNow(),
    givens,
    filled,
    daily: dailyDeal,
    won,
    finished: won
  };
};

deal('easy');
</script>
</body>
</html>
