  cartography: 'map', navigation: 'star', shieldwall: 'warden', citadel: 'tower',
  longbow: 'bow', banking: 'stack', ascendancy: 'crown'
};

function markBody(name) {
  const solid = SOLID[name] ? '<path class="f" d="' + SOLID[name] + '"/>' : '';
  return solid + (MARK[name] || '').split('|').filter(Boolean)
    .map(d => '<path d="' + d + '"/>').join('');
}

// Inline SVG for the chrome, drawn in whatever colour the surrounding text uses.
function icon(name, size) {
  const box = size || 14;
  return '<svg class="ico" viewBox="-10 -10 20 20" width="' + box + '" height="' + box +
    '" aria-hidden="true">' + markBody(name) + '</svg>';
}

// The same mark drawn onto the map, in the map's own ink.
function markOnMap(name, cx, cy, scale, ink, width) {
  const strokes = (MARK[name] || '').split('|').filter(Boolean)
    .map(d => '<path d="' + d + '"/>').join('');
  const solid = SOLID[name]
    ? '<path d="' + SOLID[name] + '" fill="' + ink + '" stroke="none"/>' : '';
  return '<g transform="translate(' + cx.toFixed(1) + ' ' + cy.toFixed(1) + ') scale(' + scale +
    ')" fill="none" stroke="' + ink + '" stroke-width="' + width +
    '" stroke-linecap="round" stroke-linejoin="round">' + solid + strokes + '</g>';
}

// A shield carrying the banner's own device, for the start screen.
function emblem(factionId, size) {
  const mark = FACTION_EMBLEM[factionId] || 'star';
  const box = size || 26;
  return '<span class="emblem"><svg viewBox="-11 -11 22 22" width="' + box + '" height="' + box +
    '" aria-hidden="true"><path d="M0 -10 L8 -7 V0 C8 5 5 9 0 11 C-5 9 -8 5 -8 0 V-7 Z"/>' +
    '<g class="dev" transform="scale(.82)">' + markBody(mark) + '</g></svg></span>';
}

// What a price looks like: the resource's own drawing beside the amount.
function costMarkup(cost) {
  return Object.keys(cost || {}).map(k =>
    '<span class="chip" title="' + RES_LABEL[k] + '">' + icon(k, 11) + cost[k] + '</span>').join('');
}

/* ── ground, drawn per tile ────────────────────────────────────────────────── */

// A flat fill never said "wood" at a glance, so each kind of ground now carries a
// few drawn elements of its own: pines, ridge lines, reeds, dunes, cracks, waves.
// Offsets wobble by tile hash so a field of one ground never looks stamped.
function tileScenery(tile, x, y, cx, cy) {
  const wobble = hash2(x, y, G.seed + 17);
  const j = n => (wobble - 0.5) * n;
  const out = [];
  const put = (d, dx, dy, scale, cls) => {
    const body = d.split('|').map(part =>
      '<path class="' + (cls || 'sc') + '" d="' + part + '"/>').join('');
    out.push('<g transform="translate(' + (cx + dx + j(3)).toFixed(1) + ' ' + (cy + dy + j(3)).toFixed(1) +
      ') scale(' + scale + ')">' + body + '</g>');
  };

  switch (tile.t) {
    case 'forest':
      put('M0 -7 L5 0 H-5 Z|M0 0 V4', -7, 2, 1, 'scf');
      put('M0 -7 L5 0 H-5 Z|M0 0 V4', 5, -3, 1.15, 'scf');
      put('M0 -7 L5 0 H-5 Z|M0 0 V4', 1, 6, 0.85, 'scf');
      break;
    case 'hill':
      put('M-9 4 Q-4 -6 1 4|M-1 4 Q4 -1 9 4', 0, 0, 1);
      put('M-4 1 h3 M1 2 h2', 0, 0, 1, 'sc-soft');
      break;
    case 'mount':
      put('M0 -9 L8 6 H-8 Z', 0, 0, 1, 'scf');
      put('M-3 -2 L0 -7 L3 -2', 0, 0, 1);
      break;
    case 'meadow':
      put('M-3 4 V-3 M0 4 V-5 M3 4 V-2', -5, 0, 1);
      put('M-3 4 V-3 M0 4 V-5 M3 4 V-2', 4, 5, 0.9);
      break;
    case 'plain':
      put('M-9 1 H9 M-9 5 H3', 0, 0, 1, 'sc-soft');
      put('M-3 3 V-3 M0 3 V-4 M3 3 V-3', 1, 4, 0.8);
      break;
    case 'desert':
      put('M-9 3 Q-4 -4 0 3 Q4 9 9 3', 0, 0, 1);
      put('M-5 7 h2 M3 7 h2', 0, 0, 1, 'sc-soft');
      break;
    case 'tundra':
      put('M-7 -1 h2 M-1 3 h2 M5 -3 h2 M1 -5 h2', 0, 0, 1);
      break;
    case 'ash':
      put('M-6 -5 L-2 0 L-5 5|M4 -6 L2 0 L6 4', 0, 0, 1);
      put('M-1 3 L0 1 L1 3 L0 5 Z', 2, 2, 0.7, 'scf');
      break;
    case 'marsh':
      put('M-5 6 V-4 M-1 6 V-6 M3 6 V-3', 0, 0, 1);
      put('M-8 7 q4 -3 8 0 t8 0', 0, 0, 1, 'sc-soft');
      break;
    case 'shoal':
      put('M-8 -2 q4 -4 8 0 t8 0', 0, 0, 1);
      put('M-8 3 q4 -4 8 0 t8 0', 0, 1, 0.9, 'sc-soft');
      break;
    case 'ocean':
      put('M-8 -1 q4 -4 8 0 t8 0', 0, 0, 1);
      put('M-8 5 q4 -4 8 0 t8 0', 0, 1, 1, 'sc-soft');
      break;
    default:
      break;
  }
  return out.join('');
}


function renderBoard() {
  if (!UI || !G) return;
  const terrain = [], owner = [], coast = [], marks = [], sites = [], unitsOut = [];
  const overlay = [], fog = [], labels = [];
  const highlight = reachable || new Map();
  const selectedUnit = selection && selection.kind === 'unit' ? unitById(selection.id) : null;
  const workedCity = selection && selection.kind === 'city' ? selection.id : null;

  for (let y = 0; y < G.rows; y++) {
    for (let x = 0; x < G.cols; x++) {
      const tile = G.tiles[y * G.cols + x];
      const [cx, cy] = hexCenter(x, y);
      const d = polyPath(hexCorners(cx, cy, HEX_R - 1.6));
      const key = keyOf(x, y);
      const known = tile.seen || tile.vis;

      if (!known) {
        fog.push('<path class="fog unk" d="' + d + '" stroke="rgba(36,28,18,.14)" stroke-width=".7"/>');
        continue;
      }

      terrain.push('<g class="hex" data-tile="' + key + '"><path class="fill" d="' + d +
        '" fill="' + TERRAIN[tile.t].fill + '"/></g>');

      if (tile.owner !== null) {
        const f = faction(tile.owner);
        owner.push('<path class="owner-tint" d="' + d + '" fill="' + f.light + '" opacity=".26"/>');
      }

      // Coastline: an ink edge wherever the land meets water, drawn once per
      // land hex so the vale reads like a drawn map rather than a colour grid.
      if (!TERRAIN[tile.t].water) {
        for (const [nx, ny] of neighbourList(x, y)) {
          const n = tileAt(nx, ny);
          if (n && !TERRAIN[n.t].water) continue;
          // Edge between this hex and its neighbour: find the shared corners.
          const [ncx, ncy] = n ? hexCenter(nx, ny) : [cx + (nx - x) * HEX_W, cy + (ny - y) * HEX_V];
          const corners = hexCorners(cx, cy, HEX_R - 1.6);
          let first = null, second = null;
          for (let i = 0; i < 6; i++) {
            const a = corners[i], b = corners[(i + 1) % 6];
            const mid = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
            const toNeighbour = Math.hypot(mid[0] - ncx, mid[1] - ncy);
            const toSelf = Math.hypot(mid[0] - cx, mid[1] - cy);
            if (toNeighbour < toSelf) { first = a; second = b; break; }
          }
          if (first && second) {
            coast.push('<path class="coast" d="M' + first[0].toFixed(1) + ' ' + first[1].toFixed(1) +
              'L' + second[0].toFixed(1) + ' ' + second[1].toFixed(1) + '"/>');
          }
        }
      } else {
        coast.push('<path class="coast" d="' + d + '" stroke="rgba(36,28,18,.09)" stroke-width=".8"/>');
      }

      marks.push(tileScenery(tile, x, y, cx, cy));
      // A resource sits on a small paper disc carrying its own drawing, so a
      // wheat field and a gold seam are told apart without a letter or a legend.
      if (tile.f && MARK[tile.f]) {
        marks.push('<circle cx="' + (cx + 12).toFixed(1) + '" cy="' + (cy - 11).toFixed(1) +
          '" r="7.4" fill="#f7f0df" stroke="rgba(36,28,18,.42)" stroke-width=".8"/>' +
          markOnMap(tile.f, cx + 12, cy - 11, 0.62, 'rgba(36,28,18,.8)', 2.2));
      }

      if (highlight.has(key)) {
        overlay.push('<path class="reach" d="' + d + '"/>');
      }
      if (selectedUnit && canAttackTarget(selectedUnit, x, y)) {
        overlay.push('<path class="threat" d="' + d + '"/>');
      }
      if (workedCity !== null && tile.city === workedCity) {
        overlay.push('<path class="worked" d="' + d + '"/>');
      }
      if (!tile.vis) fog.push('<path class="fog dim" d="' + d + '"/>');
    }
  }

  // Keeps.
  for (const city of G.cities) {
    const tile = tileAt(city.x, city.y);
    if (!tile || !tile.seen) continue;
    const [cx, cy] = hexCenter(city.x, city.y);
    const known = faction(city.owner);
    const ink = known ? known.ink : '#5e5443';
    const light = known ? known.light : '#d8ccb0';
    const portion = clamp(city.hp / Math.max(1, city.owner === null ? 18 : cityMaxHp(known, city)), 0, 1);
    const isSel = selection && selection.kind === 'city' && selection.id === city.id;
    sites.push(
      '<g class="site">' +
      '<path d="M' + (cx - 11) + ' ' + (cy + 2) + ' H' + (cx + 11) + ' V' + (cy + 9) + ' H' + (cx - 11) + ' Z" fill="' + light + '" stroke="' + ink + '" stroke-width="1.2"/>' +
      '<path d="M' + (cx - 11) + ' ' + (cy + 2) + ' V' + (cy - 3) + ' H' + (cx - 7) + ' V' + (cy + 2) + ' M' + (cx - 4) + ' ' + (cy + 2) + ' V' + (cy - 4) + ' H' + (cx + 1) + ' V' + (cy + 2) +
      ' M' + (cx + 4) + ' ' + (cy + 2) + ' V' + (cy - 3) + ' H' + (cx + 8) + ' V' + (cy + 2) + '" fill="' + light + '" stroke="' + ink + '" stroke-width="1.2"/>' +
      '<path d="M' + cx + ' ' + (cy - 4) + ' V' + (cy - 15) + ' M' + cx + ' ' + (cy - 15) + ' h9 l-2.5 3 2.5 3 h-9" fill="' + ink + '" stroke="' + ink + '" stroke-width="1"/>' +
      (city.capital ? '<path d="M' + (cx - 6) + ' ' + (cy - 18) + ' l2 -3 2 3 2 -3 2 3 z" fill="' + ink + '"/>' : '') +
      '<rect x="' + (cx - 11) + '" y="' + (cy + 11) + '" width="22" height="2.6" fill="rgba(36,28,18,.18)"/>' +
      '<rect x="' + (cx - 11) + '" y="' + (cy + 11) + '" width="' + (22 * portion).toFixed(1) + '" height="2.6" fill="' + ink + '"/>' +
      (isSel ? '<circle cx="' + cx + '" cy="' + (cy - 2) + '" r="17" fill="none" stroke="#241c12" stroke-width="1.8" stroke-dasharray="4 3"/>' : '') +
      '</g>'
    );
    labels.push('<text class="label" x="' + cx.toFixed(1) + '" y="' + (cy + 24).toFixed(1) +
      '" text-anchor="middle" fill="' + (known ? ink : '#5e5443') + '" opacity=".9">' +
      esc(city.name) + (known ? '' : ' ·') + '</text>');
  }

  // Banners on the map.
  for (const unit of G.units) {
    const tile = tileAt(unit.x, unit.y);
    if (!tile || !tile.vis) continue;
    const f = faction(unit.owner);
    const [cx, cy] = hexCenter(unit.x, unit.y);
    const def = UNITS[unit.type];
    const exhausted = unit.mp <= 0 && unit.acted;
    const portion = clamp(unit.hp / def.hp, 0, 1);
    unitsOut.push(
      '<g class="unit' + (exhausted ? ' exhausted' : '') + '">' +
      '<path class="body" d="M' + (cx - 10) + ' ' + (cy - 12) + ' h20 v20 h-20 z" fill="' + f.light +
        '" style="stroke:' + f.ink + ';stroke-width:2"/>' +
      markOnMap(unit.type, cx, cy - 2, 0.92, '#241c12', 2.1) +
      '<line class="hp" x1="' + (cx - 9) + '" y1="' + (cy + 10) + '" x2="' + (cx + 9) + '" y2="' + (cy + 10) + '"/>' +
      '<line class="hpv" x1="' + (cx - 9) + '" y1="' + (cy + 10) + '" x2="' + (cx - 9 + 18 * portion).toFixed(1) + '" y2="' + (cy + 10) + '"/>' +
      (unit.fortified ? '<path d="M' + (cx - 4) + ' ' + (cy + 14) + ' l8 0 l-4 4 z" fill="#241c12"/>' : '') +
      ((!unit.acted && !unit.fortified && unit.owner === G.player && (unit.mp > 0 || unitCanHit(unit)))
        ? '<path class="idle-tick" d="M' + cx + ' ' + (cy - 19) + ' l3.2 3.2 -3.2 3.2 -3.2 -3.2 z"/>' : '') +
      '</g>'
    );
  }

  const coachHex = coachAt();
  if (coachHex) {
    const [kx, ky] = hexCenter(coachHex[0], coachHex[1]);
    labels.push('<circle class="coach-ring" cx="' + kx.toFixed(1) + '" cy="' + ky.toFixed(1) +
      '" r="' + (HEX_R - 2) + '"/>');
  }

  if (selection && selection.kind === 'unit') {
    const unit = unitById(selection.id);
    if (unit) {
      const [cx, cy] = hexCenter(unit.x, unit.y);
      overlay.push('<circle class="sel-ring" cx="' + cx + '" cy="' + cy + '" r="' + (HEX_R - 3) + '"/>');
    }
  }

  UI.layerOwner.innerHTML = owner.join('');
  UI.layerTerrain.innerHTML = terrain.join('');
  UI.layerCoast.innerHTML = coast.join('');
  UI.layerMarks.innerHTML = marks.join('');
  UI.layerSites.innerHTML = sites.join('');
  UI.layerUnits.innerHTML = unitsOut.join('');
  UI.layerOverlay.innerHTML = overlay.join('');
  UI.layerFog.innerHTML = fog.join('');
  UI.layerLabels.innerHTML = labels.join('');
}

/* ── interface: shared pieces ──────────────────────────────────────────────── */

const RES_SHORT = { timber: 't', ore: 'o', coin: 'c', insight: 'i' };

function costText(cost) {
  return Object.keys(cost).map(k => cost[k] + RES_SHORT[k]).join(' ');
}
function log(text, colour) {
  if (!G) return;
  G.log.push({ turn: G.turn, text, colour: colour || null });
  if (G.log.length > 250) G.log.shift();
  if (UI) renderLog();
}
let toastTimer = 0;
function toast(message) {
  if (!UI) return;
  UI.toast.textContent = message;
  UI.toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => UI.toast.classList.remove('show'), 2100);
}

function render() {
  if (!UI || !G) return;
  tutorialTick();
  renderBar();
  renderBoard();
  renderSide();
  renderLog();
  renderCoach();
  if (UI.btnEnd) UI.btnEnd.disabled = !!G.over;
  if (G.over && !UI.endShown) showEndModal();
}

function renderBar() {
  const f = player();
  const { income } = factionIncome(f);
  UI.bannerDot.style.background = f.ink;
  UI.bannerName.textContent = f.name;
  UI.bannerEpi.textContent = f.epithet;
  const items = ['renown'].concat(RES_KEYS);
  // Drawn, not spelled: each resource is its own mark, its stock, its income.
  UI.resRow.innerHTML = items.map(key => {
    if (key === 'renown') {
      return '<span class="res-item" title="Renown: cities, growth, lore, works">' + icon('renown', 15) +
        '<span class="res-val">' + renownOf(f) + '</span></span>';
    }
    const inc = income[key] || 0;
    const cls = inc > 0 ? 'up' : inc < 0 ? 'down' : '';
    return '<span class="res-item" title="' + RES_LABEL[key] + ' · ' + (inc > 0 ? '+' : '') + inc + ' a turn">' +
      icon(key, 15) + '<span class="res-val">' + (f.res[key] || 0) + '</span>' +
      '<span class="res-inc ' + cls + '">' + (inc > 0 ? '+' : '') + inc + '</span></span>';
  }).join('');
  UI.turnReadout.textContent = G.turn + '/' + G.maxTurns;
}

function renderLog() {
  if (!UI || !G) return;
  const rows = G.log.slice(-40).map(entry =>
    '<div' + (entry.colour ? ' style="color:' + entry.colour + '"' : '') + '>' +
    '<span class="turn-mark">' + String(entry.turn).padStart(2, '0') + '</span> ' + esc(entry.text) + '</div>'
  );
  UI.log.innerHTML = rows.join('') || '<div class="faint">The vale is quiet.</div>';
  UI.log.scrollTop = UI.log.scrollHeight;
}

/* ── interface: the side panel ─────────────────────────────────────────────── */

function renderSide() {
  if (!UI || !G) return;
  if (selection && selection.kind === 'unit') {
    const unit = unitById(selection.id);
    if (unit) { UI.sideScroll.innerHTML = unitPanel(unit); return; }
    selection = null;
  }
  if (selection && selection.kind === 'city') {
    const city = cityById(selection.id);
    if (city) { UI.sideScroll.innerHTML = cityPanel(city); return; }
    selection = null;
  }
  UI.sideScroll.innerHTML = realmPanel();
}

function realmPanel() {
  const f = player();
  const { income, upkeep } = factionIncome(f);
  const cities = ownCities(f);
  const units = ownUnits(f);
  const mods = techMods(f);
  const rivals = G.factions.filter(o => o.i !== f.i && o.alive);

  let html = '<div class="side-head">' + emblem(f.id, 24) + '<h2>' + esc(f.name) + '</h2></div>' +
    '<div class="side-sub">' + esc(f.epithet) + '</div>' +
    '<div class="kv"><span>' + icon('renown', 13) + ' renown</span><span>' + renownOf(f) + '</span></div>' +
    '<div class="kv"><span>' + icon('tower', 13) + ' keeps</span><span>' + cities.length + '</span></div>' +
    '<div class="kv"><span>' + icon('spear', 13) + ' banners</span><span>' + units.length + '</span></div>' +
    '<div class="kv"><span>' + icon('scroll', 13) + ' lore</span><span>' + f.techs.length + ' / ' + TECHS.length + '</span></div>' +
    '<div class="kv"><span>' + icon('coin', 13) + ' upkeep</span><span>' + upkeep + '</span></div>';

  html += '<p class="sec">Each turn</p>';
  for (const key of ['food'].concat(RES_KEYS)) {
    const value = income[key] || 0;
    html += '<div class="kv"><span>' + icon(key === 'food' ? 'stores' : key, 13) + ' ' +
      RES_LABEL[key].toLowerCase() + '</span><span style="color:' +
      (value < 0 ? '#8f3c1a' : value > 0 ? '#3f5c2d' : '#8a7d66') + '">' + (value > 0 ? '+' : '') + value + '</span></div>';
  }

  html += '<p class="sec">Banner</p><div class="hint" style="margin-top:0">' + esc(f.bonus) + '</div>';
  if (mods.meleeAtk || mods.rangedAtk || mods.defence) {
    html += '<div class="hint">' + [mods.meleeAtk ? '+' + mods.meleeAtk + ' melee' : '',
      mods.rangedAtk ? '+' + mods.rangedAtk + ' ranged' : '',
      mods.defence ? '+' + mods.defence + ' defence' : ''].filter(Boolean).join(' · ') + '</div>';
  }

  html += '<p class="sec">The vale</p>';
  if (!rivals.length) html += '<div class="hint">No rival banners remain.</div>';
  for (const other of rivals) {
    const war = atWar(f.i, other.i);
    html += '<div class="kv"><span>' + esc(other.name) +
      ' <span class="tag ' + (war ? 'war' : 'peace') + '">' + (war ? 'war' : 'peace') + '</span></span>' +
      '<span>' + ownCities(other).length + ' cities</span></div>';
  }
  html += '<div class="actions"><button class="act" data-act="council">Open council</button>' +
    '<button class="act" data-act="tech">Technologies</button></div>';

  html += '<p class="sec">Banners afield</p>';
  if (idleUnits().length) {
    html += '<div class="actions"><button class="act" data-act="next-unit">Next banner<kbd>N</kbd></button></div>';
  }
  if (!units.length) html += '<div class="hint">Nothing stands for you in the field.</div>';
  else {
    html += '<div class="unit-list">';
    for (const unit of units) {
      html += '<button class="unit-row" data-act="select-unit:' + unit.id + '">' +
        icon(unit.type, 14) + '<span class="nm">' + UNITS[unit.type].name + '</span>' +
        '<span class="st">' + unit.hp + 'hp · ' + unit.mp + 'mp</span></button>';
    }
    html += '</div>';
  }

  html += '<p class="sec">Cities</p>';
  if (!cities.length) html += '<div class="hint">Found a city with a Pioneer.</div>';
  else {
    html += '<div class="unit-list">';
    for (const city of cities) {
      html += '<button class="unit-row" data-act="select-city:' + city.id + '">' +
        icon('tower', 14) + '<span class="nm">' + esc(city.name) + '</span>' +
        '<span class="st">lvl ' + city.level + '</span></button>';
    }
    html += '</div>';
  }
  html += '<p class="hint">Drag to look around, scroll to zoom. A keep trains and builds; a banner moves and ' +
    'strikes.</p>';
  return html;
}

function growthNeed(f, city) {
  const mods = techMods(f);
  return Math.max(4, 6 + 3 * city.level - mods.growth);
}

function cityPanel(city) {
  const f = player();
  const mine = city.owner === f.i;
  const holder = faction(city.owner);
  const [cx, cy] = [city.x, city.y];
  let html = '<div class="side-head"><h2>' + esc(city.name) + '</h2>' +
    (city.capital ? '<span class="tag">capital</span>' : '') + '</div>' +
    '<div class="side-sub">' + (holder ? esc(holder.name) : 'unclaimed keep') +
    ' · level ' + city.level + '</div>' +
    '<div class="kv"><span>Health</span><span>' + Math.max(0, Math.round(city.hp)) + ' / ' +
    (holder ? cityMaxHp(holder, city) : 18) + '</span></div>' +
    '<div class="bar hp"><i style="width:' +
    clamp(city.hp / Math.max(1, holder ? cityMaxHp(holder, city) : 18), 0, 1) * 100 + '%"></i></div>' +
    '<div class="kv"><span>Defence</span><span>' + (holder ? cityDefence(holder, city) : 4 + city.level * 2) + '</span></div>';

  if (mine) {
    const yields = cityYields(f, city);
    const need = growthNeed(f, city);
    html += '<p class="sec">Stores</p>' +
      '<div class="kv"><span>Growing</span><span>' + Math.round(city.food) + ' / ' + need + '</span></div>' +
      '<div class="bar"><i style="width:' + clamp(city.food / need, 0, 1) * 100 + '%"></i></div>' +
      '<p class="sec">Worked here</p>' +
      ['food'].concat(RES_KEYS).map(key =>
        '<div class="kv"><span>' + icon(key === 'food' ? 'stores' : key, 13) + ' ' + RES_LABEL[key].toLowerCase() +
        '</span><span>+' + (yields[key] || 0) + '</span></div>').join('');

    html += '<p class="sec">Train ' + (city.trained ? '<span class="tag">done</span>' : '') + '</p><div class="actions">';
    for (const type of Object.keys(UNITS)) {
      const def = UNITS[type];
      if (def.naval && !neighbourList(cx, cy).some(([x, y]) => {
        const t = tileAt(x, y); return t && TERRAIN[t.t].water;
      }) && !TERRAIN[tileAt(cx, cy).t].water) continue;
      const locked = !unlocked(f, 'unit', type);
      const cost = unitCost(f, type);
      const affordable = canPay(f, cost) && !city.trained && !locked;
      html += '<button class="act' + (affordable ? '' : ' locked') + '" data-act="train:' + city.id + ':' + type + '"' +
        (affordable ? '' : ' disabled') + ' title="' + esc(def.blurb) + '">' + icon(type, 15) + ' ' + def.name +
        (locked ? '<span class="chip">' + icon('scroll', 11) + esc(TECH_BY_ID[def.tech].name) + '</span>'
                : costMarkup(cost)) + '</button>';
    }
    html += '</div>';

    html += '<p class="sec">Raise ' + (city.built ? '<span class="tag">done</span>' : '') + '</p><div class="actions">';
    for (const id of Object.keys(BUILDINGS)) {
      const def = BUILDINGS[id];
      const has = city.buildings.includes(id);
      const locked = !unlocked(f, 'building', id);
      const affordable = canPay(f, def.cost) && !city.built && !has && !locked;
      html += '<button class="act' + (affordable ? '' : ' locked') + '" data-act="build:' + city.id + ':' + id + '"' +
        (affordable ? '' : ' disabled') + ' title="' + esc(def.blurb) + '">' + icon(id, 15) + ' ' + def.name +
        (has ? '<span class="chip">built</span>'
             : locked ? '<span class="chip">' + icon('scroll', 11) + esc(TECH_BY_ID[def.tech].name) + '</span>'
                      : costMarkup(def.cost)) + '</button>';
    }
    html += '</div>';

    if (city.buildings.length) {
      html += '<p class="sec">Works</p><div class="hint" style="margin-top:0">' +
        city.buildings.map(b => icon(b, 13) + ' ' + BUILDINGS[b].name).join(' ') + '</div>';
    }
    html += '<div class="actions"><button class="act" data-act="centre:' + cx + ':' + cy + '">Find on map</button></div>';
  } else {
    html += '<p class="sec">Held by</p><div class="hint" style="margin-top:0">' +
      (holder ? esc(holder.name) + ' · ' + esc(holder.epithet) : 'Nobody. A neutral keep, and fair game for any banner.') +
      '</div>';
    html += '<p class="sec">To take it</p><div class="hint" style="margin-top:0">' +
      'Break its health with a land unit, then step in. Hulls can bombard but cannot hold a keep.' +
      '</div>';
    if (holder && holder.i !== f.i) {
      const war = atWar(f.i, holder.i);
      html += '<div class="actions">' + (war
        ? '<button class="act" data-act="peace:' + holder.i + '">Offer peace</button>'
        : '<button class="act" data-act="war:' + holder.i + '">Declare war</button>') + '</div>';
    }
    html += '<div class="actions"><button class="act" data-act="centre:' + cx + ':' + cy + '">Find on map</button></div>';
  }
  return html;
}

function unitPanel(unit) {
  const f = player();
  const def = UNITS[unit.type];
  const mine = unit.owner === f.i;
  const holder = faction(unit.owner);
  const tile = tileAt(unit.x, unit.y);
  const city = cityAt(unit.x, unit.y);
  const terrain = tile ? TERRAIN[tile.t] : null;
  let html = '<div class="side-head"><h2>' + def.name + '</h2>' +
    (unit.fortified ? '<span class="tag">holding</span>' : '') + '</div>' +
    '<div class="side-sub">' + esc(holder.name) + ' · ' + (terrain ? terrain.name : 'the field') +
    (city ? ' · ' + esc(city.name) : '') + '</div>' +
    '<div class="kv"><span>Health</span><span>' + Math.max(0, unit.hp) + ' / ' + def.hp + '</span></div>' +
    '<div class="bar hp"><i style="width:' + clamp(unit.hp / def.hp, 0, 1) * 100 + '%"></i></div>' +
    '<div class="kv"><span>Move left</span><span>' + unit.mp + ' / ' + moveOf(holder, unit) + '</span></div>' +
    '<div class="kv"><span>Attack</span><span>' + (def.atk ? attackValue(holder, unit) : '—') + '</span></div>' +
    '<div class="kv"><span>Defence</span><span>' + defenceValue(unit) + '</span></div>' +
    '<div class="kv"><span>Range</span><span>' + (def.atk ? rangeOf(holder, unit) : '—') + '</span></div>' +
    '<div class="kv"><span>Sight</span><span>' + sightOf(holder, unit) + '</span></div>' +
    '<div class="hint">' + esc(def.blurb) + '</div>';

  if (mine && def.atk && !unit.acted) {
    const targets = strikeTargets(unit);
    if (targets.length) {
      html += '<p class="sec">In reach</p><div class="unit-list">' + targets.map(t =>
        '<button class="unit-row" data-act="centre:' + t.x + ':' + t.y + '" title="Look">' +
        (t.kind === 'unit' ? icon(t.type, 14) : icon('tower', 14)) +
        '<span class="nm">' + esc(t.name) + ' · ' + t.hp + 'hp</span>' +
        '<span class="st">-' + t.dmg + (t.kills ? ' · breaks' : ' · leaves ' + Math.max(0, t.hp - t.dmg) + 'hp') +
        (t.back > 0 ? ' · answers ' + t.back + (t.back >= unit.hp ? ' · dies' : '') : '') + '</span></button>'
      ).join('') + '</div>';
    }
  }

  if (mine) {
    html += '<p class="sec">Orders</p><div class="actions">';
    if (def.founds) html += '<button class="act" data-act="found">Found city</button>';
    html += '<button class="act" data-act="fortify">Hold position</button>' +
      '<button class="act" data-act="disband">Disband</button>';
    if (city && city.owner === f.i) {
      html += '<button class="act" data-act="select-city:' + city.id + '">City of ' + esc(city.name) + '</button>';
    }
    html += '</div>';
    if (!unit.mp && !unit.acted) html += '<div class="hint">No movement left this turn.</div>';
    if (unit.acted) html += '<div class="hint">Has already struck this turn.</div>';
  } else {
    html += '<p class="sec">Foreign banner</p><div class="hint" style="margin-top:0">' +
      (atWar(f.i, unit.owner)
        ? 'You are at war with ' + esc(holder.name) + '. A unit in reach can strike it.'
        : 'You are at peace with ' + esc(holder.name) + '. Strike only after declaring war.') + '</div>';
    if (!atWar(f.i, unit.owner)) {
      html += '<div class="actions"><button class="act" data-act="war:' + unit.owner + '">Declare war</button></div>';
    }
  }
  return html;
}

/* ── interface: modals ─────────────────────────────────────────────────────── */

function openModal(html, narrow) {
  if (!UI) return;
  UI.modal.className = 'modal' + (narrow ? ' narrow' : '');
  UI.modal.innerHTML = html;
  UI.modalLayer.hidden = false;
}
function closeModal() {
  if (!UI) return;
  UI.modalLayer.hidden = true;
  UI.modal.innerHTML = '';
}

function showTechModal() {
  const f = player();
  const body = TECHS.reduce((html, tech, index) => {
    const owned = f.techs.includes(tech.id);
    const ready = tech.req.every(r => f.techs.includes(r));
    const affordable = ready && f.res.insight >= tech.cost;
    const cls = owned ? 'owned' : affordable ? 'ok' : 'locked';
    if (index === 0 || TECHS[index - 1].era !== tech.era) {
      if (index !== 0) html += '</div></div>';
      html += '<div class="tech-era"><h3>Era ' + tech.era + '</h3><div class="tech-grid">';
    }
    html += '<button class="tech-card ' + cls + '"' + (affordable ? ' data-act="research:' + tech.id + '"' : ' disabled') + '>' +
      '<span class="ti">' + icon(TECH_MARK[tech.id] || 'star', 22) + '</span><span>' +
      '<span class="tn"><span>' + tech.name + '</span><span class="tc">' + icon('insight', 11) + tech.cost + '</span></span>' +
      '<span class="te">' + tech.text + '</span>' +
      (!ready ? '<div class="tq">needs ' + tech.req.map(r => TECH_BY_ID[r].name).join(' + ') + '</div>' : '') +
      '</span></button>';
    return html;
  }, '');
  const closing = '</div></div>';
  openModal(
    '<div class="modal-head"><h2>Technologies</h2><span class="sub">' + f.res.insight +
    ' insight to spend · ' + f.techs.length + ' of ' + TECHS.length + ' learned</span>' +
    '<button class="x" data-act="close" aria-label="Close">&times;</button></div>' +
    '<div class="modal-body">' + body + closing + '</div>' +
    '<div class="modal-foot"><button class="btn" data-act="close">Close</button></div>'
  );
}

function attitudeMeter(value) {
  const pct = (clamp(value, -100, 100) + 100) / 2;
  return '<span class="meter"><i style="left:' + (pct > 50 ? 50 : pct) + '%;width:' +
    Math.abs(pct - 50) + '%;background:' + (value < 0 ? '#8f3c1a' : '#3f5c2d') + '"></i></span>';
}

function showCouncilModal() {
  const f = player();
  const rivals = G.factions.filter(o => o.i !== f.i);
  const pending = (G.demands || []).filter(d => d.to === f.i);
  const pendingHtml = pending.length ? '<p class="sec">Demands on you</p>' + pending.map(d => {
    const other = faction(d.from);
    if (!other || !other.alive) return '';
    const afford = (f.res[d.res] || 0) >= d.amount;
    return '<div class="council-row"><div><div class="cn">' + esc(other.name) +
      ' <span class="tag war">demands</span></div>' +
      '<div class="cd">' + d.amount + ' ' + RES_LABEL[d.res].toLowerCase() +
      ' · refusing the strong can mean war</div></div><div class="ca">' +
      '<button class="act" data-act="demand-accept:' + d.from + '"' + (afford ? '' : ' disabled') + '>Pay</button>' +
      '<button class="act" data-act="demand-refuse:' + d.from + '">Refuse</button>' +
      '</div></div>';
  }).join('') : '';
  const rows = rivals.map(other => {
    if (!other.alive) {

    }

    const attitude = G.attitude[f.i][other.i] || 0;
    const mine = militaryStrength(f), theirs = militaryStrength(other);
    const compare = theirs > mine * 1.2 ? 'stronger than you' : mine > theirs * 1.2 ? 'weaker than you' : 'a fair match';
    return '<div class="council-row"><div>' +
      '<div class="cn">' + esc(other.name) +
      ' <span class="tag ' + (war ? 'war' : 'peace') + '">' + (war ? 'at war' : 'at peace') + '</span></div>' +

      attitudeMeter(attitude) + '<span class="faint">' + (attitude > 20 ? 'friendly' : attitude < -20 ? 'hostile' : 'wary') +

/* ── interface: what a button does ─────────────────────────────────────────── */

function onAction(act) {
  if (!G) return;
  const [kind, a, b] = String(act).split(':');
  switch (kind) {
    case 'close': closeModal(); break;
    case 'tech': showTechModal(); break;
    case 'council': showCouncilModal(); break;
    case 'menu': showMenuModal(); break;
    case 'help': showHelpModal(); break;
    case 'tutorial': startTutorial(); break;
    case 'tut-skip':
      closeCoach();
      toast('Tutorial skipped');
      UI.start.hidden = false;
      G = null;
      selection = null;
      reachable = null;
      refreshStart();
      break;
    case 'tut-new':
      closeCoach();
      G = null;
      selection = null;
      reachable = null;
      UI.start.hidden = false;
      refreshStart();
      break;
    case 'tut-close': TUT.closed = true; closeCoach(); break;
    case 'save': toast(saveGame() ? 'Campaign saved on this device' : 'No campaign to save'); closeModal(); break;
    case 'load': if (loadGame()) { toast('Campaign loaded'); closeModal(); } break;
    case 'new': closeModal(); UI.start.hidden = false; refreshStart(); break;
    case 'end': maybeEndTurn(); break;
    case 'research': researchTech(a); if (!UI.modalLayer.hidden) showTechModal(); break;
    case 'war': playerDeclareWar(Number(a)); if (!UI.modalLayer.hidden) showCouncilModal(); break;
    case 'peace': playerOfferPeace(Number(a)); if (!UI.modalLayer.hidden) showCouncilModal(); break;
    case 'gift': playerGift(Number(a), 20); if (!UI.modalLayer.hidden) showCouncilModal(); break;
    case 'demand': closeModal(); showDemandModal(Number(a)); break;
    case 'demand2': resolveDemand(Number(a), b); closeModal(); showCouncilModal(); break;
    case 'demand-accept': answerDemand(Number(a), true); if (!UI.modalLayer.hidden) showCouncilModal(); break;
    case 'demand-refuse': answerDemand(Number(a), false); if (!UI.modalLayer.hidden) showCouncilModal(); break;
    case 'end-confirm': closeModal(); endPlayerTurn(); break;
    case 'next-unit': selectNextIdle(); break;
    case 'train': trainUnit(a, b); break;
    case 'build': buildInCity(a, b); break;
    case 'select-unit': {
      closeModal();
      const unit = unitById(a);
      if (unit) {
        selection = { kind: 'unit', id: unit.id };
        reachable = unit.owner === G.player && unit.mp > 0 ? computeReachable(unit) : new Map();
        centreOn(unit.x, unit.y);
        render();
      }
      break;
    }
    case 'select-city': {
      const city = cityById(a);
      if (city) {
        selection = { kind: 'city', id: city.id };
        reachable = null;
        centreOn(city.x, city.y);
        render();
      }
      break;
    }
    case 'centre': centreOn(Number(a), Number(b)); break;
    case 'found': {
      const unit = selection && selection.kind === 'unit' ? unitById(selection.id) : null;
      if (unit) foundCity(unit);
      break;
    }
    case 'fortify': {
      const unit = selection && selection.kind === 'unit' ? unitById(selection.id) : null;
      if (unit) fortify(unit);
      break;
    }
    case 'disband': {
      const unit = selection && selection.kind === 'unit' ? unitById(selection.id) : null;
      if (unit) disband(unit);
      break;
    }
  }
}

/* ── the tutorial ──────────────────────────────────────────────────────────── */

// One small hand-drawn vale and a coach that asks for a single thing at a time.
// A step only closes when the board actually shows the result, so the tutorial
// cannot be clicked through without playing it.
const TUT_ROWS = [
  'ooooooo',
  'omhfpso',
  'opCpHoo',
  'ofpsPoo',
  'ooooooo'
];
const TUT_GROUND = { o: 'ocean', m: 'meadow', p: 'plain', f: 'forest', h: 'hill', s: 'shoal' };

const TUT = { step: 0, trained: false, moved: false, closed: false };

const TUT_STEPS = [
  { say: 'This is Thornmouth, your only keep. Click the hex it stands on.',
    at: () => { const c = G.cities.find(c => c.capital); return c ? [c.x, c.y] : null; },
    done: () => !!(selection && selection.kind === 'city') },
  { say: 'A keep trains one banner each turn. Raise a Wanderer.',
    el: '[data-act^="train:"]',
    done: () => TUT.trained },
  { say: 'Click a banner to take it up, then a lit hex to move it.',
    at: () => { const u = G.units.find(u => u.owner === 0 && u.type === 'scout'); return u ? [u.x, u.y] : null; },
    done: () => TUT.moved },
  { say: 'Pioneers plant new keeps. Select them, then press Found city.',
    at: () => { const u = G.units.find(u => u.owner === 0 && u.type === 'pioneer'); return u ? [u.x, u.y] : null; },
    done: () => G.cities.length > 1 },
  { say: 'Each keep may also raise one work a turn. A Granary fills its stores.',
    el: '[data-act^="build:"]',
    done: () => G.cities.some(c => c.buildings.length > 0) },
  { say: 'Lore is bought with insight and never costs a turn. Learn Woodcraft.',
    el: '#btn-tech',
    done: () => player().techs.length > 0 },
  { say: 'A Cindermark raider is in your fields. Select the Spears beside the keep and strike it.',
    at: () => { const u = G.units.find(u => u.owner === 1); return u ? [u.x, u.y] : null; },
    done: () => !G.units.some(u => u.owner === 1) },
  { say: 'That is a turn. Press End turn: the rival banners move when you do.',
    el: '#btn-end',
    done: () => G.turn > 1 }
];

function buildTutorialVale() {
  const def = FACTIONS.find(f => f.id === 'thornwake') || FACTIONS[0];
  const rivalDef = FACTIONS.find(f => f.id === 'cindermark') || FACTIONS[1];
  G = {
    version: 1, seed: 0x7a17c3, size: 'small', turns: 20, maxTurns: 20,
    cols: 7, rows: 5, turn: 1, phase: 'player', player: 0,
    tiles: [], units: [], cities: [], factions: [], dip: [], attitude: [],
    log: [], over: null, demands: [], nextUnit: 1, nextCity: 1, tut: true
  };
  for (let y = 0; y < G.rows; y++) {
    for (let x = 0; x < G.cols; x++) {
      const ground = TUT_GROUND[TUT_ROWS[y][x]] || 'plain';
      G.tiles.push({ t: ground, f: null, owner: null, city: null, seen: false, vis: false });
    }
  }
  const banner = (i, d) => ({
    i, id: d.id, name: d.name, epithet: d.epithet, ink: d.ink, light: d.light,
    home: d.home, bonus: d.bonus, pride: d.pride, isPlayer: i === 0, alive: true,
    res: { timber: 18, ore: 12, coin: 16, insight: 14 }, techs: [], capital: null
  });
  G.factions = [banner(0, def), banner(1, rivalDef)];
  G.dip = [['peace', 'war'], ['war', 'peace']];
  G.attitude = [[0, -45], [-45, 0]];

  const keep = addCity(G.factions[0], 2, 2, 'Thornmouth', 2);
  keep.capital = true;
  G.factions[0].capital = keep.id;
  claimRing(keep, 1);
  addUnit(G.factions[0], 'spear', 3, 2);
  addUnit(G.factions[0], 'scout', 1, 1);
  addUnit(G.factions[0], 'pioneer', 4, 3);
  addUnit(G.factions[1], 'scout', 2, 1);
  log('A Cindermark raider has crossed the ford.', G.factions[1].ink);
  recomputeVision();
}

function startTutorial() {
  if (!UI) return;
  buildTutorialVale();
  TUT.step = 0; TUT.trained = false; TUT.moved = false; TUT.closed = false;
  selection = null;
  reachable = null;
  UI.start.hidden = true;
  UI.endShown = false;
  closeModal();
  cam.fitted = false;
  render();
  fitCamera();
}

// Closing the coach without finishing the vale: the board stays as it is, and
// the lit hex for the next step goes away with it.
function closeCoach() {
  if (UI && UI.coach) UI.coach.hidden = true;
  clearCoachMarks();
}

function clearCoachMarks() {
  for (const el of document.querySelectorAll('.coach-target')) el.classList.remove('coach-target');
}

function tutorialTick() {
  if (!G || !G.tut) return;
  let guard = 0;
  while (TUT.step < TUT_STEPS.length && TUT_STEPS[TUT.step].done() && guard++ < 12) TUT.step++;
}

// The hex the current step is waiting on, if it names one.
function coachAt() {
  if (!G || !G.tut) return null;
  const step = TUT_STEPS[TUT.step];
  return step && step.at ? step.at() : null;
}

function renderCoach() {
  if (!UI || !UI.coach) return;
  clearCoachMarks();
  if (!G || !G.tut || TUT.closed) { UI.coach.hidden = true; return; }
  UI.coach.hidden = false;

  if (TUT.step >= TUT_STEPS.length) {
    UI.coachCount.textContent = 'done';
    UI.coachSay.innerHTML = 'That is the whole of it: a keep, a banner, a work, a little lore and a war. ' +
      'The vale is yours to take.';
    UI.coachActions.innerHTML =
      '<button class="act" data-act="tut-new">Start a campaign</button>' +
      '<button class="act" data-act="tut-close">Keep looking around</button>';
    return;
  }

  const step = TUT_STEPS[TUT.step];
  UI.coachCount.textContent = (TUT.step + 1) + ' / ' + TUT_STEPS.length;
  UI.coachSay.innerHTML = step.say;
  UI.coachActions.innerHTML = '<button class="skip" data-act="tut-skip">Skip the tutorial</button>';
  if (step.el) {
    for (const el of document.querySelectorAll(step.el)) el.classList.add('coach-target');
  }
}

/* ── saving the campaign ───────────────────────────────────────────────────── */

const SAVE_KEY = 'bored.ashcrown.save.v1';

function saveGame() {
  if (!G) return false;
  // The tutorial vale is a lesson, not a campaign: it never touches the save slot.
  if (G.tut) return false;
  // A finished campaign is not resumable, so it leaves nothing behind for the
  // start screen's Continue to offer.
  if (G.over) { clearSave(); return false; }
  try {
    const banner = G.factions.find(f => f.i === G.player);
    const meta = (banner ? banner.name : 'Campaign') + ' · turn ' + G.turn;
    localStorage.setItem(SAVE_KEY, JSON.stringify({ v: 1, at: Date.now(), meta, state: G }));
    return true;
  } catch (error) {
    return false;
  }
}
function clearSave() {
  try {
    localStorage.removeItem(SAVE_KEY);
  } catch (error) { /* storage is blocked; nothing to clear */ }
}
function autosave() {
  saveGame();
}
function readSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || parsed.v !== 1 || !parsed.state) return null;
    const state = parsed.state;
    if (!Array.isArray(state.tiles) || !Array.isArray(state.factions) || !state.factions.length) return null;
    if (!Number.isFinite(state.turn) || !Number.isFinite(state.cols) || !Number.isFinite(state.rows)) return null;
    if (state.tiles.length !== state.cols * state.rows) return null;
    if (state.over) return null;
    return parsed;
  } catch (error) {
    return null;
  }
}
function loadGame() {
  const saved = readSave();
  if (!saved) return false;
  G = saved.state;
  if (!Array.isArray(G.demands)) G.demands = [];
  if (campaignCount === 0) campaignCount = 1;
  selection = null;
  reachable = null;
  UI.endShown = false;
  UI.start.hidden = true;
  recomputeVision();
  cam.fitted = false;
  render();
  fitCamera();
  return true;
}

/* ── the start screen ──────────────────────────────────────────────────────── */

const startChoice = { factionId: FACTIONS[0].id, size: 'medium', turns: 50 };
let campaignCount = 0;

// The first vale of the session is the day's shared seed, so everyone opening
// Ashcrown on the same day gets the same ground. Any vale after that is fresh.
function nextSeed() {
  if (campaignCount === 0) {
    try {
      if (window.__boredSeed && Number.isFinite(window.__boredSeed.seed)) return window.__boredSeed.seed >>> 0;
    } catch (error) { /* no seed from the hub */ }
  }
  return (Date.now() ^ Math.imul(campaignCount + 1, 2654435761)) >>> 0;
}

function buildStartScreen() {
  if (!UI) return;
  UI.factionGrid.innerHTML = FACTIONS.map(f =>
    '<button class="faction-card' + (f.id === startChoice.factionId ? ' on' : '') + '" data-pick="' + f.id + '" type="button">' +
    '<div class="fn">' + emblem(f.id, 24) + '<span style="color:' + f.ink + '">' + f.name + '</span></div>' +
    '<div class="fe">' + esc(f.epithet) + '</div>' +
    '<div class="fb">' + esc(f.bonus) + '</div></button>'
  ).join('');
  UI.factionGrid.onclick = event => {
    const card = event.target.closest('[data-pick]');
    if (!card) return;
    startChoice.factionId = card.getAttribute('data-pick');
    refreshStart();
  };
  UI.optSize.value = startChoice.size;
  UI.optTurns.value = String(startChoice.turns);
  UI.optSize.onchange = () => { startChoice.size = UI.optSize.value; };
  UI.optTurns.onchange = () => { startChoice.turns = Number(UI.optTurns.value); };
  UI.btnBegin.onclick = beginCampaign;
  UI.btnTutorial.onclick = startTutorial;
  UI.btnContinue.onclick = () => { if (loadGame()) closeModal(); };
  refreshStart();
}

function refreshStart() {
  if (!UI) return;
  for (const card of UI.factionGrid.querySelectorAll('[data-pick]')) {
    card.classList.toggle('on', card.getAttribute('data-pick') === startChoice.factionId);
  }
  const saved = readSave();
  UI.btnContinue.hidden = !saved;
  if (saved) UI.btnContinue.textContent = 'Continue · ' + (saved.meta || 'turn ' + saved.state.turn);
  const rivals = MAP_SIZES[startChoice.size].rivals;
  const chosen = FACTIONS.find(f => f.id === startChoice.factionId) || FACTIONS[0];
  const note = UI.startNote;
  if (note) {
    note.innerHTML = emblem(chosen.id, 18) + ' <b>' + chosen.name + '</b> against ' +
      (rivals === 2 ? 'two' : rivals === 3 ? 'three' : 'five') + ' rival banners. New to the vale? ' +
      'The tutorial takes about two minutes.';
  }
}

function beginCampaign() {
  if (!UI) return;
  const seed = nextSeed();
  campaignCount++;
  startCampaign({ seed, size: startChoice.size, turns: startChoice.turns, factionId: startChoice.factionId });
  UI.start.hidden = true;
  UI.endShown = false;
  closeModal();
  selection = null;
  reachable = null;
  cam.fitted = false;
  render();
  fitCamera();
  saveGame();
}

/* ── pointing at the map ───────────────────────────────────────────────────── */

function selectUnit(unit) {
  selection = { kind: 'unit', id: unit.id };
  reachable = unit.owner === G.player && unit.mp > 0 ? computeReachable(unit) : new Map();
  render();
}
function selectCity(city) {
  selection = { kind: 'city', id: city.id };
  reachable = null;
  render();
}

function handleTileClick(x, y) {
  if (!G || G.over) return;
  const f = player();
  const unit = unitAt(x, y);
  const city = cityAt(x, y);
  const selected = selection && selection.kind === 'unit' ? unitById(selection.id) : null;

  if (selected && selected.owner === f.i) {
    if (canAttackTarget(selected, x, y)) {
      attackTarget(selected, x, y);
      if (unitById(selected.id)) reachable = computeReachable(selected);
      else { selection = null; reachable = null; }
      checkEnd();
      render();
      autosave();
      return;
    }
    // Never walk onto another banner: click it to take it up instead.
    if (reachable && reachable.has(keyOf(x, y)) && !unit) {
      moveUnit(selected, x, y);
      checkEnd();
      render();
      autosave();
      return;
    }
  }
  if (unit && unit.owner === f.i) { selectUnit(unit); return; }
  if (city) { selectCity(city); return; }
  if (unit) { selectUnit(unit); return; }
  if (selection) { selection = null; reachable = null; render(); }
}

function handleMapClick(event) {
  const element = document.elementFromPoint(event.clientX, event.clientY);
  const hex = element && element.closest ? element.closest('[data-tile]') : null;
  if (!hex) {
    if (selection) { selection = null; reachable = null; render(); }
    return;
  }
  const parts = hex.getAttribute('data-tile').split(',');
  handleTileClick(Number(parts[0]), Number(parts[1]));
}

function bindMap() {
  const svg = UI.map;
  let drag = null;

  svg.addEventListener('pointerdown', event => {
    if (event.button !== 0 || !G) return;
    drag = { x: event.clientX, y: event.clientY, camX: cam.x, camY: cam.y, moved: false };
    svg.classList.add('dragging');
    if (svg.setPointerCapture) {
      try { svg.setPointerCapture(event.pointerId); } catch (error) { /* not captureable */ }
    }
  });

  svg.addEventListener('pointermove', event => {
    if (!drag) return;
    const dx = event.clientX - drag.x, dy = event.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true;
    if (drag.moved) {
      cam.x = drag.camX + dx;
      cam.y = drag.camY + dy;
      applyCamera();
    }
  });

  const release = event => {
    if (!drag) return;
    const moved = drag.moved;
    drag = null;
    svg.classList.remove('dragging');
    if (!moved) handleMapClick(event);
  };
  svg.addEventListener('pointerup', release);
  svg.addEventListener('pointercancel', () => {
    drag = null;
    svg.classList.remove('dragging');
  });

  svg.addEventListener('wheel', event => {
    if (!G) return;
    event.preventDefault();
    const rect = UI.stage.getBoundingClientRect();
    const px = event.clientX - rect.left, py = event.clientY - rect.top;
    const worldX = (px - cam.x) / cam.k, worldY = (py - cam.y) / cam.k;
    const factor = event.deltaY < 0 ? 1.12 : 1 / 1.12;
    cam.k = clamp(cam.k * factor, 0.32, 2.4);
    cam.x = px - worldX * cam.k;
    cam.y = py - worldY * cam.k;
    applyCamera();
  }, { passive: false });
}

function bindKeys() {
  document.addEventListener('keydown', event => {
    const tag = event.target && event.target.tagName;
    if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
    if (event.key === 'Escape') {
      if (!UI.modalLayer.hidden) closeModal();
      else if (selection) { selection = null; reachable = null; render(); }
      return;
    }
    if (!G) return;
    if (event.code === 'Space') {
      event.preventDefault();
      if (!G.over) maybeEndTurn();
      return;
    }
    const key = event.key.toLowerCase();
    if (key === 't') showTechModal();
    else if (key === 'd') showCouncilModal();
    else if (key === 'm') showMenuModal();
    else if (key === 'n') selectNextIdle();
    else if (key === 'h') showHelpModal();
  });
}

/* ── the hub's hooks ───────────────────────────────────────────────────────── */

// The arcade reads this to award a high score and rank the board. It runs at any
// time, including before a campaign starts, so it never throws and never returns
// null: zeroes until there is something to report, and `finished` only once the
// campaign is actually over.
if (typeof window !== 'undefined') {
  window.__boredSnapshot = function () {
    try {
      const f = G ? player() : null;
      return {
        slug: 'ashcrown',
        renown: f ? renownOf(f) : 0,
        cities: f ? ownCities(f).length : 0,
        techs: f ? f.techs.length : 0,
        units: f ? ownUnits(f).length : 0,
        turn: G ? G.turn : 0,
        won: G && G.over && G.over.won ? 1 : 0,
        finished: !!(G && G.over)
      };
    } catch (error) {
      return { slug: 'ashcrown', renown: 0, cities: 0, techs: 0, units: 0, turn: 0, won: 0, finished: false };
    }
  };
}

/* ── boot ──────────────────────────────────────────────────────────────────── */

function boot() {
  const q = selector => document.querySelector(selector);
  UI = {
    stage: q('#stage'), map: q('#map'), cam: q('#cam'),
    layerOwner: q('#layer-owner'), layerTerrain: q('#layer-terrain'), layerCoast: q('#layer-coast'),
    layerMarks: q('#layer-marks'), layerSites: q('#layer-sites'), layerUnits: q('#layer-units'),
    layerOverlay: q('#layer-overlay'), layerFog: q('#layer-fog'), layerLabels: q('#layer-labels'),
    resRow: q('#res-row'), bannerDot: q('#banner-dot'), bannerName: q('#banner-name'),
    bannerEpi: q('#banner-epi'), turnReadout: q('#turn-readout'), btnEnd: q('#btn-end'),
    sideScroll: q('#side-scroll'), log: q('#log'),
    modalLayer: q('#modal-layer'), modal: q('#modal'), toast: q('#toast'),
    start: q('#start'), factionGrid: q('#faction-grid'), optSize: q('#opt-size'),
    optTurns: q('#opt-turns'), btnBegin: q('#btn-begin'), btnContinue: q('#btn-continue'),
    startNote: q('#start-note'), coach: q('#coach'), coachSay: q('#coach-say'),
    coachCount: q('#coach-count'), coachActions: q('#coach-actions'),
    btnTutorial: q('#btn-tutorial'), endShown: false
  };

  buildStartScreen();
  bindMap();
  bindKeys();

  document.addEventListener('click', event => {
    const button = event.target.closest('[data-act]');
    if (!button || button.disabled) return;
    onAction(button.getAttribute('data-act'));
  });

  UI.modalLayer.addEventListener('click', event => {
    if (event.target === UI.modalLayer) closeModal();
  });

  q('#btn-tech').addEventListener('click', () => { if (G) showTechModal(); });
  q('#btn-council').addEventListener('click', () => { if (G) showCouncilModal(); });
  q('#btn-menu').addEventListener('click', () => { if (G) showMenuModal(); });
  q('#btn-end').addEventListener('click', () => { if (G && !G.over) maybeEndTurn(); });

  window.addEventListener('resize', () => { if (G && cam.fitted) fitCamera(); });

  // Closing the tab mid-turn should not cost the player the moves they made:
  // actions already autosave, and this catches anything that slipped through.
  window.addEventListener('pagehide', autosave);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') autosave(); });
}

if (typeof document !== 'undefined' && document.querySelector) {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
}
</script>
