<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Among Us</title>
<!--
  Among Us — a peer-to-peer social deduction round.

  Network: PeerJS 1.5.5 from jsDelivr (script below) plus its public broker at
  0.peerjs.com. There is no game server and no key: peers only need the broker to
  find each other, and everything after that travels on a WebRTC data channel.
  Internet is required; without it the menu says so instead of failing silently.

  Authority: the room host owns the rules and sends each player a snapshot with
  the other players' roles stripped. The host chair is not fixed: every snapshot
  names the next player in the ring, that player keeps a full checkpoint, and if
  the host disappears it claims the room's peer id and carries on. The public
  room lives at a fixed peer id, so the same election is what keeps it "always
  open" when the current host closes the tab.

  Art: the Skeld map, the per-colour crewmate frames, the task markers and the
  emergency button are the ripped set shipped with AI0702/Among-Us-clone
  (Unlicense repo, https://github.com/AI0702/Among-Us-clone; the artwork itself
  is Innersloth's). Its mini-map is also the collision mask, so the walls on
  screen are the walls the simulation uses. The tasks, the vents, the rules and
  the netcode are this game's own.
-->
<style>
/* Quiet chrome around loud art: the ship is AI0702's ripped Among Us set, so
   the frame stays flat, square-ish and out of the way. */
:root{
  --bg:#0d0e10; --panel:#141518; --panel-2:#191b1f; --line:#2a2c31;
  --ink:#e7e5e0; --dim:#8b8e94; --accent:#c0392b; --accent-ink:#fff;
  --font-body:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font-body);overflow:hidden}
#shell{height:100%;max-width:1080px;margin:0 auto;padding:10px 12px 12px;display:flex;flex-direction:column;gap:10px}
header.top{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.wordmark{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
.room-tag{margin-left:auto;font:11px var(--mono);letter-spacing:.08em;color:var(--dim);
  border:1px solid var(--line);border-radius:3px;padding:4px 8px}
#screens{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.screen{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px;overflow:auto}

/* menu */
.menu{width:min(400px,100%);display:flex;flex-direction:column;gap:10px;text-align:left}
.logo{font-size:30px;line-height:1;letter-spacing:.24em;text-transform:uppercase;font-weight:700}
.logo span{color:var(--ink)}
.logo span:last-child{color:var(--accent)}
.tagline{color:var(--dim);font-size:12.5px;margin-bottom:6px}
.field{display:flex;flex-direction:column;gap:5px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
input,select{width:100%;padding:10px 12px;border-radius:3px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);font:14px var(--font-body);outline:none}
input:focus-visible,select:focus-visible{border-color:#4c5057}
select{padding:8px 10px;font-size:13px}
.btn{font:600 12px/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;
  color:var(--ink);background:var(--panel-2);border:1px solid var(--line);border-radius:4px;
  padding:12px 14px;white-space:nowrap;transition:background .12s ease,border-color .12s ease}
.btn:hover:not(:disabled){background:#202329;border-color:#3a3d44}
.btn:focus-visible{outline:2px solid #4c5057;outline-offset:2px}
.btn:disabled{opacity:.45;cursor:default}
.btn-primary{background:var(--accent);border-color:#8f2a20;color:var(--accent-ink)}
.btn-primary:hover:not(:disabled){background:#cf4434;border-color:#8f2a20}
.btn-secondary{background:#23262c}
.btn-danger{background:transparent;border-color:#5a2a26;color:#e08a80}
.btn-danger:hover:not(:disabled){background:#2a1a18;border-color:#7a3a34}
.btn-large{padding:15px;font-size:13px}
.hint{color:var(--dim);font-size:11.5px;line-height:1.55}
.status{font-size:12px;color:var(--dim);min-height:0}
.status.bad{color:#e08a80}
.or{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:10px;letter-spacing:.2em;text-transform:uppercase;margin:2px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.join-row{display:flex;gap:8px}
.join-row input{flex:1;text-transform:uppercase;letter-spacing:.28em;font-family:var(--mono)}
.join-row .btn{flex:0 0 auto}

/* game frame */
#screen-game{align-items:center;justify-content:center;padding:0}
.game-wrap{width:100%;height:100%;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:8px}
.hud{align-self:flex-start;font:11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);border:1px solid var(--line);border-radius:3px;padding:6px 9px;background:var(--panel)}
.hud b{color:var(--ink);font-weight:600}
.stage{position:relative;flex:0 0 auto;width:100%;min-height:120px;max-width:100%;max-height:100%;
  margin:0 auto;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#000}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
.actions{position:absolute;right:10px;bottom:10px;z-index:6;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.actions .btn{min-width:78px;height:44px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;
  background:rgba(16,17,19,.86);border:1px solid #3a3d44;font-size:11px;border-radius:4px}
.actions #act-kill,.actions #act-button{background:#8f2a20;border-color:#a83a2e}
.actions #act-report{border-color:#6b6326;color:#e8dfa0}
.actions #act-vent,.actions #act-use{background:rgba(16,17,19,.9);color:#cfd2d7;border-color:#3a3d44}

/* lobby dock */
.lobby-bar{display:flex;flex-direction:column;gap:8px;padding:10px;border:1px solid var(--line);
  border-radius:4px;background:var(--panel);max-height:42vh;overflow:auto}
.lobby-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.code{font:600 13px var(--mono);letter-spacing:.22em;color:var(--ink)}
.code.public{color:#d8cfa8}
.lobby-top .btn-primary{margin-left:auto}
#copy{font-size:11px;padding:9px 11px}
.roster{list-style:none;display:flex;flex-direction:column;gap:0;text-align:left}
.roster li{display:flex;align-items:center;gap:8px;padding:6px 2px;border-top:1px solid var(--line);font-size:13px}
.roster li:first-child{border-top:0}
.roster .dot{width:9px;height:9px;border-radius:2px;flex:0 0 auto;background:var(--c)}
.roster .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.roster .tail{font:10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.roster .vote{border-radius:3px;padding:4px 9px;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;
  background:transparent;border:1px solid var(--line);color:var(--ink);cursor:pointer;font-family:var(--font-body)}
.roster .vote:hover:not(:disabled){background:#202329}
.roster .vote:disabled{opacity:.4;cursor:default}
.roster.chips{flex-direction:row;flex-wrap:wrap;gap:6px}
.roster.chips li{flex:0 0 auto;border:1px solid var(--line);border-radius:3px;padding:4px 8px;font-size:12px}
.roster.chips .name{flex:0 1 auto}
.row-item.is-impostor .tail{color:#e08a80}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px}
.settings label{display:flex;flex-direction:column;gap:4px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}

/* overlays */
.overlay{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:16px;
  background:rgba(6,7,8,.9);overflow:auto}
.panel{width:min(440px,100%);display:flex;flex-direction:column;gap:10px;padding:18px;
  border:1px solid var(--line);border-radius:4px;background:var(--panel)}
.eyebrow{font:10px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.panel h2{font-size:19px;line-height:1.2;font-weight:600}
.meeting-title{font-size:18px;font-weight:600;text-transform:uppercase;letter-spacing:.1em}
.meeting-note{color:var(--dim);font-size:12px}
.timer{font:600 15px var(--mono);color:var(--ink)}
#toast{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:60;background:#202329;
  border:1px solid #3a3d44;color:var(--ink);padding:8px 12px;border-radius:3px;font-size:12.5px;max-width:88vw;text-align:center}
[hidden]{display:none!important}
@media (max-width:520px){
  .logo{font-size:24px}
  .actions .btn{min-width:62px;height:40px;font-size:10px}
  .panel{padding:14px}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
</head>
<body>
<main id="shell">
  <header class="top">
    <span class="wordmark">Among Us</span>
    <span id="room-tag" class="room-tag" hidden></span>
    <button id="leave" class="btn btn-danger" type="button" hidden>Leave</button>
  </header>

  <div id="screens">
    <section id="screen-menu" class="screen">
      <div class="menu">
        <h1 class="logo"><span>Among</span><span>Us</span></h1>
        <p class="tagline">Light &amp; sound. Trust no one.</p>

        <label class="field">Your name
          <input id="name" maxlength="12" autocomplete="nickname" placeholder="Crewmate">
        </label>

        <button id="public-join" class="btn btn-primary btn-large" type="button">Join the public room</button>
        <p class="hint">One room, always open. It starts as soon as three are in, and late arrivals play straight away.</p>

        <div class="or">or</div>

        <button id="create" class="btn btn-secondary" type="button">Create a private room</button>
        <div class="join-row">
          <input id="code" maxlength="4" inputmode="text" autocapitalize="characters" placeholder="CODE" aria-label="Room code">
          <button id="join" class="btn btn-secondary" type="button">Join</button>
        </div>

        <p id="menu-status" class="status" role="status"></p>
      </div>
    </section>

    <section id="screen-game" class="screen" hidden>
      <div class="game-wrap">
        <div id="hud" class="hud"></div>
        <div class="stage">
          <canvas id="board" aria-label="Ship map"></canvas>
          <div id="actions" class="actions">
            <button id="act-use" class="btn" type="button" hidden>Use</button>
            <button id="act-kill" class="btn" type="button" hidden>Kill</button>
            <button id="act-vent" class="btn" type="button" hidden>Vent</button>
            <button id="act-report" class="btn" type="button" hidden>Report</button>
            <button id="act-button" class="btn" type="button" hidden>Button</button>
          </div>
        </div>
        <div id="lobby-bar" class="lobby-bar" hidden>
          <div class="lobby-top">
            <span id="lobby-code" class="code">----</span>
            <button id="copy" class="btn btn-secondary" type="button">Copy code</button>
            <button id="start" class="btn btn-primary" type="button" hidden>Start game</button>
          </div>
          <ul id="roster" class="roster chips" aria-label="Players"></ul>
          <div id="host-settings" class="settings" hidden>
            <label>Impostors
              <select id="set-impostors">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
              </select>
            </label>
            <label>Kill cooldown
              <select id="set-cooldown">
                <option value="10">10s</option>
                <option value="15">15s</option>
                <option value="20">20s</option>
                <option value="25">25s</option>
                <option value="30">30s</option>
                <option value="40">40s</option>
              </select>
            </label>
            <label>Tasks each
              <select id="set-tasks">
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
              </select>
            </label>
          </div>
          <p id="lobby-note" class="hint"></p>
        </div>
      </div>
    </section>
  </div>
</main>

<section id="overlay-meeting" class="overlay" hidden>
  <div class="panel">
    <p class="eyebrow" id="meeting-reason"></p>
    <h2 class="meeting-title">Who is the imposter?</h2>
    <p class="meeting-note" id="meeting-note"></p>
    <p class="timer" id="meeting-timer">45s</p>
    <ul id="votes" class="roster"></ul>
    <button id="skip" class="btn" type="button">Skip vote</button>
  </div>
</section>

<section id="overlay-over" class="overlay" hidden>
  <div class="panel">
    <p class="eyebrow" id="over-eyebrow"></p>
    <h2 id="over-title"></h2>
    <ul id="over-roles" class="roster"></ul>
    <button id="back-lobby" class="btn btn-primary" type="button" hidden>Back to lobby</button>
    <p class="hint" id="over-note"></p>
  </div>
</section>

<p id="toast" hidden></p>

<script id="imposter-core">
/* Pure game logic: the map, the rules and the transport-free host room.
   It touches no DOM, so the same code runs in a browser and in a test harness. */
window.ImposterCore = (function () {
  'use strict';

  /* ── the ship ─────────────────────────────────────────────────────────── */

  const WORLD = { w: 1000, h: 547 };

  // Rooms are labels and task buckets; the walls are not geometry but the
  // mini-map the ship art was drawn from, sampled per pixel (see pointInFloor).
  const ROOMS = [
    { id: 'upperEngine', name: 'Upper Engine' },
    { id: 'cafeteria', name: 'Cafeteria' },
    { id: 'medbay', name: 'MedBay' },
    { id: 'reactor', name: 'Reactor' },
    { id: 'electrical', name: 'Electrical' },
    { id: 'security', name: 'Security' },
    { id: 'lowerEngine', name: 'Lower Engine' },
    { id: 'storage', name: 'Storage' },
    { id: 'navigation', name: 'Navigation' },
  ];

  const SPAWN = { x: 560, y: 235 };
  const BUTTON = { x: 565, y: 150, label: 'Emergency' };

  const STATIONS = [
    { id: 'wires-caf', room: 'cafeteria', label: 'Wires', x: 520, y: 120 },
    { id: 'cards-caf', room: 'cafeteria', label: 'Card swipe', x: 630, y: 150 },
    { id: 'fuel-upper', room: 'upperEngine', label: 'Fuel', x: 215, y: 120 },
    { id: 'align-upper', room: 'upperEngine', label: 'Align engine', x: 255, y: 150 },
    { id: 'scan-med', room: 'medbay', label: 'MedBay scan', x: 420, y: 200 },
    { id: 'sample-med', room: 'medbay', label: 'Samples', x: 390, y: 240 },
    { id: 'start-reactor', room: 'reactor', label: 'Start reactor', x: 140, y: 220 },
    { id: 'hand-reactor', room: 'reactor', label: 'Hand scan', x: 165, y: 270 },
    { id: 'wires-elec', room: 'electrical', label: 'Wires', x: 430, y: 330 },
    { id: 'divert-elec', room: 'electrical', label: 'Divert power', x: 450, y: 340 },
    { id: 'cams-sec', room: 'security', label: 'Cameras', x: 320, y: 230 },
    { id: 'logs-sec', room: 'security', label: 'Logs', x: 335, y: 265 },
    { id: 'fuel-lower', room: 'lowerEngine', label: 'Fuel', x: 215, y: 380 },
    { id: 'align-lower', room: 'lowerEngine', label: 'Align engine', x: 255, y: 350 },
    { id: 'box-storage', room: 'storage', label: 'Sort crates', x: 530, y: 390 },
    { id: 'fuel-storage', room: 'storage', label: 'Fuel', x: 580, y: 430 },
    { id: 'course-nav', room: 'navigation', label: 'Plot course', x: 940, y: 220 },
    { id: 'chart-nav', room: 'navigation', label: 'Charts', x: 955, y: 265 },
  ];

  // Vents come in pairs and only the impostor may use them. A vent is a physical
  // object on the map: crewmates see the grate, and a jump between grates is
  // visible to anyone watching the two rooms.
  const VENTS = [
    { id: 'vent-caf', pair: 'vent-elec', room: 'cafeteria', x: 640, y: 190 },
    { id: 'vent-elec', pair: 'vent-caf', room: 'electrical', x: 455, y: 360 },
    { id: 'vent-med', pair: 'vent-sec', room: 'medbay', x: 405, y: 255 },
    { id: 'vent-sec', pair: 'vent-med', room: 'security', x: 330, y: 255 },
    { id: 'vent-reactor', pair: 'vent-upper', room: 'reactor', x: 150, y: 290 },
    { id: 'vent-upper', pair: 'vent-reactor', room: 'upperEngine', x: 240, y: 110 },
  ];

  const BUTTON_RANGE = 30;
  const stationById = id => STATIONS.find(station => station.id === id) || null;
  const ventById = id => VENTS.find(vent => vent.id === id) || null;
  const pairedVent = id => {
    const vent = ventById(id);
    return vent ? ventById(vent.pair) : null;
  };

  /* ── rules ────────────────────────────────────────────────────────────── */

  // Speeds are per second in world units. The ship is wider than the old
  // hand-drawn layout, so the walk speed scales with it.
  const SPEED = 150;
  const KILL_RANGE = 38;
  const TASK_RANGE = 34;
  const REPORT_RANGE = 48;
  const VENT_RANGE = 30;
  const VENT_COOLDOWN = 2;
  const MEETING_MS = 45_000;
  const RESET_MS = 9_000;
  const ABSENT_MS = 12_000;
  const MIN_PLAYERS = 3;
  const MAX_PLAYERS = 10;
  const PLAYER_RADIUS = 6;

  const DEFAULTS = { impostors: 1, killCooldownSec: 20, tasksPerPlayer: 4, auto: false };

  const COLORS = [
    { id: 'red', hex: '#c51111' },
    { id: 'blue', hex: '#2b52d8' },
    { id: 'green', hex: '#16963a' },
    { id: 'pink', hex: '#ee54bb' },
    { id: 'orange', hex: '#f07d0d' },
    { id: 'yellow', hex: '#f6f658' },
    { id: 'purple', hex: '#8b4bd8' },
    { id: 'brown', hex: '#8b5a2b' },
    { id: 'white', hex: '#e8ecf4' },
    { id: 'black', hex: '#3c4046' },
  ];

  const clamp = (value, lo, hi) => Math.min(hi, Math.max(lo, value));
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const round = value => Math.round(value * 10) / 10;

  // The walk mask: green pixels of the mini-map, read once into a byte array.
  // Until it loads, the whole ship is standable so seeding never blocks on IO.
  const WALK = { data: null, w: 0, h: 0 };

  function setWalkMask(data, width, height) {
    WALK.data = data;
    WALK.w = width;
    WALK.h = height;
  }

  function pointInFloor(x, y) {
    if (!WALK.data) return x >= 0 && y >= 0 && x <= WORLD.w && y <= WORLD.h;
    const px = Math.floor((x / WORLD.w) * WALK.w);
    const py = Math.floor((y / WORLD.h) * WALK.h);
    if (px < 0 || py < 0 || px >= WALK.w || py >= WALK.h) return false;
    return WALK.data[(py * WALK.w + px) * 4 + 1] > 60;
  }

  function canStand(x, y, radius = PLAYER_RADIUS) {
    return (
      pointInFloor(x, y) &&
      pointInFloor(x - radius, y) &&
      pointInFloor(x + radius, y) &&
      pointInFloor(x, y - radius) &&
      pointInFloor(x, y + radius)
    );
  }

  function nearestFloorPoint(x, y) {
    if (pointInFloor(x, y)) return { x, y };
    for (let radius = 2; radius <= 80; radius += 2) {
      for (let step = 0; step < 16; step += 1) {
        const angle = (step / 16) * Math.PI * 2;
        const cx = x + Math.cos(angle) * radius;
        const cy = y + Math.sin(angle) * radius;
        if (pointInFloor(cx, cy)) return { x: cx, y: cy };
      }
    }
    return { x: SPAWN.x, y: SPAWN.y };
  }

  function shuffle(list, rng) {
    const copy = list.slice();
    for (let i = copy.length - 1; i > 0; i -= 1) {
      const j = Math.floor(rng() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  function cleanName(name) {
    const text = String(name || '').replace(/\s+/g, ' ').trim();
    return (text || 'Crewmate').slice(0, 12);
  }

  function emit(state, event) {
    state.events.push(event);
  }

  function drainEvents(state) {
    const events = state.events;
    state.events = [];
    return events;
  }

  function createGame({ code = 'TEST', settings = {} } = {}) {
    return {
      code,
      phase: 'lobby',
      settings: Object.assign({}, DEFAULTS, settings),
      players: [],
      bodies: [],
      meeting: null,
      winner: null,
      over: null,
      time: 0,
      events: [],
    };
  }

  function getPlayer(state, id) {
    return state.players.find(player => player.id === id) || null;
  }

  function pickColor(state, wanted) {
    const taken = new Set(state.players.map(player => player.color));
    if (wanted && !taken.has(wanted)) return wanted;
    const free = COLORS.find(color => !taken.has(color.id));
    return free ? free.id : COLORS[state.players.length % COLORS.length].id;
  }

  // A player may walk in at any time. In the lobby they wait for the deal; in a
  // running round they arrive as a crewmate with a full task list, standing at a
  // station, ready to play that second.
  function addPlayer(state, { id, name, host = false, rng = Math.random }) {
    const existing = getPlayer(state, id);
    if (existing) {
      existing.name = cleanName(name);
      return existing;
    }
    if (state.players.length >= MAX_PLAYERS) return null;

    const running = state.phase === 'play' || state.phase === 'meeting';
    // The lobby is the ship itself, so newcomers land in the cafeteria beside
    // whoever is already walking around instead of on top of them.
    const spot = running
      ? STATIONS[Math.floor(rng() * STATIONS.length)]
      : {
        x: SPAWN.x + ((state.players.length % 5) - 2) * 24,
        y: SPAWN.y + (state.players.length >= 5 ? 24 : 0),
      };
    const player = {
      id,
      name: cleanName(name),
      color: pickColor(state),
      host: Boolean(host),
      ready: false,
      role: 'crew',
      alive: true,
      x: spot.x,
      y: spot.y,
      dir: { x: 0, y: 0 },
      goto: null,
      tasks: [],
      tasksDone: [],
      cooldown: 0,
      ventCooldown: 0,
      emergencyUsed: false,
      revealed: false,
      seen: state.time,
    };
    if (running) {
      player.tasks = shuffle(STATIONS.map(station => station.id), rng).slice(0, state.settings.tasksPerPlayer);
    }
    state.players.push(player);
    if (running) emit(state, { t: 'join', id, name: player.name });
    return player;
  }

  function removePlayer(state, id) {
    const player = getPlayer(state, id);
    if (!player) return false;
    state.players = state.players.filter(other => other.id !== id);
    if (state.meeting) {
      state.meeting.voters = state.meeting.voters.filter(voter => voter !== id);
      delete state.meeting.votes[id];
    }
    if ((state.phase === 'play' || state.phase === 'meeting') && state.players.length < MIN_PLAYERS) {
      backToLobby(state);
      emit(state, { t: 'lobby', reason: 'empty' });
      return true;
    }
    if (state.phase === 'play' || state.phase === 'meeting') checkWin(state);
    if (!state.players.length) backToLobby(state);
    return true;
  }

  function setReady(state, id, ready) {
    const player = getPlayer(state, id);
    if (!player || state.phase !== 'lobby') return { ok: false, error: 'not-in-lobby' };
    player.ready = Boolean(ready);
    return { ok: true };
  }

  function configure(state, id, patch) {
    const player = getPlayer(state, id);
    if (!player) return { ok: false, error: 'unknown-player' };
    if (state.phase !== 'lobby') return { ok: false, error: 'already-started' };
    const next = Object.assign({}, state.settings);
    if (patch.impostors !== undefined) next.impostors = clamp(Math.round(Number(patch.impostors) || 1), 1, 3);
    if (patch.killCooldownSec !== undefined) next.killCooldownSec = clamp(Math.round(Number(patch.killCooldownSec) || 20), 5, 60);
    if (patch.tasksPerPlayer !== undefined) next.tasksPerPlayer = clamp(Math.round(Number(patch.tasksPerPlayer) || 4), 1, 6);
    state.settings = next;
    return { ok: true };
  }

  function scatterCrew(state) {
    const living = state.players.filter(player => player.alive);
    living.forEach((player, index) => {
      const angle = (index / Math.max(1, living.length)) * Math.PI * 2;
      const x = SPAWN.x + Math.cos(angle) * 52;
      const y = SPAWN.y + Math.sin(angle) * 52;
      const spot = canStand(x, y) ? { x, y } : nearestFloorPoint(x, y);
      player.x = spot.x;
      player.y = spot.y;
      player.dir = { x: 0, y: 0 };
      player.goto = null;
    });
  }

  function beginRound(state, rng = Math.random) {
    if (state.phase !== 'lobby') return { ok: false, error: 'already-started' };
    if (state.players.length < MIN_PLAYERS) return { ok: false, error: 'need-3-players' };

    const impostorCount = Math.max(1, Math.min(state.settings.impostors, Math.floor(state.players.length / 3)));
    const order = shuffle(state.players.map(player => player.id), rng);
    const impostors = new Set(order.slice(0, impostorCount));

    for (const player of state.players) {
      player.role = impostors.has(player.id) ? 'impostor' : 'crew';
      player.alive = true;
      player.ready = true;
      player.revealed = false;
      player.cooldown = state.settings.killCooldownSec;
      player.ventCooldown = 0;
      player.emergencyUsed = false;
      player.tasksDone = [];
      player.tasks =
        player.role === 'crew'
          ? shuffle(STATIONS.map(station => station.id), rng).slice(0, state.settings.tasksPerPlayer)
          : [];
    }

    state.phase = 'play';
    state.bodies = [];
    state.meeting = null;
    state.winner = null;
    state.over = null;
    scatterCrew(state);
    emit(state, { t: 'start' });
    return { ok: true };
  }

  // Any seat may deal the next round or tune the room. Who won the host
  // election is a networking detail, so it never becomes a permission a player
  // has to know about.
  function start(state, byId, rng = Math.random) {
    if (!getPlayer(state, byId)) return { ok: false, error: 'unknown-player' };
    return beginRound(state, rng);
  }

  function maybeAutoStart(state, rng = Math.random) {
    if (!state.settings.auto) return false;
    if (state.phase !== 'lobby') return false;
    if (state.players.length < MIN_PLAYERS) return false;
    return beginRound(state, rng).ok;
  }

  function backToLobby(state, byId = null) {
    if (byId !== null && !getPlayer(state, byId)) return { ok: false, error: 'unknown-player' };
    state.phase = 'lobby';
    state.bodies = [];
    state.meeting = null;
    state.winner = null;
    state.over = null;
    for (const player of state.players) {
      player.alive = true;
      player.role = 'crew';
      player.ready = false;
      player.revealed = false;
      player.tasks = [];
      player.tasksDone = [];
      player.cooldown = 0;
      player.ventCooldown = 0;
      player.emergencyUsed = false;
      player.dir = { x: 0, y: 0 };
      player.goto = null;
    }
    return { ok: true };
  }

  function startMeeting(state, { caller, reason, bodyOf = null }) {
    state.phase = 'meeting';
    state.meeting = {
      caller,
      reason,
      bodyOf,
      votes: {},
      voters: state.players.filter(player => player.alive).map(player => player.id),
      msLeft: MEETING_MS,
    };
    state.bodies = [];
    for (const player of state.players) {
      player.dir = { x: 0, y: 0 };
      player.goto = null;
    }
    emit(state, { t: 'meeting', caller, reason, bodyOf });
  }

  function endMeeting(state) {
    const meeting = state.meeting;
    if (!meeting || state.phase !== 'meeting') return { ok: false, error: 'no-meeting' };

    const counts = {};
    for (const target of Object.values(meeting.votes)) {
      counts[target] = (counts[target] || 0) + 1;
    }
    const ranked = Object.entries(counts).sort((a, b) => b[1] - a[1]);
    const top = ranked.length ? ranked[0][1] : 0;
    const leaders = ranked.filter(([, count]) => count === top);
    const tie = leaders.length !== 1;
    const choice = tie ? null : leaders[0][0];
    const ejected = choice && choice !== 'skip' ? choice : null;

    let ejectedRole = null;
    if (ejected) {
      const victim = getPlayer(state, ejected);
      if (victim) {
        victim.alive = false;
        victim.revealed = true;
        victim.dir = { x: 0, y: 0 };
        victim.goto = null;
        ejectedRole = victim.role;
      }
    }

    state.meeting = null;
    state.bodies = [];
    emit(state, { t: 'eject', id: ejected, role: ejectedRole, tie: tie || choice === 'skip' });

    if (!checkWin(state)) {
      state.phase = 'play';
      scatterCrew(state);
      for (const player of state.players) {
        if (player.role === 'impostor') player.cooldown = state.settings.killCooldownSec;
      }
    }
    return { ok: true, ejected, ejectedRole, tie: tie || choice === 'skip' };
  }

  function checkWin(state) {
    if (state.phase === 'over') return state.winner;
    if (state.phase !== 'play' && state.phase !== 'meeting') return state.winner;

    const living = state.players.filter(player => player.alive);
    const impostors = living.filter(player => player.role === 'impostor');
    const crew = living.filter(player => player.role === 'crew');

    let winner = null;
    if (!state.players.some(player => player.role === 'impostor')) {
      // The impostor walked out of the room: there is nothing left to hide from.
      winner = 'crew';
    } else if (impostors.length === 0) winner = 'crew';
    else if (crew.length === 0) winner = 'impostor';
    else if (impostors.length >= crew.length) winner = 'impostor';
    else {
      const remaining = crew.reduce((total, player) => total + player.tasks.length - player.tasksDone.length, 0);
      const assigned = crew.reduce((total, player) => total + player.tasks.length, 0);
      if (assigned > 0 && remaining === 0) winner = 'crew';
    }

    if (winner) {
      state.phase = 'over';
      state.winner = winner;
      state.meeting = null;
      state.over = {
        winner,
        msLeft: RESET_MS,
        roles: state.players.map(player => ({ id: player.id, name: player.name, role: player.role, alive: player.alive })),
      };
      for (const player of state.players) {
        player.dir = { x: 0, y: 0 };
        player.goto = null;
      }
      emit(state, { t: 'win', winner });
    }
    return winner;
  }

  function movePlayer(player, dt) {
    if (player.goto) {
      const dx = player.goto.x - player.x;
      const dy = player.goto.y - player.y;
      const length = Math.hypot(dx, dy);
      if (length <= 2) {
        player.x = player.goto.x;
        player.y = player.goto.y;
        player.goto = null;
        player.dir = { x: 0, y: 0 };
        return;
      }
      player.dir = { x: dx / length, y: dy / length };
    }

    if (!player.dir.x && !player.dir.y) return;

    let dirX = player.dir.x;
    let dirY = player.dir.y;
    const magnitude = Math.hypot(dirX, dirY);
    if (magnitude > 1) {
      dirX /= magnitude;
      dirY /= magnitude;
    }

    const stepX = dirX * SPEED * dt;
    const stepY = dirY * SPEED * dt;
    let moved = false;
    if (stepX && canStand(player.x + stepX, player.y)) {
      player.x += stepX;
      moved = true;
    }
    if (stepY && canStand(player.x, player.y + stepY)) {
      player.y += stepY;
      moved = true;
    }
    player.x = clamp(player.x, PLAYER_RADIUS, WORLD.w - PLAYER_RADIUS);
    player.y = clamp(player.y, PLAYER_RADIUS, WORLD.h - PLAYER_RADIUS);
    if (!moved && player.goto) player.goto = null;
  }

  function step(state, dtMs, rng = Math.random) {
    const dt = clamp(dtMs, 0, 250) / 1000;
    state.time += clamp(dtMs, 0, 250);

    if (state.meeting) {
      state.meeting.msLeft -= clamp(dtMs, 0, 250);
      if (state.meeting.msLeft <= 0) endMeeting(state);
    }

    if (state.phase === 'over') {
      if (state.settings.auto) {
        state.over.msLeft = Math.max(0, state.over.msLeft - clamp(dtMs, 0, 250));
        if (state.over.msLeft <= 0) {
          backToLobby(state);
          emit(state, { t: 'lobby', reason: 'next-round' });
          maybeAutoStart(state, rng);
        }
      }
      return;
    }

    if (state.phase !== 'play' && state.phase !== 'lobby') return;

    for (const player of state.players) {
      if (state.phase === 'play') {
        if (player.cooldown > 0) player.cooldown = Math.max(0, player.cooldown - dt);
        if (player.ventCooldown > 0) player.ventCooldown = Math.max(0, player.ventCooldown - dt);
      }
      // Walking is the point of the lobby: the ship is open to explore while
      // the room fills, and the round starts from wherever people stand.
      movePlayer(player, dt);
    }
  }

  const rejected = error => ({ ok: false, error });

  function alive(state, id) {
    const player = getPlayer(state, id);
    if (!player) return null;
    return player.alive ? player : null;
  }

  function apply(state, id, message) {
    if (!message || typeof message !== 'object') return rejected('bad-message');
    const player = getPlayer(state, id);
    if (!player) return rejected('unknown-player');

    switch (message.t) {
      case 'walk': {
        if (state.phase !== 'play' && state.phase !== 'lobby') return rejected('not-playing');
        const dx = clamp(Number(message.dx) || 0, -1, 1);
        const dy = clamp(Number(message.dy) || 0, -1, 1);
        player.goto = null;
        player.dir = { x: dx, y: dy };
        return { ok: true };
      }
      case 'goto': {
        if (state.phase !== 'play' && state.phase !== 'lobby') return rejected('not-playing');
        const target = nearestFloorPoint(Number(message.x) || 0, Number(message.y) || 0);
        player.goto = {
          x: clamp(target.x, PLAYER_RADIUS, WORLD.w - PLAYER_RADIUS),
          y: clamp(target.y, PLAYER_RADIUS, WORLD.h - PLAYER_RADIUS),
        };
        player.dir = { x: 0, y: 0 };
        return { ok: true };
      }
      case 'stop': {
        player.dir = { x: 0, y: 0 };
        player.goto = null;
        return { ok: true };
      }
      case 'ready':
        return setReady(state, id, message.ready);
      case 'settings':
        return configure(state, id, message.settings || {});
      case 'start':
        return start(state, id);
      case 'lobby':
        return backToLobby(state, id);
      case 'task': {
        const actor = alive(state, id);
        if (!actor) return rejected('dead');
        if (state.phase !== 'play') return rejected('not-playing');
        if (actor.role !== 'crew') return rejected('not-crew');
        const station = stationById(message.station);
        if (!station) return rejected('no-station');
        if (!actor.tasks.includes(station.id)) return rejected('not-your-task');
        if (actor.tasksDone.includes(station.id)) return rejected('already-done');
        if (dist(actor, station) > TASK_RANGE) return rejected('too-far');
        actor.tasksDone.push(station.id);
        emit(state, { t: 'task', id, station: station.id });
        checkWin(state);
        return { ok: true };
      }
      case 'kill': {
        const actor = alive(state, id);
        if (!actor) return rejected('dead');
        if (state.phase !== 'play') return rejected('not-playing');
        if (actor.role !== 'impostor') return rejected('not-impostor');
        if (actor.cooldown > 0) return rejected('cooling-down');
        const victim = alive(state, message.target);
        if (!victim) return rejected('no-target');
        if (victim.role === 'impostor') return rejected('teammate');
        if (dist(actor, victim) > KILL_RANGE) return rejected('too-far');
        victim.alive = false;
        victim.dir = { x: 0, y: 0 };
        victim.goto = null;
        state.bodies.push({ id: 'body-' + victim.id, of: victim.id, x: victim.x, y: victim.y });
        actor.cooldown = state.settings.killCooldownSec;
        emit(state, { t: 'kill', killer: id, victim: victim.id });
        checkWin(state);
        return { ok: true };
      }
      case 'vent': {
        const actor = alive(state, id);
        if (!actor) return rejected('dead');
        if (state.phase !== 'play') return rejected('not-playing');
        if (actor.role !== 'impostor') return rejected('not-impostor');
        if (actor.ventCooldown > 0) return rejected('venting-cooldown');
        const from = ventById(message.vent);
        if (!from) return rejected('no-vent');
        if (dist(actor, from) > VENT_RANGE) return rejected('too-far');
        const to = pairedVent(from.id);
        if (!to) return rejected('no-vent');
        actor.x = to.x;
        actor.y = to.y;
        actor.dir = { x: 0, y: 0 };
        actor.goto = null;
        actor.ventCooldown = VENT_COOLDOWN;
        return { ok: true };
      }
      case 'report': {
        const actor = alive(state, id);
        if (!actor) return rejected('dead');
        if (state.phase !== 'play') return rejected('not-playing');
        const body = state.bodies.find(candidate => candidate.id === message.body);
        if (!body) return rejected('no-body');
        if (dist(actor, body) > REPORT_RANGE) return rejected('too-far');
        startMeeting(state, { caller: id, reason: 'body', bodyOf: body.of });
        return { ok: true };
      }
      case 'button': {
        const actor = alive(state, id);
        if (!actor) return rejected('dead');
        if (state.phase !== 'play') return rejected('not-playing');
        if (actor.emergencyUsed) return rejected('already-used');
        if (dist(actor, BUTTON) > BUTTON_RANGE) return rejected('too-far');
        actor.emergencyUsed = true;
        startMeeting(state, { caller: id, reason: 'button' });
        return { ok: true };
      }
      case 'vote': {
        const meeting = state.meeting;
        if (!meeting || state.phase !== 'meeting') return rejected('no-meeting');
        if (!meeting.voters.includes(id)) return rejected('dead-cannot-vote');
        if (meeting.votes[id] !== undefined) return rejected('already-voted');
        const target = message.target;
        if (target !== 'skip') {
          const victim = alive(state, target);
          if (!victim) return rejected('no-target');
        }
        meeting.votes[id] = target;
        emit(state, { t: 'vote', id, target });
        if (Object.keys(meeting.votes).length >= meeting.voters.length) endMeeting(state);
        return { ok: true };
      }
      default:
        return rejected('unknown-message');
    }
  }

  function actionHints(state, viewer) {
    const hints = { use: null, kill: null, vent: null, report: null, button: false };
    if (state.phase !== 'play' || !viewer || !viewer.alive) return hints;

    if (viewer.role === 'crew') {
      const open = viewer.tasks.filter(id => !viewer.tasksDone.includes(id));
      const near = STATIONS.filter(station => open.includes(station.id) && dist(viewer, station) <= TASK_RANGE);
      hints.use = near.sort((a, b) => dist(viewer, a) - dist(viewer, b))[0]?.id || null;
    }

    if (viewer.role === 'impostor') {
      if (viewer.cooldown <= 0) {
        const targets = state.players.filter(
          player => player.alive && player.role === 'crew' && player.id !== viewer.id && dist(viewer, player) <= KILL_RANGE,
        );
        hints.kill = targets.sort((a, b) => dist(viewer, a) - dist(viewer, b))[0]?.id || null;
      }
      if (viewer.ventCooldown <= 0) {
        const vent = VENTS.filter(candidate => dist(viewer, candidate) <= VENT_RANGE)
          .sort((a, b) => dist(viewer, a) - dist(viewer, b))[0];
        hints.vent = vent ? vent.id : null;
      }
    }

    const body = state.bodies
      .filter(candidate => dist(viewer, candidate) <= REPORT_RANGE)
      .sort((a, b) => dist(viewer, a) - dist(viewer, b))[0];
    hints.report = body ? body.id : null;
    hints.button = !viewer.emergencyUsed && dist(viewer, BUTTON) <= BUTTON_RANGE;
    return hints;
  }

  function snapshotFor(state, viewerId) {
    const viewer = getPlayer(state, viewerId);
    const meeting = state.meeting;

    return {
      code: state.code,
      phase: state.phase,
      winner: state.winner,
      over: state.over,
      settings: state.settings,
      map: { w: WORLD.w, h: WORLD.h },
      button: BUTTON,
      vents: VENTS.map(vent => ({ id: vent.id, x: vent.x, y: vent.y, pair: vent.pair })),
      you: viewer
        ? {
            id: viewer.id,
            role: viewer.role,
            alive: viewer.alive,
            ready: viewer.ready,
            host: viewer.host,
            done: viewer.tasksDone.length,
            total: viewer.tasks.length,
            cooldown: Math.ceil(viewer.cooldown),
            ventCooldown: Math.ceil(viewer.ventCooldown),
            emergencyUsed: viewer.emergencyUsed,
            tasks: viewer.tasks.map(id => {
              const station = stationById(id);
              return { id, label: station.label, room: station.room, x: station.x, y: station.y, done: viewer.tasksDone.includes(id) };
            }),
          }
        : null,
      players: state.players.map(player => ({
        id: player.id,
        name: player.name,
        color: player.color,
        host: player.host,
        ready: player.ready,
        alive: player.alive,
        x: round(player.x),
        y: round(player.y),
        role: state.phase === 'over' || player.revealed ? player.role : undefined,
        teammate: viewer && viewer.role === 'impostor' && player.role === 'impostor' && player.id !== viewer.id ? true : undefined,
      })),
      bodies: state.bodies.map(body => ({ id: body.id, of: body.of, x: round(body.x), y: round(body.y) })),
      meeting: meeting
        ? {
            caller: meeting.caller,
            reason: meeting.reason,
            bodyOf: meeting.bodyOf,
            msLeft: Math.max(0, Math.round(meeting.msLeft)),
            voted: Object.keys(meeting.votes),
            total: meeting.voters.length,
            canVote: viewer ? meeting.voters.includes(viewer.id) : false,
          }
        : null,
      actions: actionHints(state, viewer),
    };
  }

  /* ── the room ─────────────────────────────────────────────────────────── */

  const SNAPSHOT_MS = 100;
  const MIRROR_MS = 1200;
  // Event types a client may see. A kill names the killer, so it stays on the
  // host; the body itself arrives with the next snapshot.
  const PUBLIC_EVENTS = new Set(['start', 'meeting', 'eject', 'win', 'vote', 'task', 'join', 'lobby']);

  // Rehydrate a checkpoint on a new host. The old host's seat is dropped through
  // the normal removal path (so parity, the task bar and a short-handed lobby all
  // behave), then the new host's own seat is re-keyed from its client id to the
  // host seat and anything that referenced it is re-pointed.
  function adoptState(source, { newHostId = null, hostId = 'host' } = {}) {
    let state;
    try {
      state = JSON.parse(JSON.stringify(source || null));
    } catch {
      state = null;
    }
    if (!state || !Array.isArray(state.players)) {
      state = createGame({ code: 'PUBLIC' });
      addPlayer(state, { id: hostId, name: 'Host', host: true });
      return state;
    }
    state.events = [];
    state.settings = Object.assign({}, DEFAULTS, state.settings || {});
    if (!Array.isArray(state.bodies)) state.bodies = [];

    const oldHost = newHostId
      ? state.players.find(player => player.host && player.id !== newHostId)
      : null;
    if (oldHost) removePlayer(state, oldHost.id);

    let me = newHostId ? state.players.find(player => player.id === newHostId) : null;
    if (!me) {
      addPlayer(state, { id: hostId, name: 'Host', host: true });
      me = getPlayer(state, hostId);
    } else if (me.id !== hostId) {
      const previous = me.id;
      me.id = hostId;
      state.bodies = state.bodies.map(body => (body.of === previous ? Object.assign({}, body, { of: hostId }) : body));
      if (state.over && Array.isArray(state.over.roles)) {
        state.over.roles = state.over.roles.map(role => (role.id === previous ? Object.assign({}, role, { id: hostId }) : role));
      }
      if (state.meeting) {
        state.meeting.voters = state.meeting.voters.map(id => (id === previous ? hostId : id));
        if (state.meeting.votes[previous] !== undefined) {
          state.meeting.votes[hostId] = state.meeting.votes[previous];
          delete state.meeting.votes[previous];
        }
      }
    }
    for (const player of state.players) {
      player.host = player.id === hostId;
      player.seen = state.time;
    }
    return state;
  }

  function createHostRoom({ code = 'PUBLIC', name = 'Host', publicRoom = false, resume = null, rng = Math.random } = {}) {
    const hostId = 'host';
    const state = resume && resume.state
      ? adoptState(resume.state, { newHostId: resume.playerId, hostId })
      : createGame({ code, settings: { auto: publicRoom } });
    state.code = code;
    state.settings.auto = Boolean(publicRoom) || Boolean(state.settings.auto);
    if (!getPlayer(state, hostId)) addPlayer(state, { id: hostId, name, host: true });

    // Seats are keyed by a player id the client keeps for the whole session; a
    // connection id only lives as long as one data channel. That is what lets a
    // reconnecting player (or a promoted host) keep its role, tasks and body.
    const links = new Map(); // playerId -> send
    const connections = new Map(); // connectionId -> playerId
    const owners = new Map(); // playerId -> connectionId
    const listeners = { snapshot: [], event: [] };
    let sinceSnapshot = SNAPSHOT_MS;
    let sinceMirror = MIRROR_MS;

    function on(kind, handler) {
      listeners[kind].push(handler);
      return () => {
        listeners[kind] = listeners[kind].filter(candidate => candidate !== handler);
      };
    }

    function fire(kind, payload) {
      for (const handler of listeners[kind]) handler(payload);
    }

    // The ring is the seating order after the host, so "next in line" rotates as
    // people come and go instead of always landing on the same player.
    function ring() {
      const ids = state.players.map(player => player.id);
      const at = ids.indexOf(hostId);
      if (at < 0) return ids;
      return ids.slice(at + 1).concat(ids.slice(0, at));
    }

    function successor() {
      return ring()[0] || null;
    }

    function rankOf(id) {
      if (id === hostId) return 0;
      return ring().indexOf(id) + 1;
    }

    function stamp(snapshot, id, next = successor()) {
      snapshot.net = {
        publicRoom: Boolean(publicRoom),
        rank: rankOf(id),
        next: next === id,
        players: state.players.length,
      };
      return snapshot;
    }

    function checkpoint() {
      return JSON.parse(JSON.stringify(state));
    }

    // What a snapshot can differ in from one tick to the next. If none of it
    // moved, the host would be building and serialising N payloads to say
    // nothing, which is exactly the work that makes hosting feel heavy.
    let lastKey = '';
    function signature() {
      const players = state.players.map(player =>
        [player.id, Math.round(player.x), Math.round(player.y), player.alive ? 1 : 0,
          player.teammate ? 1 : 0, player.ready ? 1 : 0, player.revealed ? 1 : 0,
          Math.ceil(player.cooldown || 0), Math.ceil(player.ventCooldown || 0),
          player.tasksDone.length].join(',')).join(';');
      const votes = state.meeting && state.meeting.votes ? Object.keys(state.meeting.votes).length : 0;
      return [state.phase, players, state.bodies.length, votes,
        Math.ceil(((state.meeting && state.meeting.msLeft) || 0) / 1000),
        Math.ceil(((state.over && state.over.msLeft) || 0) / 1000)].join('|');
    }

    function publish(force = false) {
      if (!force && sinceSnapshot < SNAPSHOT_MS) return;
      sinceSnapshot = 0;
      if (!force) {
        const key = signature();
        if (key === lastKey) return;
        lastKey = key;
      }
      const next = successor();
      fire('snapshot', stamp(snapshotFor(state, hostId), hostId, next));
      for (const [id, send] of links) send({ t: 'snap', s: stamp(snapshotFor(state, id), id, next) });
    }

    function sendMirror(force = false) {
      if (!force && sinceMirror < MIRROR_MS) return;
      const next = successor();
      if (!next) return;
      const send = links.get(next);
      if (!send) return;
      sinceMirror = 0;
      send({ t: 'mirror', state: checkpoint() });
    }

    function flushEvents() {
      for (const event of drainEvents(state)) {
        fire('event', event);
        if (!PUBLIC_EVENTS.has(event.t)) continue;
        for (const send of links.values()) send({ t: 'event', e: event });
      }
    }

    function pruneAbsent() {
      let removed = false;
      for (const player of state.players.slice()) {
        if (player.id === hostId) continue;
        if (links.has(player.id)) {
          player.seen = state.time;
          continue;
        }
        if (state.time - (player.seen || 0) > ABSENT_MS) {
          removePlayer(state, player.id);
          removed = true;
        }
      }
      return removed;
    }

    function admit(connectionId, playerName, send, playerId = connectionId) {
      const seatId = String(playerId || connectionId);
      if (seatId === hostId) return { error: 'already-joined' };
      const existing = getPlayer(state, seatId);
      if (!existing && state.players.length >= MAX_PLAYERS) return { error: 'room-full' };
      const player = existing || addPlayer(state, { id: seatId, name: playerName, rng });
      if (!player) return { error: 'room-full' };
      connections.set(connectionId, seatId);
      owners.set(seatId, connectionId);
      links.set(seatId, send);
      send({ t: 'welcome', protocol: 'bored-imposter/2', s: stamp(snapshotFor(state, seatId), seatId) });
      if (state.settings.auto) maybeAutoStart(state, rng);
      flushEvents();
      publish(true);
      sendMirror(true);
      return { snapshot: snapshotFor(state, seatId), playerId: seatId };
    }

    function seatOf(connectionId) {
      return connections.get(connectionId) || null;
    }

    function receive(id, message) {
      if (!getPlayer(state, id)) return { ok: false, error: 'unknown-player' };
      const result = apply(state, id, message);
      if (!result.ok) {
        const send = links.get(id);
        if (send) send({ t: 'error', error: result.error });
      }
      flushEvents();
      if (result.ok && message.t !== 'walk' && message.t !== 'goto' && message.t !== 'stop') publish(true);
      return result;
    }

    function detach(connectionId) {
      const seatId = connections.get(connectionId) || connectionId;
      connections.delete(connectionId);
      // A newer channel may already own this seat (a reconnect that raced the
      // old channel's close); only the current owner may free it.
      if (owners.get(seatId) !== connectionId) return;
      owners.delete(seatId);
      links.delete(seatId);
      if (getPlayer(state, seatId)) removePlayer(state, seatId);
      flushEvents();
      publish(true);
      sendMirror(true);
    }

    return {
      code: state.code,
      state,
      publicRoom,
      hostId,
      on,
      admit,
      seatOf,
      detach,
      receive,
      snapshot: () => stamp(snapshotFor(state, hostId), hostId),
      checkpoint,
      successor,
      rankOf,
      // `step` clamps one call to 250 ms, so a throttled tab that comes back
      // after a second of sleep still advances a full second of game time.
      tick(dtMs) {
        let remaining = Math.max(0, dtMs);
        while (remaining > 0) {
          const slice = Math.min(remaining, 250);
          step(state, slice, rng);
          remaining -= slice;
        }
        if (state.settings.auto) maybeAutoStart(state, rng);
        sinceSnapshot += dtMs;
        sinceMirror += dtMs;
        if (pruneAbsent()) flushEvents();
        flushEvents();
        publish();
        sendMirror();
      },
      close() {
        for (const send of links.values()) send({ t: 'bye' });
        links.clear();
      },
    };
  }

  return {
    WORLD, ROOMS, SPAWN, BUTTON, STATIONS, VENTS, COLORS, setWalkMask,
    SPEED, KILL_RANGE, TASK_RANGE, REPORT_RANGE, BUTTON_RANGE, VENT_RANGE, VENT_COOLDOWN,
    MEETING_MS, RESET_MS, ABSENT_MS, MIN_PLAYERS, MAX_PLAYERS, PLAYER_RADIUS, DEFAULTS, SNAPSHOT_MS,
    stationById, ventById, pairedVent, pointInFloor, canStand, nearestFloorPoint,
    createGame, addPlayer, removePlayer, getPlayer, setReady, configure, start, beginRound,
    maybeAutoStart, backToLobby, endMeeting, checkWin, apply, step, snapshotFor, drainEvents,
    adoptState, createHostRoom,
  };
})();
</script>

<script id="imposter-net">
/* PeerJS transport. The public room lives at one fixed peer id; a private room
   lives at an id derived from its four-letter code. Both share one election: the
   host keeps the next player in the ring checkpointed, that player claims the id
   when the host goes quiet, and everyone else keeps knocking until a host
   answers. Nobody needs the same person to stay online. */
window.ImposterNet = (function () {
  'use strict';

  const C = window.ImposterCore;
  const PREFIX = 'bored-imposter-v2-';
  const PUBLIC_ID = PREFIX + 'public';
  const PROTOCOL = 'bored-imposter/2';
  const HOST_TIMEOUT = 3000;
  const ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

  const roomIdFor = code => PREFIX + String(code || '').toUpperCase();

  function makeCode(rng = Math.random) {
    let code = '';
    for (let index = 0; index < 4; index += 1) {
      code += ALPHABET[Math.floor(rng() * ALPHABET.length)];
    }
    return code;
  }

  function createSession({ mode = 'public', code = '', intent = 'join', name = 'Crewmate', onSnapshot, onEvent, onStatus }) {
    if (typeof Peer === 'undefined') {
      return {
        unavailable: true,
        send() {},
        close() {},
        hosting: false,
        roomId: mode === 'public' ? PUBLIC_ID : roomIdFor(code),
      };
    }

    const roomId = mode === 'public' ? PUBLIC_ID : roomIdFor(code);
    // The seat outlives the data channel: a reconnect (or a promotion to host)
    // reintroduces itself with this id so its role and tasks come back.
    const clientId = globalThis.crypto && crypto.randomUUID
      ? crypto.randomUUID()
      : 'p-' + Math.random().toString(36).slice(2, 12);

    let peer = null;
    let host = null;
    let conn = null;
    let mirror = null;
    let rank = 0;
    let lastSnap = 0;
    let closed = false;
    let recovery = null;
    let ticker = 0;
    let watchdog = 0;
    let kick = null;

    const status = payload => {
      if (!closed) onStatus(payload);
    };

    function teardown() {
      kick = null;
      if (ticker) clearInterval(ticker);
      ticker = 0;
      if (watchdog) clearInterval(watchdog);
      watchdog = 0;
      if (host) {
        try {
          host.close();
        } catch {}
      }
      host = null;
      if (conn) {
        try {
          conn.close();
        } catch {}
      }
      conn = null;
      if (peer) {
        try {
          peer.destroy();
        } catch {}
      }
      peer = null;
    }

    function send(message) {
      if (host) {
        host.receive(host.hostId, message);
        return;
      }
      if (conn && conn.open) {
        try {
          conn.send({ t: 'input', m: message });
        } catch {}
      }
    }

    /* ── recovery: who holds the chair, and who keeps knocking ─────────── */

    function fail(kind) {
      if (closed) return;
      if (!recovery) {
        if (kind === 'busy') status({ state: 'taken' });
        else status({ state: 'error', message: 'The room service is unreachable.' });
        return;
      }
      setTimeout(recover, kind === 'busy' ? 900 : 2200);
    }

    function recover() {
      if (closed || host || !recovery) return;
      recovery.tries += 1;
      if (recovery.tries > 90) {
        recovery = null;
        status({ state: 'error', message: 'The room did not come back.' });
        return;
      }
      const waited = Date.now() - recovery.since;
      teardown();
      // Alternate claim and knock: a failed claim usually means somebody else
      // won the chair, and a knock finds them within a second.
      if (waited >= recovery.claimAt && recovery.last !== 'host') {
        recovery.last = 'host';
        beginHost(mirror);
      } else {
        recovery.last = 'client';
        beginClient();
      }
    }

    function startRecovery(kind) {
      if (closed || host || recovery) return;
      const myRank = Math.max(1, rank || 2);
      recovery = {
        kind,
        since: Date.now(),
        // The player with the checkpoint gets the first several seconds alone;
        // the rest of the ring only takes the chair if it never turns up.
        claimAt: kind === 'start' ? 1200 : myRank === 1 ? 0 : myRank === 2 ? 12000 : 12000 + (myRank - 2) * 4000,
        tries: 0,
      };
      if (kind === 'lost') status({ state: 'lost' });
      setTimeout(recover, 0);
    }

    function onHostGone() {
      if (closed || host || recovery) return;
      startRecovery('lost');
    }

    function startWatchdog() {
      if (watchdog) return;
      watchdog = setInterval(() => {
        if (closed || host || !conn) return;
        if (!recovery && Date.now() - lastSnap > HOST_TIMEOUT) onHostGone();
      }, 500);
    }

    /* ── host ─────────────────────────────────────────────────────────── */

    function wireHostConnection(connection) {
      connection.on('open', () => {
        const id = connection.peer;
        const sendTo = message => {
          if (!connection.open) return;
          try {
            connection.send(message);
          } catch {}
        };
        connection.on('data', data => {
          if (!host || !data || typeof data !== 'object') return;
          if (data.t === 'hello') {
            const result = host.admit(id, data.name, sendTo, data.playerId);
            if (result.error) {
              sendTo({ t: 'reject', error: result.error });
              setTimeout(() => {
                try {
                  connection.close();
                } catch {}
              }, 80);
            }
          } else if (data.t === 'input') {
            const seat = host.seatOf(id);
            if (seat) host.receive(seat, data.m);
          }
        });
        connection.on('close', () => {
          if (host) host.detach(id);
        });
        connection.on('error', () => {
          if (host) host.detach(id);
        });
      });
    }

    function beginHost(resume) {
      const p = new Peer(roomId, { debug: 0 });
      peer = p;
      p.on('open', () => {
        if (closed || peer !== p) return;
        host = C.createHostRoom({
          code: mode === 'public' ? 'PUBLIC' : code,
          publicRoom: mode === 'public',
          name,
          resume: resume ? { state: resume, playerId: clientId } : null,
        });
        host.on('snapshot', snapshot => {
          lastSnap = Date.now();
          onSnapshot(snapshot);
        });
        host.on('event', event => onEvent(event));
        // A hidden tab throttles timers to about 1 Hz, so the loop advances by
        // the wall clock instead of assuming 50 ms. A badly delayed host (a
        // laptop asleep) is capped so one tick cannot replay an hour.
        let lastTick = performance.now();
        const loop = () => {
          const now = performance.now();
          const elapsed = Math.min(10_000, Math.max(0, now - lastTick));
          lastTick = now;
          if (host) host.tick(elapsed);
        };
        ticker = setInterval(loop, 50);
        kick = () => {
          lastTick = performance.now() - 120;
          loop();
        };
        mirror = null;
        rank = 0;
        recovery = null;
        status({ state: 'hosting', promoted: Boolean(resume) });
      });
      p.on('connection', connection => wireHostConnection(connection));
      p.on('disconnected', () => {
        try {
          p.reconnect();
        } catch {}
      });
      p.on('error', error => {
        if (closed || peer !== p) return;
        const type = error && error.type;
        if (type === 'unavailable-id' || type === 'network' || type === 'server-error' || type === 'socket-error' || type === 'socket-closed') {
          try {
            p.destroy();
          } catch {}
          if (peer === p) peer = null;
          fail(type === 'unavailable-id' ? 'busy' : 'network');
          return;
        }
        status({ state: 'error', code: type, message: (error && error.message) || 'Connection error.' });
      });
    }

    /* ── client ───────────────────────────────────────────────────────── */

    function handleData(data) {
      if (!data || typeof data !== 'object') return;
      lastSnap = Date.now();
      if (data.t === 'welcome' || data.t === 'snap') {
        if (data.s && data.s.net) rank = data.s.net.rank || 0;
        onSnapshot(data.s);
      } else if (data.t === 'mirror') {
        mirror = data.state;
      } else if (data.t === 'event') {
        onEvent(data.e);
      } else if (data.t === 'error') {
        onEvent({ t: 'rejected', error: data.error });
      } else if (data.t === 'reject') {
        status({ state: 'rejected', error: data.error });
      } else if (data.t === 'bye') {
        // The host left on purpose: this is the hand-off, not the end.
        onHostGone();
      }
    }

    function beginClient() {
      const p = new Peer({ debug: 0 });
      peer = p;
      p.on('open', () => {
        if (closed || peer !== p) return;
        const connection = p.connect(roomId, { reliable: true });
        conn = connection;
        connection.on('open', () => {
          if (closed || peer !== p) return;
          lastSnap = Date.now();
          recovery = null;
          rank = 0;
          try {
            connection.send({ t: 'hello', protocol: PROTOCOL, name, playerId: clientId });
          } catch {}
          startWatchdog();
          status({ state: 'joined' });
        });
        connection.on('data', handleData);
        connection.on('close', () => {
          if (peer === p && !host) onHostGone();
        });
        connection.on('error', () => {
          if (peer === p && !host) onHostGone();
        });
      });
      p.on('disconnected', () => {
        try {
          p.reconnect();
        } catch {}
      });
      p.on('error', error => {
        if (closed || peer !== p) return;
        const type = error && error.type;
        if (type === 'peer-unavailable') {
          try {
            p.destroy();
          } catch {}
          if (peer === p) peer = null;
          if (mode === 'public' && !recovery) {
            startRecovery('start');
            return;
          }
          if (recovery) {
            setTimeout(recover, 1200);
            return;
          }
          status({ state: 'missing' });
          return;
        }
        if (type === 'network' || type === 'server-error' || type === 'socket-error' || type === 'socket-closed') {
          if (recovery) {
            setTimeout(recover, 2500);
            return;
          }
          status({ state: 'error', message: 'The room service is unreachable.' });
          return;
        }
        status({ state: 'error', code: type, message: (error && error.message) || 'Connection error.' });
      });
    }

    /* ── start ────────────────────────────────────────────────────────── */

    // Coming back to a hidden host tab should not wait for the throttled timer.
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && kick && !closed) kick();
    });

    if (mode === 'public') startRecovery('start');
    else if (intent === 'host') beginHost(null);
    else beginClient();

    return {
      roomId,
      send,
      get hosting() {
        return Boolean(host);
      },
      get publicRoom() {
        return mode === 'public';
      },
      close() {
        closed = true;
        recovery = null;
        teardown();
      },
    };
  }

  return { createSession, makeCode, roomIdFor, PUBLIC_ID, PROTOCOL };
})();
</script>

<script>
/* screens, input and drawing: renders snapshots, sends inputs, decides nothing */
(function () {
  'use strict';

  const C = window.ImposterCore;
  const N = window.ImposterNet;
  const $ = id => document.getElementById(id);
  const screens = { menu: $('screen-menu'), game: $('screen-game') };
  const ERRORS = {
    'not-in-lobby': 'That only works in the lobby.',
    'host-only': 'That did not go through. Try again in a moment.',
    'already-started': 'The round already started.',
    'need-3-players': 'Three players minimum.',
    'not-playing': 'The round is paused.',
    dead: 'You are a ghost.',
    'not-crew': 'Impostors cannot do tasks.',
    'not-your-task': 'That is not one of your tasks.',
    'already-done': 'Already done.',
    'too-far': 'Get closer.',
    'not-impostor': 'Only the impostor can do that.',
    'cooling-down': 'Still cooling down.',
    'venting-cooldown': 'The vent is still closing.',
    'no-vent': 'No vent here.',
    'no-target': 'Nobody there.',
    teammate: 'That is your teammate.',
    'no-body': 'No body here.',
    'already-used': 'You already called a meeting.',
    'dead-cannot-vote': 'Ghosts do not vote.',
    'already-voted': 'You already voted.',
    'no-meeting': 'No meeting running.',
    'room-full': 'The room is full (10).',
    'already-joined': 'You are already in this room.',
    'unknown-player': 'The host lost your seat.',
  };

  let session = null;
  let snap = null;
  let selfId = 'host';
  let shown = 'menu';
  let toastUntil = 0;
  let palette = null;

  const keys = new Set();
  let sentDir = { x: 0, y: 0 };
  let lastGoto = 0;
  const listKeys = new Map();

  function show(name) {
    shown = name;
    for (const [id, element] of Object.entries(screens)) element.hidden = id !== name;
    $('leave').hidden = name === 'menu';
  }

  function menuStatus(text, bad) {
    const element = $('menu-status');
    element.textContent = text || '';
    element.classList.toggle('bad', Boolean(bad));
    element.hidden = !text;
  }

  function toast(text) {
    const element = $('toast');
    element.textContent = text;
    element.hidden = false;
    toastUntil = performance.now() + 3600;
  }

  function tickToast() {
    if (!toastUntil) return;
    if (performance.now() > toastUntil) {
      $('toast').hidden = true;
      toastUntil = 0;
    }
  }

  function readName() {
    const raw = $('name').value.trim();
    const name = (raw || 'Crewmate').slice(0, 12);
    try {
      localStorage.setItem('bored.imposter.name', name);
    } catch {}
    return name;
  }

  function setList(element, key, build) {
    if (listKeys.get(element.id) === key) return;
    listKeys.set(element.id, key);
    element.replaceChildren();
    build(element);
  }

  function colorHex(id) {
    return (C.COLORS.find(color => color.id === id) || C.COLORS[0]).hex;
  }

  function playerRow(player, suffix) {
    const row = document.createElement('li');
    row.className = 'row-item';
    const dot = document.createElement('span');
    dot.className = 'dot';
    dot.style.background = colorHex(player.color);
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = player.name;
    row.append(dot, name);
    if (suffix) {
      const tail = document.createElement('span');
      tail.className = 'tail';
      tail.textContent = suffix;
      row.append(tail);
    }
    return row;
  }

  /* ── joining and leaving ─────────────────────────────────────────────── */

  function openSession({ mode, code, intent }) {
    if (session) return;
    if (typeof Peer === 'undefined') {
      menuStatus('PeerJS did not load. Imposter needs an internet connection.', true);
      return;
    }
    const name = readName();
    menuStatus(mode === 'public' ? 'Finding the public room…' : 'Connecting…');
    session = N.createSession({
      mode,
      code,
      intent,
      name,
      onSnapshot: setSnapshot,
      onEvent: handleEvent,
      onStatus: handleStatus,
    });
    $('lobby-code').textContent = mode === 'public' ? 'PUBLIC' : code;
    $('lobby-code').classList.toggle('public', mode === 'public');
    $('host-settings').hidden = true;
    $('start').hidden = true;
    snap = null;
    $('lobby-bar').hidden = false;
    $('hud').hidden = true;
    $('actions').hidden = true;
    show('game');
    $('roster').replaceChildren();
    listKeys.clear();
    $('lobby-note').textContent = mode === 'public' ? 'Joining the public room…' : 'Connecting…';
  }

  function leave() {
    try {
      session?.close();
    } catch {}
    session = null;
    snap = null;
    selfId = 'host';
    listKeys.clear();
    $('overlay-meeting').hidden = true;
    $('overlay-over').hidden = true;
    $('room-tag').hidden = true;
    $('lobby-bar').hidden = true;
    $('roster').replaceChildren();
    show('menu');
  }

  function handleStatus(status) {
    if (!status) return;
    switch (status.state) {
      case 'hosting':
        if (snap && snap.phase === 'lobby') $('lobby-note').textContent = '';
        menuStatus('');
        break;
      case 'joined':
        menuStatus('');
        break;
      case 'promoted':
        break;
      case 'lost':
        toast('Connection hiccup. Reconnecting…');
        break;
      case 'taken':
        toast('Somebody else took the room. Rejoining…');
        break;
      case 'missing':
        menuStatus('No room with that code.', true);
        leave();
        break;
      case 'rejected':
        menuStatus(ERRORS[status.error] || status.error || 'The host refused the join.', true);
        leave();
        break;
      case 'closed':
        toast('The room closed.');
        leave();
        break;
      case 'error':
        menuStatus(status.message || 'Connection error. Check your internet.', true);
        break;
      default:
        break;
    }
  }

  /* ── snapshots ───────────────────────────────────────────────────────── */

  function setSnapshot(next) {
    if (!next) return;
    snap = next;
    if (next.you?.id) selfId = next.you.id;
    seedView(next);
    const hosting = Boolean(next.you?.host);
    const publicRoom = Boolean(next.net?.publicRoom);
    const tag = $('room-tag');
    tag.hidden = false;
    tag.textContent = 'Room: ' + (publicRoom ? 'PUBLIC' : next.code || '----');

    if (next.phase === 'lobby') {
      show('game');
      $('lobby-bar').hidden = false;
      $('hud').hidden = true;
      $('actions').hidden = true;
      $('overlay-meeting').hidden = true;
      $('overlay-over').hidden = true;
      renderLobby(next, hosting, publicRoom);
      return;
    }

    show('game');
    $('lobby-bar').hidden = true;
    $('hud').hidden = false;
    $('actions').hidden = false;
    renderHud(next);
    $('lobby-note').textContent = '';

    if (next.phase === 'meeting') {
      $('overlay-over').hidden = true;
      $('overlay-meeting').hidden = false;
      renderMeeting(next);
    } else {
      $('overlay-meeting').hidden = true;
    }

    if (next.phase === 'over') {
      $('overlay-over').hidden = false;
      renderOver(next, hosting, publicRoom);
    } else {
      $('overlay-over').hidden = true;
    }
  }

  function renderLobby(s, hosting, publicRoom) {
    $('lobby-code').textContent = publicRoom ? 'PUBLIC' : s.code;
    $('lobby-code').classList.toggle('public', publicRoom);
    $('copy').hidden = publicRoom;

    const players = s.players;
    setList($('roster'), players.map(player => `${player.id}:${player.name}:${player.host}`).join('|'), list => {
      for (const player of players) {
        list.append(playerRow(player, player.id === selfId ? 'you' : ''));
      }
    });

    const need = Math.max(0, C.MIN_PLAYERS - players.length);
    $('lobby-note').textContent = publicRoom
      ? `${players.length} / ${C.MAX_PLAYERS} in the public room · ` +
        (need ? `${need} more to start` : 'starting…')
      : `${players.length} / ${C.MAX_PLAYERS} · ` +
        (need ? `${need} more to start` : 'ready when you are');

    $('host-settings').hidden = publicRoom;
    $('start').hidden = publicRoom;
    $('start').disabled = players.length < C.MIN_PLAYERS;
    if (!publicRoom) applySettingsToForm(s.settings);
  }

  function applySettingsToForm(settings) {
    for (const [id, value] of [
      ['set-impostors', settings.impostors],
      ['set-cooldown', settings.killCooldownSec],
      ['set-tasks', settings.tasksPerPlayer],
    ]) {
      const field = $(id);
      if (field && document.activeElement !== field) field.value = String(value);
    }
  }

  function renderHud(s) {
    const you = s.you;
    if (!you) {
      $('hud').textContent = '';
      return;
    }
    const parts = [];
    if (!you.alive) parts.push('ghost');
    parts.push(you.role === 'impostor' ? 'impostor' : 'crewmate');
    if (you.role === 'crew') parts.push(`${you.done}/${you.total} tasks`);
    if (you.role === 'impostor' && you.alive) {
      parts.push(you.cooldown > 0 ? `kill ${you.cooldown}s` : 'kill ready');
    }
    $('hud').textContent = parts.join(' · ');

    const use = $('act-use');
    use.hidden = !s.actions.use;
    if (s.actions.use) {
      const station = C.STATIONS.find(candidate => candidate.id === s.actions.use);
      use.textContent = station ? station.label : 'Use';
    }
    $('act-kill').hidden = !s.actions.kill;
    $('act-vent').hidden = !s.actions.vent;
    $('act-report').hidden = !s.actions.report;
    $('act-button').hidden = !s.actions.button;
  }

  function renderMeeting(s) {
    const meeting = s.meeting;
    if (!meeting) return;
    const reason = meeting.reason === 'body' ? 'A body was reported' : 'Emergency meeting';
    $('meeting-reason').textContent = reason;
    const alive = s.players.filter(player => player.alive);
    const you = s.you;
    const voted = meeting.voted.includes(selfId);
    const canVote = meeting.canVote !== false;
    $('meeting-note').textContent = !canVote
      ? 'You joined mid-meeting, so you vote in the next one.'
      : voted
        ? 'Vote locked. Waiting for the rest.'
        : `${alive.length} alive · ${meeting.voted.length}/${meeting.total} voted`;
    $('meeting-timer').textContent = `${Math.max(0, Math.ceil(meeting.msLeft / 1000))}s`;

    const key = `${reason}|${alive.map(player => player.id).join(',')}|${meeting.voted.join(',')}|${you?.alive}|${canVote}`;
    setList($('votes'), key, list => {
      if (!you?.alive || !canVote) {
        const note = document.createElement('li');
        note.textContent = you?.alive ? 'Waiting for the next meeting.' : 'Ghosts watch. They do not vote.';
        list.append(note);
        return;
      }
      for (const player of alive) {
        if (player.id === selfId) continue;
        const row = playerRow(player, meeting.voted.includes(player.id) ? 'voted' : '');
        const button = document.createElement('button');
        button.className = 'vote';
        button.type = 'button';
        button.textContent = 'Vote';
        button.disabled = voted;
        button.addEventListener('click', () => send({ t: 'vote', target: player.id }));
        row.append(button);
        list.append(row);
      }
    });
    $('skip').disabled = voted || !canVote;
  }

  function renderOver(s, hosting, publicRoom) {
    $('over-eyebrow').textContent = s.winner === 'crew' ? 'Crewmates win' : 'Impostors win';
    $('over-title').textContent = s.winner === 'crew' ? 'All impostors are gone.' : 'The impostors took the ship.';
    const roles = s.over?.roles || [];
    setList($('over-roles'), roles.map(role => `${role.id}:${role.role}:${role.alive}`).join('|'), list => {
      for (const role of roles) {
        const player = s.players.find(candidate => candidate.id === role.id) || { color: 'white', name: role.name };
        const row = playerRow(player, `${role.role}${role.alive ? '' : ' · dead'}`);
        row.classList.add(role.role === 'impostor' ? 'is-impostor' : 'is-crew');
        list.append(row);
      }
    });

    $('back-lobby').hidden = publicRoom;
    const seconds = Math.max(0, Math.ceil((s.over?.msLeft || 0) / 1000));
    $('over-note').textContent = publicRoom
      ? `The public room reshuffles in ${seconds}s. Stay in and you are dealt the next round.`
      : 'Back to lobby deals a new round with the same players.';
  }

  function handleEvent(event) {
    if (!event) return;
    switch (event.t) {
      case 'start':
        toast('Roles dealt. Find your tasks.');
        break;
      case 'meeting':
        toast(event.reason === 'body' ? 'A body was reported.' : 'Emergency meeting called.');
        break;
      case 'eject': {
        const player = snap?.players.find(candidate => candidate.id === event.id);
        if (event.id) toast(`${player?.name || 'Someone'} was ejected — ${event.role}.`);
        else toast(event.tie ? 'No one was ejected (tie).' : 'No one was ejected.');
        break;
      }
      case 'win':
        toast(event.winner === 'crew' ? 'Crewmates win.' : 'Impostors win.');
        break;
      case 'join':
        if (event.id !== selfId) toast(`${event.name} joined the round.`);
        break;
      case 'task':
        if (event.id === selfId) toast('Task complete.');
        break;
      case 'rejected':
        toast(ERRORS[event.error] || event.error);
        break;
      default:
        break;
    }
  }

  /* ── drawing ─────────────────────────────────────────────────────────── */

/* ── art ─────────────────────────────────────────────────────────────── */

  // Ship art, crewmate sprites, task marks and the emergency button come from
  // AI0702/Among-Us-clone (Unlicense repo; artwork belongs to Innersloth). The
  // mini-map is used as the collision mask, so what looks like wall is wall.
  const IMAGE_BASE = /\/games\/content\/[^/]+\.html([?#].*)?$/.test(document.baseURI)
    ? 'imposter/'
    : 'games/content/imposter/';
  const asset = name => new URL(IMAGE_BASE + name, document.baseURI).href;
  const MAP_ART = new Image();
  MAP_ART.src = asset('map.jpg');
  const BUTTON_ART = new Image();
  BUTTON_ART.src = asset('button.png');
  const CREW = new Map();
  for (const color of C.COLORS) {
    const image = new Image();
    image.src = asset('crew-' + color.id + '.png');
    CREW.set(color.id, image);
  }

  // One read of the green mask into a byte array; every collision test after
  // that is a single array lookup.
  function loadWalkMask() {
    const image = new Image();
    image.src = asset('walk.png');
    image.decode().then(() => {
      const canvas = document.createElement('canvas');
      canvas.width = image.naturalWidth;
      canvas.height = image.naturalHeight;
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(image, 0, 0);
      const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      C.setWalkMask(data, canvas.width, canvas.height);
    }).catch(() => {});
  }

  // Snapshots land ten times a second. Remote seats ease toward the newest
  // position so nobody stutters between packets; the seat you drive moves from
  // your own keys immediately and only snaps when the host disagrees badly.
  const view = new Map();
  let selfView = null;
  let lastFrame = performance.now();

  function seedView(state) {
    for (const player of state.players) {
      const entry = view.get(player.id);
      if (entry) {
        entry.tx = player.x;
        entry.ty = player.y;
      } else {
        view.set(player.id, { x: player.x, y: player.y, tx: player.x, ty: player.y, dir: 0 });
      }
    }
    for (const id of view.keys()) {
      if (!state.players.some(player => player.id === id)) view.delete(id);
    }
    const me = state.players.find(player => player.id === selfId);
    if (me && (!selfView || Math.hypot(selfView.x - me.x, selfView.y - me.y) > 22)) {
      selfView = { x: me.x, y: me.y };
    }
