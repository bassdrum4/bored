  }

  // Frames run down, left, right, up inside each colour sheet.
  function frameFor(dx, dy, fallback) {
    if (dy > 0.35) return 0;
    if (dy < -0.35) return 3;
    if (dx < -0.35) return 1;
    if (dx > 0.35) return 2;
    return fallback || 0;
  }

  function drawCrew(ctx, colorId, x, y, frame, alpha) {
    const image = CREW.get(colorId);
    if (!image || !image.complete || !image.naturalWidth) return false;
    const frameWidth = image.naturalWidth / 4;
    const height = image.naturalHeight;
    const scale = 0.55;
    const width = frameWidth * scale;
    const tall = height * scale;
    ctx.save();
    ctx.globalAlpha *= alpha;
    ctx.drawImage(image, frame * frameWidth, 0, frameWidth, height, x - width / 2, y - tall + tall * 0.08, width, tall);
    ctx.restore();
    return true;
  }

  function label(ctx, text, x, y, color) {
    ctx.font = '600 13px ui-monospace, Menlo, monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(0,0,0,.6)';
    ctx.fillText(text, x + 0.6, y + 0.6);
    ctx.fillStyle = color;
    ctx.fillText(text, x, y);
  }

  function draw() {
    requestAnimationFrame(draw);
    tickToast();
    if (!snap || screens.game.hidden) return;

    const canvas = $('board');
    const stage = canvas.parentElement;

    // The frame hugs the map: the largest box with the ship's aspect that still
    // leaves the HUD and the lobby dock their room.
    const wrap = stage.parentElement;
    const chrome = ($('hud').hidden ? 0 : $('hud').offsetHeight + 8) +
      ($('lobby-bar').hidden ? 0 : $('lobby-bar').offsetHeight + 8);
    const availW = wrap.clientWidth;
    const availH = Math.max(140, wrap.clientHeight - chrome);
    const fit = Math.min(availW / C.WORLD.w, availH / C.WORLD.h);
    const boxW = Math.max(1, Math.round(C.WORLD.w * fit));
    const boxH = Math.max(1, Math.round(C.WORLD.h * fit));
    if (stage.clientWidth !== boxW || stage.clientHeight !== boxH) {
      stage.style.width = boxW + 'px';
      stage.style.height = boxH + 'px';
    }

    const width = stage.clientWidth;
    const height = stage.clientHeight;
    if (!width || !height) return;

    const now = performance.now();
    const dt = Math.min(0.1, (now - lastFrame) / 1000);
    lastFrame = now;

    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const pixelWidth = Math.round(width * dpr);
    const pixelHeight = Math.round(height * dpr);
    if (canvas.width !== pixelWidth || canvas.height !== pixelHeight) {
      canvas.width = pixelWidth;
      canvas.height = pixelHeight;
    }

    const ctx = canvas.getContext('2d');
    const scale = Math.min(width / C.WORLD.w, height / C.WORLD.h);
    const offX = (width - C.WORLD.w * scale) / 2;
    const offY = (height - C.WORLD.h * scale) / 2;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, width, height);

    ctx.save();
    ctx.translate(offX, offY);
    ctx.scale(scale, scale);

    if (MAP_ART.complete && MAP_ART.naturalWidth) {
      ctx.drawImage(MAP_ART, 0, 0, C.WORLD.w, C.WORLD.h);
    } else {
      ctx.fillStyle = '#15171a';
      ctx.fillRect(0, 0, C.WORLD.w, C.WORLD.h);
    }

    const you = snap.you;

    // Task marks: a yellow tag on your own stations, faded once done.
    for (const station of C.STATIONS) {
      const mine = you?.tasks?.some(task => task.id === station.id);
      const done = you?.tasks?.some(task => task.id === station.id && task.done);
      if (!mine && !done) continue;
      ctx.globalAlpha = done ? 0.35 : 1;
      ctx.fillStyle = '#f2df6a';
      ctx.strokeStyle = 'rgba(0,0,0,.65)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(station.x, station.y - 7);
      ctx.lineTo(station.x + 7, station.y);
      ctx.lineTo(station.x, station.y + 7);
      ctx.lineTo(station.x - 7, station.y);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.globalAlpha = 1;
      if (!done) label(ctx, station.label, station.x, station.y - 13, '#f7efc2');
    }

    // Vents read as a grate to everyone; the impostor gets the prompt.
    for (const vent of C.VENTS) {
      const near = snap.actions.vent === vent.id;
      const impostor = you?.role === 'impostor';
      ctx.fillStyle = 'rgba(10,11,12,.85)';
      ctx.strokeStyle = impostor ? 'rgba(192,57,43,.9)' : 'rgba(20,21,24,.9)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.ellipse(vent.x, vent.y, 9, 5.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.strokeStyle = impostor ? 'rgba(224,138,128,.8)' : 'rgba(120,124,130,.5)';
      for (let i = -1; i <= 1; i += 1) {
        ctx.beginPath();
        ctx.moveTo(vent.x - 5.5, vent.y + i * 2.2);
        ctx.lineTo(vent.x + 5.5, vent.y + i * 2.2);
        ctx.stroke();
      }
      if (near) label(ctx, 'Vent', vent.x, vent.y - 13, '#e08a80');
    }

    if (BUTTON_ART.complete && BUTTON_ART.naturalWidth) {
      const size = 26;
      ctx.drawImage(BUTTON_ART, C.BUTTON.x - size / 2, C.BUTTON.y - size / 2, size, size * (BUTTON_ART.naturalHeight / BUTTON_ART.naturalWidth));
    } else {
      ctx.fillStyle = '#c0392b';
      ctx.beginPath();
      ctx.arc(C.BUTTON.x, C.BUTTON.y, 8, 0, Math.PI * 2);
      ctx.fill();
    }

    const corpse = snap.players;
    for (const body of snap.bodies) {
      const owner = corpse.find(player => player.id === body.of);
      ctx.save();
      ctx.translate(body.x, body.y);
      ctx.rotate(Math.PI / 2);
      if (!drawCrew(ctx, owner?.color || 'white', 0, 4, 0, 0.75)) {
        ctx.fillStyle = colorHex(owner?.color || 'white');
        ctx.fillRect(-6, -4, 12, 8);
      }
      ctx.restore();
    }

    // Your own seat, predicted locally from the keys so movement answers the
    // keyboard immediately instead of waiting for a round trip.
    const me = snap.players.find(player => player.id === selfId);
    if (me?.alive && selfView) {
      const dir = walkVector();
      if (dir.x || dir.y) {
        const length = Math.hypot(dir.x, dir.y) || 1;
        const step = C.SPEED * dt;
        const nx = selfView.x + (dir.x / length) * step;
        const ny = selfView.y + (dir.y / length) * step;
        if (C.canStand(nx, selfView.y)) selfView.x = nx;
        if (C.canStand(selfView.x, ny)) selfView.y = ny;
      }
    }

    for (const player of snap.players) {
      const isSelf = player.id === selfId;
      if (!player.alive && !isSelf) continue;
      const entry = view.get(player.id) || { x: player.x, y: player.y, tx: player.x, ty: player.y, dir: 0 };
      let px;
      let py;
      if (isSelf && selfView && player.alive) {
        px = selfView.x;
        py = selfView.y;
        entry.x = px;
        entry.y = py;
        entry.tx = player.x;
        entry.ty = player.y;
      } else {
        const ease = 1 - Math.exp(-dt * 18);
        entry.x += (entry.tx - entry.x) * ease;
        entry.y += (entry.ty - entry.y) * ease;
        px = entry.x;
        py = entry.y;
      }
      const dx = entry.tx - entry.x;
      const dy = entry.ty - entry.y;
      if (Math.abs(dx) > 0.05 || Math.abs(dy) > 0.05) entry.dir = frameFor(dx, dy, entry.dir);

      const moving = Math.abs(dx) + Math.abs(dy) > 0.05;
      const bob = moving ? Math.round(Math.sin(now / 110) * 1.2) : 0;
      if (!drawCrew(ctx, player.color, px, py + bob, entry.dir, player.alive ? 1 : 0.45)) {
        ctx.fillStyle = colorHex(player.color);
        ctx.beginPath();
        ctx.arc(px, py, 5, 0, Math.PI * 2);
        ctx.fill();
      }
      if (player.teammate) {
        ctx.strokeStyle = 'rgba(192,57,43,.85)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.ellipse(px, py + 2, 11, 5, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
      label(ctx, player.name, px, py + 20, isSelf ? '#f2df6a' : '#e7e5e0');
    }

    ctx.restore();
  }

  /* ── input ───────────────────────────────────────────────────────────── */

  function walkVector() {
    let x = 0;
    let y = 0;
    if (keys.has('a') || keys.has('arrowleft')) x -= 1;
    if (keys.has('d') || keys.has('arrowright')) x += 1;
    if (keys.has('w') || keys.has('arrowup')) y -= 1;
    if (keys.has('s') || keys.has('arrowdown')) y += 1;
    return { x, y };
  }

  function pushWalk() {
    const dir = walkVector();
    if (dir.x === sentDir.x && dir.y === sentDir.y) return;
    sentDir = dir;
    if (dir.x || dir.y) send({ t: 'walk', dx: dir.x, dy: dir.y });
    else send({ t: 'stop' });
  }

  function send(message) {
    if (!session) return;
    session.send(message);
  }

  function trigger(action) {
    if (!snap) return;
    if (action === 'use' && snap.actions.use) send({ t: 'task', station: snap.actions.use });
    if (action === 'kill' && snap.actions.kill) send({ t: 'kill', target: snap.actions.kill });
    if (action === 'vent' && snap.actions.vent) {
      send({ t: 'vent', vent: snap.actions.vent });
      toast('Through the vent.');
    }
    if (action === 'report' && snap.actions.report) send({ t: 'report', body: snap.actions.report });
    if (action === 'button' && snap.actions.button) send({ t: 'button' });
  }

  function pointerTarget(event) {
    const canvas = $('board');
    const rect = canvas.getBoundingClientRect();
    if (!rect.width || !rect.height) return null;
    const scale = Math.min(rect.width / C.WORLD.w, rect.height / C.WORLD.h);
    const offX = (rect.width - C.WORLD.w * scale) / 2;
    const offY = (rect.height - C.WORLD.h * scale) / 2;
    return {
      x: (event.clientX - rect.left - offX) / scale,
      y: (event.clientY - rect.top - offY) / scale,
    };
  }

  const keyActions = { e: 'use', q: 'kill', f: 'vent', r: 'report', m: 'button' };

  window.addEventListener('keydown', event => {
    if (event.target instanceof HTMLElement && event.target.matches('input, select, textarea')) return;
    const key = event.key.toLowerCase();
    if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(key)) event.preventDefault();
    if (keyActions[key]) {
      trigger(keyActions[key]);
      return;
    }
    if (['w', 'a', 's', 'd', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(key)) {
      keys.add(key);
      pushWalk();
    }
  });

  window.addEventListener('keyup', event => {
    const key = event.key.toLowerCase();
    if (keys.delete(key)) pushWalk();
  });

  window.addEventListener('blur', () => {
    keys.clear();
    pushWalk();
  });

  $('board').addEventListener('pointerdown', event => {
    const target = pointerTarget(event);
    if (!target) return;
    lastGoto = performance.now();
    send({ t: 'goto', x: target.x, y: target.y });
  });

  $('board').addEventListener('pointermove', event => {
    if (!event.buttons) return;
    if (performance.now() - lastGoto < 90) return;
    const target = pointerTarget(event);
    if (!target) return;
    lastGoto = performance.now();
    send({ t: 'goto', x: target.x, y: target.y });
  });

  $('public-join').addEventListener('click', () => openSession({ mode: 'public', code: '', intent: 'join' }));
  $('create').addEventListener('click', () => {
    const code = N.makeCode();
    openSession({ mode: 'private', code, intent: 'host' });
  });
  $('join').addEventListener('click', () => {
    const code = ($('code').value || '').trim().toUpperCase();
    if (code.length !== 4) {
      menuStatus('Room codes are four characters.', true);
      return;
    }
    openSession({ mode: 'private', code, intent: 'join' });
  });
  $('leave').addEventListener('click', leave);
  $('start').addEventListener('click', () => send({ t: 'start' }));
  $('back-lobby').addEventListener('click', () => send({ t: 'lobby' }));
  $('act-use').addEventListener('click', () => trigger('use'));
  $('act-kill').addEventListener('click', () => trigger('kill'));
  $('act-vent').addEventListener('click', () => trigger('vent'));
  $('act-report').addEventListener('click', () => trigger('report'));
  $('act-button').addEventListener('click', () => trigger('button'));
  $('skip').addEventListener('click', () => send({ t: 'vote', target: 'skip' }));

  $('copy').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(session ? snap?.code || '' : '');
      toast('Code copied.');
    } catch {
      toast(`Code: ${snap?.code || ''}`);
    }
  });

  for (const id of ['set-impostors', 'set-cooldown', 'set-tasks']) {
    $(id).addEventListener('change', () => {
      send({
        t: 'settings',
        settings: {
          impostors: Number($('set-impostors').value),
          killCooldownSec: Number($('set-cooldown').value),
          tasksPerPlayer: Number($('set-tasks').value),
        },
      });
    });
  }

  window.addEventListener('beforeunload', () => {
    try {
      session?.close();
    } catch {}
  });

  try {
    $('name').value = localStorage.getItem('bored.imposter.name') || '';
  } catch {}

  // The snapshot a player already holds, read-only, for the browser suites.
  window.__imposterTest = () => (snap
    ? { phase: snap.phase, code: snap.code, net: snap.net, you: snap.you, players: snap.players, bodies: snap.bodies, meeting: snap.meeting }
    : null);

  loadWalkMask();
  show('menu');
  menuStatus('');
  if (typeof Peer === 'undefined') {
    menuStatus('PeerJS did not load. Imposter needs an internet connection.', true);
  }
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
