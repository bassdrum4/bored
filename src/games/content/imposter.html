<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Among Us</title>
<!--
  Among Us — a peer-to-peer social deduction round on the Skeld.

  The ship, its walls and the first mission screens are ported from
  AI0702/Among-Us-clone's Python (game.py, sprites.py, settings.py, tasks.py,
  map.tmx): 5792x3168 ship, 400 px/s walk, the tmx wall rectangles as
  collision. On top of that the round now follows the real game: the sixteen
  Skeld tasks dealt per player, crew and impostor vision with lights cutting
  it, quick chat in meetings, discussion before voting, reactor/O2/comms/
  lights/doors sabotages with two-hand fixes, kills tuned by cooldown and
  reach, vitals, the Admin table, security cameras, and ghosts that keep doing
  their tasks. The art is that repo's ripped set (artwork is Innersloth's).

  Network: signaling is Supabase Broadcast on the Realtime channel
  "imposter-<CODE>" (see src/hub/realtime.js for the same protocol); the round
  itself is a WebRTC data channel between the browsers, so the 10 Hz snapshots
  never touch a database. There is no broker and no id registry: a room is a
  topic, and it exists while anybody is in it.
  The room host owns the rules and sends each player a snapshot with roles
  stripped. The host chair is not fixed: every snapshot names the next player in
  the ring, that player keeps a checkpoint, and if the host disappears it claims
  the room in the same topic and carries on. The public room lives at a fixed
  topic, so the same election keeps it open when the current host closes the tab.
-->
<style>
:root{
  --bg:#0d0e10; --panel:#141518; --panel-2:#191b1f; --line:#2a2c31;
  --ink:#e7e5e0; --dim:#8b8e94; --accent:#c0392b; --accent-ink:#fff;
  --font-body:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font-body);overflow:hidden}
#shell{height:100%;max-width:1280px;margin:0 auto;padding:8px 10px 10px;display:flex;flex-direction:column;gap:8px}
header.top{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.wordmark{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
.room-tag{margin-left:auto;font:11px var(--mono);letter-spacing:.08em;color:var(--dim);
  border:1px solid var(--line);border-radius:3px;padding:4px 8px}
#screens{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.screen{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px;overflow:auto}

/* menu */
.menu{width:min(400px,100%);display:flex;flex-direction:column;gap:10px;text-align:left}
.logo{font-size:30px;line-height:1;letter-spacing:.24em;text-transform:uppercase;font-weight:700}
.logo span{color:var(--ink)}
.logo span:last-child{color:var(--accent)}
.tagline{color:var(--dim);font-size:12.5px;margin-bottom:6px}
.field{display:flex;flex-direction:column;gap:5px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
input,select{width:100%;padding:10px 12px;border-radius:3px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);font:14px var(--font-body);outline:none}
input:focus-visible,select:focus-visible{border-color:#4c5057}
select{padding:8px 10px;font-size:13px}
.btn{font:600 12px/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;
  color:var(--ink);background:var(--panel-2);border:1px solid var(--line);border-radius:4px;
  padding:12px 14px;white-space:nowrap;transition:background .12s ease,border-color .12s ease}
.btn:hover:not(:disabled){background:#202329;border-color:#3a3d44}
.btn:focus-visible{outline:2px solid #4c5057;outline-offset:2px}
.btn:disabled{opacity:.45;cursor:default}
.btn-primary{background:var(--accent);border-color:#8f2a20;color:var(--accent-ink)}
.btn-primary:hover:not(:disabled){background:#cf4434;border-color:#8f2a20}
.btn-secondary{background:#23262c}
.btn-danger{background:transparent;border-color:#5a2a26;color:#e08a80}
.btn-danger:hover:not(:disabled){background:#2a1a18;border-color:#7a3a34}
.btn-large{padding:15px;font-size:13px}
.hint{color:var(--dim);font-size:11.5px;line-height:1.55}
.status{font-size:12px;color:var(--dim);min-height:0}
.status.bad{color:#e08a80}
.or{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:10px;letter-spacing:.2em;text-transform:uppercase;margin:2px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.join-row{display:flex;gap:8px}
.join-row input{flex:1;text-transform:uppercase;letter-spacing:.28em;font-family:var(--mono)}
.join-row .btn{flex:0 0 auto}

/* game frame */
#screen-game{align-items:stretch;justify-content:stretch;padding:0}
.game-wrap{width:100%;height:100%;min-height:0;display:flex;flex-direction:column;gap:6px}
.hud-row{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.hud{font:11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);border:1px solid var(--line);border-radius:3px;padding:6px 9px;background:var(--panel)}
.hud b{color:var(--ink);font-weight:600}
.hud-tools{margin-left:auto;display:flex;gap:6px}
.chip{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;cursor:pointer;
  color:var(--dim);background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:7px 9px}
.chip:hover{color:var(--ink);border-color:#3a3d44}
.chip.sab{color:#e08a80;border-color:#5a2a26}
.task-bar{flex:0 0 auto;height:4px;border:1px solid var(--line);border-radius:2px;background:var(--panel);overflow:hidden}
.task-bar i{display:block;height:100%;width:0;background:#f2df6a;transition:width .25s ease}
/* During a round the ship fills the window: the shell loses its margins, the
   stage goes full bleed, and the room tag and Leave float over the top right. */
#shell.playing{max-width:none;padding:0;gap:0}
#shell.playing .wordmark{display:none}
#shell.playing header.top{position:fixed;top:8px;right:10px;z-index:30;pointer-events:none}
#shell.playing header.top>*{pointer-events:auto}
#shell.playing .room-tag{margin-left:0;background:rgba(13,14,16,.82)}
#shell.playing .game-wrap{position:relative}
#shell.playing .hud-row{position:absolute;left:68px;top:8px;right:224px;z-index:8;flex-wrap:wrap;row-gap:6px}
#shell.playing .task-bar{position:absolute;left:10px;right:10px;top:46px;z-index:8}
#shell.playing .sab-note{top:56px}
#shell.playing .stage{border:0;border-radius:0}
.stage{position:relative;flex:1 1 auto;min-height:160px;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#05060a}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
.actions{position:absolute;right:10px;bottom:10px;z-index:6;display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end;max-width:70%}
.actions .btn{min-width:72px;height:40px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;
  background:rgba(16,17,19,.86);border:1px solid #3a3d44;font-size:10.5px;border-radius:4px}
.actions #act-kill{background:#8f2a20;border-color:#a83a2e}
.actions #act-button{background:#8f2a20;border-color:#a83a2e}
.actions #act-report{border-color:#6b6326;color:#e8dfa0}
.actions #act-fix{background:#6b5a1e;border-color:#8e7a2a;color:#fff}
.sab-note{position:absolute;left:10px;top:10px;z-index:5;font:600 11px/1.3 var(--mono);
  color:#ffd7cf;background:rgba(80,18,12,.85);border:1px solid #8f2a20;border-radius:3px;padding:6px 8px;max-width:60%}

/* lobby dock */
.lobby-bar{display:flex;flex-direction:column;gap:8px;padding:9px;border:1px solid var(--line);
  border-radius:4px;background:var(--panel);max-height:38vh;overflow:auto;flex:0 0 auto}
.lobby-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.code{font:600 13px var(--mono);letter-spacing:.22em;color:var(--ink)}
.code.public{color:#d8cfa8}
.lobby-top .btn-primary{margin-left:auto}
#copy{font-size:11px;padding:9px 11px}
.roster{list-style:none;display:flex;flex-direction:column;gap:0;text-align:left}
.roster li{display:flex;align-items:center;gap:8px;padding:6px 2px;border-top:1px solid var(--line);font-size:13px}
.roster li:first-child{border-top:0}
.roster .dot{width:9px;height:9px;border-radius:2px;flex:0 0 auto;background:var(--c);text-align:center;font-size:10px;line-height:9px;color:#0d0e10}
.roster .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.roster .tail{font:10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.roster .vote{border-radius:3px;padding:4px 9px;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;
  background:transparent;border:1px solid var(--line);color:var(--ink);cursor:pointer;font-family:var(--font-body)}
.roster .vote:hover:not(:disabled){background:#202329}
.roster .vote:disabled{opacity:.4;cursor:default}
.roster.chips{flex-direction:row;flex-wrap:wrap;gap:6px}
.roster.chips li{flex:0 0 auto;border:1px solid var(--line);border-radius:3px;padding:4px 8px;font-size:12px}
.roster.chips .name{flex:0 1 auto}
.row-item.is-impostor .tail{color:#e08a80}
.tasks-list .row-item{border-top:1px solid var(--line)}
.tasks-list .row-item:first-child{border-top:0}
.tasks-list .dot{font-family:var(--mono);color:#0d0e10}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.settings label{display:flex;flex-direction:column;gap:4px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}

/* overlays */
.overlay{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:14px;
  background:rgba(6,7,8,.9);overflow:auto}
.panel{width:min(440px,100%);display:flex;flex-direction:column;gap:10px;padding:16px;
  border:1px solid var(--line);border-radius:4px;background:var(--panel)}
.eyebrow{font:10px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.panel h2{font-size:19px;line-height:1.2;font-weight:600}
.meeting-title{font-size:18px;font-weight:600;text-transform:uppercase;letter-spacing:.1em}
.meeting-note{color:var(--dim);font-size:12px}
.timer{font:600 15px var(--mono);color:var(--ink)}
#toast{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:60;background:#202329;
  border:1px solid #3a3d44;color:var(--ink);padding:8px 12px;border-radius:3px;font-size:12.5px;max-width:88vw;text-align:center}

/* task windows: the Python's screens, sized to the panel */
.overlay.task{background:rgba(4,5,6,.94)}
.panel.task-panel{width:min(960px,96vw);max-height:94vh;overflow:auto;padding:12px}
.task-head{display:flex;align-items:center;gap:10px}
.task-head h2{font-size:15px;letter-spacing:.08em;text-transform:uppercase}
.task-head .btn{margin-left:auto;padding:8px 11px;font-size:10.5px}
.task-body{display:flex;flex-direction:column;gap:10px}
.task-art{position:relative;border:1px solid var(--line);border-radius:3px;overflow:hidden;background:#0a0b0d}
.task-board{display:block;width:100%;height:auto}
.lever{position:absolute;right:6%;bottom:10%;width:64px;height:64px;padding:0;border:0;background:transparent;cursor:pointer}
.lever-img{width:100%;height:100%;object-fit:contain}
.lever-img.wide{width:220px;height:auto;position:relative;right:60px}
.lever.pulled{transform:translateY(6px)}
.task-help{color:var(--dim);font-size:11.5px;text-align:center}
.wires .wire-rack{position:absolute;left:4%;top:8%;display:flex;flex-direction:column;gap:8px}
.wire-btn{padding:4px 10px;border:2px solid #2a2c31;border-radius:3px;background:rgba(0,0,0,.55);cursor:pointer;opacity:.55}
.wire-btn .wire-img{display:block;height:22px;width:150px;object-fit:contain}
.wire-btn.done{opacity:1;border-color:#4f8f4f}
.align{align-items:stretch;display:flex;flex-direction:column;gap:8px;position:relative;padding:8px}
.align .task-board{opacity:.55}
.align-row{display:flex;align-items:center;gap:10px;position:relative;z-index:2}
.align-tag{font:10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);width:70px;flex:0 0 auto}
.align-slider{flex:1;accent-color:#c0392b}
.align-slider.aligned{accent-color:#4f8f4f}
.fuel-gauge{position:absolute;right:12%;top:12%;width:34px;height:60%;border:2px solid #2a2c31;background:#0a0b0d;border-radius:2px;overflow:hidden}
.fuel-gauge i{position:absolute;left:0;right:0;bottom:0;height:0;background:#ebc334;transition:height .08s linear}
.task-art .btn{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);z-index:2}
.wifi-on{position:absolute;right:14%;top:18%;width:70px}
.task-art.nav .nav-pad{position:absolute;left:50%;top:50%;width:min(320px,60%);aspect-ratio:1;transform:translate(-50%,-50%);
  border:1px solid rgba(120,124,130,.5);border-radius:50%;touch-action:none;cursor:crosshair;background:rgba(10,11,13,.35)}
.nav-centre{position:absolute;left:50%;top:50%;width:28px;height:28px;transform:translate(-50%,-50%);opacity:.8}
.nav-target{position:absolute;width:54px;height:54px;transform:translate(-50%,-50%);cursor:grab}
.nav-target.locked{filter:drop-shadow(0 0 4px #4f8f4f)}
.asteroid-stage{border:1px solid var(--line);border-radius:3px;overflow:hidden;background:#05070c}
.asteroid-canvas{display:block;width:100%;height:auto;cursor:crosshair}
.map-canvas{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:3px;background:#0a0b0d}
[hidden]{display:none!important}
@media (max-width:640px){
  .logo{font-size:24px}
  .actions{max-width:88%;gap:5px;right:6px;bottom:6px}
  .actions .btn{min-width:58px;height:36px;font-size:9.5px;padding:0 7px}
  .panel{padding:12px}
  .panel.task-panel{padding:8px}
  .lever{width:48px;height:48px}
}

  /* ── chat, rooms, sabotage and the new task boards ─────────────────── */
  .meeting-panel { max-width: 640px; }
  .meeting-chat { margin-top: 12px; display: grid; gap: 8px; }
  .chat-log {
    display: flex; flex-direction: column; gap: 4px;
    min-height: 64px; max-height: 160px; overflow-y: auto;
    padding: 8px 10px; border-radius: 8px;
    background: rgba(10,12,15,.6); border: 1px solid rgba(255,255,255,.07);
    font-size: 14px; line-height: 1.35;
  }
  .chat-empty { color: #7f8590; font-size: 13px; margin: 0; }
  .chat-line { margin: 0; color: #dfe2e7; }
  .chat-who { color: #f2df6a; font-weight: 600; }
  .phrases { display: flex; flex-wrap: wrap; gap: 6px; }
  .phrase {
    border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.06);
    color: #e7e5e0; border-radius: 999px; padding: 5px 11px; font: inherit;
    font-size: 13px; cursor: pointer;
  }
  .phrase:hover { background: rgba(255,255,255,.12); }
  .phrase:disabled { opacity: .45; cursor: default; }
  .room-panel { max-width: 820px; }
  .admin-table { width: 100%; border-collapse: collapse; font-size: 15px; }
  .admin-table th, .admin-table td { text-align: left; padding: 5px 8px; border-bottom: 1px solid rgba(255,255,255,.07); }
  .admin-table td:last-child, .admin-table th:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  .vitals-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
  .vitals-row { display: flex; align-items: center; gap: 8px; font-size: 15px; }
  .vitals-pip { width: 10px; height: 10px; border-radius: 50%; background: #4f8f4f; box-shadow: 0 0 8px rgba(79,143,79,.8); }
  .vitals-row.dead { opacity: .45; }
  .vitals-row.dead .vitals-pip { background: #6b6f76; box-shadow: none; }
  .cam-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
  .cam-cell { position: relative; }
  .cam-canvas { width: 100%; display: block; border-radius: 8px; border: 1px solid rgba(255,255,255,.1); background: #05070c; }
  .cam-tag { position: absolute; left: 8px; top: 6px; font-size: 12px; letter-spacing: .06em; color: #d6dae1; text-shadow: 0 1px 3px #000; }

  .swipe-track {
    position: relative; width: 460px; max-width: 100%; height: 120px;
    background: #0c1015; border: 1px solid #2a2d33; border-radius: 10px; overflow: hidden;
  }
  .swipe-slot { position: absolute; right: 18px; top: 14px; bottom: 14px; width: 6px; background: #2f343b; border-radius: 3px; }
  .swipe-card {
    position: absolute; top: 18px; left: 14px; width: 130px; height: 82px;
    display: grid; place-items: center; border-radius: 8px; cursor: grab;
    background: linear-gradient(135deg, #3d6fd6, #2a4fa0); color: #fff;
    font-weight: 700; letter-spacing: .06em; touch-action: none; user-select: none;
    box-shadow: 0 6px 16px rgba(0,0,0,.35);
  }
  .swipe-card.dragging { cursor: grabbing; }
  .swipe-card span { font-size: 13px; }
  .keypad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; width: 100%; max-width: 460px; }
  .keypad button {
    aspect-ratio: 1; border-radius: 8px; border: 1px solid #2f343b;
    background: #151a21; color: #e7e5e0; font: inherit; font-size: 20px; font-weight: 700; cursor: pointer;
  }
  .keypad button.done { background: #24422e; border-color: #3f6b4c; color: #9fd6ac; }
  .leaf-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 100%; max-width: 460px; }
  .leaf {
    height: 74px; border-radius: 10px; border: 1px solid #2f343b; background: #1a2a1f;
    color: #b7d8bd; font-size: 13px; cursor: pointer;
  }
  .leaf.cleared { background: #10151a; color: #5d646e; border-color: #24282e; cursor: default; }
  .gauge-row { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 520px; }
  .gauge-row input[type=range] { flex: 1; }
  .gauge-tag { width: 92px; font-size: 13px; color: #aeb4bd; }
  .gauge-row.aligned .gauge-tag { color: #9fd6ac; }
  .hexes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 100%; max-width: 460px; }
  .hex {
    aspect-ratio: 1.1; border: 1px solid #33383f; background: #12161c; cursor: pointer;
    clip-path: polygon(25% 4%, 75% 4%, 100% 50%, 75% 96%, 25% 96%, 0 50%);
    color: #5d646e; font-size: 12px; letter-spacing: .08em;
  }
  .hex.on { background: #2c5b8f; color: #dbeaff; }
  .samples { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; width: 100%; max-width: 520px; }
  .sample {
    aspect-ratio: .8; border-radius: 10px; border: 1px solid #2f343b; background: #101820;
    color: #b9c6d4; display: grid; place-items: center; gap: 6px; font-size: 12px; cursor: pointer;
  }
  .sample .beaker { font-size: 24px; }
  .sample.odd { border-color: #b05c4f; background: #1d1416; }
  .scan-bar { width: 100%; max-width: 460px; height: 14px; border-radius: 7px; background: #151a21; overflow: hidden; }
  .scan-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #3d6fd6, #7fc2ff); }
  .steer { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; max-width: 420px; }
  .steer input[type=range] { width: 100%; }
  .steer-state { font-size: 13px; color: #aeb4bd; }

  /* The ejection is the moment the round turns on: say it plainly. */
  .eject-card{position:fixed;inset:0;z-index:55;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:8px;padding:24px;text-align:center;pointer-events:none;
    background:rgba(6,7,8,.9);animation:eject-in .18s ease-out}
  .eject-line{font-size:clamp(20px,4.2vw,34px);line-height:1.2;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
  .eject-sub{font:12px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
  .eject-sub.bad{color:#e08a80}
  @keyframes eject-in{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}
  </style>
</head>
<body>
<main id="shell">
  <header class="top">
    <span class="wordmark">Among Us</span>
    <span id="room-tag" class="room-tag" hidden></span>
    <button id="leave" class="btn btn-danger" type="button" hidden>Leave</button>
  </header>

  <div id="screens">
    <section id="screen-menu" class="screen">
      <div class="menu">
        <h1 class="logo"><span>Among</span><span>Us</span></h1>
        <p class="tagline">Light &amp; sound. Trust no one.</p>

        <label class="field">Your name
          <input id="name" maxlength="12" autocomplete="nickname" placeholder="Crewmate">
        </label>

        <button id="public-join" class="btn btn-primary btn-large" type="button">Join the public room</button>
        <p class="hint">One room, always open. It starts as soon as three are in, and late arrivals play straight away.</p>

        <div class="or">or</div>

    discussionSec: 15,
    votingSec: 20,
  };

  const COLORS = [
    { id: 'red', hex: '#c51111' },
    { id: 'blue', hex: '#2b52d8' },
    { id: 'green', hex: '#16963a' },
    { id: 'pink', hex: '#ee54bb' },
    { id: 'orange', hex: '#f07d0d' },
    { id: 'yellow', hex: '#f6f658' },
    { id: 'purple', hex: '#8b4bd8' },
    { id: 'brown', hex: '#8b5a2b' },
    { id: 'white', hex: '#e8ecf4' },
    { id: 'black', hex: '#3c4046' },
  ];

  const clamp = (value, lo, hi) => Math.min(hi, Math.max(lo, value));
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const centre = player => ({ x: player.x + PLAYER_W / 2, y: player.y + PLAYER_H / 2 });
  const round = value => Math.round(value * 10) / 10;
  const centreOf = spot => ({ x: spot.x + PLAYER_W / 2, y: spot.y + PLAYER_H / 2 });

  function overlapsWall(x, y, extra) {
    for (const wall of WALLS) {
      if (x < wall[0] + wall[2] && x + PLAYER_W > wall[0] && y < wall[1] + wall[3] && y + PLAYER_H > wall[1]) {
        return wall;
      }
    }
    if (extra) {
      for (const wall of extra) {
        if (x < wall[0] + wall[2] && x + PLAYER_W > wall[0] && y < wall[1] + wall[3] && y + PLAYER_H > wall[1]) {
          return wall;
        }
      }
    }
    return null;
  }

  function stationById(id) {
    return TASKS.find(task => task.id === id) || null;
  }

  function roomNamed(name) {
    return ROOMS.find(room => room.name === name) || null;
  }

  function roomAt(point) {
    return ROOMS.find(room => {
      const r = room.rect;
      return point.x >= r[0] && point.x <= r[0] + r[2] && point.y >= r[1] && point.y <= r[1] + r[3];
    }) || null;
  }

  // A ring of shutters on the room's perimeter. Walls already cover most of it,
  // so this seals the doorways without touching the floor inside.
  function doorRects(roomName) {
    const room = roomNamed(roomName);
    if (!room) return [];
    const [x, y, w, h] = room.rect;
    const t = DOOR_THICK;
    return [
      [x - t / 2, y - t / 2, w + t, t],
      [x - t / 2, y + h - t / 2, w + t, t],
      [x - t / 2, y - t / 2, t, h + t],
      [x + w - t / 2, y - t / 2, t, h + t],
    ];
  }

  function doorBlocks(state) {
    return state.doors ? doorRects(state.doors.room) : null;
  }

  function taskTotals(state) {
    let total = 0;
    let done = 0;
    for (const player of state.players) {
      if (player.role !== 'crew') continue;
      const list = player.tasks || [];
      total += list.length;
      done += (player.tasksDone || []).length;
    }
    return { total, done };
  }

  function visionFor(state, viewer) {
    if (!viewer || !viewer.alive) return 0;
    const mult = clamp(Number(state.settings.crewVision) || 1, 0.25, 2);
    const base = VISION_BASE * mult * (viewer.role === 'impostor' ? 1.5 : 1);
    if (state.sabotage && state.sabotage.kind === 'lights' && viewer.role !== 'impostor') {
      return Math.max(150, base * 0.32);
    }
    return base;
  }

  function sabotageDef(kind) {
    return SABOTAGE[kind] || null;
  }

  function sabotageRects(kind) {
    const def = sabotageDef(kind);
    return def ? def.fixes : [];
  }

  function nearestVent(point) {
    let best = null;
    let bestDistance = Infinity;
    for (const vent of VENTS) {
      const d = Math.hypot(vent[0] - point.x, vent[1] - point.y);
      if (d < bestDistance) {
        bestDistance = d;
        best = vent;
      }
    }
    return best && bestDistance <= VENT_RANGE ? { x: best[0], y: best[1], d: bestDistance } : null;
  }

  function shuffle(list, rng) {
    const copy = list.slice();
    for (let i = copy.length - 1; i > 0; i -= 1) {
      const j = Math.floor(rng() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  function cleanName(name) {
    const text = String(name || '').replace(/\s+/g, ' ').trim();
    return (text || 'Crewmate').slice(0, 12);
  }

  function cleanChat(text) {
    return String(text || '').replace(/[\u0000-\u001f\u007f]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 120);
  }

  function emit(state, event) {
    state.events.push(event);
  }

  function drainEvents(state) {
    const events = state.events;
    state.events = [];
    return events;
  }

  /* ── state ───────────────────────────────────────────────────────────── */

  function createGame({ code = 'TEST', settings = {} } = {}) {
    return {
      code,
      phase: 'lobby',
      settings: Object.assign({}, DEFAULTS, settings),
      players: [],
      bodies: [],
      meeting: null,
      winner: null,
      over: null,
      chat: [],
      ghostChat: [],
      sabotage: null,
      doors: null,
      sabotageCooldown: 0,
      time: 0,
      events: [],
    };
  }

  function getPlayer(state, id) {
    return state.players.find(player => player.id === id) || null;
  }

  function pickColor(state, wanted) {
    const taken = new Set(state.players.map(player => player.color));
    if (wanted && !taken.has(wanted)) return wanted;
    const free = COLORS.find(color => !taken.has(color.id));
    return free ? free.id : COLORS[state.players.length % COLORS.length].id;
  }

  function drawTasks(rng) {
    const pick = kind => TASKS.filter(task => task.kind === kind);
    return shuffle(pick('common'), rng)
      .map(task => task.id)
      .concat(shuffle(pick('long'), rng).slice(0, 3).map(task => task.id))
      .concat(shuffle(pick('short'), rng).slice(0, 4).map(task => task.id));
  }

  function spawnSeat(state, running, rng) {
    if (running) {
      const task = TASKS[Math.floor(rng() * TASKS.length)];
      return { x: task.x - PLAYER_W / 2, y: task.y - PLAYER_H / 2 };
    }
    const spot = SPAWNS[state.players.length % SPAWNS.length];
    return { x: spot[0] - PLAYER_W / 2, y: spot[1] - PLAYER_H / 2 };
  }

  function addPlayer(state, { id, name, host = false, rng = Math.random }) {
    const existing = getPlayer(state, id);
    if (existing) {
      existing.name = cleanName(name);
      return existing;
    }
    if (state.players.length >= MAX_PLAYERS) return null;

    const running = state.phase === 'play' || state.phase === 'meeting';
    const spot = spawnSeat(state, running, rng);
    const player = {
      id,
      name: cleanName(name),
      color: pickColor(state),
      host: Boolean(host),
      ready: false,
      role: 'crew',
      alive: true,
      x: spot.x,
      y: spot.y,
      dir: { x: 0, y: 0 },
      goto: null,
      gas: false,
      cooldown: 0,
      ventCooldown: 0,
      emergencyUsed: false,
      revealed: false,
      tasks: [],
      tasksDone: [],
      lastChat: -9999,
      seen: state.time,
    };
    state.players.push(player);
    if (running) emit(state, { t: 'join', id, name: player.name });
    return player;
  }

  function removePlayer(state, id) {
    const player = getPlayer(state, id);
    if (!player) return false;
    state.players = state.players.filter(other => other.id !== id);
    if (state.meeting) {
      state.meeting.voters = state.meeting.voters.filter(voter => voter !== id);
      delete state.meeting.votes[id];
    }
    if ((state.phase === 'play' || state.phase === 'meeting') && state.players.length < MIN_PLAYERS) {
      backToLobby(state);
      emit(state, { t: 'lobby', reason: 'empty' });
      return true;
    }
    if (state.phase === 'play' || state.phase === 'meeting') checkWin(state);
    if (!state.players.length) backToLobby(state);
    return true;
  }

  function setReady(state, id, ready) {
    const player = getPlayer(state, id);
    if (!player || state.phase !== 'lobby') return { ok: false, error: 'not-in-lobby' };
    player.ready = Boolean(ready);
    return { ok: true };
  }

  function configure(state, id, patch) {
    const player = getPlayer(state, id);
    if (!player) return { ok: false, error: 'unknown-player' };
    if (!player.host) return { ok: false, error: 'not-host' };
    if (state.phase !== 'lobby') return { ok: false, error: 'already-started' };
    const next = Object.assign({}, state.settings);
    // The impostor count follows the ship's size, so the field stays pinned.
    next.impostors = state.players.length >= 7 ? 2 : 1;
    if (patch.killCooldownSec !== undefined) {
      const sec = Number(patch.killCooldownSec);
      next.killCooldownSec = clamp(Math.round((Number.isFinite(sec) ? sec : DEFAULTS.killCooldownSec) * 2) / 2, 10, 60);
    }
    if (patch.killDistance !== undefined) {
      next.killDistance = KILL_DISTANCE[patch.killDistance] ? patch.killDistance : DEFAULTS.killDistance;
    }
    if (patch.speed !== undefined) {
      next.speed = clamp(Math.round((Number(patch.speed) || 1) * 4) / 4, 0.5, 3);
    }
    if (patch.crewVision !== undefined) {
      next.crewVision = clamp(Math.round((Number(patch.crewVision) || 1) * 4) / 4, 0.25, 2);
    }
    if (patch.discussionSec !== undefined) {
      next.discussionSec = clamp(Math.round(Number(patch.discussionSec) || 15), 5, 60);
    }
    if (patch.votingSec !== undefined) {
      next.votingSec = clamp(Math.round(Number(patch.votingSec) || 20), 10, 60);
    }
    state.settings = next;
    return { ok: true };
  }

  function placeRing(state) {
    const living = state.players.filter(player => player.alive);
    living.forEach((player, index) => {
      const angle = (index / Math.max(1, living.length)) * Math.PI * 2;
      let spot = {
        x: SPAWNS[0][0] + Math.cos(angle) * 90 - PLAYER_W / 2,
        y: SPAWNS[0][1] + Math.sin(angle) * 60 - PLAYER_H / 2,
      };
      if (overlapsWall(spot.x, spot.y)) spot = { x: SPAWNS[index % SPAWNS.length][0], y: SPAWNS[index % SPAWNS.length][1] };
      player.x = spot.x;
      player.y = spot.y;
      player.dir = { x: 0, y: 0 };
      player.goto = null;
    });
  }

  function beginRound(state, rng = Math.random) {
    if (state.phase !== 'lobby') return { ok: false, error: 'already-started' };
    if (state.players.length < MIN_PLAYERS) return { ok: false, error: 'need-3-players' };

    // Seven or more on the ship gets the second impostor the real game deals;
    // below that one killer keeps the round fair.
    const impostorCount = state.players.length >= 7 ? 2 : 1;
    const order = shuffle(state.players.map(player => player.id), rng);
    const impostors = new Set(order.slice(0, impostorCount));

    for (const player of state.players) {
      player.role = impostors.has(player.id) ? 'impostor' : 'crew';
      player.alive = true;
      player.ready = true;
      player.revealed = false;
      player.cooldown = state.settings.killCooldownSec;
      player.ventCooldown = 0;
      player.emergencyUsed = false;
      player.gas = false;
      player.tasks = drawTasks(rng);
      player.tasksDone = [];
      player.lastChat = -9999;
    }

    state.phase = 'play';
    state.bodies = [];
    state.meeting = null;
    state.winner = null;
    state.over = null;
    state.chat = [];
    state.ghostChat = [];
    state.sabotage = null;
    state.doors = null;
    state.sabotageCooldown = 10;
    placeRing(state);
    emit(state, { t: 'start' });
    return { ok: true };
  }

  function start(state, byId, rng = Math.random) {
    if (!getPlayer(state, byId)) return { ok: false, error: 'unknown-player' };
    return beginRound(state, rng);
  }

  function maybeAutoStart(state, rng = Math.random) {
    if (!state.settings.auto) return false;
    if (state.phase !== 'lobby') return false;
    if (state.players.length < MIN_PLAYERS) return false;
    return beginRound(state, rng).ok;
  }

  function backToLobby(state, byId = null) {
    if (byId !== null && !getPlayer(state, byId)) return { ok: false, error: 'unknown-player' };
    state.phase = 'lobby';
    state.bodies = [];
    state.meeting = null;
    state.winner = null;
    state.over = null;
    state.chat = [];
    state.ghostChat = [];
    state.sabotage = null;
    state.doors = null;
    state.sabotageCooldown = 0;
    for (const player of state.players) {
      player.alive = true;
      player.role = 'crew';
      player.ready = false;
      player.revealed = false;
      player.gas = false;
      player.cooldown = 0;
      player.ventCooldown = 0;
      player.emergencyUsed = false;
      player.tasks = [];
      player.tasksDone = [];
      player.dir = { x: 0, y: 0 };
      player.goto = null;
    }
    return { ok: true };
  }

  function startMeeting(state, { caller, reason, bodyOf = null }) {
    state.phase = 'meeting';
    state.meeting = {
      caller,
      reason,
      bodyOf,
      phase: 'discussion',
      msLeft: Math.max(5, Number(state.settings.discussionSec) || 15) * 1000,
      votes: {},
      voters: state.players.filter(player => player.alive).map(player => player.id),
      chat: [],
    };
    state.bodies = [];
    // A report clears every sabotage; the crew never loses to a timer mid-meeting.
    state.sabotage = null;
    state.doors = null;
    state.sabotageCooldown = 0;
    state.chat = [];
    for (const player of state.players) {
      player.dir = { x: 0, y: 0 };
      player.goto = null;
    }
    emit(state, { t: 'meeting', caller, reason, bodyOf });
  }

  function endMeeting(state) {
    const meeting = state.meeting;
    if (!meeting || state.phase !== 'meeting') return { ok: false, error: 'no-meeting' };

    const counts = {};
    for (const target of Object.values(meeting.votes)) {
      counts[target] = (counts[target] || 0) + 1;
    }
    const ranked = Object.entries(counts).sort((a, b) => b[1] - a[1]);
    const top = ranked.length ? ranked[0][1] : 0;
    const leaders = ranked.filter(([, count]) => count === top);
    const tie = leaders.length !== 1;
    const choice = tie ? null : leaders[0][0];
    const ejected = choice && choice !== 'skip' ? choice : null;

    let ejectedRole = null;
    if (ejected) {
      const victim = getPlayer(state, ejected);
      if (victim) {
        victim.alive = false;
        victim.revealed = true;
        victim.dir = { x: 0, y: 0 };
        victim.goto = null;
        ejectedRole = victim.role;
      }
    }

    state.meeting = null;
    state.bodies = [];
    state.chat = [];
    emit(state, { t: 'eject', id: ejected, role: ejectedRole, tie: tie || choice === 'skip' });

    if (!checkWin(state)) {
      state.phase = 'play';
      placeRing(state);
      state.sabotageCooldown = SABOTAGE_COOLDOWN;
      for (const player of state.players) {
        if (player.role === 'impostor') player.cooldown = state.settings.killCooldownSec;
      }
    }
    return { ok: true, ejected, ejectedRole, tie: tie || choice === 'skip' };
  }

  function checkWin(state) {
    if (state.phase === 'over') return state.winner;
    if (state.phase !== 'play' && state.phase !== 'meeting') return state.winner;

    const living = state.players.filter(player => player.alive);
    const impostors = living.filter(player => player.role === 'impostor');
    const crew = living.filter(player => player.role === 'crew');
    const totals = taskTotals(state);

    let winner = null;
    if (!state.players.some(player => player.role === 'impostor')) winner = 'crew';
    else if (impostors.length === 0) winner = 'crew';
    else if (crew.length === 0) winner = 'impostor';
    else if (impostors.length >= crew.length) winner = 'impostor';
    else if (totals.total > 0 && totals.done >= totals.total) winner = 'crew';

    if (winner) {
      state.phase = 'over';
      state.winner = winner;
      state.meeting = null;
      state.sabotage = null;
      state.doors = null;
      state.over = {
        winner,
        msLeft: RESET_MS,
        roles: state.players.map(player => ({ id: player.id, name: player.name, role: player.role, alive: player.alive })),
      };
      for (const player of state.players) {
        player.dir = { x: 0, y: 0 };
        player.goto = null;
      }
      emit(state, { t: 'win', winner });
    }
    return winner;
  }

  /* ── movement, straight out of sprites.py ────────────────────────────── */

  function movePlayer(player, dt, speed, extra) {
    if (player.goto) {
      const target = centreOf({ x: player.goto.x, y: player.goto.y });
      const dx = target.x - (player.x + PLAYER_W / 2);
      const dy = target.y - (player.y + PLAYER_H / 2);
      const length = Math.hypot(dx, dy);
      if (length <= 10) {
        player.goto = null;
        player.dir = { x: 0, y: 0 };
        return;
      }
      player.dir = { x: dx / length, y: dy / length };
    }
    if (!player.dir.x && !player.dir.y) return;

    let dirX = player.dir.x;
    let dirY = player.dir.y;
    const magnitude = Math.hypot(dirX, dirY);
    if (magnitude > 1) {
      dirX /= magnitude;
      dirY /= magnitude;
    }

    const ghostsWalkThroughWalls = !player.alive;
    const stepX = dirX * speed * dt;
    const stepY = dirY * speed * dt;

    if (stepX) {
      const nextX = player.x + stepX;
      const hit = ghostsWalkThroughWalls ? null : overlapsWall(nextX, player.y, extra);
      if (hit) {
        // Hold the wall, don't drop the key: the direction stays what the
        // player asked for, so sliding along a wall keeps working and the
        // client's prediction does not walk off on its own. Only step onto a
        // face that is within this step; anything further means the seat was
        // already inside that rectangle, and clamping to its far edge would
        // fling the player across the room.
        const face = stepX > 0 ? hit[0] - PLAYER_W : hit[0] + hit[2];
        const gap = stepX > 0 ? face - player.x : player.x - face;
        if (gap >= -1 && gap <= Math.abs(stepX) + 1) player.x = face;
      } else {
        player.x = nextX;
      }
    }
    if (stepY) {
      const nextY = player.y + stepY;
      const hit = ghostsWalkThroughWalls ? null : overlapsWall(player.x, nextY, extra);
      if (hit) {
        const face = stepY > 0 ? hit[1] - PLAYER_H : hit[1] + hit[3];
        const gap = stepY > 0 ? face - player.y : player.y - face;
        if (gap >= -1 && gap <= Math.abs(stepY) + 1) player.y = face;
      } else {
        player.y = nextY;
      }
    }
    player.x = clamp(player.x, 0, WORLD.w - PLAYER_W);
    player.y = clamp(player.y, 0, WORLD.h - PLAYER_H);
  }

  function step(state, dtMs, rng = Math.random, walkMs = dtMs) {
    const slice = clamp(dtMs, 0, 250);
    const dt = slice / 1000;
    const walkDt = clamp(walkMs, 0, slice) / 1000;
    state.time += slice;

    if (state.sabotageCooldown > 0) state.sabotageCooldown = Math.max(0, state.sabotageCooldown - dt);

    if (state.sabotage) {
      const def = sabotageDef(state.sabotage.kind);
      if (def && def.critical) {
        state.sabotage.msLeft -= slice;
        if (state.sabotage.msLeft <= 0) {
          state.sabotage = null;
          state.winner = 'impostor';
          state.phase = 'over';
          state.over = {
            winner: 'impostor',
            msLeft: RESET_MS,
            roles: state.players.map(player => ({ id: player.id, name: player.name, role: player.role, alive: player.alive })),
          };
          emit(state, { t: 'win', winner: 'impostor' });
        }
      }
    }

    if (state.doors) {
      state.doors.msLeft -= slice;
      if (state.doors.msLeft <= 0) {
        emit(state, { t: 'doors', room: state.doors.room, open: true });
        state.doors = null;
      }
    }

    if (state.meeting) {
      state.meeting.msLeft -= slice;
      if (state.meeting.msLeft <= 0) {
        if (state.meeting.phase === 'discussion') {
          state.meeting.phase = 'voting';
          state.meeting.msLeft = Math.max(10, Number(state.settings.votingSec) || 20) * 1000;
        } else {
          endMeeting(state);
        }
      }
    }

    if (state.phase === 'over') {
      if (state.settings.auto) {
        state.over.msLeft = Math.max(0, state.over.msLeft - slice);
        if (state.over.msLeft <= 0) {
          backToLobby(state);
          emit(state, { t: 'lobby', reason: 'next-round' });
          maybeAutoStart(state, rng);
        }
      }
      return;
    }

    if (state.phase !== 'play' && state.phase !== 'lobby') return;

    const speed = SPEED * clamp(Number(state.settings.speed) || 1, 0.5, 3);
    const extra = doorBlocks(state);
    for (const player of state.players) {
      if (state.phase === 'play') {
        if (player.cooldown > 0) player.cooldown = Math.max(0, player.cooldown - dt);
        if (player.ventCooldown > 0) player.ventCooldown = Math.max(0, player.ventCooldown - dt);
      }
      movePlayer(player, walkDt, speed, extra);
    }
  }

  /* ── rules ───────────────────────────────────────────────────────────── */

  const rejected = error => ({ ok: false, error });

  function alive(state, id) {
    const player = getPlayer(state, id);
    if (!player) return null;
    return player.alive ? player : null;
  }

  function canSabotage(state) {
    return !state.sabotage && !state.doors && state.sabotageCooldown <= 0;
  }

  function sabotage(state, id, kind) {
    const actor = getPlayer(state, id);
    if (!actor) return rejected('unknown-player');
    if (state.phase !== 'play') return rejected('not-playing');
    if (actor.role !== 'impostor') return rejected('not-impostor');
    if (state.sabotage || state.doors) return rejected('already-sabotaged');
    if (state.sabotageCooldown > 0) return rejected('sabotage-cooling');
    if (kind === 'doors') {
      const at = centre(actor);
      let room = DOOR_ROOMS[0];
      let best = Infinity;
      for (const name of DOOR_ROOMS) {
        const found = roomNamed(name);
        if (!found) continue;
        const [x, y, w, h] = found.rect;
        const d = Math.hypot(x + w / 2 - at.x, y + h / 2 - at.y);
        if (d < best) {
          best = d;
          room = name;
        }
      }
      state.doors = { by: id, room, msLeft: DOOR_MS };
      state.sabotageCooldown = SABOTAGE_COOLDOWN;
      emit(state, { t: 'doors', room });
      return { ok: true };
    }
    const def = sabotageDef(kind);
    if (!def) return rejected('unknown-sabotage');
    state.sabotage = { kind, by: id, msLeft: def.ms, held: {} };
    state.sabotageCooldown = SABOTAGE_COOLDOWN;
    emit(state, { t: 'sabotage', kind });
    return { ok: true };
  }

  function fix(state, id, pad) {
    const actor = getPlayer(state, id);
    if (!actor) return rejected('unknown-player');
    if (!actor.alive) return rejected('dead');
    if (state.phase !== 'play') return rejected('not-playing');
    if (!state.sabotage) return rejected('nothing-to-fix');
    const def = sabotageDef(state.sabotage.kind);
    if (!def) return rejected('nothing-to-fix');
    const points = def.fixes;
    const point = pad ? points.find(candidate => candidate.pad === pad) : points[0];
    if (!point) return rejected('no-pad');
    if (dist(centre(actor), point) > point.range) return rejected('too-far');
    if (!state.sabotage.held) state.sabotage.held = {};
    if (state.sabotage.held[point.pad]) return rejected('already-held');
    // The reactor's two handprints want two people standing there at once; the
    // O2 keypads stay entered, so one crewmate can run between them.
    if (def.simultaneous && Object.values(state.sabotage.held).includes(id)) return rejected('already-held');
    state.sabotage.held[point.pad] = id;
    emit(state, { t: 'hold', kind: state.sabotage.kind, pad: point.pad, id });
    const done = points.every(candidate => state.sabotage.held[candidate.pad]);
    if (!done) return { ok: true, waiting: true };
    const kind = state.sabotage.kind;
    state.sabotage = null;
    state.sabotageCooldown = SABOTAGE_COOLDOWN;
    emit(state, { t: 'fixed', kind });
    return { ok: true };
  }

  function apply(state, id, message) {
    if (!message || typeof message !== 'object') return rejected('bad-message');
    const player = getPlayer(state, id);
    if (!player) return rejected('unknown-player');

    switch (message.t) {
      case 'walk': {
        if (state.phase !== 'play' && state.phase !== 'lobby') return rejected('not-playing');
        const dx = clamp(Number(message.dx) || 0, -1, 1);
        const dy = clamp(Number(message.dy) || 0, -1, 1);
        player.goto = null;
        player.dir = { x: dx, y: dy };
        return { ok: true };
      }
      case 'goto': {
        if (state.phase !== 'play' && state.phase !== 'lobby') return rejected('not-playing');
        player.goto = {
          x: clamp(Number(message.x) || 0, 0, WORLD.w - PLAYER_W),
          y: clamp(Number(message.y) || 0, 0, WORLD.h - PLAYER_H),
        };
        player.dir = { x: 0, y: 0 };
        return { ok: true };
      }
      case 'stop': {
        player.dir = { x: 0, y: 0 };
        player.goto = null;
        return { ok: true };
      }
      case 'ready':
        return setReady(state, id, message.ready);
      case 'settings':
        return configure(state, id, message.settings || {});
      case 'start':
        if (!player.host) return rejected('not-host');
        return start(state, id);
      case 'lobby':
        if (!player.host) return rejected('not-host');
        return backToLobby(state, id);
      case 'use': {
        if (state.phase !== 'play') return rejected('not-playing');
        if (player.role !== 'crew') return rejected('not-crew');
        if (!player.tasks || !player.tasks.length) return rejected('no-tasks');
        if (message.station === GASCAN.id) {
          if (dist(centre(player), GASCAN) > GASCAN.range) return rejected('too-far');
          player.gas = true;
          emit(state, { t: 'gas', id });
          return { ok: true };
        }
        const task = stationById(message.station);
        if (!task) return rejected('no-station');
        if (!player.tasks.includes(task.id)) return rejected('not-your-task');
        if (player.tasksDone.includes(task.id)) return rejected('already-done');
        if (dist(centre(player), task) > task.range) return rejected('too-far');
        if (task.id === 'fuel' && !player.gas) return rejected('need-gas');
        player.tasksDone.push(task.id);
        // Only the fuel task spends the can; another task on the way must not.
        if (task.id === 'fuel') player.gas = false;
        emit(state, { t: 'task', id, station: task.id });
        checkWin(state);
        return { ok: true };
      }
      case 'chat': {
        const text = cleanChat(message.text);
        if (!text) return rejected('empty-chat');
        if (state.phase !== 'play' && state.phase !== 'meeting') return rejected('not-chatting');
        if (state.time - (player.lastChat || -9999) < 1200) return rejected('chat-slow');
        player.lastChat = state.time;
        const ghost = !player.alive;
        // Living crew only talk during a meeting; ghosts chat among themselves
        // whenever they like, which is exactly the real split.
        if (!ghost && state.phase !== 'meeting') return rejected('chat-in-meeting');
        const list = ghost ? state.ghostChat : state.chat;
        list.push({ seat: player.id, name: player.name, text, at: Math.round(state.time) });
        if (list.length > 40) list.shift();
        if (state.meeting) state.meeting.chat = state.chat.slice(-24);
        emit(state, { t: 'chat', id: player.id, ghost, text });
        return { ok: true };
      }
      case 'kill': {
        const actor = alive(state, id);
        if (!actor) return rejected('dead');
        if (state.phase !== 'play') return rejected('not-playing');
        if (actor.role !== 'impostor') return rejected('not-impostor');
        if (state.sabotage && state.sabotage.kind === 'reactor') return rejected('reactor-locked');
        if (actor.cooldown > 0) return rejected('cooling-down');
        const victim = alive(state, message.target);
        if (!victim) return rejected('no-target');
        if (victim.role === 'impostor') return rejected('teammate');
        const reach = KILL_DISTANCE[state.settings.killDistance] || KILL_RANGE;
        if (dist(centre(actor), centre(victim)) > reach) return rejected('too-far');
        victim.alive = false;
        victim.dir = { x: 0, y: 0 };
        victim.goto = null;
        state.bodies.push({ id: 'body-' + victim.id, of: victim.id, x: victim.x, y: victim.y });
        actor.cooldown = state.settings.killCooldownSec;
        emit(state, { t: 'kill', killer: id, victim: victim.id });
        checkWin(state);
        return { ok: true };
      }
      case 'vent': {
        const actor = alive(state, id);
        if (!actor) return rejected('dead');
        if (state.phase !== 'play') return rejected('not-playing');
        if (actor.role !== 'impostor') return rejected('not-impostor');
        if (actor.ventCooldown > 0) return rejected('venting-cooldown');
        const here = nearestVent(centre(actor));
        if (!here) return rejected('no-vent');
        // game.py hops to random.choice(self.vent); same ship-wide network here.
        const destination = VENTS[Math.floor(Math.random() * VENTS.length)];
        actor.x = destination[0] - PLAYER_W / 2;
        actor.y = destination[1] - PLAYER_H / 2;
        actor.dir = { x: 0, y: 0 };
        actor.goto = null;
        actor.ventCooldown = VENT_COOLDOWN;
        emit(state, { t: 'vent', id });
        return { ok: true };
      }
      case 'sabotage':
        return sabotage(state, id, message.kind);
      case 'fix':
        return fix(state, id, message.pad);
      case 'report': {
        const actor = alive(state, id);
        if (!actor) return rejected('dead');
        if (state.phase !== 'play') return rejected('not-playing');
        if (actor.role === 'impostor' && state.sabotage) return rejected('sabotage-running');
        const body = state.bodies.find(candidate => candidate.id === message.body);
        if (!body) return rejected('no-body');
        if (dist(centre(actor), centre(body)) > REPORT_RANGE) return rejected('too-far');
        startMeeting(state, { caller: id, reason: 'body', bodyOf: body.of });
        return { ok: true };
      }
      case 'button': {
        const actor = alive(state, id);
        if (!actor) return rejected('dead');
        if (state.phase !== 'play') return rejected('not-playing');
        if (actor.emergencyUsed) return rejected('already-used');
        if (dist(centre(actor), BUTTON) > BUTTON_RANGE) return rejected('too-far');
        actor.emergencyUsed = true;
        startMeeting(state, { caller: id, reason: 'button' });
        return { ok: true };
      }
      case 'vote': {
        const meeting = state.meeting;
        if (!meeting || state.phase !== 'meeting') return rejected('no-meeting');
        if (meeting.phase !== 'voting') return rejected('not-voting');
        if (!meeting.voters.includes(id)) return rejected('dead-cannot-vote');
        if (meeting.votes[id] !== undefined) return rejected('already-voted');
        const target = message.target;
        if (target !== 'skip') {
          const victim = alive(state, target);
          if (!victim) return rejected('no-target');
        }
        meeting.votes[id] = target;
        emit(state, { t: 'vote', id, target });
        if (Object.keys(meeting.votes).length >= meeting.voters.length) endMeeting(state);
        return { ok: true };
      }
      default:
        return rejected('unknown-message');
    }
  }

  function actionHints(state, viewer) {
    const hints = {
      use: null, gas: false, kill: null, vent: null, report: null,
      button: false, fix: [], room: null,
      sabotage: { reactor: false, o2: false, lights: false, comms: false, doors: false },
    };
    if (state.phase !== 'play' || !viewer) return hints;
    const at = centre(viewer);
    const comms = state.sabotage && state.sabotage.kind === 'comms';

    if (viewer.tasks && viewer.tasks.length) {
      const open = TASKS
        .filter(task => viewer.tasks.includes(task.id) && !viewer.tasksDone.includes(task.id) && dist(at, task) <= task.range)
        .sort((a, b) => dist(at, a) - dist(at, b));
      hints.use = open.length ? open[0].id : null;
      hints.gas = !viewer.gas && dist(at, GASCAN) <= GASCAN.range && viewer.tasks.includes('fuel');
    }

    if (viewer.alive && !comms) {
      let best = null;
      for (const [name, console] of Object.entries(CONSOLES)) {
        const d = dist(at, console);
        if (d <= console.range && (!best || d < best.d)) best = { name, d };
      }
      hints.room = best ? best.name : null;
    }

    if (viewer.role === 'impostor') {
      if (viewer.alive) {
        if (viewer.cooldown <= 0) {
          const reach = KILL_DISTANCE[state.settings.killDistance] || KILL_RANGE;
          const targets = state.players.filter(
            player => player.alive && player.role === 'crew' && dist(at, centre(player)) <= reach,
          );
          hints.kill = targets.sort((a, b) => dist(at, centre(a)) - dist(at, centre(b)))[0]?.id || null;
        }
        if (viewer.ventCooldown <= 0 && nearestVent(at)) hints.vent = 'vent';
      }
      for (const kind of SABOTAGE_KINDS) hints.sabotage[kind] = canSabotage(state);
    }

    if (viewer.alive) {
      const body = state.bodies
        .filter(candidate => dist(at, centre(candidate)) <= REPORT_RANGE)
        .sort((a, b) => dist(at, centre(a)) - dist(at, centre(b)))[0];
      hints.report = body ? body.id : null;
      hints.button = !viewer.emergencyUsed && dist(at, BUTTON) <= BUTTON_RANGE;
    }

    if (state.sabotage) {
      const def = sabotageDef(state.sabotage.kind);
      if (def && viewer.alive) {
        for (const point of def.fixes) {
          if (state.sabotage.held && state.sabotage.held[point.pad]) continue;
          if (dist(at, point) <= point.range) hints.fix.push(point.pad);
        }
      }
    }
    return hints;
  }

  function snapshotFor(state, viewerId) {
    const viewer = getPlayer(state, viewerId);
    const meeting = state.meeting;
    const totals = taskTotals(state);
    const mine = viewer ? viewer.tasks || [] : [];
    const myDone = viewer ? viewer.tasksDone || [] : [];

    return {
      code: state.code,
      phase: state.phase,
      winner: state.winner,
      over: state.over,
      settings: state.settings,
      tasks: { done: totals.done, total: totals.total },
      // Ids only. The page already holds the task table, the rooms, the vents
      // and the camera list, so none of that belongs in a 10 Hz message.
      stations: { mine, done: myDone },
      // A cheap signature of everything in `players` that is not a position.
      // publish() leaves `roster` out while it is unchanged.
      rosterKey: state.players
        .map(player => [player.id, player.name, player.color, player.host ? 1 : 0,
          player.ready ? 1 : 0, player.alive ? 1 : 0, player.revealed ? 1 : 0,
          player.role, player.teammate ? 1 : 0].join(','))
        .join('|'),
      fix: state.sabotage
        ? { ...(sabotageDef(state.sabotage.kind)?.fixes[0] || null), pads: sabotageDef(state.sabotage.kind)?.fixes || [] }
        : null,
      sabotage: state.sabotage
        ? { kind: state.sabotage.kind, msLeft: Math.max(0, Math.round(state.sabotage.msLeft)), held: Object.keys(state.sabotage.held || {}) }
        : null,
      doors: state.doors
        ? { room: state.doors.room, msLeft: Math.max(0, Math.round(state.doors.msLeft)), rects: doorRects(state.doors.room) }
        : null,
      sabotageCooldown: Math.ceil(state.sabotageCooldown),
      vision: visionFor(state, viewer),
      ghostChat: viewer && !viewer.alive ? state.ghostChat.slice(-12) : [],
      you: viewer
        ? {
            id: viewer.id,
            role: viewer.role,
            alive: viewer.alive,
            ready: viewer.ready,
            host: viewer.host,
            gas: viewer.gas,
            done: myDone.length,
            total: mine.length,
            tasks: mine.slice(),
            doneIds: myDone.slice(),
            cooldown: Math.ceil(viewer.cooldown),
            ventCooldown: Math.ceil(viewer.ventCooldown),
            emergencyUsed: viewer.emergencyUsed,
          }
        : null,
      players: state.players.map(player => ({
        id: player.id,
        name: player.name,
        color: player.color,
        host: player.host,
        ready: player.ready,
        alive: player.alive,
        x: Math.round(player.x),
        y: Math.round(player.y),
        role: state.phase === 'over' || player.revealed ? player.role : undefined,
        teammate: viewer && viewer.role === 'impostor' && player.role === 'impostor' && player.id !== viewer.id ? true : undefined,
      })),
      bodies: state.bodies.map(body => ({ id: body.id, of: body.of, x: round(body.x), y: round(body.y) })),
      meeting: meeting
        ? {
            caller: meeting.caller,
            reason: meeting.reason,
            bodyOf: meeting.bodyOf,
            phase: meeting.phase,
            msLeft: Math.max(0, Math.round(meeting.msLeft)),
            voted: Object.keys(meeting.votes),
            total: meeting.voters.length,
            chat: (meeting.chat || []).slice(-12),
            canVote: viewer ? meeting.voters.includes(viewer.id) : false,
          }
        : null,
      actions: actionHints(state, viewer),
    };
  }

  /* ── the room (unchanged transport-facing half) ──────────────────────── */

  // The host loop ticks every 50 ms, so 45 lets every tick publish without
  // depending on the timer firing early: 20 snapshots a second, the fastest the
  // loop can carry. Idle rooms still send nothing (publish skips unchanged state).
  const SNAPSHOT_MS = 45;
  const MIRROR_MS = 1200;
  const PUBLIC_EVENTS = new Set(['start', 'meeting', 'eject', 'win', 'vote', 'task', 'join', 'lobby', 'sabotage', 'fixed', 'gas', 'chat', 'doors', 'hold']);

  function adoptState(source, { newHostId = null, hostId = 'host' } = {}) {
    let state;
    try {
      state = JSON.parse(JSON.stringify(source || null));
    } catch {
      state = null;
    }
    if (!state || !Array.isArray(state.players)) {
      state = createGame({ code: 'PUBLIC' });
      addPlayer(state, { id: hostId, name: 'Host', host: true });
      return state;
    }
    state.events = [];
    state.settings = Object.assign({}, DEFAULTS, state.settings || {});
    if (!Array.isArray(state.bodies)) state.bodies = [];
    if (!Array.isArray(state.tasksDone)) state.tasksDone = [];
    if (!Array.isArray(state.chat)) state.chat = [];
    if (!Array.isArray(state.ghostChat)) state.ghostChat = [];
    if (!('doors' in state)) state.doors = null;
    for (const player of state.players) {
      if (!Array.isArray(player.tasks)) player.tasks = [];
      if (!Array.isArray(player.tasksDone)) player.tasksDone = [];
      if (state.phase !== 'lobby' && !player.tasks.length && player.role === 'crew') player.tasks = drawTasks();
    }

    const oldHost = newHostId
      ? state.players.find(player => player.host && player.id !== newHostId)
      : null;
    if (oldHost) removePlayer(state, oldHost.id);

    let me = newHostId ? state.players.find(player => player.id === newHostId) : null;
    if (!me) {
      addPlayer(state, { id: hostId, name: 'Host', host: true });
      me = getPlayer(state, hostId);
    } else if (me.id !== hostId) {
      const previous = me.id;
      me.id = hostId;
      state.bodies = state.bodies.map(body => (body.of === previous ? Object.assign({}, body, { of: hostId }) : body));
      if (state.over && Array.isArray(state.over.roles)) {
        state.over.roles = state.over.roles.map(role => (role.id === previous ? Object.assign({}, role, { id: hostId }) : role));
      }
      if (state.meeting) {
        state.meeting.voters = state.meeting.voters.map(id => (id === previous ? hostId : id));
        if (state.meeting.votes[previous] !== undefined) {
          state.meeting.votes[hostId] = state.meeting.votes[previous];
          delete state.meeting.votes[previous];
        }
      }
    }
    for (const player of state.players) {
      player.host = player.id === hostId;
      player.seen = state.time;
    }
    return state;
  }

  function createHostRoom({ code = 'PUBLIC', name = 'Host', publicRoom = false, resume = null, rng = Math.random } = {}) {
    const hostId = 'host';
    const state = resume && resume.state
      ? adoptState(resume.state, { newHostId: resume.playerId, hostId })
      : createGame({ code, settings: { auto: publicRoom } });
    state.code = code;
    state.settings.auto = Boolean(publicRoom) || Boolean(state.settings.auto);
    if (!getPlayer(state, hostId)) addPlayer(state, { id: hostId, name, host: true });

    const links = new Map();
    const connections = new Map();
    const owners = new Map();
    const listeners = { snapshot: [], event: [] };
    let sinceSnapshot = SNAPSHOT_MS;
    let sinceMirror = MIRROR_MS;
    let lastWire = 0;

    function on(kind, handler) {
      listeners[kind].push(handler);
      return () => {
        listeners[kind] = listeners[kind].filter(candidate => candidate !== handler);
      };
    }

    function fire(kind, payload) {
      for (const handler of listeners[kind]) handler(payload);
    }

    function ring() {
      const ids = state.players.map(player => player.id);
      const at = ids.indexOf(hostId);
      if (at < 0) return ids;
      return ids.slice(at + 1).concat(ids.slice(0, at));
    }

    function successor() {
      return ring()[0] || null;
    }

    function rankOf(id) {
      if (id === hostId) return 0;
      return ring().indexOf(id) + 1;
    }

    function stamp(snapshot, id, next = successor()) {
      snapshot.net = {
        publicRoom: Boolean(publicRoom),
        rank: rankOf(id),
        next: next === id,
        players: state.players.length,
      };
      return snapshot;
    }

    function checkpoint() {
      return JSON.parse(JSON.stringify(state));
    }

    let lastKey = '';
    function signature() {
      const players = state.players.map(player =>
        [player.id, Math.round(player.x), Math.round(player.y), player.alive ? 1 : 0,
          player.ready ? 1 : 0, player.revealed ? 1 : 0, player.gas ? 1 : 0,
          Math.ceil(player.cooldown || 0), Math.ceil(player.ventCooldown || 0)].join(',')).join(';');
      const votes = state.meeting && state.meeting.votes ? Object.keys(state.meeting.votes).length : 0;
      const totals = taskTotals(state);
      return [state.phase, players, state.bodies.length, votes, totals.done + '/' + totals.total,
        state.chat.length, state.ghostChat.length,
        (state.meeting && state.meeting.phase) || '-',
        state.sabotage ? state.sabotage.kind + ':' + Object.keys(state.sabotage.held || {}).length : '-',
        state.doors ? state.doors.room : '-', Math.ceil(state.sabotageCooldown),
        Math.ceil(((state.meeting && state.meeting.msLeft) || 0) / 1000),
        Math.ceil(((state.over && state.over.msLeft) || 0) / 1000)].join('|');
    }

    // What each seat already holds, so a snapshot only carries what changed.
    const wireCache = new Map();

    function wireSnapshot(seatId, force = false) {
      const full = snapshotFor(state, seatId);
      const viewer = getPlayer(state, seatId);
      const taskKey = viewer ? (viewer.tasks || []).join(',') + '/' + (viewer.tasksDone || []).join(',') : '';
      const cache = wireCache.get(seatId) || {};
      const out = Object.assign({}, full);
      out.pos = full.players.map(player => [player.id, player.x, player.y]);
      if (force || cache.roster !== full.rosterKey) {
        out.roster = full.players.map(player => {
          const copy = Object.assign({}, player);
          delete copy.x;
          delete copy.y;
          return copy;
        });
        cache.roster = full.rosterKey;
      }
      if (force || cache.tasks !== taskKey) {
        cache.tasks = taskKey;
      } else {
        delete out.stations;
        if (out.you) {
          delete out.you.tasks;
          delete out.you.doneIds;
        }
      }
      const settingsKey = JSON.stringify(state.settings);
      if (!force && cache.settings === settingsKey) delete out.settings;
      else cache.settings = settingsKey;
      delete out.players;
      delete out.rosterKey;
      wireCache.set(seatId, cache);
      return out;
    }

    function publish(force = false) {
      if (!force && sinceSnapshot < SNAPSHOT_MS) return;
      sinceSnapshot = 0;
      if (!force) {
        const key = signature();
        if (key === lastKey) return;
        lastKey = key;
      }
      const next = successor();
      fire('snapshot', stamp(snapshotFor(state, hostId), hostId, next));
      for (const [id, send] of links) send({ t: 'snap', s: stamp(wireSnapshot(id, force), id, next) });
      lastWire = Date.now();
    }

    function sendMirror(force = false) {
      if (!force && sinceMirror < MIRROR_MS) return;
      const next = successor();
      if (!next) return;
      const send = links.get(next);
      if (!send) return;
      sinceMirror = 0;
      send({ t: 'mirror', state: checkpoint() });
    }

    function flushEvents() {
      for (const event of drainEvents(state)) {
        fire('event', event);
        if (!PUBLIC_EVENTS.has(event.t)) continue;
        for (const send of links.values()) send({ t: 'event', e: event });
      }
    }

    function pruneAbsent() {
      let removed = false;
      for (const player of state.players.slice()) {
        if (player.id === hostId) continue;
        if (links.has(player.id)) {
          player.seen = state.time;
          continue;
        }
        if (state.time - (player.seen || 0) > ABSENT_MS) {
          removePlayer(state, player.id);
          removed = true;
        }
      }
      return removed;
    }

    function admit(connectionId, playerName, send, playerId = connectionId) {
      const seatId = String(playerId || connectionId);
      if (seatId === hostId) return { error: 'already-joined' };
      const existing = getPlayer(state, seatId);
      if (!existing && state.players.length >= MAX_PLAYERS) return { error: 'room-full' };
      const player = existing || addPlayer(state, { id: seatId, name: playerName, rng });
      if (!player) return { error: 'room-full' };
      player.seen = state.time;
      connections.set(connectionId, seatId);
      owners.set(seatId, connectionId);
      links.set(seatId, send);
      send({ t: 'welcome', protocol: 'bored-imposter/3', s: stamp(wireSnapshot(seatId, true), seatId) });
      if (state.settings.auto) maybeAutoStart(state, rng);
      flushEvents();
      publish(true);
      sendMirror(true);
      return { snapshot: snapshotFor(state, seatId), playerId: seatId };
    }

    function seatOf(connectionId) {
      return connections.get(connectionId) || null;
    }

    function receive(id, message) {
      if (!getPlayer(state, id)) return { ok: false, error: 'unknown-player' };
      const result = apply(state, id, message);
      if (!result.ok) {
        const send = links.get(id);
        if (send) send({ t: 'error', error: result.error });
      }
      flushEvents();
      if (result.ok && message.t !== 'walk' && message.t !== 'goto' && message.t !== 'stop') publish(true);
      return result;
    }

    // The channel went quiet: keep the seat (and the round) open for the
    // reconnect window and stop sending to a link that is not there.
    function suspend(seatId) {
      links.delete(seatId);
      const player = getPlayer(state, seatId);
      if (player) player.seen = state.time;
      publish(true);
    }

    function detach(connectionId) {
      const seatId = connections.get(connectionId) || connectionId;
      connections.delete(connectionId);
      if (owners.get(seatId) !== connectionId) return;
      owners.delete(seatId);
      links.delete(seatId);
      if (getPlayer(state, seatId)) removePlayer(state, seatId);
      flushEvents();
      publish(true);
      sendMirror(true);
    }

    return {
      code: state.code,
      state,
      publicRoom,
      hostId,
      on,
      admit,
      seatOf,
      detach,
      suspend,
      receive,
      snapshot: () => stamp(snapshotFor(state, hostId), hostId),
      checkpoint,
      successor,
      rankOf,
      tick(dtMs) {
        let remaining = Math.max(0, dtMs);
        // A stalled host (a backgrounded tab runs its timers at 1 Hz) must not
        // replay the whole gap as one stride: at most a couple of ordinary
        // frames of the gap become walking, the rest is lost. Without this a
        // one-second pause moves everyone 400px in a single frame.
        let walkLeft = Math.min(remaining, 120);
        while (remaining > 0) {
          const slice = Math.min(remaining, 250);
          const walk = Math.min(walkLeft, slice);
          walkLeft -= walk;
          step(state, slice, rng, walk);
          remaining -= slice;

        sinceSnapshot += dtMs;
        sinceMirror += dtMs;
        if (pruneAbsent()) flushEvents();
        flushEvents();
        publish();
        sendMirror();
        // Snapshots only go out when something changed, so a room where nobody
        // is moving looks dead to a client whose watchdog gives up after 3s.
        // One tiny frame a second is enough to say "the host is still here".
        if (links.size && Date.now() - lastWire > 1000) {
          lastWire = Date.now();
          for (const send of links.values()) send({ t: 'ping' });
        }
      },
      close() {
        for (const send of links.values()) send({ t: 'bye' });
        links.clear();
      },
    };
  }

  return {
    WORLD, VIEW, SPEED, PLAYER_W, PLAYER_H, WALLS, SPAWNS, VENTS, BUTTON, TASKS, GASCAN,
    ROOMS, CAMS, CONSOLES, SABOTAGE, SABOTAGE_KINDS, DOOR_ROOMS, KILL_DISTANCE, VISION_BASE,
    COLORS, DEFAULTS, SNAPSHOT_MS, KILL_COOLDOWN, SABOTAGE_COOLDOWN, REACTOR_MS, KILL_RANGE,
    REPORT_RANGE, BUTTON_RANGE, VENT_RANGE, RESET_MS, ABSENT_MS, MIN_PLAYERS, MAX_PLAYERS,
    stationById, overlapsWall, nearestVent, roomAt, doorRects, taskTotals, drawTasks,
    createGame, addPlayer, removePlayer, getPlayer, setReady,
    configure, start, beginRound, maybeAutoStart, backToLobby, endMeeting, checkWin, apply, step,
