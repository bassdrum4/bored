    $('act-kill').hidden = !actions.kill;
    $('act-vent').hidden = !actions.vent;
    $('act-report').hidden = !actions.report;
    $('act-button').hidden = !actions.button;
    $('act-fix').hidden = !actions.fix;

    const canSabotage = you.role === 'impostor' && you.alive && s.phase === 'play';
    $('sab-lights').hidden = !canSabotage || !actions.sabotage.lights;
    $('sab-reactor').hidden = !canSabotage || !actions.sabotage.reactor;

    const note = $('sabotage-note');
    if (s.sabotage?.kind === 'reactor') {
      note.hidden = false;
      note.textContent = `Reactor meltdown in ${Math.ceil(s.sabotage.msLeft / 1000)}s — reset it in Reactor.`;
    } else if (s.sabotage?.kind === 'lights') {
      note.hidden = false;
      note.textContent = 'Lights out — fix the breaker in Electrical.';
    } else {
      note.hidden = true;
    }
  }

  function renderMeeting(s) {
    const meeting = s.meeting;
    if (!meeting) return;
    const reason = meeting.reason === 'body' ? 'A body was reported' : 'Emergency meeting';
    $('meeting-reason').textContent = reason;
    const alive = s.players.filter(player => player.alive);
    const you = s.you;
    const voted = meeting.voted.includes(selfId);
    const canVote = meeting.canVote !== false;
    $('meeting-note').textContent = !canVote
      ? 'You joined mid-meeting, so you vote in the next one.'
      : voted
        ? 'Vote locked. Waiting for the rest.'
        : `${alive.length} alive · ${meeting.voted.length}/${meeting.total} voted`;
    $('meeting-timer').textContent = `${Math.max(0, Math.ceil(meeting.msLeft / 1000))}s`;

    const key = `${reason}|${alive.map(player => player.id).join(',')}|${meeting.voted.join(',')}|${you?.alive}|${canVote}`;
    setList($('votes'), key, list => {
      if (!you?.alive || !canVote) {
        list.append(el('li', '', you?.alive ? 'Waiting for the next meeting.' : 'Ghosts watch. They do not vote.'));
        return;
      }
      for (const player of alive) {
        if (player.id === selfId) continue;
        const row = playerRow(player, meeting.voted.includes(player.id) ? 'voted' : '');
        const button = el('button', 'vote', 'Vote');
        button.type = 'button';
        button.disabled = voted;
        button.addEventListener('click', () => send({ t: 'vote', target: player.id }));
        row.append(button);
        list.append(row);
      }
    });
    $('skip').disabled = voted || !canVote;
  }

  function renderOver(s, hosting, publicRoom) {
    $('over-eyebrow').textContent = s.winner === 'crew' ? 'Crewmates win' : 'Impostors win';
    $('over-title').textContent = s.winner === 'crew' ? 'All impostors are gone.' : 'The impostors took the ship.';
    const roles = s.over?.roles || [];
    setList($('over-roles'), roles.map(role => `${role.id}:${role.role}:${role.alive}`).join('|'), list => {
      for (const role of roles) {
        const player = s.players.find(candidate => candidate.id === role.id) || { color: 'white', name: role.name };
        const row = playerRow(player, `${role.role}${role.alive ? '' : ' · dead'}`);
        row.classList.add(role.role === 'impostor' ? 'is-impostor' : 'is-crew');
        list.append(row);
      }
    });

    $('back-lobby').hidden = publicRoom;
    const seconds = Math.max(0, Math.ceil((s.over?.msLeft || 0) / 1000));
    $('over-note').textContent = publicRoom
      ? `The public room reshuffles in ${seconds}s. Stay in and you are dealt the next round.`
      : 'Back to lobby deals a new round with the same players.';
  }

  function handleEvent(event) {
    if (!event) return;
    switch (event.t) {
      case 'start':
        toast('Roles dealt. Find your tasks.');
        break;
      case 'meeting':
        toast(event.reason === 'body' ? 'A body was reported.' : 'Emergency meeting called.');
        break;
      case 'eject': {
        const player = snap?.players.find(candidate => candidate.id === event.id);
        if (event.id) toast(`${player?.name || 'Someone'} was ejected — ${event.role}.`);
        else toast(event.tie ? 'No one was ejected (tie).' : 'No one was ejected.');
        break;
      }
      case 'win':
        toast(event.winner === 'crew' ? 'Crewmates win.' : 'Impostors win.');
        break;
      case 'join':
        if (event.id !== selfId) toast(`${event.name} joined the round.`);
        break;
      case 'task':
        if (event.id === selfId) toast('Task complete.');
        break;
      case 'gas':
        if (event.id === selfId) toast('Gas can in hand. Take it to the engine.');
        break;
      case 'sabotage':
        toast(event.kind === 'reactor' ? 'Reactor meltdown.' : 'Lights cut.');
        break;
      case 'fixed':
        toast(event.kind === 'reactor' ? 'Reactor reset.' : 'Lights back on.');
        break;
      case 'rejected':
        toast(ERRORS[event.error] || event.error);
        break;
      default:
        break;
    }
  }

  /* ── drawing ─────────────────────────────────────────────────────────── */

  const view = new Map();
  let selfView = null;
  let lastFrame = performance.now();

  function seedView(state) {
    for (const player of state.players) {
      const entry = view.get(player.id);
      if (entry) {
        entry.tx = player.x;
        entry.ty = player.y;
      } else {
        view.set(player.id, { x: player.x, y: player.y, tx: player.x, ty: player.y, dir: 0 });
      }
    }
    for (const id of view.keys()) {
      if (!state.players.some(player => player.id === id)) view.delete(id);
    }
    const me = state.players.find(player => player.id === selfId);
    if (me && (!selfView || Math.hypot(selfView.x - me.x, selfView.y - me.y) > 220)) {
      selfView = { x: me.x, y: me.y };
    }
  }

  // Frames run down, left, right, up inside each colour sheet.
  function frameFor(dx, dy, fallback) {
    if (dy > 0.35) return 0;
    if (dy < -0.35) return 3;
    if (dx < -0.35) return 1;
    if (dx > 0.35) return 2;
    return fallback || 0;
  }

  function drawCrew(ctx, colorId, x, y, frame, alpha) {
    const image = CREW.get(colorId);
    if (!image || !image.complete || !image.naturalWidth) return false;
    const frameWidth = image.naturalWidth / 4;
    const height = image.naturalHeight;
    ctx.save();
    ctx.globalAlpha *= alpha;
    ctx.drawImage(image, frame * frameWidth, 0, frameWidth, height, x - C.PLAYER_W / 2, y - C.PLAYER_H, C.PLAYER_W, C.PLAYER_H);
    ctx.restore();
    return true;
  }

  function label(ctx, text, x, y, color, size) {
    const px = size || 30;
    ctx.font = `600 ${px}px ui-monospace, Menlo, monospace`;
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(0,0,0,.72)';
    ctx.fillText(text, x + px * 0.05, y + px * 0.05);
    ctx.fillStyle = color;
    ctx.fillText(text, x, y);
  }

  let viewW = C.VIEW.w;
  let viewH = C.VIEW.h;

  function draw() {
    requestAnimationFrame(draw);
    tickToast();
    if (!snap || $('screen-game').hidden) return;

    const canvas = $('board');
    const stage = canvas.parentElement;
    const width = stage.clientWidth;
    const height = stage.clientHeight;
    if (!width || !height) return;

    const now = performance.now();
    const dt = Math.min(0.1, (now - lastFrame) / 1000);
    lastFrame = now;

    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const pixelWidth = Math.round(width * dpr);
    const pixelHeight = Math.round(height * dpr);
    if (canvas.width !== pixelWidth || canvas.height !== pixelHeight) {
      canvas.width = pixelWidth;
      canvas.height = pixelHeight;
    }

    // The Python drew 1280x640 of ship at a time and followed the player. Fit
    // that whole view into the stage and let the extra space show more ship, so
    // a tall panel is not zoomed into the floor tiles.
    const scale = Math.min(width / C.VIEW.w, height / C.VIEW.h);
    viewW = width / scale;
    viewH = height / scale;

    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, width, height);
    ctx.save();
    ctx.scale(scale, scale);

    const me = snap.players.find(player => player.id === selfId);
    const focus = selfView || { x: me?.x || 0, y: me?.y || 0 };
    const centreX = focus.x + C.PLAYER_W / 2;
    const centreY = focus.y + C.PLAYER_H / 2;
    const camX = C.WORLD.w <= viewW ? (C.WORLD.w - viewW) / 2 : Math.min(Math.max(0, centreX - viewW / 2), C.WORLD.w - viewW);
    const camY = C.WORLD.h <= viewH ? (C.WORLD.h - viewH) / 2 : Math.min(Math.max(0, centreY - viewH / 2), C.WORLD.h - viewH);
    ctx.translate(-camX, -camY);

    if (MAP_ART.complete && MAP_ART.naturalWidth) {
      ctx.drawImage(MAP_ART, 0, 0, C.WORLD.w, C.WORLD.h);
    } else {
      ctx.fillStyle = '#15171a';
      ctx.fillRect(0, 0, C.WORLD.w, C.WORLD.h);
    }

    const you = snap.you;

    // Emergency button.
    if (BUTTON_ART.complete && BUTTON_ART.naturalWidth) {
      const bw = 110;
      const bh = bw * (BUTTON_ART.naturalHeight / BUTTON_ART.naturalWidth);
      ctx.drawImage(BUTTON_ART, C.BUTTON.x - bw / 2, C.BUTTON.y - bh / 2, bw, bh);
    }

    // Vents.
    for (const vent of C.VENTS) {
      ctx.fillStyle = 'rgba(10,11,12,.72)';
      ctx.strokeStyle = you?.role === 'impostor' ? 'rgba(192,57,43,.85)' : 'rgba(20,21,24,.9)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(vent[0] - 34, vent[1] - 26, 68, 52, 6);
      ctx.fill();
      ctx.stroke();
      ctx.strokeStyle = you?.role === 'impostor' ? 'rgba(224,138,128,.65)' : 'rgba(120,124,130,.4)';
      ctx.lineWidth = 2;
      for (let i = -1; i <= 1; i += 1) {
        ctx.beginPath();
        ctx.moveTo(vent[0] - 20, vent[1] + i * 9);
        ctx.lineTo(vent[0] + 20, vent[1] + i * 9);
        ctx.stroke();
      }
    }

    // Task marks: yellow diamonds for the crew, faded once done.
    for (const station of snap.stations) {
      if (station.done) continue;
      const crew = you?.role === 'crew';
      ctx.globalAlpha = crew ? 1 : 0.5;
      ctx.fillStyle = crew ? '#f2df6a' : '#8b8e94';
      ctx.strokeStyle = 'rgba(0,0,0,.7)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(station.x, station.y - 18);
      ctx.lineTo(station.x + 18, station.y);
      ctx.lineTo(station.x, station.y + 18);
      ctx.lineTo(station.x - 18, station.y);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.globalAlpha = 1;
      const near = Math.hypot(centreX - station.x, centreY - station.y) < 520;
      if (near) label(ctx, station.label, station.x, station.y - 28, crew ? '#f7efc2' : '#b9bcc2', 28);
    }

    // Gas can, only while the crew still needs it.
    if (you?.role === 'crew' && !you.gas && snap.tasks.done.indexOf('fuel') === -1) {
      const gas = snap.gas;
      if (GAS_ART.complete && GAS_ART.naturalWidth) ctx.drawImage(GAS_ART, gas.x - 26, gas.y - 34, 52, 52);
      else {
        ctx.fillStyle = '#f2df6a';
        ctx.fillRect(gas.x - 14, gas.y - 18, 28, 30);
      }
      if (Math.hypot(centreX - gas.x, centreY - gas.y) < 520) label(ctx, 'Gas can', gas.x, gas.y - 44, '#f7efc2', 28);
    }

    // Sabotage repair point.
    if (snap.fix) {
      const fix = snap.fix;
      ctx.strokeStyle = snap.sabotage.kind === 'reactor' ? '#e08a80' : '#e8dfa0';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(fix.x, fix.y, 46, 0, Math.PI * 2);
      ctx.stroke();
      label(ctx, fix.label, fix.x, fix.y - 56, '#e8dfa0', 28);
    }

    // Bodies.
    for (const body of snap.bodies) {
      const owner = snap.players.find(player => player.id === body.of);
      ctx.save();
      ctx.translate(body.x + C.PLAYER_W / 2, body.y + C.PLAYER_H / 2);
      ctx.rotate(Math.PI / 2);
      if (!drawCrew(ctx, owner?.color || 'white', 0, C.PLAYER_H / 2 - 6, 0, 0.85)) {
        ctx.fillStyle = colorHex(owner?.color || 'white');
        ctx.fillRect(-20, -12, 40, 24);
      }
      ctx.restore();
    }

    // Your own seat, predicted locally from the keys.
    if (me?.alive && selfView) {
      const dir = walkVector();
      if (dir.x || dir.y) {
        const length = Math.hypot(dir.x, dir.y) || 1;
        const step = C.SPEED * dt;
        const nx = selfView.x + (dir.x / length) * step;
        const ny = selfView.y + (dir.y / length) * step;
        const hitX = C.overlapsWall(nx, selfView.y);
        const hitY = C.overlapsWall(selfView.x, ny);
        if (!hitX) selfView.x = Math.min(Math.max(0, nx), C.WORLD.w - C.PLAYER_W);
        if (!hitY) selfView.y = Math.min(Math.max(0, ny), C.WORLD.h - C.PLAYER_H);
      }
    }

    for (const player of snap.players) {
      const isSelf = player.id === selfId;
      if (!player.alive && !isSelf) continue;
      const entry = view.get(player.id) || { x: player.x, y: player.y, tx: player.x, ty: player.y, dir: 0 };
      let px;
      let py;
      if (isSelf && selfView && player.alive) {
        px = selfView.x;
        py = selfView.y;
        entry.x = px;
        entry.y = py;
        entry.tx = player.x;
        entry.ty = player.y;
      } else {
        const ease = 1 - Math.exp(-dt * 16);
        entry.x += (entry.tx - entry.x) * ease;
        entry.y += (entry.ty - entry.y) * ease;
        px = entry.x;
        py = entry.y;
      }
      const dx = entry.tx - entry.x;
      const dy = entry.ty - entry.y;
      if (Math.abs(dx) > 1 || Math.abs(dy) > 1) entry.dir = frameFor(dx, dy, entry.dir);

      const moving = Math.abs(dx) + Math.abs(dy) > 1;
      const bob = moving ? Math.round(Math.sin(now / 110) * 3) : 0;
      const ghost = !player.alive;
      if (!drawCrew(ctx, player.color, px + C.PLAYER_W / 2, py + C.PLAYER_H + bob, entry.dir, ghost ? 0.45 : 1)) {
        ctx.fillStyle = colorHex(player.color);
        ctx.beginPath();
        ctx.arc(px + C.PLAYER_W / 2, py + C.PLAYER_H / 2, 22, 0, Math.PI * 2);
        ctx.fill();
      }
      if (player.teammate) {
        ctx.strokeStyle = 'rgba(192,57,43,.85)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.ellipse(px + C.PLAYER_W / 2, py + C.PLAYER_H, 30, 12, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
      label(ctx, player.name, px + C.PLAYER_W / 2, py - 14, isSelf ? '#f2df6a' : '#e7e5e0', 30);
    }

    // Lights out: everything but a circle round the player goes dark, which is
    // the Python's light mask done with a gradient.
    if (snap.sabotage?.kind === 'lights') {
      const cx = centreX;
      const cy = centreY;
      const gradient = ctx.createRadialGradient(cx, cy, 40, cx, cy, 620);
      gradient.addColorStop(0, 'rgba(0,0,0,0)');
      gradient.addColorStop(0.35, 'rgba(0,0,0,0.25)');
      gradient.addColorStop(1, 'rgba(0,0,0,0.94)');
      ctx.fillStyle = gradient;
      ctx.fillRect(camX - 10, camY - 10, viewW + 20, viewH + 20);
    }

    // Reactor: a red wash and the countdown, like the Python's alarm tint.
    if (snap.sabotage?.kind === 'reactor') {
      const pulse = 0.12 + 0.08 * Math.sin(now / 220);
      ctx.fillStyle = `rgba(190,30,20,${pulse})`;
      ctx.fillRect(camX - 10, camY - 10, viewW + 20, viewH + 20);
      label(ctx, `REACTOR ${Math.ceil(snap.sabotage.msLeft / 1000)}`, camX + viewW / 2, camY + 90, '#ffb3a8', 52);
    }

    ctx.restore();
  }

  /* ── tasks, ported from game.py's windows ─────────────────────────────── */

  const GAMES = {
    wires(root, done) {
      const board = el('div', 'task-art wires');
      board.append(img('task-wires.png', 'task-board'));
      const rack = el('div', 'wire-rack');
      const colors = ['red', 'blue', 'yellow', 'pink'];
      let fixed = 0;
      for (const color of colors) {
        const button = el('button', 'wire-btn');
        button.type = 'button';
        button.append(img(`wire-${color}.png`, 'wire-img'));
        button.addEventListener('click', () => {
          if (button.classList.contains('done')) return;
          button.classList.add('done');
          fixed += 1;
          if (fixed >= colors.length) done();
        });
        rack.append(button);
      }
      board.append(rack);
      root.append(board, el('p', 'task-help', 'Click each wire to connect it.'));
    },

    garbage(root, done) {
      const board = el('div', 'task-art');
      const picture = img('task-garbage-full.png', 'task-board');
      const lever = el('button', 'lever');
      lever.type = 'button';
      lever.append(img('lever-up.png', 'lever-img'));
      lever.addEventListener('click', () => {
        lever.classList.add('pulled');
        picture.src = asset('task-garbage-empty.png');
        lever.replaceChildren(img('lever-down.png', 'lever-img'));
        done();
      });
      board.append(picture, lever);
      root.append(board, el('p', 'task-help', 'Pull the lever to empty the chute.'));
    },

    wifi(root, done) {
      const board = el('div', 'task-art');
      const picture = img('task-wifi.png', 'task-board');
      const lever = el('button', 'lever');
      lever.type = 'button';
      lever.append(img('wifi-lever.png', 'lever-img'));
      const on = img('wifi-on.png', 'wifi-on');
      on.hidden = true;
      lever.addEventListener('click', () => {
        lever.classList.add('pulled');
        picture.classList.add('fixed');
        on.hidden = false;
        done();
      });
      board.append(picture, lever, on);
      root.append(board, el('p', 'task-help', 'Pull the lever to reboot the wifi.'));
    },

    divert(root, done) {
      const board = el('div', 'task-art');
      const picture = img('task-divert.png', 'task-board');
      const lever = el('button', 'lever divert');
      lever.type = 'button';
      lever.append(img('divert-lever.png', 'lever-img wide'));
      lever.addEventListener('click', () => {
        lever.classList.add('pulled');
        picture.src = asset('task-diverted.png');
        done();
      });
      board.append(picture, lever);
      root.append(board, el('p', 'task-help', 'Throw the switch to divert power to the reactor.'));
    },

    align(root, done) {
      const board = el('div', 'task-art align');
      board.append(img('task-align.png', 'task-board'));
      const track = el('div', 'align-track');
      const marker = el('span', 'align-centre');
      track.append(marker);
      const sliders = [];
      let solved = 0;
      for (let index = 0; index < 2; index += 1) {
        const row = el('div', 'align-row');
        row.append(el('span', 'align-tag', `Engine ${index + 1}`));
        const input = document.createElement('input');
        input.type = 'range';
        input.min = '0';
        input.max = '100';
        input.value = String(index ? 88 : 12);
        input.className = 'align-slider';
        input.addEventListener('input', () => {
          const aligned = Math.abs(Number(input.value) - 50) <= 5;
          input.classList.toggle('aligned', aligned);
          sliders[index] = aligned;
          if (sliders[0] && sliders[1]) done();
        });
        row.append(input);
        board.append(row);
      }
      root.append(board, el('p', 'task-help', 'Line up both outputs with the centre marks.'));
    },

    fuel(root, done) {
      const board = el('div', 'task-art');
      board.append(img('task-fuel.png', 'task-board'));
      const gauge = el('div', 'fuel-gauge');
      const fill = el('i');
      gauge.append(fill);
      const button = el('button', 'btn btn-primary', 'Fill');
      button.type = 'button';
      let level = 0;
      let timer = 0;
      const pour = () => {
        level = Math.min(100, level + 4);
        fill.style.height = level + '%';
        if (level >= 100) {
          clearInterval(timer);
          button.disabled = true;
          done();
        }
      };
      button.addEventListener('click', pour);
      board.append(gauge, button);
      root.append(board, el('p', 'task-help', 'Hold Fill until the engine tank is full.'));
    },

    asteroids(root, done) {
      let destroyed = 0;
      const target = 30;
      const stage = el('div', 'asteroid-stage');
      const canvas = document.createElement('canvas');
      canvas.width = 960;
      canvas.height = 540;
      canvas.className = 'asteroid-canvas';
      const count = el('p', 'task-help', `Destroyed 0 / ${target}`);
      stage.append(canvas);
      root.append(stage, count, el('p', 'task-help', 'Click the rocks. Thirty clears the field.'));

      const ctx = canvas.getContext('2d');
      const rocks = [];
      const art = [1, 2, 3, 4].map(number => loadImage(`asteroid${number}.png`));
      const ship = loadImage('starship.png');
      let frame = 0;
      let running = true;

      const spawn = () => {
        rocks.push({
          x: 40 + Math.random() * (canvas.width - 80),
          y: -60,
          r: 18 + Math.random() * 22,
          vy: 40 + Math.random() * 70,
          art: art[Math.floor(Math.random() * 4)],
        });
      };

      let last = performance.now();
      const loop = now => {
        if (!running) return;
        const dt = Math.min(0.05, (now - last) / 1000);
        last = now;
        frame += dt;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#05070c';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        if (ship.complete && ship.naturalWidth) {
          const sw = 200;
          const sh = sw * (ship.naturalHeight / ship.naturalWidth);
          ctx.drawImage(ship, canvas.width / 2 - sw / 2, canvas.height - sh + 40, sw, sh);
        }
        if (frame > 0.5) {
          frame = 0;
          spawn();
        }
        for (const rock of rocks) {
          rock.y += rock.vy * dt;
          if (rock.art.complete) ctx.drawImage(rock.art, rock.x - rock.r, rock.y - rock.r, rock.r * 2, rock.r * 2);
          else {
            ctx.fillStyle = '#8b8e94';
            ctx.beginPath();
            ctx.arc(rock.x, rock.y, rock.r, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        for (let index = rocks.length - 1; index >= 0; index -= 1) {
          if (rocks[index].y > canvas.height + 80) rocks.splice(index, 1);
        }
        requestAnimationFrame(loop);
      };
      requestAnimationFrame(loop);

      canvas.addEventListener('pointerdown', event => {
        const rect = canvas.getBoundingClientRect();
        const x = ((event.clientX - rect.left) / rect.width) * canvas.width;
        const y = ((event.clientY - rect.top) / rect.height) * canvas.height;
        for (let index = rocks.length - 1; index >= 0; index -= 1) {
          if (Math.hypot(rocks[index].x - x, rocks[index].y - y) <= rocks[index].r + 10) {
            rocks.splice(index, 1);
            destroyed += 1;
            count.textContent = `Destroyed ${destroyed} / ${target}`;
            if (destroyed >= target) {
              running = false;
              done();
            }
            return;
          }
        }
      });
      return () => {
        running = false;
      };
    },

    nav(root, done) {
      const board = el('div', 'task-art nav');
      board.append(img('task-nav.png', 'task-board'));
      const pad = el('div', 'nav-pad');
      const centre = img('nav-centre.png', 'nav-centre');
      const target = img('nav-target.png', 'nav-target');
      target.style.left = '24%';
      target.style.top = '70%';
      pad.append(centre, target);
      board.append(pad);
      let dragging = false;
      const move = event => {
        if (!dragging) return;
        const rect = pad.getBoundingClientRect();
        const x = Math.min(rect.width, Math.max(0, event.clientX - rect.left));
        const y = Math.min(rect.height, Math.max(0, event.clientY - rect.top));
        target.style.left = ((x / rect.width) * 100) + '%';
        target.style.top = ((y / rect.height) * 100) + '%';
        const distance = Math.hypot(x - rect.width / 2, y - rect.height / 2);
        if (distance < 26) {
          dragging = false;
          target.classList.add('locked');
          done();
        }
      };
      pad.addEventListener('pointerdown', event => {
        dragging = true;
        move(event);
      });
      pad.addEventListener('pointermove', move);
      window.addEventListener('pointerup', () => { dragging = false; });
      root.append(board, el('p', 'task-help', 'Drag the ship marker onto the centre crosshair.'));
    },
  };

  function openTask(station) {
    const task = C.stationById(station);
    if (!task || !GAMES[task.game]) return;
    closeTask();
    $('task-title').textContent = task.label;
    const body = $('task-body');
    body.replaceChildren();
    $('overlay-task').hidden = false;
    const cleanup = GAMES[task.game](body, () => {
      send({ t: 'use', station: task.id });
      closeTask();
      toast('Task complete.');
    });
    taskOpen = { cleanup: typeof cleanup === 'function' ? cleanup : null };
  }

  function closeTask() {
    if (taskOpen?.cleanup) taskOpen.cleanup();
    taskOpen = null;
    $('overlay-task').hidden = true;
    $('task-body').replaceChildren();
  }

  function openList(kind) {
    $('overlay-list').hidden = false;
    $('list-title').textContent = kind === 'map' ? 'The Skeld' : 'Tasks';
    const body = $('list-body');
    body.replaceChildren();
    if (kind === 'map') {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = Math.round(1024 * (C.WORLD.h / C.WORLD.w));
      canvas.className = 'map-canvas';
      body.append(canvas);
      drawMap(canvas);
      return;
    }
    const you = snap?.you;
    const list = el('ul', 'roster tasks-list');
    for (const station of snap?.stations || []) {
      const row = el('li', 'row-item');
      row.append(el('span', 'dot', station.done ? '✓' : '·'));
      row.firstElementChild.style.background = station.done ? '#4f8f4f' : 'transparent';
      row.append(el('span', 'name', station.label));
      row.append(el('span', 'tail', station.room));
      list.append(row);
    }
    if (you?.role === 'crew' && !you.gas && !snap?.tasks.done.includes('fuel')) {
      const row = el('li', 'row-item');
      row.append(el('span', 'dot'));
      row.append(el('span', 'name', 'Find a gas can'));
      row.append(el('span', 'tail', 'Storage'));
      list.append(row);
    }
    body.append(list);
    body.append(el('p', 'hint', you?.role === 'impostor'
      ? 'Your list is a decoy. Sabotage, vent and kill; the crew has to finish eight missions.'
      : `${snap?.tasks.done.length || 0} of ${snap?.tasks.total || 8} missions done.`));
  }

  function drawMap(canvas) {
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (MINI_ART.complete && MINI_ART.naturalWidth) {
      ctx.drawImage(MINI_ART, 0, 0, canvas.width, canvas.height);
    } else {
      ctx.fillStyle = '#15171a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
    const sx = canvas.width / C.WORLD.w;
    const sy = canvas.height / C.WORLD.h;
    for (const station of snap?.stations || []) {
      if (station.done) continue;
      ctx.fillStyle = '#f2df6a';
      ctx.beginPath();
      ctx.arc(station.x * sx, station.y * sy, 5, 0, Math.PI * 2);
      ctx.fill();
    }
    for (const player of snap?.players || []) {
      if (!player.alive) continue;
      ctx.fillStyle = player.id === selfId ? '#ffffff' : colorHex(player.color);
      ctx.strokeStyle = '#0d0e10';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc((player.x + C.PLAYER_W / 2) * sx, (player.y + C.PLAYER_H / 2) * sy, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }
  }

  /* ── input ───────────────────────────────────────────────────────────── */

  function walkVector() {
    let x = 0;
    let y = 0;
    if (keys.has('a') || keys.has('arrowleft')) x -= 1;
    if (keys.has('d') || keys.has('arrowright')) x += 1;
    if (keys.has('w') || keys.has('arrowup')) y -= 1;
    if (keys.has('s') || keys.has('arrowdown')) y += 1;
    return { x, y };
  }

  function pushWalk() {
    const dir = walkVector();
    if (dir.x === sentDir.x && dir.y === sentDir.y) return;
    sentDir = dir;
    if (dir.x || dir.y) send({ t: 'walk', dx: dir.x, dy: dir.y });
    else send({ t: 'stop' });
  }

  function send(message) {
    if (!session) return;
    session.send(message);
  }

  function trigger(action) {
    if (!snap) return;
    if (action === 'use' && snap.actions.use) openTask(snap.actions.use);
    if (action === 'gas' && snap.actions.gas) send({ t: 'use', station: 'gascan' });
    if (action === 'kill' && snap.actions.kill) send({ t: 'kill', target: snap.actions.kill });
    if (action === 'vent' && snap.actions.vent) {
      send({ t: 'vent' });
      toast('Through the vent.');
    }
    if (action === 'report' && snap.actions.report) send({ t: 'report', body: snap.actions.report });
    if (action === 'button' && snap.actions.button) send({ t: 'button' });
    if (action === 'fix' && snap.actions.fix) send({ t: 'fix' });
    if (action === 'lights') send({ t: 'sabotage', kind: 'lights' });
    if (action === 'reactor') send({ t: 'sabotage', kind: 'reactor' });
  }

  function pointerTarget(event) {
    const canvas = $('board');
    const rect = canvas.getBoundingClientRect();
    if (!rect.width || !rect.height) return null;
    const scale = Math.min(rect.width / C.VIEW.w, rect.height / C.VIEW.h);
    const viewW = rect.width / scale;
    const viewH = rect.height / scale;
    const me = snap?.players.find(player => player.id === selfId);
    const focus = selfView || { x: me?.x || 0, y: me?.y || 0 };
    const centreX = focus.x + C.PLAYER_W / 2;
    const centreY = focus.y + C.PLAYER_H / 2;
    const camX = C.WORLD.w <= viewW ? (C.WORLD.w - viewW) / 2 : Math.min(Math.max(0, centreX - viewW / 2), C.WORLD.w - viewW);
    const camY = C.WORLD.h <= viewH ? (C.WORLD.h - viewH) / 2 : Math.min(Math.max(0, centreY - viewH / 2), C.WORLD.h - viewH);
    return {
      x: (event.clientX - rect.left) / scale + camX,
      y: (event.clientY - rect.top) / scale + camY,
    };
  }

  const overlayOpen = () => !$('overlay-task').hidden || !$('overlay-list').hidden;

  window.addEventListener('keydown', event => {
    if (event.target instanceof HTMLElement && event.target.matches('input, select, textarea')) return;
    const key = event.key.toLowerCase();
    if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' ', 'tab'].includes(key)) event.preventDefault();

    if (key === 'escape') {
      if (!$('overlay-list').hidden) $('overlay-list').hidden = true;
      else if (!$('overlay-task').hidden) closeTask();
      return;
    }
    if (overlayOpen()) return;

    if (key === 'tab' || key === 't') {
      if (snap && snap.phase !== 'lobby') openList('tasks');
      return;
    }
    if (key === 'm') {
      if (snap && snap.phase !== 'lobby') openList('map');
      return;
    }
    // game.py's keys: Space interacts/uses, Enter kills, Alt changes vent,
    // Ctrl cuts the lights, Shift sabotages the reactor.
    if (key === ' ' || key === 'spacebar') {
      if (snap?.actions.fix) trigger('fix');
      else if (snap?.actions.use) trigger('use');
      else trigger('button');
      return;
    }
    if (key === 'enter') {
      trigger('kill');
      return;
    }
    if (key === 'r') {
      trigger('report');
      return;
    }
    if (key === 'alt') {
      trigger('vent');
      return;
    }
    if (key === ' ') {
      trigger('vent');
      return;
    }
    if (key === 'control') {
      trigger('lights');
      return;
    }
    if (key === 'shift') {
      trigger('reactor');
      return;
    }
    if (['w', 'a', 's', 'd', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(key)) {
      keys.add(key);
      pushWalk();
    }
  });

  window.addEventListener('keyup', event => {
    const key = event.key.toLowerCase();
    if (keys.delete(key)) pushWalk();
  });

  window.addEventListener('blur', () => {
    keys.clear();
    pushWalk();
  });

  // Touch: drag anywhere on the ship and the crewmate walks that way.
  let lastGoto = 0;
  $('board').addEventListener('pointerdown', event => {
    if (overlayOpen()) return;
    const target = pointerTarget(event);
    if (!target) return;
    lastGoto = performance.now();
    send({ t: 'goto', x: target.x - C.PLAYER_W / 2, y: target.y - C.PLAYER_H / 2 });
  });

  $('board').addEventListener('pointermove', event => {
    if (!event.buttons || overlayOpen()) return;
    if (performance.now() - lastGoto < 90) return;
    const target = pointerTarget(event);
    if (!target) return;
    lastGoto = performance.now();
    send({ t: 'goto', x: target.x - C.PLAYER_W / 2, y: target.y - C.PLAYER_H / 2 });
  });

  $('public-join').addEventListener('click', () => openSession({ mode: 'public', code: '', intent: 'join' }));
  $('create').addEventListener('click', () => {
    const code = N.makeCode();
    openSession({ mode: 'private', code, intent: 'host' });
  });
  $('join').addEventListener('click', () => {
    const code = ($('code').value || '').trim().toUpperCase();
    if (code.length !== 4) {
      menuStatus('Room codes are four characters.', true);
      return;
    }
    openSession({ mode: 'private', code, intent: 'join' });
  });
  $('leave').addEventListener('click', leave);
  $('start').addEventListener('click', () => send({ t: 'start' }));
  $('back-lobby').addEventListener('click', () => send({ t: 'lobby' }));
  $('act-use').addEventListener('click', () => trigger('use'));
  $('act-gas').addEventListener('click', () => trigger('gas'));
  $('act-kill').addEventListener('click', () => trigger('kill'));
  $('act-vent').addEventListener('click', () => trigger('vent'));
  $('act-report').addEventListener('click', () => trigger('report'));
  $('act-button').addEventListener('click', () => trigger('button'));
  $('act-fix').addEventListener('click', () => trigger('fix'));
  $('sab-lights').addEventListener('click', () => trigger('lights'));
  $('sab-reactor').addEventListener('click', () => trigger('reactor'));
  $('open-tasks').addEventListener('click', () => openList('tasks'));
  $('open-map').addEventListener('click', () => openList('map'));
  $('skip').addEventListener('click', () => send({ t: 'vote', target: 'skip' }));
  $('task-close').addEventListener('click', closeTask);
  $('list-close').addEventListener('click', () => { $('overlay-list').hidden = true; });

  $('copy').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(snap?.code || '');
      toast('Code copied.');
    } catch {
      toast(`Code: ${snap?.code || ''}`);
    }
  });

  for (const id of ['set-impostors', 'set-cooldown']) {
    $(id).addEventListener('change', () => {
      send({
        t: 'settings',
        settings: {
          impostors: Number($('set-impostors').value),
          killCooldownSec: Number($('set-cooldown').value),
        },
      });
    });
  }

  window.addEventListener('beforeunload', () => {
    try {
      session?.close();
    } catch {}
  });

  try {
    $('name').value = localStorage.getItem('bored.imposter.name') || '';
  } catch {}

  // Test hooks: the snapshot is read-only, and the task windows can be opened
  // on their own so a suite can check the ported screens without a round.
  window.__imposterOpenTask = id => openTask(id);
  window.__imposterOpenMap = () => openList('map');
  window.__imposterTest = () => (snap
    ? { phase: snap.phase, code: snap.code, net: snap.net, you: snap.you, players: snap.players, bodies: snap.bodies, meeting: snap.meeting, tasks: snap.tasks, sabotage: snap.sabotage, actions: snap.actions }
    : null);

  show('menu');
  menuStatus('');
  if (typeof Peer === 'undefined') {
    menuStatus('PeerJS did not load. Imposter needs an internet connection.', true);
  }
  requestAnimationFrame(draw);
})();

</script>
</body>
</html>
