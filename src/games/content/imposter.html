  /* ── drawing ─────────────────────────────────────────────────────────── */

  /* ── art ─────────────────────────────────────────────────────────────── */

  // Frames, vent grate, dead body, meeting screen, lobby art and the display
  // font are the ones from arizkhalid/among-us-clone (MIT, see imposter/LICENSE).
  const ART = { idle: new Image(), walk: [], vent: new Image(), body: new Image() };
  ART.idle.src = asset('crew-idle.png');
  ART.vent.src = asset('vent.png');
  ART.body.src = asset('body.png');
  for (let frame = 1; frame <= 12; frame += 1) {
    const image = new Image();
    image.src = asset('crew-walk-' + String(frame).padStart(2, '0') + '.png');
    ART.walk.push(image);
  }
  const drawn = image => image.complete && image.naturalWidth > 0;

  function theme() {
    if (!palette) {
      const css = getComputedStyle(document.documentElement);
      const read = name => css.getPropertyValue(name).trim();
      palette = {
        paper: read('--paper'), ink: read('--ink'), dim: read('--dim'),
        rule: read('--rule'), red: read('--red'), green: read('--green'),
        gold: read('--gold'), sunk: read('--sunk'),
      };
    }
    return palette;
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // The crew sheet is one fixed colour, so a seat's colour rides on the ring
  // under each player rather than repainting the art.
  const seats = new Map();

  function look(player) {
    const previous = seats.get(player.id);
    const dx = previous ? player.x - previous.x : 0;
    const dy = previous ? player.y - previous.y : 0;
    const moving = Math.hypot(dx, dy) > 0.3;
    const face = dx < -0.15 ? -1 : dx > 0.15 ? 1 : previous ? previous.face : 1;
    seats.set(player.id, { x: player.x, y: player.y, face });
    return { moving, face };
  }

  function draw() {
    requestAnimationFrame(draw);
    tickToast();
    if (!snap || screens.game.hidden) return;

    const canvas = $('board');
    const stage = canvas.parentElement;
    const width = stage.clientWidth;
    const height = stage.clientHeight;
    if (!width || !height) return;

    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const pixelWidth = Math.round(width * dpr);
    const pixelHeight = Math.round(height * dpr);
    if (canvas.width !== pixelWidth || canvas.height !== pixelHeight) {
      canvas.width = pixelWidth;
      canvas.height = pixelHeight;
    }

    const ctx = canvas.getContext('2d');
    const colors = theme();
    const scale = Math.min(width / C.WORLD.w, height / C.WORLD.h);
    const offX = (width - C.WORLD.w * scale) / 2;
    const offY = (height - C.WORLD.h * scale) / 2;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, width, height);

    ctx.save();
    ctx.translate(offX, offY);
    ctx.scale(scale, scale);

    ctx.fillStyle = colors.sunk;
    for (const rect of C.FLOOR) ctx.fillRect(rect.x, rect.y, rect.w, rect.h);

    ctx.strokeStyle = 'rgba(120,190,255,.22)';
    ctx.lineWidth = 1.2;
    for (const room of C.ROOMS) ctx.strokeRect(room.x + 0.5, room.y + 0.5, room.w - 1, room.h - 1);

    ctx.fillStyle = 'rgba(198,222,255,.75)';
    ctx.font = '11px "AmongUs", Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (const room of C.ROOMS) {
      ctx.fillText(room.name.toUpperCase(), room.x + room.w / 2, room.y + 13);
    }

    const you = snap.you;
    for (const station of C.STATIONS) {
      const mine = you?.tasks?.some(task => task.id === station.id);
      const done = you?.tasks?.some(task => task.id === station.id && task.done);
      if (mine && !done) {
        ctx.fillStyle = colors.gold;
        ctx.fillRect(station.x - 3.5, station.y - 3.5, 7, 7);
        ctx.font = '9px "AmongUs", Arial, sans-serif';
        ctx.fillStyle = '#ffe98a';
        ctx.fillText(station.label, station.x, station.y + 12);
      } else if (done) {
        ctx.strokeStyle = 'rgba(76,224,165,.55)';
        ctx.lineWidth = 1.4;
        ctx.strokeRect(station.x - 3.5, station.y - 3.5, 7, 7);
      } else {
        ctx.strokeStyle = 'rgba(160,190,230,.35)';
        ctx.lineWidth = 1.1;
        ctx.strokeRect(station.x - 3, station.y - 3, 6, 6);
      }
    }

    // Vents: a grate everyone can see; only the impostor gets the prompt and
    // the jump between the pair.
    for (const vent of C.VENTS) {
      const near = snap.actions.vent === vent.id;
      if (drawn(ART.vent)) {
        // A dark plate under the vent pose so a grate never reads as a player.
        ctx.fillStyle = 'rgba(6,11,22,.92)';
        roundRect(ctx, vent.x - 9, vent.y - 8, 18, 16, 4);
        ctx.fill();
        ctx.strokeStyle = 'rgba(120,190,255,.35)';
        ctx.lineWidth = 1;
        ctx.stroke();
        const ventHeight = 17;
        const ventWidth = ventHeight * (ART.vent.naturalWidth / ART.vent.naturalHeight);
        if (you?.role === 'impostor') {
          ctx.beginPath();
          ctx.ellipse(vent.x, vent.y + 5, ventWidth * 0.7, 3.2, 0, 0, Math.PI * 2);
          ctx.strokeStyle = near ? colors.red : 'rgba(233,69,96,.45)';
          ctx.lineWidth = 1.4;
          ctx.stroke();
        }
        ctx.drawImage(ART.vent, vent.x - ventWidth / 2, vent.y - ventHeight / 2, ventWidth, ventHeight);
      } else {
        ctx.strokeStyle = you?.role === 'impostor' ? colors.red : colors.dim;
        ctx.lineWidth = 1;
        ctx.strokeRect(vent.x - 6, vent.y - 4, 12, 8);
      }
      if (near) {
        ctx.font = '10px "AmongUs", Arial, sans-serif';
        ctx.fillStyle = colors.red;
        ctx.fillText('VENT', vent.x, vent.y - 14);
      }
    }

    ctx.beginPath();
    ctx.arc(C.BUTTON.x, C.BUTTON.y, 10, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(233,69,96,.85)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.7)';
    ctx.lineWidth = 1.6;
    ctx.stroke();

    for (const body of snap.bodies) {
      if (drawn(ART.body)) {
        const bodyHeight = 20;
        const bodyWidth = bodyHeight * (ART.body.naturalWidth / ART.body.naturalHeight);
        ctx.save();
        ctx.translate(body.x, body.y);
        ctx.rotate(Math.PI / 2);
        ctx.drawImage(ART.body, -bodyWidth / 2, -bodyHeight / 2, bodyWidth, bodyHeight);
        ctx.restore();
      } else {
        ctx.strokeStyle = colors.red;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(body.x - 6, body.y - 6);
        ctx.lineTo(body.x + 6, body.y + 6);
        ctx.moveTo(body.x + 6, body.y - 6);
        ctx.lineTo(body.x - 6, body.y + 6);
        ctx.stroke();
      }
    }

    const phase = Math.floor(performance.now() / 95);
    for (const player of snap.players) {
      const isSelf = player.id === selfId;
      if (!player.alive && !isSelf) continue;
      const style = look(player);
      ctx.globalAlpha = player.alive ? 1 : 0.32;

      ctx.beginPath();
      ctx.ellipse(player.x, player.y + 9, 10, 3.6, 0, 0, Math.PI * 2);
      ctx.strokeStyle = colorHex(player.color);
      ctx.lineWidth = 2.6;
      ctx.stroke();

      const image = style.moving ? ART.walk[phase % ART.walk.length] : ART.idle;
      if (drawn(image)) {
        const crewHeight = 27;
        const crewWidth = crewHeight * (image.naturalWidth / image.naturalHeight);
        const bob = style.moving ? Math.sin(phase * 0.9) : 0;
        ctx.save();
        ctx.translate(player.x, player.y + bob);
        ctx.scale(style.face, 1);
        ctx.drawImage(image, -crewWidth / 2, 8 - crewHeight, crewWidth, crewHeight);
        ctx.restore();
      } else {
        ctx.fillStyle = colorHex(player.color);
        roundRect(ctx, player.x - 7, player.y - 9, 14, 18, 5);
        ctx.fill();
      }

      if (player.teammate) {
        ctx.beginPath();
        ctx.arc(player.x, player.y - 18, 11, 0, Math.PI * 2);
        ctx.strokeStyle = colors.red;
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      ctx.globalAlpha = 1;
      ctx.fillStyle = isSelf ? colors.gold : '#eaf2ff';
      ctx.font = (isSelf ? 'bold ' : '') + '10px "AmongUs", Arial, sans-serif';
      ctx.fillText(player.name, player.x, player.y + 20);
    }

    ctx.restore();
  }

  /* ── input ───────────────────────────────────────────────────────────── */

  function walkVector() {
    let x = 0;
    let y = 0;
    if (keys.has('a') || keys.has('arrowleft')) x -= 1;
    if (keys.has('d') || keys.has('arrowright')) x += 1;
    if (keys.has('w') || keys.has('arrowup')) y -= 1;
    if (keys.has('s') || keys.has('arrowdown')) y += 1;
    return { x, y };
  }

  function pushWalk() {
    const dir = walkVector();
    if (dir.x === sentDir.x && dir.y === sentDir.y) return;
    sentDir = dir;
    if (dir.x || dir.y) send({ t: 'walk', dx: dir.x, dy: dir.y });
    else send({ t: 'stop' });
  }

  function send(message) {
    if (!session) return;
    session.send(message);
  }

  function trigger(action) {
    if (!snap) return;
    if (action === 'use' && snap.actions.use) send({ t: 'task', station: snap.actions.use });
    if (action === 'kill' && snap.actions.kill) send({ t: 'kill', target: snap.actions.kill });
    if (action === 'vent' && snap.actions.vent) {
      send({ t: 'vent', vent: snap.actions.vent });
      toast('Through the vent.');
    }
    if (action === 'report' && snap.actions.report) send({ t: 'report', body: snap.actions.report });
    if (action === 'button' && snap.actions.button) send({ t: 'button' });
  }

  function pointerTarget(event) {
    const canvas = $('board');
    const rect = canvas.getBoundingClientRect();
    if (!rect.width || !rect.height) return null;
    const scale = Math.min(rect.width / C.WORLD.w, rect.height / C.WORLD.h);
    const offX = (rect.width - C.WORLD.w * scale) / 2;
    const offY = (rect.height - C.WORLD.h * scale) / 2;
    return {
      x: (event.clientX - rect.left - offX) / scale,
      y: (event.clientY - rect.top - offY) / scale,
    };
  }

  const keyActions = { e: 'use', q: 'kill', f: 'vent', r: 'report', m: 'button' };

  window.addEventListener('keydown', event => {
    if (event.target instanceof HTMLElement && event.target.matches('input, select, textarea')) return;
    const key = event.key.toLowerCase();
    if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(key)) event.preventDefault();
    if (keyActions[key]) {
      trigger(keyActions[key]);
      return;
    }
    if (['w', 'a', 's', 'd', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(key)) {
      keys.add(key);
      pushWalk();
    }
  });

  window.addEventListener('keyup', event => {
    const key = event.key.toLowerCase();
    if (keys.delete(key)) pushWalk();
  });

  window.addEventListener('blur', () => {
    keys.clear();
    pushWalk();
  });

  $('board').addEventListener('pointerdown', event => {
    const target = pointerTarget(event);
    if (!target) return;
    lastGoto = performance.now();
    send({ t: 'goto', x: target.x, y: target.y });
  });

  $('board').addEventListener('pointermove', event => {
    if (!event.buttons) return;
    if (performance.now() - lastGoto < 90) return;
    const target = pointerTarget(event);
    if (!target) return;
    lastGoto = performance.now();
    send({ t: 'goto', x: target.x, y: target.y });
  });

  $('public-join').addEventListener('click', () => openSession({ mode: 'public', code: '', intent: 'join' }));
  $('create').addEventListener('click', () => {
    const code = N.makeCode();
    openSession({ mode: 'private', code, intent: 'host' });
  });
  $('join').addEventListener('click', () => {
    const code = ($('code').value || '').trim().toUpperCase();
    if (code.length !== 4) {
      menuStatus('Room codes are four characters.', true);
      return;
    }
    openSession({ mode: 'private', code, intent: 'join' });
  });
  $('leave').addEventListener('click', leave);
  $('start').addEventListener('click', () => send({ t: 'start' }));
  $('back-lobby').addEventListener('click', () => send({ t: 'lobby' }));
  $('act-use').addEventListener('click', () => trigger('use'));
  $('act-kill').addEventListener('click', () => trigger('kill'));
  $('act-vent').addEventListener('click', () => trigger('vent'));
  $('act-report').addEventListener('click', () => trigger('report'));
  $('act-button').addEventListener('click', () => trigger('button'));
  $('skip').addEventListener('click', () => send({ t: 'vote', target: 'skip' }));

  $('copy').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(session ? snap?.code || '' : '');
      toast('Code copied.');
    } catch {
      toast(`Code: ${snap?.code || ''}`);
    }
  });

  for (const id of ['set-impostors', 'set-cooldown', 'set-tasks']) {
    $(id).addEventListener('change', () => {
      send({
        t: 'settings',
        settings: {
          impostors: Number($('set-impostors').value),
          killCooldownSec: Number($('set-cooldown').value),
          tasksPerPlayer: Number($('set-tasks').value),
        },
      });
    });
  }

  window.addEventListener('beforeunload', () => {
    try {
      session?.close();
    } catch {}
  });

  try {
    $('name').value = localStorage.getItem('bored.imposter.name') || '';
  } catch {}

  // The snapshot a player already holds, read-only, for the browser suites.
  window.__imposterTest = () => (snap
    ? { phase: snap.phase, code: snap.code, net: snap.net, you: snap.you, players: snap.players, bodies: snap.bodies, meeting: snap.meeting }
    : null);

  show('menu');
  menuStatus('');
  if (typeof Peer === 'undefined') {
    menuStatus('PeerJS did not load. Imposter needs an internet connection.', true);
  }
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
