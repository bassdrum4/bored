<script id="imposter-net">
/* Signaling over Supabase Broadcast, game state over WebRTC.

   The 10 Hz snapshots still travel through a data channel between the browsers;
   only the introductions go through the relay. That is the whole point of the
   change: PeerJS's public broker (0.peerjs.com) answered every join with its own
   id registry, so a broker hiccup or a rate limit looked like "no room with that
   code". A Realtime channel has no id registry to lose — the room is a topic,
   `imposter-<CODE>` or `imposter-PUBLIC`, and it exists while anybody is in it.

   Message flow, all broadcast on the room topic:
     hello   a client knocking; a host answers by offering
     host    a host saying who it is (also the election's tie-break input)
     offer   host -> one client, carrying the data channel it just created
     answer  client -> host
     ice     trickled both ways, addressed to one peer
     bye     a seat leaving on purpose

   The host makes every offer because it owns the data channel, so there is no
   offer glare to resolve. A client that loses its channel just knocks again and
   gets a fresh offer, which is what makes a failed join cheap now.

   Election keeps its old shape: the host mirrors the round to the next player in
   the ring, and when the host goes quiet the ring's first player claims the room
   in the same topic. Two claims are settled by rank and then by peer id, and the
   loser steps down and re-knocks, so the room cannot end up with two chairs. */
window.ImposterNet = (function () {
  'use strict';

  const C = window.ImposterCore;
  const PROTOCOL = 'bored-imposter/3';
  const ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const TOPIC = 'imposter-';
  const HOST_TIMEOUT = 3000;
  const ALIVE_MS = 2000;
  const KNOCK_MS = 900;
  const MISSING_MS = 6000;
  // A fresh offer needs this long to finish negotiating before another knock
  // replaces it; the host will not re-offer before OFFER_GRACE either.
  const LINK_GRACE = 7000;
  const OFFER_GRACE = 2500;
  const ICE_SERVERS = [{ urls: ['stun:stun.l.google.com:19302'] }];

  // The project and publishable key the hub already ships (src/hub/backend.js).
  // Both are public: RLS is what protects the tables, and a Realtime channel is
  // a relay, not a store. Overridable so the hub can inject them later.
  const FALLBACK_RELAY = {
    url: 'https://djdpttltfmwkofdrvkem.supabase.co',
    key: 'sb_publishable_Ayx7pzjm55vlzQ4u8se9KA_O97WK-QZ',
  };
  function relayConfig() {
    const injected = globalThis.__boredRealtime;
    return {
      url: (injected && injected.url) || FALLBACK_RELAY.url,
      key: (injected && injected.key) || FALLBACK_RELAY.key,
    };
  }

  const PeerConnection = globalThis.RTCPeerConnection || globalThis.webkitRTCPeerConnection;
  const supported = Boolean(PeerConnection && globalThis.WebSocket);

  const roomIdFor = code => TOPIC + String(code || '').toUpperCase();
  const PUBLIC_ID = roomIdFor('PUBLIC');

  function makeCode(rng = Math.random) {
    let code = '';
    for (let index = 0; index < 4; index += 1) {
      code += ALPHABET[Math.floor(rng() * ALPHABET.length)];
    }
    return code;
  }

  /* ── the relay: one Supabase Realtime channel, broadcast only ─────────── */

  // Same Phoenix channel protocol the hub speaks in src/hub/realtime.js, cut
  // down to what signaling needs: join, broadcast both ways, heartbeat, backoff.
  function createRelay({ url, key, channel, onMessage, onOpen, onDown }) {
    // Realtime answers only on realtime:<channel>; the bare name is "unmatched topic".
    const topic = 'realtime:' + channel;
    const endpoint = String(url).replace(/\/+$/, '').replace(/^http/, 'ws') +
      '/realtime/v1/websocket?apikey=' + encodeURIComponent(key) + '&vsn=1.0.0';
    const backoff = [600, 1200, 2400, 4800, 9000];
    let socket = null, joinRef = '', ref = 0, joined = false, closed = false;
    let attempt = 0, missed = 0, retryTimer = 0, beatTimer = 0, joinTimer = 0;

    function frame(event, payload, to) {
      ref += 1;
      return JSON.stringify({ topic: to || topic, event, payload, ref: String(ref), join_ref: joinRef });
    }

    function push(event, payload) {
      if (!socket || socket.readyState !== 1 || !joined) return false;
      try {
        socket.send(frame(event, payload));
        return true;
      } catch {
        return false;
      }
    }

    function beat() {
      if (!socket || socket.readyState !== 1) return;
      try {
        socket.send(frame('heartbeat', {}, 'phoenix'));
      } catch { /* the close handler follows */ }
    }

    function down(reason) {
      const was = joined;
      joined = false;
      clearInterval(beatTimer);
      clearTimeout(joinTimer);
      beatTimer = 0;
      joinTimer = 0;
      const old = socket;
      socket = null;
      if (old) {
        try { old.close(); } catch { /* already closed */ }
      }
      if (onDown) onDown(reason || 'The relay closed.', was);
      if (closed) return;
      const base = backoff[Math.min(attempt, backoff.length - 1)];
      attempt += 1;
      clearTimeout(retryTimer);
      retryTimer = setTimeout(connect, base + Math.floor(Math.random() * base * 0.3));
    }

    function receive(raw) {
      let message;
      try {
        message = JSON.parse(raw);
      } catch {
        return;
      }
      if (!message || typeof message !== 'object') return;
      if (message.event === 'phx_reply') {
        if (message.topic === 'phoenix') {
          missed = 0;
          return;
        }
        if (message.topic !== topic || message.ref !== joinRef) return;
        const reply = message.payload || {};
        if (reply.status === 'ok') {
          clearTimeout(joinTimer);
          joinTimer = 0;
          joined = true;
          attempt = 0;
          missed = 0;
          beatTimer = setInterval(() => {
            if (missed >= 2) {
              down('The relay stopped answering.');
              return;
            }
            missed += 1;
            beat();
          }, 25000);
          if (onOpen) onOpen();
        } else {
          down((reply.response && reply.response.reason) || 'The relay refused the channel.');
        }
        return;
      }
      if (message.topic !== topic) return;
      if (message.event === 'broadcast') {
        const body = message.payload || {};
        if (onMessage) onMessage(String(body.event || ''), body.payload || {});
      } else if (message.event === 'phx_error' || message.event === 'phx_close') {
        down('The channel closed.');
      }
    }

    function connect() {
      if (closed || socket) return;
      let mine;
      try {
        mine = new WebSocket(endpoint);
      } catch {
        if (onDown) onDown('The relay is unreachable.', false);
        return;
      }
      socket = mine;
      mine.onopen = () => {
        if (mine !== socket) return;
        ref += 1;
        joinRef = String(ref);
        try {
          mine.send(JSON.stringify({
            topic,
            event: 'phx_join',
            payload: {
              config: {
                broadcast: { ack: false, self: false },
                presence: { key: '' },
                postgres_changes: [],
                private: false,
              },
              access_token: key,
            },
            ref: joinRef,
            join_ref: joinRef,
          }));
        } catch { /* the close handler follows */ }
        joinTimer = setTimeout(() => {
          if (mine === socket && !joined) down('The relay did not answer.');
        }, 10000);
      };
      mine.onmessage = event => {
        if (mine === socket) receive(event.data);
      };
      mine.onclose = () => {
        if (mine !== socket) return;
        socket = null;
        down('The relay connection closed.');
      };
      mine.onerror = () => { /* onclose follows */ };
    }

    connect();

    return {
      isOpen: () => joined,
      send(event, payload) {
        return push('broadcast', { type: 'broadcast', event, payload });
      },
      reconnect() {
        if (closed || socket) return;
        attempt = 0;
        clearTimeout(retryTimer);
        connect();
      },
      close() {
        closed = true;
        clearTimeout(retryTimer);
        clearInterval(beatTimer);
        clearTimeout(joinTimer);
        const old = socket;
        socket = null;
        if (old) {
          try {
            if (old.readyState === 1) old.send(frame('phx_leave', {}));
          } catch { /* closing anyway */ }
          try { old.close(); } catch { /* already closed */ }
        }
        joined = false;
      },
    };
  }

  /* ── one player's session ─────────────────────────────────────────────── */

  function createSession({ mode = 'public', code = '', intent = 'join', name = 'Crewmate', onSnapshot, onEvent, onStatus }) {
    const roomId = mode === 'public' ? PUBLIC_ID : roomIdFor(code);
    const clientId = globalThis.crypto && crypto.randomUUID
      ? crypto.randomUUID()
      : 'p-' + Math.random().toString(36).slice(2, 12);

    if (!supported) {
      return {
        unavailable: true,
        supported: false,
        roomId,
        send() {},
        close() {},
        hosting: false,
        publicRoom: mode === 'public',
      };
    }

    let relay = null;
    let host = null;
    let link = null;            // the one channel a client has, to the host
    let linkAt = 0;             // when that offer arrived, for the grace window
    let hostPeer = '';
    let lastHostSeen = 0;
    let claimRank = 0;
    let mirror = null;
    let rank = 0;
    let joinedAt = 0;
    let lastSnap = 0;
    let closed = false;
    let recovery = null;
    let ticker = 0;
    let aliveTimer = 0;
    let knockTimer = 0;
    let watchdog = 0;
    let kick = null;

    const peers = new Map();    // host side: peer id -> { pc, channel, send }

    const status = payload => {
      if (!closed) onStatus(payload);
    };

    function sendRelay(event, payload) {
      if (!relay) return false;
      try {
        return relay.send(event, payload);
      } catch {
        return false;
      }
    }

    /* ── WebRTC plumbing ───────────────────────────────────────────────── */

    function makeConnection(peerId) {
      const pc = new PeerConnection({ iceServers: ICE_SERVERS });
      pc.onicecandidate = event => {
        if (!event.candidate) return;
        const candidate = typeof event.candidate.toJSON === 'function' ? event.candidate.toJSON() : event.candidate;
        sendRelay('ice', { from: clientId, to: peerId, c: candidate });
      };
      return pc;
    }

    function channelWriter(channel) {
      return message => {
        if (!channel || channel.readyState !== 'open') return;
        // Snapshots are disposable: if the link is backed up, sending another
        // one only adds delay, so drop it and let the next frame be current.
        if (message.t === 'snap' && channel.bufferedAmount > 192 * 1024
          && !message.s.roster && !message.s.stations && !message.s.settings) return;
        try {
          channel.send(JSON.stringify(message));
        } catch { /* it closed between the check and the send */ }
      };
    }

    function dropPeer(peerId, detach = true) {
      const entry = peers.get(peerId);
      if (!entry) return;
      peers.delete(peerId);
      try { entry.channel?.close(); } catch { /* already closed */ }
      try { entry.pc?.close(); } catch { /* already closed */ }
      if (!host) return;
      if (detach) host.detach(peerId);
      else host.suspend(peerId);
    }

    function dropLink() {
      const entry = link;
      link = null;
      linkAt = 0;
      hostPeer = '';
      if (!entry) return;
      try { entry.channel?.close(); } catch { /* already closed */ }
      try { entry.pc?.close(); } catch { /* already closed */ }
    }

    function attachHostChannel(peerId, channel) {
      const entry = peers.get(peerId);
      if (!entry) return;
      entry.channel = channel;
      entry.send = channelWriter(channel);
      channel.onmessage = event => {
        let data;
        try {
          data = JSON.parse(event.data);
        } catch {
          return;
        }
        if (!host || !data || typeof data !== 'object') return;
        if (data.t === 'hello') {
          const result = host.admit(peerId, data.name, entry.send, data.playerId);
          if (result.error) {
            entry.send({ t: 'reject', error: result.error });
            setTimeout(() => dropPeer(peerId), 80);
          }
        } else if (data.t === 'input') {
          const seat = host.seatOf(peerId);
          if (seat) host.receive(seat, data.m);
        }
      };
      // A closed channel is not a lost seat yet: the client re-knocks and gets a
      // fresh offer with the same playerId, which lands on the seat it already
      // had. Give it that window before the room hears about a departure.
      channel.onclose = () => {
        setTimeout(() => {
          const at = peers.get(peerId);
          if (at && at.channel === channel && channel.readyState !== 'open') dropPeer(peerId, false);
        }, 2500);
      };
    }

    function connectPeer(peerId) {
      if (!host || closed) return;
      const existing = peers.get(peerId);
      if (existing && existing.channel && existing.channel.readyState === 'open') return;
      // An offer that is still negotiating must not be replaced: tearing it down
      // for the next knock is what used to leave a guest on "Connecting…".
      if (existing && Date.now() - (existing.at || 0) < OFFER_GRACE) return;
      // A stale entry is replaced without detaching, so the re-knock keeps the seat.
      if (existing) dropPeer(peerId, false);

      let pc;
      try {
        pc = makeConnection(peerId);
      } catch {
        return;
      }
      const entry = { pc, channel: null, send: null, at: Date.now() };
      peers.set(peerId, entry);

      const channel = pc.createDataChannel('game', { ordered: true });
      attachHostChannel(peerId, channel);

      pc.onconnectionstatechange = () => {
        if (peers.get(peerId) !== entry) return;
        // A blip keeps the seat: the client re-knocks with the same playerId and
        // lands back on it. A real departure is pruned by absence, or by `bye`.
        if (pc.connectionState === 'failed' || pc.connectionState === 'closed') dropPeer(peerId, false);
        else if (pc.connectionState === 'disconnected') {
          setTimeout(() => {
            if (peers.get(peerId) === entry && pc.connectionState === 'disconnected') dropPeer(peerId, false);
          }, 6000);
        }
      };

      pc.createOffer()
        .then(offer => pc.setLocalDescription(offer))
        .then(() => sendRelay('offer', { from: clientId, to: peerId, sdp: pc.localDescription.sdp }))
        .catch(() => dropPeer(peerId, false));
    }

    async function acceptOffer(from, sdp) {
      if (host || closed || !sdp) return;
      dropLink();
      let pc;
      try {
        pc = makeConnection(from);
      } catch {
        return;
      }
      const entry = { pc, channel: null, send: null, pid: from };
      link = entry;
      linkAt = Date.now();
      hostPeer = from;

      pc.ondatachannel = event => {
        const channel = event.channel;
        entry.channel = channel;
        entry.send = channelWriter(channel);
        channel.onopen = () => {
          if (closed) return;
          lastSnap = Date.now();
          recovery = null;
          rank = 0;
          stopKnock();
          try {
            channel.send(JSON.stringify({ t: 'hello', protocol: PROTOCOL, name, playerId: clientId }));
          } catch { /* the close handler follows */ }
          startWatchdog();
          status({ state: 'joined' });
        };
        channel.onmessage = message => {
          let data;
          try {
            data = JSON.parse(message.data);
          } catch {
            return;
          }
          handleData(data);
        };
        channel.onclose = () => {
          if (link === entry && !host) onHostGone();
        };
      };

      pc.onconnectionstatechange = () => {
        if (link !== entry || host) return;
        if (pc.connectionState === 'failed' || pc.connectionState === 'closed') onHostGone();
      };

      try {
        await pc.setRemoteDescription({ type: 'offer', sdp });
        await flushIce(entry);
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        sendRelay('answer', { from: clientId, to: from, sdp: pc.localDescription.sdp });
      } catch {
        if (link === entry && !host) onHostGone();
      }
    }

    async function acceptAnswer(from, sdp) {
      const entry = peers.get(from);
      if (!entry || !sdp) return;
      try {
        await entry.pc.setRemoteDescription({ type: 'answer', sdp });
        await flushIce(entry);
      } catch { /* the offer is gone; the peer will knock again */ }
    }

    // Candidates are trickled as soon as they exist, which is usually before the
    // other side has applied its description. Dropping those loses the pair the
    // connection needs, so hold them until there is somewhere to put them.
    function queueIce(entry, candidate) {
      if (!entry || !candidate) return;
      if (entry.pc.remoteDescription && entry.pc.remoteDescription.type) {
        entry.pc.addIceCandidate(candidate).catch(() => { /* stale */ });
        return;
      }
      (entry.ice || (entry.ice = [])).push(candidate);
    }

    async function flushIce(entry) {
      const list = entry && entry.ice;
      if (!list || !list.length) return;
      entry.ice = [];
      for (const candidate of list) {
        try {
          await entry.pc.addIceCandidate(candidate);
        } catch { /* stale */ }
      }
    }

    function acceptIce(from, candidate) {
      queueIce(peers.get(from) || (link && link.pid === from ? link : null), candidate);
    }

    /* ── knocking, hosting, and who holds the chair ────────────────────── */

    function knock() {
      if (closed || host) return;
      sendRelay('hello', { from: clientId, name });
    }

    function stopKnock() {
      if (knockTimer) clearInterval(knockTimer);
      knockTimer = 0;
    }

    function startKnock() {
      if (knockTimer || closed) return;
      joinedAt = Date.now();
      knock();
      knockTimer = setInterval(() => {
        if (closed || host) return;
        if (link && link.channel && link.channel.readyState === 'open') return;
        if (recovery) return;            // the election owns the knocks now
        // A link that is still coming up gets a quiet moment: another knock now
        // only makes the host replace the offer and the negotiation restarts.
        if (link && Date.now() - linkAt < LINK_GRACE) return;
        if (link) {
          // It never opened: start the join clean, and count the fresh attempt
          // from now so the reset does not read as "no room with that code".
          dropLink();
          joinedAt = Date.now();
        }
        knock();
        if (link) return;
        if (Date.now() - joinedAt < MISSING_MS) return;
        if (mode === 'public') {
          startRecovery('lost');
          return;
        }
        // A private room nobody is hosting: say so instead of knocking forever.
        stopKnock();
        status({ state: 'missing' });
      }, KNOCK_MS);
    }

    function announceHost() {
      if (!host) return;
      sendRelay('host', { from: clientId, rank: claimRank });
    }

    function startAlive() {
      if (aliveTimer) return;
      aliveTimer = setInterval(announceHost, ALIVE_MS);
    }

    function stopHost() {
      if (aliveTimer) clearInterval(aliveTimer);
      aliveTimer = 0;
      if (ticker) clearInterval(ticker);
      ticker = 0;
      kick = null;
      // Let the room hear about it before the channels go.
      const closing = host;
      host = null;
      if (closing) {
        try { closing.close(); } catch { /* already gone */ }
      }
      for (const peerId of [...peers.keys()]) dropPeer(peerId, false);
    }

    function beginHost(resume) {
      if (closed) return;
      stopKnock();
      host = C.createHostRoom({
        code: mode === 'public' ? 'PUBLIC' : code,
        publicRoom: mode === 'public',
        name,
        resume: resume ? { state: resume, playerId: clientId } : null,
      });
      claimRank = rank > 0 ? rank : 0;

      host.on('snapshot', snapshot => {
        lastSnap = Date.now();
        onSnapshot(snapshot);
      });
      host.on('event', event => onEvent(event));

      // A hidden tab throttles timers to about 1 Hz, so the loop advances by the
      // wall clock instead of assuming 50 ms. A badly delayed host (a laptop
      // asleep) is capped so one tick cannot replay an hour.
      let lastTick = performance.now();
      const loop = () => {
        const now = performance.now();
        const elapsed = Math.min(10_000, Math.max(0, now - lastTick));
        lastTick = now;
        if (host) host.tick(elapsed);
      };
      ticker = setInterval(loop, 50);
      kick = () => {
        lastTick = performance.now() - 120;
        loop();
      };
      mirror = null;
      rank = 0;
      recovery = null;
      status({ state: 'hosting', promoted: Boolean(resume) });
      announceHost();
      startAlive();
    }

    function beginClient() {
      if (closed || host) return;
      hostPeer = '';
      startKnock();
    }

    function stepDown() {
      // Two claims in one topic: the ring already knows whose is older, so the
      // one that loses becomes a client again and re-knocks at the winner.
      stopHost();
      status({ state: 'taken' });
      beginClient();
      setTimeout(() => {
        if (!closed && !host && !link) startRecovery('lost');
      }, 1500);
    }

    function noteHostClaim(from, theirRank) {
      if (!host) {
        // Somebody is hosting, so stop competing for the chair and knock at them.
        if (recovery) {
          recovery = null;
          beginClient();
        }
        return;
      }
      const mine = claimRank;
      const theirs = theirRank;
      if (theirs > 0 && (mine === 0 || theirs < mine)) stepDown();
    }

    function onHostGone() {
      if (closed || host || recovery) return;
      startRecovery('lost');
    }

    function startWatchdog() {
      if (watchdog) return;
      watchdog = setInterval(() => {
        if (closed || host) return;
        if (!link || !link.channel || link.channel.readyState !== 'open') return;
        // Either a data frame or the relay's `host` announcement proves the
        // chair is still held; a quiet room has no frames to show for itself.
        if (!recovery && Date.now() - lastSnap > HOST_TIMEOUT && Date.now() - lastHostSeen > HOST_TIMEOUT) onHostGone();
      }, 500);
    }

    function startRecovery(kind) {
      if (closed || host || recovery) return;
      const myRank = Math.max(1, rank || 2);
      recovery = {
        kind,
        since: Date.now(),
        // The player with the checkpoint gets the first several seconds alone;
        // the rest of the ring only takes the chair if it never turns up.
        claimAt: kind === 'start' ? 1200 : myRank === 1 ? 0 : myRank === 2 ? 12000 : 12000 + (myRank - 2) * 4000,
        tries: 0,
        timer: 0,
      };
      if (kind === 'lost') status({ state: 'lost' });
      setTimeout(recover, 0);
    }

    function recover() {
      if (closed || host || !recovery) return;
      recovery.tries += 1;
      if (recovery.tries > 90) {
        recovery = null;
        status({ state: 'error', message: 'The room did not come back.' });
        return;
      }
      const active = recovery;
      const waited = Date.now() - active.since;
      dropLink();
      if (waited >= active.claimAt) {
        if (Date.now() - lastHostSeen < 3000) {
          // Somebody already has the chair; knocking is what gets us in.
          beginClient();
          if (recovery !== active) return;
          clearTimeout(active.timer);
          active.timer = setTimeout(recover, 1200);
          return;
        }
        beginHost(mirror);
        return;
      }
      beginClient();
      // Alternate knock and claim: a knock usually finds the winner in under a second.
      if (recovery !== active) return;
      clearTimeout(active.timer);
      active.timer = setTimeout(recover, 1200);
    }

    /* ── what the relay says ───────────────────────────────────────────── */

    function onRelay(event, message) {
      if (closed || !message || typeof message !== 'object') return;
      const from = String(message.from || '');
      if (!from || from === clientId) return;

      if (event === 'hello') {
        if (host) connectPeer(from);
      } else if (event === 'host') {
        lastHostSeen = Date.now();
        noteHostClaim(from, Number(message.rank) || 0);
      } else if (event === 'offer') {
        if (!host && String(message.to || '') === clientId) acceptOffer(from, message.sdp);
      } else if (event === 'answer') {
        if (String(message.to || '') === clientId) acceptAnswer(from, message.sdp);
      } else if (event === 'ice') {
        if (String(message.to || '') === clientId) acceptIce(from, message.c);
      } else if (event === 'bye') {
        if (host && peers.has(from)) dropPeer(from);
        else if (!host && from === hostPeer) onHostGone();
      }
    }

    function handleData(data) {
      if (!data || typeof data !== 'object') return;
      lastSnap = Date.now();
      if (data.t === 'welcome' || data.t === 'snap') {
        if (data.s && data.s.net) rank = data.s.net.rank || 0;
        onSnapshot(data.s);
      } else if (data.t === 'mirror') {
        mirror = data.state;
      } else if (data.t === 'event') {
        onEvent(data.e);
      } else if (data.t === 'error') {
        onEvent({ t: 'rejected', error: data.error });
      } else if (data.t === 'reject') {
        status({ state: 'rejected', error: data.error });
      } else if (data.t === 'bye') {
        // The host left on purpose: this is the hand-off, not the end.
        onHostGone();
      }
    }

    /* ── start ─────────────────────────────────────────────────────────── */

    // Coming back to a hidden host tab should not wait for the throttled timer.
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && kick && !closed) kick();
    });

    const conf = relayConfig();
    relay = createRelay({
      url: conf.url,
      key: conf.key,
      channel: roomId,
      onMessage: onRelay,
      onOpen: () => {
        if (closed) return;
        if (host) announceHost();
        else knock();
      },
      onDown: (reason, was) => {
        if (closed) return;
        // The data channel does not depend on the relay, so a relay hiccup is
        // only news while we are still trying to reach somebody.
        const live = host || (link && link.channel && link.channel.readyState === 'open');
        if (live) return;
        status({ state: 'error', message: was ? 'The room relay dropped. Reconnecting…' : 'The room relay is unreachable.' });
      },
    });

    if (!relay) {
      status({ state: 'error', message: 'This browser cannot open a WebSocket.' });
    } else if (mode === 'public') {
      startRecovery('start');
    } else if (intent === 'host') {
      beginHost(null);
    } else {
      beginClient();
    }

    return {
      roomId,
      supported: true,
      send(message) {
        if (host) {
          host.receive(host.hostId, message);
          return;
        }
        if (link && link.channel && link.channel.readyState === 'open') {
          if (link.channel.bufferedAmount > 96 * 1024) return;
          try {
            link.channel.send(JSON.stringify({ t: 'input', m: message }));
          } catch { /* the close handler follows */ }
        }
      },
      get hosting() {
        return Boolean(host);
      },
      get publicRoom() {
        return mode === 'public';
      },
      close() {
        closed = true;
        recovery = null;
        if (relay) sendRelay('bye', { from: clientId, host: Boolean(host) });
        stopHost();
        dropLink();
        stopKnock();
        if (watchdog) clearInterval(watchdog);
        watchdog = 0;
        if (relay) relay.close();
        relay = null;
      },
    };
  }

  return { createSession, makeCode, roomIdFor, PUBLIC_ID, PROTOCOL, supported };
})();
</script>

<script>
/* screens, input and drawing: renders snapshots, sends inputs, decides nothing */
(function () {
  'use strict';

  const C = window.ImposterCore;
  const N = window.ImposterNet;
  const $ = id => document.getElementById(id);
  const ERRORS = {
    'not-in-lobby': 'That only works in the lobby.',
    'already-started': 'The round already started.',
    'need-3-players': 'Three players minimum.',
    'not-playing': 'The round is paused.',
    dead: 'You are a ghost.',
    'not-crew': 'Impostors cannot do tasks.',
    'no-station': 'Nothing here.',
    'already-done': 'Already done.',
    'too-far': 'Get closer.',
    'need-gas': 'Find a gas can in Storage first.',
    'not-impostor': 'Only the impostor can do that.',
    'cooling-down': 'Still cooling down.',
    'reactor-locked': 'Fix the reactor first.',
    'venting-cooldown': 'The vent is still closing.',
    'no-vent': 'No vent here.',
    'no-target': 'Nobody there.',
    teammate: 'That is your teammate.',
    'no-body': 'No body here.',
    'already-used': 'You already called a meeting.',
    'dead-cannot-vote': 'Ghosts do not vote.',
    'already-voted': 'You already voted.',
    'no-meeting': 'No meeting running.',
    'already-sabotaged': 'A sabotage is already running.',
    'sabotage-cooling': 'Sabotage is recharging.',
    'sabotage-running': 'You cannot report during a sabotage.',
    'unknown-sabotage': 'Unknown sabotage.',
    'nothing-to-fix': 'Nothing to fix.',
    'room-full': 'The room is full (10).',
    'already-joined': 'You are already in this room.',
    'unknown-player': 'The host lost your seat.',
    'not-your-task': 'That task is not on your list.',
    'no-tasks': 'You have no tasks.',
    'not-host': 'Only the host sets the rules.',
    'not-voting': 'Voting has not started yet.',
    'chat-slow': 'Slow down a moment.',
    'chat-in-meeting': 'Talk in the meeting.',
    'empty-chat': 'Say something.',
    'already-held': 'Somebody is already holding this one.',
    'no-pad': 'Nothing to hold here.',
  };

  // Quick chat, the way the real wheel works: whole phrases, never free text.
  const PHRASES = [
    'Where?', 'Who?', 'I saw them vent', 'It was them', 'I was doing tasks',
    'I was with someone', 'Follow me', 'Sus', 'I am crew', 'They are safe',
    'Skip', 'Any sus?', 'Meeting!', 'They ran away',
  ];

  let session = null;
  let snap = null;
  let selfId = 'host';
  let shown = 'menu';
  let toastUntil = 0;
  let taskOpen = null;

  const keys = new Set();
  let sentDir = { x: 0, y: 0 };
  const listKeys = new Map();

  /* ── art ─────────────────────────────────────────────────────────────── */

  // The ship, the crew frames, the task boards and the interface icons are the
  // ripped set from AI0702/Among-Us-clone (artwork belongs to Innersloth).
  const IMAGE_BASE = /\/games\/content\/[^/]+\.html([?#].*)?$/.test(document.baseURI)
    ? 'imposter/'
    : 'games/content/imposter/';
  const asset = name => new URL(IMAGE_BASE + name, document.baseURI).href;

  function loadImage(name) {
    const image = new Image();
    image.src = asset(name);
    return image;
  }

  const MAP_ART = loadImage('map.jpg');
  const MINI_ART = loadImage('mini.png');
  const BUTTON_ART = loadImage('button.png');
  const GAS_ART = loadImage('gas-can.png');
  const CREW = new Map();
  for (const color of C.COLORS) CREW.set(color.id, loadImage('crew-' + color.id + '.png'));

  /* ── small dom helpers ───────────────────────────────────────────────── */

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function img(name, className) {
    const node = new Image();
    node.src = asset(name);
    node.className = className || '';
    node.draggable = false;
    node.alt = '';
    return node;
  }

  function show(name) {
    shown = name;
    for (const [id, element] of Object.entries({ menu: $('screen-menu'), game: $('screen-game') })) {
      element.hidden = id !== name;
    }
    $('leave').hidden = name === 'menu';
    if (name === 'menu') $('shell').classList.remove('playing');
  }

  function menuStatus(text, bad) {
    const element = $('menu-status');
    element.textContent = text || '';
    element.classList.toggle('bad', Boolean(bad));
    element.hidden = !text;
  }

  function toast(text) {
    const element = $('toast');
    element.textContent = text;
    element.hidden = false;
    toastUntil = performance.now() + 3400;
  }

  function tickToast() {
    if (!toastUntil) return;
    if (performance.now() > toastUntil) {
      $('toast').hidden = true;
      toastUntil = 0;
    }
  }

  function readName() {
    const raw = $('name').value.trim();
    const name = (raw || 'Crewmate').slice(0, 12);
    try {
      localStorage.setItem('bored.imposter.name', name);
    } catch {}
    return name;
  }

  function setList(element, key, build) {
    if (listKeys.get(element.id) === key) return;
    listKeys.set(element.id, key);
    element.replaceChildren();
    build(element);
  }

  function colorHex(id) {
    return (C.COLORS.find(color => color.id === id) || C.COLORS[0]).hex;
  }

  function playerRow(player, suffix) {
    const row = el('li', 'row-item');
    const dot = el('span', 'dot');
    dot.style.background = colorHex(player.color);
    const name = el('span', 'name', player.name);
    row.append(dot, name);
    if (suffix) row.append(el('span', 'tail', suffix));
    return row;
  }

  /* ── joining and leaving ─────────────────────────────────────────────── */

  // A join that never landed used to need a leave and a second try. Watch for
  // the first snapshot instead: with none, rebuild the session in place, which
  // is the same fresh start a manual rejoin gives, and only then admit defeat.
  const JOIN_TIMEOUT = 12000;
  const JOIN_TRIES = 2;
  let joinWatch = 0;
  let joinTries = 0;
  let joinRequest = null;

  function stopJoinWatch() {
    if (joinWatch) clearTimeout(joinWatch);
    joinWatch = 0;
    joinTries = 0;
  }

  function watchJoin() {
    if (joinWatch) clearTimeout(joinWatch);
    joinWatch = setTimeout(retryJoin, JOIN_TIMEOUT);
  }

  function retryJoin() {
    joinWatch = 0;
    if (!session || snap || session.hosting || !joinRequest) return;
    if (joinTries >= JOIN_TRIES) {
      stopJoinWatch();
      leave();
      menuStatus('Could not reach that room. Try again in a moment.', true);
      return;
    }
    joinTries += 1;
    const request = joinRequest;
    try {
      session.close();
    } catch {}
    session = null;
    openSession(request);
  }

  function openSession(request) {
    if (session) return;
    const { mode, code, intent } = request;
    joinRequest = request;
    if (!N.supported) {
      menuStatus('This browser cannot open a data channel. Imposter needs WebRTC.', true);
      return;
    }
    const name = readName();
    menuStatus(mode === 'public' ? 'Finding the public room…' : 'Connecting…');
    session = N.createSession({
      mode,
      code,
      intent,
      name,
      onSnapshot: setSnapshot,
      onEvent: handleEvent,
      onStatus: handleStatus,
    });
    $('lobby-code').textContent = mode === 'public' ? 'PUBLIC' : code;
    $('lobby-code').classList.toggle('public', mode === 'public');
    $('host-settings').hidden = true;
    $('start').hidden = true;
    snap = null;
    rosterCache = [];
    stationCache = { mine: [], done: [] };
    youCache.tasks = [];
    youCache.doneIds = [];
    settingsCache = null;
    $('lobby-bar').hidden = false;
    $('hud').hidden = true;
    $('actions').hidden = true;
    show('game');
    $('roster').replaceChildren();
    listKeys.clear();
    $('lobby-note').textContent = mode === 'public' ? 'Joining the public room…' : 'Connecting…';
    watchJoin();
  }

  function leave() {
    stopJoinWatch();
    joinRequest = null;
    try {
      session?.close();
    } catch {}
    session = null;
    snap = null;
    selfId = 'host';
    listKeys.clear();
    closeTask();
    closeRoom();
    $('overlay-chat').hidden = true;
    $('overlay-meeting').hidden = true;
    $('overlay-over').hidden = true;
    $('overlay-list').hidden = true;
    $('room-tag').hidden = true;
    $('lobby-bar').hidden = true;
    $('roster').replaceChildren();
    show('menu');
  }

  function handleStatus(status) {
    if (!status) return;
    switch (status.state) {
      case 'hosting':
        if (snap && snap.phase === 'lobby') $('lobby-note').textContent = '';
        menuStatus('');
        break;
      case 'joined':
        menuStatus('');
        break;
      case 'lost':
        toast('Connection hiccup. Reconnecting…');
        break;
      case 'taken':
        toast('Somebody else took the room. Rejoining…');
        break;
      case 'missing':
        menuStatus('No room with that code.', true);
        leave();
        break;
      case 'rejected':
        menuStatus(ERRORS[status.error] || status.error || 'The host refused the join.', true);
        leave();
        break;
      case 'closed':
        toast('The room closed.');
        leave();
        break;
      case 'error':
        menuStatus(status.message || 'Connection error. Check your internet.', true);
        break;
      default:
        break;
    }
  }

  /* ── snapshots ───────────────────────────────────────────────────────── */

  // Roster and task list only travel when they change; the rest of the page
  // reads them from these caches, rebuilt into the shape it already expects.
  let rosterCache = [];
  const youCache = { tasks: [], doneIds: [] };
  let stationCache = { mine: [], done: [] };
  let settingsCache = null;

  function mergeSnapshot(next) {
    if (next.roster) rosterCache = next.roster;
    if (next.pos) {
      const known = new Map(rosterCache.map(player => [player.id, player]));
      next.players = next.pos.map(([id, x, y]) => Object.assign(
        { id, name: id, color: 'white', alive: true, host: false, ready: false },
        known.get(id),
        { x, y },
      ));
    } else if (!next.players) {
      next.players = rosterCache.slice();
    }
    if (next.stations) stationCache = next.stations;
    next.stations = stationCache;
    if (next.settings) settingsCache = next.settings;
    next.settings = settingsCache || { speed: 1, crewVision: 1, killDistance: 'medium' };
    if (next.you) {
      if (next.you.tasks) youCache.tasks = next.you.tasks;
      if (next.you.doneIds) youCache.doneIds = next.you.doneIds;
      next.you.tasks = youCache.tasks;
      next.you.doneIds = youCache.doneIds;
    }
    return next;
  }

  function setSnapshot(next) {
    if (!next) return;
    next = mergeSnapshot(next);
    snap = next;
    stopJoinWatch();             // the join landed; nothing left to recover
    if (next.you?.id) selfId = next.you.id;
    seedView(next);
    const hosting = Boolean(next.you?.host);
    const publicRoom = Boolean(next.net?.publicRoom);
    const tag = $('room-tag');
    tag.hidden = false;
    tag.textContent = 'Room: ' + (publicRoom ? 'PUBLIC' : next.code || '----');

    show('game');
    // A round owns the whole window; the lobby keeps its dock.
    $('shell').classList.toggle('playing', next.phase !== 'lobby');

    if (next.phase === 'lobby') {
      $('lobby-bar').hidden = false;
      $('hud').hidden = true;
      $('actions').hidden = true;
      $('task-bar').hidden = true;
      $('sab-lights').hidden = true;
      $('sab-reactor').hidden = true;
      $('overlay-meeting').hidden = true;
      $('overlay-over').hidden = true;
      closeTask();
      closeRoom();
      closeList();
      $('overlay-chat').hidden = true;
      renderLobby(next, hosting, publicRoom);
      return;
    }

    $('lobby-bar').hidden = true;
    $('hud').hidden = false;
    $('actions').hidden = false;
    $('task-bar').hidden = false;
    renderHud(next);
    if (roomKind && next.actions?.room !== roomKind) closeRoom();
    if (!$('overlay-chat').hidden) renderChat($('chat-log'), next.ghostChat || [], true);
    $('lobby-note').textContent = '';

    // Vitals and the Admin table are live readouts, not photographs.
    if (roomKind === 'vitals') renderVitals();
    else if (roomKind === 'admin') renderAdmin();
    if (mapCanvas && !$('overlay-list').hidden) drawMap(mapCanvas);
    if (next.phase === 'meeting') {
      $('overlay-over').hidden = true;
      $('overlay-meeting').hidden = false;
      closeTask();
      closeRoom();
      closeList();
      renderMeeting(next);
    } else {
      $('overlay-meeting').hidden = true;
    }

    if (next.phase === 'over') {
      $('overlay-over').hidden = false;
      closeTask();
      renderOver(next, hosting, publicRoom);
    } else {
      $('overlay-over').hidden = true;
    }
  }

  function renderLobby(s, hosting, publicRoom) {
    $('lobby-code').textContent = publicRoom ? 'PUBLIC' : s.code;
    $('lobby-code').classList.toggle('public', publicRoom);
    $('copy').hidden = publicRoom;

    const players = s.players;
    setList($('roster'), players.map(player => `${player.id}:${player.name}:${player.host}`).join('|'), list => {
      for (const player of players) list.append(playerRow(player, player.id === selfId ? 'you' : ''));
    });

    const need = Math.max(0, C.MIN_PLAYERS - players.length);
    $('lobby-note').textContent = publicRoom
      ? `${players.length} / ${C.MAX_PLAYERS} in the public room · ` + (need ? `${need} more to start` : 'starting…')
      : `${players.length} / ${C.MAX_PLAYERS} · ` + (need ? `${need} more to start` : 'ready when you are');

    // The rules are the host's board: a guest who sees the panel only gets
    // "Only the host sets the rules." bounced back at every change.
    $('host-settings').hidden = publicRoom || !hosting;
    // Starting is the host's call; a guest only gets told to wait.
    $('start').hidden = publicRoom || !hosting;
    $('start').disabled = players.length < C.MIN_PLAYERS;
    if (!publicRoom) applySettingsToForm(s.settings);
  }

  function applySettingsToForm(settings) {
    const fields = [
      ['set-cooldown', settings.killCooldownSec],
      ['set-distance', settings.killDistance],
      ['set-speed', settings.speed],
      ['set-vision', settings.crewVision],
      ['set-discussion', settings.discussionSec],
      ['set-voting', settings.votingSec],
    ];
    for (const [id, value] of fields) {
      const field = $(id);
      if (field && document.activeElement !== field) field.value = String(value);
    }
  }

  function renderHud(s) {
    const you = s.you;
    if (!you) {
      $('hud').textContent = '';
      return;
    }
    const parts = [];
    if (!you.alive) parts.push('ghost');
    parts.push(you.role === 'impostor' ? 'impostor' : 'crewmate');
    if (you.total) parts.push(`${you.done}/${you.total} tasks`);
    if (you.role === 'impostor' && you.alive) {
      parts.push(you.cooldown > 0 ? `kill ${you.cooldown}s` : 'kill ready');
    }
    const names = { reactor: 'reactor', o2: 'O2', lights: 'lights', comms: 'comms' };
    if (s.sabotage) parts.push(`${names[s.sabotage.kind] || s.sabotage.kind} ${Math.ceil(s.sabotage.msLeft / 1000)}s`);
    else if (s.doors) parts.push(`doors ${Math.ceil(s.doors.msLeft / 1000)}s`);
    const hudText = parts.join(' · ');
    if ($('hud').textContent !== hudText) $('hud').textContent = hudText;

    const fill = $('task-bar').firstElementChild;
    const pct = `${s.tasks.total ? Math.round((s.tasks.done / s.tasks.total) * 100) : 0}%`;
    if (fill.style.width !== pct) fill.style.width = pct;
    $('task-bar').hidden = you.role === 'impostor' || s.phase !== 'play';

    const actions = s.actions;
    $('act-use').hidden = !actions.use;
    $('act-gas').hidden = !actions.gas;
    $('act-kill').hidden = !actions.kill;
    $('act-vent').hidden = !actions.vent;
    $('act-report').hidden = !actions.report;
    $('act-button').hidden = !actions.button;
    $('act-fix').hidden = !actions.fix.length;
    if (actions.fix.length) $('act-fix').dataset.pad = actions.fix[0];

    const canSabotage = you.role === 'impostor' && s.phase === 'play';
    const chips = { lights: 'sab-lights', reactor: 'sab-reactor', o2: 'sab-o2', comms: 'sab-comms', doors: 'sab-doors' };
    for (const [kind, id] of Object.entries(chips)) $(id).hidden = !canSabotage || !actions.sabotage[kind];

    $('open-vitals').hidden = actions.room !== 'vitals';
    $('open-admin').hidden = actions.room !== 'admin';
    $('open-cams').hidden = actions.room !== 'cams';
    $('open-chat').hidden = you.alive;

    const note = $('sabotage-note');
    const def = s.sabotage ? C.SABOTAGE[s.sabotage.kind] : null;
    if (def) {
      note.hidden = false;
      note.textContent = `${def.label} — ${def.where}. ${Math.ceil(s.sabotage.msLeft / 1000)}s left.`;
    } else if (s.doors) {
      note.hidden = false;
      note.textContent = `Doors sealed in ${s.doors.room}.`;
    } else {
      note.hidden = true;
    }
  }

  function renderChat(node, lines, ghostMode) {
    const key = (ghostMode ? 'g' : 'l') + lines.map(line => `${line.seat}:${line.at}:${line.text}`).join('|');
    setList(node, key, box => {
      if (!lines.length) {
        box.append(el('p', 'chat-empty', ghostMode ? 'Only the dead can read this.' : 'Say something to the room.'));
        return;
      }
      for (const line of lines.slice(-12)) {
        const row = el('p', 'chat-line');
        row.append(el('span', 'chat-who', `${line.name}: `), document.createTextNode(line.text));
        box.append(row);
      }
      box.scrollTop = box.scrollHeight;
    });
  }

  function renderPhrases(node, ghostMode) {
    setList(node, ghostMode ? 'phrases-g' : 'phrases', box => {
      for (const text of PHRASES) {
        const button = el('button', 'phrase', text);
        button.type = 'button';
        button.addEventListener('click', () => {
          send({ t: 'chat', text });
          button.disabled = true;
          setTimeout(() => { button.disabled = false; }, 1300);
        });
        box.append(button);
      }
    });
  }

  function renderMeeting(s) {
    const meeting = s.meeting;
    if (!meeting) return;
    $('meeting-reason').textContent = meeting.reason === 'body' ? 'A body was reported' : 'Emergency meeting called';
    const alive = s.players.filter(player => player.alive);
    const you = s.you;
    const voting = meeting.phase === 'voting';
    const voted = meeting.voted.includes(selfId);
    const canVote = meeting.canVote !== false;
    $('meeting-note').textContent = !canVote
      ? 'You joined mid-meeting, so you vote in the next one.'
      : !voting
        ? `${alive.length} alive · discussion first`
        : voted
          ? 'Vote locked. Waiting for the rest.'
          : `${alive.length} alive · ${meeting.voted.length}/${meeting.total} voted`;
    $('meeting-timer').textContent = `${voting ? 'Vote' : 'Talk'} ${Math.max(0, Math.ceil(meeting.msLeft / 1000))}s`;

    const key = `${meeting.phase}|${alive.map(player => player.id).join(',')}|${meeting.voted.join(',')}|${you?.alive}|${canVote}`;
    setList($('votes'), key, list => {
      if (!you?.alive || !canVote) {
        list.append(el('li', '', you?.alive ? 'You are watching this one.' : 'Ghosts watch. They do not vote.'));
        return;
      }
      for (const player of alive) {
        if (player.id === selfId) continue;
        const row = playerRow(player, meeting.voted.includes(player.id) ? 'voted' : '');
        const button = el('button', 'vote', 'Vote');
        button.type = 'button';
        button.disabled = voted || !voting;
        button.addEventListener('click', () => send({ t: 'vote', target: player.id }));
        row.append(button);
        list.append(row);
      }
    });

    const skip = $('skip');
    skip.disabled = voted || !voting || !you?.alive || !canVote;
    skip.textContent = voting ? 'Skip vote' : 'Discussion…';

    const lines = (meeting.chat || []).slice();
    if (you && !you.alive) lines.push(...(s.ghostChat || []));
    renderChat($('meeting-log'), lines, Boolean(you && !you.alive));
    renderPhrases($('meeting-phrases'), false);
  }

  /* ── vitals, admin and the cameras ───────────────────────────────────── */

  let roomKind = null;
  let roomFrame = 0;
  let mapCanvas = null;

  function closeRoom() {
    roomKind = null;
    if (roomFrame) cancelAnimationFrame(roomFrame);
    roomFrame = 0;
    $('overlay-room').hidden = true;
    $('room-body').replaceChildren();
  }

  function openRoom(kind) {
    if (!snap) return;
    if (snap.sabotage && snap.sabotage.kind === 'comms') {
      toast('Comms are down.');
      return;
    }
    closeTask();
    $('overlay-list').hidden = true;
    roomKind = kind;
    $('room-title').textContent = kind === 'vitals' ? 'Vitals' : kind === 'admin' ? 'Admin table' : 'Security cameras';
    $('overlay-room').hidden = false;
    const body = $('room-body');
    body.replaceChildren();
    if (kind === 'vitals') {
      const list = el('ul', 'vitals-list');
      list.id = 'vitals-list';
      body.append(list);
      body.append(el('p', 'hint', 'A flat line means a body.'));
      renderVitals();
    } else if (kind === 'admin') {
      const table = el('table', 'admin-table');
      table.id = 'admin-table';
      body.append(table);
      body.append(el('p', 'hint', 'Living crew per room, straight from the table.'));
      renderAdmin();
    } else {
      const grid = el('div', 'cam-grid');
      for (const cam of C.CAMS) {
        const cell = el('div', 'cam-cell');
        const canvas = document.createElement('canvas');
        canvas.width = 480;
        canvas.height = 270;
        canvas.className = 'cam-canvas';
        canvas.dataset.cam = cam.id;
        cell.append(canvas, el('span', 'cam-tag', cam.name));
        grid.append(cell);
      }
      body.append(grid);
      body.append(el('p', 'hint', 'Four feeds. Comms cut them; so does leaving the desk.'));
      const loop = () => {
        if (roomKind !== 'cams' || $('overlay-room').hidden) return;
        for (const canvas of body.querySelectorAll('canvas')) drawCam(canvas);
        roomFrame = requestAnimationFrame(loop);
      };
      loop();
    }
  }

  function drawCam(canvas) {
    const cam = C.CAMS.find(entry => entry.id === canvas.dataset.cam);
    if (!cam) return;
    const ctx = canvas.getContext('2d');
    const sx = MAP_ART.complete && MAP_ART.naturalWidth ? MAP_ART.naturalWidth / C.WORLD.w : 1;
    const sy = MAP_ART.complete && MAP_ART.naturalHeight ? MAP_ART.naturalHeight / C.WORLD.h : 1;
    const [x, y, w, h] = cam.rect;
    ctx.fillStyle = '#05070c';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    if (MAP_ART.complete && MAP_ART.naturalWidth) {
      ctx.drawImage(MAP_ART, x * sx, y * sy, w * sx, h * sy, 0, 0, canvas.width, canvas.height);
    }
    ctx.fillStyle = 'rgba(5,7,12,.28)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = 'rgba(120,200,150,.18)';
    ctx.lineWidth = 1;
    for (let line = 0; line < canvas.height; line += 4) {
      ctx.beginPath();
      ctx.moveTo(0, line);
      ctx.lineTo(canvas.width, line);
      ctx.stroke();
    }
    const viewer = snap?.you;
    for (const player of snap?.players || []) {
      if (!player.alive) continue;
      if (viewer && player.id === viewer.id) continue;
      const px = player.x + C.PLAYER_W / 2;
      const py = player.y + C.PLAYER_H / 2;
      if (px < x || px > x + w || py < y || py > y + h) continue;
      ctx.fillStyle = colorHex(player.color);
      ctx.beginPath();
      ctx.arc(((px - x) / w) * canvas.width, ((py - y) / h) * canvas.height, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#0b0d10';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }

  function renderVitals() {
    const list = $('vitals-list');
    if (!list || !snap) return;
    const players = snap.players;
    setList(list, 'vitals:' + players.map(p => `${p.id}:${p.alive}`).join('|'), box => {
      for (const player of players) {
        const row = el('li', 'vitals-row' + (player.alive ? '' : ' dead'));
        row.append(el('span', 'vitals-pip'));
        row.append(el('span', 'name', player.name));
        row.append(el('span', 'tail', player.alive ? 'alive' : 'dead'));
        box.append(row);
      }
    });
  }

  function renderAdmin() {
    const table = $('admin-table');
    if (!table || !snap) return;
    const counts = new Map();
    for (const room of C.ROOMS) counts.set(room.name, 0);
    for (const player of snap.players) {
      if (!player.alive) continue;
      const px = player.x + C.PLAYER_W / 2;
      const py = player.y + C.PLAYER_H / 2;
      const room = C.ROOMS.find(entry => {
        const [x, y, w, h] = entry.rect;
        return px >= x && px <= x + w && py >= y && py <= y + h;
      });
      if (room) counts.set(room.name, counts.get(room.name) + 1);
    }
    const rows = [...counts.entries()];
    setList(table, 'admin:' + rows.map(([name, count]) => name + count).join('|'), box => {
      const head = el('tr');
      head.append(el('th', '', 'Room'), el('th', '', 'Crew'));
      box.append(head);
      for (const [name, count] of rows) {
        const row = el('tr');
        row.append(el('td', '', name), el('td', '', String(count)));
        box.append(row);
      }
    });
  }

  function renderOver(s, hosting, publicRoom) {
    $('over-eyebrow').textContent = s.winner === 'crew' ? 'Crewmates win' : 'Impostors win';
    $('over-title').textContent = s.winner === 'crew' ? 'All impostors are gone.' : 'The impostors took the ship.';
    const roles = s.over?.roles || [];
    setList($('over-roles'), roles.map(role => `${role.id}:${role.role}:${role.alive}`).join('|'), list => {
      for (const role of roles) {
        const player = s.players.find(candidate => candidate.id === role.id) || { color: 'white', name: role.name };
        const row = playerRow(player, `${role.role}${role.alive ? '' : ' · dead'}`);
        row.classList.add(role.role === 'impostor' ? 'is-impostor' : 'is-crew');
        list.append(row);
      }
    });

    // Same for the way out of an ended round.
    $('back-lobby').hidden = publicRoom || !hosting;
    const seconds = Math.max(0, Math.ceil((s.over?.msLeft || 0) / 1000));
    $('over-note').textContent = publicRoom
      ? `The public room reshuffles in ${seconds}s. Stay in and you are dealt the next round.`
      : 'Back to lobby deals a new round with the same players.';
  }

  let ejectTimer = 0;
  function ejectCard(line, sub, bad) {
    $('eject-line').textContent = line;
    $('eject-sub').textContent = sub;
    $('eject-sub').classList.toggle('bad', Boolean(bad));
    $('eject-card').hidden = false;
    clearTimeout(ejectTimer);
    ejectTimer = setTimeout(() => { $('eject-card').hidden = true; }, 2600);
  }

  function handleEvent(event) {
    if (!event) return;
    switch (event.t) {
      case 'start':
        toast('Roles dealt. Find your tasks.');
        break;
      case 'meeting':
        toast(event.reason === 'body' ? 'A body was reported.' : 'Emergency meeting called.');
        break;
      case 'eject': {
        const player = snap?.players.find(candidate => candidate.id === event.id);
        if (event.id) {
          ejectCard(
            `${player?.name || 'Someone'} was ejected`,
            event.role === 'impostor' ? 'They were the impostor' : 'They were not the impostor',
            event.role === 'impostor',
          );
        } else {
          ejectCard('No one was ejected', event.tie ? 'The vote was tied' : 'The vote was skipped', false);
        }
        break;
      }
      case 'win':
        toast(event.winner === 'crew' ? 'Crewmates win.' : 'Impostors win.');
        break;
      case 'join':
        if (event.id !== selfId) toast(`${event.name} joined the round.`);
        break;
      case 'task':
        if (event.id === selfId) {
          closeTask();
          toast('Task complete.');
        }
        break;
      case 'gas':
        if (event.id === selfId) toast('Gas can in hand. Take it to the engine.');
        break;
      case 'sabotage': {
        const def = C.SABOTAGE[event.kind];
        toast(def ? `${def.label} — fix it in ${def.where}.` : 'Sabotage running.');
        break;
      }
      case 'fixed': {
        const def = C.SABOTAGE[event.kind];
        toast(def ? `${def.label} fixed.` : 'Sabotage fixed.');
        break;
      }
      case 'doors':
        if (event.open) toast('Doors open again.');
        else toast(`Doors sealed in ${event.room}.`);
        break;
      case 'chat':
        break;
      case 'rejected':
        toast(ERRORS[event.error] || event.error);
        break;
      default:
        break;
    }
  }

  /* ── drawing ─────────────────────────────────────────────────────────── */

  const view = new Map();
  let selfView = null;
  let selfAim = null;
  let aimAt = 0;
  let lastFrame = performance.now();

  function seedView(state) {
    for (const player of state.players) {
      const entry = view.get(player.id);
      if (entry) {
        entry.tx = player.x;
        entry.ty = player.y;
      } else {
        view.set(player.id, { x: player.x, y: player.y, tx: player.x, ty: player.y, dir: 0 });
      }
    }
    for (const id of view.keys()) {
      if (!state.players.some(player => player.id === id)) view.delete(id);
    }
    const me = state.players.find(player => player.id === selfId);
    if (!me) return;
    // Only a seat that jumped between two snapshots (a spawn, a vent, a
    // meeting) is taken as read. Everything else is a walking disagreement and
    // the draw loop pulls the view onto it instead of cutting across the room.
    const seatJumped = selfAim ? Math.hypot(me.x - selfAim.x, me.y - selfAim.y) : 0;
    if (!selfView || !me.alive || seatJumped > 200) selfView = { x: me.x, y: me.y };
    selfAim = { x: me.x, y: me.y };
    aimAt = performance.now();
  }

  // Frames run down, left, right, up inside each colour sheet.
  function frameFor(dx, dy, fallback) {
    if (dy > 0.35) return 0;
    if (dy < -0.35) return 3;
    if (dx < -0.35) return 1;
    if (dx > 0.35) return 2;
    return fallback || 0;
  }

  function drawCrew(ctx, colorId, x, y, frame, alpha) {
    const image = CREW.get(colorId);
    if (!image || !image.complete || !image.naturalWidth) return false;
    const frameWidth = image.naturalWidth / 4;
    const height = image.naturalHeight;
    ctx.save();
    ctx.globalAlpha *= alpha;
    ctx.drawImage(image, frame * frameWidth, 0, frameWidth, height, x - C.PLAYER_W / 2, y - C.PLAYER_H, C.PLAYER_W, C.PLAYER_H);
    ctx.restore();
    return true;
  }

  // Everything drawn is in ship coordinates, so one rectangle test keeps the
  // per-frame work proportional to what is visible instead of to the map.
  let cullL = 0;
  let cullT = 0;
  let cullR = 0;
  let cullB = 0;
  const inView = (x, y, pad = 80) => x > cullL - pad && x < cullR + pad && y > cullT - pad && y < cullB + pad;

  let labelFont = '';
  function label(ctx, text, x, y, color, size) {
    const px = size || 30;
    const font = `600 ${px}px ui-monospace, Menlo, monospace`;
    if (font !== labelFont) {
      ctx.font = font;
      labelFont = font;
    }
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(0,0,0,.72)';
    ctx.fillText(text, x + px * 0.05, y + px * 0.05);
    ctx.fillStyle = color;
    ctx.fillText(text, x, y);
  }

  let viewW = C.VIEW.w;
  let viewH = C.VIEW.h;
  let fogGlow = 0;
  let fogGradient = null;

  function draw() {
    requestAnimationFrame(draw);
    tickToast();
    if (!snap || $('screen-game').hidden) return;

    const canvas = $('board');
    const stage = canvas.parentElement;
    const width = stage.clientWidth;
    const height = stage.clientHeight;
    if (!width || !height) return;

    const now = performance.now();
    const dt = Math.min(0.1, (now - lastFrame) / 1000);
    lastFrame = now;

    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const pixelWidth = Math.round(width * dpr);
    const pixelHeight = Math.round(height * dpr);
    if (canvas.width !== pixelWidth || canvas.height !== pixelHeight) {
      canvas.width = pixelWidth;
      canvas.height = pixelHeight;
    }

    // The Python drew 1280x640 of ship at a time and followed the player. Fit
    // that frame to the stage, then push in so the crew and the room read at a
    // glance; the camera keeps the player centred and stops at the hull.
    const scale = Math.min(width / C.VIEW.w, height / C.VIEW.h) * C.VIEW.zoom;
    viewW = width / scale;
    viewH = height / scale;

    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, width, height);
    ctx.save();
    ctx.scale(scale, scale);

    const me = snap.players.find(player => player.id === selfId);
    const focus = selfView || { x: me?.x || 0, y: me?.y || 0 };
    const centreX = focus.x + C.PLAYER_W / 2;
    const centreY = focus.y + C.PLAYER_H / 2;
    const camX = C.WORLD.w <= viewW ? (C.WORLD.w - viewW) / 2 : Math.min(Math.max(0, centreX - viewW / 2), C.WORLD.w - viewW);
    const camY = C.WORLD.h <= viewH ? (C.WORLD.h - viewH) / 2 : Math.min(Math.max(0, centreY - viewH / 2), C.WORLD.h - viewH);
    ctx.translate(-camX, -camY);
    cullL = camX;
    cullT = camY;
    cullR = camX + viewW;
    cullB = camY + viewH;

    if (MAP_ART.complete && MAP_ART.naturalWidth) {
      // Blit only the slice of the ship that is on screen. Painting the whole
      // 5792x3168 image and clipping it made the GPU work about ten times
      // harder every frame.
      const artX = MAP_ART.naturalWidth / C.WORLD.w;
      const artY = MAP_ART.naturalHeight / C.WORLD.h;
      ctx.drawImage(
        MAP_ART,
        camX * artX, camY * artY, viewW * artX, viewH * artY,
        camX, camY, viewW, viewH,
      );
    } else {
      ctx.fillStyle = '#15171a';
      ctx.fillRect(0, 0, C.WORLD.w, C.WORLD.h);
    }

    const you = snap.you;

    // Emergency button.
    if (BUTTON_ART.complete && BUTTON_ART.naturalWidth && inView(C.BUTTON.x, C.BUTTON.y, 120)) {
      const bw = 110;
      const bh = bw * (BUTTON_ART.naturalHeight / BUTTON_ART.naturalWidth);
      ctx.drawImage(BUTTON_ART, C.BUTTON.x - bw / 2, C.BUTTON.y - bh / 2, bw, bh);
    }

    // Vents.
    for (const vent of C.VENTS) {
      if (!inView(vent[0], vent[1], 60)) continue;
      ctx.fillStyle = 'rgba(10,11,12,.72)';
      ctx.strokeStyle = you?.role === 'impostor' ? 'rgba(192,57,43,.85)' : 'rgba(20,21,24,.9)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(vent[0] - 34, vent[1] - 26, 68, 52, 6);
      ctx.fill();
      ctx.stroke();
      ctx.strokeStyle = you?.role === 'impostor' ? 'rgba(224,138,128,.65)' : 'rgba(120,124,130,.4)';
      ctx.lineWidth = 2;
      for (let i = -1; i <= 1; i += 1) {
        ctx.beginPath();
        ctx.moveTo(vent[0] - 20, vent[1] + i * 9);
        ctx.lineTo(vent[0] + 20, vent[1] + i * 9);
        ctx.stroke();
      }
    }

    // Task marks: yellow diamonds for the jobs on your own list.
    for (const id of snap.stations.mine) {
      if (snap.stations.done.includes(id)) continue;
      const station = C.stationById(id);
      if (!station || !inView(station.x, station.y, 40)) continue;
      const crew = you?.role === 'crew';
      ctx.globalAlpha = crew ? 1 : 0.5;
      ctx.fillStyle = crew ? '#f2df6a' : '#8b8e94';
      ctx.strokeStyle = 'rgba(0,0,0,.7)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(station.x, station.y - 18);
      ctx.lineTo(station.x + 18, station.y);
      ctx.lineTo(station.x, station.y + 18);
      ctx.lineTo(station.x - 18, station.y);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.globalAlpha = 1;
      const reach = 520 * 520;
      const near = (centreX - station.x) ** 2 + (centreY - station.y) ** 2 < reach;
      if (near) label(ctx, station.label, station.x, station.y - 28, crew ? '#f7efc2' : '#b9bcc2', 28);
    }

    // Gas can, only while the crew still needs it.
    if (you && !you.gas && you.tasks.includes('fuel') && !you.doneIds.includes('fuel') && inView(C.GASCAN.x, C.GASCAN.y, 60)) {
      const gas = C.GASCAN;
      if (GAS_ART.complete && GAS_ART.naturalWidth) ctx.drawImage(GAS_ART, gas.x - 26, gas.y - 34, 52, 52);
      else {
        ctx.fillStyle = '#f2df6a';
        ctx.fillRect(gas.x - 14, gas.y - 18, 28, 30);
      }
      if ((centreX - gas.x) ** 2 + (centreY - gas.y) ** 2 < 520 * 520) label(ctx, 'Gas can', gas.x, gas.y - 44, '#f7efc2', 28);
    }

    // Sabotage repair pads. The reactor and O2 both have two.
    if (snap.fix && snap.fix.pads) {
      const held = snap.sabotage?.held || [];
      for (const pad of snap.fix.pads) {
        if (!inView(pad.x, pad.y, 70)) continue;
        const done = held.includes(pad.pad);
        ctx.strokeStyle = done ? '#8fd69a' : '#e8dfa0';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(pad.x, pad.y, 46, 0, Math.PI * 2);
        ctx.stroke();
        label(ctx, done ? 'held' : pad.label, pad.x, pad.y - 56, done ? '#8fd69a' : '#e8dfa0', 28);
      }
    }

    // Bodies.
    for (const body of snap.bodies) {
      if (!inView(body.x, body.y, 90)) continue;
      const owner = snap.players.find(player => player.id === body.of);
      ctx.save();
      ctx.translate(body.x + C.PLAYER_W / 2, body.y + C.PLAYER_H / 2);
      ctx.rotate(Math.PI / 2);
      if (!drawCrew(ctx, owner?.color || 'white', 0, C.PLAYER_H / 2 - 6, 0, 0.85)) {
        ctx.fillStyle = colorHex(owner?.color || 'white');
        ctx.fillRect(-20, -12, 40, 24);
      }
      ctx.restore();
    }

    // Your own seat, predicted locally from the keys and pulled back toward the
    // server's copy every frame, so the two staying a frame or two apart reads
    // as a glide instead of the old jump to a nearby spot.
    if (me?.alive && selfView) {
      // Prediction only covers the trip time between snapshots: if the host
      // stops publishing, the local copy stops walking with it rather than
      // running on and then being dragged back.
      const live = (snap.phase === 'play' || snap.phase === 'lobby') && now - aimAt < 300;
      if (live && selfAim) {
        // Catch up on the error at walking pace, not at teleport pace: a long
        // frame (a backgrounded tab coming back) glides instead of jumping.
        const pull = 1 - Math.exp(-dt * 8);
        let kx = (selfAim.x - selfView.x) * pull;
        let ky = (selfAim.y - selfView.y) * pull;
        const klen = Math.hypot(kx, ky);
        const cap = 900 * dt;
        if (klen > cap) {
          kx *= cap / klen;
          ky *= cap / klen;
        }
        selfView.x += kx;
        selfView.y += ky;
      }
      const dir = walkVector();
      if (live && (dir.x || dir.y)) {
        const length = Math.hypot(dir.x, dir.y) || 1;
        const step = C.SPEED * (snap.settings.speed || 1) * dt;
        const nx = selfView.x + (dir.x / length) * step;
        const ny = selfView.y + (dir.y / length) * step;
        const hitX = C.overlapsWall(nx, selfView.y);
        const hitY = C.overlapsWall(selfView.x, ny);
        if (!hitX) selfView.x = Math.min(Math.max(0, nx), C.WORLD.w - C.PLAYER_W);
        if (!hitY) selfView.y = Math.min(Math.max(0, ny), C.WORLD.h - C.PLAYER_H);
      }
    }

    for (const player of snap.players) {
      const isSelf = player.id === selfId;
      if (!player.alive && !isSelf && you?.alive) continue;
      if (!isSelf && !inView(player.x, player.y, 140)) continue;
      const entry = view.get(player.id) || { x: player.x, y: player.y, tx: player.x, ty: player.y, dir: 0 };
      let px;
      let py;
      if (isSelf && selfView && player.alive) {
        px = selfView.x;
        py = selfView.y;
        entry.x = px;
        entry.y = py;
        entry.tx = player.x;
        entry.ty = player.y;
      } else {
        const ease = 1 - Math.exp(-dt * 16);
        entry.x += (entry.tx - entry.x) * ease;
        entry.y += (entry.ty - entry.y) * ease;
        px = entry.x;
        py = entry.y;
      }
      const dx = entry.tx - entry.x;
      const dy = entry.ty - entry.y;
      if (Math.abs(dx) > 1 || Math.abs(dy) > 1) entry.dir = frameFor(dx, dy, entry.dir);

      const moving = Math.abs(dx) + Math.abs(dy) > 1;
      const bob = moving ? Math.round(Math.sin(now / 110) * 3) : 0;
      const ghost = !player.alive;
      if (!drawCrew(ctx, player.color, px + C.PLAYER_W / 2, py + C.PLAYER_H + bob, entry.dir, ghost ? 0.45 : 1)) {
        ctx.fillStyle = colorHex(player.color);
        ctx.beginPath();
        ctx.arc(px + C.PLAYER_W / 2, py + C.PLAYER_H / 2, 22, 0, Math.PI * 2);
        ctx.fill();
      }
      if (player.teammate) {
        ctx.strokeStyle = 'rgba(192,57,43,.85)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.ellipse(px + C.PLAYER_W / 2, py + C.PLAYER_H, 30, 12, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
      label(ctx, player.name, px + C.PLAYER_W / 2, py - 14, isSelf ? '#f2df6a' : '#e7e5e0', 30);
    }

    // Doors: red shutters over the sealed room's doorways.
    if (snap.doors) {
      for (const rect of snap.doors.rects) {
        ctx.fillStyle = 'rgba(150,40,34,.85)';
        ctx.fillRect(rect[0], rect[1], rect[2], rect[3]);
        ctx.strokeStyle = 'rgba(230,120,110,.7)';
        ctx.lineWidth = 2;
        ctx.strokeRect(rect[0], rect[1], rect[2], rect[3]);
      }
    }

    // Vision: a disc of light around the viewer and black past it. Crew get a
    // radius, the impostor a wider one, lights sabotage squeezes the crew, and
    // ghosts get 0, which means the whole ship.
    if (snap.vision > 0) {
      const glow = snap.vision;
      if (fogGlow !== glow || !fogGradient) {
        fogGlow = glow;
        fogGradient = ctx.createRadialGradient(0, 0, glow * 0.5, 0, 0, glow);
        fogGradient.addColorStop(0, 'rgba(0,0,0,0)');
        fogGradient.addColorStop(0.55, 'rgba(0,0,0,0.5)');
        fogGradient.addColorStop(1, 'rgba(0,0,0,0.985)');
      }
      ctx.save();
      ctx.translate(centreX, centreY);
      ctx.fillStyle = fogGradient;
      ctx.fillRect(camX - centreX - 10, camY - centreY - 10, viewW + 20, viewH + 20);
      ctx.restore();
    }

    // Critical sabotages: a red wash and the countdown.
    if (snap.sabotage && C.SABOTAGE[snap.sabotage.kind]?.critical) {
      const pulse = 0.12 + 0.08 * Math.sin(now / 220);
      ctx.fillStyle = `rgba(190,30,20,${pulse})`;
      ctx.fillRect(camX - 10, camY - 10, viewW + 20, viewH + 20);
      const tag = snap.sabotage.kind === 'o2' ? 'O2' : 'REACTOR';
      label(ctx, `${tag} ${Math.ceil(snap.sabotage.msLeft / 1000)}`, camX + viewW / 2, camY + 90, '#ffb3a8', 52);
    }

    ctx.restore();
  }

    asteroids(root, done) {
      let destroyed = 0;
      const target = 30;

      canvas.width = 960;

      canvas.className = 'asteroid-canvas';

      stage.append(canvas);

      const ctx = canvas.getContext('2d');
      const rocks = [];
      const art = [1, 2, 3, 4].map(number => loadImage(`asteroid${number}.png`));
      const ship = loadImage('starship.png');
      let frame = 0;
      let running = true;

      const spawn = () => {
        rocks.push({
          x: 40 + Math.random() * (canvas.width - 80),
          y: -60,
          r: 18 + Math.random() * 22,
          vy: 40 + Math.random() * 70,
          art: art[Math.floor(Math.random() * 4)],
        });
      };

      let last = performance.now();
      const loop = now => {
        if (!running) return;
        const dt = Math.min(0.05, (now - last) / 1000);
        last = now;
        frame += dt;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#05070c';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        if (ship.complete && ship.naturalWidth) {
          const sw = 200;
          const sh = sw * (ship.naturalHeight / ship.naturalWidth);
          ctx.drawImage(ship, canvas.width / 2 - sw / 2, canvas.height - sh + 40, sw, sh);
        }
        if (frame > 0.5) {
          frame = 0;
          spawn();
        }
        for (const rock of rocks) {
          rock.y += rock.vy * dt;
          if (rock.art.complete) ctx.drawImage(rock.art, rock.x - rock.r, rock.y - rock.r, rock.r * 2, rock.r * 2);
          else {
            ctx.fillStyle = '#8b8e94';
            ctx.beginPath();
            ctx.arc(rock.x, rock.y, rock.r, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        for (let index = rocks.length - 1; index >= 0; index -= 1) {
          if (rocks[index].y > canvas.height + 80) rocks.splice(index, 1);
        }
        requestAnimationFrame(loop);
      };
      requestAnimationFrame(loop);

      canvas.addEventListener('pointerdown', event => {
        const rect = canvas.getBoundingClientRect();
        const x = ((event.clientX - rect.left) / rect.width) * canvas.width;
        const y = ((event.clientY - rect.top) / rect.height) * canvas.height;
        for (let index = rocks.length - 1; index >= 0; index -= 1) {
          if (Math.hypot(rocks[index].x - x, rocks[index].y - y) <= rocks[index].r + 10) {

            destroyed += 1;
            count.textContent = `Destroyed ${destroyed} / ${target}`;
            if (destroyed >= target) {
              running = false;
              done();
            }
            return;
          }
        }
      });
      return () => {
        running = false;
      };

        const y = Math.min(rect.height, Math.max(0, event.clientY - rect.top));
        target.style.left = ((x / rect.width) * 100) + '%';
        target.style.top = ((y / rect.height) * 100) + '%';
        const distance = Math.hypot(x - rect.width / 2, y - rect.height / 2);
        if (distance < 26) {
          dragging = false;

          done();

      pad.addEventListener('pointerdown', event => {

          reset();

        card.classList.remove('dragging');
