  function openTask(station) {
    const task = C.stationById(station);
    if (!task || !GAMES[task.game]) return;
    closeTask();
    $('task-title').textContent = task.label;
    const body = $('task-body');
    body.replaceChildren();
    $('overlay-task').hidden = false;
    const cleanup = GAMES[task.game](body, () => {
      // The host decides; its `task` event closes this window, so a refusal
      // (walked away, already done) leaves the board up with the reason.
      send({ t: 'use', station: task.id });
    });
    taskOpen = { cleanup: typeof cleanup === 'function' ? cleanup : null };
  }

  function closeTask() {
    if (taskOpen?.cleanup) taskOpen.cleanup();
    taskOpen = null;
    $('overlay-task').hidden = true;
    $('task-body').replaceChildren();
  }

  function closeList() {
    $('overlay-list').hidden = true;
    mapCanvas = null;
  }

  function openList(kind) {
    if (snap?.sabotage && snap.sabotage.kind === 'comms') {
      toast('Comms are down.');
      return;
    }
    closeRoom();
    $('overlay-list').hidden = false;
    $('list-title').textContent = kind === 'map' ? 'The Skeld' : 'Tasks';
    const body = $('list-body');
    body.replaceChildren();
    mapCanvas = null;
    if (kind === 'map') {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = Math.round(1024 * (C.WORLD.h / C.WORLD.w));
      canvas.className = 'map-canvas';
      body.append(canvas);
      mapCanvas = canvas;
      drawMap(canvas);
      return;
    }
    const you = snap?.you;
    const list = el('ul', 'roster tasks-list');
    if (!you || !you.tasks || !you.tasks.length) {
      list.append(el('li', 'row-item', you?.role === 'impostor' ? 'Fake tasks. Sabotage, vent, kill.' : 'No tasks dealt.'));
    } else {
      for (const id of you.tasks) {
        const task = C.stationById(id);
        if (!task) continue;
        const done = you.doneIds.includes(id);
        const row = el('li', 'row-item');
        row.append(el('span', 'dot', done ? '✓' : '·'));
        row.firstElementChild.style.background = done ? '#4f8f4f' : 'transparent';
        row.append(el('span', 'name', task.label));
        row.append(el('span', 'tail', task.room));
        list.append(row);
      }
    }
    if (you?.alive && you?.tasks?.includes('fuel') && !you.doneIds.includes('fuel') && !you.gas) {
      const row = el('li', 'row-item');
      row.append(el('span', 'dot'));
      row.append(el('span', 'name', 'Find a gas can'));
      row.append(el('span', 'tail', 'Storage'));
      list.append(row);
    }
    body.append(list);
    body.append(el('p', 'hint', you?.role === 'impostor'
      ? 'Your list is a decoy. The crew wins by finishing theirs; you have to stop them.'
      : `${you?.done || 0} of ${you?.total || 0} of your tasks done · ${snap?.tasks.done || 0} of ${snap?.tasks.total || 0} across the ship.`));
  }

  function drawMap(canvas) {
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (MINI_ART.complete && MINI_ART.naturalWidth) {
      ctx.drawImage(MINI_ART, 0, 0, canvas.width, canvas.height);
    } else {
      ctx.fillStyle = '#15171a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
    const sx = canvas.width / C.WORLD.w;
    const sy = canvas.height / C.WORLD.h;
    const you = snap?.you;
    for (const id of you?.tasks || []) {
      if (you.doneIds.includes(id)) continue;
      const station = C.stationById(id);
      if (!station) continue;
      ctx.fillStyle = '#f2df6a';
      ctx.beginPath();
      ctx.arc(station.x * sx, station.y * sy, 5, 0, Math.PI * 2);
      ctx.fill();
    }
    for (const player of snap?.players || []) {
      if (!player.alive) continue;
      ctx.fillStyle = player.id === selfId ? '#ffffff' : colorHex(player.color);
      ctx.strokeStyle = '#0d0e10';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc((player.x + C.PLAYER_W / 2) * sx, (player.y + C.PLAYER_H / 2) * sy, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }
  }

  /* ── input ───────────────────────────────────────────────────────────── */

  function walkVector() {
    let x = 0;
    let y = 0;
    if (keys.has('a') || keys.has('arrowleft')) x -= 1;
    if (keys.has('d') || keys.has('arrowright')) x += 1;
    if (keys.has('w') || keys.has('arrowup')) y -= 1;
    if (keys.has('s') || keys.has('arrowdown')) y += 1;
    return { x, y };
  }

  function pushWalk() {
    const dir = walkVector();
    if (dir.x === sentDir.x && dir.y === sentDir.y) return;
    sentDir = dir;
    if (dir.x || dir.y) send({ t: 'walk', dx: dir.x, dy: dir.y });
    else send({ t: 'stop' });
  }

  function send(message) {
    if (!session) return;
    session.send(message);
  }

  // One key for the thing in front of you, in the order that matters: a live
  // sabotage, then a kill, then a body, the button, a task, the can, a vent.
  function interact() {
    if (!snap) return;
    const actions = snap.actions;
    if (actions.fix && actions.fix.length) return trigger('fix');
    if (actions.kill) return trigger('kill');
    if (actions.report) return trigger('report');
    if (actions.button) return trigger('button');
    if (actions.use) return trigger('use');
    if (actions.gas) return trigger('gas');
    if (actions.vent) return trigger('vent');
  }

  function trigger(action) {
    if (!snap) return;
    if (action === 'use' && snap.actions.use) openTask(snap.actions.use);
    if (action === 'gas' && snap.actions.gas) send({ t: 'use', station: 'gascan' });
    if (action === 'kill' && snap.actions.kill) send({ t: 'kill', target: snap.actions.kill });
    if (action === 'vent' && snap.actions.vent) {
      send({ t: 'vent' });
      toast('Through the vent.');
    }
    if (action === 'report' && snap.actions.report) send({ t: 'report', body: snap.actions.report });
    if (action === 'button' && snap.actions.button) send({ t: 'button' });
    if (action === 'fix' && snap.actions.fix.length) send({ t: 'fix', pad: snap.actions.fix[0] });
    if (action === 'lights') send({ t: 'sabotage', kind: 'lights' });
    if (action === 'reactor') send({ t: 'sabotage', kind: 'reactor' });
    if (action === 'o2') send({ t: 'sabotage', kind: 'o2' });
    if (action === 'comms') send({ t: 'sabotage', kind: 'comms' });
    if (action === 'doors') send({ t: 'sabotage', kind: 'doors' });
  }

  function pointerTarget(event) {
    const canvas = $('board');
    const rect = canvas.getBoundingClientRect();
    if (!rect.width || !rect.height) return null;
    const scale = Math.min(rect.width / C.VIEW.w, rect.height / C.VIEW.h) * C.VIEW.zoom;
    const viewW = rect.width / scale;
    const viewH = rect.height / scale;
    const me = snap?.players.find(player => player.id === selfId);
    const focus = selfView || { x: me?.x || 0, y: me?.y || 0 };
    const centreX = focus.x + C.PLAYER_W / 2;
    const centreY = focus.y + C.PLAYER_H / 2;
    const camX = C.WORLD.w <= viewW ? (C.WORLD.w - viewW) / 2 : Math.min(Math.max(0, centreX - viewW / 2), C.WORLD.w - viewW);
    const camY = C.WORLD.h <= viewH ? (C.WORLD.h - viewH) / 2 : Math.min(Math.max(0, centreY - viewH / 2), C.WORLD.h - viewH);
    return {
      x: (event.clientX - rect.left) / scale + camX,
      y: (event.clientY - rect.top) / scale + camY,
    };
  }

  const overlayOpen = () => !$('overlay-task').hidden || !$('overlay-list').hidden;

  window.addEventListener('keydown', event => {
    if (event.target instanceof HTMLElement && event.target.matches('input, select, textarea')) return;
    const key = event.key.toLowerCase();
    if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' ', 'tab'].includes(key)) event.preventDefault();

    if (key === 'escape') {
      if (!$('overlay-room').hidden) closeRoom();
      else if (!$('overlay-chat').hidden) $('overlay-chat').hidden = true;
      else if (!$('overlay-list').hidden) closeList();
      else if (!$('overlay-task').hidden) closeTask();
      return;
    }
    if (overlayOpen()) return;

    if (key === 'tab' || key === 't') {
      if (snap && snap.phase !== 'lobby') openList('tasks');
      return;
    }
    if (key === 'm') {
      if (snap && snap.phase !== 'lobby') openList('map');
      return;
    }
    // Enter does whatever is in front of you; Space stays the old
    // use/fix/button shortcut. Sabotage, kill and vent live on their buttons.
    if (key === ' ' || key === 'spacebar') {
      if (snap?.actions.fix?.length) trigger('fix');
      else if (snap?.actions.use) trigger('use');
      else trigger('button');
      return;
    }
    if (key === 'enter') {
      interact();
      return;
    }
    if (key === 'r') {
      trigger('report');
      return;
    }
    if (['w', 'a', 's', 'd', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(key)) {
      keys.add(key);
      pushWalk();
    }
  });

  window.addEventListener('keyup', event => {
    const key = event.key.toLowerCase();
    if (keys.delete(key)) pushWalk();
  });

  window.addEventListener('blur', () => {
    keys.clear();
    pushWalk();
  });

  // Touch: drag anywhere on the ship and the crewmate walks that way.
  let lastGoto = 0;
  $('board').addEventListener('pointerdown', event => {
    if (overlayOpen()) return;
    const target = pointerTarget(event);
    if (!target) return;
    lastGoto = performance.now();
    send({ t: 'goto', x: target.x - C.PLAYER_W / 2, y: target.y - C.PLAYER_H / 2 });
  });

  $('board').addEventListener('pointermove', event => {
    if (!event.buttons || overlayOpen()) return;
    if (performance.now() - lastGoto < 90) return;
    const target = pointerTarget(event);
    if (!target) return;
    lastGoto = performance.now();
    send({ t: 'goto', x: target.x - C.PLAYER_W / 2, y: target.y - C.PLAYER_H / 2 });
  });

  $('public-join').addEventListener('click', () => openSession({ mode: 'public', code: '', intent: 'join' }));
  $('create').addEventListener('click', () => {
    const code = N.makeCode();
    openSession({ mode: 'private', code, intent: 'host' });
  });
  $('join').addEventListener('click', () => {
    const code = ($('code').value || '').trim().toUpperCase();
    if (code.length !== 4) {
      menuStatus('Room codes are four characters.', true);
      return;
    }
    openSession({ mode: 'private', code, intent: 'join' });
  });
  $('leave').addEventListener('click', leave);
  $('start').addEventListener('click', () => send({ t: 'start' }));
  $('back-lobby').addEventListener('click', () => send({ t: 'lobby' }));
  $('act-use').addEventListener('click', () => trigger('use'));
  $('act-gas').addEventListener('click', () => trigger('gas'));
  $('act-kill').addEventListener('click', () => trigger('kill'));
  $('act-vent').addEventListener('click', () => trigger('vent'));
  $('act-report').addEventListener('click', () => trigger('report'));
  $('act-button').addEventListener('click', () => trigger('button'));
  $('act-fix').addEventListener('click', () => trigger('fix'));
  $('sab-lights').addEventListener('click', () => trigger('lights'));
  $('sab-reactor').addEventListener('click', () => trigger('reactor'));
  $('sab-o2').addEventListener('click', () => trigger('o2'));
  $('sab-comms').addEventListener('click', () => trigger('comms'));
  $('sab-doors').addEventListener('click', () => trigger('doors'));
  $('open-vitals').addEventListener('click', () => openRoom('vitals'));
  $('open-admin').addEventListener('click', () => openRoom('admin'));
  $('open-cams').addEventListener('click', () => openRoom('cams'));
  $('room-close').addEventListener('click', closeRoom);
  $('open-chat').addEventListener('click', () => {
    $('overlay-chat').hidden = false;
    renderChat($('chat-log'), snap?.ghostChat || [], true);
    renderPhrases($('chat-phrases'), true);
  });
  $('chat-close').addEventListener('click', () => { $('overlay-chat').hidden = true; });
  $('open-tasks').addEventListener('click', () => openList('tasks'));
  $('open-map').addEventListener('click', () => openList('map'));
  $('skip').addEventListener('click', () => send({ t: 'vote', target: 'skip' }));
  $('task-close').addEventListener('click', closeTask);
  $('list-close').addEventListener('click', closeList);

  $('copy').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(snap?.code || '');
      toast('Code copied.');
    } catch {
      toast(`Code: ${snap?.code || ''}`);
    }
  });

  for (const id of ['set-cooldown', 'set-distance', 'set-speed', 'set-vision', 'set-discussion', 'set-voting']) {
    $(id).addEventListener('change', () => {
      send({
        t: 'settings',
        settings: {
          killCooldownSec: Number($('set-cooldown').value),
          killDistance: $('set-distance').value,
          speed: Number($('set-speed').value),
          crewVision: Number($('set-vision').value),
          discussionSec: Number($('set-discussion').value),
          votingSec: Number($('set-voting').value),
        },
      });
    });
  }

  window.addEventListener('beforeunload', () => {
    try {
      session?.close();
    } catch {}
  });

  // Start the name field from the name this player uses across Bored: the hub
  // publishes it for games that run in its frame. A crew name they picked here
  // before is kept, and the field stays editable either way.
  const sitePlayerName = () => {
    try {
      if (window.parent === window) return '';
      const name = window.parent.__boredPlayer?.name;
      return typeof name === 'string' ? name.trim().slice(0, 12) : '';
    } catch {
      return '';
    }
  };
  const rememberedName = () => {
    try {
      return localStorage.getItem('bored.imposter.name') || '';
    } catch {
      return '';
    }
  };
  const prefillName = () => {
    const field = $('name');
    if (!field || field.value.trim()) return;
    const name = rememberedName().slice(0, 12) || sitePlayerName();
    if (name) field.value = name;
  };
  prefillName();
  // The handle can finish loading after this document does; fill a still-empty field.
  setTimeout(prefillName, 1500);

  // Test hooks: the snapshot is read-only, and the task windows can be opened
  // on their own so a suite can check the ported screens without a round.
  window.__imposterOpenTask = id => openTask(id);
  window.__imposterOpenMap = () => openList('map');
  window.__imposterTest = () => (snap
    ? { phase: snap.phase, code: snap.code, net: snap.net, you: snap.you, players: snap.players, bodies: snap.bodies, meeting: snap.meeting, tasks: snap.tasks, sabotage: snap.sabotage, actions: snap.actions, self: selfView ? { x: selfView.x, y: selfView.y } : null }
    : null);

  show('menu');
  menuStatus('');
  if (!N.supported) {
    menuStatus('This browser cannot open a data channel. Imposter needs WebRTC.', true);
  }
  requestAnimationFrame(draw);
})();

</script>
</body>
</html>
