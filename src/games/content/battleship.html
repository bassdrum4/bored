<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Battleship</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e8e9e3;color:#21343c;font:15px system-ui,sans-serif;min-height:100vh}main{max-width:1100px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:clamp(28px,5vw,46px);margin:0;letter-spacing:-2px}small{font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#557178}button{font:inherit;cursor:pointer;border:1px solid #557178;border-radius:6px;padding:9px 14px;background:#fafaf5;color:#21343c;font-weight:650}button:disabled{cursor:default;opacity:.65}button.primary{background:#244c57;color:white;border-color:#244c57}#status{padding:16px 0;font-size:17px;font-weight:650;min-height:52px}.boards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.panel{background:#f7f8f2;padding:14px;border:1px solid #a9b9b6;border-radius:10px}h2{font-size:18px;margin:0 0 8px}.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;background:#365964;padding:5px;border-radius:5px}.cell{padding:0;aspect-ratio:1;border:0;border-radius:2px;background:#a9c8ce;color:#203a42;font-size:clamp(10px,2vw,20px);line-height:1;opacity:1!important}.cell:not(:disabled):hover{background:#e5d4a6;outline:2px solid #fff;z-index:1}.cell.ship{background:#49676c;color:white}.cell.hit{background:#b94c3b;color:white}.cell.miss{background:#dbe7e6;color:#526c72}.cell.sunk{background:#743c39;color:white}.tools{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.legend{display:flex;gap:12px;flex-wrap:wrap;color:#51636a;font-size:13px;margin:12px 0}.hidden{display:none!important}.count{font-size:13px;color:#527078;margin-bottom:10px}#help{color:#51636a;line-height:1.5}@media(max-width:620px){main{padding:12px}.boards{grid-template-columns:1fr;gap:12px}.panel{padding:9px}.cell{font-size:16px}}
</style></head><body><main><header><div><small>Naval strategy</small><h1>Battleship</h1></div><button id="restart">New game</button></header><div id="status" role="status"></div><div id="tools" class="tools"><button id="rotate">Horizontal</button><button id="random">Randomize</button><button id="clear">Clear</button><button class="primary" id="ready">Deploy fleet</button></div><div class="boards"><section class="panel"><h2>Your fleet</h2><div class="count" id="ownCount"></div><div id="own" class="grid"></div></section><section class="panel"><h2>Enemy waters</h2><div class="count" id="enemyCount"></div><div id="enemy" class="grid"></div></section></div><div class="legend">● Miss &nbsp; × Hit &nbsp; ■ Ship</div><p id="help">Place five ships (5, 4, 3, 3, 2 cells). Fire once each turn. Sink every enemy ship to win.</p></main>
<script>
'use strict';
const lengths=[5,4,3,3,2], bridge=window.__boredTogether, $=id=>document.getElementById(id);
let ctx=bridge?.context, fleet=[], enemy=[], shots=[], incoming=[], vertical=false, phase='setup', busy=false, winner=null, generation=0;
const range=()=>Array.from({length:100},(_,i)=>i), key=i=>String.fromCharCode(65+Math.floor(i/10))+(i%10+1);
function cells(start,len,vert){return Array.from({length:len},(_,i)=>start+i*(vert?10:1)).filter(i=>i<100&&(vert||Math.floor(i/10)===Math.floor(start/10)));}
function fits(f,start,len,vert){const c=cells(start,len,vert);return c.length===len&&c.every(i=>!f.flat().includes(i))?c:null;}
function randomFleet(){const f=[];for(const len of lengths){const choices=[];for(const i of range())for(const v of [false,true]){const c=fits(f,i,len,v);if(c)choices.push(c);}if(!choices.length)return randomFleet();f.push(choices[Math.floor(Math.random()*choices.length)]);}return f;}
const shot=(f,i)=>({cell:i,hit:f.flat().includes(i)});
const lost=(f,s)=>f.length===5&&f.flat().every(i=>s.some(x=>x.cell===i&&x.hit));
function cpuPick(){const used=new Set(incoming.map(s=>s.cell)), hits=incoming.filter(s=>s.hit).map(s=>s.cell), candidates=new Set();for(const i of hits){for(const n of [i-10,i+10,i%10?i-1:-1,i%10<9?i+1:-1])if(n>=0&&n<100&&!used.has(n))candidates.add(n);}let list=[...candidates];if(!list.length)list=range().filter(i=>!used.has(i)&&(Math.floor(i/10)+i%10)%2===0);if(!list.length)list=range().filter(i=>!used.has(i));return list[Math.floor(Math.random()*list.length)];}
function board(id,f,s,enabled,action){const root=$(id);root.replaceChildren();for(const i of range()){const b=document.createElement('button'), hit=s.find(x=>x.cell===i), ship=f.some(x=>x.includes(i));b.type='button';b.className='cell'+(hit?(hit.hit?' hit':' miss'):ship?' ship':'');b.textContent=hit?(hit.hit?'×':'●'):ship?'■':'';b.setAttribute('aria-label',key(i)+(hit?(hit.hit?' hit':' miss'):ship?' ship':''));b.disabled=!enabled||!!hit;b.onclick=()=>action(i);root.append(b);}}
function sync(){if(!bridge)return;const s=ctx.state||{};fleet=s.fleet||fleet;shots=s.outgoing||[];incoming=s.incoming||[];winner=s.winner;phase=ctx.status!=='active'?'over':!s.placed?'setup':s.ready?'battle':'waiting';}
function render(){const seat=ctx?.seat||1, playable=!busy&&(!bridge||ctx.canPlay);$('tools').classList.toggle('hidden',phase!=='setup'||!playable);$('restart').classList.toggle('hidden',!!bridge);$('rotate').textContent=vertical?'Vertical':'Horizontal';$('ready').disabled=fleet.length!==5;$('status').textContent=busy?'Saving / resolving turn...':phase==='over'?(winner===seat?'Victory! All enemy ships sunk.':winner?'Defeat. Your fleet has been sunk.':'Match ended.'):phase==='setup'?(playable?(fleet.length===5?'Fleet ready. Deploy when ready.':'Place your '+lengths[fleet.length]+'-cell ship.'): 'Waiting for opponent.'):phase==='waiting'||!playable?'Waiting for opponent.':'Your turn — select enemy waters.';$('ownCount').textContent=phase==='setup'?fleet.length+' / 5 ships placed':incoming.filter(x=>x.hit).length+' / 17 cells hit';$('enemyCount').textContent=shots.filter(x=>x.hit).length+' / 17 cells hit';board('own',fleet,incoming,phase==='setup'&&playable,i=>{if(fleet.length>=5)return;const c=fits(fleet,i,lengths[fleet.length],vertical);if(c){fleet.push(c);render();}else $('status').textContent='Ship does not fit there. Try another square.';});board('enemy',[],shots,phase==='battle'&&playable,fire);}
async function online(move){if(busy)return;busy=true;render();try{ctx=await bridge.submit(move);busy=false;sync();render();if(!ctx.canPlay||ctx.status!=='active')setTimeout(()=>bridge.finishTurn(),1000);}catch(e){busy=false;render();bridge.error(e,()=>online(move));}}
function fire(i){if(busy||phase!=='battle'||shots.some(x=>x.cell===i))return;if(bridge){if(ctx.canPlay)online({fire:i});return;}shots.push(shot(enemy,i));if(lost(enemy,shots)){winner=1;phase='over';render();return;}busy=true;render();const token=generation;setTimeout(()=>{if(token!==generation)return;incoming.push(shot(fleet,cpuPick()));busy=false;if(lost(fleet,incoming)){winner=2;phase='over';}render();},420);}
$('rotate').onclick=()=>{vertical=!vertical;render();};$('random').onclick=()=>{fleet=randomFleet();render();};$('clear').onclick=()=>{fleet=[];render();};$('ready').onclick=()=>{if(fleet.length!==5||busy)return;if(bridge){online({fleet});return;}enemy=randomFleet();phase='battle';render();};$('restart').onclick=()=>{generation++;fleet=[];enemy=[];shots=[];incoming=[];winner=null;busy=false;phase='setup';render();};sync();render();
</script></body></html>
