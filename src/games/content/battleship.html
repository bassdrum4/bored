<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Battleship</title>
<style>
:root{color-scheme:light;--paper:#ece9df;--ink:#19313d;--navy:#193543;--water:#47748a;--grid:#284e63;--muted:#576970;--red:#d34c39}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.4 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #bd7b38;outline-offset:2px}button:disabled{cursor:default}.hidden{display:none!important}
main{max-width:1280px;margin:auto;padding:0 clamp(12px,2.5vw,32px) 18px}header{margin:0 calc(-1 * clamp(12px,2.5vw,32px));padding:12px clamp(12px,2.5vw,32px);background:var(--navy);color:#f9f7ef;display:flex;align-items:center;gap:16px;justify-content:space-between;border-bottom:3px solid #bdac82}.brand{display:flex;align-items:center;gap:12px;min-width:0}.brand svg{width:46px;height:30px;flex:none}h1{font-size:clamp(23px,3vw,31px);line-height:1.1;letter-spacing:-.045em;margin:0;font-weight:760}.brand small{display:block;text-transform:uppercase;letter-spacing:.12em;font:600 10px/1.4 system-ui;color:#b5c8d0;margin-top:3px}
header button,.tools button{border:1px solid #789099;background:transparent;color:inherit;border-radius:3px;padding:8px 13px;font-weight:650;font-size:13px;white-space:nowrap}header button:hover{background:#315260}.tools button{color:var(--ink);border-color:#a6aea8;background:#f8f6ee}.tools button:hover:not(:disabled){background:#e1e7e3}.tools button:disabled{opacity:.45}.tools .primary{background:var(--navy);border-color:var(--navy);color:#fff;margin-left:auto}.tools .primary:hover:not(:disabled){background:#31596c}
.command{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:13px 0 12px}#status{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;min-height:25px}#status:before{content:"";display:block;width:9px;height:9px;border-radius:50%;background:#af873f;box-shadow:0 0 0 3px #c9bd9d;flex:none}body[data-phase=battle] #status:before{background:#3e7569;box-shadow:0 0 0 3px #c0d3c6}body[data-busy=true] #status:before{background:#a36b3d}#mode{color:var(--muted);font-size:12px;font-weight:650;text-transform:uppercase;letter-spacing:.08em}.tools{display:flex;gap:7px;flex-wrap:wrap;padding:0 0 12px}.tools button svg{vertical-align:-3px;width:16px;height:16px;margin-right:6px;fill:none;stroke:currentColor;stroke-width:1.6}
.boards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,2.5vw,28px);align-items:start}.panel{min-width:0;border:1px solid #193543;background:var(--navy);padding:0 3px 3px;box-shadow:0 2px 0 #172b3420}.boardhead{display:flex;justify-content:space-between;align-items:center;gap:8px;color:#f4f1e9;padding:9px 10px 7px}h2{font-size:17px;line-height:1.1;margin:0;letter-spacing:-.02em}.count{font-size:11px;font-weight:600;color:#c1d1d8;white-space:nowrap;font-variant-numeric:tabular-nums}.grid{display:grid;grid-template-columns:.62fr repeat(10,minmax(0,1fr));grid-template-rows:24px repeat(10,minmax(0,1fr));gap:1px;background:var(--grid);position:relative;isolation:isolate;overflow:hidden}.coord{display:flex;align-items:center;justify-content:center;background:var(--navy);color:#dce5e7;font:600 clamp(9px,1.2vw,12px)/1 ui-monospace,monospace;user-select:none}.cell{border:0;border-radius:0;padding:0;aspect-ratio:1;width:100%;min-width:0;min-height:0;background:var(--water);position:relative;display:grid;place-items:center;touch-action:manipulation}.cell.alt{background:#4c7a90}.cell:not(:disabled){cursor:crosshair}.cell:not(:disabled):hover,.cell:not(:disabled):focus-visible{background:#6c9ca9;outline:2px solid #f3e9c5;outline-offset:-2px;z-index:4}.cell.preview{background:#78999a;box-shadow:inset 0 0 0 1px #e5e0c4}.cell.invalid{background:#995b55}.cell.hit,.cell.miss{cursor:default}.marker{width:44%;height:44%;position:relative;z-index:3;display:block;pointer-events:none}.marker.miss{border:clamp(2px,.27vw,4px) solid #f3f1e8;border-radius:50%;box-shadow:0 1px 2px #18374699,inset 0 1px 1px #18374688}.marker.hit:before,.marker.hit:after{content:"";position:absolute;left:42%;top:0;width:20%;height:100%;background:#ef634c;box-shadow:0 1px 1px #471f19;transform:rotate(45deg)}.marker.hit:after{transform:rotate(-45deg)}.cell.hit .marker{z-index:5}.cell.hit{z-index:3;background:#704f4b}.vessel{position:relative;z-index:2;pointer-events:none;min-width:0;min-height:0;align-self:stretch;justify-self:stretch;filter:drop-shadow(0 2px 1px #102e3b99)}.vessel svg{display:block;position:absolute;inset:0;width:100%;height:100%;overflow:visible}.vessel.sunk{opacity:.45;filter:none}
body[data-phase=setup] #enemy{opacity:.62}body[data-phase=setup] #enemy .cell{cursor:default}.under{display:grid;grid-template-columns:1.7fr 1fr;gap:clamp(12px,2.5vw,28px);padding-top:14px}.manifest,.report{border-top:2px solid #9baaa7;padding-top:9px;min-width:0}.under h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;margin:0 0 8px}.fleet-list{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}.fleet-item{padding:5px 4px 6px;border-bottom:2px solid #b7bdb4;text-align:center;min-width:0;color:#58696c}.fleet-item svg{display:block;width:100%;height:24px;margin:0 auto 4px;max-width:88px}.fleet-item strong{display:block;font-size:11px;line-height:1.2;overflow-wrap:anywhere}.fleet-item span{font-size:10px;white-space:nowrap}.fleet-item.current{color:var(--ink);background:#e1dccb;border-color:#b08d45}.fleet-item.deployed{color:#244e55;border-color:#578478}.fleet-item.sunk{color:#9e4238;border-color:#b65a4c}.fleet-item.sunk svg{opacity:.4}.legend{display:flex;align-items:center;gap:13px;font-size:12px;flex-wrap:wrap}.legend-item{display:inline-flex;gap:6px;align-items:center}.legend .marker{width:16px;height:16px;display:inline-block}.legend .marker.miss{border:2px solid #657c82;box-shadow:none}.legend .marker.hit:before,.legend .marker.hit:after{box-shadow:none;background:var(--red)}#tally{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}#help{font-size:12px;line-height:1.45;color:var(--muted);margin:9px 0 0}
@media(min-width:800px) and (max-height:780px){main{max-width:min(1280px,calc(2 * (100dvh - 225px) + 90px))}}
@media(max-width:640px){main{max-width:500px}header{gap:8px}.brand svg{width:32px}.boards{grid-template-columns:1fr;gap:13px}body[data-phase=battle] .enemy-panel{order:-1}.under{grid-template-columns:1fr;gap:12px}.command{padding:10px 0}.tools .primary{margin-left:0}.tools button{padding:7px 9px}.boardhead{padding:8px}.grid{grid-template-rows:22px repeat(10,minmax(0,1fr))}#status{font-size:13px}#mode{font-size:10px}}
@media(prefers-reduced-motion:no-preference){.cell{transition:background-color .10s}.marker{animation:stamp .18s ease-out}@keyframes stamp{from{scale:1.2;opacity:.6}to{scale:1;opacity:1}}}
</style></head><body><main><header><div class="brand"><svg viewBox="0 0 64 36" aria-hidden="true"><path fill="currentColor" d="M2 24h60L53 33H12L2 24zm10-3 9-4h8V9h7V4h3v5h6v8h8l5 4H12z"/></svg><div><h1>Battleship</h1><small>Fleet command</small></div></div><button id="restart">New game</button></header>
<div class="command"><div id="status" role="status" aria-live="polite"></div><span id="mode"></span></div>
<div id="tools" class="tools"><button id="rotate"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7a9 9 0 1 0 1 8M20 2v5h-5"/></svg><span id="orientation">Horizontal</span></button><button id="random"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h3c5 0 7 14 12 14h3m-5-4 5 4-5 4M3 19h3c5 0 7-14 12-14h3m-5-4 5 4-5 4"/></svg>Randomize</button><button id="clear"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14M10 10v7m4-7v7"/></svg>Clear</button><button class="primary" id="ready">Deploy fleet</button></div>
<div class="boards"><section class="panel"><div class="boardhead"><h2>Your fleet</h2><div class="count" id="ownCount"></div></div><div id="own" class="grid" aria-label="Your fleet board"></div></section><section class="panel enemy-panel"><div class="boardhead"><h2>Enemy waters</h2><div class="count" id="enemyCount"></div></div><div id="enemy" class="grid" aria-label="Enemy target board"></div></section></div>
<div class="under"><section class="manifest"><h3>Fleet manifest</h3><div id="fleetList" class="fleet-list"></div></section><section class="report"><h3>Shot report</h3><div class="legend"><span class="legend-item"><i class="marker hit"></i>Hit</span><span class="legend-item"><i class="marker miss"></i>Miss</span><span id="tally"></span></div><p id="help">Place five ships. Fire once each turn. Sink every enemy ship to win.</p></section></div></main>
<script>
'use strict';
const lengths=[5,4,3,3,2], bridge=window.__boredTogether, $=id=>document.getElementById(id);
let ctx=bridge?.context, fleet=[], enemy=[], shots=[], incoming=[], vertical=false, phase='setup', busy=false, winner=null, generation=0;
const range=()=>Array.from({length:100},(_,i)=>i), key=i=>String.fromCharCode(65+Math.floor(i/10))+(i%10+1);
function cells(start,len,vert){return Array.from({length:len},(_,i)=>start+i*(vert?10:1)).filter(i=>i<100&&(vert||Math.floor(i/10)===Math.floor(start/10)));}
function fits(f,start,len,vert){const c=cells(start,len,vert);return c.length===len&&c.every(i=>!f.flat().includes(i))?c:null;}
function randomFleet(){const f=[];for(const len of lengths){const choices=[];for(const i of range())for(const v of [false,true]){const c=fits(f,i,len,v);if(c)choices.push(c);}if(!choices.length)return randomFleet();f.push(choices[Math.floor(Math.random()*choices.length)]);}return f;}
const shot=(f,i)=>({cell:i,hit:f.flat().includes(i)});
const lost=(f,s)=>f.length===5&&f.flat().every(i=>s.some(x=>x.cell===i&&x.hit));
function cpuPick(){const used=new Set(incoming.map(s=>s.cell)), hits=incoming.filter(s=>s.hit).map(s=>s.cell), candidates=new Set();for(const i of hits){for(const n of [i-10,i+10,i%10?i-1:-1,i%10<9?i+1:-1])if(n>=0&&n<100&&!used.has(n))candidates.add(n);}let list=[...candidates];if(!list.length)list=range().filter(i=>!used.has(i)&&(Math.floor(i/10)+i%10)%2===0);if(!list.length)list=range().filter(i=>!used.has(i));return list[Math.floor(Math.random()*list.length)];}
const shipNames=['Carrier','Battleship','Cruiser','Submarine','Destroyer'];
function hull(length,index,vert=false,flat=false){
 const w=100*length, end=w-12, mid=w*.5;
 const outline=index===0?'M14 21 L'+(w-20)+' 21 L'+end+' 32 V68 L'+(w-20)+' 79 H14 L5 65 V35 Z': 'M5 50 Q25 19 64 19 H'+(w-42)+' Q'+end+' 20 '+end+' 39 V61 Q'+end+' 80 '+(w-42)+' 81 H64 Q25 81 5 50Z';
 const detail=index===0?'<path d="M25 38H'+(w-33)+'M25 62H'+(w-33)+'" stroke="#d5dbd8" stroke-width="2" stroke-dasharray="16 9"/><rect x="'+(mid-26)+'" y="22" width="52" height="18" rx="3" fill="#344a54"/><path d="M'+(mid-8)+' 22V10h16v12" stroke="#c1cdcd" stroke-width="3"/>':index===3?'<rect x="'+(mid-27)+'" y="32" width="54" height="36" rx="12" fill="#3d5660" stroke="#a9b9be" stroke-width="2"/><rect x="'+(mid-8)+'" y="39" width="16" height="22" rx="3" fill="#8e9fa4"/>':'<rect x="'+(mid-34)+'" y="29" width="68" height="42" rx="5" fill="#435c67" stroke="#a8b7ba" stroke-width="2"/><rect x="'+(mid-17)+'" y="37" width="34" height="26" rx="3" fill="#a4b3b5"/>'+[w*.23,w*.78].map(x=>'<circle cx="'+x+'" cy="50" r="12" fill="#485f69" stroke="#adbdc0" stroke-width="2"/><path d="M'+(x-9)+' 47h-15m15 6h-15" stroke="#c0c9c8" stroke-width="3" stroke-linecap="round"/>').join('');
 return '<svg aria-hidden="true" viewBox="0 0 '+(vert?'100 '+w:w+' 100')+'" xmlns="http://www.w3.org/2000/svg"><g'+(vert?' transform="translate(100 0) rotate(90)"':'')+'><path d="'+outline+'" fill="'+(flat?'#294c5b':'#7c9299')+'" stroke="'+(flat?'#294c5b':'#d1dad8')+'" stroke-width="3" stroke-linejoin="round"/>'+(flat?'':'<path d="M23 50H'+(w-25)+'" stroke="#becacb" stroke-width="1.5" opacity=".6"/>'+detail)+'</g></svg>';
}
function board(id,f,s,enabled,action){
 const root=$(id);root.replaceChildren();
 const label=(value,r,c)=>{const el=document.createElement('span');el.className='coord';el.textContent=value;el.style.gridArea=r+' / '+c;el.setAttribute('aria-hidden','true');root.append(el);};
 label('',1,1);for(let i=0;i<10;i++){label(i+1,1,i+2);label(String.fromCharCode(65+i),i+2,1);}
 const buttons=[];
 const clearPreview=()=>buttons.forEach(b=>b.classList.remove('preview','invalid'));
 const preview=i=>{clearPreview();if(id!=='own'||phase!=='setup'||!enabled||f.length>=5)return;const c=cells(i,lengths[f.length],vertical), valid=fits(f,i,lengths[f.length],vertical);for(const n of c)buttons[n]?.classList.add(valid?'preview':'invalid');};
 for(const i of range()){
  const b=document.createElement('button'), mark=s.find(x=>x.cell===i), ship=f.some(x=>x.includes(i));b.type='button';
  b.className='cell'+((Math.floor(i/10)+i%10)%2?' alt':'')+(mark?(mark.hit?' hit':' miss'):ship?' ship':'');
  b.style.gridArea=(Math.floor(i/10)+2)+' / '+(i%10+2);
  if(mark){const peg=document.createElement('span');peg.className='marker '+(mark.hit?'hit':'miss');peg.setAttribute('aria-hidden','true');b.append(peg);}
  b.setAttribute('aria-label',key(i)+(mark?(mark.hit?' hit':' miss'):ship?' ship':''));
  b.disabled=!enabled||!!mark;b.onclick=()=>action(i);b.onpointerenter=()=>preview(i);b.onpointerleave=clearPreview;b.onfocus=()=>preview(i);b.onblur=clearPreview;buttons.push(b);root.append(b);
 }
 for(const [index,ship] of f.entries()){
  const start=ship[0],vert=ship[1]-start===10, row=Math.floor(start/10)+2,col=start%10+2;
  const el=document.createElement('div');el.className='vessel'+(ship.every(i=>s.some(x=>x.cell===i&&x.hit))?' sunk':'');el.style.gridRow=row+' / span '+(vert?ship.length:1);el.style.gridColumn=col+' / span '+(vert?1:ship.length);el.innerHTML=hull(ship.length,index,vert);root.append(el);
 }
}
function manifest(){
 $('fleetList').innerHTML=lengths.map((len,i)=>{const ship=fleet[i], sunk=ship&&ship.every(n=>incoming.some(s=>s.cell===n&&s.hit));return '<div class="fleet-item '+(sunk?'sunk':ship?'deployed':phase==='setup'&&i===fleet.length?'current':'')+'">'+hull(len,i,false,true)+'<strong>'+shipNames[i]+'</strong><span>'+(sunk?'Sunk':ship?'Deployed':len+' cells')+'</span></div>';}).join('');
 $('tally').textContent=shots.length+' shots · '+shots.filter(x=>x.hit).length+' hits';
 $('mode').textContent=bridge?'Bored Together':'Solo · vs computer';
 document.body.dataset.phase=phase;document.body.dataset.busy=String(busy);
 $('help').textContent=phase==='setup'?'Choose a starting square and orientation, or randomize your fleet.':phase==='battle'?'Select a square on enemy waters to fire. One shot per turn.':'Your fleet and shot history are saved when you finish a multiplayer turn.';
}
function sync(){if(!bridge)return;const s=ctx.state||{};fleet=s.fleet||fleet;shots=s.outgoing||[];incoming=s.incoming||[];winner=s.winner;phase=ctx.status!=='active'?'over':!s.placed?'setup':s.ready?'battle':'waiting';}
function render(){const seat=ctx?.seat||1, playable=!busy&&(!bridge||ctx.canPlay);$('tools').classList.toggle('hidden',phase!=='setup'||!playable);$('restart').classList.toggle('hidden',!!bridge);$('orientation').textContent=vertical?'Vertical':'Horizontal';$('ready').disabled=fleet.length!==5;$('status').textContent=busy?'Saving / resolving turn...':phase==='over'?(winner===seat?'Victory! All enemy ships sunk.':winner?'Defeat. Your fleet has been sunk.':'Match ended.'):phase==='setup'?(playable?(fleet.length===5?'Fleet ready. Deploy when ready.':'Place your '+lengths[fleet.length]+'-cell ship.'): 'Waiting for opponent.'):phase==='waiting'||!playable?'Waiting for opponent.':'Your turn — select enemy waters.';$('ownCount').textContent=phase==='setup'?fleet.length+' / 5 ships placed':incoming.filter(x=>x.hit).length+' / 17 cells hit';$('enemyCount').textContent=shots.filter(x=>x.hit).length+' / 17 cells hit';board('own',fleet,incoming,phase==='setup'&&playable,i=>{if(fleet.length>=5)return;const c=fits(fleet,i,lengths[fleet.length],vertical);if(c){fleet.push(c);render();}else $('status').textContent='Ship does not fit there. Try another square.';});board('enemy',[],shots,phase==='battle'&&playable,fire);manifest();}
async function online(move){if(busy)return;busy=true;render();try{ctx=await bridge.submit(move);busy=false;sync();render();if(!ctx.canPlay||ctx.status!=='active')setTimeout(()=>bridge.finishTurn(),1000);}catch(e){busy=false;render();bridge.error(e,()=>online(move));}}
function fire(i){if(busy||phase!=='battle'||shots.some(x=>x.cell===i))return;if(bridge){if(ctx.canPlay)online({fire:i});return;}shots.push(shot(enemy,i));if(lost(enemy,shots)){winner=1;phase='over';render();return;}busy=true;render();const token=generation;setTimeout(()=>{if(token!==generation)return;incoming.push(shot(fleet,cpuPick()));busy=false;if(lost(fleet,incoming)){winner=2;phase='over';}render();},420);}
$('rotate').onclick=()=>{vertical=!vertical;render();};$('random').onclick=()=>{fleet=randomFleet();render();};$('clear').onclick=()=>{fleet=[];render();};$('ready').onclick=()=>{if(fleet.length!==5||busy)return;if(bridge){online({fleet});return;}enemy=randomFleet();phase='battle';render();};$('restart').onclick=()=>{generation++;fleet=[];enemy=[];shots=[];incoming=[];winner=null;busy=false;phase='setup';render();};sync();render();
</script></body></html>
