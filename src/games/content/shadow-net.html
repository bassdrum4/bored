<style>
:root{--bg:#080c12;--terminal-bg:#0b1018;--fg:#00ff41;--fg-dim:#00992a;--accent:#ffb000;--error:#ff3c38;--info:#00d4ff;--success:#39ff14;--muted:#4a5568;--card:#111922;--border:#1a2533;--sidebar:#0a0f16}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:'Fira Code',monospace;height:100vh;overflow:hidden}
#game{display:flex;flex-direction:column;height:100vh}
#top-bar{background:var(--card);border-bottom:1px solid var(--border);padding:8px 20px;display:flex;align-items:center;gap:16px;flex-shrink:0}
#top-bar .logo{font-family:'Orbitron',sans-serif;font-weight:900;font-size:16px;color:var(--accent);letter-spacing:3px}
#top-bar .ver{color:var(--muted);font-size:11px}
#top-bar .conn{margin-left:auto;font-size:11px;display:flex;align-items:center;gap:6px}
#top-bar .conn .dot{width:7px;height:7px;border-radius:50%;background:var(--success);animation:pulse-dot 2s infinite}
#top-bar .conn.disconnected .dot{background:var(--error);animation:none}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.3}}
#main{display:flex;flex:1;overflow:hidden}
#terminal-wrap{flex:1;display:flex;flex-direction:column;position:relative;overflow:hidden}
#terminal-output{flex:1;overflow-y:auto;padding:16px 20px;font-size:13px;line-height:1.65;white-space:pre-wrap;word-break:break-all;scroll-behavior:smooth}
#terminal-output::-webkit-scrollbar{width:6px}
#terminal-output::-webkit-scrollbar-track{background:var(--terminal-bg)}
#terminal-output::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
#terminal-output .line{min-height:1.1em}
.c-default{color:var(--fg)}.c-error{color:var(--error)}.c-warning{color:var(--accent)}.c-info{color:var(--info)}.c-success{color:var(--success)}.c-muted{color:var(--muted)}.c-highlight{color:#fff}.c-accent{color:var(--accent)}
#input-line{display:flex;align-items:center;padding:8px 20px;background:var(--card);border-top:1px solid var(--border);flex-shrink:0}
#prompt{color:var(--fg);font-size:13px;white-space:nowrap;margin-right:4px}
#terminal-input{flex:1;background:transparent;border:none;color:var(--fg);font-family:inherit;font-size:13px;outline:none;caret-color:var(--fg)}
#sidebar{width:260px;background:var(--sidebar);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0}
.panel{padding:14px 16px;border-bottom:1px solid var(--border)}
.panel-title{font-family:'Orbitron',sans-serif;font-size:10px;font-weight:700;color:var(--accent);letter-spacing:2px;margin-bottom:10px;text-transform:uppercase}
.trace-bar-wrap{background:#1a1a2e;border-radius:4px;height:14px;overflow:hidden;position:relative}
.trace-bar{height:100%;border-radius:4px;transition:width .5s ease,background .5s ease}
.trace-label{font-size:11px;margin-top:4px;display:flex;justify-content:space-between;color:var(--muted)}
.stat-row{display:flex;justify-content:space-between;font-size:12px;padding:3px 0}
.stat-row .label{color:var(--muted)}.stat-row .val{color:var(--fg)}
.inv-item{font-size:11px;color:var(--info);padding:2px 0}
.mission-obj{font-size:11px;color:var(--fg-dim);padding:4px 8px;border-left:2px solid var(--accent);margin-bottom:6px;background:rgba(255,176,0,.04);line-height:1.5}
.server-entry{font-size:11px;padding:3px 0;display:flex;align-items:center;gap:6px}
.server-entry .s-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.s-unknown{color:var(--muted)}.s-discovered{color:var(--info)}.s-cracked{color:var(--success)}
.scanlines{position:absolute;inset:0;pointer-events:none;z-index:10;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.06) 2px,rgba(0,0,0,.06) 4px)}
.glitch-overlay{position:absolute;inset:0;pointer-events:none;z-index:11;opacity:0;transition:opacity .3s}
.glitch-active .glitch-overlay{opacity:1;animation:glitch-flicker .15s infinite}
@keyframes glitch-flicker{0%{background:rgba(255,60,56,.03)}50%{background:transparent}100%{background:rgba(0,212,255,.02)}}
.glitch-active{animation:glitch-shake .1s infinite}
@keyframes glitch-shake{0%{transform:translate(0)}25%{transform:translate(-1px,1px)}50%{transform:translate(1px,-1px)}75%{transform:translate(-1px,0)}100%{transform:translate(0)}}
@media(max-width:768px){#sidebar{display:none}#top-bar .ver{display:none}}
.fade-in{animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
</style>

// --- UTILITIES ---

function delay(ms){ return new Promise(r=>setTimeout(r,ms)); }

function caesarEnc(text, shift){
  return text.split('').map(c=>{
    if(c>='A'&&c<='Z') return String.fromCharCode(((c.charCodeAt(0)-65+shift)%26)+65);
    if(c>='a'&&c<='z') return String.fromCharCode(((c.charCodeAt(0)-97+shift)%26)+97);
    return c;
  }).join('');
}

function addTrace(amount){
  if(state.stealthBought) amount = Math.ceil(amount/2);
  state.trace = Math.min(100, state.trace + amount);
  updateUI();
  if(state.trace >= 100 && !state.gameEnded){
    gameOver();
  }
}

function addCredits(n){
  state.credits += n;
  updateUI();
}

// --- FILE SYSTEM ---

function isFile(node){ return typeof node==='string' || (typeof node==='object' && node.content!==undefined); }
function isDir(node){ return typeof node==='object' && node.content===undefined; }
function getContent(node){ return typeof node==='string' ? node : node.content; }

function resolvePath(base, rel){
  if(rel.startsWith('/')) return normalizePath(rel);
  if(rel==='..') {
    const p = base.split('/').filter(Boolean);
    p.pop();
    return '/'+p.join('/');
  }
  if(rel==='.') return base;
  return normalizePath(base==='/'? '/'+rel : base+'/'+rel);
}

function normalizePath(p){
  const parts = p.split('/').filter(Boolean);
  const res = [];
  for(const part of parts){
    if(part==='..') res.pop();
    else if(part!=='.') res.push(part);
  }
  return '/'+res.join('/');
}

function getNode(server, path){
  const fs = FS[server];
  if(!fs) return null;
  const parts = path.split('/').filter(Boolean);
  let node = fs;
  for(const part of parts){
    if(!node || typeof node==='string' || node.content!==undefined) return null;
    node = node[part];
    if(!node) return null;
  }
  return node;
}

function getFileId(server, path){
  return server+':'+path;
}

function isDecrypted(server, path){
  return state.decrypted.includes(getFileId(server, path));
}

function checkMissions(){
  if(state.gameEnded) return;
  if(state.missionIdx >= MISSIONS.length) return;
  const m = MISSIONS[state.missionIdx];
  if(m.check()){
    state.completedMissions.push(m.id);
    addCredits(m.reward);
    print(`\n╔══════════════════════════════════╗`, 'c-success');

    state.missionIdx++;

// --- COMMAND PROCESSOR ---

function processCmd(raw){
  const input = raw.trim();
  if(!input) return;
  cmdHistory.push(input);
  histIdx = -1;

  print(getPrompt()+input, 'c-muted');

  if(state.gameEnded){
    if(input.toLowerCase()==='restart') { restartGame(); return; }
    print('Connection terminated. Type "restart" to try again.','c-error');
    return;
  }

  if(state.mode==='crack') { handleCrackInput(input); return; }
  if(state.mode==='decrypt') { handleDecryptInput(input); return; }

  const parts = input.split(/\s+/);
  const cmd = parts[0].toLowerCase();
  const args = parts.slice(1);

  switch(cmd){
    case 'help': cmdHelp(); break;
    case 'ls': case 'dir': cmdLs(); break;
    case 'cd': cmdCd(args[0]||''); break;
    case 'cat': case 'read': case 'type': cmdCat(args[0]); break;
    case 'clear': case 'cls': clearTerm(); break;
    case 'scan': cmdScan(); break;
    case 'connect': cmdConnect(args[0]); break;
    case 'disconnect': case 'dc': cmdDisconnect(); break;
    case 'crack': cmdCrack(); break;
    case 'decrypt': cmdDecrypt(args[0]); break;
    case 'download': cmdDownload(args[0]); break;
    case 'analyze': cmdAnalyze(); break;
    case 'status': cmdStatus(); break;
    case 'missions': cmdMissions(); break;
    case 'trace': print(`Trace level: ${state.trace}/100`, state.trace>60?'c-error':'c-default'); break;
    case 'shop': cmdShop(); break;
    case 'buy': cmdBuy(args[0]); break;
    case 'whoami': print('ghost @ SHADOW.NET\nClearance: OPERATIVE\nStatus: ACTIVE','c-info'); break;
    case 'map': cmdMap(); break;
    case 'exit': if(state.connected){cmdDisconnect();}else{print('Nice try. There is no escape.','c-muted');} break;
    default:
      print(`Command not found: ${cmd}`, 'c-error');
      print('Type "help" for available commands.', 'c-muted');
  }
  checkMissions();
  updateUI();
}

  const node = getNode(srv, path);
  if(!node){ print(`File not found: ${arg}`,'c-error'); return; }
  if(isDir(node)){ print(`Cannot download a directory.`,'c-error'); return; }

  const enc = typeof node==='object' && node.encrypted && !isDecrypted(srv, path);
  if(enc){ print(`File is encrypted. Decrypt it first.`,'c-warning'); return; }

  const fname = path.split('/').pop();

  // Add to local downloads
  const localDL = getNode('localhost', '/home/ghost/downloads');

  state.downloaded.push(fname);
  state.downloadCount++;
  const classified = typeof node==='object' && node.classified;
  addTrace(classified ? 8 : 2);
  addCredits(classified ? 100 : 30);

  print(`Downloaded: ${fname}`, 'c-success');
  if(classified) print(`[CLASSIFIED FILE - Trace increased significantly]`, 'c-warning');
  print(`Saved to /home/ghost/downloads/`, 'c-muted');

function startCrackGame(server){
  const srv = SERVERS[server];
  const wordLen = srv.pwdLen;
  let words = [...CRACK_WORDS[wordLen]];
  const password = words[Math.floor(Math.random()*words.length)];

  // If cracker_v2, eliminate some wrong words
  let eliminated = [];
  if(state.crackerV2Bought){
    const wrongWords = words.filter(w=>w!==password);
    const toElim = wrongWords.sort(()=>Math.random()-0.5).slice(0,3);
    eliminated = toElim;
    words = words.filter(w=>!eliminated.includes(w));
  }

  state.mode = 'crack';
  state.crackState = {
    server, password, words, attemptsLeft: srv.maxAttempts, maxAttempts: srv.maxAttempts, eliminated
  };

  print('\n╔══════════════════════════════════════╗', 'c-warning');
  print('║      PASSWORD CRACK INTERFACE        ║', 'c-warning');
  print('╚══════════════════════════════════════╝', 'c-warning');
  print(`\nTarget: ${server}`, 'c-info');
  print(`Attempts: ${'●'.repeat(srv.maxAttempts)} ${srv.maxAttempts}/${srv.maxAttempts}`, 'c-default');

  if(eliminated.length>0){
    print(`\n[Cracker v2] Eliminated: ${eliminated.join(', ')}`, 'c-success');
  }

  print('\nSelect a word to guess the password:', 'c-default');
  print('─'.repeat(40), 'c-muted');

  // Display words in columns with hex addresses
  const hexChars = '0123456789ABCDEF';
  words.forEach((w,i)=>{
    const addr = '0x'+hexChars[Math.floor(Math.random()*16)]+hexChars[Math.floor(Math.random()*16)]
      +hexChars[Math.floor(Math.random()*16)]+hexChars[Math.floor(Math.random()*16)];
    const padded = w.padEnd(10);
    printHTML(`  <span class="c-muted">${addr}:</span> <span class="c-highlight">${padded}</span>${(i%3===2)?'':''}`);
  });

  print('─'.repeat(40), 'c-muted');
  print('Type a word to guess. Type "exit" to abort.\n', 'c-info');
}

function handleCrackInput(input){
  const cs = state.crackState;
  if(!cs) return;
  const word = input.toUpperCase().trim();

  if(word==='EXIT'){
    state.mode='normal';
    state.crackState=null;
    print('Crack aborted. Disconnected from server.','c-warning');
    state.connected=null;
    state.currentDir='/home/ghost';
    updateUI();
    return;
  }

  if(!cs.words.includes(word)){
    print(`"${input}" is not a valid option. Pick from the list.`,'c-error');
    return;
  }

  if(word===cs.password){
    // Success!
    SERVERS[cs.server].cracked = true;
    state.crackedServers.add(cs.server);
    addCredits(150);
    state.mode='normal';
    state.crackState=null;
    print(`\n★ PASSWORD CRACKED: ${cs.password} ★`, 'c-success');
    print(`Access granted to ${cs.server}!`, 'c-success');
    print(`[+150cr]`, 'c-accent');
    checkMissions();
    updateUI();
    return;
  }

  // Wrong guess - calculate likeness
  cs.attemptsLeft--;
  let likeness = 0;
  for(let i=0;i<word.length;i++){
    if(word[i]===cs.password[i]) likeness++;
  }

  print(`> ${word}`, 'c-highlight');
  print(`  Likeness: ${likeness}/${word.length} letters in correct position`, likeness>0?'c-warning':'c-error');
  print(`  Attempts remaining: ${'●'.repeat(cs.attemptsLeft)}${'○'.repeat(cs.maxAttempts-cs.attemptsLeft)} ${cs.attemptsLeft}/${cs.maxAttempts}\n`, cs.attemptsLeft<=1?'c-error':'c-default');

  if(cs.attemptsLeft<=0){
    // Failed!
    state.mode='normal';
    state.crackState=null;
    addTrace(10);
    print(`CRACK FAILED. Lockout triggered.`, 'c-error');
    print(`Trace increased significantly. Disconnected.`, 'c-error');
    state.connected=null;
    state.currentDir='/home/ghost';
    checkMissions();
    updateUI();
  }
}

// --- MINI-GAME: DECRYPTION ---

function startDecryptGame(filename, path, node){
  state.mode = 'decrypt';
  state.decryptState = {
    filename, path, shift: node.shift, attemptsLeft:3,
    content: node.content, server: state.connected||'localhost'
  };

  const encText = caesarEnc(node.content, node.shift);
  const preview = encText.substring(0, 120) + (encText.length>120?'...':'');

  print('\n╔══════════════════════════════════════╗', 'c-warning');
  print('║       DECRYPTION INTERFACE           ║', 'c-warning');
  print('╚══════════════════════════════════════╝', 'c-warning');
  print(`\nFile: ${filename}`, 'c-info');
  print(`Cipher: Caesar (shift unknown)`, 'c-info');
  print(`Attempts: ${3}/3\n`, 'c-default');
  print('Encrypted preview:', 'c-muted');
  print('─'.repeat(40), 'c-muted');
  print(preview, 'c-muted');
  print('─'.repeat(40), 'c-muted');

  if(state.decryptorBought){
    // Reveal 3 letter positions
    const real = node.content;
    const letters = [];
    for(let i=0;i<Math.min(real.length,3);i++){
      if(real[i]!==' '&&real[i]!=='\n'){
        letters.push(`Position ${i+1}: "${real[i]}"`);
      }
    }
    if(letters.length>0){
      print(`\n[Decryptor v2] Hints: ${letters.join(', ')}`, 'c-success');
    }
  }

  print('\nCommands:', 'c-default');
  print('  try <shift>     Preview with shift (no penalty)', 'c-info');
  print('  submit <shift>  Submit answer (-1 attempt if wrong)', 'c-info');
  print('  hint            Get a hint (+3 trace)', 'c-info');
  print('  exit            Abort decryption\n', 'c-muted');
}

function handleDecryptInput(input){
  const ds = state.decryptState;
  if(!ds) return;
  const parts = input.trim().split(/\s+/);
  const cmd = parts[0].toLowerCase();

  if(cmd==='exit'){
    state.mode='normal';
    state.decryptState=null;
    print('Decryption aborted.','c-warning');
    return;
  }

  if(cmd==='hint'){
    addTrace(3);
    // Give a useful hint about the shift
    const s = ds.shift;
    const hints = [
      `The shift is ${s%2===0?'even':'odd'}.`,
      `The shift is ${s<=6?'between 1-6':s<=10?'between 7-10':'between 11-25'}.`,
      `Try subtracting each letter position from the encrypted text by the same number.`,
      `The first word decrypted starts with "${ds.content[0]}".`,
      `The shift is ${s<=13?'at most 13':'greater than 13'}.`
    ];
    // Pick a hint that's somewhat helpful but not too obvious
    const hintIdx = Math.floor(Math.random()*hints.length);
    print(`Hint: ${hints[hintIdx]}`, 'c-accent');
    print(`[Trace +3]`, 'c-warning');
    return;
  }

  if(cmd==='try'){
    const shift = parseInt(parts[1]);
    if(isNaN(shift)||shift<0||shift>25){
      print('Invalid shift. Use a number 0-25.','c-error');
      return;
    }
    // Decrypt with the given shift (to reverse Caesar, shift by 26-shift)
    const decrypted = caesarEnc(ds.content, 26-shift);
    const preview = decrypted.substring(0,150)+(decrypted.length>150?'...':'');
    print(`\nShift ${shift} preview:`, 'c-info');
    print('─'.repeat(40), 'c-muted');
    print(preview, 'c-default');
    print('─'.repeat(40), 'c-muted');
    print('(This is a preview. Use "submit" if it looks correct.)\n', 'c-muted');
    return;
  }

  if(cmd==='submit'){
    const shift = parseInt(parts[1]);
    if(isNaN(shift)||shift<0||shift>25){
      print('Invalid shift. Use a number 0-25.','c-error');
      return;
    }
    if(shift===ds.shift){
      // Correct!
      const fid = getFileId(ds.server, ds.path);
      state.decrypted.push(fid);
      addTrace(5);
      addCredits(50);
      state.mode='normal';
      state.decryptState=null;
      print(`\n★ DECRYPTION SUCCESSFUL ★`, 'c-success');
      print(`File "${ds.filename}" has been decrypted!`, 'c-success');
      print(`Use "cat ${ds.filename}" to read it.`, 'c-info');
      print(`[+50cr]`, 'c-accent');
      checkMissions();
      updateUI();
    } else {
      ds.attemptsLeft--;
      print(`Incorrect shift. Attempts remaining: ${ds.attemptsLeft}`, 'c-error');
      if(ds.attemptsLeft<=0){
        state.mode='normal';
        state.decryptState=null;
        addTrace(8);
        print(`Decryption failed. File remains encrypted.`, 'c-error');
        print(`[Trace +8]`, 'c-warning');
        updateUI();
      }
    }
    return;
  }

  print('Unknown command. Use: try <shift>, submit <shift>, hint, or exit.','c-error');
}

// --- INPUT HANDLING ---

inputEl.addEventListener('keydown', e=>{
  if(e.key==='Enter'){
    const val = inputEl.value;
    inputEl.value = '';
    processCmd(val);
  } else if(e.key==='ArrowUp'){
    e.preventDefault();
    if(cmdHistory.length>0 && histIdx<cmdHistory.length-1){
      histIdx++;
      inputEl.value = cmdHistory[cmdHistory.length-1-histIdx];
    }
  } else if(e.key==='ArrowDown'){
    e.preventDefault();
    if(histIdx>0){
      histIdx--;
      inputEl.value = cmdHistory[cmdHistory.length-1-histIdx];
    } else {
      histIdx=-1;
      inputEl.value='';
    }
  } else if(e.key==='Tab'){
    e.preventDefault();
    tabComplete();
  }
});

// Keep focus on input
document.addEventListener('click', ()=>{
  if(!state.gameEnded || true) inputEl.focus();
});

function tabComplete(){
  const val = inputEl.value.trim();
  const parts = val.split(/\s+/);

  if(parts.length<=1){
    const cmds = ['help','ls','cd','cat','clear','scan','connect','disconnect','crack','decrypt','download','analyze','status','missions','trace','shop','buy','whoami','map','exit'];
    const match = cmds.find(c=>c.startsWith(parts[0]));
    if(match) inputEl.value = match+' ';
  } else if(parts.length===2){
    const cmd = parts[0].toLowerCase();
    if(['cd','cat','download','decrypt','read','type'].includes(cmd)){
      const srv = state.connected||'localhost';
      const node = getNode(srv, state.currentDir);
      if(node && isDir(node)){
        const entries = Object.keys(node);
        const match = entries.find(e=>e.toLowerCase().startsWith(parts[1].toLowerCase()));
        if(match) inputEl.value = cmd+' '+match;
      }
    } else if(cmd==='connect'){
      const discovered = Object.keys(SERVERS).filter(s=>SERVERS[s].discovered && s!=='localhost');
      const match = discovered.find(s=>s.startsWith(parts[1]));
      if(match) inputEl.value = cmd+' '+match;
    } else if(cmd==='buy'){
      const ids = SHOP.map(s=>s.id);
      const match = ids.find(s=>s.startsWith(parts[1]));
      if(match) inputEl.value = cmd+' '+match;
    }
  }
}

// --- GLITCH EFFECT (random chars at high trace) ---

setInterval(()=>{
  if(state.trace > 75 && !state.gameEnded && Math.random()<0.15){
    const glitchChars = '!@#$%^&*()_+{}|:<>?~`-=[]\\;\',./0123456789';
    const len = Math.floor(Math.random()*8)+2;
    let txt = '';
    for(let i=0;i<len;i++) txt+=glitchChars[Math.floor(Math.random()*glitchChars.length)];
    const span = document.createElement('span');
    span.className = 'line c-error';
    span.style.opacity = '0.3';
    span.style.fontSize = '10px';
    span.textContent = txt;
    output.appendChild(span);
    output.appendChild(document.createTextNode('\n'));
    // Remove after 2 seconds
    setTimeout(()=>{ span.remove(); }, 2000);
  }
}, 1000);
