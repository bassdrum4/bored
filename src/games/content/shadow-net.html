<style>
:root{--bg:#080c12;--terminal-bg:#0b1018;--fg:#00ff41;--fg-dim:#00992a;--accent:#ffb000;--error:#ff3c38;--info:#00d4ff;--success:#39ff14;--muted:#4a5568;--card:#111922;--border:#1a2533;--sidebar:#0a0f16}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:'Fira Code',monospace;height:100vh;overflow:hidden}
#game{display:flex;flex-direction:column;height:100vh}
#top-bar{background:var(--card);border-bottom:1px solid var(--border);padding:8px 20px;display:flex;align-items:center;gap:16px;flex-shrink:0}
#top-bar .logo{font-family:'Orbitron',sans-serif;font-weight:900;font-size:16px;color:var(--accent);letter-spacing:3px}
#top-bar .ver{color:var(--muted);font-size:11px}
#top-bar .conn{margin-left:auto;font-size:11px;display:flex;align-items:center;gap:6px}
#top-bar .conn .dot{width:7px;height:7px;border-radius:50%;background:var(--success);animation:pulse-dot 2s infinite}
#top-bar .conn.disconnected .dot{background:var(--error);animation:none}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.3}}
#main{display:flex;flex:1;overflow:hidden}
#terminal-wrap{flex:1;display:flex;flex-direction:column;position:relative;overflow:hidden}
#terminal-output{flex:1;overflow-y:auto;padding:16px 20px;font-size:13px;line-height:1.65;white-space:pre-wrap;word-break:break-all;scroll-behavior:smooth}
#terminal-output::-webkit-scrollbar{width:6px}
#terminal-output::-webkit-scrollbar-track{background:var(--terminal-bg)}
#terminal-output::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
#terminal-output .line{min-height:1.1em}
.c-default{color:var(--fg)}.c-error{color:var(--error)}.c-warning{color:var(--accent)}.c-info{color:var(--info)}.c-success{color:var(--success)}.c-muted{color:var(--muted)}.c-highlight{color:#fff}.c-accent{color:var(--accent)}
#input-line{display:flex;align-items:center;padding:8px 20px;background:var(--card);border-top:1px solid var(--border);flex-shrink:0}
#prompt{color:var(--fg);font-size:13px;white-space:nowrap;margin-right:4px;max-width:65%;overflow:hidden;text-overflow:ellipsis}
#mobile-hud{display:none}
#terminal-input{flex:1;background:transparent;border:none;color:var(--fg);font-family:inherit;font-size:13px;outline:none;caret-color:var(--fg)}
#sidebar{width:260px;background:var(--sidebar);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0}
.panel{padding:14px 16px;border-bottom:1px solid var(--border)}
.panel-title{font-family:'Orbitron',sans-serif;font-size:10px;font-weight:700;color:var(--accent);letter-spacing:2px;margin-bottom:10px;text-transform:uppercase}
.trace-bar-wrap{background:#1a1a2e;border-radius:4px;height:14px;overflow:hidden;position:relative}
.trace-bar{height:100%;border-radius:4px;transition:width .5s ease,background .5s ease}
.trace-label{font-size:11px;margin-top:4px;display:flex;justify-content:space-between;color:var(--muted)}
.stat-row{display:flex;justify-content:space-between;font-size:12px;padding:3px 0}
.stat-row .label{color:var(--muted)}.stat-row .val{color:var(--fg)}
.inv-item{font-size:11px;color:var(--info);padding:2px 0}
.mission-obj{font-size:11px;color:var(--fg-dim);padding:4px 8px;border-left:2px solid var(--accent);margin-bottom:6px;background:rgba(255,176,0,.04);line-height:1.5}
.server-entry{font-size:11px;padding:3px 0;display:flex;align-items:center;gap:6px}
.server-entry .s-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.s-unknown{color:var(--muted)}.s-discovered{color:var(--info)}.s-cracked{color:var(--success)}
.scanlines{position:absolute;inset:0;pointer-events:none;z-index:10;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.06) 2px,rgba(0,0,0,.06) 4px)}
.glitch-overlay{position:absolute;inset:0;pointer-events:none;z-index:11;opacity:0;transition:opacity .3s}
.glitch-active .glitch-overlay{opacity:1;animation:glitch-flicker .15s infinite}
@keyframes glitch-flicker{0%{background:rgba(255,60,56,.03)}50%{background:transparent}100%{background:rgba(0,212,255,.02)}}
.glitch-active{animation:glitch-shake .1s infinite}
@keyframes glitch-shake{0%{transform:translate(0)}25%{transform:translate(-1px,1px)}50%{transform:translate(1px,-1px)}75%{transform:translate(-1px,0)}100%{transform:translate(0)}}
@media(max-width:768px){#sidebar{display:none}#top-bar .ver{display:none}
  #mobile-hud{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:5px 14px;background:var(--card);border-bottom:1px solid var(--border);font-size:11px;color:var(--muted);flex-shrink:0}
  #mobile-hud strong{color:var(--fg);font-weight:400}}
.fade-in{animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
</style>

// --- UTILITIES ---

function delay(ms){ return new Promise(r=>setTimeout(r,ms)); }

function caesarEnc(text, shift){
  return text.split('').map(c=>{
    if(c>='A'&&c<='Z') return String.fromCharCode(((c.charCodeAt(0)-65+shift)%26)+65);
    if(c>='a'&&c<='z') return String.fromCharCode(((c.charCodeAt(0)-97+shift)%26)+97);
    return c;
  }).join('');
}

// Act two uses a keyword cipher: same letters, a different thing to find. The
// key index only advances on letters, so encryption and decryption stay in step.
function vigenereShift(text, key, dir){
  const k = String(key || '').toUpperCase().replace(/[^A-Z]/g, '');
  if(!k) return text;
  let j = 0;
  return text.split('').map(c=>{
    const base = c>='A'&&c<='Z' ? 65 : c>='a'&&c<='z' ? 97 : 0;
    if(!base) return c;
    const shift = (k.charCodeAt(j % k.length) - 65) * dir;
    j++;
    return String.fromCharCode((((c.charCodeAt(0) - base + shift) % 26) + 26) % 26 + base);
  }).join('');
}
function vigenereEnc(text, key){ return vigenereShift(text, key, 1); }
function vigenereDec(text, key){ return vigenereShift(text, key, -1); }

// Encrypted nodes store their plaintext and a recipe; the ciphertext is only
// ever derived, so swapping a file's cipher is one property on the node.
function encryptedText(node){
  return node.cipher === 'vigenere' ? vigenereEnc(getContent(node), node.key) : caesarEnc(getContent(node), node.shift);
}

// Returns what was actually applied, so the interface can print the real
// charge instead of the list price (stealth and the ceiling both change it).
function addTrace(amount){
  if(state.stealthBought) amount = Math.ceil(amount/2);
  const before = state.trace;
  state.trace = Math.min(100, state.trace + amount);
  const applied = state.trace - before;
  updateUI();
  tutorialTraceWarn();
  if(state.trace >= 100 && !state.gameEnded){

  return applied;
}

  if(state.gameEnded) return;
  if(!state.hunt){
    if(state.connected !== 'meridian.archive.net' || state.trace < SWEEP_TRACE) return;
    if(!state.completedMissions.includes(7)) return;
    state.hunt = { left:SWEEP_STEPS };

    state.hunt = null;
    print('VEGA: "Sweep called off. They lost the thread."', 'c-muted');
    return;

    print(`COUNTER-INTEL: sweep in ${state.hunt.left} command${state.hunt.left === 1 ? '' : 's'}.`, 'c-warning');

// on wipes), trace left in the meter, and time under a twenty-minute par. A
// decoy finish is not evidence, so it scores nothing at all.
const SCORE_PAR_SECONDS = 1200;
function shadowScore(){
  if(!state.gameEnded || state.decoyEnding) return 0;
  const seconds = Math.max(0, Math.round((Date.now() - state.startedAt) / 1000));
  const quiet = Math.max(0, 100 - state.trace);
  const early = Math.max(0, SCORE_PAR_SECONDS - seconds);
  return Math.max(0, Math.round(state.credits + quiet * 10 + early * 2));
}
function shadowWon(){
  return state.gameEnded === true && !state.decoyEnding && state.completedMissions.includes(10);
}

// --- FILE SYSTEM ---

function isFile(node){ return typeof node==='string' || (typeof node==='object' && node.content!==undefined); }
function isDir(node){ return typeof node==='object' && node.content===undefined; }
function getContent(node){ return typeof node==='string' ? node : node.content; }

function resolvePath(base, rel){
  if(rel.startsWith('/')) return normalizePath(rel);
  if(rel==='..') {
    const p = base.split('/').filter(Boolean);
    p.pop();
    return '/'+p.join('/');
  }
  if(rel==='.') return base;
  return normalizePath(base==='/'? '/'+rel : base+'/'+rel);
}

function normalizePath(p){
  const parts = p.split('/').filter(Boolean);
  const res = [];
  for(const part of parts){
    if(part==='..') res.pop();
    else if(part!=='.') res.push(part);
  }
  return '/'+res.join('/');
}

function isBurned(server, path){
  return state.burned.indexOf(server + ':' + normalizePath(path)) !== -1;
}

function burnFile(server, path){
  const id = server + ':' + normalizePath(path);
  if(state.burned.indexOf(id) !== -1) return false;
  state.burned.push(id);
  return true;
}

// What a sweep or the purge station can take: intel, never the ledger.
function burnArchiveFile(){
  const candidates = ['/home/ops/contacts.txt', '/home/ops/watchlist.txt', '/etc/security/counter_intel.txt'];
  for(const path of candidates){
    if(getNode('meridian.archive.net', path)){
      burnFile('meridian.archive.net', path);
      return path;
    }
  }
  return null;
}

// A burned file is gone for the run: every read path comes through here, so a
// note that was taken cannot be reprinted from the terminal later.
function getNode(server, path){
  if(isBurned(server, path)) return null;
  const fs = FS[server];
  if(!fs) return null;
  const parts = path.split('/').filter(Boolean);
  let node = fs;
  for(const part of parts){
    if(!node || typeof node==='string' || node.content!==undefined) return null;
    node = node[part];
    if(!node) return null;
  }
  return node;
}

function getFileId(server, path){
  return server+':'+path;
}

function isDecrypted(server, path){
  return state.decrypted.includes(getFileId(server, path));
}

// --- COMMAND PROCESSOR ---

function processCmd(raw){
  const input = String(raw == null ? '' : raw).trim();
  if(!input) return;
  cmdHistory.push(input);
  histIdx = -1;

  print(getPrompt()+input, 'c-muted');

  // A terminal takes a line of them the way Windows does: "&&" runs the next
  // only when this one worked, "||" only when it did not, "&" and ";" always.
  // A guess or a shift is not a script, so chaining only runs in command mode.
  if(state.mode==='normal' && !state.gameEnded && /[&;]|\|\|/.test(input)){
    runChain(splitChain(input));
    return;
  }

  execCmd(input);
}

// A command that finishes later (a network scan) parks its promise here, so a
// chained line can wait for it the way a shell waits for a child process.
let commandPending = null;

function slowCommand(promise){
  commandPending = promise;
  promise.then(()=>{ if(commandPending === promise) commandPending = null; });
  return promise;
}

// Split a line into commands, each with the operator joining it to the last.
// Inside quotes a separator is text, and "^" takes the next character
// literally, as cmd does.
function splitChain(input){
  const out = [];
  let buf = '', sep = null, quote = null;
  const cut = () => { out.push({ sep, text: buf }); buf = ''; };
  for(let i = 0; i < input.length; i++){
    const ch = input[i];
    if(quote){
      buf += ch;
      if(ch === quote) quote = null;
      continue;
    }
    if(ch === '"' || ch === "'"){ quote = ch; buf += ch; continue; }
    if(ch === '^' && i + 1 < input.length){ buf += input[++i]; continue; }
    if(ch === '&' && input[i + 1] === '&'){ cut(); sep = '&&'; i++; continue; }
    if(ch === '|' && input[i + 1] === '|'){ cut(); sep = '||'; i++; continue; }
    if(ch === '&' || ch === ';'){ cut(); sep = ch; continue; }
    buf += ch;
  }
  out.push({ sep, text: buf });
  return out;
}

// Split one command into words, keeping quoted runs together and dropping the
// quotes, so "cd \"My Documents\"" is one argument.
function splitArgs(input){
  const out = [];
  let buf = '', quote = null, has = false;
  for(let i = 0; i < input.length; i++){
    const ch = input[i];
    if(quote){
      if(ch === quote) quote = null; else buf += ch;
      has = true;
      continue;
    }
    if(ch === '"' || ch === "'"){ quote = ch; has = true; continue; }
    if(ch === ' ' || ch === '\t'){
      if(has){ out.push(buf); buf = ''; has = false; }
      continue;
    }
    buf += ch;
    has = true;
  }
  if(has) out.push(buf);
  return out;
}

// Run the parts by cmd's rules. A command behind a failed "&&" is skipped
// without changing the result, so "a && b || c" still reaches c when a fails;
// a dangling "&&" or "||" is the syntax error cmd reports.
function runChain(parts, start = 0, ok = true, ran = false){
  for(let i = start; i < parts.length; i++){
    const part = parts[i];
    const piece = part.text.trim();
    if(!piece){
      if(part.sep === '&&' || part.sep === '||'){
        print('The syntax of the command is incorrect.', 'c-error');
        return;
      }
      continue;
    }
    const go = !ran || part.sep === null || part.sep === '&' || part.sep === ';'
      || (part.sep === '&&' && ok) || (part.sep === '||' && !ok);
    if(!go) continue;
    ok = execCmd(piece);
    ran = true;
    // An interactive prompt is not something the rest of the line can answer.
    if(state.mode !== 'normal' || state.gameEnded) return;
    // A command still running owns the terminal until it returns, so the rest
    // of the line starts after it instead of racing it.
    const work = commandPending;
    if(work){
      work.then(()=>{
        if(state.mode !== 'normal' || state.gameEnded) return;
        runChain(parts, i + 1, ok, true);
      });
      return;
    }
  }
}

// One command, no echo. Returns false when it printed an error, which is what
// "&&" waits on.
function execCmd(input){
  printedError = false;

  if(state.gameEnded){
    if(input.toLowerCase()==='restart') { restartGame(); return; }
    print('Connection terminated. Type "restart" to try again.','c-error');
    return;
  }

  if(state.mode==='crack') { handleCrackInput(input); afterCommand(); return !printedError; }
  if(state.mode==='decrypt') { handleDecryptInput(input); afterCommand(); return !printedError; }

  const parts = splitArgs(input);
  if(!parts.length) return true;
  const cmd = parts[0].toLowerCase();
  const args = parts.slice(1);

  switch(cmd){
    case 'tutorial': cmdTutorial(args[0]); break;
    case 'help': cmdHelp(); break;
    case 'ls': case 'dir': cmdLs(); break;
    case 'cd': cmdCd(args[0]||''); break;
    case 'cat': case 'read': case 'type': cmdCat(args); break;
    case 'pwd': cmdPwd(); break;
    case 'grep': cmdGrep(args); break;
    case 'man': cmdMan(args[0]); break;
    case 'history': cmdHistoryList(); break;
    case 'hint': cmdHint(); break;
    case 'clear': case 'cls': clearTerm(); break;
    case 'scan': cmdScan(); break;
    case 'connect': cmdConnect(args[0]); break;
    case 'disconnect': case 'dc': cmdDisconnect(); break;
    case 'crack': cmdCrack(); break;
    case 'decrypt': cmdDecrypt(args[0]); break;
    case 'download': cmdDownload(args[0]); break;
    case 'analyze': cmdAnalyze(); break;
    case 'purge': cmdPurge(); break;
    case 'status': cmdStatus(); break;
    case 'missions': cmdMissions(); break;
    case 'trace': print(`Trace level: ${state.trace}/100`, state.trace>60?'c-warning':'c-default'); break;
    case 'shop': cmdShop(); break;
    case 'buy': cmdBuy(args[0]); break;
    case 'whoami': print('ghost @ SHADOW.NET\nClearance: OPERATIVE\nStatus: ACTIVE','c-info'); break;
    case 'map': cmdMap(); break;
    case 'exit': if(state.connected){cmdDisconnect();}else{print('Nice try. There is no escape.','c-muted');} break;
    default:
      print(`Command not found: ${cmd}`, 'c-error');
      print('Type "help" for available commands.', 'c-muted');
  }
  checkMissions();
  updateUI();
  afterCommand();
  return !printedError;
}

const tutorial = {on:false, step:0, did:{}};

function tutorialDid(name){

// How many positions two guesses share. The crack already knows the password;
// these hints only teach the operator to read the board they were dealt.
function tutorialLiking(a, b){
  let n = 0;
  for(let i=0;i<a.length;i++) if(a[i]===b[i]) n++;
  return n;
}

function tutorialCrackHint(guess, likeness, cs){
  const step = TUTORIAL[tutorial.step];
  if(!tutorial.on || !step || step.id!=='crack') return;
  const others = cs.words.filter(w=>w!==guess);
  const left = others.filter(w=>tutorialLiking(guess, w)===likeness);
  print(`  [tutorial] ${guess} scores ${likeness}, so the password scores exactly ${likeness} against it: ${left.length} of the ${others.length} other words fit.`, 'c-accent');
  print(left.length===1
    ? '  [tutorial] One word still fits. That is the password.'
    : '  [tutorial] Score the next guess the same way and the list halves itself.', 'c-accent');
}

function tutorialCrackLockout(server){
  const step = TUTORIAL[tutorial.step];
  if(!tutorial.on || !step || step.id!=='crack') return;
  print('  [tutorial] Locked out is not lost: the host still stands and nothing you took is gone.', 'c-accent');
  print(`  [tutorial] "connect ${server}" then "crack" again; the words reshuffle, the likeness rule does not.`, 'c-accent');
}

// Once, when the meter first gets dangerous: the prices the shop actually
// charges, so the warning can be acted on instead of just felt.
function tutorialTraceWarn(){
  if(!tutorial.on || tutorial.did.traceWarned || state.trace < 75) return;
  tutorial.did.traceWarned = true;
  print(`  [tutorial] Trace ${state.trace}. At 100 the session ends; mission 7 wants you out below 75.`, 'c-accent');
  print('  [tutorial] buy trace_wipe is -25 for 200cr, buy heavy_wipe is -50 for 400cr. "trace" prints the number.', 'c-accent');
}

function finishTutorial(){
  tutorial.on = false;
  print('');
  print('Tutorial done. From here it is the same loop against harder locks.', 'c-success');
  print('"missions" has every objective; "tutorial" can be run again at any time.', 'c-muted');
}

function printTutorialStep(){
  const step = TUTORIAL[tutorial.step];
  if(!step) return;
  print('');
  print(`[tutorial ${tutorial.step+1}/${TUTORIAL.length}] ${step.title}`, 'c-accent');
  print('  > ' + step.how, 'c-info');
  print('  ' + step.say, 'c-default');
}

function tutorialTick(){
  if(!tutorial.on) return;
  let advanced = false;
  while(TUTORIAL[tutorial.step] && TUTORIAL[tutorial.step].done()){
    print('  ok: ' + TUTORIAL[tutorial.step].title, 'c-success');
    tutorial.step++;
    advanced = true;
    if(tutorial.step >= TUTORIAL.length){ finishTutorial(); return; }
  }
  if(advanced) printTutorialStep();
}

function cmdTutorial(arg){
  const sub = (arg || '').toLowerCase();
  if(sub==='exit' || sub==='stop'){
    if(!tutorial.on){ print('Tutorial is not running. Type "tutorial" to start it.','c-muted'); return; }
    tutorial.on = false;
    print('Tutorial off. Your run is exactly where you left it.','c-muted');
    return;
  }
  if(sub==='skip'){
    if(!tutorial.on){ print('Tutorial is not running. Type "tutorial" to start it.','c-muted'); return; }
    print('  (skipped)', 'c-muted');
    tutorial.step++;
    if(tutorial.step >= TUTORIAL.length){ finishTutorial(); return; }
    printTutorialStep();
    return;
  }
  if(sub){ print('Usage: tutorial | tutorial skip | tutorial exit','c-error'); return; }
  tutorial.on = true;
  tutorial.step = 0;
  tutorial.did = {};
  print('TUTORIAL - first mission (optional)', 'c-accent');
  print('The steps are the real commands, in order; each one ticks off when you run it.', 'c-muted');
  print('"tutorial skip" passes a step, "tutorial exit" stops. The tutorial itself adds no trace and no credits.', 'c-muted');
  printTutorialStep();
}

// A connection is not access: until the password is broken the remote machine
// answers the network but shows nothing. Without this, the files — including the
// briefing the third mission asks for — could be read around the crack.
function accessDenied(){
  const srv = state.connected && SERVERS[state.connected];
  if(!srv || srv.cracked) return false;
  print(`Access denied. ${state.connected} has not been cracked yet.`,'c-error');
  print('Type "crack" to breach it, or "disconnect" to back out.','c-muted');
  return true;
}

function cmdLs(){
  if(accessDenied()) return;
  const srv = state.connected || 'localhost';
  const node = getNode(srv, state.currentDir);
  if(!node || isFile(node)){ print('Not a directory.','c-error'); return; }
  const entries = Object.keys(node).filter(e=>!isBurned(srv, state.currentDir + '/' + e));
  if(entries.length===0){ print('(empty directory)','c-muted'); return; }
  let output_str = '';
  entries.forEach(e=>{
    const child = node[e];
    if(isDir(child)) output_str += `<span class="c-info">${e}/</span>  `;
    else {
      const enc = typeof child==='object' && child.encrypted && !isDecrypted(srv, state.currentDir+'/'+e);
      output_str += enc ? `<span class="c-warning">${e} [ENC]</span>  ` : `<span class="c-default">${e}</span>  `;
    }
  });
  printHTML(output_str);
  tutorialDid('ls');
}

function cmdCd(arg){
  if(!arg){ 
    const srv = state.connected || 'localhost';
    if(srv==='localhost') state.currentDir='/home/ghost';
    else state.currentDir='/';
    updateUI(); return; 
  }
  if(accessDenied()) return;
  const srv = state.connected || 'localhost';
  const newPath = resolvePath(state.currentDir, arg);
  const node = getNode(srv, newPath);
  if(!node){ print(`Directory not found: ${arg}`,'c-error'); return; }
  if(isFile(node)){ print(`Not a directory: ${arg}`,'c-error'); return; }
  state.currentDir = newPath;
  updateUI();
}

function cmdCat(args){
  const list = Array.isArray(args) ? args : (args ? [args] : []);
  if(!list.length){ print('Usage: cat <file> [more files]','c-error'); return; }
  if(accessDenied()) return;
  for(const arg of list) catFile(arg);
}

function catFile(arg){
  const srv = state.connected || 'localhost';
  const path = resolvePath(state.currentDir, arg);
  const node = getNode(srv, path);
  if(!node){ print(`File not found: ${arg}`,'c-error'); return; }
  if(isDir(node)){ print(`"${arg}" is a directory. Use "ls" to list.`,'c-error'); return; }

  const enc = typeof node==='object' && node.encrypted;
  const dec = isDecrypted(srv, path);

  if(enc && !dec){
    print(`[ENCRYPTED - ${node.cipher==='vigenere' ? 'Vigenere keyword required' : 'Caesar cipher detected'}]`, 'c-warning');
    print('', 'c-default');
    print(caesarEnc(getContent(node), node.shift), 'c-muted');
    print('', 'c-default');
    print(`Use "decrypt ${arg}" to attempt decryption.`, 'c-info');
  } else {
    print(getContent(node), 'c-default');
    if(node.alarm){
      const paid = addTrace(12);
      print(`[TRIPWIRE] Reading it reported you. Trace +${paid}.`, 'c-warning');
    }
    if(node.burnOnRead){
      burnFile(srv, path);
      print('[The file removed itself from the host.]', 'c-warning');
    }
    tutorialDid('cat:' + path.split('/').pop());
  }
}

function cmdHistoryList(){
  if(!cmdHistory.length){ print('No commands yet.', 'c-muted'); return; }
  const start = Math.max(0, cmdHistory.length - 20);
  cmdHistory.slice(start).forEach((line, i)=>{
    print(String(start + i + 1).padStart(4) + '  ' + line, 'c-default');
  });
}

function cmdGrep(args){
  const list = args.slice();
  let ignore = false;
  while(list[0] === '-i'){ ignore = true; list.shift(); }
  if(list.length < 2){ print('Usage: grep [-i] <pattern> <file>', 'c-error'); return; }
  const pattern = list[0];
  const file = list[1];
  if(accessDenied()) return;
  const srv = state.connected || 'localhost';
  const path = resolvePath(state.currentDir, file);
  const node = getNode(srv, path);
  if(!node){ print(`File not found: ${file}`, 'c-error'); return; }
  if(isDir(node)){ print(`"${file}" is a directory.`, 'c-error'); return; }
  const enc = typeof node==='object' && node.encrypted && !isDecrypted(srv, path);
  const lines = String(enc ? encryptedText(node) : getContent(node)).split('\n');
  const needle = ignore ? pattern.toLowerCase() : pattern;
  let hits = 0;
  lines.forEach((line, i)=>{
    if((ignore ? line.toLowerCase() : line).includes(needle)){
      hits++;
      print(String(i + 1).padStart(3) + ': ' + line, 'c-default');
    }
  });
  if(!hits) print('No matches.', 'c-muted');
}

function cmdScan(){
  if(state.connected){ print('Disconnect before scanning.','c-error'); return; }
  addTrace(3);
  print('Scanning network...', 'c-info');
  slowCommand(new Promise(resolve => setTimeout(()=>{
    let found = [];
    // Always discover nexus-corp on first scan
    if(!SERVERS['nexus-corp.net'].discovered){
      SERVERS['nexus-corp.net'].discovered = true;
      state.discoveredServers.add('nexus-corp.net');
      found.push('nexus-corp.net (10.0.44.12) - Security: LOW');
    }
    // Discover relay if nexus is cracked
    if(SERVERS['nexus-corp.net'].cracked && !SERVERS['relay.nexus-corp.net'].discovered){
      SERVERS['relay.nexus-corp.net'].discovered = true;
      state.discoveredServers.add('relay.nexus-corp.net');
      found.push('relay.nexus-corp.net (10.0.44.50) - Security: MEDIUM');
    }
    // Discover vault if relay is cracked
    if(SERVERS['relay.nexus-corp.net'].cracked && !SERVERS['vault.nexus-corp.net'].discovered){
      SERVERS['vault.nexus-corp.net'].discovered = true;
      state.discoveredServers.add('vault.nexus-corp.net');
      found.push('vault.nexus-corp.net (10.0.44.99) - Security: HIGH');
    }
    // Act two: VEGA's fallback only answers once the leak is out, and the
    // Meridian archive only shows itself once the fallback has been cracked.
    if(state.completedMissions.includes(7) && !SERVERS['drop.vega.net'].discovered){

function cmdDownload(arg){
  if(!arg){ print('Usage: download <filename>','c-error'); return; }
  if(!state.connected){ print('Connect to a remote server first.','c-error'); return; }
  if(accessDenied()) return;
  const srv = state.connected;
  const path = resolvePath(state.currentDir, arg);
  const node = getNode(srv, path);
  if(!node){ print(`File not found: ${arg}`,'c-error'); return; }
  if(isDir(node)){ print(`Cannot download a directory.`,'c-error'); return; }

  const enc = typeof node==='object' && node.encrypted && !isDecrypted(srv, path);
  if(enc){ print(`File is encrypted. Decrypt it first.`,'c-warning'); return; }

  const fname = path.split('/').pop();
  const source = srv + ':' + path;
  if(state.taken.includes(source)){ print(`File already downloaded.`,'c-muted'); return; }

  // Two hosts can hold files of the same name; the local copy is keyed by name,
  // so the later one overwrites it and says so.
  const localDL = getNode('localhost', '/home/ghost/downloads');
  const overwrote = !!(localDL && localDL[fname]);
  if(localDL) localDL[fname] = getContent(node);

  state.taken.push(source);
  if(!state.downloaded.includes(fname)) state.downloaded.push(fname);
  state.downloadCount++;
  const classified = typeof node==='object' && node.classified;
  const alarm = typeof node==='object' && node.alarm;
  // The proxy cuts the heavy classified carry; stealth halves the charge but
  // halves the buyer's payment too - it scrubs your cut with your trail.
  let cost = classified ? 8 : 2;
  if(classified && state.proxyBought) cost = 4;
  if(alarm) cost += 20;
  let pay = classified ? 100 : 30;
  if(state.stealthBought) pay = Math.floor(pay / 2);
  addTrace(cost);
  addCredits(pay);

  print(`Downloaded: ${fname}`, 'c-success');
  if(classified) print(`[CLASSIFIED FILE - Trace increased significantly]`, 'c-warning');
  if(alarm) print('[TRIPWIRE] That file bills every copy made. It cost you trace.', 'c-warning');
  if(overwrote) print(`[Overwrote the local copy of ${fname}]`, 'c-muted');
  if(node.decoy){
    state.ledgerDecoy = true;
    print('[COPY] The header calls this a certified summary, not the settlement original.', 'c-warning');
  }
  if(source === 'meridian.archive.net:/data/ledger/meridian_ledger.dat') state.ledgerReal = true;
  print(`Saved to /home/ghost/downloads/`, 'c-muted');

  checkMissions();
  updateUI();
}

function startCrackGame(server){
  const srv = SERVERS[server];
  const wordLen = srv.pwdLen;
  if(state.crackerV2Bought){
    const noisy = addTrace(5);
    if(state.gameEnded) return;
    print(`[Cracker v2 - noisy brute force: trace +${noisy}]`, 'c-warning');
  }
  let words = [...CRACK_WORDS[wordLen]];
  const password = words[Math.floor(Math.random()*words.length)];

  // If cracker_v2, eliminate some wrong words
  let eliminated = [];
  if(state.crackerV2Bought){
    const wrongWords = words.filter(w=>w!==password);
    const toElim = wrongWords.sort(()=>Math.random()-0.5).slice(0,3);
    eliminated = toElim;
    words = words.filter(w=>!eliminated.includes(w));
  }

  state.mode = 'crack';
  state.crackState = {
    server, password, words, attemptsLeft: srv.maxAttempts, maxAttempts: srv.maxAttempts, eliminated
  };
  updatePrompt();

  print('\n╔══════════════════════════════════════╗', 'c-warning');
  print('║      PASSWORD CRACK INTERFACE        ║', 'c-warning');
  print('╚══════════════════════════════════════╝', 'c-warning');
  print(`\nTarget: ${server}`, 'c-info');
  print(`Attempts: ${'●'.repeat(srv.maxAttempts)} ${srv.maxAttempts}/${srv.maxAttempts}`, 'c-default');

  if(eliminated.length>0){
    print(`\n[Cracker v2] Eliminated: ${eliminated.join(', ')}`, 'c-success');
  }

  print('\nSelect a word to guess the password:', 'c-default');
  print('─'.repeat(40), 'c-muted');

  // Display words in columns with hex addresses
  const hexChars = '0123456789ABCDEF';
  words.forEach((w,i)=>{
    const addr = '0x'+hexChars[Math.floor(Math.random()*16)]+hexChars[Math.floor(Math.random()*16)]
      +hexChars[Math.floor(Math.random()*16)]+hexChars[Math.floor(Math.random()*16)];
    const padded = w.padEnd(10);
    printHTML(`  <span class="c-muted">${addr}:</span> <span class="c-highlight">${padded}</span>${(i%3===2)?'':''}`);
  });

function handleCrackInput(input){
  const cs = state.crackState;
  if(!cs) return;
  const word = input.toUpperCase().trim();

  if(word==='EXIT'){
    state.mode='normal';
    state.crackState=null;
    print('Crack aborted. Disconnected from server.','c-warning');
    state.connected=null;
    state.currentDir='/home/ghost';
    updateUI();
    return;
  }

  if(!cs.words.includes(word)){
    print(`"${input}" is not a valid option. Pick from the list.`,'c-error');
    return;
  }

  if(word===cs.password){
    // Success!
    SERVERS[cs.server].cracked = true;
    state.crackedServers.add(cs.server);
    addCredits(150);
    state.mode='normal';
    state.crackState=null;
    print(`\n★ PASSWORD CRACKED: ${cs.password} ★`, 'c-success');
    print(`Access granted to ${cs.server}!`, 'c-success');
    print(`[+150cr]`, 'c-accent');
    checkMissions();
    updateUI();
    return;
  }

  // Wrong guess - calculate likeness
  cs.attemptsLeft--;
  let likeness = 0;
  for(let i=0;i<word.length;i++){
    if(word[i]===cs.password[i]) likeness++;
  }

  print(`> ${word}`, 'c-highlight');
  print(`  Likeness: ${likeness}/${word.length} letters in correct position`, likeness>0?'c-warning':'c-error');
  print(`  Attempts remaining: ${'●'.repeat(cs.attemptsLeft)}${'○'.repeat(cs.maxAttempts-cs.attemptsLeft)} ${cs.attemptsLeft}/${cs.maxAttempts}\n`, cs.attemptsLeft<=1?'c-error':'c-default');

  // Teach the number while there is still a guess left to spend on it.
  if(cs.attemptsLeft>0) tutorialCrackHint(word, likeness, cs);

  if(cs.attemptsLeft<=0){
    // Failed!
    state.mode='normal';
    state.crackState=null;
    addTrace(10);
    print(`CRACK FAILED. Lockout triggered.`, 'c-error');
    print(`Trace increased significantly. Disconnected.`, 'c-error');
    tutorialCrackLockout(cs.server);
    state.connected=null;
    state.currentDir='/home/ghost';
    checkMissions();
    updateUI();
  }
}

function handleDecryptInput(input){
  const ds = state.decryptState;
  if(!ds) return;
  const parts = input.trim().split(/\s+/);
  const cmd = parts[0].toLowerCase();

  if(cmd==='exit'){
    state.mode='normal';
    state.decryptState=null;
    print('Decryption aborted.','c-warning');
    updatePrompt();
    return;
  }

  if(cmd==='hint'){
    addTrace(3);
    if(ds.cipher==='vigenere'){
      const key = String(ds.key || '').toUpperCase();
      const khints = [
        'The key is one word, not a number.',
        `The key starts with "${key[0] || '?'}".`,
        `The key is ${key.length} letters long.`,
        'The key is the name on the account that pays for this archive.',
        'counter_intel.txt names the cipher and where the key comes from.'
      ];
      print(`Hint: ${khints[Math.floor(Math.random()*khints.length)]}`, 'c-accent');
      print(`[Trace +3]`, 'c-warning');
      return;
    }
    // Give a useful hint about the shift
    const s = ds.shift;
    const hints = [
      `The shift is ${s%2===0?'even':'odd'}.`,
      `The shift is ${s<=6?'between 1-6':s<=10?'between 7-10':'between 11-25'}.`,
      `Try subtracting each letter position from the encrypted text by the same number.`,
      `The first word decrypted starts with "${ds.content[0]}".`,
      `The shift is ${s<=13?'at most 13':'greater than 13'}.`
    ];
    // Pick a hint that's somewhat helpful but not too obvious
    const hintIdx = Math.floor(Math.random()*hints.length);
    print(`Hint: ${hints[hintIdx]}`, 'c-accent');
    print(`[Trace +3]`, 'c-warning');
    return;
  }

  if(cmd==='try'){
    if(ds.cipher==='vigenere'){
      const key = String(parts[1] || '').toUpperCase().replace(/[^A-Z]/g, '');
      if(key.length < 2){ print('Usage: try <keyword>','c-error'); return; }
      const shown = vigenereDec(ds.encText, key).substring(0,150);
      print(`\nKeyword ${key} preview:`, 'c-info');
      print('─'.repeat(40), 'c-muted');
      print(shown + (shown.length>=150?'...':''), 'c-default');
      print('─'.repeat(40), 'c-muted');
      print('(This is a preview. Use "submit" if it reads clean.)\n', 'c-muted');
      return;
    }
    const shift = parseInt(parts[1]);
    if(isNaN(shift)||shift<0||shift>25){
      print('Invalid shift. Use a number 0-25.','c-error');
      return;
    }
    // Reverse the shift on the ciphertext, not on the plaintext: the old
    // version re-shuffled the stored content, so no preview ever matched.
    const decrypted = caesarEnc(ds.encText, 26-shift);
    const preview = decrypted.substring(0,150)+(decrypted.length>150?'...':'');
    print(`\nShift ${shift} preview:`, 'c-info');
    print('─'.repeat(40), 'c-muted');
    print(preview, 'c-default');
    print('─'.repeat(40), 'c-muted');
    print('(This is a preview. Use "submit" if it looks correct.)\n', 'c-muted');
    return;
  }

  if(cmd==='submit'){
    if(ds.cipher==='vigenere'){
      const key = String(parts[1] || '').toUpperCase().replace(/[^A-Z]/g, '');
      if(key.length < 2){ print('Usage: submit <keyword>','c-error'); return; }
      if(key === String(ds.key || '').toUpperCase()) finishDecrypt(ds);
      else failDecryptAttempt(ds);
      return;
    }
    const shift = parseInt(parts[1]);
    if(isNaN(shift)||shift<0||shift>25){
      print('Invalid shift. Use a number 0-25.','c-error');
      return;
    }
    if(shift===ds.shift) finishDecrypt(ds);
    else failDecryptAttempt(ds);
    return;
  }

  print('Unknown command. Use: try <shift|key>, submit <shift|key>, hint, or exit.','c-error');
}

// --- INPUT HANDLING ---

inputEl.addEventListener('keydown', e=>{
  if(e.ctrlKey && (e.key==='l' || e.key==='L')){ e.preventDefault(); clearTerm(); return; }
  if(e.ctrlKey && (e.key==='c' || e.key==='C')){ e.preventDefault(); inputEl.value=''; return; }
  if(e.key==='Enter'){
    const val = inputEl.value;
    inputEl.value = '';
    processCmd(val);
  } else if(e.key==='ArrowUp'){
    e.preventDefault();
    if(cmdHistory.length>0 && histIdx<cmdHistory.length-1){
      histIdx++;
      inputEl.value = cmdHistory[cmdHistory.length-1-histIdx];
    }
  } else if(e.key==='ArrowDown'){
    e.preventDefault();
    if(histIdx>0){
      histIdx--;
      inputEl.value = cmdHistory[cmdHistory.length-1-histIdx];
    } else {
      histIdx=-1;
      inputEl.value='';
    }
  } else if(e.key==='Tab'){
    e.preventDefault();
    tabComplete();
  }
});

// Keep focus on input
document.addEventListener('click', ()=>{
  inputEl.focus();
});

function tabComplete(){
  const val = inputEl.value.trim();
  const parts = val.split(/\s+/);

  if(parts.length<=1){
    const cmds = ['tutorial','help','ls','cd','cat','pwd','grep','man','history','clear','scan','connect','disconnect','crack','decrypt','download','analyze','purge','status','missions','trace','hint','shop','buy','whoami','map','exit'];
    const match = cmds.find(c=>c.startsWith(parts[0]));
    if(match) inputEl.value = match+' ';
  } else if(parts.length===2){
    const cmd = parts[0].toLowerCase();
    if(['cd','cat','download','decrypt','read','type'].includes(cmd)){
      const srv = state.connected||'localhost';
      if(state.connected && !SERVERS[state.connected].cracked) return;
      const node = getNode(srv, state.currentDir);
      if(node && isDir(node)){
        const entries = Object.keys(node);
        const match = entries.find(e=>e.toLowerCase().startsWith(parts[1].toLowerCase()));
        if(match) inputEl.value = cmd+' '+match;
      }
    } else if(cmd==='connect'){
      const discovered = Object.keys(SERVERS).filter(s=>SERVERS[s].discovered && s!=='localhost');
      const match = discovered.find(s=>s.startsWith(parts[1]));
      if(match) inputEl.value = cmd+' '+match;
    } else if(cmd==='buy'){
      const ids = SHOP.map(s=>s.id);
      const match = ids.find(s=>s.startsWith(parts[1]));
      if(match) inputEl.value = cmd+' '+match;
    }
  }
}

// --- GLITCH EFFECT (random chars at high trace) ---

setInterval(()=>{
  if(state.trace > 75 && !state.gameEnded && Math.random()<0.15){
    const glitchChars = '!@#$%^&*()_+{}|:<>?~`-=[]\\;\',./0123456789';
    const len = Math.floor(Math.random()*8)+2;
    let txt = '';
    for(let i=0;i<len;i++) txt+=glitchChars[Math.floor(Math.random()*glitchChars.length)];
    const span = document.createElement('span');
    span.className = 'line c-error';
    span.style.opacity = '0.3';
    span.style.fontSize = '10px';
    span.textContent = txt;
    output.appendChild(span);
    output.appendChild(document.createTextNode('\n'));
    // Remove after 2 seconds
    setTimeout(()=>{ span.remove(); }, 2000);
  }
}, 1000);

// --- INIT ---

/* ── continue where you left off ─────────────────────────────────────────── */

// A session is the operator's standing amount: trace, credits, inventory and
// which servers have been found and cracked. The scrollback is not saved; the
// terminal reprints a single line so the screen is not confusingly blank.
// A finished or restarted run must not be offered back: the save producer goes
// quiet at the end, so the last autosave would otherwise outlive the run.
function dropSavedRun(){
  try{ if(window.__boredResume) window.__boredResume.clear(); }catch(error){}
}

function savedRun(){
  if(!state.booted || state.gameEnded || state.mode !== 'normal') return null;
  if(state.discoveredServers.size <= 1 && !state.downloadCount && !state.completedMissions.length) return null;
  return {
    label:'trace ' + state.trace + '% \u00b7 ' + state.credits + ' CR \u00b7 mission ' + Math.min(state.missionIdx + 1, MISSIONS.length),
    state:{
      connected:state.connected, currentDir:state.currentDir,
      trace:state.trace, credits:state.credits,
      inventory:state.inventory.slice(), downloaded:state.downloaded.slice(),
      decrypted:state.decrypted.slice(), missionIdx:state.missionIdx,
      completedMissions:state.completedMissions.slice(),
      stealthBought:state.stealthBought, crackerV2Bought:state.crackerV2Bought,
      decryptorBought:state.decryptorBought, proxyBought:state.proxyBought,
      downloadCount:state.downloadCount, burned:state.burned.slice(),
      startedAt:state.startedAt, taken:state.taken.slice(),
      ledgerReal:state.ledgerReal, ledgerDecoy:state.ledgerDecoy,
      discovered:Array.from(state.discoveredServers), cracked:Array.from(state.crackedServers),
      servers:Object.keys(SERVERS).reduce(function (out, name) {
        out[name] = { discovered:!!SERVERS[name].discovered, cracked:!!SERVERS[name].cracked };
        return out;
      }, {})
    }
  };
}

function restoreRun(saved){
  const run = saved && saved.state;
  if(!run || !Array.isArray(run.discovered)) return false;
  state.connected = run.connected || null;
  state.currentDir = typeof run.currentDir === 'string' ? run.currentDir : '/home/ghost';
  state.trace = Math.max(0, Math.min(100, run.trace | 0));
  state.credits = Math.max(0, run.credits | 0);
  state.inventory = Array.isArray(run.inventory) ? run.inventory.slice() : ['cracker_v1'];
  state.downloaded = Array.isArray(run.downloaded) ? run.downloaded.slice() : [];
  state.decrypted = Array.isArray(run.decrypted) ? run.decrypted.slice() : [];
  state.missionIdx = Math.max(0, run.missionIdx | 0);
  state.completedMissions = Array.isArray(run.completedMissions) ? run.completedMissions.slice() : [];
  state.mode = 'normal';
  state.crackState = null;
  state.decryptState = null;
  state.gameEnded = false;
  state.booted = true;
  state.stealthBought = !!run.stealthBought;
  state.crackerV2Bought = !!run.crackerV2Bought;
  state.decryptorBought = !!run.decryptorBought;
  state.proxyBought = !!run.proxyBought;
  state.downloadCount = Math.max(0, run.downloadCount | 0);
  state.burned = Array.isArray(run.burned) ? run.burned.slice() : [];
  state.hunt = null;
  state.startedAt = Number(run.startedAt) || Date.now();
  state.taken = Array.isArray(run.taken) ? run.taken.slice() : [];
  state.ledgerReal = !!run.ledgerReal;
  state.ledgerDecoy = !!run.ledgerDecoy;
  state.discoveredServers = new Set(run.discovered.concat(['localhost']));
  state.crackedServers = new Set((run.cracked || []).concat(['localhost']));
  Object.keys(run.servers || {}).forEach(function (name) {
    if(!SERVERS[name]) return;
    SERVERS[name].discovered = !!run.servers[name].discovered;
    SERVERS[name].cracked = !!run.servers[name].cracked;
  });
  output.innerHTML = '';
  updateUI();
  print('Session restored. Welcome back, operator.','c-success');
  print('Type "missions" to check where you left off.\n','c-info');
  inputEl.focus();
  return true;
}

if(window.__boredResume){
  const resume = window.__boredResume;
  const pending = resume.read();
  if(pending){
    resume.ask(pending.label, function () { if(!restoreRun(pending)){ resume.clear(); bootSequence(); } }, function () { bootSequence(); });
    resume.arm(savedRun);
  } else {
    updateUI();
    bootSequence();
    resume.arm(savedRun);
  }
} else {
  updateUI();
  bootSequence();
}
