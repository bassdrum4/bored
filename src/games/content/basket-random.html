<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Basket Random</title>
<!-- Basket Random runs directly in the original Construct 3 export; there is
     no Bored startup cover or intervening intro screen. The inner export starts
     on its native "game" layout, which contains the actual main menu. -->
<style>
  * { box-sizing: border-box }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #e7f3ff }
  body { touch-action: manipulation; -webkit-tap-highlight-color: transparent }
  main, #stage { width: 100%; height: 100%; height: 100dvh; overflow: hidden }
  #game { display: block; width: 100%; height: 100%; border: 0; background: #e7f3ff }
</style>
</head>
<body>
<main>
  <section id="stage" aria-label="Basket Random game">
    <iframe id="game" title="Basket Random" allow="autoplay; fullscreen" scrolling="no"></iframe>
  </section>
</main>
<script>
const frame = document.getElementById('game');
let ready = false, started = false;

// The hub loads this document in a srcdoc frame. On its own, it lives beside
// basket-random/. Resolve both forms to the same local Construct 3 build.
const bases = [document.baseURI];
try { if (window.parent !== window) bases.push(window.parent.location.href); } catch (error) { /* cross-origin embed */ }
bases.push(window.location.href);
const standalone = bases.some(base => {
  try { return new URL(base).pathname.endsWith('/basket-random.html'); } catch (error) { return false; }
});
const relative = (standalone ? 'basket-random' : 'games/content/basket-random') + '/index.html';

function buildUrl() {
  for (const base of bases) {
    try { return new URL(relative, base).href; } catch (error) { /* try next base */ }
  }
  return null;
}

// Listen first so a cached asset doesn't beat the load handler.
frame.addEventListener('load', () => {
  let blank = false;
  try { if (frame.contentWindow) blank = frame.contentWindow.location.href === 'about:blank'; }
  catch (error) { /* opaque frame */ }
  if (!started || !frame.src || blank) return;
  ready = true;
  try { frame.contentWindow.focus(); } catch (error) { /* document may be gone */ }
});

// Load immediately: the real Basket Random title/menu is the first screen.
const url = buildUrl();
if (url) {
  started = true;
  frame.src = url;
}

window.__boredSnapshot = () => ({
  slug: 'basket-random',
  started: started,
  loaded: ready,
  finished: false
});
</script>
</body>
</html>
