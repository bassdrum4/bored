<!DOCTYPE html>
<html lang="en">
<head>
<script>
(function () {
  try { localStorage.getItem('__probe'); return; } catch (e) { }
  const m = {};
  const s = {
    getItem: x => (Object.prototype.hasOwnProperty.call(m, x) ? m[x] : null),
    setItem: (x, v) => { m[x] = String(v); },
    removeItem: x => { delete m[x]; },
    clear: () => { for (const k in m) delete m[k]; },
    key: i => Object.keys(m)[i] || null
  };
  Object.defineProperty(s, 'length', { get: () => Object.keys(m).length });
  try { Object.defineProperty(window, 'localStorage', { value: s, configurable: true }); } catch (e) { }
  try { Object.defineProperty(window, 'sessionStorage', { value: s, configurable: true }); } catch (e) { }
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pastel Tanks</title>
<style>
  :root {
    --paper: #f5f2ea; --board: #fffdf7; --ink: #191713; --hair: #d8d2c4;
    --dim: #6b6558; --accent: #456653; --red: #b3261e;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box }
  html, body { height: 100% }
  body { background: var(--paper); color: var(--ink); font: 13px/1.5 var(--mono);
    display: grid; place-items: center; overflow: hidden; touch-action: manipulation;
    user-select: none; -webkit-user-select: none }
  main { display: grid; gap: 8px; padding: 8px; justify-items: center }
  canvas { display: block; border: 1px solid var(--hair); cursor: crosshair; touch-action: none }
  #bar { display: none; flex-wrap: wrap; gap: 6px; justify-content: center; width: 100% }
  #bar button { font: 12px var(--mono); padding: 8px 10px; border: 1px solid var(--hair);
    border-radius: 2px; background: var(--board); color: var(--ink); cursor: pointer; touch-action: manipulation }
  #bar button.sel { border-color: var(--ink) }
  #bar button:disabled { color: var(--dim); cursor: default }
  #bar .fire { min-width: 70px; border-color: var(--ink); font-weight: 600 }
  #hint { min-height: 17px; text-align: center; color: var(--dim); font-size: 11px }
</style>
</head>
<body>
<main>
  <canvas id="c" width="960" height="580"></canvas>
  <div id="bar" role="toolbar"></div>
  <div id="hint"></div>
  <span class="wind-flag" hidden></span>
</main>
<script>'use strict';
/* Pastel Tanks, rules version 2 — an artillery duel inside a drivable box.
 * The rules live in tank-engine.js: the four wall bands are one ring road,
 * tanks drive it (walls, ceiling, upside down included), shells fall with
 * gravity, and a hole in any panel dumps whatever stands over it. This file
 * only shows the world a replay builds and takes the input that drives it:
 * offline it simulates its own shots, and under Bored Together the move goes
 * to the server and each side paints what the stored list replays. */

const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const barEl = document.getElementById('bar'), hintEl = document.getElementById('hint');

const C = {
  paper: '#f5f2ea', board: '#fffdf7', ink: '#191713', hair: '#d8d2c4', dim: '#6b6558',
  accent: '#456653', red: '#b3261e', seat1: '#456653', seat2: '#b3261e'
};
const WEAPONS = ['standard', 'heavy', 'cluster', 'mine', 'ricochet'];
const WEAPON_TAGS = { standard: '1 STD', heavy: '2 HVY', cluster: '3 CLU', mine: '4 MIN', ricochet: '5 RIC' };

/* Snapshot globals first: the daily adapter looks for these exact names. */
let mode = 'TITLE', aiEnabled = false, sessionWins = 0;

let engine = null;
let state = null, world = null, winner = null;
let anim = null;         // { items, speed, total, frame, bursts, pre, done, result, group }
let sel = 'standard', walkPx = 0, charge = null, chan = 1; // chan: seat the input serves
let drag = null;         // { id, moved } pointer aiming
const aimVars = { 1: { angle: 45, power: 12 }, 2: { angle: 45, power: 12 } };
const liveDir = { 1: 1, 2: 1 };
const keys = new Set();
let shake = 0, particles = [], popups = [];
let aiTimer = 0, aiChosen = null, overTime = 0;

/* Bored Together: the bridge arrives before this script runs. */
const bridge = window.__boredTogether || null;
let online = null;       // { seat, names, busy, canonical, job, waitMs }

/* ── Palette, text and small canvas helpers ─────────────────────────────── */

function nameFor(seat) {
  if (online && online.names && online.names[seat - 1]) return online.names[seat - 1];
  return seat === 1 ? 'LAVENDER' : 'MINT';
}
const colourFor = seat => (seat === 1 ? C.seat1 : C.seat2);

function label(text, x, y, size, colour, align, weight) {
  ctx.font = (weight || 400) + ' ' + size + 'px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
  ctx.textAlign = align || 'center';
  ctx.fillStyle = colour || C.ink;
  ctx.fillText(text, x, y);
}

function roundRect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function sparksAt(x, y, n, colour) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 1.2 + Math.random() * 3.4;
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1.6, life: 1,
      dec: .026 + Math.random() * .024,
      colour: colour || (Math.random() < .6 ? C.hair : C.ink)
    });
  }
}
function popup(text, x, y, colour) { popups.push({ text, x, y, colour, life: 1 }); }

function setStatus(text, colour) { hintEl.textContent = text || ''; hintEl.style.color = colour || C.dim; }

/* ── Geometry shortcuts over the engine's numbers ───────────────────────── */

const X0e = () => engine.BX + engine.T, X1e = () => engine.BX + engine.BW - engine.T;
const Y0e = () => engine.BY + engine.T, Y1e = () => engine.BY + engine.BH - engine.T;
const clampN = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const bodyP = tank => {
  const p = engine.ringPoint(tank.s);
  return { x: p.x + p.nx * 13, y: p.y + p.ny * 13 };
};
function panelRect(wall, j) {
  const pl = engine.PANEL_LENS[wall];
  if (wall === 0) return { x: X0e() + j * pl, y: engine.BY, w: pl + .6, h: engine.T };
  if (wall === 1) return { x: X1e(), y: Y0e() + j * pl, w: engine.T, h: pl + .6 };
  if (wall === 2) return { x: X1e() - (j + 1) * pl, y: Y1e(), w: pl + .6, h: engine.T };
  return { x: engine.BX, y: Y1e() - (j + 1) * pl, w: engine.T, h: pl + .6 };
}
function countHoles(w) {
  let n = 0;
  for (const row of w.panels) for (const v of row) if (!v) n++;
  return n;
}

/* ── Session flow ───────────────────────────────────────────────────────── */

function resetRound() {
  aimVars[1] = { angle: 45, power: 12 }; aimVars[2] = { angle: 45, power: 12 };
  liveDir[1] = 1; liveDir[2] = 1;
  sel = 'standard'; walkPx = 0; charge = null; drag = null;
  aiChosen = null; aiTimer = 0; anim = null;
  particles = []; popups = []; shake = 0;
}

function startLocal(fresh) {
  if (bridge) return;
  const errBox = document.getElementById('together-error');
  if (errBox) errBox.remove();
  if (fresh) sessionWins = 0;
  winner = null; overTime = 0;
  const seed = ((window.__boredSeed && (window.__boredSeed.seed >>> 0)) ||
    (((Date.now() * 2654435761 + 1) >>> 0) || 1));
  state = engine.opening(seed);
  world = engine.replay(state);
  resetRound();
  mode = (aiEnabled && state.turn === 2) ? 'CPU' : 'AIM';
  syncBar();
  setStatus(mode === 'CPU' ? 'MINT TAKES AIM.' : 'YOUR TURN, LAVENDER.', C.dim);
}

function repaint(state2, opts) {
  state = state2;
  world = engine.replay(state);
  winner = state.winner || world.winner || null;
  resetRound();
  if (winner) { mode = 'OVER'; overTime = 0; }
  else if (online) mode = (online.canPlay() && state.turn === online.seat) ? 'AIM' : 'WAIT';
  else mode = (aiEnabled && state.turn === 2) ? 'CPU' : 'AIM';
  if (opts && opts.events) aftermath(opts.events);
  syncBar(); syncStatus();
}

function syncStatus() {
  if (mode === 'TITLE') return setStatus('');
  if (mode === 'ANIM') return setStatus('SHELL AWAY.', C.ink);
  if (mode === 'CPU') return setStatus(nameFor(2) + ' TAKES AIM.', C.dim);
  if (mode === 'WAIT') return setStatus('WAITING FOR ' + nameFor(state ? 3 - (online ? online.seat : 2) : 1) + ' \u2026', C.dim);
  if (mode === 'OVER') {
    if (bridge) return setStatus('');
    return setStatus(overTime >= 60 ? (aiEnabled ? 'NEXT ROUND SHORTLY \u2014 SIT TIGHT.' : 'TAP OR PRESS SPACE FOR THE NEXT ROUND.') : '', C.dim);
  }
  if (mode === 'AIM') {
    const s = turnSeat();
    if (s === 1) return setStatus('A/D DRIVE \u00b7 W/S AIM \u00b7 HOLD SPACE \u00b7 DRAG TO AIM \u00b7 1-5 SHELLS', C.dim);
    return setStatus('\u2190/\u2192 DRIVE \u00b7 \u2191/\u2193 AIM \u00b7 HOLD ENTER \u00b7 1-5 SHELLS', C.dim);
  }
  return setStatus('');
}

/* Controls live or die by the turn: one seat drives with A/D, the other with
 * arrows, so a hot-seat pair never fight over the keys. In an online match
 * this side only climbs in when it is its seat. */
function turnSeat() {
  if (online) return online.seat;
  if (aiEnabled && state && state.turn === 2) return 2;
  return state ? state.turn : 1;
}
function playable() {
  if (!world || world.winner) return false;
  if (online) return mode === 'AIM' && online.canPlay() && state.turn === online.seat;
  return mode === 'AIM' && !(aiEnabled && state.turn === 2);
}

/* ── Draft shot: what Space, ENTER or the FIRE button would send ─────────── */

function charging() { return charge !== null; }
let chargeFrom = null;
function draftShot() {
  if (!world || world.winner || anim) return null;
  const seat = turnSeat(), aim = aimVars[seat];
  let weapon = sel;
  if (weapon !== 'standard' && !(world.tanks[seat - 1].ammo[weapon] > 0)) { weapon = 'standard'; sel = 'standard'; }
  return {
    seat, drive: walkPx, angle: aim.angle,
    power: charging() ? Math.round(charge * 10) / 10 : aim.power, weapon
  };
}
function beginCharge() {
  if (!playable() || charging()) return;
  charge = chargeFrom = Math.max(2, aimVars[turnSeat()].power);
}
function releaseCharge() {
  if (!charging()) return;
  // a tap that never ticked the charger fires at the aimed power exactly
  const power = Math.max(chargeFrom === null ? 0 : chargeFrom, charge);
  charge = chargeFrom = null;
  if (!playable()) return;
  const shot = draftShot();
  if (shot) { shot.power = Math.round(power * 10) / 10; fire(shot); }
}

/* ── Firing and its choreography ────────────────────────────────────────── */

function fire(shot) {
  if (!shot || !state || world.winner || anim) return;
  const pre = engine.replay(state);
  let result;
  try { result = engine.advance(state, shot); }
  catch (error) {
    if (online) return bridge.error(error, () => {
      try { repaint(online ? online.state() : state); } catch (err2) { }
      setTimeout(() => fire(shot), 30);
    });
    popup('NO GO: ' + error.message.toUpperCase(), 480, 300, C.red);
    walkPx = 0; charge = null; syncStatus(); return;
  }
  const shotIdx = state.shots.length;
  const group = {
    trails: result.world.trails.slice(pre.trails.length),
    events: result.world.events.slice(pre.events.length)
  };
  const lens = group.trails.map(t => t.length);
  const total = lens.reduce((a, b) => a + b, 0);
  const speed = Math.max(1, Math.ceil(total / 150));
  let cursor = 0;
  const items = group.trails.map(t => { const start = cursor; cursor += t.length; return { trail: t, start, len: t.length }; });
  const bursts = [];
  for (const b of result.world.bursts) {
    if (b.at !== shotIdx || !items.length) continue;
    bursts.push({ x: b.x, y: b.y, r: b.r, when: items[0].start + items[0].len, born: false });
    // mines, cluster children and even plain bursts funnel through here; the
    // only visible one for a shot is its impact, everything after is events.
    break;
  }
  const snap = { panels: pre.panels, tanks: pre.tanks.map(t => ({ ...t })), powerups: pre.powerups.slice(), mines: pre.mines.slice() };
  anim = {
    items, speed, total, frame: -6, bursts, pre: snap, result, group,
    wait: Math.max(550, Math.min(3200, 300 + (total / speed) * 16))
  };
  walkPx = 0; charge = null;
  mode = 'ANIM';
  syncStatus();
  if (online) {
    online.busy = true;
    online.job =    online.bridgeSubmit({
      seat: shot.seat, drive: shot.drive, angle: shot.angle, power: shot.power, weapon: shot.weapon,
      won: result.next.winner || null
    }).then(c => { online.canonical = c; return c; });
  }
  anim.done = setTimeout(commitShot, anim.wait);
}

function commitShot() {
  if (!anim) return;
  clearTimeout(anim.done);
  const finished = anim;
  anim = null;
  if (online) {
    if (!online.canonical) {
      // Server has not answered yet: hold the final frame until it does.
      anim = finished;
      anim.done = setTimeout(commitShot, 120);
      return;
    }
    const canonical = online.canonical; online.canonical = null; online.busy = false;
    online.mixContext(canonical);
    repaint(canonical.state, { events: finished.group.events });
    bridge.finishTurn();
    return;
  }
  if (finished.result.next.winner === 1 && aiEnabled) sessionWins++;
  const events = finished.group.events;
  repaint(finished.result.next, { events });
}

function aftermath(events) {
  for (const ev of events) {
    const dot = s => { const t = world.tanks[s - 1]; return t ? bodyP(t) : { x: 480, y: 300 }; };
    if (ev.kind === 'hit') {
      shake = Math.max(shake, Math.min(13, ev.damage * .38));
      sparksAt(ev.x, ev.y, 10 + Math.min(16, ev.damage / 3), colourFor(ev.seat));
      popup('-' + ev.damage, ev.x, ev.y - 20, colourFor(ev.seat));
    } else if (ev.kind === 'land') {
      const at = dot(ev.seat);
      sparksAt(at.x, at.y, 12, C.hair);
      popup('LANDING -' + ev.damage, at.x, at.y - 24, colourFor(ev.seat));
      shake = Math.max(shake, 9);
    } else if (ev.kind === 'fell_out') {
      popup('FELL OUT', ev.x, clampN(ev.y - 16, 70, 552), colourFor(ev.seat));
      shake = Math.max(shake, 11);
    } else if (ev.kind === 'shield') {
      const at = dot(ev.seat);
      popup('SHIELD!', at.x, at.y - 24, C.accent);
    } else if (ev.kind === 'warp') {
      const at = dot(ev.seat);
      sparksAt(at.x, at.y, 9, C.accent);
      popup('TELEPORT', at.x, at.y - 24, C.accent);
    } else if (ev.kind === 'plant') {
      sparksAt(ev.x, ev.y, 6, C.red);
      popup('MINE SET', ev.x, ev.y + 16, C.red);
    }
  }
}

/* ── Bored Together wiring ──────────────────────────────────────────────── */

function startOnline() {
  online = {
    seat: bridge.context.seat === 2 ? 2 : 1,
    names: Array.isArray(bridge.context.players) && bridge.context.players.length === 2
      ? bridge.context.players.map(n => String(n).toUpperCase().slice(0, 12)) : null,
    busy: false, canonical: null,
    canPlay: () => !!bridge.context && bridge.context.canPlay && bridge.context.status === 'active',
    bridgeSubmit: move => bridge.submit(move),
    mixContext: c => { bridge.context = c; },
    state: () => bridge.context.state
  };
  repaint(bridge.context.state);
}

/* ── Input ──────────────────────────────────────────────────────────────── */

addEventListener('keydown', e => {
  if (['Space', 'Enter', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault();
  keys.add(e.code);
  if (mode === 'TITLE') {
    if (e.code === 'Digit1' || e.code === 'Enter' || e.code === 'Space') { aiEnabled = true; startLocal(true); }
    if (e.code === 'Digit2') { aiEnabled = false; startLocal(true); }
    return;
  }
  if (mode === 'OVER' && !bridge && overTime >= 40 &&
    (e.code === 'Enter' || e.code === 'Space' || e.code === 'KeyR')) { startLocal(false); return; }
  if (!playable()) return;
  if (!e.repeat) {
    const tag = { Digit1: 'standard', Digit2: 'heavy', Digit3: 'cluster', Digit4: 'mine', Digit5: 'ricochet' }[e.code];
    if (tag) selectWeapon(tag);
    if (e.code === 'Space' || e.code === 'Enter') beginCharge();
  }
});
addEventListener('keyup', e => {
  keys.delete(e.code);
  if (e.code === 'Space' || e.code === 'Enter') releaseCharge();
});
addEventListener('blur', () => { keys.clear(); charge = null; drag = null; });

function selectWeapon(key) {
  const tank = world && world.tanks[turnSeat() - 1];
  if (key !== 'standard' && !(tank && tank.ammo[key] > 0)) {
    setStatus('NO ' + key.toUpperCase() + ' SHELLS LEFT \u2014 PICK ANOTHER.', C.red);
    return;
  }
  sel = key;
  syncBar();
}

/* Pointer aiming: drag away from the tank, the shell takes the reverse line.
 * Angle and power both come out of the tank's local frame, so aiming works
 * the same from the floor, the walls and the ceiling. */
function canvasXY(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) * 960 / r.width, y: (e.clientY - r.top) * 580 / r.height };
}
canvas.addEventListener('pointerdown', e => {
  if (mode === 'OVER' && !bridge && overTime >= 40) { startLocal(false); return; }
  if (mode !== 'AIM' || !playable()) return;
  e.preventDefault();
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { }
  drag = { id: e.pointerId, moved: false };
});
canvas.addEventListener('pointermove', e => {
  if (!drag || drag.id !== e.pointerId || !playable()) return;
  const seat = turnSeat(), tank = world.tanks[seat - 1];
  const at = canvasXY(e), c = bodyP(tank), p = engine.ringPoint(tank.s);
  const dx = at.x - c.x, dy = at.y - c.y;
  const len = Math.hypot(dx, dy);
  if (len < 16) return;
  drag.moved = true;
  const un = (dx * p.nx + dy * p.ny) / len;             // inward component
  const ut = (dx * p.tx + dy * p.ty) / len * (tank.dir || 1);
  let a = Math.atan2(ut, Math.max(un, .08)) * 180 / Math.PI;
  if (a < 0) a = -a;                                     // pulled backwards: mirror it
  aimVars[seat].angle = clampN(Math.round(a), 5, 85);
  aimVars[seat].power = Math.round(clampN(len / 26, 1, 24) * 10) / 10;
});
function endDrag(e) {
  if (!drag || (e && drag.id !== e.pointerId)) return;
  const wasMoved = drag.moved;
  drag = null;
  if (!wasMoved) return;
  if (!playable()) return;
  const shot = draftShot();
  if (shot) fire(shot);
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

/* ── AI: one seat of the brain, same rules as the players ───────────────── */

function estDamage(x, y, c, weapon) {
  const r = (engine.RANGE[weapon] || engine.RANGE.standard) + 14;
  const pair = engine.DAMAGE[weapon] || engine.DAMAGE.standard;
  const d = Math.hypot(c.x - x, c.y - y);
  if (d >= r) return 0;
  return Math.round(pair[0] + (1 - d / r) * (pair[1] - pair[0]));
}

/* Would a carve here swallow the whole footprint of the tank on this wall? */
function dumpAlign(worldW, x, y, weapon, seat) {
  const tank = worldW.tanks[seat - 1];
  if (!tank || tank.falling) return 0;
  const p = engine.ringPoint(tank.s);
  let d, centre;
  if (p.wall === 0) { d = Math.hypot(clampN(x, X0e(), X1e()) - x, y - Y0e()); centre = clampN(x, X0e(), X1e()) - X0e(); }
  else if (p.wall === 1) { d = Math.hypot(x - X1e(), clampN(y, Y0e(), Y1e()) - y); centre = clampN(y, Y0e(), Y1e()) - Y0e(); }
  else if (p.wall === 2) { d = Math.hypot(clampN(x, X0e(), X1e()) - x, y - Y1e()); centre = X1e() - clampN(x, X0e(), X1e()); }
  else { d = Math.hypot(x - X0e(), clampN(y, Y0e(), Y1e()) - y); centre = Y1e() - clampN(y, Y0e(), Y1e()); }
  const r = engine.CARVE[weapon] || engine.CARVE.standard;
  if (d > r - 6) return 0;
  const half = Math.sqrt(Math.max(0, r * r - d * d));
  return (Math.abs(centre - p.along) + 14 <= half + 2) ? 1 : 0;
}

function aiScoreShot(view, seat, angle, power, weapon) {
  const g = engine.guide(view, seat, angle, power, weapon);
  const cMe = bodyP(view.tanks[seat - 1]), cFoe = bodyP(view.tanks[2 - seat]);
  const h = g.hit, kind = typeof h === 'string' ? h : h.kind;
  if (kind === 'out' || kind === 'stall') return { score: -9, hit: kind };
  const x = h.x, y = h.y;
  if (kind === 'plant') {
    return {
      score: 42 - Math.hypot(x - cFoe.x, y - cFoe.y) * .3 - Math.hypot(x - cMe.x, y - cMe.y) * .95,
      hit: kind
    };
  }
  let s = estDamage(x, y, cFoe, weapon) - estDamage(x, y, cMe, weapon) * 1.25;
  if (kind === 'tank' && h.seat === 2 - seat) s += 10;
  if (kind === 'wall' || kind === 'tank') {
    if (dumpAlign(view, x, y, weapon, 2 - seat)) s += 22;
    if (dumpAlign(view, x, y, weapon, seat)) s -= 32;
  }
  return { score: s, hit: kind, x, y };
}

/* A view world with one tank moved: lets the AI plan shots from where a drive
 * would put it, without touching the real world. */
function movedView(worldW, seat, drive, angle) {
  const me = worldW.tanks[seat - 1];
  const moved = { ...me, s: engine.wrapS(me.s + drive), dir: drive > 0 ? 1 : -1, angle, falling: null };
  return {
    ...worldW,
    tanks: seat === 1 ? [moved, { ...worldW.tanks[1] }] : [{ ...worldW.tanks[0] }, moved]
  };
}
function supportAt(worldW, s) {
  return engine.supported(worldW, { s: engine.wrapS(s), falling: null, hp: 1 });
}

function aiPick() {
  const seat = 2, worldW = engine.replay(state);
  const me = worldW.tanks[seat - 1];
  const cands = [];
  // Static shots from the present spot.
  for (const weapon of WEAPONS) {
    if (weapon !== 'standard' && !(me.ammo[weapon] > 0)) continue;
    let lethal = false;
    for (let a = 5; a <= 85 && !lethal; a += 3) for (let p = 5; p <= 23 && !lethal; p += 3) {
      const probe = aiScoreShot(worldW, seat, a, p, weapon);
      cands.push({ drive: 0, angle: a, power: p, weapon, score: probe.score });
      if (probe.score >= 60) lethal = true;   // a kill is a kill; stop the scan
    }
  }
  // Nothing tempting from here? Spend the turn's legs to reposition first.
  let best = cands.sort((a2, b2) => b2.score - a2.score)[0];
  if (!best || best.score < 12) {
    for (const drive of [-380, -220, -110, 110, 220, 380]) {
      const cost = engine.driveCost(me.s, drive);
      if (cost > engine.FUEL * .8 || !supportAt(worldW, me.s + drive)) continue;
      const view = movedView(worldW, seat, drive, 45);
      let hopBest = null;
      for (const weapon of WEAPONS) {
        if (weapon !== 'standard' && !(me.ammo[weapon] > 0)) continue;
        for (let a = 14; a <= 85; a += 8) for (let p = 8; p <= 23; p += 4) {
          const probe = aiScoreShot(view, seat, a, p, weapon);
          if (!hopBest || probe.score > hopBest.score) hopBest = { drive, angle: a, power: p, weapon, score: probe.score };
        }
      }
      if (hopBest) cands.push(hopBest);
    }
    cands.sort((a2, b2) => b2.score - a2.score);
    best = cands[0];
  }
  if (!best) return { seat, drive: 0, angle: 45, power: 12, weapon: 'standard' };
  // Refine around the winner: finer angle/power steps on the same plan.
  let fine = best;
  if (best.score < 60) {
    const view = best.drive ? movedView(worldW, seat, best.drive, best.angle) : worldW;
    for (let a = Math.max(5, best.angle - 4); a <= Math.min(85, best.angle + 4); a++) {
      for (let p = Math.max(1, best.power - 2); p <= Math.min(24, best.power + 2); p += .5) {
        const probe = aiScoreShot(view, seat, a, Math.round(p * 10) / 10, best.weapon);
        if (probe.score > fine.score) fine = { drive: best.drive, angle: a, power: Math.round(p * 10) / 10, weapon: best.weapon, score: probe.score };
      }
    }
  }
  const angle = clampN(Math.round(fine.angle + (Math.random() - .5) * 2.6), 5, 85);
  const power = clampN(Math.round((fine.power + (Math.random() - .5) * 1.2) * 10) / 10, 1, 24);
  const plan = { seat, drive: fine.drive, angle, power, weapon: fine.weapon };
  if (engine.validateShot(worldW, plan, seat)) return { seat, drive: 0, angle: 45, power: 12, weapon: 'standard' };
  return plan;
}

function runAI() {
  aiTimer++;
  if (aiTimer === 8) {
    try { aiChosen = aiPick(); } catch (err) { aiChosen = null; }
    if (!aiChosen) aiChosen = { seat: 2, drive: 0, angle: 45, power: 12, weapon: 'standard' };
  }
  if (aiChosen && aiTimer > 8 && aiTimer < 46) {
    const aim = aimVars[2];
    aim.angle += (aiChosen.angle - aim.angle) * .12;
    aim.power += (aiChosen.power - aim.power) * .12;
  }
  if (aiChosen && aiTimer >= 48) {
    const chosen = aiChosen;
    aiChosen = null; aiTimer = 0;
    aimVars[2] = { angle: chosen.angle, power: chosen.power };
    liveDir[2] = chosen.drive > 0 ? 1 : chosen.drive < 0 ? -1 : liveDir[2];
    fire(chosen);
  }
}

/* ── Per-frame update ───────────────────────────────────────────────────── */

function update() {
  shake *= .86; if (shake < .25) shake = 0;
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += .06; p.life -= p.dec;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = popups.length - 1; i >= 0; i--) {
    const p = popups[i];
    p.y -= .55; p.life -= .013;
    if (p.life <= 0) popups.splice(i, 1);
  }
  if (anim) { anim.frame++; return; }
  if (mode === 'AIM' && playable()) {
    const seat = turnSeat(), tank = world.tanks[seat - 1];
    const driveKeys = seat === 1 ? ['KeyA', 'KeyD'] : ['ArrowLeft', 'ArrowRight'];
    const aimKeys = seat === 1 ? ['KeyW', 'KeyS'] : ['ArrowUp', 'ArrowDown'];
    let step = 0;
    if (keys.has(driveKeys[0])) step -= 2;
    if (keys.has(driveKeys[1])) step += 2;
    if (step) {
      if (engine.driveCost(tank.s, walkPx + step) <= engine.FUEL) {
        walkPx += step;
        liveDir[seat] = step > 0 ? 1 : -1;
        const p = engine.ringPoint(engine.wrapS(tank.s + walkPx));
        if (Math.random() < .35) sparksAt(p.x, p.y, 1, C.hair);
      }
    }
    let aimStep = 0;
    if (keys.has(aimKeys[0])) aimStep += 1;
    if (keys.has(aimKeys[1])) aimStep -= 1;
    if (aimStep) aimVars[seat].angle = clampN(aimVars[seat].angle + aimStep, 5, 85);
    if (charging()) charge = Math.min(engine.MAXPW, charge + .16);
  }
  if (mode === 'CPU' && !world.winner) runAI();
  if (mode === 'OVER' && !bridge) {
    overTime++;
    if (aiEnabled && overTime > 190) startLocal(false);
    if (overTime === 60 || overTime === 190) syncStatus();
  }
}

/* ── Render ─────────────────────────────────────────────────────────────── */

function drawBoard(panels) {
  const bx = engine.BX, by = engine.BY, bw = engine.BW, bh = engine.BH, t = engine.T;
  ctx.fillStyle = C.board;
  ctx.fillRect(bx, by, bw, bh);
  // four corner blocks: the only ground that never crumbles
  ctx.fillStyle = C.ink;
  ctx.fillRect(bx, by, t, t);
  ctx.fillRect(bx + bw - t, by, t, t);
  ctx.fillRect(bx, by + bh - t, t, t);
  ctx.fillRect(bx + bw - t, by + bh - t, t, t);
  for (let wall = 0; wall < 4; wall++) {
    const count = engine.COUNTS[wall];
    for (let j = 0; j < count; j++) {
      const r = panelRect(wall, j);
      if (panels[wall][j]) {
        ctx.fillStyle = C.ink;
        ctx.fillRect(r.x, r.y, r.w, r.h);
      } else {
        ctx.strokeStyle = C.hair;
        ctx.setLineDash([4, 4]);
        ctx.strokeRect(r.x + 2.5, r.y + 2.5, Math.max(1, r.w - 5), Math.max(1, r.h - 5));
        ctx.setLineDash([]);
      }
    }
  }
  ctx.strokeStyle = C.hair;
  ctx.strokeRect(bx + .5, by + .5, bw - 1, bh - 1);
}

function drawTank(tank, seat, isTurn) {
  const p = engine.ringPoint(tank.s);
  const rot = [0, Math.PI / 2, Math.PI, -Math.PI / 2][p.wall];
  const colour = colourFor(seat);
  const angle = (isTurn ? aimVars[seat].angle : tank.angle) * Math.PI / 180;
  const dir = (isTurn ? liveDir[seat] : (tank.dir || 1));
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(rot);
  // treads along the surface, hull and dome hanging into the box
  ctx.fillStyle = C.ink;
  ctx.fillRect(-14, 0, 28, 7);
  for (let i = 0; i < 5; i++) ctx.fillStyle = C.hair, ctx.fillRect(-12 + i * 5.4, 2.2, 3, 2.4);
  ctx.fillStyle = colour;
  ctx.fillRect(-11, 7, 22, 9);
  ctx.fillRect(-6.5, 12, 13, 8);
  ctx.strokeStyle = C.ink;
  ctx.lineWidth = 2.6;
  ctx.strokeRect(-10.5, 7.5, 21, 8);
  ctx.lineCap = 'round';
  ctx.lineWidth = 3.4;
  ctx.beginPath();
  ctx.moveTo(0, 16);
  ctx.lineTo(Math.sin(angle) * dir * 19, 16 + Math.cos(angle) * 19);
  ctx.stroke();
  ctx.restore();
  if (tank.shield) {
    ctx.strokeStyle = C.accent;
    ctx.globalAlpha = .5; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(bodyP(tank).x, bodyP(tank).y, 21, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

function drawPowerups(list) {
  for (const pu of list) {
    const meta = engine.POWERUPS.find(m => m.key === pu.key) || { sym: '?' };
    ctx.fillStyle = C.board;
    roundRect(pu.x - 9, pu.y - 9, 18, 18, 3); ctx.fill();
    ctx.strokeStyle = C.ink; ctx.lineWidth = 1;
    ctx.strokeRect(pu.x - 8.5, pu.y - 8.5, 17, 17);
    label(meta.sym, pu.x, pu.y + 4, 11, C.ink);
  }
}

function drawMines(list) {
  for (const m of list) {
    ctx.fillStyle = C.red;
    ctx.fillRect(m.x - 6, m.y - 3, 12, 5);
    ctx.strokeStyle = C.ink; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(m.x, m.y - 3); ctx.lineTo(m.x, m.y - 7); ctx.stroke();
    label(String(Math.max(0, m.fuse)), m.x, m.y - 9, 9, C.red);
  }
}

function drawTrailSet(trails, opts) {
  // opts: { history }  — history trails are faint; the live anim one is crisp
  const solid = !opts || !opts.history;
  for (const trail of trails) {
    const child = trail.child === true;
    for (let i = 1; i < trail.length; i += 5) {
      const fade = i / trail.length;
      ctx.globalAlpha = solid ? .12 + fade * .5 : .07 + fade * .05;
      ctx.fillStyle = solid ? (child ? C.hair : C.ink) : C.ink;
      ctx.fillRect(trail[i].x - 1.4, trail[i].y - 1.4, 2.8, 2.8);
    }
}
  ctx.globalAlpha = 1;
}

function drawGhost() {
  viewCache.count++;
  if (viewCache.key !== ghostKey()) {
    const seat = turnSeat(), tank = world.tanks[seat - 1], aim = aimVars[seat];
    const me = { ...tank, s: engine.wrapS(tank.s + walkPx), angle: aim.angle, dir: liveDir[seat] };
    const view = { ...world, tanks: seat === 1 ? [me, world.tanks[1]] : [world.tanks[0], me] };
    let g = null;
    try { g = engine.guide(view, seat, aim.angle, charging() ? charge : aim.power, sel); } catch (err) { g = null; }
    viewCache.ghost = g;
    viewCache.key = ghostKey();
  }
  const g = viewCache.ghost;
  if (!g || !g.trail) return;
  for (let i = 4; i < g.trail.length; i += 6) {
    ctx.globalAlpha = Math.max(.05, .4 - i / g.trail.length * .32);
    ctx.fillStyle = C.dim;
    ctx.fillRect(g.trail[i].x - 1.4, g.trail[i].y - 1.4, 2.8, 2.8);
  }
  ctx.globalAlpha = 1;
}
const viewCache = { key: null, ghost: null, count: 0 };
function ghostKey() {
  const seat = turnSeat(), aim = aimVars[seat], tank = world.tanks[seat - 1];
  return [engine.wrapS(tank.s), walkPx, aim.angle, charging() ? charge : aim.power, sel, countHoles(world), world.shotCount].join('|');
}

function drawAnim() {
  const pts = Math.max(0, anim.frame * anim.speed);
  // pre-shot world on the walls and bodies: the outcome lands at commit
  drawBoard(anim.pre.panels);
  drawTrailSet(world.trails.slice(0, world.trails.length - anim.items.length), { history: true });
  drawPowerups(anim.pre.powerups);
  drawMines(anim.pre.mines);
  for (let i = 0; i < anim.items.length; i++) {
    const item = anim.items[i], shown = clampN(Math.floor(pts - item.start), 0, item.len);
    const trail = item.trail;
    if (shown < 2) continue;
    for (let k = 0; k < shown; k++) {
      const fade = k / trail.length;
      ctx.globalAlpha = .15 + fade * .75;
      ctx.fillStyle = trail.child ? C.hair : C.ink;
      ctx.fillRect(trail[k].x - 1.6, trail[k].y - 1.6, 3.2, 3.2);
    }
    const head = trail[Math.max(0, shown - 1)];
    ctx.globalAlpha = 1;
    ctx.fillStyle = trail.child ? C.ink : C.ink;
    ctx.beginPath(); ctx.arc(head.x, head.y, trail.child ? 2.6 : 3.4, 0, Math.PI * 2); ctx.fill();
  }
  for (const b of anim.bursts) {
    if (pts < b.when) continue;
    if (!b.born) { b.born = true; sparksAt(b.x, b.y, 13, C.red); shake = Math.max(shake, 7); }
    const age = clampN((pts - b.when) / 26, 0, 1);
    ctx.globalAlpha = 1 - age * .8;
    ctx.strokeStyle = C.red; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(b.x, b.y, 4 + b.r * .8 * age, 0, Math.PI * 2); ctx.stroke();
    if (age < .3) {
      ctx.fillStyle = C.red;
      ctx.beginPath(); ctx.arc(b.x, b.y, 5 * (1 - age), 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  for (const t of anim.pre.tanks) drawTank(t, anim.pre.tanks.indexOf(t) + 1, false);
}

function drawWind() {
  const index = state ? state.shots.length : 0;
  const wind = engine.windOf(state.seed, index);
  const poleX = 656, top = 12, floor = 38;
  ctx.strokeStyle = C.dim; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(poleX, floor); ctx.lineTo(poleX, top); ctx.stroke();
  const lean = clampN(wind * 1500, -17, 17);
  const flutter = Math.sin(Date.now() * .011) * Math.abs(wind) * 500;
  ctx.fillStyle = wind >= 0 ? C.accent : C.red;
  const tip = poleX + lean + clampN(flutter, -5, 5);
  ctx.beginPath();
  ctx.moveTo(poleX, top + 2);
  ctx.lineTo(tip, top + 8);
  ctx.lineTo(poleX, top + 14);
  ctx.closePath(); ctx.fill();
  label('wind ' + Math.abs(Math.round(wind * 1000)), poleX - 8, floor - 4, 10, C.dim, 'right');
}

function drawHUD() {
  const t1 = world.tanks[0], t2 = world.tanks[1];
  const wind = 152, fuelW = 118;
  label(nameFor(1), 16, 17, 13, colourFor(1), 'left', 600);
  ctx.fillStyle = C.board; ctx.fillRect(16, 22, wind, 9);
  ctx.strokeStyle = C.hair; ctx.lineWidth = 1; ctx.strokeRect(16.5, 22.5, wind - 1, 8);
  if (t1.hp > 0) { ctx.fillStyle = colourFor(1); ctx.fillRect(18, 24, Math.max(2, (wind - 4) * clampN(t1.hp / engine.MAXHP, 0, 1)), 5); }
  ctx.fillStyle = C.board; ctx.fillRect(16, 34, fuelW, 5);
  ctx.strokeStyle = C.hair; ctx.strokeRect(16.5, 34.5, fuelW - 1, 4);
  drawFuelBar(1, 18, 35.5, fuelW - 4);
  label(nameFor(2), 944, 17, 13, colourFor(2), 'right', 600);
  ctx.fillStyle = C.board; ctx.fillRect(944 - wind, 22, wind, 9);
  ctx.strokeStyle = C.hair; ctx.strokeRect(944 - wind + .5, 22.5, wind - 1, 8);
  if (t2.hp > 0) { ctx.fillStyle = colourFor(2); ctx.fillRect(944 - wind + 2, 24, Math.max(2, (wind - 4) * clampN(t2.hp / engine.MAXHP, 0, 1)), 5); }
  ctx.fillStyle = C.board; ctx.fillRect(944 - fuelW, 34, fuelW, 5);
  ctx.strokeStyle = C.hair; ctx.strokeRect(944 - fuelW + .5, 34.5, fuelW - 1, 4);
  drawFuelBar(2, 944 - fuelW + 2, 35.5, fuelW - 4);
  // centre strip: turn, charge or idle
  let centreText = '';
  let centreColour = C.dim;
  if (mode === 'CPU') centreText = nameFor(2) + ' TAKES AIM \u2026';
  else if (mode === 'WAIT') centreText = nameFor(online ? (3 - online.seat) : 2) + ' TO FIRE \u2026';
  else if (mode === 'ANIM') centreText = 'SHELL AWAY \u2026';
  else if (mode === 'OVER') centreText = (winner ? nameFor(winner) : '') + ' WINS' + (winner === 3 ? ' THE STALEMATE' : '');
  else if (mode === 'AIM') centreText = nameFor(turnSeat()) + ' TO FIRE';
  if (mode === 'OVER' && !bridge && aiEnabled) centreText += ' \u00b7 LAVENDER ' + sessionWins;
  if (charging()) centreText = 'POWER ' + charge.toFixed(1);
  label(centreText, 480, 20, 12, centreColour, 'center', 600);
  drawWind();
}
function drawFuelBar(seat, x, y, w) {
  let used = 1 - world.tanks[seat - 1].fuel / engine.FUEL;
  if (state && state.turn === seat && !world.winner) used = engine.driveCost(world.tanks[seat - 1].s, walkPx) / engine.FUEL;
  ctx.fillStyle = C.dim;
  ctx.fillRect(x, y, Math.max(0, Math.min(1, 1 - used)) * w, 2);
}

function drawOverlay() {
  ctx.fillStyle = 'rgba(245,242,234,.85)';
  ctx.fillRect(0, 0, 960, 580);
  const wname = winner === 3 ? 'NOBODY' : nameFor(winner);
  label(wname + ' WINS', 480, 244, 34, winner ? colourFor(winner) : C.ink, 'center', 600);
  if (!bridge) {
    label(aiEnabled ? 'LAVENDER ' + sessionWins + ' \u2014 ' + nameFor(2) : 'SAME BOX, NEW ROUND', 480, 278, 13, C.dim);
    if (!aiEnabled) label('TAP OR PRESS SPACE TO CONTINUE', 480, 320, 12, C.dim);
    if (aiEnabled && overTime < 190) label('NEXT ROUND SHORTLY \u2026', 480, 320, 12, C.dim);
  } else {
    label('THE MATCH ON THE RECORD HAS ENDED.', 480, 278, 13, C.dim);
  }
}


function drawTitle() {
  label('PASTEL TANKS', 480, 92, 38, C.ink, 'center', 600);
  label('AN ARTILLERY DUEL INSIDE A DRIVABLE BOX. BLAST THE SIDES OUT', 480, 122, 12, C.dim);
  label('AND DROP YOUR RIVAL THROUGH THE FLOOR.', 480, 138, 12, C.dim);
  // vignette: small box, one hole in the ceiling, tanks in odd places
  const bx = 300, by = 190, bw = 360, bh = 200, t = 20;
  ctx.fillStyle = C.board; ctx.fillRect(bx, by, bw, bh);
  ctx.fillStyle = C.ink;
  const pw = (bw - 2 * t) / 6, ph = (bh - 2 * t) / 4;
  for (let j = 0; j < 6; j++) {
    if (j !== 2) { ctx.fillRect(bx + t + j * pw, by, pw - 2, t); ctx.fillRect(bx + t + j * pw, by + bh - t, pw - 2, t); }
  }
  for (let k = 0; k < 4; k++) {
    if (k !== 1) { ctx.fillRect(bx, by + t + k * ph, t, ph - 2); ctx.fillRect(bx + bw - t, by + t + k * ph, t, ph - 2); }
  }
  ctx.strokeStyle = C.hair;
  ctx.strokeRect(bx + .5, by + .5, bw - 1, bh - 1);
  drawMiniTank(bx + 60, by + bh - t - 2, C.seat2, 1);
  drawMiniTank(bx + bw - 70, by + t + 1, C.seat1, -1);
  // dashed outline marks where the ceiling panel is already gone
  ctx.strokeStyle = C.hair;
  ctx.setLineDash([3, 3]);
  ctx.strokeRect(bx + t + 2 * pw + 1.5, by + 2.5, pw - 5, t - 5);
  ctx.setLineDash([]);
  // shell arcing from the floor machine through the gap to the far wall
  ctx.strokeStyle = C.hair;
  ctx.setLineDash([2, 5]);
  ctx.beginPath();
  ctx.moveTo(bx + 74, by + bh - t - 16);
  ctx.quadraticCurveTo(bx + 130, by + 58, bx + 248, by + 70);
  ctx.stroke();
  ctx.setLineDash([]);
  drawMenuButton(480 - 240, 430, 210, 46, 'VERSUS AI', C.accent, () => { aiEnabled = true; startLocal(true); });
  drawMenuButton(480 + 30, 430, 210, 46, 'TWO PLAYERS', C.red, () => { aiEnabled = false; startLocal(true); });
  label('P1: A/D DRIVE \u00b7 W/S AIM \u00b7 HOLD SPACE \u00b7 P2: \u2190\u2192 DRIVE \u00b7 \u2191\u2193 AIM \u00b7 HOLD ENTER', 480, 522, 11, C.dim);
  label('DRAG ANYWHERE TO SLING A SHELL \u00b7 1-5 PICK SHELLS \u00b7 MINES AND HEAVY SHELLS CARVE THE BOX', 480, 540, 11, C.dim);
}
function drawMiniTank(x, y, colour, facing) {
  ctx.save();
  ctx.translate(x, y);
  if (facing < 0) ctx.rotate(Math.PI);
  ctx.fillStyle = colour;
  ctx.fillRect(-13, -8, 26, 6);
  ctx.fillRect(-9, -13, 18, 5);
  ctx.strokeStyle = C.ink; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, -10); ctx.lineTo(13, -10); ctx.stroke();
  ctx.restore();
}
/* The vignette's left tank sits on the floor, the green one hangs from the
 * ceiling panel that survives the hole. */
const menuButtons = [];
function drawMenuButton(x, y, w, h, text, colour, action) {
  menuButtons.length = 0;
  ctx.fillStyle = colour;
  roundRect(x, y, w, h, 4); ctx.fill();
  label(text, x + w / 2, y + h / 2 + 5, 14, C.paper, 'center', 600);
  menuButtons.push({ x, y, w, h, action });
}

function popupsAndParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.colour;
    ctx.fillRect(p.x - 1.8, p.y - 1.8, 3.6, 3.6);
  }
  ctx.globalAlpha = 1;
  for (const p of popups) {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.4));
    label(p.text, clampN(p.x, 40, 920), clampN(p.y, 60, 550), 12, p.colour, 'center', 600);
  }
  ctx.globalAlpha = 1;
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = C.paper;
  ctx.fillRect(0, 0, 960, 580);
  if (shake) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
  if (mode === 'TITLE') { drawTitle(); return; }
  if (anim) {
    drawAnim();
    drawHUD();
    popupsAndParticles();
    return;
  }
  drawBoard(world.panels);
  drawTrailSet(world.trails, { history: true });
  drawPowerups(world.powerups);
  drawMines(world.mines);
  world.tanks.forEach((t, i) => drawTank(t, i + 1, state.turn === i + 1 && !world.winner));
  if (mode === 'AIM' && playable()) drawGhost();
  drawHUD();
  popupsAndParticles();
  if (mode === 'OVER') drawOverlay();
}

/* ── Weapon bar and boot ────────────────────────────────────────────────── */

const barButtons = new Map();
function buildBar() {
  for (const key of WEAPONS) {
    const b = document.createElement('button');
    b.type = 'button';
    b.addEventListener('click', () => selectWeapon(key));
    barEl.append(b);
    barButtons.set(key, b);
  }
  const fire = document.createElement('button');
  fire.type = 'button';
  fire.className = 'fire';
  fire.textContent = 'FIRE';
  fire.addEventListener('pointerdown', e => { e.preventDefault(); beginCharge(); });
  fire.addEventListener('pointerup', e => { e.preventDefault(); releaseCharge(); });
  fire.addEventListener('pointerleave', () => { if (charging()) charge = null; });
  barEl.append(fire);
}
function syncBar() {
  const show = (mode === 'AIM' || mode === 'CPU' || mode === 'WAIT') && state && !world.winner;
  barEl.style.display = show ? 'flex' : 'none';
  if (!show) return;
  const seat = mode === 'WAIT' ? (3 - (online ? online.seat : 2)) : turnSeat();
  for (const [key, b] of barButtons) {
    const isStd = key === 'standard';
    const ammo = isStd ? '\u221e' : '\u00d7' + (world.tanks[seat - 1].ammo[key] || 0);
    b.textContent = WEAPON_TAGS[key] + ' ' + ammo;
    b.classList.toggle('sel', key === sel);
    b.disabled = !isStd && !(world.tanks[seat - 1].ammo[key] > 0);
  }
}

/* Snapshot contract: metrics integers for the daily adapter. */
window.__boredSnapshot = () => ({
  slug: 'tank2',
  won: Math.max(0, Math.round(sessionWins)),
  cpu: aiEnabled === true,
  started: mode !== 'TITLE' && !!state
});

/* Small surface for the test probe pages. */
window.__test = {
  mode: () => mode,
  // A merged view for the Together board and the browser suite: the engine
  // state plus what the interface is doing right now.
  state: () => (state ? { mode, turn: state.turn, power: aimVars[state.turn] && state.turn ? aimVars[state.turn].power : null,
    online: !!bridge, seed: state ? state.seed : null, shots: state ? state.shots.length : 0,
    hp: world ? world.tanks.map(t => t.hp) : [] } : null),
  world: () => world,
  seed: () => (state ? state.seed : null),
  hp: () => (world ? world.tanks.map(t => Math.round(t.hp)) : null),
  holes: () => (world ? countHoles(world) : null),
  turn: () => (state ? state.turn : null),
  wind: () => (state ? engine.windOf(state.seed, state.shots.length) : null),
  start(ai) { aiEnabled = !!ai; startLocal(true); },
  aim(angle, power) {
    const a = aimVars[turnSeat()];
    if (a) { a.angle = angle; a.power = power; }
  },
  drive(px) { walkPx = px; },
  fireNow() { const shot = draftShot(); if (shot) fire(shot); },
  fireShot(shot) {
    fire({
      seat: shot.seat || state.turn, drive: shot.drive | 0, angle: shot.angle || 45,
      power: shot.power || 12, weapon: shot.weapon || 'standard'
    });
  },
  // A direct hit on the other tank, found through the engine's own guide.
  bestShot(seatIn) {
    if (!state || world.winner) return null;
    const s = seatIn || state.turn;
    for (const weapon of WEAPONS) {
      if (weapon !== 'standard' && !(world.tanks[s - 1].ammo[weapon] > 0)) continue;
      for (let a = 5; a <= 85; a++) for (let p = 1; p <= 24; p++) {
        const g = engine.guide(world, s, a, p, weapon);
        if (g.hit && g.hit.kind === 'tank' && g.hit.seat !== s) return { seat: s, drive: 0, angle: a, power: p, weapon };
      }
    }
    return null;
  },
  skip() { if (anim) { anim.frame = Math.ceil(anim.total / anim.speed) + 4; setTimeout(commitShot, 0); } },
  settle() { return new Promise(res => { const check = () => (anim ? setTimeout(check, 40) : res()); check(); }); },
  tick(n) { for (let i = 0; i < (n || 1); i++) update(); }
};

function fit() {
  const s = Math.min((innerWidth - 20) / 960, (innerHeight - 92) / 580, 1);
  canvas.style.width = Math.round(960 * Math.max(.3, s)) + 'px';
  canvas.style.height = Math.round(580 * Math.max(.3, s)) + 'px';
}
addEventListener('resize', fit);

function loop() {
  update();
  try { render(); } catch (e) { /* a bad frame must not stop the loop */ }
  requestAnimationFrame(loop);
}

canvas.addEventListener('click', e => {
  if (mode !== 'TITLE' && mode !== 'OVER') return;
  const at = canvasXY(e);
  for (const mb of menuButtons) {
    if (at.x >= mb.x && at.x <= mb.x + mb.w && at.y >= mb.y && at.y <= mb.y + mb.h) { mb.action(); return; }
  }
});

fit();
buildBar();

(async function boot() {
  // The doc usually runs in a srcdoc iframe, where location is about:srcdoc and
  // a relative import cannot resolve: take the URL from the hub instead, and
  // only fall back to the document's own path when run standalone.
  let url = bridge && bridge.engineURL;
  if (!url) {
    try { url = new URL('../tank-engine.js', location.href).href; }
    catch { url = new URL('./games/tank-engine.js', parent.location.href).href; }
  }
  try { engine = await import(url); }
  catch (error) {
    ctx.fillStyle = C.paper; ctx.fillRect(0, 0, 960, 580);
    label('THE RULES FILE DID NOT LOAD.', 480, 260, 15, C.red, 'center', 600);
    label(String(error.message || error).slice(0, 90), 480, 288, 12, C.dim);
    return;
  }
  if (bridge) startOnline();
  requestAnimationFrame(loop);
})();

</script>
</body>
