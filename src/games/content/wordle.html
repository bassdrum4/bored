<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wordle</title>
<style>
  :root {
    --bg: #121213;
    --surface: #1a1a1b;
    --border: #3a3a3c;
    --text: #f0ece4;
    --muted: #565758;
    --correct: #538d4e;
    --present: #b59f3b;
    --absent: #3a3a3c;
    --key-bg: #818384;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    user-select: none;
  }

  header {
    padding: 16px 0 8px;
    text-align: center;
    width: 100%;
    border-bottom: 1px solid var(--border);
  }

  header h1 {
    font-family: 'Syne', sans-serif;
    font-size: 2rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  #message {
    height: 28px;
    font-size: 0.85rem;
    margin-top: 12px;
    font-weight: 500;
    transition: opacity 0.3s;
  }

  .board {
    display: grid;
    grid-template-rows: repeat(6, 1fr);
    gap: 5px;
    padding: 20px 0;
    flex-grow: 1;
    align-content: center;
  }

  .row {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 5px;
  }

  .tile {
    width: 58px;
    height: 58px;
    border: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Syne', sans-serif;
    font-size: 2rem;
    font-weight: 700;
    text-transform: uppercase;
    transition: transform 0.15s, background 0.3s, border-color 0.3s;
  }

  .tile.filled { border-color: var(--muted); animation: pop 0.1s ease; }
  .tile.reveal { animation: flipIn 0.3s ease forwards; }
  .tile.correct { background: var(--correct); border-color: var(--correct); }
  .tile.present { background: var(--present); border-color: var(--present); }
  .tile.absent  { background: var(--absent);  border-color: var(--absent);  }

  @keyframes pop { 50% { transform: scale(1.12); } }

  @keyframes flipIn {
    0%   { transform: rotateX(90deg); opacity: 0; }
    100% { transform: rotateX(0deg);   opacity: 1; }
  }

  .shake { animation: shake 0.4s ease; }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-6px); }
    40%, 80% { transform: translateX(6px); }
  }

  .bounce { animation: bounce 0.5s ease; }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50%  { transform: translateY(-12px); }
  }

  .keyboard {
    padding: 8px 4px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    width: 100%;
    max-width: 500px;
  }

  .kb-row { display: flex; gap: 5px; justify-content: center; }

  .key {
    background: var(--key-bg);
    border: none;
    border-radius: 4px;
    color: var(--text);
    font-family: 'Syne', sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    padding: 12px 10px;
    min-width: 36px;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }

  .key:active { transform: scale(0.92); }
  .key.wide { min-width: 60px; font-size: 0.75rem; }
  .key.correct { background: var(--correct); }
  .key.present { background: var(--present); }
  .key.absent  { background: var(--absent); }

  #game-container { display: flex; flex-direction: column; align-items: center; width: 100%; flex: 1; }

  @media (max-width: 400px) {
    .tile { width: 48px; height: 48px; font-size: 1.6rem; }
    .key { min-width: 28px; padding: 10px 7px; font-size: 0.75rem; }
  }
</style>
</head>

const VALID = new Set(WORDS.map(w => w.toUpperCase()));

const answer = WORDS[Math.floor(Math.random() * WORDS.length)].toUpperCase();

let current = '';
let row = 0;
let gameOver = false;

const board = document.getElementById('board');
const kb = document.getElementById('keyboard');
const msg = document.getElementById('message');

const keyRows = [
  ['q','w','e','r','t','y','u','i','o','p'],
  ['a','s','d','f','g','h','j','k','l'],
  ['enter','z','x','c','v','b','n','m','backspace']
];

for (let i = 0; i < 6; i++) {
  const rowEl = document.createElement('div');
  rowEl.classList.add('row');
  for (let j = 0; j < 5; j++) {
    const tile = document.createElement('div');
    tile.classList.add('tile');
    tile.dataset.row = i;
    tile.dataset.col = j;
    rowEl.appendChild(tile);
  }
  board.appendChild(rowEl);
}

keyRows.forEach(r => {
  const rowEl = document.createElement('div');
  rowEl.classList.add('kb-row');
  r.forEach(k => {
    const btn = document.createElement('button');
    btn.classList.add('key');
    if (k === 'enter' || k === 'backspace') btn.classList.add('wide');
    btn.textContent = k === 'backspace' ? '⌫' : k;
    btn.dataset.key = k;
    btn.addEventListener('click', () => handleKey(k));
    rowEl.appendChild(btn);
  });
  kb.appendChild(rowEl);
});

function handleKey(key) {
  if (gameOver || row >= 6) return;
  if (key === 'backspace') { current = current.slice(0, -1); updateTiles(); return; }
  if (key === 'enter') { submitGuess(); return; }
  if (current.length < 5 && /^[a-z]$/i.test(key)) { current += key.toUpperCase(); updateTiles(); }
}

function updateTiles() {
  for (let i = 0; i < 5; i++) {
    const tile = getTile(row, i);
    tile.textContent = current[i] || '';
    tile.classList.toggle('filled', !!current[i]);
  }
}

function getTile(r, c) {
  return board.querySelector(`.tile[data-row="${r}"][data-col="${c}"]`);
}

function submitGuess() {
  if (current.length !== 5) { showMessage('Not enough letters'); shakeRow(); return; }
  if (!VALID.has(current)) { showMessage('Not in word list'); shakeRow(); return; }

  const answerArr = answer.split('');
  const guessArr = current.split('');
  const result = Array(5).fill('absent');
  const counts = {};
  answerArr.forEach(l => { counts[l] = (counts[l] || 0) + 1; });
  guessArr.forEach((l, i) => { if (l === answerArr[i]) { result[i] = 'correct'; counts[l]--; } });
  guessArr.forEach((l, i) => { if (result[i] === 'absent' && counts[l] > 0) { result[i] = 'present'; counts[l]--; } });

  for (let i = 0; i < 5; i++) {
    const tile = getTile(row, i);
    setTimeout(() => { tile.classList.add('reveal', result[i]); updateKey(guessArr[i], result[i]); }, i * 150);
  }

  setTimeout(() => {
    if (current === answer) { gameOver = true; showMessage(getWinMessage(), 5000); bounceRow(); }
    else if (row >= 5) { gameOver = true; showMessage(answer, 8000); }
    row++; current = '';
  }, 5 * 150 + 100);
}

function updateKey(letter, status) {
  const key = kb.querySelector(`.key[data-key="${letter.toLowerCase()}"]`);
  if (!key) return;
  const p = { correct: 3, present: 2, absent: 1 };
  const cur = key.classList.contains('correct') ? 'correct' : key.classList.contains('present') ? 'present' : 'absent';
  if (p[status] > (p[cur] || 0)) { key.classList.remove('correct','present','absent'); key.classList.add(status); }
}

function showMessage(text, duration = 1500) {
  msg.textContent = text; msg.style.opacity = 1;
  clearTimeout(showMessage._t);
  showMessage._t = setTimeout(() => { msg.style.opacity = 0; }, duration);
}

function shakeRow() { const r = board.children[row]; r.classList.add('shake'); setTimeout(() => r.classList.remove('shake'), 400); }
function bounceRow() { for (let i = 0; i < 5; i++) setTimeout(() => getTile(row, i).classList.add('bounce'), i * 100); }
function getWinMessage() { return ['Genius','Magnificent','Impressive','Splendid','Great','Phew'][row] || 'Nice'; }

document.addEventListener('keydown', e => {
  if (e.key === 'Enter') handleKey('enter');
  else if (e.key === 'Backspace') handleKey('backspace');
  else if (/^[a-zA-Z]$/.test(e.key)) handleKey(e.key.toLowerCase());
});
