var m={};
function k(i){return Object.keys(m)[i]||null}

setItem:function(x,v){m[x]=String(v)},removeItem:function(x){delete m[x]},
clear:function(){m={}},key:k};

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON BREAKOUT | PRO</title>
    <style>
        :root {
            --primary: #00f2ff;
            --secondary: #7000ff;
            --accent: #ff007a;
            --bg: #050508;
            --surface: rgba(255, 255, 255, 0.05);

        #container {
            position: relative;

            border-radius: 12px;
            overflow: hidden;
        }

        canvas {
            display: block;
            background: #000;
            cursor: none;
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;

        #overlay.hidden {

            visibility: hidden;
        }

        #overlay h1 {
            font-size: 64px;
            font-weight: 900;
            letter-spacing: -2px;
            background: linear-gradient(to bottom, #fff, #888);
            -webkit-background-clip: text;

        }

        #overlay h2 {
            font-size: 24px;

        }

        #overlay .stats {
            margin-bottom: 40px;
            text-align: center;
        }

        #overlay .stats p {
            font-size: 16px;
            color: #888;
            margin-bottom: 5px;
        }

        #overlay .stats span {
            font-size: 32px;

        #overlay .btn {

        #overlay .btn:hover {

        @keyframes pulse {

        #hud {
            position: absolute;

        .hud-item {

        .hud-label {

        .hud-value {

        #level-indicator {
            position: absolute;

            transform: translateX(-50%);

        #active-effects {

        .effect-pill {
            padding: 4px 12px;
            background: rgba(255, 255, 255, 0.1);

            border-radius: 20px;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .effect-pill.E { color: #40e0e0; border-color: #40e0e044; }
        .effect-pill.S { color: #e040e0; border-color: #e040e044; }
        .effect-pill.C { color: #e08040; border-color: #e0804044; }
        .effect-pill.L { color: #ff007a; border-color: #ff007a44; }

        #controls-hint {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 10px;
            color: #444;
            letter-spacing: 2px;
            text-transform: uppercase;

    </style>

<body>
    <div id="container">
        <div id="hud">
            <div class="hud-item">
                <span class="hud-label">Score</span>
                <span id="score-val" class="hud-value">0000</span>
            </div>
            <div id="level-indicator" class="hud-item">
                <span class="hud-label">Level</span>
                <span id="level-val" class="hud-value">01</span>
            </div>
            <div class="hud-item" style="align-items: flex-end;">
                <span class="hud-label">Balls</span>
                <span id="lives-val" class="hud-value">03</span>
            </div>
        </div>

        <div id="active-effects"></div>

        <canvas id="game" width="480" height="600"></canvas>

        <div id="overlay">
            <h2 id="overlay-sub">Welcome to</h2>
            <h1 id="overlay-title">BREAKOUT</h1>
            <div class="stats" id="overlay-stats">
                <p>HIGH SCORE</p>
                <span id="hi-score-val">0</span>
            </div>
            <div class="btn" onclick="handleStartClick()">START GAME</div>
        </div>

        <div id="controls-hint">Mouse or Arrows to Move • Click or Space to Launch</div>
    </div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const activeEffectsEl = document.getElementById('active-effects');
        
        const W = 480, H = 600;
        
        // Level definitions
        // 1-8: Normal colors
        // H: Hard (2 hits)
        // I: Indestructible
        // .: Empty
        const LEVELS = [
            [
                "..........",
                "1111111111",
                "2222222222",
                "3333333333",
                "4444444444",
                "5555555555",
                "6666666666"
            ],
            [
                "..H....H..",
                ".HHHHHHHH.",
                "HHHHHHHHHH",
                "HHHHHHHHHH",
                ".HHHHHHHH.",
                "..HHHHHH..",
                "...HHHH...",
                "....HH...."
            ],
            [
                "I.I.I.I.I.",
                "1111111111",
                "I.I.I.I.I.",
                "2222222222",
                "I.I.I.I.I.",
                "3333333333"
            ],
            [
                "H..H..H..H",
                ".44.44.44.",
                "H..H..H..H",
                ".55.55.55.",
                "H..H..H..H",
                ".66.66.66."
            ],
            [
                "IIIIIIIIII",
                "I........I",
                "I.HHHHHH.I",
                "I.H....H.I",
                "I.H.11.H.I",
                "I.H....H.I",
                "I.HHHHHH.I",
                "I........I",
                "IIIIIIIIII"
            ]
        ];

        const COLORS = {
            '1': '#ff007a', // Pink
            '2': '#ff5e00', // Orange
            '3': '#ffea00', // Yellow
            '4': '#00ff73', // Green
            '5': '#00f2ff', // Cyan
            '6': '#7000ff', // Purple
            'H': '#ffffff', // Hard (White-ish)
            'I': '#333333', // Indestructible
        };

        const PU_TYPES = [
            { letter: 'E', color: '#40e0e0', name: 'EXPAND' },
            { letter: 'S', color: '#e040e0', name: 'SLOW' },
            { letter: 'M', color: '#e0e040', name: 'MULTI' },
            { letter: 'L', color: '#ff007a', name: 'LIFE' },
            { letter: 'C', color: '#e08040', name: 'CATCH' },
        ];

        // Audio System
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, type, duration, vol = 0.1) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(freq / 2, audioCtx.currentTime + duration);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        const SFX = {
            paddle: () => playTone(440, 'square', 0.1),
            wall: () => playTone(220, 'sine', 0.1),
            brick: (freq = 660) => playTone(freq, 'square', 0.15),
            hardBrick: () => playTone(330, 'square', 0.2),
            powerup: () => {
                playTone(523, 'triangle', 0.3);
                setTimeout(() => playTone(659, 'triangle', 0.3), 100);
                setTimeout(() => playTone(783, 'triangle', 0.3), 200);
            },
            lose: () => playTone(110, 'sawtooth', 0.5),
            win: () => {
                [523, 659, 783, 1046].forEach((f, i) => {
                    setTimeout(() => playTone(f, 'square', 0.4), i * 150);
                });
            }
        };

        // Game State
        let paddle, balls, bricks, score, lives, currentLevel, state, running;
        let powerUps, particles, effects, stickyBalls, shake;
        let highScore = parseInt(localStorage.getItem('breakout_hi_pro') || '0');
        let keys = {};

        function init() {
            score = 0;
            lives = 3;
            currentLevel = 0;
            state = 'ready';
            effects = [];
            powerUps = [];
            particles = [];
            shake = 0;
            updateHUD();
            loadLevel(currentLevel);
            document.getElementById('hi-score-val').textContent = highScore;
        }

        function loadLevel(idx) {
            if (idx >= LEVELS.length) {
                winGame();
                return;
            }
            
            bricks = [];
            const layout = LEVELS[idx];
            const rows = layout.length;
            const cols = layout[0].length;
            
            const brickW = 42;
            const brickH = 16;
            const pad = 4;
            const offsetTop = 100;
            const offsetLeft = (W - (cols * (brickW + pad) - pad)) / 2;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const char = layout[r][c];
                    if (char === '.') continue;
                    
                    bricks.push({
                        x: offsetLeft + c * (brickW + pad),
                        y: offsetTop + r * (brickH + pad),
                        w: brickW,
                        h: brickH,
                        type: char,
                        color: COLORS[char],
                        hits: char === 'H' ? 2 : (char === 'I' ? Infinity : 1),
                        alive: true
                    });
                }
            }
            
            resetRound();
            updateHUD();
        }

        function resetRound() {
            paddle = {
                x: W / 2 - 45, y: H - 50, w: 90, h: 12, speed: 8,
                baseW: 90, catchActive: false
            };
            balls = [];
            stickyBalls = [{ offsetX: 0 }];
            powerUps = [];
            effects = [];
        }

        function createParticle(x, y, color) {
            return {
                x, y,
                dx: (Math.random() - 0.5) * 6,
                dy: (Math.random() - 0.5) * 6,
                life: 1,
                decay: 0.02 + Math.random() * 0.02,
                color,
                size: 2 + Math.random() * 4
            };
        }

        function launchBall() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            for (const sb of stickyBalls) {
                let angle = (Math.random() * 0.4 - 0.2) - Math.PI / 2;
                let spd = 4.5;
                balls.push({
                    x: paddle.x + paddle.w / 2 + sb.offsetX,
                    y: paddle.y - 8,
                    r: 5,
                    dx: Math.cos(angle) * spd,
                    dy: Math.sin(angle) * spd,
                    trail: []
                });
            }
            stickyBalls = [];
            SFX.paddle();
        }

        function updateHUD() {
            document.getElementById('score-val').textContent = String(score).padStart(4, '0');
            document.getElementById('level-val').textContent = String(currentLevel + 1).padStart(2, '0');
            document.getElementById('lives-val').textContent = String(lives).padStart(2, '0');
            
            // Effects
            activeEffectsEl.innerHTML = '';
            effects.forEach(e => {
                const div = document.createElement('div');
                div.className = `effect-pill ${e.type}`;
                const timeLeft = Math.ceil((e.endTime - Date.now()) / 1000);
                div.innerHTML = `<span>${e.name}</span> <span>${timeLeft}s</span>`;
                activeEffectsEl.appendChild(div);
            });
        }

        function applyPowerUp(type) {
            SFX.powerup();
            if (type.letter === 'E') {
                effects = effects.filter(e => e.type !== 'E');
                effects.push({ type: 'E', name: 'EXPAND', endTime: Date.now() + 10000 });
            } else if (type.letter === 'S') {
                effects = effects.filter(e => e.type !== 'S');
                effects.push({ type: 'S', name: 'SLOW', endTime: Date.now() + 8000 });
            } else if (type.letter === 'M') {
                if (balls.length > 0) {
                    const b = balls[0];
                    for (let i = 0; i < 2; i++) {
                        const angle = Math.random() * Math.PI * 2;
                        const spd = Math.sqrt(b.dx * b.dx + b.dy * b.dy);
                        balls.push({
                            x: b.x, y: b.y, r: 5,
                            dx: Math.cos(angle) * spd,
                            dy: Math.min(-2, Math.sin(angle) * spd),
                            trail: []
                        });
                    }
                }
            } else if (type.letter === 'L') {
                lives++;
                updateHUD();
            } else if (type.letter === 'C') {
                effects = effects.filter(e => e.type !== 'C');
                effects.push({ type: 'C', name: 'CATCH', endTime: Date.now() + 12000 });
            }
        }

        function update() {
            if (shake > 0) shake *= 0.9;
            
            // Update Paddle
            let expand = effects.find(e => e.type === 'E');
            paddle.w = expand ? 150 : paddle.baseW;
            
            // Keyboard Movement
            if (keys['ArrowLeft'] || keys['a']) paddle.x -= paddle.speed;
            if (keys['ArrowRight'] || keys['d']) paddle.x += paddle.speed;
            paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
            
            if (state !== 'playing' && state !== 'ready') return;

            // Effects Cleanup
            const now = Date.now();
            const oldLen = effects.length;
            effects = effects.filter(e => e.endTime > now);
            if (effects.length !== oldLen) updateHUD();

            if (state === 'playing') {
                const slow = effects.some(e => e.type === 'S');
                const catchMode = effects.some(e => e.type === 'C');

                for (let i = balls.length - 1; i >= 0; i--) {
                    const b = balls[i];
                    
                    // Trail
                    b.trail.push({x: b.x, y: b.y});
                    if (b.trail.length > 10) b.trail.shift();

                    const spdMult = slow ? 0.6 : 1.0;
                    b.x += b.dx * spdMult;
                    b.y += b.dy * spdMult;

                    // Walls
                    if (b.x - b.r < 0) { b.x = b.r; b.dx *= -1; SFX.wall(); }
                    if (b.x + b.r > W) { b.x = W - b.r; b.dx *= -1; SFX.wall(); }
                    if (b.y - b.r < 0) { b.y = b.r; b.dy *= -1; SFX.wall(); }

                    // Paddle
                    if (b.dy > 0 && b.y + b.r > paddle.y && b.y - b.r < paddle.y + paddle.h &&
                        b.x > paddle.x && b.x < paddle.x + paddle.w) {
                        
                        if (catchMode) {
                            stickyBalls.push({ offsetX: b.x - (paddle.x + paddle.w / 2) });
                            balls.splice(i, 1);
                            SFX.paddle();
                            continue;
                        }

                        const hitPos = (b.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
                        const angle = hitPos * (Math.PI / 3);
                        const speed = Math.sqrt(b.dx * b.dx + b.dy * b.dy);
                        b.dx = speed * Math.sin(angle);
                        b.dy = -speed * Math.cos(angle);
                        b.y = paddle.y - b.r;
                        SFX.paddle();
                    }

                    // Bricks
                    for (const br of bricks) {
                        if (!br.alive) continue;
                        if (b.x + b.r > br.x && b.x - b.r < br.x + br.w &&
                            b.y + b.r > br.y && b.y - b.r < br.y + br.h) {
                            
                            if (br.type !== 'I') {
                                br.hits--;
                                if (br.hits <= 0) {
                                    br.alive = false;
                                    score += 10;
                                    shake = 5;
                                    updateHUD();
                                    SFX.brick(440 + br.y);
                                    
                                    // Powerup?
                                    if (Math.random() < 0.15) {
                                        powerUps.push({
                                            x: br.x + br.w/2, y: br.y + br.h/2,
                                            type: PU_TYPES[Math.floor(Math.random() * PU_TYPES.length)]
                                        });
                                    }
                                } else {
                                    SFX.hardBrick();
                                }
                            } else {
                                SFX.wall();
                            }

                            // Reflect
                            const dl = Math.abs((b.x + b.r) - br.x);
                            const dr = Math.abs((br.x + br.w) - (b.x - b.r));
                            const dt = Math.abs((b.y + b.r) - br.y);
                            const db = Math.abs((br.y + br.h) - (b.y - b.r));
                            const min = Math.min(dl, dr, dt, db);

                            if (min === dt || min === db) b.dy *= -1;
                            else b.dx *= -1;
                            
                            // Particles
                            for(let p=0; p<8; p++) particles.push(createParticle(b.x, b.y, br.color));
                            
                            break;
                        }
                    }

                    // Death
                    if (b.y > H + 20) {
                        balls.splice(i, 1);
                    }
                }

                // Powerups
                for (let i = powerUps.length - 1; i >= 0; i--) {
                    const p = powerUps[i];
                    p.y += 2;
                    if (p.y > paddle.y && p.y < paddle.y + paddle.h &&
                        p.x > paddle.x && p.x < paddle.x + paddle.w) {
                        applyPowerUp(p.type);
                        powerUps.splice(i, 1);
                    } else if (p.y > H) {
                        powerUps.splice(i, 1);
                    }
                }

                // Win check
                if (bricks.every(br => !br.alive || br.type === 'I')) {
                    currentLevel++;
                    SFX.win();
                    loadLevel(currentLevel);
                    state = 'ready';
                }

                // Lose check
                if (balls.length === 0 && stickyBalls.length === 0) {
                    lives--;
                    updateHUD();
                    if (lives <= 0) {
                        gameOver();
                    } else {
                        SFX.lose();
                        resetRound();
                        state = 'ready';
                    }
                }
            }

            // Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.dx;
                p.y += p.dy;
                p.life -= p.decay;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, W, H);

            ctx.save();
            if (shake > 0) {
                ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
            }

            // Bricks
            bricks.forEach(br => {
                if (!br.alive) return;
                ctx.shadowBlur = 15;
                ctx.shadowColor = br.color;
                ctx.fillStyle = br.color;
                if (br.type === 'H' && br.hits === 1) ctx.globalAlpha = 0.5;
                ctx.fillRect(br.x, br.y, br.w, br.h);
                ctx.globalAlpha = 1.0;
                ctx.shadowBlur = 0;
                
                // Bevel
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.fillRect(br.x, br.y, br.w, 2);
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.fillRect(br.x, br.y + br.h - 2, br.w, 2);
            });

            // Paddle
            ctx.shadowBlur = 20;
            ctx.shadowColor = varColor('--primary');
            ctx.fillStyle = effects.some(e => e.type === 'C') ? '#e08040' : '#fff';
            ctx.beginPath();
            ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 6);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Powerups
            powerUps.forEach(p => {
                ctx.fillStyle = p.type.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = p.type.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#000';
                ctx.font = 'bold 10px Outfit';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(p.type.letter, p.x, p.y);
                ctx.shadowBlur = 0;
            });

            // Balls
            balls.forEach(b => {
                // Trail
                b.trail.forEach((t, i) => {
                    ctx.globalAlpha = i / b.trail.length * 0.5;
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(t.x, t.y, b.r * (i / b.trail.length), 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.globalAlpha = 1.0;

                ctx.shadowBlur = 15;
                ctx.shadowColor = '#fff';
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            // Sticky Balls
            stickyBalls.forEach(sb => {
                const bx = paddle.x + paddle.w/2 + sb.offsetX;
                const by = paddle.y - 8;
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(bx, by, 5, 0, Math.PI * 2);
                ctx.fill();
            });

            // Particles
            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            });
            ctx.globalAlpha = 1.0;

            ctx.restore();
        }

        function varColor(name) {
            return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
        }

        function gameOver() {
            state = 'gameover';
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('breakout_hi_pro', highScore);
            }
            document.getElementById('overlay-title').textContent = 'GAME OVER';
            document.getElementById('overlay-sub').textContent = 'Try again?';
            document.getElementById('hi-score-val').textContent = highScore;
            overlay.classList.remove('hidden');
        }

        function winGame() {
            state = 'win';
            document.getElementById('overlay-title').textContent = 'YOU WIN';
            document.getElementById('overlay-sub').textContent = 'Amazing work!';
            overlay.classList.remove('hidden');
            SFX.win();
        }

        function handleStartClick() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            overlay.classList.add('hidden');
            if (state === 'gameover' || state === 'win') {
                init();
            }
            state = 'ready';
            if (!running) {
                running = true;
                requestAnimationFrame(loop);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // Input
        window.addEventListener('keydown', e => {
            keys[e.key] = true;
            if (e.key === ' ' || e.key === 'Spacebar') {
                e.preventDefault();
                if (overlay.classList.contains('hidden')) {
                    handleAction();
                } else {
                    handleStartClick();
                }
            }
        });
        window.addEventListener('keyup', e => keys[e.key] = false);
        window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
        document.addEventListener('visibilitychange', () => { if (document.hidden) for(const k in keys)keys[k]=false });

        canvas.addEventListener('mousemove', e => {
            const rect = canvas.getBoundingClientRect();
            const mx = (e.clientX - rect.left) * (W / rect.width);
            paddle.x = mx - paddle.w / 2;
            paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
        });

        canvas.addEventListener('click', () => {
            if (overlay.classList.contains('hidden')) {
                handleAction();
            } else {
                handleStartClick();
            }
        });

        function handleAction() {
            if (state === 'ready') {
                state = 'playing';
                launchBall();
            } else if (state === 'playing' && stickyBalls.length > 0) {
                launchBall();
            }
        }

        init();
        draw(); // Initial draw
    </script>
</body>

</html>
