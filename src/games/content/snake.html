<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snake</title>
<style>
:root{
  --paper:#f6f5f0;
  --ink:#22221e;
  --muted:#7b7669;
  --hair:#d9d5c9;
  --green:#3f6b45;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ui:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--paper);
  color:var(--ink);
  font:14px/1.45 var(--ui);
  overflow-x:hidden;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:1px solid var(--ink);outline-offset:3px}

header{
  max-width:760px;margin:0 auto;padding:14px 16px;
  display:flex;align-items:center;gap:20px;flex-wrap:wrap;
  border-bottom:1px solid var(--hair);
}
h1{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.hud{display:flex;gap:16px;font-family:var(--mono);font-size:12px;color:var(--muted);margin-right:auto}
.hud .v{color:var(--ink);font-variant-numeric:tabular-nums;margin-left:4px}
.stat.bump .v{color:var(--green)}
.tools{display:flex;gap:14px}
.tools button{
  font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);padding:1px 0;
}
.tools button:hover{color:var(--ink)}
.tools button.on{color:var(--ink)}
.tools button.on::before{content:"\2022";margin-right:4px}

main{max-width:760px;margin:0 auto;padding:18px 16px 26px;display:flex;flex-direction:column;align-items:center;gap:12px}
.board{
  position:relative;
  width:min(70dvh, 100%, 520px);
  aspect-ratio:1/1;
  border:1px solid var(--hair);
  background:#efeee7;
  overflow:hidden;
  touch-action:none;
}
canvas{display:block;width:100%;height:100%}
canvas.dim{opacity:.4}

.veil{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:rgba(246,245,240,.94);
  opacity:0;pointer-events:none;
  transition:opacity .1s linear;
}
.veil.show{opacity:1;pointer-events:auto}
.card{border:1px solid var(--hair);background:var(--paper);padding:18px 20px;text-align:center;max-width:280px}
.card h2{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.card .lead{font-size:12px;color:var(--muted);margin-top:6px}
.card .final{font-family:var(--mono);font-size:30px;line-height:1.1;margin-top:10px}
.card .sub{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px}
.pill{
  display:inline-block;margin-top:14px;
  font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  border-bottom:1px solid var(--ink);padding-bottom:2px;
}
.hint{font-size:12px;color:var(--muted);text-align:center;max-width:44ch}
.hint b{color:var(--ink);font-weight:600}

.dpad{display:none}
@media (max-width:700px){
  header{gap:12px}
  .hud{order:3;width:100%;gap:14px}
  .tools{margin-left:auto}
  .dpad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,40px);gap:6px}
  .dbtn{border:1px solid var(--hair);display:flex;align-items:center;justify-content:center;color:var(--muted)}
  .dbtn:active{background:var(--hair)}
  .dbtn svg{width:18px;height:18px}
  .dbtn.up{grid-column:2;grid-row:1}
  .dbtn.left{grid-column:1;grid-row:2}
  .dbtn.down{grid-column:2;grid-row:2}
  .dbtn.right{grid-column:3;grid-row:2}
}
</style>
</head>
<body>
<header>
  <h1>Snake</h1>
  <div class="hud">
    <span class="stat" id="scoreChip">score<span class="v" id="scoreValue">0</span></span>
    <span class="stat">best<span class="v" id="bestValue">0</span></span>
    <span class="stat">len<span class="v" id="lengthValue">3</span></span>
  </div>
  <div class="tools">
    <button id="soundBtn" title="Sound">sound</button>
    <button id="motionBtn" title="Motion">motion</button>
    <button id="pauseBtn" title="Pause">pause</button>
    <button id="resetBtn" title="Restart">restart</button>
  </div>
</header>

<main>
  <div class="board" id="board">
    <canvas id="canvas" role="img" aria-label="Snake board, 20 by 20 cells"></canvas>

    <div class="veil show" id="startVeil">
      <div class="card">
        <h2>Press an arrow</h2>
        <p class="lead">or WASD. Eat, grow, don&rsquo;t bite yourself.</p>
      </div>
    </div>

    <div class="veil" id="pauseVeil">
      <div class="card">
        <h2>Paused</h2>
        <button class="pill" id="resumeBtn">resume</button>
      </div>
    </div>

    <div class="veil" id="overVeil">
      <div class="card">
        <h2>Dead</h2>
        <div class="final" id="finalScore">0</div>
        <div class="sub" id="finalSub">best 0</div>
        <button class="pill" id="playAgain">again</button>
      </div>
    </div>
  </div>

  <p class="hint"><b>space</b> pause &middot; <b>r</b> restart</p>

  <div class="dpad" aria-label="Direction controls">
    <button class="dbtn up" data-dir="up" aria-label="Move up">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="5,12 10,7 15,12"/></svg>
    </button>
    <button class="dbtn left" data-dir="left" aria-label="Move left">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="12,5 7,10 12,15"/></svg>
    </button>
    <button class="dbtn down" data-dir="down" aria-label="Move down">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="5,8 10,13 15,8"/></svg>
    </button>
    <button class="dbtn right" data-dir="right" aria-label="Move right">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="8,5 13,10 8,15"/></svg>
    </button>
  </div>
</main>


<div class="sr-only" aria-live="polite" id="live"></div>
<div class="sr-only" id="boardDesc"></div>

<script>
(function () {
  "use strict";

  /* ================================================================
     CONSTANTS
  ================================================================ */
  var COLS = 20, ROWS = 20;
  var BASE_STEP = 110;          // ms per move — the pace is the same all run
  var LAUNCH_MS = 520;
  var RING_MS = 240;
  var OVER_MS = 260;

  var COL = {
    field: "#EEECE5",
    grid: "#E2DFD5",
    gridMajor: "#D3CFC5",
    body: "#3F6B45",
    bodyEdge: "#2E5236",
    head: "#3F6B45",
    apple: "#A4402F",
    appleShine: "#C0674F",
    leaf: "#3F6B45",
    stem: "#2E5236",
    eyeWhite: "#FBFAF6",
    pupil: "#1D1D1B"
  };

  /* ================================================================
     DOM
  ================================================================ */
  var $ = function (id) { return document.getElementById(id); };
  var canvas = $("canvas");
  var ctx = canvas.getContext("2d");
  var board = $("board");

  var elScore = $("scoreValue"), elBest = $("bestValue");
  var elLength = $("lengthValue");
  var elScoreChip = $("scoreChip");
  var elLive = $("live"), elBoardDesc = $("boardDesc");
  var elStartVeil = $("startVeil"), elPauseVeil = $("pauseVeil"), elOverVeil = $("overVeil");
  var elFinalScore = $("finalScore"), elFinalSub = $("finalSub");
  var elPauseBtn = $("pauseBtn");

  /* ================================================================
     STATE
  ================================================================ */
  var state = "ready";            // ready | running | paused | over
  var snake = [];
  var dir = { x: 1, y: 0 };
  var turns = [];                 // buffered turns, oldest first (see queueDir)
  var apple = { x: 14, y: 10 };
  var score = 0;
  var stepMs = BASE_STEP;

  var lastTime = 0;
  var acc = 0;

  var launch = { on: false, t0: 0 };
  var ring = { on: false, t0: 0, x: 0, y: 0 };
  var applePop = { on: false, t0: 0 };
  var overFx = { on: false, t0: 0 };

  var motionOn = true;
  var soundOn = false;
  var best = loadBest();

  /* ================================================================
     STORAGE
  ================================================================ */
  function loadBest() {
    try {
      var v = window.localStorage.getItem("snake.bestScore");
      var n = v === null ? 0 : parseInt(v, 10);
      return isNaN(n) ? 0 : n;
    } catch (e) { return 0; }
  }
  function saveBest() {
    try { window.localStorage.setItem("snake.bestScore", String(best)); }
    catch (e) { /* storage blocked — keep it in memory */ }
  }

  /* ================================================================
     SOUND
  ================================================================ */
  var actx = null;
  function tone(freq, dur, gain, type) {
    if (!soundOn) return;
    try {
      if (!actx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        actx = new AC();
      }
      if (actx.state === "suspended") actx.resume();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || "triangle";
      o.frequency.value = freq;
      g.gain.value = gain || 0.05;
      o.connect(g); g.connect(actx.destination);
      var t = actx.currentTime;
      g.gain.setValueAtTime(g.gain.value, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.start(t); o.stop(t + dur + 0.03);
    } catch (e) { /* audio unavailable */ }
  }

  /* ================================================================
     CANVAS
  ================================================================ */
  var size = 0, cell = 0, dpr = 1;

  function resize() {
    var r = canvas.getBoundingClientRect();
    if (!r.width) return;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    size = r.width;
    canvas.width = Math.round(r.width * dpr);
    canvas.height = Math.round(r.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cell = size / COLS;
    render();
  }

  if (typeof ResizeObserver !== "undefined") new ResizeObserver(resize).observe(canvas);
  window.addEventListener("resize", resize);

  /* ================================================================
     RENDER
  ================================================================ */
  function render() {
    if (!size) return;
    var now = performance.now();

    ctx.fillStyle = COL.field;
    ctx.fillRect(0, 0, size, size);

    drawGrid();
    drawApple(now);
    drawRing(now);
    drawLaunch(now);
    drawSnake(now);
  }

  function drawGrid() {
    var i, p;
    for (i = 1; i < COLS; i++) {
      var major = (i % 5 === 0);
      ctx.strokeStyle = major ? COL.gridMajor : COL.grid;
      ctx.lineWidth = 1;
      p = Math.round(i * cell) + 0.5;
      ctx.beginPath(); ctx.moveTo(p, 0); ctx.lineTo(p, size); ctx.stroke();
    }
    for (i = 1; i < ROWS; i++) {
      var maj = (i % 5 === 0);
      ctx.strokeStyle = maj ? COL.gridMajor : COL.grid;
      ctx.lineWidth = 1;
      p = Math.round(i * cell) + 0.5;
      ctx.beginPath(); ctx.moveTo(0, p); ctx.lineTo(size, p); ctx.stroke();
    }
  }

  function drawApple(now) {
    var scale = 1;
    if (applePop.on) {
      var p = (now - applePop.t0) / 180;
      if (p >= 1) applePop.on = false;
      else scale = 0.55 + 0.45 * easeOut(p);
    }

    var cx = (apple.x + 0.5) * cell;
    var cy = (apple.y + 0.5) * cell;
    var r = cell * 0.30 * scale;

    // body
    ctx.fillStyle = COL.apple;
    ctx.beginPath();
    ctx.arc(cx, cy + r * 0.08, r, 0, Math.PI * 2);
    ctx.fill();

    // shine
    ctx.fillStyle = COL.appleShine;
    ctx.beginPath();
    ctx.arc(cx - r * 0.34, cy - r * 0.28, r * 0.22, 0, Math.PI * 2);
    ctx.fill();

    // stem
    ctx.strokeStyle = COL.stem;
    ctx.lineWidth = Math.max(1.5, cell * 0.06);
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(cx, cy - r * 0.78);
    ctx.lineTo(cx + r * 0.16, cy - r * 1.35);
    ctx.stroke();

    // leaf
    ctx.fillStyle = COL.leaf;
    ctx.save();
    ctx.translate(cx + r * 0.5, cy - r * 1.12);
    ctx.rotate(-0.5);
    ctx.beginPath();
    ctx.ellipse(0, 0, r * 0.42, r * 0.2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    ctx.lineCap = "butt";
  }

  function drawRing(now) {
    if (!ring.on || !motionOn) return;
    var p = (now - ring.t0) / RING_MS;
    if (p >= 1) { ring.on = false; return; }
    var e = easeOut(p);
    var cx = (ring.x + 0.5) * cell;
    var cy = (ring.y + 0.5) * cell;
    ctx.strokeStyle = "rgba(63,107,69," + (0.55 * (1 - e)).toFixed(3) + ")";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(cx, cy, cell * 0.32 + cell * 0.55 * e, 0, Math.PI * 2);
    ctx.stroke();
  }

  function drawLaunch(now) {
    if (!launch.on) return;
    if (!motionOn) { launch.on = false; return; }
    var p = (now - launch.t0) / LAUNCH_MS;
    if (p >= 1) { launch.on = false; return; }

    var e = easeOut(p);
    var y = 10 * cell;
    var head = size * e;

    var grad = ctx.createLinearGradient(0, 0, Math.max(1, head), 0);
    grad.addColorStop(0, "rgba(63,107,69,0)");
    grad.addColorStop(0.55, "rgba(63,107,69," + (0.22 * (1 - p)).toFixed(3) + ")");
    grad.addColorStop(1, "rgba(63,107,69," + (0.34 * (1 - p)).toFixed(3) + ")");

    ctx.fillStyle = grad;
    roundRect(0, y + cell * 0.12, Math.max(0, head), cell * 0.76, cell * 0.32);
    ctx.fill();
  }

  function drawSnake(now) {
    if (!snake.length) return;

    // body — back to front
    for (var i = snake.length - 1; i >= 1; i--) {
      var s = snake[i];
      var cx = (s.x + 0.5) * cell;
      var cy = (s.y + 0.5) * cell;
      var b = cell * 0.86;
      roundRect(cx - b / 2, cy - b / 2, b, b, b * 0.32);
      ctx.fillStyle = COL.body;
      ctx.fill();
      ctx.lineWidth = 1;
      ctx.strokeStyle = "rgba(46,82,54,0.35)";
      ctx.stroke();
    }

    // head
    var h = snake[0];
    var hx = (h.x + 0.5) * cell;
    var hy = (h.y + 0.5) * cell;
    var scale = 1;
    if (overFx.on && motionOn) {
      var p = (now - overFx.t0) / OVER_MS;
      if (p < 1) scale = 1 - 0.22 * easeOut(p);
    }
    var d = cell * 0.94 * scale;
    roundRect(hx - d / 2, hy - d / 2, d, d, d * 0.32);
    ctx.fillStyle = COL.head;
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = COL.bodyEdge;
    ctx.stroke();

    // eyes
    var perpX = -dir.y, perpY = dir.x;
    var fwd = cell * 0.16 * scale;
    var spread = cell * 0.19 * scale;
    var er = Math.max(2, cell * 0.13 * scale);
    var pr = Math.max(1, cell * 0.065 * scale);

    drawEye(hx + dir.x * fwd + perpX * spread, hy + dir.y * fwd + perpY * spread, er, pr);
    drawEye(hx + dir.x * fwd - perpX * spread, hy + dir.y * fwd - perpY * spread, er, pr);
  }

  function drawEye(x, y, er, pr) {
    ctx.fillStyle = COL.eyeWhite;
    ctx.beginPath(); ctx.arc(x, y, er, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = COL.pupil;
    ctx.beginPath();
    ctx.arc(x + dir.x * er * 0.32, y + dir.y * er * 0.32, pr, 0, Math.PI * 2);
    ctx.fill();
  }

  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function easeOut(p) { return 1 - Math.pow(1 - p, 3); }

  /* ================================================================
     APPLE PLACEMENT
  ================================================================ */
  var seed = 0x9e3779b9 >>> 0;
  function rnd() {
    seed = (seed * 1664525 + 1013904223) >>> 0;
    return seed / 4294967296;
  }
  function placeApple() {
    var taken = {}, i;
    for (i = 0; i < snake.length; i++) taken[snake[i].x + "," + snake[i].y] = true;
    var free = [];
    for (var y = 0; y < ROWS; y++) {
      for (var x = 0; x < COLS; x++) {
        if (!taken[x + "," + y]) free.push({ x: x, y: y });
      }
    }
    if (!free.length) { gameOver(); return; }
    var pick = free[Math.floor(rnd() * free.length)];
    apple.x = pick.x; apple.y = pick.y;
    applePop.on = motionOn;
    applePop.t0 = performance.now();
  }

  /* ================================================================
     SIMULATION
  ================================================================ */
  function tick() {
    if (turns.length) {
      var next = turns.shift();
      if (!(next.x === -dir.x && next.y === -dir.y)) dir = next;
    }

    var head = snake[0];
    var nx = head.x + dir.x;
    var ny = head.y + dir.y;

    if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) { gameOver(); return; }

    var grows = (nx === apple.x && ny === apple.y);
    var limit = grows ? snake.length : snake.length - 1;
    for (var i = 0; i < limit; i++) {
      if (snake[i].x === nx && snake[i].y === ny) { gameOver(); return; }
    }

    snake.unshift({ x: nx, y: ny });

    if (grows) {
      score += 1;
      onEat();
      placeApple();
    } else {
      snake.pop();
    }
  }

  /* ================================================================
     LOOP — fixed step, always scheduled
  ================================================================ */
  function frame(now) {
    if (!lastTime) lastTime = now;
    var dt = now - lastTime;
    lastTime = now;
    if (dt > 250) dt = 250;

    if (state === "running") {
      acc += dt;
      var guard = 0;
      while (acc >= stepMs && guard < 8) {
        acc -= stepMs;
        guard++;
        tick();
        if (state !== "running") { acc = 0; break; }
      }
    }

    render();
    requestAnimationFrame(frame);
  }

  /* ================================================================
     STATE TRANSITIONS
  ================================================================ */
  function startGame() {
    if (state === "running") return;
    if (state === "over" || state === "ready") {
      if (state === "ready") {
        // dormant specimen pops out to its first playable length
        snake = [
          { x: 3, y: 10 }, { x: 2, y: 10 }, { x: 1, y: 10 }, { x: 0, y: 10 }
        ];
      }
    }
    state = "running";
    turns = [];
    acc = 0;
    lastTime = performance.now();
    launch.on = motionOn;
    launch.t0 = performance.now();
    hideVeils();
    canvas.classList.remove("dim");
    syncUI();
    announce("Game started. Score zero.");
  }

  function resetGame() {
    snake = [{ x: 3, y: 10 }, { x: 2, y: 10 }, { x: 1, y: 10 }];
    dir = { x: 1, y: 0 };
    turns = [];
    score = 0;
    stepMs = BASE_STEP;
    state = "ready";
    acc = 0;
    seed = 0x9e3779b9 >>> 0;
    apple = { x: 14, y: 10 };
    launch.on = ring.on = applePop.on = overFx.on = false;

    elStartVeil.classList.add("show");
    elPauseVeil.classList.remove("show");
    elOverVeil.classList.remove("show");
    canvas.classList.remove("dim");

    syncUI();
    updateDesc();
    announce("Game reset. Ready to play.");
  }

  function togglePause() {
    if (state === "running") {
      state = "paused";
      elPauseVeil.classList.add("show");
      canvas.classList.add("dim");
      syncUI();
      announce("Paused.");
    } else if (state === "paused") {
      state = "running";
      acc = 0;
      lastTime = performance.now();
      elPauseVeil.classList.remove("show");
      canvas.classList.remove("dim");
      syncUI();
      announce("Resumed.");
    }
  }

  function gameOver() {
    state = "over";
    turns = [];
    overFx.on = motionOn;
    overFx.t0 = performance.now();

    var isNewBest = score > best;
    if (isNewBest) { best = score; saveBest(); }

    elFinalScore.textContent = String(score);
    elFinalSub.textContent = isNewBest
      ? "New best score!"
      : "Best score " + best;

    elOverVeil.classList.add("show");
    canvas.classList.add("dim");

    tone(320, 0.14, 0.05, "triangle");
    setTimeout(function () { tone(220, 0.18, 0.05, "triangle"); }, 110);
    setTimeout(function () { tone(150, 0.28, 0.045, "triangle"); }, 220);

    syncUI();
    updateDesc();
    announce("Game over. Final score " + score + ". " + elFinalSub.textContent + ". Press Enter or Play again.");
  }

  function onEat() {
    ring.on = motionOn;
    ring.t0 = performance.now();
    ring.x = snake[0].x;
    ring.y = snake[0].y;

    elScore.textContent = String(score);
    if (motionOn) {
      elScoreChip.classList.remove("bump");
      void elScoreChip.offsetWidth;
      elScoreChip.classList.add("bump");
      setTimeout(function () { elScoreChip.classList.remove("bump"); }, 200);
    }

    tone(620, 0.07, 0.05, "triangle");
    setTimeout(function () { tone(820, 0.08, 0.04, "triangle"); }, 55);

    announce("Apple eaten. Score " + score + ".");
    updateDesc();
    syncUI();
  }

  /* ================================================================
     UI SYNC
  ================================================================ */
  function syncUI() {
    elScore.textContent = String(score);
    elBest.textContent = String(Math.max(best, score));
    elLength.textContent = String(snake.length);

    if (state === "paused") {
      elPauseBtn.title = "Resume";
      elPauseBtn.setAttribute("aria-label", "Resume");
      elPauseBtn.textContent = "resume";
    } else {
      elPauseBtn.title = "Pause";
      elPauseBtn.setAttribute("aria-label", "Pause");
      elPauseBtn.textContent = "pause";
    }
  }

  function announce(msg) { elLive.textContent = msg; }

  function updateDesc() {
    var lookup = {}, i;
    for (i = 0; i < snake.length; i++) lookup[snake[i].x + "," + snake[i].y] = i === 0 ? "H" : "#";
    lookup[apple.x + "," + apple.y] = "O";
    var lines = [];
    for (var y = 0; y < ROWS; y++) {
      var row = "";
      for (var x = 0; x < COLS; x++) row += (lookup[x + "," + y] || ".") + " ";
      lines.push(row);
    }
    var h = snake[0];
    elBoardDesc.textContent =
      "Board: " + state + ". Snake head row " + (h.y + 1) + " column " + (h.x + 1) +
      ", length " + snake.length + ". Apple row " + (apple.y + 1) + " column " + (apple.x + 1) +
      ". Matrix where H is head, hash is body, O is apple, dot is empty: " + lines.join(" ");
  }

  function hideVeils() {
    elStartVeil.classList.remove("show");
    elPauseVeil.classList.remove("show");
    elOverVeil.classList.remove("show");
  }

  /* ================================================================
     INPUT — one global listener, a short queue of turns
  ================================================================ */
  var DIRS = {
    up: { x: 0, y: -1 }, down: { x: 0, y: 1 },
    left: { x: -1, y: 0 }, right: { x: 1, y: 0 }
  };
  // Two is enough to double back (up then left while travelling right) and to
  // set up a corner without the snake dancing to keys pressed a second ago.
  var QUEUE_MAX = 2;
  var KEYMAP = {
    arrowup: "up", arrowdown: "down", arrowleft: "left", arrowright: "right",
    w: "up", s: "down", a: "left", d: "right"
  };

  function queueDir(name) {
    var nd = DIRS[name];
    if (!nd) return;

    if (state === "ready") {
      if (!(nd.x === -dir.x && nd.y === -dir.y)) dir = nd;
      startGame();
      return;
    }
    if (state === "over") return;
    if (state === "paused") return;

    // Judge the press against the last turn already waiting, not against the
    // direction on screen. Pressing up then left while heading right used to
    // overwrite the up with the left, which then looked like a reversal and was
    // dropped, so the snake sailed on. Buffered, both turns happen in order.
    var last = turns.length ? turns[turns.length - 1] : dir;
    if (nd.x === -last.x && nd.y === -last.y) return;       // no reversal
    if (nd.x === last.x && nd.y === last.y) return;         // no duplicate
    if (turns.length < QUEUE_MAX) turns.push(nd);
  }

  window.addEventListener("keydown", function (e) {
    var key = (e.key || "").toLowerCase();
    var name = KEYMAP[key];

    if (name) {
      e.preventDefault();
      if (e.repeat) return;
      queueDir(name);
      return;
    }
    if (key === " " || key === "spacebar") {
      e.preventDefault();
      if (e.repeat) return;
      if (state === "ready") { startGame(); return; }
      if (state === "running" || state === "paused") togglePause();
      return;
    }
    if (key === "enter") {
      e.preventDefault();
      if (state === "over") { resetGame(); startGame(); }
      return;
    }
    if (key === "r") {
      e.preventDefault();
      if (e.repeat) return;
      resetGame();
    }
  }, { passive: false });

  /* D-pad */
  Array.prototype.forEach.call(document.querySelectorAll(".dbtn"), function (b) {
    var go = function (e) {
      if (e && e.cancelable) e.preventDefault();
      queueDir(b.getAttribute("data-dir"));
    };
    b.addEventListener("click", go);
    b.addEventListener("touchstart", go, { passive: false });
  });

  /* swipe */
  var tStart = null;
  board.addEventListener("touchstart", function (e) {
    if (e.touches.length !== 1) return;
    tStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });

  board.addEventListener("touchmove", function (e) {
    if (!tStart || e.touches.length !== 1) return;
    var dx = e.touches[0].clientX - tStart.x;
    var dy = e.touches[0].clientY - tStart.y;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) queueDir(dx > 0 ? "right" : "left");
    else queueDir(dy > 0 ? "down" : "up");
    tStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    e.preventDefault();
  }, { passive: false });

  board.addEventListener("touchend", function () { tStart = null; }, { passive: true });
  board.addEventListener("click", function () {
    if (state === "ready") startGame();
  });

  /* ================================================================
     CONTROLS
  ================================================================ */
  $("playAgain").addEventListener("click", function () {
    resetGame();
    startGame();
  });

  $("resumeBtn").addEventListener("click", togglePause);

  elPauseBtn.addEventListener("click", function () {
    if (state === "ready") { startGame(); return; }
    if (state === "over") return;
    togglePause();
  });

  $("resetBtn").addEventListener("click", function () {
    resetGame();
    startGame();
  });

  var soundBtn = $("soundBtn");
  soundBtn.addEventListener("click", function () {
    soundOn = !soundOn;
    soundBtn.classList.toggle("on", soundOn);
    soundBtn.title = soundOn ? "Sound on" : "Sound off";
    soundBtn.setAttribute("aria-label", soundOn ? "Sound on" : "Sound off");
    soundBtn.querySelectorAll(".wave").forEach(function (w) {
      w.style.opacity = soundOn ? "1" : "0.25";
    });
    if (soundOn) tone(660, 0.08, 0.05, "triangle");
  });
  soundBtn.querySelectorAll(".wave").forEach(function (w) { w.style.opacity = "0.25"; });

  var prefersReduced = false;
  try { prefersReduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches; }
  catch (e) { /* no matchMedia */ }

  motionOn = !prefersReduced;
  var motionBtn = $("motionBtn");
  motionBtn.classList.toggle("on", motionOn);
  motionBtn.title = motionOn ? "Motion on" : "Motion off";
  motionBtn.setAttribute("aria-label", motionOn ? "Motion on" : "Motion off");

  motionBtn.addEventListener("click", function () {
    motionOn = !motionOn;
    motionBtn.classList.toggle("on", motionOn);
    motionBtn.title = motionOn ? "Motion on" : "Motion off";
    motionBtn.setAttribute("aria-label", motionOn ? "Motion on" : "Motion off");
    if (!motionOn) {
      launch.on = ring.on = applePop.on = overFx.on = false;
    }
  });

  /* auto-pause when the tab loses focus */
  document.addEventListener("visibilitychange", function () {
    if (document.hidden && state === "running") togglePause();
  });

  /* Read-only: the browser suite checks the buffered turns here. */
  window.__snake = {
    dir: function () { return { x: dir.x, y: dir.y }; },
    turns: function () { return turns.length; }
  };

  /* ================================================================
     BOOT
  ================================================================ */
  snake = [{ x: 3, y: 10 }, { x: 2, y: 10 }, { x: 1, y: 10 }];
  syncUI();
  updateDesc();
  resize();
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
