<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Clicker</title>
<meta name="description" content="One click, one point. That is the whole game.">
<style>
  :root {
    --bg: #f5f2ea;
    --ink: #191713;
    --muted: #6b6558;
    --hair: #d8d2c4;
    --panel: #fffdf7;
    --sans: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 13px/1.45 var(--sans);
    display: grid;
    place-items: center;
    min-height: 100vh;
    padding: 16px;
    user-select: none;
    -webkit-user-select: none;
  }
  main { width: min(340px, 92vw); }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--hair);
  }
  h1 {
    font: 600 12px/1 var(--mono);
    letter-spacing: .14em;
    text-transform: uppercase;
  }
  #hud {
    font: 12px var(--mono);
    color: var(--muted);
    text-transform: lowercase;
    letter-spacing: .04em;
  }
  #hud b {
    font-weight: 400;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .buttons { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .click-button {
    display: block;
    width: 100%;
    margin: 22px 0 14px;
    padding: 60px 0;
    border: 1px solid var(--ink);
    border-radius: 4px;
    background: var(--panel);
    color: inherit;
    font: 12px var(--mono);
    letter-spacing: .12em;
    text-transform: uppercase;
    cursor: pointer;
    touch-action: manipulation;
  }
  .click-button:active { background: #f0ece1; }
  .click-button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .click-button.flash { animation: click-flash .18s ease-out; }
  @keyframes click-flash {
    from { background: #b23b2e; border-color: #b23b2e; color: #fffdf7; }
    to { background: var(--panel); border-color: var(--ink); color: var(--ink); }
  }
  p { text-align: center; font-size: 11.5px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Clicker</h1>
    <div id="hud" aria-live="off">points <b id="points">0</b></div>
  </header>
  <div class="buttons"><button id="click-a" class="click-button" type="button">Click</button><button id="click-b" class="click-button" type="button">Click</button></div>
  <p>One click, one point.</p>
</main>
<script>
const buttons = [document.getElementById('click-a'), document.getElementById('click-b')];
const pointsEl = document.getElementById('points');
const FLASH = 180;
let clicks = 0;
const buttonClicks = [0, 0];
const flashTimers = [0, 0];

buttons.forEach((button, index) => {
  button.addEventListener('click', () => {
    clicks += 1;
    buttonClicks[index] += 1;
    pointsEl.textContent = clicks;
    button.textContent = 'Clicked';
    button.classList.remove('flash');
    void button.offsetWidth;
    button.classList.add('flash');
    clearTimeout(flashTimers[index]);
    flashTimers[index] = setTimeout(() => {
      button.classList.remove('flash');
      button.textContent = 'Click';
    }, FLASH);
  });
});

// The hub reads this. The count is the score; there is no run to end.
window.__boredSnapshot = () => ({ slug: 'clicker', clicks: clicks, button_a: buttonClicks[0], button_b: buttonClicks[1], finished: false });
</script>
</body>
</html>
