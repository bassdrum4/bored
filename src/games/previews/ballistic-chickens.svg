<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Ballistic Chickens">
  <rect width="640" height="360" fill="#f4efe3"/>
  <g fill="none" stroke="#1b1a17" stroke-width="2.5" stroke-linejoin="round">
    <!-- ground -->
    <path d="M0 286h640" stroke-width="3"/>
    <path d="M40 286v14M118 286v14M206 286v14M292 286v14M382 286v14M470 286v14M556 286v14" stroke="#8e8672"/>
    <!-- fence, still standing -->
    <g stroke="#1b1a17" fill="#e8e0cd">
      <rect x="404" y="240" width="78" height="46"/>
      <path d="M404 256h78M404 271h78" fill="none"/>
    </g>
    <!-- house -->
    <g fill="#e8e0cd">
      <rect x="512" y="230" width="86" height="56"/>
      <path d="M506 230l49-32 49 32z"/>
    </g>
    <rect x="546" y="262" width="18" height="24" fill="#1b1a17" stroke="none"/>
    <!-- cannon -->
    <g fill="#1b1a17" stroke="none">
      <path d="M106 258l70-38 12 22-70 38z"/>
    </g>
    <path d="M96 286l28-34 26 34" fill="none"/>
    <ellipse cx="120" cy="288" rx="34" ry="10" fill="#dcd3c0"/>
    <!-- chicken in flight, rocket under her -->
    <g transform="translate(300 150) rotate(-24)">
      <g fill="#dcd3c0">
        <path d="M-10 20l10 14 10-14z"/>
      </g>
      <ellipse cx="0" cy="4" rx="24" ry="28" fill="#f4efe3"/>
      <ellipse cx="14" cy="6" rx="10" ry="16" fill="#dcd3c0" transform="rotate(18 14 6)"/>
      <circle cx="0" cy="-22" r="16" fill="#f4efe3"/>
      <path d="M-5 -36l3 -9 4 8 5 -8 2 9z" fill="#b4622f" stroke="none"/>
      <path d="M10 -22l16 5-16 5z" fill="#b4622f" stroke="none"/>
      <circle cx="7" cy="-26" r="2.6" fill="#1b1a17" stroke="none"/>
      <g transform="translate(0 34)">
        <path d="M-14 -14h22l10 14-10 14h-22l-8-14z" fill="#dcd3c0"/>
        <rect x="-14" y="-4" width="7" height="8" fill="#1b1a17" stroke="none"/>
        <path d="M-22 -7l-16 7 16 7z" fill="#b4622f" stroke="none"/>
      </g>
    </g>
    <!-- speed marks -->
    <g stroke="#8e8672" fill="none">
      <path d="M196 176l30-10M200 200l26-8M204 222l22-6"/>
    </g>
  </g>
  <g fill="#1b1a17" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" letter-spacing="1.5">
    <text x="20" y="34">14 M</text>
    <text x="620" y="34" text-anchor="end">$25</text>
  </g>
</svg>
