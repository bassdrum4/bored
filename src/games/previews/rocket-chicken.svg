<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Rocket Chicken gliding above the hills with a rocket burning under her wing">
  <!-- The board as the port draws it: cream sky, two bands of hills, a flat
       ground, and the chicken with the rocket she buys from the shop. -->
  <rect width="640" height="360" fill="#f1e8d2"/>

  <g fill="#fbf6e9">
    <ellipse cx="120" cy="70" rx="42" ry="12"/>
    <ellipse cx="146" cy="76" rx="26" ry="9"/>
    <ellipse cx="486" cy="52" rx="50" ry="13"/>
    <ellipse cx="516" cy="58" rx="30" ry="9"/>
    <ellipse cx="340" cy="120" rx="30" ry="8"/>
  </g>

  <g fill="#e2d6b8">
    <path d="M0 300 Q60 214 128 268 Q186 312 250 300 Z"/>
    <path d="M250 300 Q330 206 404 264 Q470 312 540 300 Z"/>
    <path d="M470 300 Q556 210 640 272 L640 300 Z"/>
  </g>
  <g fill="#c3b391">
    <path d="M-20 300 Q48 244 116 288 Q176 322 236 300 Z"/>
    <path d="M220 300 Q292 236 366 284 Q436 324 500 300 Z"/>
    <path d="M470 300 Q548 240 640 288 L640 300 Z"/>
  </g>

  <rect y="300" width="640" height="60" fill="#d6c8a5"/>
  <rect y="300" width="640" height="2" fill="#2b2620"/>

  <!-- A gem pickup in the air. -->
  <g transform="translate(292 132) rotate(-8)">
    <path d="M0 -17 L17 0 L0 17 L-17 0 Z" fill="#fffdf4" stroke="#bf5b3d" stroke-width="2"/>
    <text x="0" y="3" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" font-weight="600" fill="#bf5b3d">GEM</text>
  </g>

  <!-- The chicken, rocket lit. -->
  <g transform="translate(360 214) rotate(-14)" stroke="#2b2620" stroke-width="2.5">
    <path d="M-19 -2 L-40 -16 L-38 4 Z" fill="#fffdf4" stroke-linejoin="round"/>
    <rect x="-34" y="14" width="52" height="16" rx="2" fill="#8d9a8f"/>
    <path d="M-34 17 L-52 22 L-34 27 Z" fill="#bf5b3d"/>
    <circle cx="0" cy="0" r="26" fill="#fffdf4"/>
    <ellipse cx="-3" cy="5" rx="14" ry="9" fill="#fffdf4" transform="rotate(-10)"/>
    <circle cx="6" cy="-24" r="6" fill="#bf5b3d" stroke="none"/>
    <path d="M24 -4 L40 2 L24 9 Z" fill="#e2a23c" stroke-linejoin="round"/>
    <circle cx="11" cy="-8" r="3" fill="#2b2620" stroke="none"/>
    <path d="M-12 -20 A22 22 0 0 1 14 -19" fill="none" stroke="#bf5b3d" stroke-width="6"/>
    <rect x="-10" y="24" width="11" height="7" fill="#2b2620" stroke="none"/>
    <rect x="5" y="24" width="11" height="7" fill="#2b2620" stroke="none"/>
  </g>

  <g fill="#bf5b3d">
    <rect x="286" y="230" width="5" height="4"/>
    <rect x="274" y="238" width="4" height="4"/>
    <rect x="262" y="228" width="4" height="3"/>
  </g>
</svg>
