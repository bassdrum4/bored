<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f2ea">
<title>Wrong turn. Bored.</title>
<style>
  :root{color-scheme:light;--paper:#f5f2ea;--ink:#191713;--dim:#6b6558;--red:#b3261e}
  html[data-theme="dark"]{color-scheme:dark;--paper:#17150f;--ink:#ece6d8;--dim:#a39b8a;--red:#d97a6b}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font:17px/1.5 Georgia,"Times New Roman",serif}
  main{max-width:420px;padding:32px 24px}
  .bo{display:block;width:56px;height:56px;margin-bottom:16px}
  h1{margin:0 0 12px;font-size:72px;font-weight:700;line-height:1;letter-spacing:-.04em}
  h1 span{color:var(--red)}
  p{margin:0 0 20px;font-style:italic;color:var(--dim)}
  a{display:inline-block;padding:12px 18px;background:var(--ink);color:var(--paper);font:12px ui-monospace,"Cascadia Mono",Consolas,monospace;text-decoration:none}
  a:hover,a:focus-visible{background:var(--red);color:var(--paper);outline:none}
</style>
<script>
// Set a saved dark theme before first paint, so it never flashes paper.
try {
  const saved = JSON.parse(localStorage.getItem('bored.ui.preferences') || '{}');
  if (saved && saved.theme === 'dark') {
    document.documentElement.dataset.theme = 'dark';
    document.documentElement.style.colorScheme = 'dark';
    document.querySelector('meta[name="theme-color"]').content = '#17150f';
  }
} catch (error) {}
</script>
</head>
<body>
<main>
  <!-- Absolute path: a 404 can be served from any depth under /bored/. -->
  <svg class="bo" viewBox="0 0 48 48" aria-hidden="true" focusable="false"><use href="/bored/bo.svg#shrug"/></svg>
  <h1>404<span>.</span></h1>
  <p>That page does not exist. Honestly, neither does your free period.</p>
  <a href="/bored/">Back to the games</a>
</main>
</body>
</html>
